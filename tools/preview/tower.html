<!doctype html>
<html lang="en">
  <head>

    <title>Last Lookout: world preview</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0a0e; font: 12px/1.4 monospace; color: #d8d0c0; }

    <div id="app"></div>
    <div id="hud"></div>
