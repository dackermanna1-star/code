<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last Lookout — UI preview</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0a0e; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  #panel { position: fixed; left: 8px; top: 50%; transform: translateY(-50%); z-index: 100; width: 230px; max-height: 92vh; overflow: auto;
    background: rgba(8,9,6,.88); border: 1px solid #3a3d28; padding: 8px; font: 11px/1.3 ui-monospace, Menlo, monospace; color: #cfc6a4; }
  #panel h3 { margin: 8px 0 4px; font-size: 11px; color: #ffb43a; letter-spacing: 1px; }
  #panel button { font: inherit; margin: 2px; padding: 3px 6px; background: #23261a; color: #e8dcc0; border: 1px solid #4a4e30; cursor: pointer; }
  #panel button:hover { background: #373b24; }
  #panel .on { background: #ffb43a; color: #111; }
  #panel.hidden { display: none; }
</style>
</head>
<body>
<div id="app"></div>
<div id="panel"></div>
<script type="module" src="./ui.js"></script>
</body>
</html>
