<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>HALLOWELL — UI preview</title>
<link rel="stylesheet" href="/__fonts.css">
<style>
html,body{margin:0;background:#000;color:#999;font:12px monospace}
canvas{display:block;image-rendering:pixelated}
#bar{position:fixed;left:964px;top:0;width:220px;max-height:100vh;overflow:auto}
#bar a{display:block;color:#aaa;text-decoration:none;padding:1px 4px}#bar a:hover{background:#222}
</style>
</head><body><canvas id="screen" width="960" height="540" tabindex="0"></canvas><div id="bar"></div>
<script type="module">
import { boot } from './ui_harness.js';
import { fontTest } from './ui_fonttest.js';
if (location.hash === '#fonttest') {
  const ctx = document.getElementById('screen').getContext('2d');
  await fontTest(ctx); window.__ready = true;
} else {
  await boot();
  const bar = document.getElementById('bar');
  for (const s of window.scenarios) {
    const a = document.createElement('a'); a.href = '#' + s; a.textContent = s;
    a.onclick = (e) => { e.preventDefault(); history.replaceState(null, '', '#' + s); window.show(s, { keepManual: false }); document.getElementById('screen').focus(); };
    bar.appendChild(a);
  }
}
</script></body></html>
