<!doctype html><html><body style="margin:0;background:#000">
<script type="module">
import * as THREE from 'three';
const r = new THREE.WebGLRenderer(); r.setSize(320,240); document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color(0x336699);
const c = new THREE.PerspectiveCamera(70, 4/3, 0.1, 100); c.position.z = 3;
s.add(new THREE.Mesh(new THREE.BoxGeometry(), new THREE.MeshBasicMaterial({color: 0xffaa00})));
r.render(s, c); console.log('rendered', r.capabilities.maxTextureSize);
</script></body></html>
