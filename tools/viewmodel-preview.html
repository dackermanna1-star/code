<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <style>

      }
    </style>
  </head>

    <canvas id="view"></canvas>
    <div id="hud"></div>
    <script type="module" src="./viewmodel-preview.js"></script>
