<!doctype html>
<html><head><meta charset="utf-8"><title>gear fit</title>
<style>html,body{margin:0;background:#777}canvas{display:block}</style>

</head><body>
<script type="module">
// Fit check: a character in its rest pose plus gear GLBs placed at root-space positions.
// ?char=public/assets/characters/x.glb&gear=path@x,y,z;path2@x,y,z&views=front,side,back,q34&w=&h=&box=x0,y0,z0,x1,y1,z1
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
const q = new URLSearchParams(location.search);
const chars = (q.get('char') || '').split(',').filter(Boolean);
// gear spec: path@x,y,z (root space) or path@Bone:x,y,z (offset from the bone's rest position)
const gear = (q.get('gear') || '').split(';').filter(Boolean).map(s => { const i = s.lastIndexOf('@'); const t = s.slice(i + 1); const c = t.indexOf(':');
  return { p: s.slice(0, i), bone: c >= 0 ? t.slice(0, c) : null, pos: (c >= 0 ? t.slice(c + 1) : t).split(',').map(Number) }; });
const views = (q.get('views') || 'front,side,back,q34').split(',');
const cw = +(q.get('w') || 360), ch = +(q.get('h') || 420);
const bx = (q.get('box') || '-0.35,0.9,-0.4,0.35,1.95,0.4').split(',').map(Number);
const W = cw * views.length, H = ch * chars.length;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H); renderer.setScissorTest(true);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const env = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
async function run() {
  const gl = [];
  for (const g of gear) gl.push({ ...g, gltf: await loader.loadAsync('/' + g.p) });
  for (let ci = 0; ci < chars.length; ci++) {
    const scene = new THREE.Scene(); scene.environment = env; scene.background = new THREE.Color(0x8a8d90);
    const dl = new THREE.DirectionalLight(0xffffff, 2.0); dl.position.set(1, 3, 2); scene.add(dl);
    const c = await loader.loadAsync('/' + chars[ci]); scene.add(c.scene);
    c.scene.updateMatrixWorld(true);
    for (const g of gl) {
      const o = g.gltf.scene.clone(true); o.position.set(...g.pos);
      if (g.bone) { const b = c.scene.getObjectByName(g.bone); if (b) o.position.add(b.getWorldPosition(new THREE.Vector3())); }
      scene.add(o);
    }
    const box = new THREE.Box3(new THREE.Vector3(bx[0], bx[1], bx[2]), new THREE.Vector3(bx[3], bx[4], bx[5]));
    const ctr = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3());
    views.forEach((v, j) => {
      const x = j * cw, y = H - (ci + 1) * ch;
      renderer.setViewport(x, y, cw, ch); renderer.setScissor(x, y, cw, ch);
      const d = { front: [0, 0, 1], back: [0, 0, -1], side: [-1, 0, 0], left: [1, 0, 0], q34: [-0.8, 0.3, 1], q34b: [0.8, 0.3, -1], top: [0, 1, 0.001] }[v];
      const asp = cw / ch, span = Math.max(size.x, size.z, size.y * asp) * 0.55;
      const cam = new THREE.OrthographicCamera(-span, span, span / asp, -span / asp, 0.01, 20);
      cam.position.copy(ctr).addScaledVector(new THREE.Vector3(...d).normalize(), 5); cam.lookAt(ctr);
      renderer.render(scene, cam);
    });
  }
  window.__done = true;
}
run().catch(e => { console.error(e); window.__done = String(e); });
</script></body></html>
