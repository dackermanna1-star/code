// Converts an (ASCII or binary) FBX animation into GLB in the browser (three.js FBXLoader + GLTFExporter).
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

window.convert = async (url) => {
  const obj = await new FBXLoader().loadAsync(url);

  const b = new Uint8Array(glb); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));

};
window.ready = true;
