<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#07090d" />
<meta name="color-scheme" content="dark" />
<meta name="description" content="Last Ferry — hold the pier until the last ferry boards. No one boards dead." />
<title>Last Ferry</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%23101722%22/%3E%3Cpath d=%22M4 20h24l-3 6H8z%22 fill=%22%23e8a33a%22/%3E%3Crect x=%2210%22 y=%2213%22 width=%2210%22 height=%227%22 fill=%22%23e8a33a%22/%3E%3Crect x=%2214%22 y=%227%22 width=%223%22 height=%226%22 fill=%22%23c8342c%22/%3E%3C/svg%3E" />
<style>
/* Boot screen (inline so it is styled before any script runs). */
html,body{margin:0;height:100%;background:#05070a;overflow:hidden}

#lf-boot {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at 50% 60%, #121a24 0%, #06080c 70%);
  transition: opacity 400ms ease;
}

.lf-boot-in {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: min(420px, 70vw);
}

.lf-boot-mark {
  display: flex;
  align-items: baseline;
  gap: 0.7em;
  white-space: nowrap;
  font-size: clamp(14px, 2.2vw, 22px);
}

.lf-boot-mark .a {
  font-weight: 300;
  letter-spacing: 0.5em;
  color: #f6f1e7;
}

.lf-boot-mark .b {
  font-size: 2.1em;
  font-weight: 900;
  letter-spacing: 0.04em;
  color: #e9ac4e;
}

.lf-boot-bar {
  position: relative;
  width: 100%;
  height: 3px;
  margin-top: 22px;
  border-radius: 2px;
  background: rgba(255, 244, 222, 0.12);
  overflow: hidden;
}

.lf-boot-bar i {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 30%;
  border-radius: 2px;
  background: #e9ac4e;
  box-shadow: 0 0 10px rgba(233, 172, 78, 0.8);
  animation: lf-boot-slide 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
}

@keyframes lf-boot-slide {
  0% {
    left: -30%;
  }
  100% {
    left: 100%;
  }
}

.lf-boot-tag {
  margin-top: 26px;
  font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, 'DejaVu Serif', serif;
  font-style: italic;
  font-size: clamp(12px, 1.6vw, 17px);
  color: rgba(246, 241, 231, 0.62);
}

@media (prefers-reduced-motion: reduce) {
  .lf-boot-bar i {
    animation-duration: 4s;
  }
}
</style>
</head>
<body>
<div id="app"></div>
<!-- Static boot screen: visible until the game takes over (Screens.showLoading / hideLoading remove it). -->
<div id="lf-boot" aria-label="Loading Last Ferry">
  <div class="lf-boot-in">
    <div class="lf-boot-mark"><span class="a">LAST</span><span class="b">FERRY</span></div>
    <div class="lf-boot-bar"><i></i></div>
    <div class="lf-boot-tag">No one boards dead.</div>
  </div>
</div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
