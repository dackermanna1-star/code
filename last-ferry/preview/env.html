<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Last Ferry · environment preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #app { position: fixed; inset: 0; }
  #game-view { position: absolute; overflow: hidden; }
  #game-canvas { display: block; width: 100%; height: 100%; }
  #info { position: fixed; left: 8px; bottom: 8px; color: #fff; font: 12px/1.4 monospace; opacity: 0.75; pointer-events: none; text-shadow: 0 1px 2px #000; }
  #panel { position: fixed; right: 8px; top: 8px; color: #eee; font: 12px monospace; background: rgba(10,14,20,0.72); padding: 8px 10px; border-radius: 8px; display: grid; gap: 6px; }
  #panel.hidden { display: none; }
  #panel button { font: 12px monospace; margin: 0 2px; }
  #panel input[type=range] { width: 200px; vertical-align: middle; }
</style>
</head>
<body>
<div id="app"></div>
<div id="info"></div>
<div id="panel">
  <label>time <input id="tod" type="range" min="0" max="1" step="0.005" value="0" /> <span id="todv">0</span></label>
  <div>crane <button data-crane="hanging">hang</button><button data-crane="falling">cut</button><button data-crane="down">down</button><button data-crane="gone">gone</button></div>
  <div><button id="horn">horn</button><button id="board">board +1</button><button id="gun">gun</button><button id="scare">scare gulls</button><button id="blood">blood</button></div>
  <label>departure <input id="dep" type="range" min="0" max="1" step="0.005" value="0" /></label>
</div>
<script type="module" src="./env.ts"></script>
</body>
</html>
