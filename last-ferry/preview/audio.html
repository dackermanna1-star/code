<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Last Ferry — audio preview</title>
<link rel="icon" href="data:," />
<style>
  :root { --bg: #0d1117; --panel: #161b22; --line: #2a313c; --text: #e8e2d6; --dim: #9aa1ad; --accent: #e9ac4e; --bad: #ff6b5b; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
  main { max-width: 1240px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .14em; color: var(--accent); margin: 18px 0 8px; }
  .bar { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 10px 0; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  .stat { font: 12px/1.3 ui-monospace, monospace; color: var(--dim); }
  label { display: inline-flex; gap: 6px; align-items: center; color: var(--dim); }
  input[type=range] { width: 110px; }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .sounds button { font: 11px ui-monospace, monospace; padding: 4px 7px; }
  .sounds button.amb { border-color: #2c4a5a; } .sounds button.music { border-color: #5a3c2c; } .sounds button.ui { border-color: #3c3c5a; }
  #log { font: 11px/1.4 ui-monospace, monospace; color: var(--dim); white-space: pre-wrap; max-height: 160px; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin-top: 8px; }
  #report img { display: block; max-width: 100%; margin: 6px 0 14px; border: 1px solid var(--line); }
  #report pre { font: 11px/1.4 ui-monospace, monospace; color: var(--dim); white-space: pre-wrap; margin: 0; }
</style>
</head>
<body>
<main>
  <h1>Last Ferry — audio</h1>
  <div class="stat" id="status">100% procedural Web Audio. Click "Unlock" first.</div>
  <div class="bar">
    <button id="unlock">Unlock audio</button>
    <label>master <input id="master" type="range" min="0" max="1" step="0.01" value="0.8" /></label>
    <label>sfx <input id="sfx" type="range" min="0" max="1" step="0.01" value="1" /></label>
    <label>music <input id="music" type="range" min="0" max="1" step="0.01" value="0.7" /></label>
    <label><input id="amb" type="checkbox" /> ambience</label>
    <label><input id="pause" type="checkbox" /> paused</label>
    <label>pan x <input id="panx" type="range" min="-25" max="25" step="0.5" value="0" /></label>
    <span class="stat" id="voices">voices 0</span>
  </div>
  <h2>Music</h2>
  <div class="grid">
    <button id="music-start">Start music</button><button id="music-stop">Stop</button>
    <label>intensity <input id="intensity" type="range" min="0" max="1" step="0.01" value="0.2" /></label>
    <label><input id="boss" type="checkbox" /> boss</label>
    <label>chapter <select id="chapter"><option>1</option><option>2</option><option>3</option></select></label>
    <button data-cue="boss">cue: boss</button><button data-cue="chapter">cue: chapter</button><button data-cue="gameover">cue: game over</button><button data-cue="victory">cue: victory</button><button data-cue="title">cue: title</button>
  </div>
  <h2>Outboard engine · fire · gas</h2>
  <div class="grid">
    <button data-engine="pull">pull-start</button><button data-engine="idle">idle</button><button data-engine="run">run</button><button data-engine="stop">stop</button>
    <label>spin <input id="spin" type="range" min="0" max="1" step="0.01" value="0" /></label>
    <label><input id="firing" type="checkbox" /> firing</label>
    <label>burning <input id="burning" type="range" min="0" max="20" step="1" value="0" /></label>
    <label>gas clouds <input id="gascount" type="range" min="0" max="4" step="1" value="0" /></label>
  </div>
  <h2>Event sequences (through the EventBus)</h2>
  <div class="grid" id="seqs"></div>
  <div id="log"></div>
  <h2>All sounds</h2>
  <div class="sounds grid" id="sounds"></div>
  <h2>Offline renders</h2>
  <div class="grid" id="offline"></div>
  <div id="report"></div>
</main>
<script type="module" src="./audio.ts"></script>
</body>
</html>
