plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"godforge" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Automated in-game tests (dev only, never shipped in the mod jar):
//   ./gradlew runClientGameTest   boots a real client, fires every weapon and saves screenshots
//                                 to build/run/clientGameTest/screenshots (use xvfb-run when headless)
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "godforge-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

loom {
	runs {
		named("clientGameTest") {
			// lets the integrated server load chunks between frames when rendering is slow (software GL in CI)
			vmArg "-Dfabric.client.gametest.disableNetworkSynchronizer=true"
			// ./gradlew runClientGameTest -PshowcaseOnly  only renders the item models (quick check of display transforms)
			if (project.hasProperty("showcaseOnly")) {
				vmArg "-Dgodforge.gametest.showcaseOnly=true"
			}
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
