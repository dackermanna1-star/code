plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"portalgun" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "portalgun-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

// Client gametests teleport between freshly generated dimensions; chunk generation + software rendering on small
// machines can stall packet handling past the synchronizer's 10 s limit, which aborts the test spuriously.
loom.runs.matching { it.name == "clientGameTest" }.configureEach {
	vmArg "-Dfabric.client.gametest.disableNetworkSynchronizer=true"
}
