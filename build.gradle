plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"chaosunleashed" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		// Development only: runs a scripted client session (see client/dev/AutoTest.java), e.g.
		// ./gradlew runAutotestClient -PautotestScript=/path/to/script.txt -PautotestWorld=ChaosTest
		// ./gradlew runAutotestClient -PautotestScript=/path/to/script.txt -PautotestServer=localhost:25565
		autotestClient {
			client()
			name = "Autotest Client"
			vmArg "-Dchaosunleashed.autotest=${project.findProperty('autotestScript') ?: ''}"
			if (project.hasProperty('autotestServer')) {
				// Join a running dedicated server instead, e.g. -PautotestServer=localhost:25565
				programArgs "--quickPlayMultiplayer", "${project.findProperty('autotestServer')}", "--username", "ChaosTester"
			} else {
				programArgs "--quickPlaySingleplayer", "${project.findProperty('autotestWorld') ?: 'ChaosTest'}"
			}
			programArgs "--width", "1280", "--height", "720"
			runDir "run"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
