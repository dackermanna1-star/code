plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	accessWidenerPath = file("src/main/resources/realweather.accesswidener")

	splitEnvironmentSourceSets()

	mods {
		"realweather" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def props = [version: project.version, minecraft_version: project.minecraft_version, loader_version: project.loader_version]
	inputs.properties props

	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName
	from("LICENSE") {
		rename { "${it}_${projectName}" }
	}
}

// Automated in-game tests (not part of the released jar): ./gradlew runClientGameTest
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "realweather-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

// Development showcase: ./gradlew runDemo -Prealweather.demo.pos="x y z yaw pitch"
loom {
	runs {
		demo {
			client()
			name = "RealWeather Demo"
			source sourceSets.gametest
			runDir = "build/run/demo"
			vmArg "-Drealweather.demo=true"
			programArgs "--quickPlaySingleplayer", "demo", "--width", "1280", "--height", "720"
			["pos", "settle", "quality", "time", "debug", "only", "diagnose"].each { key ->
				def value = project.findProperty("realweather.demo." + key)
				if (value != null) {
					vmArg "-Drealweather.demo.${key}=${value}"
				}
			}
		}
	}
}
