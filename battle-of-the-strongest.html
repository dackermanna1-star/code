<!DOCTYPE html>

<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }

  .title { font-family: "Cormorant Garamond", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif; font-weight: 500; font-size: clamp(26px, 5.4vw, 88px); letter-spacing: .14em; line-height: 1.05; color: #f2efe8; text-shadow: 0 0 30px rgba(140, 90, 255, .35); }

  .vs .g { color: #dff4ff; text-shadow: 0 0 12px #2aa8ff; } .vs .s { color: #ffe8ea; text-shadow: 0 0 12px #ff2a3a; } .vs .x { color: #8a8a96; margin: 0 .6em; }
  .play { margin-top: 3vh; padding: .85em 2.4em; border: 2px solid rgba(255, 255, 255, .78); font-weight: 800; letter-spacing: .32em; font-size: clamp(12px, 1.3vw, 18px); animation: pulse 1.6s ease-in-out infinite; background: rgba(0, 0, 0, .35); }

  #end { justify-content: flex-end; padding-bottom: 7vh; background: transparent; }

</style>

<div id="stage"><div id="wrap"><canvas id="view"></canvas><canvas id="ui"></canvas></div></div>
<div id="start" class="ov">
  <div class="jp">人外魔境新宿決戦</div>

<script>
'use strict';
/* ==========================================================================
   THE BATTLE OF THE STRONGEST — Gojo Satoru vs Ryomen Sukuna, Shinjuku.
   A ~3 minute procedural anime fight. Everything is generated in code:
   a perspective 3D city drawn with Canvas2D, 2D cel-animated characters on
   skeletal rigs (Gojo, Sukuna, Mahoraga, Agito), particles, WebGL post
   (bloom, aberration, shockwaves, lenses, spatial slice, erase, warp),
   procedural music and sound design with WebAudio.
   ========================================================================== */

const DURATION = 194;
const QS = new URLSearchParams(location.search);
const TEST = QS.has('test');
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const invLerp = (a, b, x) => clamp((x - a) / (b - a), 0, 1);
const smoothstep = (a, b, x) => { const t = invLerp(a, b, x); return t * t * (3 - 2 * t); };
const Ease = {
  linear: t => t,
  in: t => t * t,
  out: t => 1 - (1 - t) * (1 - t),
  inout: t => (t < 0.5 ? 2 * t * t : 1 - 2 * (1 - t) * (1 - t)),
  in3: t => t * t * t,
  out3: t => 1 - (1 - t) ** 3,
  inout3: t => (t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2),
  in5: t => t ** 5,
  out5: t => 1 - (1 - t) ** 5,
  expo: t => (t >= 1 ? 1 : 1 - 2 ** (-10 * t)),
  expoIn: t => (t <= 0 ? 0 : 2 ** (10 * t - 10)),
  back: t => { const c = 1.70158, c3 = c + 1; return 1 + c3 * (t - 1) ** 3 + c * (t - 1) ** 2; },
  cut: t => (t < 1 ? 0 : 1),
};

// ---------------------------------------------------------------- random
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rng = mulberry32(1);
const reseed = s => { rng = mulberry32(s); };
const rnd = (a = 0, b = 1) => a + (b - a) * rng();
const rsym = a => (rng() * 2 - 1) * a;
const chance = p => rng() < p;
const pick = arr => arr[(rng() * arr.length) | 0];
function hash1(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453123; return s - Math.floor(s); }
function noise1(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return (hash1(i) * (1 - u) + hash1(i + 1) * u) * 2 - 1; }
function fbm1(x) { return noise1(x) * 0.6 + noise1(x * 2.13 + 17.1) * 0.28 + noise1(x * 4.7 + 41.3) * 0.12; }

// ------------------------------------------------------- keyframe tracks
class Track {
  constructor(v0 = 0) { this.k = []; this.v0 = v0; this.dirty = false; }
  add(t, v, e = 'inout') { this.k.push([t, v, e]); this.dirty = true; return this; }
  at(T) {
    const k = this.k, n = k.length;
    if (!n) return this.v0;
    if (this.dirty) { k.sort((a, b) => a[0] - b[0]); this.dirty = false; }
    if (T <= k[0][0]) return k[0][1];
    if (T >= k[n - 1][0]) return k[n - 1][1];
    let lo = 0, hi = n - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (k[m][0] <= T) lo = m; else hi = m; }
    const a = k[lo], b = k[hi];
    const u = (T - a[0]) / (b[0] - a[0] || 1e-9);
    return a[1] + (b[1] - a[1]) * Ease[b[2]](u);
  }
}
// attack / exponential-decay envelope
function envAD(T, t0, a, d) { const x = T - t0; if (x < 0) return 0; if (x < a) return a > 0 ? x / a : 1; return Math.exp(-(x - a) / d); }
// trapezoid window with fade-in/out
function win(T, t0, t1, fi = 0.1, fo = 0.1) {
  if (T < t0 || T > t1) return 0;
  return Math.min(1, (T - t0) / Math.max(fi, 1e-6), (t1 - T) / Math.max(fo, 1e-6));
}
function mixRGB(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
function rgb(c, a = 1) { return `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`; }
function hexRGB(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
class ColorTrack {
  constructor() { this.k = []; }
  add(t, hex, e = 'inout') { this.k.push([t, typeof hex === 'string' ? hexRGB(hex) : hex, e]); this.k.sort((a, b) => a[0] - b[0]); return this; }
  at(T) {
    const k = this.k, n = k.length;
    if (T <= k[0][0]) return k[0][1];
    if (T >= k[n - 1][0]) return k[n - 1][1];
    let i = 0; while (i < n - 1 && k[i + 1][0] <= T) i++;
    const a = k[i], b = k[i + 1];
    return mixRGB(a[1], b[1], Ease[b[2]]((T - a[0]) / (b[0] - a[0])));
  }
}

// ==========================================================================
//  AUDIO — fully procedural WebAudio sound design + an original score
//  (no samples, no external music; everything is synthesised live)
// ==========================================================================
const SFX = (() => {
  let ac = null, master, mix, bus, mbus, lp, comp, windGain, windFilt, noiseBuf, curve;
  const S = { silent: false, muted: false };
  S.ctx = () => ac;
  S.init = () => {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    master = ac.createGain(); master.gain.value = S.muted ? 0 : 0.9;
    comp = ac.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 5;
    comp.attack.value = 0.002; comp.release.value = 0.22;
    lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 18000; lp.Q.value = 0.5;
    mix = ac.createGain();
    bus = ac.createGain(); mbus = ac.createGain(); mbus.gain.value = 0.55;
    bus.connect(mix); mbus.connect(mix);
    mix.connect(lp); lp.connect(comp); comp.connect(master); master.connect(ac.destination);
    const len = (ac.sampleRate * 2) | 0;
    noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    curve = new Float32Array(2048);
    for (let i = 0; i < 2048; i++) { const x = i / 1023.5 - 1; curve[i] = Math.tanh(x * 4); }
    const w = ac.createBufferSource(); w.buffer = noiseBuf; w.loop = true;
    windFilt = ac.createBiquadFilter(); windFilt.type = 'bandpass'; windFilt.frequency.value = 420; windFilt.Q.value = 0.55;
    windGain = ac.createGain(); windGain.gain.value = 0;
    w.connect(windFilt); windFilt.connect(windGain); windGain.connect(master); w.start();
  };
  S.ok = () => !!ac && !S.silent;
  S.pause = () => { if (ac && ac.state === 'running') ac.suspend(); };
  S.resume = () => { if (ac && ac.state === 'suspended') ac.resume(); };
  S.setMuted = m => { S.muted = m; if (master) master.gain.setTargetAtTime(m ? 0 : 0.9, ac.currentTime, 0.02); };
  let lastWind = -1;
  S.wind = (level, freq) => {
    if (!ac) return;
    if (Math.abs(level - lastWind) < 0.002) return;
    lastWind = level;
    windGain.gain.setTargetAtTime(level, ac.currentTime, 0.12);
    windFilt.frequency.setTargetAtTime(freq || 380 + level * 900, ac.currentTime, 0.3);
  };

  // ---- building blocks
  const now = () => ac.currentTime + 0.004;
  function G(t, peak, a, d) {
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(Math.max(peak, 0.0002), t + Math.max(a, 0.001));
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
    return g;
  }
  function N(t, dur, rate = 1) {
    const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true; s.playbackRate.value = rate;
    s.start(t, Math.random() * 1.8); s.stop(t + dur + 0.1); return s;
  }
  function O(type, t, dur, f0, f1) {
    const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    o.start(t); o.stop(t + dur + 0.1); return o;
  }
  function F(type, f, q = 0.7) { const b = ac.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; }
  function D() { const w = ac.createWaveShaper(); w.curve = curve; return w; }
  function wire(...n) { for (let i = 0; i < n.length - 1; i++) n[i].connect(n[i + 1]); return n[n.length - 1]; }

  // ---- sound effects
  S.hit = (p = 0.5) => {
    if (!S.ok()) return; const t = now();
    wire(O('sine', t, 0.3 + 0.3 * p, 150 + 90 * p, 40), G(t, 0.5 + 0.45 * p, 0.002, 0.1 + 0.25 * p), bus);
    wire(N(t, 0.3), F('bandpass', 1300 + 1100 * p, 0.9), G(t, 0.35 + 0.5 * p, 0.001, 0.04 + 0.1 * p), bus);
    wire(N(t, 0.1, 1.5), F('highpass', 5000), G(t, 0.1 + 0.2 * p, 0.001, 0.025), bus);
    if (p > 0.6) {
      wire(O('sine', t, 1.4 * p, 68, 24), G(t, 0.8 * p, 0.004, 0.35 + 0.5 * p), bus);
      wire(N(t, 1.2 * p, 0.6), F('lowpass', 700), D(), G(t, 0.45 * p, 0.003, 0.3 + 0.4 * p), bus);
    }
  };
  S.block = (p = 0.4) => {
    if (!S.ok()) return; const t = now();
    S.hit(p * 0.7);
    wire(O('triangle', t, 0.25, 2200, 1500), G(t, 0.06 + 0.06 * p, 0.001, 0.12), bus);
    wire(N(t, 0.12, 1.3), F('bandpass', 3200, 2), G(t, 0.2 * p + 0.05, 0.001, 0.05), bus);
  };
  S.infinity = (p = 0.4) => {
    if (!S.ok()) return; const t = now();
    wire(O('sine', t, 0.3, 120, 60), G(t, 0.25 + 0.3 * p, 0.003, 0.12), bus);
    for (let i = 0; i < 5; i++) { const f = 2400 + i * 610 + Math.random() * 200; wire(O('sine', t + i * 0.012, 0.5, f, f * 1.02), G(t + i * 0.012, 0.035 + 0.03 * p, 0.003, 0.3), bus); }
    wire(N(t, 0.2, 1.6), F('bandpass', 6000, 3), G(t, 0.06 + 0.08 * p, 0.002, 0.12), bus);
  };
  S.whoosh = (p = 0.5, dur = 0.25) => {
    if (!S.ok()) return; const t = now();
    const bp = F('bandpass', 400, 1.8);
    bp.frequency.setValueAtTime(320, t);
    bp.frequency.exponentialRampToValueAtTime(2600, t + dur * 0.55);
    bp.frequency.exponentialRampToValueAtTime(500, t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.32 * p, t + dur * 0.5);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    wire(N(t, dur), bp, g, bus);
  };
  S.blink = () => {
    if (!S.ok()) return; const t = now();
    wire(O('sine', t, 0.07, 700, 5200), G(t, 0.12, 0.002, 0.06), bus);
    wire(N(t, 0.08, 2), F('highpass', 5000), G(t, 0.09, 0.001, 0.04), bus);
  };
  S.slash = (p = 0.5) => {
    if (!S.ok()) return; const t = now();
    wire(N(t, 0.2, 1.3), F('highpass', 2800, 0.8), G(t, 0.3 + 0.3 * p, 0.002, 0.06 + 0.06 * p), bus);
    wire(O('sawtooth', t, 0.07, 4200, 900), F('bandpass', 2500, 2), G(t, 0.07 * p + 0.03, 0.001, 0.05), bus);
    wire(O('sine', t + 0.01, 0.4, 6200, 5600), G(t + 0.01, 0.02 + 0.02 * p, 0.002, 0.2), bus);
  };
  S.sword = (p = 0.7) => {
    if (!S.ok()) return; const t = now();
    S.whoosh(0.9 * p, 0.32);
    wire(O('triangle', t + 0.05, 1.2, 1320, 1290), G(t + 0.05, 0.05 * p, 0.003, 0.9), bus);
    wire(O('sine', t + 0.05, 1.0, 2090, 2080), G(t + 0.05, 0.03 * p, 0.003, 0.7), bus);
  };
  S.boom = (p = 1, dur = 1.5) => {
    if (!S.ok()) return; const t = now();
    const f = F('lowpass', 2500, 0.5);
    f.frequency.setValueAtTime(3200, t); f.frequency.exponentialRampToValueAtTime(90, t + dur);
    wire(N(t, dur + 0.2, 0.7), f, D(), G(t, 0.85 * p, 0.01, dur * 0.6), bus);
    wire(O('sine', t, dur, 82, 22), G(t, 0.9 * p, 0.01, dur * 0.5), bus);
    wire(O('triangle', t, dur * 0.5, 170, 40), G(t, 0.3 * p, 0.005, dur * 0.25), bus);
  };
  S.crash = (p = 1) => {
    if (!S.ok()) return; const t = now();
    S.boom(0.6 * p, 1.6);
    for (let i = 0; i < 10; i++) { const tt = t + Math.random() * 0.6; wire(N(tt, 0.08, 0.8 + Math.random()), F('bandpass', 400 + Math.random() * 2400, 1.5), G(tt, 0.12 * p, 0.002, 0.05 + Math.random() * 0.1), bus); }
    S.glass(0.4 * p);
  };
  S.stomp = (p = 1) => {
    if (!S.ok()) return; const t = now();
    wire(O('sine', t, 0.8, 70, 30), G(t, 0.9 * p, 0.003, 0.5), bus);
    wire(N(t, 0.5, 0.5), F('lowpass', 400), D(), G(t, 0.5 * p, 0.003, 0.35), bus);
  };
  S.charge = (dur = 2, f = 80, p = 0.6) => {
    if (!S.ok()) return; const t = now();
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.2 * p, t + dur * 0.92);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.12);
    const f2 = F('lowpass', 200, 4);
    f2.frequency.setValueAtTime(150, t); f2.frequency.exponentialRampToValueAtTime(4200, t + dur);
    const trem = ac.createGain(); trem.gain.value = 0.6;
    const lfo = O('sine', t, dur + 0.2, 5, 30); const lg = ac.createGain(); lg.gain.value = 0.4;
    lfo.connect(lg); lg.connect(trem.gain);
    O('sawtooth', t, dur + 0.2, f, f * 4).connect(f2);
    O('sawtooth', t, dur + 0.2, f * 1.013, f * 4.06).connect(f2);
    O('square', t, dur + 0.2, f / 2, f * 2).connect(f2);
    wire(f2, trem, g, bus);
  };
  S.drone = (dur = 4, f = 55, p = 0.5) => {
    if (!S.ok()) return; const t = now();
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.15 * p, t + dur * 0.35);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    const f2 = F('lowpass', 420, 1.2);
    [1, 1.5, 2.003, 0.5].forEach((m, i) => O(i % 2 ? 'sawtooth' : 'triangle', t, dur, f * m, f * m * 1.004).connect(f2));
    wire(f2, g, bus);
  };
  S.heart = (p = 0.7) => {
    if (!S.ok()) return; const t = now();
    wire(O('sine', t, 0.2, 78, 38), G(t, 0.75 * p, 0.005, 0.13), bus);
    wire(O('sine', t + 0.2, 0.2, 72, 36), G(t + 0.2, 0.45 * p, 0.005, 0.1), bus);
  };
  S.tink = () => {
    if (!S.ok()) return; const t = now();
    wire(O('sine', t, 0.4, 2400, 2350), G(t, 0.09, 0.001, 0.22), bus);
    wire(O('sine', t, 0.3, 3900, 3850), G(t, 0.04, 0.001, 0.14), bus);
  };
  S.rumble = (dur = 2, p = 0.5) => {
    if (!S.ok()) return; const t = now();
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.45 * p, t + dur * 0.4);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    wire(N(t, dur, 0.4), F('lowpass', 150, 0.9), g, bus);
  };
  S.thunder = (p = 1) => {
    if (!S.ok()) return; const t = now();
    wire(N(t, 0.25, 1.4), F('highpass', 1500), G(t, 0.5 * p, 0.002, 0.18), bus);
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.55 * p, t + 0.12); g.gain.exponentialRampToValueAtTime(0.0001, t + 3.2);
    wire(N(t, 3.4, 0.35), F('lowpass', 260, 0.8), D(), g, bus);
  };
  S.crackle = (dur = 0.4, p = 0.4) => {
    if (!S.ok()) return; const t = now();
    const n = Math.min(48, Math.ceil(dur * 40));
    for (let i = 0; i < n; i++) {
      const tt = t + Math.random() * dur;
      wire(N(tt, 0.03, 1.5), F('bandpass', 2000 + Math.random() * 4500, 2), G(tt, (0.1 + Math.random() * 0.2) * p, 0.001, 0.012 + Math.random() * 0.02), bus);
    }
  };
  S.glass = (p = 0.5) => {
    if (!S.ok()) return; const t = now();
    for (let i = 0; i < 9; i++) {
      const tt = t + Math.random() * 0.28, f = 2500 + Math.random() * 5200;

const MUSIC = (() => {

// ---------------------------------------------------------- update
function updateParticles(dt, T) {
  if (dt <= 0) return;
  const nA = attractors.length;
  let j = 0, nd = 0;
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0) continue;
    if (p.at && nA) {
      let dead = false, inf = false;
      for (let k = 0; k < nA; k++) {
        const A = attractors[k], dx = A.x - p.x, dy = A.y - p.y, d2 = dx * dx + dy * dy;
        if (d2 > A.r * A.r) continue;
        const d = Math.sqrt(d2) + 0.001;
        if (d < A.kill) { dead = true; break; }
        const f = A.s * (0.25 + 0.75 * (1 - d / A.r)) * p.at;
        p.vx += ((dx / d) * f - (dy / d) * f * A.swirl) * dt;
        p.vy += ((dy / d) * f + (dx / d) * f * A.swirl) * dt;
        p.vz += ((A.z || 0) - p.z) * 4 * dt * p.at;
        inf = true;
      }
      if (dead) continue;
      if (p.t === PT.DEBRIS) p.g = inf ? 0 : p.g0;
    } else if (p.t === PT.DEBRIS) p.g = p.g0;
    if (p.hov) {
      // hovering rubble (pressure of cursed energy): bob around its rest height
      const ty = p.hy + Math.sin(T * 0.9 + p.ph) * 40;
      p.vy += (ty - p.y) * 1.6 * dt; p.vy *= Math.exp(-1.2 * dt); p.vx *= Math.exp(-1.2 * dt);
      p.life = Math.max(p.life, 1);
    } else {
      if (p.drag) { const k = Math.exp(-p.drag * dt); p.vx *= k; p.vy *= k; p.vz *= k; }
      p.vy += p.g * dt;
      if (p.t === PT.DUST) p.vx += windX * dt;
    }
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    p.s += p.gs * dt;
    p.rot += p.vr * dt;
    if ((p.t === PT.DEBRIS || p.t === PT.SHARD) && p.y > -p.s * 0.35 && p.vy > 0) {
      p.y = -p.s * 0.35; p.vy *= -0.3; p.vx *= 0.6; p.vz *= 0.6; p.vr *= 0.6;
      if (Math.abs(p.vy) < 50) p.vy = 0;

}
// release all hovering rubble with an outward blast from (x, y)

    p.hov = 0;
    const dx = p.x - x, dy = p.y - y, dz = p.z, d = Math.hypot(dx, dy, dz) + 1;

// ---------------------------------------------------------- draw
const _sparkBuckets = new Map(), _debBuckets = new Map();
const _pa = [0, 0, 0, 0], _pb = [0, 0, 0, 0];
function drawParticles(c, layer, T) {
  c.globalCompositeOperation = 'source-over';
  // dust & smoke: big soft sprites, painted into the reduced-resolution soft buffer
  let sb = null, k = 1, x0 = W, y0 = H, x1 = 0, y1 = 0;
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];

    const q = proj(p.x, p.y, p.z, _pa); if (!q) continue;
    const life = p.life / p.ml;

    if (a < 0.01) continue;

    const cs = Math.cos(p.rot) * r * k, sn = Math.sin(p.rot) * r * k;
    sb.x.setTransform(cs, sn, -sn, cs, sx * k, sy * k);
    sb.x.globalAlpha = a > 1 ? 1 : a;
    sb.x.drawImage(p.c, -1, -1, 2, 2);

  _debBuckets.clear();

    const p = parts[i];
    if (p.f !== layer || (p.t !== PT.DEBRIS && p.t !== PT.SHARD)) continue;
    const q = proj(p.x, p.y, p.z, _pa); if (!q) continue;
    const kk = q[2], r = p.s * kk, sx = q[0], sy = q[1];
    if (r < 0.3 || sx < -r * 2 || sx > W + r * 2 || sy < -r * 2 || sy > H + r * 2) continue;
    const fade = Math.max(1, Math.ceil(Math.min(1, (p.life / p.ml) * 4) * 4));
    const key = (p.t === PT.SHARD ? '#shard' : p.c) + '|' + fade + '|' + (r > 4 ? 1 : 0);

    const [col, fade, big] = key.split('|');
    c.beginPath();
    for (let i = 0; i < arr.length; i += 4) {
      const p = arr[i], sx = arr[i + 1], sy = arr[i + 2], kk = arr[i + 3];

    const p = parts[i];
    if (p.f !== layer) continue;
    const life = p.life / p.ml;
    if (p.t === PT.GLOW || p.t === PT.FIRE) {
      const q = proj(p.x, p.y, p.z, _pa); if (!q) continue;
      const kq = q[2];
      let spr, r, a;

      } else {
        spr = life > 0.72 ? HOT.yellow : life > 0.42 ? GLOW.orange : life > 0.2 ? GLOW.fire : GLOW.crimson;

      if (!sb) { sb = softBegin('glow'); k = sb.width / W; sb.x.setTransform(k, 0, 0, k, 0, 0); sb.x.globalCompositeOperation = 'lighter'; }
      glow(sb.x, spr, q[0], q[1], r, a);
      if (q[0] - r < x0) x0 = q[0] - r; if (q[1] - r < y0) y0 = q[1] - r; if (q[0] + r > x1) x1 = q[0] + r; if (q[1] + r > y1) y1 = q[1] + r;
    } else if (p.t === PT.SPARK || p.t === PT.STREAK) {
      const bucket = Math.min(3, (life * 4) | 0);
      const key = p.c + '|' + bucket + '|' + (p.w > 2.5 ? 1 : 0) + '|' + p.t;
      let arr = _sparkBuckets.get(key); if (!arr) { arr = []; _sparkBuckets.set(key, arr); }

  c.setTransform(1, 0, 0, 1, 0, 0);
  c.globalCompositeOperation = 'lighter';
  c.lineCap = 'round';
  for (const [key, arr] of _sparkBuckets) {
    const [col, bucket, thick, type] = key.split('|');
    const a = (+bucket + 1) / 4;
    const isStreak = +type === PT.STREAK;
    const L = isStreak ? 0.06 : 0.022;
    c.beginPath();
    let ksum = 0, kn = 0;
    for (const p of arr) {
      const q = proj(p.x, p.y, p.z, _pa); if (!q) continue;
      const r = proj(p.x - p.vx * L, p.y - p.vy * L, p.z - p.vz * L, _pb); if (!r) continue;
      c.moveTo(q[0], q[1]); c.lineTo(r[0], r[1]);

    c.strokeStyle = col;
    c.globalAlpha = a * 0.35; c.lineWidth = (+thick ? 5 : 2.6) * (isStreak ? 1.6 : 1) * ks * SC; c.stroke();
    c.globalAlpha = a; c.lineWidth = (+thick ? 2.2 : 1.1) * ks * SC; c.stroke();
  }
  c.globalCompositeOperation = 'source-over';
  c.globalAlpha = 1;
}

// ---------------------------------------------------------------- dispatch
function drawBody(c, R, S, o, sil) {

// ==========================================================================
//  ACTORS — keyframed choreography, hit-stop time warp, afterimages, auras,
//  billboard rendering in the 3D world, contact shadows, waist split
// ==========================================================================
let CHAR_FPS = 30; // characters animate "on twos" against a 60fps camera, like hand-drawn cels
const stepT = (t, fps = CHAR_FPS) => (fps ? Math.floor(t * fps + 1e-4) / fps : t);

class Actor {

    this.keys = []; this.tr = {};

    const rg = this.rg;

  // key: time, x, y ('g' = feet planted on the ground; o.gy = ground height, e.g. a rooftop), pose, options
  k(t, x, y, pose, o = {}) {
    if (!POSES[pose]) throw new Error('pose ' + pose);
    const prev = this.keys[this.keys.length - 1];
    this.keys.push({
      t, x, y, pose, face: o.f !== undefined ? o.f : prev ? prev.face : 1,
      e: o.e || 'inout', pe: o.pe || 'out', pb: o.pb !== undefined ? o.pb : 0.07,
      rot: o.r !== undefined ? o.r : 0, arc: o.arc || 0, vis: o.vis === undefined ? 1 : o.vis,
      z: o.z !== undefined ? o.z : prev ? prev.z : 0, gy: o.gy !== undefined ? o.gy : (prev && y === 'g' && prev.y === 'g' ? prev.gy : 0),

  }
  get last() { return this.keys[this.keys.length - 1]; }
  hold(t, o = {}) { const L = this.last; if (L.t >= t - 1e-6) return this; return this.k(t, L.x, L.y, L.pose, Object.assign({ f: L.face, r: L.rot, pb: 0, vis: L.vis, z: L.z, gy: L.gy }, o)); }

  v(n, T) { const t = this.tr[n]; return t ? t.at(T) : 0; }
  finalize() { this.keys.sort((a, b) => a.t - b.t); }
  state(T, out) {

// ---- hit-stop warp: freeze the choreography briefly, then catch up with a burst of speed
const STOPS = [];
function addStop(t, d, r) { STOPS.push([t, d, r]); STOPS.sort((a, b) => a[0] - b[0]); }
function charTime(T) {
  let t = T;
  for (let i = 0; i < STOPS.length; i++) {
    const s = STOPS[i], t0 = s[0], d = s[1], r = s[2];
    if (t < t0) continue;
    if (t < t0 + d) t = t0;
    else if (t < t0 + d + r) t = t0 + ((t - t0 - d) * (d + r)) / r;
  }
  return t;
}

// ---- scene cuts: trails / afterimages never sample across these times
const SCENE_CUTS = [];
const acrossCut = (a, b) => { for (const c of SCENE_CUTS) if (a < c && b >= c) return true; return false; };

// ---- lights affecting rim lighting
let LIGHTS = [];
function lightFor(x, y, T) {
  let best = null, bi = 0;
  for (const L of LIGHTS) {
    const dx = L.x - x, dy = L.y - y, d = Math.hypot(dx, dy);
    const inf = L.i * clamp(1 - d / L.r, 0, 1);
    if (inf > bi) { bi = inf; best = { d: [dx / (d || 1), dy / (d || 1)], col: L.col, i: Math.min(1.2, inf * 1.6) }; }
  }
  if (!best || bi < 0.12) return { d: [-0.55, -0.83], col: RIM_COL, i: RIM_I.at(T) };
  return best;
}
let RIM_COL = '#fff2dc';
const RIM_I = new Track(0.35);

// ---- per-actor hit flashes
const HITFLASH = [];
function hitFlashAt(A, T) { let m = 0; for (const h of HITFLASH) if (h.a === A && T >= h.t && T < h.t + 0.2) m = Math.max(m, 1 - (T - h.t) / 0.2); return m; }

function actorVel(A, Tc) {
  if (acrossCut(Tc - 1 / 60, Tc)) return [0, 0];
  const a = A.state(Tc, A.st2), x1 = a.x, y1 = a.y;
  const b = A.state(Tc - 1 / 60, A.st2);
  if (a.tele || b.tele) return [0, 0];
  return [(x1 - b.x) * 60, (y1 - b.y) * 60];
}

// contact shadow on the ground
function drawShadow(c, A, T) {
  const st = A.state(stepT(charTime(T), A.fps), A.st);
  if (!st.vis || st.y < -3000) return;
  const gy = 0;
  if (st.y > gy + 40) return;
  const h = Math.max(0, gy - st.y);
  const k = clamp(1 - h / (900 * A.sc), 0, 1);
  if (k <= 0.02) return;
  faceSet(st.x, gy - 2, st.z, 1, 0, 0, 0, 0, 1);
  if (!fp(0, 0)) return;
  const p0 = [_fp[0], _fp[1]], r = 34 * A.sc * (1.4 - k * 0.4);
  fp(r, 0); const rx = Math.hypot(_fp[0] - p0[0], _fp[1] - p0[1]);
  fp(0, r); const ry = Math.max(1, Math.hypot(_fp[0] - p0[0], _fp[1] - p0[1]));
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.save(); c.translate(p0[0], p0[1]); c.scale(1, ry / Math.max(1, rx));
  const g = c.createRadialGradient(0, 0, 0, 0, 0, rx);
  g.addColorStop(0, `rgba(10,10,14,${0.55 * k})`); g.addColorStop(1, 'rgba(10,10,14,0)');
  c.fillStyle = g; c.beginPath(); c.arc(0, 0, rx, 0, TAU); c.fill(); c.restore();
}

// draw one body, optionally split at the waist (World Cutting Slash)
function drawBodySplit(c, A, R, S, o, sil, T) {
  const split = A.v('split', T);
  if (split <= 0) { drawBody(c, R, S, o, sil); return; }
  const s = R.sc, P = at(R.hip, R.ut, R.fw, 15 * s, 0), d = R.fw, L = 400 * s;
  const n = [R.ut[0], R.ut[1]];
  const half = up => {
    const sg = up ? 1 : -1;
    c.beginPath();
    c.moveTo(P[0] - d[0] * L, P[1] - d[1] * L); c.lineTo(P[0] + d[0] * L, P[1] + d[1] * L);
    c.lineTo(P[0] + d[0] * L + n[0] * L * sg, P[1] + d[1] * L + n[1] * L * sg); c.lineTo(P[0] - d[0] * L + n[0] * L * sg, P[1] - d[1] * L + n[1] * L * sg);
    c.closePath();
  };

  c.save(); half(false); c.clip(); drawBody(c, R, S, o, sil); if (sil) c.fill(); c.restore();
  // upper half slides / falls away

  c.save();
  c.translate(P[0] + dx, P[1] + dy); c.rotate(rot); c.translate(-P[0], -P[1]);
  half(true); c.clip(); drawBody(c, R, S, o, sil); if (sil) c.fill();
  c.restore();

    const glowK = A.v('splitGlow', T);
    if (glowK > 0.01) {
      c.save(); c.globalCompositeOperation = 'lighter'; c.strokeStyle = '#ffffff'; c.globalAlpha = glowK; c.lineWidth = 1.6 * s; c.lineCap = 'round';
      c.beginPath(); c.moveTo(P[0] - d[0] * 22 * s, P[1] - d[1] * 22 * s); c.lineTo(P[0] + d[0] * 22 * s, P[1] + d[1] * 22 * s); c.stroke();
      glow(c, GLOW.white, P[0], P[1], 40 * s, 0.4 * glowK);
      c.restore();
    }
  }
}

function drawActor(c, A, T, mode) {
  const Tc = charTime(T), Ts = stepT(Tc, A.fps);
  const st = A.state(Ts, A.st);
  if (!st.vis) return;

  setM(c, M);

  const R = rigWorld(st, A.R, A.rg);
  const vel = actorVel(A, Ts);

  const S = A.S;
  if (A.v('clipG', T) > 0.5) { c.beginPath(); c.rect(st.x - 20000, -40000, 40000, 40000 + A.v('clipY', T)); c.clip(); }
  if (A.tr.scl) { const k = A.v('scl', T); if (k < 0.999) { const R0 = rigWorld(st, A.Rt, A.rg); c.translate(R0.chest[0], R0.chest[1]); c.scale(k, k); c.translate(-R0.chest[0], -R0.chest[1]); if (k < 0.01) return; } }

      const s2 = A.state(tk, A.st2); if (!s2.vis) continue;

      const R2 = rigWorld(s2, A.Rt, A.rg);
      drawBody(c, R2, S, o, true);
      c.fillStyle = S.ghost; c.globalAlpha = (0.32 - k * 0.052) * (aiF > 0 ? Math.max(aiF, 0.6) : 1); c.fill();

  }

    c.strokeStyle = S.energy; c.globalAlpha = 0.32 * Math.min(1.5, aura); c.lineWidth = (5 + 12 * aura) * fl * Math.sqrt(A.sc); c.stroke();
    glow(c, GLOW[S.glowB] || GLOW.white, R.chest[0], R.chest[1] + 20 * A.sc, (120 + 90 * aura) * A.sc, 0.22 * aura);
    c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
  }
  // motion-blur smear copies (cheap silhouettes in the body colour)

    for (let k = 3; k >= 1; k--) {
      const s2 = A.state(Tc - k * 0.012, A.st2); if (!s2.vis || s2.tele) continue;

    const nEyes = 1;

// Sukuna's Dismantle: a fan of invisible slashes, visible only as thin lines + cuts in the world
function dismantle(t, x, y, ang, n = 5, o = {}) {
  const z = o.z || 0, len = o.len || 420;

// follow a pair / actor with optional yaw/pitch drift between t0 and t1
function follow(t0, t1, who, o = {}) {
  C(t0, Object.assign({ who, e: o.cutIn ? 'cut' : (o.e || 'inout') }, o.a || o));
  if (t1 > t0) C(t1, Object.assign({ who, e: o.e2 || 'linear' }, o.b || o));

function orbit(t0, t1, who, yaw0, yaw1, o = {}) {
  const n = Math.max(2, Math.ceil((t1 - t0) / 0.5));
  for (let i = 0; i <= n; i++) {

    C(t0 + (t1 - t0) * u, Object.assign({ who, e: i === 0 ? (o.cutIn ? 'cut' : 'inout') : 'linear', yaw: lerp(yaw0, yaw1, o.ease ? Ease[o.ease](u) : u), pitch: lerp(o.pitch0 === undefined ? (o.pitch || 0) : o.pitch0, o.pitch1 === undefined ? (o.pitch || 0) : o.pitch1, u), D: Math.exp(lerp(Math.log(o.D0 || o.D || 1600), Math.log(o.D1 || o.D || 1600), u)), z: Math.exp(lerp(Math.log(o.z0 || o.z || 1), Math.log(o.z1 || o.z || 1), u)) }, o.k || {}));
  }
}

// ======================================================================== shared FX for the summons
// a pool of shadow spreading on the ground (Ten Shadows)
function shadowPool(t0, t1, x, z, r, o = {}) {
  fx(t0, t1, {
    layer: 'bg',
    draw(c, T, k) {
      c.setTransform(1, 0, 0, 1, 0, 0);
      const g = Ease.out3(clamp((T - t0) / (o.grow || 0.8), 0, 1)) * (1 - smoothstep(t1 - 0.6, t1, T));
      if (g <= 0.01) return;
      faceSet(x, -3, z, 1, 0, 0, 0, 0, 1);
      const pts = []; for (let i = 0; i < 36; i++) { const a = (i / 36) * TAU, rr = r * g * (0.86 + 0.14 * noise1(i * 0.7 + T * 1.5)); pts.push([Math.cos(a) * rr, Math.sin(a) * rr * 0.9]); }
      c.beginPath(); if (!facePoly(c, pts)) return;
      c.fillStyle = 'rgba(4,2,8,0.92)'; c.fill();
      c.strokeStyle = 'rgba(120,40,180,0.35)'; c.lineWidth = 2; c.stroke();
    },
    emit(T, dt) {
      atZ(z, () => { let n = 30 * dt; while (n > 0) { if (rng() < n) spawnPuff('smoke', x + rsym(r * 0.7), -20, rsym(40), -60 - rng() * 120, 1.4, 80 + rng() * 80, 0.6, 0, { gs: 60, vz: rsym(80) }); n--; } });
    },
  });
}
// a big chunk of falling building on a deterministic arc (characters can kick off it)
function chunkFX(t0, t1, x0, y0, vx, vy, size, o = {}) {
  const g = o.g === undefined ? 1400 : o.g, z = o.z || 0, seed = (t0 * 1000) | 0;
  const pos = T => { const t = clamp(T, t0, t1) - t0; return [x0 + vx * t, y0 + vy * t + 0.5 * g * t * t, z]; };
  const R = mulberry32(seed), poly = [];
  for (let i = 0; i < 7; i++) { const a = (i / 7) * TAU + (R() - 0.5) * 0.5, r = size * (0.6 + R() * 0.5); poly.push([Math.cos(a) * r, Math.sin(a) * r * 0.8]); }
  fx(t0, t1, {
    layer: o.layer || 'back', at: pos,
    draw(c, T, k) {
      const p = pos(T), rot = (T - t0) * (o.spin || 0.8);
      c.translate(p[0], p[1]); c.rotate(rot);
      c.beginPath(); pathPts(c, poly);
      c.fillStyle = o.col || '#5c5e68'; c.fill(); c.strokeStyle = '#141418'; c.lineWidth = size * 0.04; c.lineJoin = 'round'; c.stroke();
      c.beginPath(); for (let i = 0; i < 4; i++) { c.moveTo(-size * 0.5, -size * 0.5 + i * size * 0.3); c.lineTo(size * 0.5, -size * 0.45 + i * size * 0.3); }
      c.strokeStyle = 'rgba(30,32,40,0.6)'; c.lineWidth = size * 0.05; c.stroke();
    },
  });
  if (o.land !== false) ev(t1, () => { const p = pos(t1); atZ(z, () => { burstDebris(p[0], Math.min(-10, p[1]), 20, { speed: 900, size: size * 0.15 }); dustRing(p[0], 14, { speed: 900, r: size * 0.5 }); }); SFX.crash(0.6); });
  return pos;
}

// a slow orbit on a fixed point
function orbit3(t0, t1, x, y, yaw0, yaw1, D, z, pitch) {
  const n = 6;
  for (let i = 0; i <= n; i++) { const u = i / n; C(t0 + (t1 - t0) * u, { x, y, D, z, yaw: lerp(yaw0, yaw1, u), pitch: -pitch, e: i ? 'linear' : 'cut' }); }
}

  MUSIC.seek(T);
}
function restart() { seek(0); ended = false; endEl.classList.add('hide'); if (started) { playing = true; SFX.resume(); } }
function onEnd() { ended = true; playing = false; MUSIC.stop(); setTimeout(() => { if (ended) endEl.classList.remove('hide'); }, 900); }
startEl.addEventListener('click', begin);
endEl.addEventListener('click', () => { restart(); playing = true; });
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if (!started) return begin(); if (ended) return restart(); playing = !playing; if (playing) { SFX.resume(); MUSIC.seek(T); } else { SFX.pause(); MUSIC.stop(); } }
  else if (e.code === 'KeyR') { if (!started) begin(); restart(); }
  else if (e.code === 'KeyM') SFX.setMuted(!SFX.muted);
  else if (e.code === 'KeyF') { if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); else document.exitFullscreen && document.exitFullscreen(); }
  else if (e.code === 'KeyD') { showHud = !showHud; hudEl.textContent = ''; }
  else if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { seek(T + (e.code === 'ArrowRight' ? 5 : -5)); ended = false; endEl.classList.add('hide'); }
  else if (!started && e.code === 'Enter') begin();
});
window.addEventListener('resize', () => resize());

let slowFrames = 0, fastFrames = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - lastNow) / 1000; lastNow = now;
  if (dt > 0 && dt < 1) { fpsAcc.push(dt * 1000); if (fpsAcc.length > 40) fpsAcc.shift(); }
  dt = Math.min(dt, 0.1);
  if (playing && !ended) {
    const T1 = Math.min(DURATION, T + dt);
    simStep(T, T1); T = T1;
    SFX.wind(GRADE.wind.at(T));
    MUSIC.update(T);
    if (T >= DURATION) onEnd();
  }
  render(T);
  // adaptive resolution: cost is mostly fill-rate, so scale the pixel count toward ~18 ms frames
  if (playing && fpsAcc.length >= 30) {
    const avg = fpsAcc.reduce((a, b) => a + b, 0) / fpsAcc.length;
    if (avg > 24) slowFrames++; else slowFrames = 0;
    if (avg < 14) fastFrames++; else fastFrames = 0;
    if (slowFrames > 20 && QUALITY > 0.5) { QUALITY = Math.max(0.5, QUALITY * clamp(Math.sqrt(18 / avg), 0.62, 0.9)); slowFrames = 0; fpsAcc.length = 0; resize(); }
    if (fastFrames > 300 && QUALITY < 1) { QUALITY = Math.min(1, QUALITY / 0.9); fastFrames = 0; fpsAcc.length = 0; resize(); }
  }
}

function init() {
  genWorld();
  buildScript();
  for (const A of ACTORS) A.finalize();
  CAMK.sort((a, b) => a.t - b.t);
  resolveHits();
  EVENTS.sort((a, b) => a.t - b.t);
  MUSIC.build();
  post = QS.has('nopost') ? null : createPost(view);
  if (!post) { view.remove(); wrapEl.insertBefore(scene, uiC); }
  resize(true);
  const t0 = parseFloat(QS.get('t'));
  seek(isFinite(t0) ? t0 : 0);
  if (TEST) {
    startEl.style.display = 'none'; render(T);
    window.__seek = t => { seek(t); render(T); return T; };
    window.__render = () => { render(T); return true; };
    window.__joint = (who, t, j) => ACTORS.find(a => a.id === who).joint(t, j).map(v => Math.round(v));
    window.__info = () => ({ W, H, parts: parts.length, webgl: !!post, fx: FX.length, ev: EVENTS.length });
  } else requestAnimationFrame(t => { lastNow = t; frame(t); });
}
init();
</script>
