<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World sandbox</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #ddd; font: 12px/1.4 system-ui, sans-serif; }
      #game-root, #game-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #ui-root { position: absolute; inset: 0; pointer-events: none; }
      #wb-panel { position: absolute; right: 6px; top: 6px; background: rgba(0,0,0,.55); padding: 6px 8px; pointer-events: auto; white-space: pre; font: 11px monospace; }
      #wb-loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #111; font-size: 18px; }
    </style>
  </head>
  <body>
    <div id="game-root">
      <canvas id="game-canvas"></canvas>
      <div id="ui-root"></div>
    </div>
    <script type="module" src="/src/sandbox/world.ts"></script>
  </body>
</html>
