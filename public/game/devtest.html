<!doctype html>
<html><head><meta charset="utf-8"><title>ROBLOX</title>
<link rel="stylesheet" href="/css/client.css">
<script type="importmap">{"imports":{"three":"/js/vendor/three.module.min.js"}}</script>
</head><body><div id="Viewport"><canvas id="c"></canvas></div><div id="Gui"></div>
<script type="module">
import * as THREE from 'three';
import { Game } from '/js/engine/Game.js';
import { Gui } from '/js/engine/Gui.js';
import { BotBrain } from '/js/engine/Bots.js';
import { Sword, RocketLauncher, Superball, PaintballGun, Slingshot, Trowel, Timebomb } from '/js/engine/Tools.js';
const canvas = document.getElementById('c');
const place = { update(){} };
const game = new Game({ canvas, place });
new Gui(game, document.getElementById('Gui'));
window.game = game;
const w = game.world;
w.brick([512, 1.2, 512], [0, -0.6, 0], 28);
w.brick([4,1.2,2],[10,0.6,-10],21);
w.brick([4,2.4,4],[-10,1.2,-12],23);
w.brick([8,1,8],[0,0.5,-30],24);
for (let i=0;i<6;i++) w.brick([4,1,4],[20, 0.5+i*1, -20 - i*4], 194);
const spawn = w.add({ size:[6,1.2,6], position:[0,0.6,10], color:194 });
game.addSpawn(spawn);
for (let i=0;i<10;i++) w.add({ size:[2,2,2], position:[-20+(i%3)*2.1, 1+Math.floor(i/3)*2.05, 0], color:[21,23,24,37][i%4], anchored:false });
game.starterPack = [(g)=>new Sword(g),(g)=>new RocketLauncher(g),(g)=>new Superball(g),(g)=>new PaintballGun(g),(g)=>new Slingshot(g),(g)=>new Trowel(g),(g)=>new Timebomb(g)];
game.setStats(['KOs','Wipeouts']);
const app = { colors:{head:24,torso:23,leftArm:24,rightArm:24,leftLeg:119,rightLeg:119}, face:'Smile', hats:['RedBaseballCap'], shirt:null, pants:null, tshirt:{style:'logo'} };
const me = game.addPlayer({ name:'Robloxian2008', appearance: app, isLocal:true });
game.spawnPlayer(me);
const names = ['coolkid2468','bloxxer4life','xXDarkNinjaXx'];
const hats = [['Tophat'],['TrafficCone'],['TeapotHat']];
names.forEach((n,i)=>{ const p = game.addPlayer({ name:n, isBot:true, appearance:{...app, hats:hats[i], tshirt:null, shirt:{style:'jacket',color:'#333333',color2:'#ffffff',color3:'#aa0000'}, pants:{style:'jeans'}} }); p.brain = new BotBrain(game,p,{wanderRadius:30}); game.spawnPlayer(p); });
game.chat(game.players[1], 'hi everyone');
game.chat(game.players[2], 'this game is cool');
game.chat(me, 'hello!');
game.setHint('Welcome to the test place!');
function resize(){ game.resize(innerWidth, innerHeight); }
addEventListener('resize', resize); resize();
game.start();
</script></body></html>
