<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Alley</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #view { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; background: #000; cursor: none; }
      #gate {
        position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center;
        transition: opacity 2.8s ease, background-color 2.8s ease; z-index: 2; cursor: pointer;
      }
      #gate .hint {
        font: 300 11px/1 ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
        letter-spacing: 0.42em; text-transform: lowercase; color: #8a8f99; opacity: 0;
        transition: opacity 2.5s ease 0.6s; user-select: none;
      }
      #gate .hints { display: flex; flex-direction: column; align-items: center; gap: 14px; }
      #gate .keys { font: 300 10px/1.9 ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; letter-spacing: 0.3em; color: #8a8f99; text-align: center; max-width: 92vw; opacity: 0; transition: opacity 2.5s ease 1.4s; user-select: none; }
      #gate.ready .hint { opacity: 0.55; }
      #gate.ready .keys { opacity: 0.3; }
      #gate.hidden { opacity: 0; pointer-events: none; }
      #load { position: fixed; left: 50%; bottom: 22%; width: 120px; height: 1px; margin-left: -60px; background: #1a1c20; transition: opacity 1.5s ease; }
      #load i { display: block; height: 100%; width: 0%; background: #5b616c; transition: width 0.4s ease; }
      #gate.ready #load { opacity: 0; }
      #gate.paused { opacity: 1; background: rgba(0, 0, 0, 0.72); pointer-events: auto; }
      #gate.paused .hint { opacity: 0.5; transition-delay: 0s; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="gate"><div class="hints"><span class="hint">click to walk</span><span class="keys">e spray can · tab colours · z undo · q pick up · hold click to throw</span></div><div id="load"><i></i></div></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
