<script>
'use strict';
/* ==========================================================================
   GOJO SATORU vs RYOMEN SUKUNA — a 60 second procedural anime fight.
   Everything is generated in code: Canvas2D scene, WebGL post-processing
   (bloom, chromatic aberration, shockwave distortion, impact-frame modes),
   particle systems, a skeletal rig for both fighters, and WebAudio SFX.
   ========================================================================== */

const DURATION = 60;
const QS = new URLSearchParams(location.search);
const TEST = QS.has('test');
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const invLerp = (a, b, x) => clamp((x - a) / (b - a), 0, 1);
const smoothstep = (a, b, x) => { const t = invLerp(a, b, x); return t * t * (3 - 2 * t); };
const Ease = {
  linear: t => t,
  in: t => t * t,
  out: t => 1 - (1 - t) * (1 - t),
  inout: t => (t < 0.5 ? 2 * t * t : 1 - 2 * (1 - t) * (1 - t)),
  in3: t => t * t * t,
  out3: t => 1 - (1 - t) ** 3,
  inout3: t => (t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2),
  in5: t => t ** 5,
  out5: t => 1 - (1 - t) ** 5,
  expo: t => (t >= 1 ? 1 : 1 - 2 ** (-10 * t)),
  expoIn: t => (t <= 0 ? 0 : 2 ** (10 * t - 10)),
  back: t => { const c = 1.70158, c3 = c + 1; return 1 + c3 * (t - 1) ** 3 + c * (t - 1) ** 2; },
  cut: t => (t < 1 ? 0 : 1),
};

// ---------------------------------------------------------------- random
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rng = mulberry32(1);
const reseed = s => { rng = mulberry32(s); };
const rnd = (a = 0, b = 1) => a + (b - a) * rng();
const rsym = a => (rng() * 2 - 1) * a;
const chance = p => rng() < p;
const pick = arr => arr[(rng() * arr.length) | 0];
function hash1(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453123; return s - Math.floor(s); }
function noise1(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return (hash1(i) * (1 - u) + hash1(i + 1) * u) * 2 - 1; }
function fbm1(x) { return noise1(x) * 0.6 + noise1(x * 2.13 + 17.1) * 0.28 + noise1(x * 4.7 + 41.3) * 0.12; }

// ------------------------------------------------------- keyframe tracks
class Track {
  constructor(v0 = 0) { this.k = []; this.v0 = v0; this.dirty = false; }
  add(t, v, e = 'inout') { this.k.push([t, v, e]); this.dirty = true; return this; }
  at(T) {
    const k = this.k, n = k.length;
    if (!n) return this.v0;
    if (this.dirty) { k.sort((a, b) => a[0] - b[0]); this.dirty = false; }
    if (T <= k[0][0]) return k[0][1];
    if (T >= k[n - 1][0]) return k[n - 1][1];
    let lo = 0, hi = n - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (k[m][0] <= T) lo = m; else hi = m; }
    const a = k[lo], b = k[hi];
    const u = (T - a[0]) / (b[0] - a[0] || 1e-9);
    return a[1] + (b[1] - a[1]) * Ease[b[2]](u);
  }
}
// attack / exponential-decay envelope
function envAD(T, t0, a, d) { const x = T - t0; if (x < 0) return 0; if (x < a) return a > 0 ? x / a : 1; return Math.exp(-(x - a) / d); }
// trapezoid window with fade-in/out
function win(T, t0, t1, fi = 0.1, fo = 0.1) {
  if (T < t0 || T > t1) return 0;
  return Math.min(1, (T - t0) / Math.max(fi, 1e-6), (t1 - T) / Math.max(fo, 1e-6));
}
function mixRGB(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
function rgb(c, a = 1) { return `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`; }
function hexRGB(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
class ColorTrack {
  constructor() { this.k = []; }
  add(t, hex, e = 'inout') { this.k.push([t, typeof hex === 'string' ? hexRGB(hex) : hex, e]); this.k.sort((a, b) => a[0] - b[0]); return this; }
  at(T) {
    const k = this.k, n = k.length;
    if (T <= k[0][0]) return k[0][1];
    if (T >= k[n - 1][0]) return k[n - 1][1];
    let i = 0; while (i < n - 1 && k[i + 1][0] <= T) i++;
    const a = k[i], b = k[i + 1];
    return mixRGB(a[1], b[1], Ease[b[2]]((T - a[0]) / (b[0] - a[0])));
  }
}

// ==========================================================================
//  AUDIO — fully procedural WebAudio sound design (no samples)
// ==========================================================================
const SFX = (() => {
  let ac = null, master, bus, lp, comp, windGain, windFilt, noiseBuf, curve;
  const S = { silent: false, muted: false };
  S.init = () => {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    master = ac.createGain(); master.gain.value = S.muted ? 0 : 0.9;
    comp = ac.createDynamicsCompressor();
    comp.threshold.value = -18; comp.knee.value = 10; comp.ratio.value = 6;
    comp.attack.value = 0.002; comp.release.value = 0.2;
    lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 18000; lp.Q.value = 0.5;
    bus = ac.createGain();
    bus.connect(lp); lp.connect(comp); comp.connect(master); master.connect(ac.destination);
    const len = (ac.sampleRate * 2) | 0;
    noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    curve = new Float32Array(2048);
    for (let i = 0; i < 2048; i++) { const x = i / 1023.5 - 1; curve[i] = Math.tanh(x * 4); }
    const w = ac.createBufferSource(); w.buffer = noiseBuf; w.loop = true;
    windFilt = ac.createBiquadFilter(); windFilt.type = 'bandpass'; windFilt.frequency.value = 420; windFilt.Q.value = 0.55;
    windGain = ac.createGain(); windGain.gain.value = 0;
    w.connect(windFilt); windFilt.connect(windGain); windGain.connect(master); w.start();
  };
  S.ok = () => !!ac && !S.silent;
  S.pause = () => { if (ac && ac.state === 'running') ac.suspend(); };
  S.resume = () => { if (ac && ac.state === 'suspended') ac.resume(); };
  S.setMuted = m => { S.muted = m; if (master) master.gain.setTargetAtTime(m ? 0 : 0.9, ac.currentTime, 0.02); };
  let lastWind = -1;
  S.wind = (level, freq) => {
    if (!ac) return;
    if (Math.abs(level - lastWind) < 0.002) return;
    lastWind = level;
    windGain.gain.setTargetAtTime(level, ac.currentTime, 0.12);
    if (freq) windFilt.frequency.setTargetAtTime(freq, ac.currentTime, 0.3);
  };

  // ---- building blocks
  const now = () => ac.currentTime + 0.004;
  function G(t, peak, a, d) {
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(Math.max(peak, 0.0002), t + Math.max(a, 0.001));
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
    return g;
  }
  function N(t, dur, rate = 1) {
    const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true; s.playbackRate.value = rate;
    s.start(t, Math.random() * 1.8); s.stop(t + dur + 0.1); return s;
  }
  function O(type, t, dur, f0, f1) {
    const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    o.start(t); o.stop(t + dur + 0.1); return o;
  }
  function F(type, f, q = 0.7) { const b = ac.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; }
  function D() { const w = ac.createWaveShaper(); w.curve = curve; return w; }
  function wire(...n) { for (let i = 0; i < n.length - 1; i++) n[i].connect(n[i + 1]); return n[n.length - 1]; }

  // ---- sound effects
  S.hit = (p = 0.5) => {
    if (!S.ok()) return; const t = now();
    wire(O('sine', t, 0.3 + 0.3 * p, 150 + 90 * p, 40), G(t, 0.5 + 0.45 * p, 0.002, 0.1 + 0.25 * p), bus);
    wire(N(t, 0.3), F('bandpass', 1300 + 1100 * p, 0.9), G(t, 0.35 + 0.5 * p, 0.001, 0.04 + 0.1 * p), bus);
    wire(N(t, 0.1, 1.5), F('highpass', 5000), G(t, 0.1 + 0.2 * p, 0.001, 0.025), bus);
    if (p > 0.6) {
      wire(O('sine', t, 1.4 * p, 68, 24), G(t, 0.8 * p, 0.004, 0.35 + 0.5 * p), bus);
      wire(N(t, 1.2 * p, 0.6), F('lowpass', 700), D(), G(t, 0.45 * p, 0.003, 0.3 + 0.4 * p), bus);
    }
  };
  S.block = (p = 0.4) => {
    if (!S.ok()) return; const t = now();
    S.hit(p * 0.7);
    wire(O('triangle', t, 0.25, 2200, 1500), G(t, 0.06 + 0.06 * p, 0.001, 0.12), bus);
    wire(N(t, 0.12, 1.3), F('bandpass', 3200, 2), G(t, 0.2 * p + 0.05, 0.001, 0.05), bus);
  };
  S.whoosh = (p = 0.5, dur = 0.25) => {
    if (!S.ok()) return; const t = now();
    const bp = F('bandpass', 400, 1.8);
    bp.frequency.setValueAtTime(320, t);
    bp.frequency.exponentialRampToValueAtTime(2600, t + dur * 0.55);
    bp.frequency.exponentialRampToValueAtTime(500, t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.32 * p, t + dur * 0.5);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    wire(N(t, dur), bp, g, bus);
  };
  S.blink = () => {
    if (!S.ok()) return; const t = now();
    wire(O('sine', t, 0.07, 700, 5200), G(t, 0.12, 0.002, 0.06), bus);
    wire(N(t, 0.08, 2), F('highpass', 5000), G(t, 0.09, 0.001, 0.04), bus);
  };
  S.slash = (p = 0.5) => {
    if (!S.ok()) return; const t = now();
    wire(N(t, 0.2, 1.3), F('highpass', 2800, 0.8), G(t, 0.3 + 0.3 * p, 0.002, 0.06 + 0.06 * p), bus);
    wire(O('sawtooth', t, 0.07, 4200, 900), F('bandpass', 2500, 2), G(t, 0.07 * p + 0.03, 0.001, 0.05), bus);
    wire(O('sine', t + 0.01, 0.4, 6200, 5600), G(t + 0.01, 0.02 + 0.02 * p, 0.002, 0.2), bus);
  };
  S.boom = (p = 1, dur = 1.5) => {
    if (!S.ok()) return; const t = now();
    const f = F('lowpass', 2500, 0.5);
    f.frequency.setValueAtTime(3200, t); f.frequency.exponentialRampToValueAtTime(90, t + dur);
    wire(N(t, dur + 0.2, 0.7), f, D(), G(t, 0.85 * p, 0.01, dur * 0.6), bus);
    wire(O('sine', t, dur, 82, 22), G(t, 0.9 * p, 0.01, dur * 0.5), bus);
    wire(O('triangle', t, dur * 0.5, 170, 40), G(t, 0.3 * p, 0.005, dur * 0.25), bus);
  };
  S.charge = (dur = 2, f = 80, p = 0.6) => {
    if (!S.ok()) return; const t = now();
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.2 * p, t + dur * 0.92);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.12);
    const f2 = F('lowpass', 200, 4);
    f2.frequency.setValueAtTime(150, t); f2.frequency.exponentialRampToValueAtTime(4200, t + dur);
    const trem = ac.createGain(); trem.gain.value = 0.6;
    const lfo = O('sine', t, dur + 0.2, 5, 30); const lg = ac.createGain(); lg.gain.value = 0.4;
    lfo.connect(lg); lg.connect(trem.gain);
    O('sawtooth', t, dur + 0.2, f, f * 4).connect(f2);
    O('sawtooth', t, dur + 0.2, f * 1.013, f * 4.06).connect(f2);
    O('square', t, dur + 0.2, f / 2, f * 2).connect(f2);
    wire(f2, trem, g, bus);
  };
  S.drone = (dur = 4, f = 55, p = 0.5) => {
    if (!S.ok()) return; const t = now();
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.15 * p, t + dur * 0.35);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    const f2 = F('lowpass', 420, 1.2);
    [1, 1.5, 2.003, 0.5].forEach((m, i) => O(i % 2 ? 'sawtooth' : 'triangle', t, dur, f * m, f * m * 1.004).connect(f2));
    wire(f2, g, bus);
  };
  S.heart = (p = 0.7) => {
    if (!S.ok()) return; const t = now();
    wire(O('sine', t, 0.2, 78, 38), G(t, 0.75 * p, 0.005, 0.13), bus);
    wire(O('sine', t + 0.2, 0.2, 72, 36), G(t + 0.2, 0.45 * p, 0.005, 0.1), bus);
  };
  S.tink = () => {
    if (!S.ok()) return; const t = now();
    wire(O('sine', t, 0.4, 2400, 2350), G(t, 0.09, 0.001, 0.22), bus);
    wire(O('sine', t, 0.3, 3900, 3850), G(t, 0.04, 0.001, 0.14), bus);
  };
  S.rumble = (dur = 2, p = 0.5) => {
    if (!S.ok()) return; const t = now();
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.45 * p, t + dur * 0.4);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    wire(N(t, dur, 0.4), F('lowpass', 150, 0.9), g, bus);
  };
  S.crackle = (dur = 0.4, p = 0.4) => {
    if (!S.ok()) return; const t = now();
    const n = Math.min(48, Math.ceil(dur * 40));
    for (let i = 0; i < n; i++) {
      const tt = t + Math.random() * dur;
      wire(N(tt, 0.03, 1.5), F('bandpass', 2000 + Math.random() * 4500, 2), G(tt, (0.1 + Math.random() * 0.2) * p, 0.001, 0.012 + Math.random() * 0.02), bus);
    }
  };
  S.glass = (p = 0.5) => {
    if (!S.ok()) return; const t = now();
    for (let i = 0; i < 9; i++) {
      const tt = t + Math.random() * 0.28, f = 2500 + Math.random() * 5200;
      wire(O('sine', tt, 0.35, f, f * 0.98), G(tt, 0.04 * p, 0.001, 0.1 + Math.random() * 0.2), bus);
    }
    wire(N(t, 0.3, 1.4), F('highpass', 3500), G(t, 0.22 * p, 0.002, 0.16), bus);
  };
  S.fire = (dur = 2, p = 0.6) => {
    if (!S.ok()) return; const t = now();
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.32 * p, t + Math.min(0.4, dur * 0.3));
    g.gain.setValueAtTime(0.32 * p, t + dur * 0.8); g.gain.linearRampToValueAtTime(0.0001, t + dur);
    const bp = F('bandpass', 700, 0.4);
    const lfo = O('sine', t, dur, 9, 14); const lg = ac.createGain(); lg.gain.value = 300; lfo.connect(lg); lg.connect(bp.frequency);
    wire(N(t, dur, 0.8), bp, g, bus);
    wire(N(t, dur, 0.3), F('lowpass', 220), G(t, 0.3 * p, dur * 0.3, dur * 0.7), bus);
  };
  S.taiko = (p = 0.7) => {
    if (!S.ok()) return; const t = now();
    wire(O('sine', t, 0.5, 108, 52), G(t, 0.8 * p, 0.003, 0.28), bus);
    wire(N(t, 0.12), F('bandpass', 260, 1.2), G(t, 0.4 * p, 0.001, 0.06), bus);
    wire(N(t, 0.05, 1.5), F('highpass', 3000), G(t, 0.1 * p, 0.001, 0.02), bus);
  };
  S.ring = (dur = 2.5, p = 1) => {
    if (!ac || S.silent) return; const t = now();
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.045 * p, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    wire(O('sine', t, dur, 3950, 3880), g, master);
  };
  S.sting = (p = 0.6, base = 110) => {
    if (!S.ok()) return; const t = now();
    const f = F('lowpass', 3000, 1);
    f.frequency.setValueAtTime(5200, t); f.frequency.exponentialRampToValueAtTime(380, t + 1.2);
    [1, 1.5, 2, 3, 4.005].forEach(m => O('sawtooth', t, 1.3, base * m, base * m * 0.995).connect(f));
    wire(f, G(t, 0.26 * p, 0.004, 0.9), bus);
    wire(O('sine', t, 1, base / 2, base / 2.2), G(t, 0.5 * p, 0.004, 0.6), bus);
  };
  S.shimmer = (dur = 1.5, p = 0.5) => {
    if (!S.ok()) return; const t = now();
    for (let i = 0; i < 16; i++) {
      const tt = t + (i * dur) / 16, f = 1800 + i * 240 + Math.random() * 200;
      wire(O('sine', tt, 0.5, f, f * 1.01), G(tt, 0.045 * p, 0.005, 0.35), bus);
    }
  };
  S.swell = (dur = 0.8, p = 0.6) => {
    if (!S.ok()) return; const t = now();

function genWorld() {
  const R = mulberry32(4242);
  World.stars = Array.from({ length: 260 }, () => ({ x: R() * 1.4 - 0.2, y: R() * 0.8 - 0.1, s: 0.5 + R() * 1.6, p: R() * 100 }));
  World.layers = [
    { p: 0.1, col: '#151a3c', ...genSkyline(R, 0.1, 160, 520, 0) },
    { p: 0.24, col: '#0e1230', ...genSkyline(R, 0.24, 120, 460, 0.05) },
    { p: 0.45, col: '#080a1c', ...genSkyline(R, 0.45, 90, 380, 0.1) },

  World.rubble = [];
  for (let i = 0; i < 150; i++) {
    const x = -3400 + R() * 6800, s = 6 + R() * 22, pts = [];
    const n = 5 + ((R() * 3) | 0);
    for (let k = 0; k < n; k++) { const a = Math.PI + (k / (n - 1)) * Math.PI; pts.push([x + Math.cos(a) * s * (0.8 + R() * 0.5), Math.min(2, Math.sin(a) * s * (0.4 + R() * 0.5))]); }
    World.rubble.push(pts);
  }
  World.clouds = Array.from({ length: 9 }, (_, i) => ({ x: -2600 + i * 650 + R() * 300, y: -760 - R() * 520, s: 220 + R() * 260, k: (R() * 3) | 0, v: 6 + R() * 10 }));
}
function resetWorld() {
  World.buildings = BUILDING_DEFS.map((d, i) => new Building(d, 900 + i * 17));
  World.craters = []; World.cracks = []; World.scorches = []; World.trenches = [];
  World.ruined = false;
}

    while (L > 0) { const s = 12 + rng() * 26; px += dir * s; py = clamp(py + rsym(7), 1, 30); pts.push([px, py]); L -= s; }

function addScorch(x, r, T) { World.scorches.push({ x, r, t: T }); }

  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, rgb(top)); g.addColorStop(clamp(hy / H, 0.05, 0.98), rgb(hor)); g.addColorStop(1, rgb(hor));

  const sOff = -cam.x * 0.02 * SC, sOffY = -cam.y * 0.02 * SC;
  c.fillStyle = '#dfe6ff';
  for (const s of World.stars) {

    const tw = 0.45 + 0.55 * Math.abs(noise1(T * 1.3 + s.p));

function drawSkyline(c, T, lightFlash) {
  const hor = SKY_HOR.at(T);
  for (let i = 0; i < World.layers.length; i++) {
    const L = World.layers[i];
    setWorldTransform(c, L.p);
    c.translate(0, 250 * (1 - L.p));
    const base = hexRGB(L.col);
    const col = mixRGB(base, hor, 0.18 + (2 - i) * 0.12);
    const lit = mixRGB(col, [255, 170, 120], lightFlash * 0.4);
    c.fillStyle = rgb(lit);
    c.fill(World.ruined ? L.ruin : L.path);
    if (!World.ruined && i > 0) { c.fillStyle = `rgba(255,200,120,${0.35 + 0.1 * i})`; c.fill(L.win); }

// ---------------------------------------------------------- update
function updateParticles(dt) {
  if (dt <= 0) return;
  const nA = attractors.length;
  let j = 0, nd = 0;
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0) continue;
    if (p.at && nA) {
      let dead = false, inf = false;
      for (let k = 0; k < nA; k++) {
        const A = attractors[k], dx = A.x - p.x, dy = A.y - p.y, d2 = dx * dx + dy * dy;
        if (d2 > A.r * A.r) continue;
        const d = Math.sqrt(d2) + 0.001;
        if (d < A.kill) { dead = true; break; }
        const f = A.s * (0.25 + 0.75 * (1 - d / A.r)) * p.at;
        p.vx += ((dx / d) * f - (dy / d) * f * A.swirl) * dt;
        p.vy += ((dy / d) * f + (dx / d) * f * A.swirl) * dt;
        inf = true;

      if (dead) continue;

    } else if (p.t === PT.DEBRIS) p.g = p.g0;
    if (p.drag) { const k = Math.exp(-p.drag * dt); p.vx *= k; p.vy *= k; }
    p.vy += p.g * dt;
    if (p.t === PT.DUST) p.vx += windX * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.s += p.gs * dt;
    p.rot += p.vr * dt;

      p.y = -p.s * 0.35; p.vy *= -0.3; p.vx *= 0.6; p.vr *= 0.6;
      if (Math.abs(p.vy) < 50) p.vy = 0;
    }
    if (p.t === PT.DUST) nd++;
    parts[j++] = p;
  }
  parts.length = j; dustCount = nd;
}

function drawParticles(c, layer, T) {

      } else {
        c.fillStyle = 'rgba(200,230,255,0.55)'; c.fill();
        c.strokeStyle = 'rgba(255,255,255,0.8)'; c.lineWidth = 0.8; c.stroke();

    if (p.f !== layer) continue;

    } else if (p.t === PT.SPARK || p.t === PT.STREAK) {
      const bucket = (Math.min(3, (k * 4) | 0));
      const key = p.c + '|' + bucket + '|' + (p.w > 2.5 ? 1 : 0) + '|' + p.t;
      let arr = _sparkBuckets.get(key); if (!arr) { arr = []; _sparkBuckets.set(key, arr); }

function simStep(T0, T1) {

  gameT = T1;

}

    if (imp.mode in SIL_MODES) U.ca = Math.min(U.ca, 0.01);
  }
  if (Tr >= FREEZE_T && freezeLook) { const k = clamp((T - FREEZE_T) / 0.15, 0, 1); U.sat = lerp(U.sat, freezeLook.sat, k); U.con = lerp(U.con, freezeLook.con, k); U.grain = 0.05 + 0.06 * k; U.vig = lerp(U.vig, 0.95, k); U.tint[0] *= lerp(1, freezeLook.tint[0], k); U.tint[1] *= lerp(1, freezeLook.tint[1], k); U.tint[2] *= lerp(1, freezeLook.tint[2], k); }
  const fl = flashAt(T), wo = WHITEOUT.at(Tr);
  U.flash[0] = fl[0]; U.flash[1] = fl[1]; U.flash[2] = fl[2]; U.flash[3] = Math.max(fl[3], wo);
  if (imp && imp.mode === 'white') { U.flash.set([1, 1, 1, 1]); }
  if (imp && imp.mode === 'black') { U.flash.set([0, 0, 0, 1]); }

  const waves = [], lenses = [];

  }

  U.waves.fill(0); U.lens.fill(0);
  for (let i = 0; i < Math.min(6, waves.length); i++) {
    const w = waves[i], s = w2s(w[0], w[1]);
    U.waves[i * 4] = s[0] / W; U.waves[i * 4 + 1] = 1 - s[1] / H; U.waves[i * 4 + 2] = (w[2] * SC * cam.z) / H; U.waves[i * 4 + 3] = w[3];
  }
  for (let i = 0; i < Math.min(3, lenses.length); i++) {
    const l = lenses[i], s = w2s(l[0], l[1]);
    U.lens[i * 4] = s[0] / W; U.lens[i * 4 + 1] = 1 - s[1] / H; U.lens[i * 4 + 2] = (l[2] * SC * cam.z) / H; U.lens[i * 4 + 3] = l[3];
  }

  else U.zoom[2] = 0;
  return U;
}
let ZOOM_FOCUS = () => [cam.x, cam.y];

function render(T) {
  const Tr = Math.min(T, FREEZE_T);
  computeCam(Tr);
  const imp = impactAt(Tr);
  if (imp && imp.mode !== 'white' && imp.mode !== 'black') {
    const k = imp.mode in SIL_MODES ? 0.55 : 0.25;
    cam.x = lerp(cam.x, imp.im.x, k); cam.y = lerp(cam.y, imp.im.y, k);

    cam.z *= imp.mode in SIL_MODES ? zf : 1 + (zf - 1) * 0.4;
    cam.r += imp.im.rot * (imp.mode in SIL_MODES ? 1 : 0.4);
  }
  LIGHTS = [];
  for (const e of FX) {
    if (!e.light || Tr < e.t0 || Tr > e.t1) continue;
    const L = e.light(Tr, (Tr - e.t0) / Math.max(1e-6, e.t1 - e.t0));

  }

  c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  const shot = activeShot(Tr);
  if (imp && imp.mode in SIL_MODES) drawImpactFrame(c, Tr, imp);
  else if (shot) { shot.draw(c, Tr, (Tr - shot.t0) / (shot.t1 - shot.t0), shot); }
  else drawWorldScene(c, Tr);
  for (const sh of SHATTERS) {
    if (Tr < sh.t0 || Tr > sh.t0 + sh.dur) continue;
    if (!sh.img || sh.img.width !== W || sh.img.height !== H) prepShatter(sh);

}
function activeShot(T) { for (const s of SHOTS) if (T >= s.t0 && T < s.t1) return s; return null; }
function prepShatter(sh) {
  if (sh.link && sh.link.shards && sh.link.shW === W) sh.shards = sh.link.shards;
  else { sh.shards = makeShards(W * sh.fx, H * sh.fy, 99); if (sh.link) { sh.link.shards = sh.shards; sh.link.shW = W; } }
  sh.img = makeCanvas(W, H);
  const c2 = sh.img.getContext('2d');
  sh.src(c2, sh.t0 - 0.001);
  c2.setTransform(1, 0, 0, 1, 0, 0);
}

// ------------------------------------------------------------ UI layer
function drawUI(T, realT) {
  const c = uctx;
  c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, W, H);
  const lb = GRADE.letterbox.at(T);
  if (lb > 0.002) { const h = H * 0.125 * lb; c.fillStyle = '#000'; c.fillRect(0, 0, W, h + 1); c.fillRect(0, H - h - 1, W, h + 1); }
  for (const t of TITLES) if (realT >= t.t0 && realT <= t.t1) drawTitle(c, t, realT);
  if (showHud) {
    const fps = fpsAcc.length ? (1000 / (fpsAcc.reduce((a, b) => a + b, 0) / fpsAcc.length)).toFixed(0) : '-';
    document.getElementById('hud').textContent = `t ${realT.toFixed(2)}s  fps ${fps}  res ${W}x${H}  particles ${parts.length}  ${post ? 'webgl' : '2d'}  ${CHAR_FPS ? 'on-twos' : 'smooth'}`;
  }
}
function drawTitle(c, t, T) {
  const age = T - t.t0, dur = t.t1 - t.t0;
  const kin = clamp(age / 0.12, 0, 1), kout = clamp((dur - age) / 0.22, 0, 1);
  const a = Math.min(kin * 1.4, kout);
  if (a <= 0) return;
  const s = H / 1080;
  const jit = age < 0.25 ? (1 - age / 0.25) * 6 * s : 0;
  c.save();
  c.textBaseline = 'middle';
  if (t.style === 'small') {
    c.globalAlpha = a; c.textAlign = 'left'; c.fillStyle = '#fff';
    c.shadowColor = 'rgba(0,0,0,0.8)'; c.shadowBlur = 10 * s;
    c.font = `900 ${Math.round(48 * s)}px ${JP_FONT}`; c.fillText(t.jp, W * 0.06, H * 0.77);
    c.fillRect(W * 0.06, H * 0.77 + 30 * s, 190 * s * Ease.out3(kin), 2 * s);
    c.font = `700 ${Math.round(14 * s)}px ${EN_FONT}`; c.fillText(t.en.split('').join(' '), W * 0.06, H * 0.77 + 52 * s);
    c.restore(); return;
  }
  if (t.style === 'end') {
    c.globalAlpha = a * 0.92; c.textAlign = 'center'; c.fillStyle = t.col || '#fff';
    c.font = `900 ${Math.round((t.size || 72) * s)}px ${JP_FONT}`; c.shadowColor = '#000'; c.shadowBlur = 16 * s;
    c.fillText(t.jp, t.x * W, t.y * H);
    c.restore(); return;
  }
  if (t.style === 'chant') {
    c.font = `900 ${Math.round((t.size || 64) * s)}px ${JP_FONT}`;
    c.textAlign = 'center';
    const x = t.x * W, y0 = t.y * H, step = (t.size || 64) * s * 1.12;
    c.globalAlpha = a * 0.92;
    c.shadowColor = t.col || '#b070ff'; c.shadowBlur = 24 * s;
    c.fillStyle = '#fff';
    [...t.jp].forEach((ch, i) => c.fillText(ch, x + rsymT(T, i) * jit, y0 + i * step));
    c.restore(); return;
  }
  const big = (t.size || (t.style === 'impact' ? 230 : 150)) * s;
  const sc = 1 + (1 - Ease.out3(kin)) * (t.style === 'impact' ? 0.9 : 0.55);
  let x = t.x !== undefined ? t.x * W : W / 2, y = t.y !== undefined ? t.y * H : H * 0.45;
  x += noise1(T * 40) * jit; y += noise1(T * 37 + 4) * jit;
  const tc = titleCanvas(t, big, s);
  c.translate(x, y); c.scale(sc, sc); c.rotate(t.rot || 0);
  if (kin < 1) { c.globalAlpha = a * 0.3; c.drawImage(tc.cv, -tc.cx, -tc.cy - big * 0.07); c.drawImage(tc.cv, -tc.cx, -tc.cy + big * 0.07); }

}
// technique names are rendered once (with their glow) into a bitmap, then transformed per frame
function titleCanvas(t, big, s) {
  if (t._tc && t._tcH === H) return t._tc;
  const cv = makeCanvas(4, 4); let x = cv.getContext('2d');
  const jpFont = `900 ${Math.round(big)}px ${JP_FONT}`, enFont = `italic 900 ${Math.round(big * 0.2)}px ${EN_FONT}`, en = t.en ? t.en.split('').join(' ') : '';
  x.font = jpFont; const tw = x.measureText(t.jp).width;
  x.font = enFont; const ew = en ? x.measureText(en).width : 0;
  const pad = Math.ceil(70 * s), w = Math.ceil(Math.max(tw, ew) + pad * 2), h = Math.ceil(big * (en ? 1.95 : 1.3) + pad * 2);
  cv.width = w; cv.height = h; x = cv.getContext('2d');

  x.font = jpFont;
  x.shadowColor = t.col || '#fff'; x.shadowBlur = 40 * s;
  x.strokeStyle = t.style === 'impact' ? '#000' : 'rgba(0,0,0,0.85)'; x.lineWidth = big * 0.09; x.strokeText(t.jp, cx, cy);
  x.shadowBlur = 0;
  x.fillStyle = t.style === 'impact' ? (t.fill || '#0a0003') : '#ffffff'; x.fillText(t.jp, cx, cy);
  if (t.style === 'impact') { x.strokeStyle = t.col || '#ff2030'; x.lineWidth = big * 0.025; x.strokeText(t.jp, cx, cy); }
  if (en) { x.font = enFont; x.fillStyle = t.col || '#fff'; x.shadowColor = '#000'; x.shadowBlur = 8 * s; x.fillText(en, cx, cy + big * 0.72); }
  t._tc = { cv, cx, cy }; t._tcH = H;
  return t._tc;
}
function rsymT(T, i) { return noise1(T * 30 + i * 13.7); }

// ------------------------------------------------------------ loop & input
const startEl = document.getElementById('start'), endEl = document.getElementById('end'), hudEl = document.getElementById('hud');
function begin() {
  SFX.init(); SFX.resume();
  startEl.classList.add('hide'); endEl.classList.add('hide');
  if (ended || T >= DURATION) { seek(0); ended = false; }
  playing = true; started = true;
}
function restart() { seek(0); ended = false; endEl.classList.add('hide'); if (started) { playing = true; SFX.resume(); } }
function onEnd() { ended = true; playing = false; setTimeout(() => { if (ended) endEl.classList.remove('hide'); }, 900); }
startEl.addEventListener('click', begin);
endEl.addEventListener('click', () => { restart(); playing = true; });
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if (!started) return begin(); if (ended) return restart(); playing = !playing; playing ? SFX.resume() : SFX.pause(); }
  else if (e.code === 'KeyR') { if (!started) begin(); restart(); }
  else if (e.code === 'KeyM') SFX.setMuted(!SFX.muted);
  else if (e.code === 'KeyF') { if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); else document.exitFullscreen && document.exitFullscreen(); }
  else if (e.code === 'KeyD') { showHud = !showHud; hudEl.textContent = ''; }
  else if (e.code === 'KeyA') { CHAR_FPS = CHAR_FPS ? 0 : 30; }
  else if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { seek(T + (e.code === 'ArrowRight' ? 2 : -2)); ended = false; endEl.classList.add('hide'); }
  else if (!started && (e.code === 'Enter')) begin();
});
window.addEventListener('resize', () => resize());

let slowFrames = 0, fastFrames = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - lastNow) / 1000; lastNow = now;
  if (dt > 0 && dt < 1) { fpsAcc.push(dt * 1000); if (fpsAcc.length > 40) fpsAcc.shift(); }
  dt = Math.min(dt, 0.1); // keep real-time sync on slow machines; bigger gaps (tab switch) are skipped
  if (playing && !ended) {
    const T1 = Math.min(DURATION, T + dt);
    simStep(T, T1); T = T1;
    SFX.wind(GRADE.wind.at(Math.min(T, FREEZE_T)));
    if (T >= DURATION) onEnd();
  }
  render(T);
  // adaptive resolution
  if (playing && fpsAcc.length >= 40) {
    const avg = fpsAcc.reduce((a, b) => a + b, 0) / fpsAcc.length;
    if (avg > 26) slowFrames++; else slowFrames = 0;
    if (avg < 15) fastFrames++; else fastFrames = 0;
    if (slowFrames > 45 && QUALITY > 0.55) { QUALITY = Math.max(0.55, QUALITY * 0.85); slowFrames = 0; fpsAcc.length = 0; resize(); }
    if (fastFrames > 240 && QUALITY < 1) { QUALITY = Math.min(1, QUALITY / 0.9); fastFrames = 0; fpsAcc.length = 0; resize(); }
  }
}

function init() {
  genWorld();
  buildScript();
  for (const A of [G, S]) A.finalize();
  CAMK.sort((a, b) => a.t - b.t);
  resolveHits();
  EVENTS.sort((a, b) => a.t - b.t);
  post = QS.has('nopost') ? null : createPost(view);
  if (!post) { view.remove(); wrapEl.insertBefore(scene, uiC); }
  resize(true);
  const t0 = parseFloat(QS.get('t'));
  seek(isFinite(t0) ? t0 : 0);
  if (TEST) { startEl.style.display = 'none'; render(T); }
  else requestAnimationFrame(t => { lastNow = t; frame(t); });
  window.__seek = t => { seek(t); render(T); return T; };
  window.__render = () => { render(T); return true; };
  window.__joint = (who, t, j) => (who === 'g' ? G : S).joint(t, j).map(v => Math.round(v));
  window.__info = () => ({ W, H, parts: parts.length, webgl: !!post, fx: FX.length, ev: EVENTS.length });
}
init();
</script>
