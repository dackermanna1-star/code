<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOOM</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #screen { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; image-rendering: pixelated; cursor: crosshair; outline: none; }
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px;
    font: 14px/1.5 monospace; color: #b0b0b0; background: #000; text-align: center; padding: 16px; box-sizing: border-box; }
  #boot.hidden { display: none; }
  #boot .err { color: #f55; white-space: pre-wrap; max-width: 760px; }
  #fps { position: fixed; right: 6px; top: 4px; font: 11px monospace; color: #7f7; pointer-events: none; }
  #wadinput { display: none; }
</style>
</head>
<body>
<canvas id="screen" tabindex="0"></canvas>
<div id="boot">
  <div id="boot-msg">Loading DOOM…</div>
</div>
<div id="fps"></div>
<input type="file" id="wadinput" accept=".wad,.WAD">
<script type="module" src="src/main.js"></script>
</body>
</html>
