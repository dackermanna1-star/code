<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dead Center PS1</title>
  <style>
    html, body { margin: 0; padding: 0; background: #000; overflow: hidden; height: 100%; }
    body { font-family: "Courier New", ui-monospace, monospace; color: #ddd; user-select: none; }
    #game { position: fixed; inset: 0; display: block; image-rendering: pixelated; }
    #hud { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; image-rendering: pixelated; }
    #ui { position: fixed; inset: 0; pointer-events: none; }
    #ui > * { pointer-events: auto; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <canvas id="hud"></canvas>
  <div id="ui"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
