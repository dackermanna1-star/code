<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prop Destruction Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: full-bleed 3D viewport; instrument panels float over it like the
   painted markings of a crash-test bay — pale panels, graphite ink, one
   hazard-yellow signal colour. */
:root {
  color-scheme: light;
  --panel: rgba(248, 248, 245, 0.9);
  --panel-solid: #f6f6f3;
  --ink: #1b1e22;
  --ink-2: #555b63;
  --ink-3: #8a9098;
  --line: rgba(27, 30, 34, 0.14);
  --line-2: rgba(27, 30, 34, 0.07);
  --signal: #f5b700;
  --signal-ink: #1b1e22;
  --danger: #c8372d;
  --well: rgba(27, 30, 34, 0.06);
  --shadow: 0 1px 2px rgba(20, 24, 30, 0.12), 0 8px 28px rgba(20, 24, 30, 0.16);
  --display: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --body: 'Barlow', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --r: 6px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: #b4bcc4; color: var(--ink); font: 14px/1.35 var(--body);
  overflow: hidden; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none;
  touch-action: none;
}
#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; cursor: crosshair; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
[hidden] { display: none !important; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.label { font: 600 11px/1 var(--display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); }
.num { font-variant-numeric: tabular-nums; }

/* ---- top bar ---------------------------------------------------------- */
#topbar {
  position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px));
  display: flex; gap: 8px; align-items: stretch; pointer-events: none;
}
#topbar > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 14px 0 0; overflow: hidden; }
.brand .stripe { flex: none; align-self: stretch; width: 14px; background: repeating-linear-gradient(135deg, var(--signal) 0 6px, var(--ink) 6px 12px); }
.brand h1 { margin: 0; font: 700 19px/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
.brand small { display: block; font: 500 10px/1 var(--display); letter-spacing: 0.16em; color: var(--ink-3); text-transform: uppercase; margin-top: 3px; }
.group { display: flex; align-items: center; gap: 2px; padding: 4px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; border: 0; background: transparent; border-radius: 4px;
  font: 600 13px/1 var(--display); letter-spacing: 0.07em; text-transform: uppercase; white-space: nowrap;
}
.btn:hover { background: var(--well); }
.btn:active { background: rgba(27, 30, 34, 0.12); }
.btn svg { width: 17px; height: 17px; flex: none; }
.btn.on { background: var(--signal); color: var(--signal-ink); }
.btn.danger:hover { background: var(--danger); color: #fff; }
.btn kbd, .tool kbd { font: 600 10px/1 var(--body); padding: 2px 4px; border: 1px solid var(--line); border-radius: 3px; color: var(--ink-3); background: rgba(255,255,255,0.5); }
.sep { width: 1px; align-self: stretch; margin: 4px 3px; background: var(--line); }
.spacer { flex: 1 1 0; min-width: 0; }
#stats { position: fixed; right: max(10px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 14px; padding: 0 12px; height: 42px; pointer-events: none; }
#stats div { display: flex; flex-direction: column; gap: 3px; min-width: 38px; }
#stats b { font: 600 15px/1 var(--display); letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
#timeRead { font: 600 13px/1 var(--display); min-width: 44px; text-align: right; padding-right: 6px; font-variant-numeric: tabular-nums; }

/* ---- spawn panel ------------------------------------------------------ */
#spawn { position: fixed; left: max(10px, env(safe-area-inset-left, 0px)); top: calc(66px + env(safe-area-inset-top, 0px)); width: 236px; max-height: calc(100% - 190px); display: flex; flex-direction: column; }
.panel-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 8px; border-bottom: 1px solid var(--line-2); }
.panel-head .btn { height: 24px; padding: 0 6px; }
#propGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 8px; overflow-y: auto; overscroll-behavior: contain; }
.card { position: relative; display: flex; flex-direction: column; padding: 0; border: 1px solid var(--line); border-radius: 5px; background: #e9ebec; overflow: hidden; text-align: left; }
.card:hover { border-color: var(--ink); }
.card.on { border-color: var(--ink); box-shadow: inset 0 0 0 2px var(--signal); }
.card .thumb { display: block; width: 100%; aspect-ratio: 4 / 3; background: linear-gradient(#dfe3e6, #c9ced3); }
.card img { display: block; width: 100%; height: 100%; object-fit: contain; }
.card span { display: block; padding: 5px 7px 6px; font: 600 12.5px/1.1 var(--display); letter-spacing: 0.04em; text-transform: uppercase; background: var(--panel-solid); border-top: 1px solid var(--line); min-height: 2.6em; }
.card i { position: absolute; top: 4px; left: 5px; font: 600 10px/1 var(--display); font-style: normal; color: var(--ink-3); letter-spacing: 0.08em; }
.spawn-note { padding: 7px 12px 9px; border-top: 1px solid var(--line-2); font-size: 12px; color: var(--ink-2); }

/* ---- settings panel --------------------------------------------------- */
#settings { position: fixed; right: max(10px, env(safe-area-inset-right, 0px)); top: calc(66px + env(safe-area-inset-top, 0px)); width: 268px; max-height: calc(100% - 190px); display: flex; flex-direction: column; }
#settingsBody { overflow-y: auto; padding: 4px 12px 12px; overscroll-behavior: contain; }
.sec { padding: 10px 0 2px; }
.sec + .sec { border-top: 1px solid var(--line-2); margin-top: 8px; }
.row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 8px; padding: 5px 0; }
.row label { font-size: 13px; color: var(--ink); }
.row output { font: 600 13px/1 var(--display); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.row input[type=range] { grid-column: 1 / -1; }
.row select { height: 28px; border: 1px solid var(--line); border-radius: 4px; background: #fff; padding: 0 6px; }
.row input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--ink); }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; background: rgba(27,30,34,0.2); border-radius: 2px; }
input[type=range]::-moz-range-track { height: 4px; background: rgba(27,30,34,0.2); border-radius: 2px; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; border-radius: 50%; background: var(--ink); border: 2px solid var(--signal); }
input[type=range]::-moz-range-thumb { width: 11px; height: 11px; border-radius: 50%; background: var(--ink); border: 2px solid var(--signal); }

/* ---- toolbar ---------------------------------------------------------- */
#dock { position: fixed; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; max-width: calc(100% - 20px); pointer-events: none; }
#dock > * { pointer-events: auto; }
#toolOpts { display: flex; align-items: center; gap: 16px; padding: 8px 14px; flex-wrap: wrap; justify-content: center; }
#toolOpts .opt { display: grid; grid-template-columns: auto auto; gap: 2px 10px; align-items: center; min-width: 170px; }
#toolOpts .opt input { grid-column: 1 / -1; }
#toolOpts .opt output { justify-self: end; font: 600 13px/1 var(--display); font-variant-numeric: tabular-nums; }
#toolOpts .chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { height: 28px; padding: 0 9px; border: 1px solid var(--line); background: transparent; border-radius: 14px; font: 600 12px/1 var(--display); letter-spacing: 0.05em; text-transform: uppercase; }
.chip:hover { border-color: var(--ink); }
.chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
#toolbar { display: flex; gap: 4px; padding: 5px; }
.tool { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; width: 92px; height: 62px; border: 0; background: transparent; border-radius: 4px; position: relative; font: 600 12px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; }
.tool svg { width: 24px; height: 24px; }
.tool:hover { background: var(--well); }
.tool.on { background: var(--signal); }
.tool kbd { position: absolute; top: 4px; right: 4px; }
#hint { font-size: 12.5px; color: var(--ink); padding: 5px 12px; text-align: center; max-width: 100%; }

/* ---- readouts --------------------------------------------------------- */
#info { position: fixed; left: max(10px, env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding: 9px 12px; min-width: 200px; pointer-events: none; }
#info h3 { margin: 0 0 5px; font: 700 15px/1 var(--display); letter-spacing: 0.05em; text-transform: uppercase; }
#info dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 12.5px; }
#info dt { color: var(--ink-2); }
#info dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; text-transform: capitalize; }
#toast { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); padding: 9px 16px; background: var(--ink); color: #fff; border-radius: 4px; font: 600 14px/1.2 var(--display); letter-spacing: 0.06em; text-transform: uppercase; opacity: 0; transition: opacity 0.25s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
#toast.show { opacity: 1; }
#pausedTag { position: fixed; left: 50%; top: calc(70px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); padding: 6px 14px; background: var(--signal); color: var(--signal-ink); border-radius: 3px; font: 700 14px/1 var(--display); letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }

/* ---- overlays --------------------------------------------------------- */
#help { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(27, 30, 34, 0.35); padding: 16px; z-index: 30; }
#help .sheet { width: min(640px, 100%); max-height: 100%; overflow: auto; padding: 0; }
#help h2 { margin: 0; font: 700 20px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; }
#help .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 28px; padding: 14px 16px 18px; }
#help .k { display: grid; grid-template-columns: 112px 1fr; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--line-2); font-size: 13px; }
#help .k b { font: 600 12.5px/1.3 var(--display); letter-spacing: 0.05em; text-transform: uppercase; }
#help h4 { grid-column: 1 / -1; margin: 10px 0 2px; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; background: #b4bcc4; z-index: 40; transition: opacity 0.4s; }
#loading.done { opacity: 0; pointer-events: none; }
#loading .box { display: flex; flex-direction: column; align-items: center; gap: 14px; }
#loading .bar { width: 220px; height: 10px; background: repeating-linear-gradient(135deg, var(--signal) 0 8px, var(--ink) 8px 16px); background-size: 200% 100%; animation: slide 1.1s linear infinite; border-radius: 2px; }
#loading p { margin: 0; font: 600 14px/1 var(--display); letter-spacing: 0.2em; text-transform: uppercase; }
@keyframes slide { to { background-position: -45.3px 0; } }
@media (prefers-reduced-motion: reduce) { #loading .bar { animation: none; } }

.only-narrow { display: none; }
@media (max-width: 1280px) {
  #stats .wide { display: none; }
  .brand small { display: none; }
  #topbar .btn kbd { display: none; }
}
@media (max-width: 1160px) {
  #btnStep span, #btnSettings span, #btnHelp span { display: none; }
}
@media (max-width: 1000px) {
  #topbar .btn span { display: none; }
  #timeRead { min-width: 0; }
}
@media (max-width: 820px) {
  .only-narrow { display: inline-flex; }
  .hide-narrow { display: none !important; }
  #spawn, #settings { top: auto; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); left: 10px; right: 10px; width: auto; max-height: 46%; }
  #spawn:not(.open), #settings:not(.open) { display: none; }
  #propGrid { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
  .tool { width: 70px; height: 54px; font-size: 11px; }
  .tool kbd, .btn kbd { display: none; }
  #info { display: none; }
  #hint { display: none; }
  .brand h1 { font-size: 16px; }
  #stats { gap: 10px; padding: 0 8px; bottom: auto; top: calc(62px + env(safe-area-inset-top, 0px)); height: 36px; }
  .brand .stripe { width: 8px; }
  .brand { padding-right: 8px; }
  #topbar { gap: 5px; }
  .btn { padding: 0 7px; }
  #help .cols { grid-template-columns: 1fr; }
  #toolOpts .opt { min-width: 130px; }
}
</style>
</head>
<body>
<canvas id="view" tabindex="0" aria-label="3D destruction test bay"></canvas>

<div id="topbar">
  <div class="panel brand"><span class="stripe"></span><div><h1>Prop Destruction Lab</h1><small>Physics test bay 01</small></div></div>
  <div class="panel group">
    <button class="btn" id="btnPause" title="Pause / resume (Space)"></button>
    <button class="btn" id="btnStep" title="Advance one step while paused (.)"></button>
    <button class="btn" id="btnSlow" title="Slow motion (T)"></button>
    <span id="timeRead" class="num">1.00×</span>
  </div>
  <div class="panel group">
    <button class="btn" id="btnReset" title="Rebuild the default showroom"></button>
    <button class="btn" id="btnDebris" title="Remove loose fragments and projectiles"></button>
    <button class="btn danger" id="btnClear" title="Remove every object"></button>
  </div>
  <span class="spacer"></span>
  <div class="panel group">
    <button class="btn only-narrow" id="btnProps"></button>
    <button class="btn" id="btnSettings" title="Settings"></button>
    <button class="btn" id="btnHelp" title="Controls (H)"></button>
  </div>
</div>

<aside class="panel" id="spawn">
  <div class="panel-head"><span class="label">Spawn a prop</span><span class="label num" id="propCount"></span></div>
  <div id="propGrid"></div>
  <div class="spawn-note" id="spawnNote">Pick a prop, then click the floor to place it. Wheel or R rotates. Shift-click places several.</div>
</aside>

<aside class="panel" id="settings" hidden>
  <div class="panel-head"><span class="label">Settings</span></div>
  <div id="settingsBody"></div>
</aside>

<div id="dock">
  <div class="panel" id="hint"></div>
  <div class="panel" id="toolOpts"></div>
  <div class="panel" id="toolbar"></div>
</div>

<div class="panel" id="stats">
  <div><span class="label">FPS</span><b id="stFps" class="num">–</b></div>
  <div><span class="label">Bodies</span><b id="stBodies" class="num">–</b></div>
  <div><span class="label">Pieces</span><b id="stChunks" class="num">–</b></div>
  <div class="wide"><span class="label">Awake</span><b id="stAwake" class="num">–</b></div>
  <div class="wide"><span class="label">Physics</span><b id="stMs" class="num">–</b></div>
</div>
<div class="panel" id="info" hidden></div>
<div id="pausedTag" hidden>Paused</div>
<div id="toast" role="status"></div>

<div id="help" hidden>
  <div class="panel sheet">
    <div class="panel-head"><h2>Controls</h2><button class="btn" id="btnHelpClose">Close</button></div>
    <div class="cols" id="helpBody"></div>
  </div>
</div>

<div id="loading"><div class="box"><div class="bar"></div><p id="loadingText">Preparing test bay</p></div></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
