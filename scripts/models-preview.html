<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Battlespace model preview</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #9fb2c4; font-family: system-ui, sans-serif; }
    canvas { display: block; }
    #labels { position: absolute; inset: 0; pointer-events: none; }
    .label {
      position: absolute; transform: translate(-50%, -100%); white-space: nowrap;
      font-size: 12px; font-weight: 600; color: #fff; background: rgba(20, 24, 28, 0.62);
      padding: 2px 6px; border-radius: 3px;
    }
    #title {
      position: absolute; left: 10px; top: 8px; color: #fff; font-size: 14px; font-weight: 700;
      background: rgba(20, 24, 28, 0.6); padding: 4px 8px; border-radius: 4px;
    }
    #hud { position: absolute; right: 10px; top: 8px; color: #fff; font: 12px monospace; background: rgba(20, 24, 28, 0.6); padding: 4px 8px; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="labels"></div>
  <div id="title"></div>
  <div id="hud"></div>
  <script type="module" src="./models-preview.js"></script>
</body>
</html>
