<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Battlespace Audio Lab</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --bg: #11140f;
      --panel: #1a1f17;
      --line: #2d3527;
      --text: #d9dccf;
      --dim: #8d957f;
      --accent: #c9a227;
      --hot: #d4572a;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.4 ui-sans-serif, system-ui, sans-serif;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 2;
    }
    h1 { font-size: 15px; margin: 0 8px 0 0; letter-spacing: 0.04em; }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); margin: 0 0 8px; }
    main {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 12px;
      padding: 12px 16px 40px;
    }
    section { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
    section.wide { grid-column: 1 / -1; }
    button {
      background: #262d21;
      color: var(--text);
      border: 1px solid #3a4532;
      border-radius: 4px;
      padding: 3px 8px;
      font: inherit;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button.on { background: var(--accent); color: #111; border-color: var(--accent); }
    button.primary { background: var(--hot); border-color: var(--hot); color: #fff; padding: 6px 14px; }
    button:disabled { opacity: 0.45; cursor: default; }
    label { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
    label span { width: 110px; color: var(--dim); }
    input[type=range] { flex: 1; min-width: 80px; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 4px 12px; }
    .sound { display: flex; align-items: center; gap: 4px; }
    .sound code { flex: 1; font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
    pre { margin: 0; font-size: 11.5px; white-space: pre-wrap; color: var(--text); }
    #status { color: var(--dim); }
  </style>
</head>
<body>
  <header>
    <h1>BATTLESPACE · AUDIO LAB</h1>
    <button id="start" class="primary">Start audio</button>
    <span id="status">not started</span>
  </header>
  <main>
    <section>
      <h2>Master</h2>
      <label><span>Volume</span><input id="volume" type="range" min="0" max="1" step="0.01" value="0.8"></label>
      <label><span>Time scale</span><input id="timescale" type="range" min="0" max="2" step="0.05" value="1"><output id="tsv">1</output></label>
      <label><span>Direction (°)</span><input id="azimuth" type="range" min="-180" max="180" step="5" value="30"><output id="azv">30</output></label>
      <div class="row">
        <button id="mute">Mute</button>
        <button id="voice">Voice radio</button>
      </div>
    </section>
    <section>
      <h2>Battle stress</h2>
      <label><span>Events / s</span><input id="rate" type="range" min="10" max="600" step="10" value="300"><output id="ratev">300</output></label>
      <div class="row">
        <button id="stress">Start stress (2 km area)</button>
        <button id="stressLoops">+ 12 moving loops</button>
      </div>
    </section>
    <section>
      <h2>Environment</h2>
      <label><span>Wind</span><input data-env="wind" type="range" min="0" max="1" step="0.05" value="0.3"></label>
      <label><span>Rain</span><input data-env="rain" type="range" min="0" max="1" step="0.05" value="0"></label>
      <label><span>Battle intensity</span><input data-env="battleIntensity" type="range" min="0" max="1" step="0.05" value="0"></label>
      <label><span>Near intensity</span><input data-env="nearIntensity" type="range" min="0" max="1" step="0.05" value="0"></label>
      <div class="row">
        <button data-flag="thunderstorm">Thunderstorm</button>
        <button data-flag="night">Night</button>
        <button data-thunder="250">Thunder 250 m</button>
        <button data-thunder="1500">1.5 km</button>
        <button data-thunder="5000">5 km</button>
      </div>
    </section>
    <section>
      <h2>Loops</h2>
      <label><span>Intensity</span><input id="loopIntensity" type="range" min="0" max="1" step="0.05" value="0.6"></label>
      <div class="row" id="loops"></div>
    </section>
    <section>
      <h2>Radio &amp; flybys</h2>
      <div class="row">
        <button data-radio="0,0">Blue · low</button>
        <button data-radio="0,2">Blue · urgent</button>
        <button data-radio="1,1">Red · normal</button>
        <button id="radioFlood">Flood ×10</button>
      </div>
      <div class="row" id="flybys"></div>
      <label><span>Jet gun burst (s)</span><input id="burst" type="range" min="0.3" max="4" step="0.1" value="1.5"><output id="burstv">1.5</output></label>
    </section>
    <section class="wide">
      <h2>One-shots: near (15 m) · mid (200 m) · far (1000 m)</h2>
      <div class="grid" id="sounds"></div>
    </section>
    <section class="wide">
      <h2>Stats</h2>
      <pre id="stats">—</pre>
    </section>
  </main>
  <script type="module" src="./audio-lab.js"></script>
</body>
</html>
