<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Brittle Bones</title>
    <meta name="description" content="A physics-based ragdoll obstacle course game with five unlucky riders and ten levels of poor decisions." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet" />
    <style>
:root {
  color-scheme: dark;
  --ink: #1b1712;
  --paper: #fff8ec;
  --red: #e2333b;
  --yellow: #ffd23f;
  --teal: #2bb3a3;
  --panel: rgba(27, 23, 18, 0.88);
  --panel-2: rgba(255, 248, 236, 0.07);
  --font-display: 'Bangers', Impact, 'Arial Black', sans-serif;
  --font-body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--ink);
  color: var(--paper);
  font-family: var(--font-body);
  -webkit-user-select: none;
  user-select: none;
  touch-action: none;
}

canvas#game {
  position: fixed;
  inset: 0;
  display: block;
}

#ui {
  position: fixed;
  inset: 0;
  pointer-events: none;
}

.hidden {
  display: none !important;
}

button {
  font-family: inherit;
}

kbd {
  display: inline-block;
  min-width: 1.6em;
  padding: 0.1em 0.45em;
  border-radius: 6px;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-weight: 900;
  font-size: 0.85em;
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.4);
}

/* ------------------------------------------------------------------ buttons */

.btn {
  pointer-events: auto;
  cursor: pointer;
  border: 3px solid var(--ink);
  background: var(--yellow);
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 26px;
  letter-spacing: 1.5px;
  padding: 8px 26px;
  border-radius: 14px;
  box-shadow: 0 5px 0 var(--ink);
  transition: transform 0.08s, box-shadow 0.08s, background 0.15s;
}
.btn:hover {
  background: #ffe066;
  transform: translateY(-2px);
  box-shadow: 0 7px 0 var(--ink);
}
.btn:active {
  transform: translateY(3px);
  box-shadow: 0 2px 0 var(--ink);
}
.btn.big {
  font-size: 34px;
  padding: 10px 40px;
  background: var(--red);
  color: #fff;
}
.btn.big:hover {
  background: #f04a52;
}
.btn.ghost {
  background: var(--paper);
}
.btn.small {
  font-size: 18px;
  padding: 4px 14px;
}
.icon-btn {
  pointer-events: auto;
  cursor: pointer;
  border: 2px solid var(--ink);
  background: rgba(255, 248, 236, 0.9);
  color: var(--ink);
  font-weight: 900;
  border-radius: 8px;
  width: 36px;
  height: 32px;
  margin-left: 12px;
}

/* ------------------------------------------------------------------ screens */

.screen {
  position: absolute;
  inset: 0;
  display: none;
  pointer-events: auto;
}
.screen.active {
  display: flex;
}

.main-screen {
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 28px;
  background: radial-gradient(ellipse at center, rgba(27, 23, 18, 0.2), rgba(27, 23, 18, 0.65));
}

.logo {
  text-align: center;
  font-family: var(--font-display);
  line-height: 0.85;
  transform: rotate(-3deg);
}
.logo-top,
.logo-bottom {
  filter: drop-shadow(0 8px 0 var(--ink));
}
.logo-top,
.logo-bottom {
  font-size: clamp(64px, 13vw, 150px);
  letter-spacing: 4px;
  -webkit-text-stroke: 4px var(--ink);
  paint-order: stroke fill;
}
.logo-top {
  color: var(--paper);
}
.logo-bottom {
  color: var(--red);
  margin-left: 0.6em;
}
.logo-sub {
  font-family: var(--font-body);
  font-weight: 900;
  font-size: clamp(14px, 2vw, 20px);
  margin-top: 14px;
  color: var(--paper);
  text-shadow: 0 2px 0 var(--ink);
  transform: rotate(2deg);
}

.menu-buttons {
  display: flex;
  flex-direction: column;
  gap: 14px;
  align-items: stretch;
  min-width: 260px;
}

.footer-note {
  position: absolute;
  bottom: 16px;
  font-size: 13px;
  font-weight: 800;
  opacity: 0.8;
  text-shadow: 0 1px 0 var(--ink);
  padding: 0 16px;
  text-align: center;
}

.panel-screen {
  flex-direction: column;
  align-items: center;
  padding: 26px 16px 22px;
  background: rgba(27, 23, 18, 0.72);
  overflow-y: auto;
}
.panel-screen h1,
.modal-box h1 {
  font-family: var(--font-display);
  font-weight: normal;
  font-size: clamp(36px, 6vw, 56px);
  letter-spacing: 3px;
  margin: 0 0 14px;
  color: var(--yellow);
  -webkit-text-stroke: 2px var(--ink);
  paint-order: stroke fill;
  text-shadow: 0 5px 0 var(--ink);
}
.level-sub {
  font-weight: 800;
  margin: -6px 0 14px;
}
.level-sub a {
  color: var(--yellow);
}

.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
  width: min(1240px, 100%);
}
.card-grid.levels {
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
}
.level-card p {
  font-size: 12px;
  margin: 2px 0 4px;
}
.level-card .card-body {
  padding: 8px 12px 10px;
}

.card {
  cursor: pointer;
  background: var(--paper);
  color: var(--ink);
  border: 3px solid var(--ink);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 6px 0 var(--ink);
  transition: transform 0.12s, box-shadow 0.12s;
  display: flex;
  flex-direction: column;
}
.card:hover {
  transform: translateY(-4px) rotate(-0.5deg);
  box-shadow: 0 10px 0 var(--ink);
}
.card.selected {
  outline: 5px solid var(--yellow);
  outline-offset: -2px;
  transform: translateY(-4px);
}
.card canvas {
  width: 100%;
  height: auto;
  display: block;
  border-bottom: 3px solid var(--ink);
}
.card-body {
  padding: 10px 14px 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1;
}
.card h3 {
  font-family: var(--font-display);
  font-weight: normal;
  font-size: 26px;
  letter-spacing: 1px;
  margin: 0;
  line-height: 1;
}
.card p {
  margin: 4px 0 6px;
  font-size: 13px;
  font-weight: 600;
  line-height: 1.3;
  flex: 1;
}
.vehicle {
  font-weight: 900;
  font-size: 13px;
  text-transform: uppercase;
  color: var(--red);
  letter-spacing: 1px;
}
.stat {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 1px;
}
.pips {
  display: flex;
  gap: 3px;
}
.pips i {
  width: 18px;
  height: 9px;
  border-radius: 3px;
  background: #e2d7c3;
  border: 1.5px solid var(--ink);
}
.pips i.on {
  background: var(--red);
}
.ability {
  margin-top: 6px;
  font-size: 12px;
  font-weight: 900;
  background: var(--ink);
  color: var(--yellow);
  padding: 6px 8px;
  border-radius: 8px;
}

.level-card .thumb {
  height: 64px;
  position: relative;
  border-bottom: 3px solid var(--ink);
}
.level-card .num {
  position: absolute;
  left: 12px;
  top: 2px;
  font-family: var(--font-display);
  font-size: 48px;
  color: var(--paper);
  -webkit-text-stroke: 3px var(--ink);
  paint-order: stroke fill;
}
.level-card .lock {
  position: absolute;
  right: 12px;
  top: 12px;
  font-size: 34px;
}
.level-card.locked {
  cursor: not-allowed;
  filter: grayscale(0.85) brightness(0.8);
}
.level-card.locked:hover {
  transform: none;
}
.level-card.done .num::after {
  content: ' \2713';
  color: #3ddc84;
  font-size: 34px;
}
.skulls {
  font-size: 16px;
  color: var(--red);
  letter-spacing: 1px;
}
.skulls span {
  color: #d8ccb8;
}
.lvl-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  font-weight: 900;
}
.teeth span,
#hud-teeth span {
  display: inline-block;
}
.tooth {
  width: 18px;
  height: 21px;
  fill: #d6ccb9;
  stroke: var(--ink);
  stroke-width: 1.5;
}
.got .tooth {
  fill: var(--yellow);
}

.row-buttons {
  display: flex;
  gap: 16px;
  margin-top: 22px;
  flex-wrap: wrap;
  justify-content: center;
}
.col-buttons {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 18px;
}

/* ------------------------------------------------------------------ modals */

.modal {
  align-items: center;
  justify-content: center;
  background: rgba(10, 6, 4, 0.55);
}
.modal-box {
  background: var(--panel);
  border: 3px solid var(--paper);
  border-radius: 20px;
  padding: 24px 30px;
  min-width: min(380px, calc(100vw - 32px));
  max-width: calc(100vw - 32px);
  max-height: calc(100vh - 32px);
  overflow-y: auto;
  text-align: center;
  box-shadow: 0 10px 0 rgba(0, 0, 0, 0.5);
}
.results .res-rating {
  font-family: var(--font-display);
  font-size: 28px;
  letter-spacing: 1px;
  color: var(--red);
  margin-bottom: 12px;
}
.res-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px 26px;
}
.res-grid label {
  display: block;
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 1px;
  opacity: 0.75;
}
.res-grid b {
  font-family: var(--font-display);
  font-weight: normal;
  font-size: 34px;
  letter-spacing: 1px;
}
.res-grid em {
  color: var(--yellow);
  font-style: normal;
  font-size: 20px;
}
.settings {
  display: flex;
  flex-direction: column;
  gap: 12px;
  text-align: left;
  font-weight: 800;
}
.settings input[type='range'] {
  width: 100%;
  accent-color: var(--red);
}
.settings input[type='checkbox'] {
  accent-color: var(--red);
  width: 18px;
  height: 18px;
  vertical-align: -3px;
  margin-right: 8px;
}
.help p {
  max-width: 520px;
  margin: 6px auto 12px;
  font-weight: 700;
  line-height: 1.4;
}
.keys {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px 22px;
  text-align: left;
  max-width: 560px;
  margin: 0 auto;
}
.keys div {
  display: flex;
  gap: 10px;
  align-items: center;
  font-weight: 700;
}
.keys kbd {
  min-width: 96px;
  text-align: center;
}
.tips {
  font-size: 14px;
  opacity: 0.85;
}

/* ------------------------------------------------------------------ HUD */

#hud {
  position: absolute;
  inset: 0;
  font-weight: 900;
}
.hud-tl {
  position: absolute;
  left: calc(16px + env(safe-area-inset-left, 0px));
  top: calc(12px + env(safe-area-inset-top, 0px));
  text-shadow: 0 2px 0 var(--ink), 0 0 6px rgba(0, 0, 0, 0.6);
}
#hud-level {
  font-family: var(--font-display);
  font-size: 24px;
  letter-spacing: 1px;
}
#hud-time {
  font-family: var(--font-display);
  font-size: 40px;
  letter-spacing: 2px;
  color: var(--yellow);
  line-height: 1;
}
.hud-tr {
  position: absolute;
  right: calc(16px + env(safe-area-inset-right, 0px));
  top: calc(14px + env(safe-area-inset-top, 0px));
  display: flex;
  align-items: center;
}
#hud-teeth .tooth {
  width: 26px;
  height: 30px;
  margin-left: 4px;
  filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.6));
}
.hud-bl {
  position: absolute;
  left: calc(16px + env(safe-area-inset-left, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  min-width: 220px;
}
#hud-name {
  font-family: var(--font-display);
  font-size: 22px;
  letter-spacing: 1px;
  text-shadow: 0 2px 0 var(--ink);
}
.bar {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  letter-spacing: 1px;
  margin-top: 4px;
  text-shadow: 0 1px 0 var(--ink);
}
.bar span {
  width: 64px;
}
.track {
  flex: 1;
  height: 12px;
  background: rgba(0, 0, 0, 0.55);
  border: 2px solid var(--paper);
  border-radius: 7px;
  overflow: hidden;
}
.track div {
  height: 100%;
  width: 100%;
  transition: width 0.1s;
}
#hud-hint {
  position: absolute;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);
  background: var(--panel);
  padding: 8px 16px;
  border-radius: 12px;
  font-size: 14px;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.6s;
  max-width: calc(100vw - 32px);
  overflow: hidden;
  text-overflow: ellipsis;
}
#hud-hint.show {
  opacity: 1;
}
#toasts {
  position: absolute;
  top: 18%;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.toast {
  font-family: var(--font-display);
  font-size: 44px;
  letter-spacing: 2px;
  color: var(--paper);
  -webkit-text-stroke: 2px var(--ink);
  paint-order: stroke fill;
  text-shadow: 0 4px 0 var(--ink);
  animation: toast 1.6s ease-out forwards;
}
.toast.good {
  color: #3ddc84;
}
.toast.gore {
  color: var(--red);
}
.toast.warn {
  color: var(--yellow);
}
@keyframes toast {
  0% {
    transform: scale(0.4) rotate(-6deg);
    opacity: 0;
  }
  12% {
    transform: scale(1.15) rotate(2deg);
    opacity: 1;
  }
  25% {
    transform: scale(1) rotate(-1deg);
  }
  80% {
    opacity: 1;
  }
  100% {
    transform: translateY(-30px);
    opacity: 0;
  }
}
#death {
  position: absolute;
  top: 30%;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  width: min(90vw, 760px);
  animation: deathIn 0.4s ease-out;
}
#death h2 {
  font-family: var(--font-display);
  font-weight: normal;
  font-size: clamp(36px, 7vw, 68px);
  letter-spacing: 2px;
  margin: 0;
  color: var(--red);
  -webkit-text-stroke: 3px var(--ink);
  paint-order: stroke fill;
  text-shadow: 0 6px 0 var(--ink);
}
#death p {
  font-size: 18px;
  text-shadow: 0 2px 0 var(--ink);
}
@keyframes deathIn {
  from {
    transform: translateX(-50%) scale(1.6);
    opacity: 0;
  }
  to {
    transform: translateX(-50%) scale(1);
    opacity: 1;
  }
}

/* ------------------------------------------------------------------ touch */

#touch {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
#touch button {
  pointer-events: auto;
  width: 74px;
  height: 74px;
  border-radius: 50%;
  border: 3px solid rgba(255, 248, 236, 0.85);
  background: rgba(27, 23, 18, 0.45);
  color: var(--paper);
  font-size: 28px;
  touch-action: none;
}
#touch button.on {
  background: rgba(255, 210, 63, 0.7);
  color: var(--ink);
}
#touch button.small {
  width: 56px;
  height: 56px;
  font-size: 22px;
}
#touch .gas {
  width: 88px;
  height: 88px;
  background: rgba(226, 51, 59, 0.5);
}
.tleft {
  position: absolute;
  left: calc(18px + env(safe-area-inset-left, 0px));
  bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  display: flex;
  gap: 14px;
}
.tright {
  position: absolute;
  right: calc(18px + env(safe-area-inset-right, 0px));
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  display: grid;
  grid-template-columns: auto auto;
  gap: 10px;
  align-items: end;
}
.ttop {
  position: absolute;
  right: 18px;
  top: 64px;
  display: flex;
  gap: 10px;
}
.ttop button {
  width: 52px !important;
  height: 52px !important;
  font-size: 20px !important;
}

@media (max-width: 640px) {
  .btn {
    font-size: 22px;
  }
  .btn.big {
    font-size: 28px;
  }
  .keys {
    grid-template-columns: 1fr;
  }
  #hud-time {
    font-size: 30px;
  }
  .toast {
    font-size: 32px;
  }
  .hud-bl {
    min-width: 160px;
    bottom: 200px;
  }
  .modal-box {
    padding: 18px 16px;
  }
}
</style>

    <canvas id="game"></canvas>
    <div id="ui"></div>
