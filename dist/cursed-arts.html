    },
    taiko(d, t, g, f) {
      f = f || 72;
      const v = nv(d, t, g, 0, 0.25);
      L(v, { src: 'sine', f: [[0, f * 1.9], [0.035, f * 1.1], [0.5, f]], a: 0.001, d: 0.6, g: 0.75 });
      L(v, { src: 'brown', fl: { type: 'lowpass', f: 450 }, a: 0.001, d: 0.18, g: 0.5 });
      L(v, { src: 'white', fl: { type: 'bandpass', f: 1000, Q: 1.2 }, a: 0.0005, d: 0.025, g: 0.25 });
      fin(v);
    },
    shime(d, t, g, pan) {
      const v = nv(d, t, g, pan || 0, 0.18);
      L(v, { src: 'sine', f: [[0, 420], [0.03, 300]], a: 0.0008, d: 0.12, g: 0.4 });
      L(v, { src: 'white', fl: { type: 'bandpass', f: 2200, Q: 2 }, a: 0.0005, d: 0.03, g: 0.3 });
      fin(v);
    },
    ka(d, t, g, pan) {
      const v = nv(d, t, g, pan || 0, 0.1);
      L(v, { src: 'white', fl: { type: 'bandpass', f: 2600, Q: 3 }, a: 0.0005, d: 0.03, g: 0.6 });
      L(v, { src: 'triangle', f: 850, a: 0.0005, d: 0.025, g: 0.25 });
      fin(v);
    },
    // shamisen-ish: bright saw with a fast filter snap, buzzy sawari and bachi click
    pluck(d, t, m, g, dur, bright, pan, rev) {
      const f = hz(m), v = nv(d, t, g, pan || 0, rev == null ? 0.15 : rev);
      bright = bright == null ? 1 : bright;
      L(v, { src: 'sawtooth', f: [[0, f * 1.012], [0.025, f]], fl: { type: 'lowpass', f: [[0, Math.min(9000, f * 10 * bright)], [0.09, f * 2.2]], Q: 3 }, a: 0.001, d: dur, g: 0.32 });
      L(v, { src: 'square', f: [[0, f * 2.03], [0.025, f * 2.01]], fl: { type: 'bandpass', f: Math.min(6000, f * 5), Q: 2 }, a: 0.001, d: dur * 0.5, g: 0.06 });
      L(v, { src: 'white', fl: { type: 'highpass', f: 3000 }, a: 0.0005, d: 0.012, g: 0.1 });
      fin(v);
    },
    bass(d, t, m, g, dur, cut) {
      const f = hz(m), v = nv(d, t, g);
      cut = cut || 800;
      L(v, { src: 'sawtooth', f, fl: { type: 'lowpass', f: [[0, cut * 3], [0.08, cut]], Q: 5 }, a: 0.003, h: dur * 0.5, d: dur * 0.5 + 0.05, g: 0.3 });
      L(v, { src: 'sine', f, a: 0.003, h: dur * 0.5, d: dur * 0.5 + 0.05, g: 0.4 });
      fin(v);
    },
    pad(d, t, ms, dur, g, cut) {
      const v = nv(d, t, g, 0, 0.4);
      ms.forEach((m) => [-8, 8].forEach((det) =>
        L(v, { src: 'sawtooth', f: hz(m), det, fl: { type: 'lowpass', f: cut || 1400, Q: 1 }, a: dur * 0.25, h: dur * 0.45, d: dur * 0.5, g: 0.06, pan: det > 0 ? 0.3 : -0.3 })));
      fin(v);
    },
    bell(d, t, m, g, dur, pan) {
      const f = hz(m), v = nv(d, t, g, pan || 0, 0.6);
      dur = dur || 2.5;
      L(v, { src: 'sine', f, fm: { f: f * 3.51, i: [[0, f * 2.2], [dur * 0.5, f * 0.05]] }, a: 0.002, d: dur, g: 0.25 });
      L(v, { src: 'sine', f: f * 2, a: 0.002, d: dur * 0.4, g: 0.06 });
      fin(v);
    },
    // shakuhachi-ish breathy flute with delayed vibrato
    flute(d, t, m, g, dur) {
      const f = hz(m), v = nv(d, t, g, -0.1, 0.35);
      L(v, { src: 'triangle', f, fm: { f: 5.2, i: [[0, 0.01], [0.3, f * 0.012], [dur + 0.1, f * 0.014]] }, a: 0.07, h: dur * 0.65, d: dur * 0.35 + 0.1, g: 0.3 });
      L(v, { src: 'sine', f: f * 2, a: 0.08, h: dur * 0.5, d: dur * 0.4, g: 0.05 });
      L(v, { src: 'white', fl: { type: 'bandpass', f: Math.min(9000, f * 2), Q: 3 }, a: 0.04, h: dur * 0.3, d: dur * 0.5, g: 0.12 });
      fin(v);
    },
    epiano(d, t, m, g, dur) {
      const f = hz(m), v = nv(d, t, g, 0, 0.25);
      L(v, { src: 'sine', f, fm: { f, i: [[0, f * 1.1], [0.4, f * 0.08]] }, am: { f: 4.5, d: 0.15 }, a: 0.002, d: dur, g: 0.22 });
      L(v, { src: 'sine', f: f * 4, a: 0.001, d: 0.15, g: 0.03 });
      fin(v);
    },
    lead(d, t, m, g, dur, pan) {
      const f = hz(m), v = nv(d, t, g, pan || 0, 0.25);
      L(v, { src: 'square', f, fm: { f: 5.5, i: [[0, 0.01], [0.2, f * 0.01]] }, fl: { type: 'lowpass', f: Math.min(8000, f * 6), Q: 2 }, a: 0.01, h: dur * 0.6, d: dur * 0.4 + 0.08, g: 0.16 });
      L(v, { src: 'sawtooth', f, det: 7, fl: { type: 'lowpass', f: Math.min(8000, f * 4) }, a: 0.01, h: dur * 0.6, d: dur * 0.4 + 0.08, g: 0.1 });
      fin(v);
    },
    stab(d, t, ms, g, dur) {
      const v = nv(d, t, g, 0, 0.35);
      ms.forEach((m) => [-10, 0, 10].forEach((det) =>
        L(v, { src: 'sawtooth', f: hz(m), det, fl: { type: 'lowpass', f: [[0, 600], [0.04, 5000], [dur, 1200]], Q: 2 }, a: 0.01, h: dur * 0.3, d: dur * 0.7, g: 0.04 })));
      fin(v);
    },
    drone(d, t, ms, dur, g, cut) {
      const v = nv(d, t, g, 0, 0.3);
      ms.forEach((m) => [-6, 6].forEach((det) =>
        L(v, { src: 'sawtooth', f: hz(m), det, fl: { type: 'lowpass', f: cut || 300, Q: 4 }, dist: 1.5, a: dur * 0.3, h: dur * 0.4, d: dur * 0.3, g: 0.07, pan: det > 0 ? 0.25 : -0.25 })));
      fin(v);
    },
    growl(d, t, m, dur, g) {
      const v = nv(d, t, g, 0, 0.2);
      L(v, { src: 'sawtooth', f: hz(m), fl: { type: 'lowpass', f: [[0, 120], [dur * 0.5, 600], [dur, 150]], Q: 6 }, dist: 3, am: { f: 22, d: 0.5 }, a: dur * 0.4, h: dur * 0.2, d: dur * 0.4, g: 0.2 });
      fin(v);
    },
    sub(d, t, m, g, dur) {
      const v = nv(d, t, g);
      L(v, { src: 'sine', f: hz(m), a: 0.01, h: dur * 0.5, d: dur * 0.5, g: 0.5 });

<script>/* src/engine/voice.js */
// Character voices: speechSynthesis lines (with a caption callback that always
// fires, so subtitles work without TTS), a booming announcer, and short
// synthesized grunts (formant synthesis on JJK.Audio's SFX bus).

      blue: { en: 'Cursed Technique Lapse... Blue.', ja: '術式順転、蒼' },
      red: { en: 'Cursed Technique Reversal... Red.', ja: '術式反転、赫' },
      maxred: { en: 'Maximum output. Red.', ja: '出力最大、赫' },
      purple: { en: 'Imaginary Technique... Purple.', ja: '虚式、茈' },
      purple_chant: { en: 'Phase. Twilight. Eyes of Wisdom.', ja: '位相、黄昏、智慧の瞳' },
      domain: { en: 'Domain Expansion... Unlimited Void.', ja: '領域展開、無量空処' },
      lowhp: { en: "Nah, I'd win.", ja: 'ま、負けないよ' },

      hurt_big: { en: 'Tch.', say: 'Tsk.' },

    sukuna: {

      dismantle: { en: 'Dismantle.', ja: '解' },
      cleave: { en: 'Cleave.', ja: '捌' },
      fuga: { en: 'Fuga.', ja: '開', say: 'Fooga.' },
      wcs_1: { en: 'Dragon Scale.', ja: '龍鱗' },
      wcs_2: { en: 'Recoil.', ja: '反発' },
      wcs_3: { en: 'Twin Meteors.', ja: '番いの流星' },
      wcs: { en: 'World... Cutting... Slash.', ja: '世界を断つ斬撃' },
      domain: { en: 'Domain Expansion... Malevolent Shrine.', ja: '領域展開、伏魔御廚子' },
      lowhp: { en: 'Splendid... Satoru Gojo!' },
      win: { en: 'Stand proud. You were strong.', ja: '誇れ、お前は強い' },
      taunt: { en: 'Entertain me.' },
      da: { en: 'Domain Amplification.', ja: '領域展延' },
      hurt_big: { en: 'Hmph.', say: 'Hmph!' },

    gojo: { pitch: 1.0, rate: 1.05 },

      char: 'announcer',
      text: ANNOUNCE_SAY[text] || text,
      voice: pickVoice('en'),
      lang: 'en-US',
      pitch: STYLE.announcer.pitch,
      rate: STYLE.announcer.rate,
      volume: Math.min(1, ttsVolume() * 1.2 + 0.1),

    hurt_heavy: { d: 0.55, f: [[0, 1.4], [0.06, 1.7], [0.35, 1.35], [0.55, 0.85]], a: [[0, 0], [0.02, 1], [0.4, 0.75], [0.55, 0]], b: [[0, 0], [0.005, 0.3], [0.04, 0.1], [0.45, 0.15], [0.55, 0]], v: [[0, 'a'], [0.3, 'a'], [0.45, 'U']], strain: 1.2, vib: 7, vibD: 0.03, vol: 1.05 },

    hp.frequency.value = 350;
    bg.gain.value = 0;

})();

<script>/* src/game/body.js */
// Shared body-part painters used by the character art modules.
(function () {
  'use strict';
  const JJK = (typeof window !== 'undefined' ? window : globalThis).JJK;
  const U = JJK.U;
  const Body = (JJK.Body = {});

  // Darkened copy of a material for limbs on the far side of the body.
  Body.far = function (m, k = 0.8) {
    return {
      tones: m.tones.map((t) => [t[0] * k, t[1] * k, t[2] * k * 1.04]),
      gloss: m.gloss,
      emissive: m.emissive,
    };
  };

  Body.palette = function (def) {
    const out = {};
    for (const k in def) {
      const v = def[k];
      if (Array.isArray(v) && v.length === 4 && typeof v[0] === 'string') {
        out[k] = { tones: v.map(U.hex), gloss: 0, emissive: 0 };
      } else if (typeof v === 'string') out[k] = U.mat(v);
      else out[k] = v;
      out[k + 'F'] = Body.far(out[k]);
    }
    return out;
  };

  // point along limb A->B at fraction t, offset s (facing-space units) toward "front" (+perp)
  Body.along = function (A, B, t, s) {
    const dx = B[0] - A[0], dy = B[1] - A[1];
    const l = Math.hypot(dx, dy) || 1;
    // perpendicular pointing "front" for a downward axis: rotate dir by +90 in y-up => (-dy, dx)
    const px = -dy / l, py = dx / l;
    return [A[0] + dx * t + px * s, A[1] + dy * t + py * s];
  };

  // Foot / shoe. ang: facing-space radians (0 = toes forward).
  Body.foot = function (P, A, ang, mat, g, style, soleCol) {
    const c = Math.cos(ang), s = Math.sin(ang);
    const pt = (u, v) => [A[0] + u * c - v * s, A[1] + u * s + v * c];
    if (style === 'sandal') {
      // bare-ish foot on a thin sole
      P.poly([pt(-4, 2), pt(4, 2.5), pt(11.5, -2), pt(12.5, -4.2), pt(-4.5, -4.2)], mat, g, { n: [0, -0.4, 0.9] });
      P.poly([pt(-5, -4), pt(13.5, -4), pt(13.5, -5.6), pt(-5, -5.6)], soleCol, g + 1, { n: [0, -0.2, 1] });
    } else {
      P.poly([pt(-4.5, 3.5), pt(3, 3.6), pt(8.5, 0.5), pt(12.5, -1.5), pt(13, -4.6), pt(-5.2, -4.6), pt(-5.6, 0)], mat, g, {
        n: [0, -0.5, 0.86],
      });
      if (soleCol) P.poly([pt(-5.4, -3.6), pt(13.2, -3.6), pt(13, -5.4), pt(-5.4, -5.4)], soleCol, g + 1, { n: [0, 0.2, 1] });
    }
  };

  // Hand painter. ang = facing-space hand direction (radians).
  Body.hand = function (P, H, ang, shape, skin, g, opts = {}) {
    const c = Math.cos(ang), s = Math.sin(ang);
    const pt = (u, v) => [H[0] + u * c - v * s, H[1] + u * s + v * c];
    const line = opts.lineCol;
    const k = opts.scale || 1;
    switch (shape) {
      case 'open':
      case 'chop': {
        // palm + fingers extended
        P.ell(pt(2.5 * k, 0), 4.2 * k, 3.6 * k, ang, skin, g);
        P.limb(pt(4 * k, 0.5 * k), pt(9.5 * k, 0.8 * k), [[0, 2.6 * k, 2.6 * k], [1, 2 * k, 2 * k]], skin, g, 1);
        P.limb(pt(2 * k, 2.5 * k), pt(5 * k, 4.6 * k), [[0, 1.5 * k, 1.5 * k], [1, 1.2 * k, 1.2 * k]], skin, g + 1, 1); // thumb
        if (line) P.line(pt(5 * k, -0.5 * k), pt(9 * k, -0.3 * k), line, g, 1, true);
        break;
      }
      case 'claw': {
        P.ell(pt(2.5 * k, 0), 4.3 * k, 3.8 * k, ang, skin, g);
        for (let i = 0; i < 3; i++) {
          const o = (i - 1) * 2.2 * k;
          const a = pt(4.5 * k, o), b = pt(8 * k, o + 0.8 * k), cc = pt(9.5 * k, o - 1.2 * k);
          P.limb(a, b, [[0, 1.3 * k, 1.3 * k], [1, 1.1 * k, 1.1 * k]], skin, g + 1, 1);
          P.limb(b, cc, [[0, 1.1 * k, 1.1 * k], [1, 0.8 * k, 0.8 * k]], skin, g + 1, 1);
        }
        P.limb(pt(1.5 * k, 2.8 * k), pt(5.5 * k, 4.8 * k), [[0, 1.4 * k, 1.4 * k], [1, 1 * k, 1 * k]], skin, g + 1, 1);
        break;
      }
      case 'point': {
        // index + middle raised (Gojo's technique hand)
        P.ell(pt(2.2 * k, -0.4 * k), 4 * k, 3.7 * k, ang, skin, g);
        P.limb(pt(4 * k, 1 * k), pt(10.5 * k, 2.2 * k), [[0, 1.5 * k, 1.5 * k], [1, 1.2 * k, 1.2 * k]], skin, g + 1, 1);
        P.limb(pt(4 * k, -0.6 * k), pt(10 * k, 0 * k), [[0, 1.5 * k, 1.5 * k], [1, 1.2 * k, 1.2 * k]], skin, g + 1, 1);
        break;
      }
      case 'sign': {
        // crossed index/middle pointing up (Unlimited Void)
        P.ell(pt(2 * k, 0), 4 * k, 3.6 * k, ang, skin, g);
        P.limb(pt(3.6 * k, 0.8 * k), pt(10.5 * k, 2.2 * k), [[0, 1.5 * k, 1.5 * k], [1, 1.2 * k, 1.2 * k]], skin, g + 1, 1);
        P.limb(pt(3.6 * k, 1.8 * k), pt(10 * k, -0.2 * k), [[0, 1.5 * k, 1.5 * k], [1, 1.2 * k, 1.2 * k]], skin, g + 2, 1);
        break;
      }
      case 'grip': {
        P.ell(pt(2.5 * k, 0), 4.6 * k, 4 * k, ang, skin, g);
        P.limb(pt(4 * k, 1.5 * k), pt(7 * k, -1.5 * k), [[0, 2.2 * k, 2.2 * k], [1, 1.8 * k, 1.8 * k]], skin, g + 1, 1);
        break;
      }
      default: {
        // fist: chunky rounded block with knuckles + thumb
        P.limb(pt(0.2 * k, 0), pt(4.6 * k, 0.2 * k), [[0, 3.6 * k, 3.9 * k], [0.5, 4.5 * k, 4.6 * k], [1, 4.2 * k, 4.3 * k]], skin, g, 1);
        P.limb(pt(1.2 * k, 3.0 * k), pt(5.2 * k, 3.2 * k), [[0, 1.7 * k, 1.7 * k], [1, 1.4 * k, 1.4 * k]], skin, g + 1, 1); // thumb
        P.line(pt(5.9 * k, 1.8 * k), pt(6.3 * k, -2.4 * k), U.pack(...skin.tones[1]), g, 1, true);
      }
    }
  };

  // Anime-style head base in 3/4 view: cranium + face profile + ear.
  // L(u,v) maps head-local coords (u forward, v up) to facing space.
  Body.head = function (P, L, a, skin, g, lineCol, shapeK = 0) {
    P.ell(L(-1.2, 2.2), 9.8, 10.4, a, skin, g);
    const sharp = shapeK; // 0 = Gojo (refined), 1 = Sukuna (heavier jaw)
    const face = [
      [6.0, 7.4], [8.4, 4.6], [8.9, 2.4], [8.5, 0.8], [9.4, -1.2], [11.1, -3.6], [9.6, -4.3], [9.5, -5.5],
      [9.9, -6.1], [9.3, -6.9], [9.6, -7.6], [9.2, -9.6 - sharp * 0.4], [7.4, -11.5 - sharp * 0.2],
      [3.6, -11.0 + sharp * 0.2], [-2.4, -6.4 + sharp * 0.4], [-5.2, -2.6], [-5.6, 4],
    ].map((q) => L(q[0], q[1]));
    const sc = L(1.5, -0.5);
    P.poly(face, skin, g, { sphere: [sc[0], sc[1], 12.5] });
    // ear
    P.ell(L(-3.0, -1.0), 2.0, 3.0, a, skin, g + 1);
    if (lineCol) {
      P.line(L(-3.3, 0.6), L(-2.6, -2.4), lineCol, g + 1, 1, true);
      // nostril + cheekbone hint
      P.dot(L(9.6, -4.0), lineCol, g, true);
    }
    // jaw shadow
    P.line(L(6.6, -11.0), L(0.2, -8.6), U.pack(...skin.tones[1]), g, 1, true);
    P.line(L(4.8, -2.8), L(6.6, -4.6), U.pack(...skin.tones[1]), g, 1, true);
  };

  // Simple dangling cloth strip (belt tails, sash ends).
  // root: facing-space anchor, dir: base direction (facing space), off: secondary offset [x,y]
  Body.strip = function (P, root, len, w0, w1, off, mat, g, bendK = 1) {
    const segs = 3;
    let prev = root;
    for (let i = 1; i <= segs; i++) {
      const t = i / segs;
      const p = [root[0] + off[0] * t * t * bendK, root[1] - len * t + off[1] * t * t * bendK];
      P.limb(prev, p, [[0, U.lerp(w0, w1, (i - 1) / segs), U.lerp(w0, w1, (i - 1) / segs)], [1, U.lerp(w0, w1, t), U.lerp(w0, w1, t)]], mat, g, 1);
      prev = p;
    }
  };
})();

<script>/* src/game/art-gojo.js */
// Gojo Satoru — procedural pixel-art painter.
(function () {
  'use strict';
  const JJK = (typeof window !== 'undefined' ? window : globalThis).JJK;
  const U = JJK.U, Rig = JJK.Rig, Body = JJK.Body;
  const Art = (JJK.Art = JJK.Art || {});

  const PAL = [
    // 0: blindfold / black shirt / grey pants (reference look)
    Body.palette({
      skin: ['#7a4038', '#c4836a', '#efc09e', '#ffe3c9'],
      shirt: ['#06060b', '#111119', '#1e1f2e', '#3a3e58'],
      pants: ['#3e3f52', '#72748a', '#a5a7ba', '#d5d7e4'],
      belt: ['#040407', '#0c0c13', '#181822', '#33354a'],
      shoe: ['#050508', '#101018', '#1d1d29', '#3d3f55'],
      sole: ['#2a2a33', '#3b3b46', '#4c4c58', '#62626f'],
      hair: ['#56618a', '#97a3c6', '#dde3f0', '#ffffff'],
      band: ['#040408', '#0b0b12', '#161722', '#2c2f44'],
    }),
    // 1: Jujutsu High uniform (navy) + round sunglasses
    Body.palette({
      skin: ['#7a4038', '#c4836a', '#efc09e', '#ffe3c9'],
      shirt: ['#0a0c1a', '#161a30', '#262c4c', '#454e7a'],
      pants: ['#0a0c1a', '#161a30', '#262c4c', '#454e7a'],
      belt: ['#040407', '#0c0c13', '#181822', '#33354a'],
      shoe: ['#050508', '#101018', '#1d1d29', '#3d3f55'],
      sole: ['#2a2a33', '#3b3b46', '#4c4c58', '#62626f'],
      hair: ['#56618a', '#97a3c6', '#dde3f0', '#ffffff'],
      band: ['#020203', '#08080c', '#101016', '#3a3d55'],
    }),
  ];
  PAL[1].glasses = true;
  PAL[1].longSleeve = true;

  const C_LINE = U.pack(70, 30, 40);
  const C_MOUTH = U.pack(120, 52, 54);
  const C_HAIRLINE = U.pack(150, 160, 192);
  const C_BANDHI = U.pack(70, 74, 100);
  const C_WHITE = U.pack(250, 252, 255);
  const C_IRIS = U.pack(70, 200, 255);
  const C_IRIS2 = U.pack(20, 110, 230);
  const C_PUPIL = U.pack(10, 30, 80);
  const C_SHIRTLINE = U.pack(52, 56, 80);

  // Hair (head-local u forward, v up, w = spring weight for tips).
  const HAIR = [
    [9.6, 4.8, 0], [13.6, 8.6, 0.6], [10.2, 9.8, 0.2], [14.2, 15.4, 0.8], [8.8, 13.6, 0.25],
    [11.2, 21.4, 1.0], [5.2, 16.2, 0.3], [5.0, 25.0, 1.2], [0.6, 17.6, 0.3], [-2.4, 24.6, 1.2],
    [-4.4, 17.2, 0.3], [-9.0, 22.4, 1.1], [-8.6, 15.4, 0.3], [-15.0, 18.6, 1.0], [-11.8, 12.0, 0.3],
    [-17.8, 11.6, 0.9], [-12.6, 7.6, 0.3], [-16.4, 4.4, 0.8], [-12.2, 1.0, 0.3], [-14.4, -4.4, 0.7],
    [-10.4, -3.4, 0.2], [-8.6, -7.6, 0.5], [-6.0, -3.0, 0], [-5.4, 4.2, 0], [-3, 4.8, 0], [4, 5.2, 0],
  ];
  const HAIR_BACK = [
    [-4, 9, 0], [-12, 11, 0.6], [-10.5, 7, 0.2], [-16.5, 6.5, 0.8], [-12.5, 3, 0.2], [-15.5, -2, 0.8],
    [-11.5, -1, 0.2], [-12.5, -6.5, 0.8], [-8.5, -3.5, 0.2], [-6.5, -7, 0.6], [-4.5, -2.5, 0], [-4, 4, 0],
  ];
  const HAIR_LINES = [[2, 7, 4.2, 21], [-2, 7, -2.2, 20.5], [-6, 7, -9.5, 18.5], [6.2, 7, 10.4, 17.5], [-9, 6, -14.5, 15], [8, 6.5, 12, 11]];
  // Fallen hair (blindfold off): soft spikes hang over the forehead and eyes.
  const HAIR_DOWN = [
    [10.6, 0.4, 0.5], [9.4, 3.8, 0.1], [12.0, 6.0, 0.5], [9.8, 9.4, 0.2], [11.4, 13.2, 0.5],
    [6.2, 13.4, 0.2], [5.4, 17.0, 0.6], [1.0, 14.8, 0.2], [-2.0, 17.6, 0.7], [-4.6, 14.0, 0.2],
    [-9.4, 15.6, 0.8], [-9.4, 11.2, 0.2], [-15.0, 10.6, 0.9], [-12.8, 6.2, 0.2], [-17.2, 2.4, 0.9],
    [-13.2, 0.2, 0.3], [-15.4, -5.8, 1.0], [-11.4, -3.8, 0.3], [-10.8, -9.0, 0.9], [-7.4, -4.6, 0.2],
    [-5.6, -1.0, 0], [-5.2, 4.6, 0], [0, 6.6, 0], [2.6, 6.2, 0.1], [3.4, 1.8, 0.5],
    [5.2, 4.6, 0.1], [7.4, 0.8, 0.5], [8.2, 4.4, 0.1],
  ];

  function drawArm(P, J, useN, pal, vis, g) {
    // n* joints = rear arm (drawn behind), f* joints = lead arm (camera side)
    const near = !useN;
    const sh = useN ? J.shN : J.shF, el = useN ? J.elN : J.elF, ha = useN ? J.haN : J.haF;
    const skin = near ? pal.skin : pal.skinF;
    const shirt = near ? pal.shirt : pal.shirtF;
    const shape = useN ? vis.pose.nhs : vis.pose.fhs;
    const ang = useN ? J.hnA : J.hfA;
    P.limb(sh, el, [[0, 6.8, 6.8], [0.45, 6.2, 6.6], [1, 4.6, 4.6]], skin, g, 1);
    if (pal.longSleeve) {
      P.limb(sh, el, [[0, 7.6, 7.6], [1, 5.6, 5.6]], shirt, g + 1, 1);
      P.limb(el, ha, [[0, 5.6, 5.6], [0.8, 4.6, 4.6], [1, 4.4, 4.4]], shirt, g + 2, 1, true, false);
    } else {
      const mid = Body.along(sh, el, 0.5, 0);
      P.limb(sh, mid, [[0, 7.7, 7.7], [1, 7.1, 7.1]], shirt, g + 1, 1, true, false);
      P.limb(el, ha, [[0, 4.9, 4.9], [0.35, 5.3, 5.1], [1, 3.5, 3.5]], skin, g + 2, 1);
    }
    Body.hand(P, ha, ang, shape, skin, g + 3, { lineCol: C_LINE });
  }

  function drawLeg(P, J, useN, pal, g) {
    const near = !useN;
    const hp = useN ? J.hpN : J.hpF, kn = useN ? J.knN : J.knF, an = useN ? J.anN : J.anF;
    const pants = near ? pal.pants : pal.pantsF;
    const fa = useN ? J.ftNA : J.ftFA;
    Body.foot(P, an, fa, near ? pal.shoe : pal.shoeF, g + 3, 'shoe', near ? pal.sole : pal.soleF);
    P.limb(hp, kn, [[0, 11, 11], [0.5, 10, 10.2], [1, 8.4, 8.4]], pants, g, 1);
    P.limb(kn, an, [[0, 8.4, 8.4], [0.45, 9.2, 9.2], [0.85, 8.4, 8.4], [1, 5.2, 5.2]], pants, g + 2, 1, true, false);
    // fabric folds
    const fold = U.pack(...pants.tones[1]);
    P.line(Body.along(hp, kn, 0.45, 2), Body.along(hp, kn, 0.8, -3), fold, g, 1, true);
    P.line(Body.along(kn, an, 0.25, -4), Body.along(kn, an, 0.6, 1), fold, g + 2, 1, true);
    P.line(Body.along(kn, an, 0.62, 3), Body.along(kn, an, 0.85, -2), fold, g + 2, 1, true);
  }

  function drawTorso(P, J, pal, vis, sec, g) {
    const hip = J.hip, waist = J.waist, chest = J.chest;
    // pelvis (pants top)
    P.ell([hip[0] + J.fwd[0] * 0.5, hip[1] - 1], 11.8, 9.4, Math.atan2(waist[1] - hip[1], waist[0] - hip[0]), pal.pants, g);
    // abdomen + chest (shirt)
    P.limb(hip, waist, [[0, 10.4, 10.6], [1, 9.8, 10.4]], pal.shirt, g, -1, false, false);
    P.limb(waist, chest, [[0, 9.8, 10.4], [0.4, 11.4, 12.2], [0.78, 12.4, 12.8], [1, 10.2, 10.4]], pal.shirt, g, -1);
    // pec / abs definition (subtle)
    const up = (t, s) => Body.along(waist, chest, t, -s); // axis up: invert side
    P.line(up(0.52, 11.5), up(0.6, 3), C_SHIRTLINE, g, 1, true);
    P.line(up(0.6, 3), up(0.86, 1.5), C_SHIRTLINE, g, 1, true);
    P.line(up(0.15, 6.5), up(0.4, 7.5), C_SHIRTLINE, g, 1, true);
    // belt
    const b0 = Body.along(hip, waist, 0.18, 0), b1 = Body.along(hip, waist, 0.5, 0);
    P.limb(b0, b1, [[0, 11.4, 11.6], [1, 11, 11.2]], pal.belt, g + 1, -1, false, false);
    P.line(Body.along(hip, waist, 0.34, 11.6 * -1), Body.along(hip, waist, 0.34, 11.4), U.pack(...pal.belt.tones[3]), g + 1, 1, true);
  }

  function drawBeltTails(P, J, pal, sec, g) {
    const knot = Body.along(J.hip, J.waist, 0.3, -9.5);
    const c = sec.cloth;
    Body.strip(P, [knot[0] + 0.5, knot[1]], 15, 2.4, 1.6, [c[1][0] * 0.8 + 1, c[1][1] * 0.6], pal.belt, g, 1);
    Body.strip(P, [knot[0] - 1.5, knot[1]], 12, 2.2, 1.4, [c[2][0] * 0.9 - 1, c[2][1] * 0.6], pal.belt, g, 1);
  }

  function drawHead(P, J, pal, vis, sec, g) {
    const C = J.head;
    const a = -J.headAng;
    const L = (u, v) => P.loc(C, a, u, v);
    const pose = vis.pose;
    const eyesOpen = pose.eyes === 'open' || vis.eyesOpen;
    const lift = vis.hairLift || 0;
    const H = (q) => L(q[0] + sec.hx * q[2] * 1.4, q[1] + sec.hy * q[2] * 1.2 + lift * q[2]);
    // back hair (behind head & neck)
    if (!eyesOpen) P.poly(HAIR_BACK.map(H), pal.hairF, g - 3, { sphere: [L(-8, 2)[0], L(-8, 2)[1], 12] });
    // neck
    P.limb(J.neck, L(-1.5, -5), [[0, 4.6, 4.8], [1, 4.4, 4.4]], pal.skin, g - 1, -1);
    Body.head(P, L, a, pal.skin, g, C_LINE, 0);
    // mouth
    const face2 = pose.face;
    if (face2 === 'shout' || face2 === 'hurt') {
      P.poly([L(7.8, -6.2), L(9.8, -6.0), L(9.6, -8.6), L(8.0, -8.4)], pal.skin, g + 1, { color: C_PUPIL });
      P.line(L(8.0, -6.3), L(9.6, -6.2), C_WHITE, g + 1, 1, true);
    } else if (face2 === 'grin' || face2 === 'smirk') {
      P.line(L(7.2, -7.4), L(9.4, -6.6), C_MOUTH, g + 1, 1, true);
    } else {
      P.line(L(7.4, -7.0), L(9.4, -6.9), C_MOUTH, g + 1, 1, true);
    }
    // eyes (blindfold / glasses are drawn after the hair)
    if (eyesOpen) {
      P.poly([L(3.6, 2.6), L(7.6, 2.8), L(7.5, 0.0), L(3.9, 0.3)], pal.skin, g + 1, { color: C_WHITE });
      P.poly([L(5.0, 2.6), L(7.4, 2.7), L(7.3, 0.0), L(5.1, 0.1)], pal.skin, g + 2, { color: C_IRIS2 });
      P.dot(L(5.9, 1.9), C_IRIS, g + 2);
      P.dot(L(6.4, 0.9), C_PUPIL, g + 2);
      P.dot(L(5.4, 2.2), C_WHITE, g + 2);
      P.line(L(3.2, 3.0), L(8.2, 3.4), C_WHITE, g + 2, 1);
      P.line(L(8.0, 3.4), L(9.6, 4.6), C_WHITE, g + 2, 1);
      P.line(L(4.2, -0.2), L(7.2, -0.3), U.pack(...pal.skin.tones[1]), g + 1, 1);
    }
    // hair
    const hair = (eyesOpen ? HAIR_DOWN : HAIR).map(H);
    const hc = L(-1, 9);
    P.poly(hair, pal.hair, g + 4, { sphere: [hc[0], hc[1], 17] });
    const sl = C_HAIRLINE;
    if (!eyesOpen) {
      for (const h of HAIR_LINES) P.line(H([h[0], h[1], 0.1]), H([h[2], h[3], 0.6]), sl, g + 4, 1, true);
      P.line(H([-1, 13, 0.2]), H([1.4, 19, 0.6]), C_WHITE, g + 4, 1, true);
    } else {
      P.line(L(2, 11), L(6, 4), sl, g + 4, 1, true);
      P.line(L(-4, 11), L(-6.4, 3), sl, g + 4, 1, true);
      P.line(L(-9, 6), L(-11.6, -1), sl, g + 4, 1, true);
    }
    if (!eyesOpen && pal.glasses) {
      P.ell(L(7.6, 1.0), 3.4, 2.9, a, pal.band, g + 6);
      P.line(L(-6, 1.8), L(4.4, 1.8), U.pack(30, 30, 40), g + 6, 1);
      P.dot(L(6.6, 2.0), C_BANDHI, g + 6);
    } else if (!eyesOpen) {
      const band = [[-11.2, 5.0], [9.6, 5.2], [10.4, 0.0], [9.2, -0.8], [-11.0, -0.4]].map((q) => L(q[0], q[1]));
      P.poly(band, pal.band, g + 6, { sphere: [L(0, 2.5)[0], L(0, 2.5)[1], 12] });
      P.line(L(-9.5, 4.2), L(9.0, 4.4), C_BANDHI, g + 6, 1, true);
      const hx = sec.hx * 0.6, hy = sec.hy * 0.6;
      P.poly([L(-10.6, 3.6), L(-16.5 + hx, -0.4 + hy), L(-15.6 + hx, -3.4 + hy), L(-10.4, 0.6)], pal.band, g + 6, { n: [0, 0, 1] });
    }
  }

  Art.gojo = {
    id: 'gojo',
    name: 'GOJO',
    full: 'SATORU GOJO',
    dims: Object.assign({}, Rig.DIMS, { ua: 24, fa: 21, thigh: 37, shin: 36, abd: 19, chest: 24 }),
    palettes: PAL,
    outline: [14, 10, 26],
    draw(r, J, xf, vis) {
      const P = Rig.painter(r, xf);
      const pal = PAL[vis.pal || 0];
      const sec = vis.sec;
      drawArm(P, J, true, pal, vis, 1);
      drawLeg(P, J, true, pal, 6);
      drawTorso(P, J, pal, vis, sec, 12);
      drawLeg(P, J, false, pal, 16);
      drawBeltTails(P, J, pal, sec, 22);
      drawHead(P, J, pal, vis, sec, 25);
      drawArm(P, J, false, pal, vis, 34);
    },
  };
})();

<script>/* src/game/art-sukuna.js */
// Ryomen Sukuna — procedural pixel-art painter.
(function () {
  'use strict';
  const JJK = (typeof window !== 'undefined' ? window : globalThis).JJK;
  const U = JJK.U, Rig = JJK.Rig, Body = JJK.Body;
  const Art = (JJK.Art = JJK.Art || {});

  const PAL = [
    // 0: black gi with white trim (reference look), black spiky hair
    Body.palette({
      skin: ['#5e3226', '#a5664a', '#d79a74', '#f5c6a0'],
      top: ['#050407', '#0f0d13', '#1d1a24', '#3a3446'],
      trim: ['#7d7a86', '#b4b1be', '#e2e0ea', '#ffffff'],
      pants: ['#050407', '#0e0c12', '#1b1822', '#363042'],
      sash: ['#76737f', '#aeacb8', '#dddbe5', '#fbfbff'],
      wrap: ['#6a6672', '#9e9aa8', '#c9c6d2', '#ebe9f2'],
      sole: ['#2a1c14', '#45301f', '#5e4430', '#7a5a40'],
      hair: ['#050408', '#120f18', '#231e2c', '#463c58'],
      tattoo: ['#050405', '#0b090c', '#141016', '#221c24'],
    }),
    // 1: Heian-era white kimono, pink hair
    Body.palette({
      skin: ['#6a3a2c', '#b67458', '#e6aa84', '#ffd6b2'],
      top: ['#6c6a78', '#a9a7b6', '#dcdae6', '#ffffff'],
      trim: ['#0a080c', '#16131a', '#26222c', '#443c4c'],
      pants: ['#0b080c', '#1a141c', '#2c232e', '#4a3c4c'],
      sash: ['#2a0a0e', '#4c1218', '#781c24', '#a8323a'],
      wrap: ['#6a6672', '#9e9aa8', '#c9c6d2', '#ebe9f2'],
      sole: ['#2a1c14', '#45301f', '#5e4430', '#7a5a40'],
      hair: ['#7a2a44', '#c45a7a', '#f08ca8', '#ffc4d4'],
      tattoo: ['#050405', '#0b090c', '#141016', '#221c24'],
    }),
  ];
  PAL[1].lineTop = true;

  const C_LINE = U.pack(60, 26, 20);
  const C_MARK = U.pack(16, 10, 14);
  const C_EYE = U.pack(255, 40, 40);
  const C_EYE2 = U.pack(150, 0, 10);
  const C_SCLERA = U.pack(240, 220, 210);
  const C_TEETH = U.pack(250, 246, 236);
  const C_MOUTHIN = U.pack(60, 8, 12);
  const C_LIP = U.pack(110, 50, 40);

  const HAIR = [
    [8.8, 4.6, 0.1], [12.4, 3.4, 0.6], [10.2, 7.0, 0.2], [14.4, 8.2, 0.8], [9.8, 10.4, 0.25],
    [13.2, 15.6, 0.9], [7.4, 13.8, 0.3], [8.4, 21.2, 1], [3.2, 16.0, 0.3], [1.6, 23.0, 1.1],
    [-1.4, 16.8, 0.3], [-5.6, 22.4, 1.1], [-6.0, 16.0, 0.3], [-12.2, 19.6, 1], [-10.2, 13.2, 0.3],
    [-17.4, 13.6, 1], [-12.6, 9.0, 0.3], [-18.2, 6.6, 0.9], [-12.8, 4.4, 0.3], [-16.0, 0.2, 0.8],
    [-12.6, -4.6, 0.7], [-9.0, -7.2, 0.5], [-6.0, -2.6, 0], [-5.6, 4.6, 0], [-3.0, 5.4, 0], [2.0, 5.6, 0], [4.8, 3.6, 0.1],
    [6.0, 0.6, 0.3], [7.2, 3.0, 0.1],
  ];
  const HAIR_BACK = [
    [-4, 9, 0], [-13, 10, 0.6], [-11, 6, 0.2], [-17, 4.5, 0.8], [-12.5, 1.5, 0.2], [-15.5, -3.5, 0.8],
    [-11, -2, 0.2], [-11.5, -7.5, 0.8], [-8, -4, 0.2], [-6, -7.5, 0.6], [-4.5, -2.5, 0], [-4, 4, 0],
  ];
  const HAIR_LINES = [[2, 7, 1.6, 21], [-2, 8, -5.4, 20.5], [-7, 7, -12, 17.5], [6.2, 7, 12.6, 14.5], [-10, 5, -16.5, 7.6], [8, 5.5, 13.4, 7.6]];

  function drawArm(P, J, useN, pal, vis, g) {
    // n* joints = rear arm (drawn behind), f* joints = lead arm (camera side)
    const near = !useN;
    const sh = useN ? J.shN : J.shF, el = useN ? J.elN : J.elF, ha = useN ? J.haN : J.haF;
    const skin = near ? pal.skin : pal.skinF;
    const top = near ? pal.top : pal.topF;
    const trim = near ? pal.trim : pal.trimF;
    const tat = near ? pal.tattoo : pal.tattooF;
    const shape = useN ? vis.pose.nhs : vis.pose.fhs;
    const ang = useN ? J.hnA : J.hfA;
    P.limb(sh, el, [[0, 7.2, 7.2], [0.45, 6.8, 7.0], [1, 5.0, 5.0]], skin, g, 1);
    // forearm with tattoo bands
    P.limb(el, ha, [[0, 5.2, 5.2], [0.35, 5.7, 5.4], [1, 3.7, 3.7]], skin, g + 2, 1);
    const b1 = Body.along(el, ha, 0.62, 0), b2 = Body.along(el, ha, 0.74, 0), b3 = Body.along(el, ha, 0.86, 0);
    P.limb(b1, Body.along(el, ha, 0.68, 0), [[0, 5.0, 5.0], [1, 4.8, 4.8]], tat, g + 3, 1, false, false);
    P.limb(b2, Body.along(el, ha, 0.79, 0), [[0, 4.6, 4.6], [1, 4.4, 4.4]], tat, g + 3, 1, false, false);
    P.limb(b3, Body.along(el, ha, 0.9, 0), [[0, 4.2, 4.2], [1, 4.0, 4.0]], tat, g + 3, 1, false, false);
    P.line(Body.along(el, ha, 0.2, -3), Body.along(el, ha, 0.5, 2), U.pack(...tat.tones[2]), g + 2, 1, true);
    // wide kimono sleeve over the upper arm, with a drape hanging under gravity
    const end = Body.along(sh, el, 0.7, 0);
    const o1 = Body.along(sh, el, 0.7, 9.2), o2 = Body.along(sh, el, 0.7, -9.2);
    const lo = o1[1] < o2[1] ? o1 : o2, hi = o1[1] < o2[1] ? o2 : o1;
    const sw = vis.sec ? vis.sec.cloth[0][0] * 0.5 : 0;
    P.poly([Body.along(sh, el, 0.15, lo === o1 ? 8 : -8), lo, [lo[0] - 3 + sw, lo[1] - 7], [lo[0] - 8 + sw, lo[1] - 5], Body.along(sh, el, 0.2, 0)], top, g, { n: [-0.2, 0.3, 0.93] });
    P.limb(sh, end, [[0, 8.6, 8.6], [0.6, 9.4, 9.0], [1, 9.6, 9.0]], top, g + 1, 1, true, false);
    P.line(o1, o2, U.pack(...trim.tones[2]), g + 1, 1, true);
    void hi;
    Body.hand(P, ha, ang, shape, skin, g + 4, { lineCol: C_LINE });
  }

  function drawLeg(P, J, useN, pal, g) {
    const near = !useN;
    const hp = useN ? J.hpN : J.hpF, kn = useN ? J.knN : J.knF, an = useN ? J.anN : J.anF;
    const pants = near ? pal.pants : pal.pantsF;
    const wrap = near ? pal.wrap : pal.wrapF;
    const fa = useN ? J.ftNA : J.ftFA;
    Body.foot(P, an, fa, near ? pal.skin : pal.skinF, g + 4, 'sandal', near ? pal.sole : pal.soleF);
    // wrapped shin
    P.limb(Body.along(kn, an, 0.55, 0), an, [[0, 6.4, 6.6], [1, 4.6, 4.6]], wrap, g + 2, 1, false, true);
    const wl = U.pack(...wrap.tones[1]);
    for (let i = 0; i < 3; i++) P.line(Body.along(kn, an, 0.66 + i * 0.1, -6), Body.along(kn, an, 0.6 + i * 0.1, 6), wl, g + 2, 1, true);
    // hakama
    P.limb(hp, kn, [[0, 12.2, 12.2], [0.6, 11.6, 12], [1, 10.6, 10.8]], pants, g, 1);
    P.limb(kn, Body.along(kn, an, 0.62, 0), [[0, 10.6, 10.8], [0.7, 11.6, 11.4], [1, 9.4, 9.4]], pants, g + 3, 1, true, false);
    const fold = U.pack(...pants.tones[3]);
    P.line(Body.along(hp, kn, 0.3, 4), Body.along(hp, kn, 0.85, -2), fold, g, 1, true);
    P.line(Body.along(kn, an, 0.1, -5), Body.along(kn, an, 0.5, -2), fold, g + 3, 1, true);
  }

  function drawTorso(P, J, pal, vis, sec, g) {
    const hip = J.hip, waist = J.waist, chest = J.chest;
    P.ell([hip[0] + J.fwd[0] * 0.5, hip[1] - 1], 13.4, 10.2, Math.atan2(waist[1] - hip[1], waist[0] - hip[0]), pal.pants, g);
    P.limb(hip, waist, [[0, 11, 11.2], [1, 10.4, 11]], pal.top, g, -1, false, false);
    P.limb(waist, chest, [[0, 10.4, 11], [0.4, 12, 12.8], [0.78, 13.2, 13.4], [1, 10.8, 11]], pal.top, g, -1);
    const up = (t, s) => Body.along(waist, chest, t, -s);
    // V collar: skin showing + white trim lapels
    P.poly([up(1.02, 7), up(1.02, 12), up(0.5, 9.6), up(0.62, 6.4)], pal.skin, g + 1, { n: [0.2, -0.3, 0.93] });
    const trim = U.pack(...pal.trim.tones[2]);
    const trimS = U.pack(...pal.trim.tones[1]);
    P.line(up(1.05, 5.5), up(0.48, 10.4), trim, g + 1, 2);
    P.line(up(1.02, 12.6), up(0.5, 11.4), trimS, g + 1, 1);
    P.line(up(0.95, -2), up(1.05, 5.5), trim, g + 1, 2);
    // chest fold shadows
    const fl = U.pack(...pal.top.tones[3]);
    P.line(up(0.3, 4), up(0.5, -6), fl, g, 1, true);
    P.line(up(0.7, -4), up(0.85, -9), fl, g, 1, true);
    // sash
    const b0 = Body.along(hip, waist, 0.12, 0), b1 = Body.along(hip, waist, 0.62, 0);
    P.limb(b0, b1, [[0, 12.2, 12.6], [1, 11.4, 11.8]], pal.sash, g + 2, -1, false, false);
    P.line(Body.along(hip, waist, 0.37, 12.4), Body.along(hip, waist, 0.37, -12.6), U.pack(...pal.sash.tones[1]), g + 2, 1, true);
  }

  function drawSashTails(P, J, pal, sec, g) {
    const knot = Body.along(J.hip, J.waist, 0.4, 11.2); // back knot
    const c = sec.cloth;
    P.ell(knot, 3.4, 2.8, 0, pal.sash, g);
    Body.strip(P, [knot[0] - 1, knot[1] - 1], 22, 3.2, 2.2, [c[2][0] * 1.1 - 3, c[2][1] * 0.8], pal.sashF, g - 1, 1);
    Body.strip(P, [knot[0] + 1, knot[1] - 1], 17, 3, 2, [c[1][0] * 1.0 - 1.5, c[1][1] * 0.8], pal.sash, g, 1);
  }

  function drawHead(P, J, pal, vis, sec, g) {
    const C = J.head;
    const a = -J.headAng;
    const L = (u, v) => P.loc(C, a, u, v);
    const pose = vis.pose;
    const H = (q) => L(q[0] + sec.hx * q[2] * 1.3, q[1] + sec.hy * q[2] * 1.1 + (vis.hairLift || 0) * q[2]);
    P.poly(HAIR_BACK.map(H), pal.hairF, g - 3, { sphere: [L(-8, 2)[0], L(-8, 2)[1], 12] });
    P.limb(J.neck, L(-1.5, -5), [[0, 5.2, 5.4], [1, 4.8, 4.8]], pal.skin, g - 1, -1);
    Body.head(P, L, a, pal.skin, g, C_LINE, 1);
    // eye: narrow, menacing
    P.poly([L(3.8, 1.8), L(7.7, 2.5), L(7.4, 0.4), L(4.1, 0.6)], pal.skin, g + 1, { color: C_SCLERA });
    P.poly([L(5.4, 2.2), L(7.4, 2.4), L(7.2, 0.5), L(5.5, 0.6)], pal.skin, g + 2, { color: C_EYE2 });
    P.dot(L(6.2, 1.6), C_EYE, g + 2);
    P.line(L(3.6, 2.2), L(7.8, 2.8), C_MARK, g + 2, 1);
    // brow angled down toward the nose
    P.line(L(3.4, 4.6), L(8.4, 3.4), C_MARK, g + 2, 1);
    // markings: two thin lines on the cheek under the eye
    P.line(L(4.4, -0.8), L(7.4, -1.1), C_MARK, g + 2, 1);
    P.line(L(3.8, -2.2), L(6.8, -2.5), C_MARK, g + 2, 1);
    // mouth
    const f = pose.face;
    if (f === 'grin' || f === 'shout') {
      const open = f === 'shout' ? 2.4 : 0.9;
      P.poly([L(6.2, -6.0), L(9.8, -5.8), L(9.6, -6.6 - open), L(7.0, -6.8 - open * 0.7)], pal.skin, g + 1, { color: C_MOUTHIN });
      P.line(L(6.4, -6.1), L(9.6, -5.9), C_TEETH, g + 2, 1);
      if (f === 'shout') P.line(L(7.2, -8.6), L(9.4, -8.4), C_TEETH, g + 2, 1);
    } else if (f === 'hurt') {
      P.poly([L(7.2, -6.2), L(9.6, -6.0), L(9.4, -8.2), L(7.6, -7.8)], pal.skin, g + 1, { color: C_MOUTHIN });
    } else {
      P.line(L(6.6, -6.6), L(9.5, -6.5), C_LIP, g + 1, 1, true);
      P.dot(L(6.4, -6.2), C_LIP, g + 1, true);
    }
    // spiky hair
    const hair = HAIR.map(H);
    const hc = L(-1, 8);
    P.poly(hair, pal.hair, g + 4, { sphere: [hc[0], hc[1], 16] });
    const sl = U.pack(...pal.hair.tones[3]);
    for (const h of HAIR_LINES) P.line(H([h[0], h[1], 0.1]), H([h[2], h[3], 0.6]), sl, g + 4, 1, true);
  }

  Art.sukuna = {
    id: 'sukuna',
    name: 'SUKUNA',
    full: 'RYOMEN SUKUNA',
    dims: Object.assign({}, Rig.DIMS, { ua: 24.5, fa: 21.5, thigh: 35.5, shin: 34.5, abd: 19, chest: 25, shN: -6, shF: 6 }),
    palettes: PAL,
    outline: [16, 6, 10],
    draw(r, J, xf, vis) {
      const P = Rig.painter(r, xf);
      const pal = PAL[vis.pal || 0];
      const sec = vis.sec;
      drawArm(P, J, true, pal, vis, 1);
      drawSashTails(P, J, pal, sec, 6);
      drawLeg(P, J, true, pal, 8);
      drawTorso(P, J, pal, vis, sec, 15);
      drawLeg(P, J, false, pal, 19);
      drawHead(P, J, pal, vis, sec, 27);
      drawArm(P, J, false, pal, vis, 36);
    },
  };
})();

// Shared character kit: move normalization, universal moves, reaction poses,
// state animations and command tables.
(function () {
  'use strict';
  const JJK = (typeof window !== 'undefined' ? window : globalThis).JJK;
  const U = JJK.U, B = JJK.BTN;
  JJK.Chars = JJK.Chars || {};
  const Kit = (JJK.Kit = {});

  const TIER_STR = { 1: 'l', 2: 'm', 3: 'h', 4: 's', 5: 's', 6: 'x', 7: 'x', 8: 'x' };
  const TIER_STUN = { 1: [13, 10], 2: [17, 13], 3: [21, 16], 4: [22, 16], 5: [24, 18], 6: [30, 20], 7: [34, 22], 8: [40, 24] };

  // Normalize a move definition.
  Kit.move = function (id, o) {
    const m = Object.assign({ id, tier: 1, s: 5, a: 3, r: 10 }, o);
    if (m.total == null) m.total = m.s + m.a - 1 + m.r;
    if (m.hits) {
      m.hits = m.hits.map((h) => {
        const hh = Object.assign({}, h);
        if (!hh.f) hh.f = [m.s, m.s + m.a - 1];
        if (hh.tier == null) hh.tier = m.tier;
        if (!hh.str) hh.str = TIER_STR[hh.tier] || 'm';
        const st = TIER_STUN[hh.tier] || [16, 12];
        if (hh.hs == null) hh.hs = st[0];
        if (hh.bs == null) hh.bs = st[1];
        if (!hh.guard) hh.guard = 'mid';
        return hh;
      });
    }
    if (typeof m.anim === 'function') m.anim = m.anim(m);
    if (Array.isArray(m.anim)) m.anim = { keys: m.anim };
    if (!m.anim) m.anim = { keys: [[0, 'idle']] };
    m.anim.keys = Kit.anticipate(m.anim.keys);
    return m;
  };

  // Strike timing: hold the wind-up pose and snap into the strike only in the last
  // 2 frames before it lands, instead of easing out over the whole startup.
  Kit.anticipate = function (keys) {
    const out = [];
    for (let i = 0; i < keys.length; i++) {
      const k = keys[i];
      const prev = out[out.length - 1];
      if (prev && k[2] === 'snap' && k[0] - prev[0] > 3) out.push([k[0] - 2, prev[1], 'inOut']);
      out.push(k);
    }
    return out;
  };

  Kit.build = function (defs) {
    const out = {};
    for (const id in defs) out[id] = Kit.move(id, defs[id]);
    return out;
  };

  // ------------------------------------------------------------ shared poses
  Kit.basePoses = {
    hitHigh: { hip: [-5, 64], lean: -14, bend: -10, head: -22, nh: [0, -30], fh: [8, -28], nf: [-18, 0], ff: [14, 0], face: 'hurt', nhs: 'open', fhs: 'open' },
    hitHigh2: { hip: [-3, 65], lean: -4, bend: -4, head: -8, nh: [6, -26], fh: [12, -22], nf: [-17, 0], ff: [15, 0], face: 'hurt' },
    hitMid: { hip: [-7, 60], lean: 26, bend: 18, head: 20, nh: [6, -26], fh: [12, -30], nf: [-20, 0], ff: [11, 0], face: 'hurt', nhs: 'open', fhs: 'open' },
    hitMid2: { hip: [-4, 63], lean: 14, bend: 8, head: 8, nh: [10, -22], fh: [14, -24], nf: [-18, 0], ff: [13, 0], face: 'hurt' },
    hitLow: { hip: [-3, 56], lean: 16, bend: 6, head: 4, nh: [10, -30], fh: [16, -28], nf: [-14, 0], ff: [18, 6], fk: 1, face: 'hurt', nhs: 'open', fhs: 'open' },
    juggleUp: { hip: [0, 66], lean: -26, bend: -16, head: -26, nh: [-12, 8], fh: [8, 12], nf: [-22, 18], ff: [12, 26], rot: -22, face: 'hurt', nhs: 'open', fhs: 'open' },
    juggleDown: { hip: [0, 62], lean: -46, bend: -10, head: -20, nh: [-18, -6], fh: [4, 6], nf: [-6, 26], ff: [22, 30], rot: -58, face: 'hurt', nhs: 'open', fhs: 'open' },
    down: { hip: [-6, 9], lean: -84, bend: -4, head: -16, nh: [-6, -12], fh: [8, -10], nf: [63, 0], ff: [57, 8], nk: 1, fk: 1, face: 'hurt', nhs: 'open', fhs: 'open' },
    downHard: { hip: [-6, 9], lean: -86, bend: -2, head: -24, nh: [-14, 4], fh: [10, -10], nf: [64, 0], ff: [50, 16], face: 'hurt', nhs: 'open', fhs: 'open' },

      this.resetRound(side === 0 ? -150 : 150, side === 0 ? 1 : -1);
    }

    resetRound(x, facing) {
      this.x = x; this.y = 0; this.vx = 0; this.vy = 0;
      this.facing = facing;
      this.hp = this.stats.hp;
      this.red = 0; // recoverable (RCT) health
      this.redDelay = 0;
      this.guard = 100;
      this.guardDelay = 0;
      this.dg = 0; // domain gauge
      this.st = 'idle'; this.sf = 0;
      this.move = null; this.mf = 0;
      this.hitstop = 0; this.stun = 0;
      this.air = false; this.airActions = this.stats.airActions;
      this.pending = null;
      this.inv = 0; this.invType = 'all';
      this.throwInv = 0;
      this.combo = { hits: 0, dmg: 0, scale: 1, jug: 0, wb: false, gb: false, time: 0, used: {}, starter: 1 };
      this.kd = null; this.bounce = null;
      this.contact = null; this.chain = 0;
      this.hitIds = {};
      this.flash = 0; this.shakeT = 0;
      this.burnout = 0;
      this.backHeld = 0;
      this.af = 0; this.anim = null; this.animName = '';
      this.pose = null; this.J = null; this.hurt = [];
      this.prevEnds = null; this.smears = [];
      this.afterT = 0; this.afterCol = null;
      this.visible = true;
      this.ko = false;
      this.lowHpFired = false;
      this.lastMoveId = null;
      this.counterType = null;
      this.timeScale = 1; this.tsAcc = 0; this.slowT = 0;
      this.grab = null; this.thrower = null;
      this.techWindow = 0;
      this.struggle = 0;
      this.wallSplat = 0;
      this.aura = null;
      this.hairLift = 0;
      this.dmgTakenRound = 0;
      this.cs = this.def.initState ? this.def.initState(this) : {};
      this.sec.reset();
      this.after.length = 0;
      this.buf.clear();
      this.setAnim('idle');
      this.updatePose();
    }

    get opp() { return this.match ? this.match.opp(this) : null; }
    get onGround() { return this.y <= 0.001 && !this.air; }
    get maxHp() { return this.stats.hp; }

    // ------------------------------------------------------------ input
    readInput() {
      const c = this.ctrl;
      const locked = !this.match || this.match.inputLocked;
      const dir = locked ? 5 : this.facing > 0 ? c.dir : JJK.mirrorDir(c.dir);
      this.buf.push(dir, locked ? 0 : c.held, locked ? 0 : c.pressed, locked ? false : c.dash);
      const d0 = this.buf.dir(0);
      this.backHeld = d0 === 4 || d0 === 1 || d0 === 7 ? this.backHeld + 1 : 0;
      if (!locked && this.buf.pr(0) & (B.L | B.M | B.H | B.SP | B.SU | B.UN)) {
        const r = this.recognize(1);
        if (r) this.pending = { cmd: r, score: this.lastScore, t: 8, at: this.match ? this.match.frame : 0 };
      }
    }

    // Find the best matching command for a press within the last `within` frames.
    recognize(within = 1) {
      const cmds = this.def.commands;
      const buf = this.buf;
      const air = this.air || this.y > 0;
      const crouch = buf.dir(0) <= 3;
      let best = null, bestScore = -1e9;
      for (let i = 0; i < cmds.length; i++) {
        const c = cmds[i];
        if (c.air === true && !air) continue;
        if (c.air === false && air) continue;
        if (c.air === undefined && air) continue; // default ground-only
        let score = 1000 - i;
        if (c.chord) {
          if (!buf.chordWithin(c.b, 3, within)) continue;
          score += 100000;
        } else if (!buf.pressedWithin(c.b, within)) continue;
        if (c.m) {
          const age = buf.motion(MOT[c.m], MWIN[c.m] + (c.m.length > 3 ? 4 : 0), 9);
          if (age < 0) continue;
          score += 50000 + c.m.length * 1000 - age * 20;
        }
        if (c.dir && !c.dir.includes(buf.dir(0))) continue;
        if (c.crouch === true && !crouch) continue;
        if (c.crouch === false && crouch) continue;
        if (c.cond && !c.cond(this)) continue;
        if (score > bestScore) { best = c; bestScore = score; }
      }
      this.lastScore = bestScore;
      return best;
    }

    // Input upgrade window: during the first frames of a move, a stronger command
    // built from the same press (chord, completed motion) replaces it.
    tryUpgrade() {
      const mv = this.move;
      if (!mv || this.mf > 3 || this.moveScore == null || mv.tier > 5 || this.contact) return false;
      const r = this.recognize(4);
      if (!r || r.id === mv.id || this.lastScore < this.moveScore + 900) return false;
      const nm = this.def.moves[r.id];
      if (!nm || (nm.cond && !nm.cond(this))) return false;
      if (nm.cost && !this.canAfford(nm.cost + 0) && !(mv.cost && this.canAfford(nm.cost - mv.cost))) return false;
      if (mv.cost) this.meter = Math.min(300, this.meter + mv.cost);
      if (mv.onEnd) mv.onEnd(this, this.match);
      this.invisible = false;
      const score = this.lastScore;
      if (this.startMove(r.id)) { this.moveScore = score; this.pending = null; return true; }
      return false;
    }

    // ------------------------------------------------------------ helpers
    get actionable() {
      if (this.ko) return false;
      return !!NEUTRAL[this.st] || (this.st === 'air' && !this.move) || (this.st === 'land' && this.sf > 1);
    }
    face(opp) {
      if (Math.abs(opp.x - this.x) > 2) this.facing = opp.x > this.x ? 1 : -1;
    }
    setState(st) {
      this.st = st; this.sf = 0;
      if (st !== 'move') this.move = null;
    }
    setAnim(name, keepFrame) {
      if (this.animName === name && keepFrame !== false) return;
      this.animName = name;
      this.anim = this.def.anims[name] || this.def.anims.idle;
      this.af = 0;
    }
    meterGain(n) {
      if (n <= 0) return;
      const t = this.match && this.match.training;
      this.meter = U.clamp(this.meter + n * (this.def.meterMult || 1), 0, 300);
      if (t && t.infMeter) this.meter = 300;
    }
    spend(n) {
      const t = this.match && this.match.training;
      if (t && t.infMeter) return true;
      if (this.meter < n) return false;
      this.meter -= n;
      return true;
    }
    canAfford(n) {
      const t = this.match && this.match.training;
      return (t && t.infMeter) || this.meter >= n;
    }
    dist(o) { return Math.abs(o.x - this.x); }

    // ------------------------------------------------------------ moves
    startMove(id, opts = {}) {
      const mv = this.def.moves[id];
      if (!mv) { console.warn('missing move', id); return false; }
      const paid = mv.cost && !opts.free ? mv.cost : 0;
      if (paid && !this.spend(paid)) return false;
      const prevData = this.moveData, prevMove = this.move, prevSt = this.st;
      this.moveData = opts.data || {};
      if (mv.onStart && mv.onStart(this, this.match, opts) === false) {
        this.moveData = prevData;
        if (paid) this.meter = Math.min(300, this.meter + paid);
        return false;
      }
      void prevMove; void prevSt;
      this.st = 'move'; this.sf = 0;
      this.move = mv; this.mf = 0;
      this.moveScore = null;
      this.contact = null;
      this.hitIds = {};
      this.lastMoveId = id;
      this.af = 0;
      this.anim = mv.anim;
      this.animName = 'move:' + id;
      if (mv.air) this.air = true;
      if (!mv.air && !mv.keepVel) { this.vx = 0; }
      if (mv.tier <= 3) this.chain = (opts.chain ? this.chain : 0) + 1;
      else this.chain = 0;
      if (mv.sfxStart && JJK.Audio) JJK.Audio.play(mv.sfxStart, { pan: this.pan() });
      if (mv.voice && JJK.Voice) JJK.Voice.say(this.def.id, mv.voice);
      if (mv.grunt && JJK.Voice) JJK.Voice.grunt(this.def.id, mv.grunt);
      if (mv.after) this.afterT = mv.after;
      if (this.match) this.match.onMoveStart(this, mv);
      return true;
    }

    // Can the current move be cancelled into `mv`?
    canCancel(mv) {
      const cur = this.move;
      if (!cur || !mv) return false;
      if (cur.noCancel) return false;
      if (mv.air !== !!cur.air && !(mv.air && cur.jc)) {
        if (mv.air && !cur.air) return false;
        if (!mv.air && cur.air) return false;
      }
      const tierNew = mv.tier, tierCur = cur.tier;
      const contact = this.contact;
      const inWindow = this.mf >= (cur.cancelFrom || cur.s) && this.mf <= (cur.cancelTo || cur.s + cur.a + 10);
      if (cur.whiffCancel && tierNew >= 4 && this.mf >= cur.s && this.mf <= cur.s + cur.a + 4) return true;
      if (!contact || !inWindow) return false;
      if (cur.cancels === false) return false;
      if (tierCur <= 3) {
        if (tierNew > tierCur) return tierNew >= 4 || !cur.noChain;
        if (tierNew === tierCur && tierCur === 1 && this.chain < 3 && mv.tier === 1) return true;
        return false;
      }
      // special -> super/ult ; super -> ult ; ex -> super
      if (tierCur === 4 && tierNew >= 6) return true;
      if (tierCur === 5 && tierNew >= 6) return true;
      if (tierCur === 6 && tierNew >= 7 && tierNew < 8) return true;
      if (cur.cancelInto && cur.cancelInto.includes(mv.id)) return true;
      return false;
    }

    tryPending() {
      const p = this.pending;
      if (!p) return false;
      const mv = this.def.moves[p.cmd.id];
      if (!mv) { this.pending = null; return false; }
      if (mv.cost && !this.canAfford(mv.cost)) { this.pending = null; if (this.match) this.match.onNoMeter(this); return false; }
      if (this.st === 'move') {
        if (!this.canCancel(mv)) return false;
      } else if (!this.actionable) return false;
      if (mv.cond && !mv.cond(this)) { this.pending = null; return false; }
      this.pending = null;
      if (!this.move || this.st !== 'move') this.faceOpp();
      // Black Flash: a heavy cancelled within a 1-frame window of the hit-stop ending
      const cur = this.st === 'move' ? this.move : null;
      const bf = cur && cur.tier <= 3 && mv.tier === 3 && this.contact === 'hit' && this.hsEnd != null &&
        Math.abs((p.at || 0) - this.hsEnd) <= 1 && this.cleanPress(p);
      const ok = this.startMove(mv.id, { chain: this.st === 'move' });
      if (ok) { this.moveScore = p.score; this.bfArmed = !!bf; }
      return ok;
    }
    faceOpp() {
      const o = this.opp;
      if (o && !this.air) this.face(o);
    }

    // ------------------------------------------------------------ update
    update(m) {
      this.match = m;
      const opp = m.opp(this);
      this.readInput();
      if (this.hitstop > 0) {
        this.hitstop--;
        this.shakeT++;
        if (this.hitstop === 0 && this.contact === 'hit') this.hsEnd = m.frame;
        return;
      }
      this.shakeT = 0;
      // per-fighter slow motion (Infinity slows attackers)
      if (this.slowT > 0) {
        this.slowT--;
        this.tsAcc += this.timeScale;
        if (this.tsAcc < 1) { this.animate(); return; }
        this.tsAcc -= 1;
      }
      this.sf++;
      this.tickTimers(m);
      if (this.def.update) this.def.update(this, m);
      this.stateUpdate(m, opp);
      this.physics(m);
      if (this.pending && --this.pending.t <= 0) this.pending = null;
      this.animate();
    }

    tickTimers(m) {
      if (this.inv > 0) this.inv--;
      if (this.throwInv > 0) this.throwInv--;
      if (this.flash > 0) this.flash--;
      if (this.burnout > 0) {
        this.burnout--;
        if (this.burnout === 0 && m) m.onBurnoutEnd(this);
      }
      // RCT: recoverable health regenerates when not under pressure
      if (this.red > 0) {
        if (this.redDelay > 0) this.redDelay--;
        else if (NEUTRAL[this.st] || this.st === 'air') {
          const r = Math.min(this.red, 0.45);
          this.red -= r;
          this.hp = Math.min(this.maxHp, this.hp + r);
        }
      }
      // guard gauge regen
      if (this.guardDelay > 0) this.guardDelay--;
      else this.guard = Math.min(100, this.guard + 0.22);
      // passive meter & domain gauge
      if (m && m.fighting) {
        this.meterGain(1.4 / 60);
        if (this.burnout <= 0) this.dg = Math.min(100, this.dg + 100 / (48 * 60));
      }
      if (this.afterT > 0) this.afterT--;
      // footsteps
      if ((this.st === 'walkF' || this.st === 'walkB' || this.st === 'run') && JJK.Audio) {
        const every = this.st === 'run' ? 10 : 16;
        if (this.af % every === 0) JJK.Audio.play('step', { vol: this.st === 'run' ? 0.45 : 0.25, pitch: 0.9 + Math.random() * 0.2, pan: this.pan() });
      }
      // visible breathing when badly hurt
      if (this.hp < this.maxHp * 0.25 && NEUTRAL[this.st] && this.sf % 46 === 0 && JJK.FX && !JJK.HEADLESS) {
        const h = this.anchor('head');
        JJK.FX.spawn('smoke', h[0] + this.facing * 12, h[1] - 6, { vx: this.facing * 0.5, vy: 0.3, drag: 0.95, life: 34, size: 1.5, size2: 5, color: '#d8d0d0', alpha: 0.35 });
      }
      // combo bookkeeping (as defender)
      if (this.combo.hits > 0) {
        this.combo.time++;
        if (!this.isStunned()) this.endCombo();
      }
    }

    isStunned() {
      return this.st === 'hit' || this.st === 'juggle' || this.st === 'thrown' || this.st === 'stagger' || this.st === 'guardbreak' ||
        this.st === 'dizzy' || this.st === 'wallsplat' || (this.st === 'down' && this.sf < 2) || this.st === 'grabbed';
    }
    endCombo() {
      if (this.match) this.match.onComboEnd(this, this.combo);
      this.combo.hits = 0; this.combo.dmg = 0; this.combo.scale = 1; this.combo.jug = 0;
      this.combo.wb = false; this.combo.gb = false; this.combo.time = 0; this.combo.used = {}; this.combo.starter = 1;
    }

    stateUpdate(m, opp) {
      const st = this.st;
      const stats = this.stats;
      const buf = this.buf;
      const d = buf.dir(0);
      switch (st) {
        case 'idle': case 'walkF': case 'walkB': case 'crouch': case 'guard': case 'cguard': case 'run': {
          if (this.tryPending()) return;
          this.face(opp);
          // dashes
          const dashKey = buf.dashPressed;
          const tapF = d === 6 && buf.dir(1) !== 6 && buf.motion(MOT['66'], MWIN['66'], 1) >= 0;
          const tapB = d === 4 && buf.dir(1) !== 4 && buf.motion(MOT['44'], MWIN['44'], 1) >= 0;
          if (st === 'run') {
            if (d === 6 || d === 9 || d === 3) {
              this.vx = this.facing * stats.runSpeed * this.speedMul();
              if (d === 9) { this.jump(1, true); return; }
              this.setAnim('run');
              return;
            }
            this.setState('idle');
            this.vx *= 0.5;
          }
          if (tapF || (dashKey && d !== 4 && d !== 1 && d !== 7)) { this.startMove('dashF'); return; }
          if (tapB || (dashKey && (d === 4 || d === 1 || d === 7))) { this.startMove('dashB'); return; }
          if (d >= 7) { this.prejump(d === 9 ? 1 : d === 7 ? -1 : 0); return; }
          const threat = m.threatened(this);
          if (d <= 3) {
            const blockPose = (d === 1) && threat;
            this.st = blockPose ? 'cguard' : 'crouch';
            this.vx = 0;
            this.setAnim(blockPose ? 'cblock' : 'crouch');
            return;
          }
          if (d === 6) {
            this.st = 'walkF';
            this.vx = this.facing * stats.walkF * this.speedMul();
            this.setAnim('walkF');
          } else if (d === 4) {
            if (threat) {
              this.st = 'guard'; this.vx = 0; this.setAnim('block');
            } else {
              this.st = 'walkB';
              this.vx = -this.facing * stats.walkB * this.speedMul();
              this.setAnim('walkB');
            }
          } else {
            this.st = 'idle';
            this.vx = 0;
            this.setAnim(this.hp < this.maxHp * 0.25 ? 'idleTired' : 'idle');
          }
          return;
        }
        case 'prejump': {
          this.vx = 0;
          if (this.tryPendingThrowOrSpecial()) return;
          if (this.sf >= stats.prejump) this.jump(this.jumpDir, false);
          return;
        }
        case 'air': {
          if (this.tryPending()) return;
          // double jump
          const up = d >= 7;
          const upPressed = up && buf.dir(1) < 7;
          if (upPressed && this.airActions > 0 && this.sf > 5) {
            this.airActions--;
            this.vy = stats.jumpV * 0.88;
            this.vx = (d === 9 ? 1 : d === 7 ? -1 : 0) * stats.jumpVx * this.facing;
            this.setAnim('jumpUp', false);
            this.sf = 1;
            if (JJK.FX) JJK.FX.spawn('ring', this.x, this.y, { life: 12, size: 4, size2: 22, color: '#ffffff', w: 2, add: true });
            if (JJK.Audio) JJK.Audio.play('jump', { pitch: 1.2, pan: this.pan() });
            return;
          }
          const tapF = d === 6 && buf.dir(1) !== 6 && buf.motion(MOT['66'], MWIN['66'], 1) >= 0;
          const tapB = d === 4 && buf.dir(1) !== 4 && buf.motion(MOT['44'], MWIN['44'], 1) >= 0;
          if ((tapF || tapB || buf.dashPressed) && this.airActions > 0 && this.y > 30 && this.def.moves.airdashF) {
            this.airActions--;
            this.startMove(tapB || (buf.dashPressed && (d === 4 || d === 1 || d === 7)) ? 'airdashB' : 'airdashF');
            return;
          }
          this.setAnim(this.vy > 2 ? 'jumpUp' : this.vy > -2 ? 'jumpTop' : 'jumpDown');
          return;
        }
        case 'land': {
          this.vx *= 0.6;
          if (this.sf > 1 && this.tryPending()) return;
          if (this.sf >= (this.landLag || 3)) { this.setState('idle'); this.setAnim('idle'); }
          return;
        }
        case 'move': this.moveUpdate(m); return;
        case 'hit': case 'block': case 'stagger': case 'guardbreak': {
          this.stun--;
          if (st === 'block') this.setAnim(this.crouchBlock ? 'cblock' : 'block');
          if (this.stun <= 0) {
            if (st === 'block' || st === 'hit') this.throwInv = 5;
            this.toNeutral();
            if (this.tryPending()) return;
          }
          return;
        }
        case 'ablock': {
          this.stun--;
          if (this.stun <= 0) { this.st = 'air'; this.sf = 10; }
          return;
        }
        case 'juggle': {
          this.stun--;
          this.setAnim(this.vy > 1 ? 'juggleUp' : 'juggleDown');
          // air recovery when stun ends and not a forced knockdown
          if (this.stun <= 0 && !this.kd && this.y > 20) {
            this.st = 'air'; this.sf = 10; this.inv = 8; this.invType = 'all';
            this.vy = Math.max(this.vy, 3); this.vx = -this.facing * 2;
            this.setAnim('jumpTop');
            if (JJK.FX) JJK.FX.spawn('ring', this.x, this.y + 60, { life: 12, size: 6, size2: 28, color: '#fff', w: 2, add: true });
          }
          return;
        }
        case 'wallsplat': {
          this.vx = 0; this.vy = 0;
          this.stun--;
          if (this.stun <= 0) { this.st = 'juggle'; this.sf = 0; this.stun = 30; this.vy = -1; this.vx = -this.facing * 0.5; }
          return;
        }
        case 'down': {
          this.vx *= 0.8;
          this.setAnim('down');
          const pressed = buf.pr(0) & (B.L | B.M | B.H | B.SP | B.SU);
          if (this.kd === 'soft' && this.sf <= 12 && this.sf > 2 && pressed && !this.ko) {
            this.st = 'techroll'; this.sf = 0; this.inv = 18; this.invType = 'all';
            this.techDir = buf.dir(0) === 6 || buf.dir(0) === 3 ? 1 : -1;
            this.setAnim('roll');
            if (JJK.Audio) JJK.Audio.play('dash', { pitch: 0.8, pan: this.pan() });
            return;
          }
          if (this.ko) return;
          const len = this.kd === 'hard' ? 58 : 38;
          if (this.sf >= len) { this.st = 'wakeup'; this.sf = 0; this.inv = 16; this.invType = 'all'; this.setAnim('wakeup'); }
          return;
        }
        case 'techroll': {
          this.vx = this.techDir * this.facing * 4.2 * (1 - this.sf / 22);
          if (this.sf >= 20) { this.toNeutral(); this.throwInv = 6; }
          return;
        }
        case 'wakeup': {
          if (this.sf >= 14) {
            this.toNeutral();
            this.throwInv = 4;
            if (this.tryPending()) return;
          }
          return;
        }
        case 'throwtech': {
          this.vx *= 0.85;
          if (this.sf >= 16) this.toNeutral();
          return;
        }
        case 'grabbed': {
          // thrower moves us; tech window
          if (this.techWindow > 0) {
            this.techWindow--;
            if (buf.chordWithin(B.L | B.M, 3, 1) && this.thrower) m.throwTech(this.thrower, this);
          }
          return;
        }
        case 'thrown': return;
        case 'dizzy': {
          // Unlimited Void immobilization; mashing struggles free faster
          this.stun--;
          if (buf.pr(0) & (B.L | B.M | B.H | B.SP | B.SU | B.UN)) { this.stun -= 2.5; this.struggle = 6; }
          if (this.struggle > 0) this.struggle--;
          if (this.stun <= 0) { this.toNeutral(); this.inv = 10; this.invType = 'all'; }
          return;
        }
        case 'intro': case 'win': case 'lose': case 'ko': case 'timeout': case 'cinematic':
          return;
        default:
          this.toNeutral();
      }
    }

    // no mashing: the heavy press must be the only attack press in the last few frames
    cleanPress(p) {
      let n = 0;
      for (let k = 0; k < 8; k++) if (this.buf.pr(k) & (B.L | B.M | B.H)) n++;
      return n <= 1;
    }

    tryPendingThrowOrSpecial() {
      const p = this.pending;
      if (!p) return false;
      const mv = this.def.moves[p.cmd.id];
      if (!mv || mv.tier < 4) return false;
      return this.tryPending();
    }

    toNeutral() {
      this.move = null;
      if (this.y > 0.5) { this.st = 'air'; this.sf = 10; this.air = true; this.setAnim('jumpDown'); return; }
      this.y = 0; this.air = false; this.vy = 0;
      this.airActions = this.stats.airActions;
      const d = this.buf.dir(0);
      this.st = d <= 3 ? 'crouch' : 'idle';
      this.sf = 0;
      this.setAnim(this.st === 'crouch' ? 'crouch' : 'idle');
    }

    prejump(dir) {
      this.st = 'prejump'; this.sf = 0; this.jumpDir = dir; this.vx = 0;
      this.setAnim('prejump');
    }
    jump(dir, fromRun) {
      const s = this.stats;
      this.st = 'air'; this.sf = 0; this.air = true;
      this.vy = s.jumpV;
      this.vx = dir * this.facing * (fromRun ? s.jumpVx * 1.45 : s.jumpVx);
      this.y = 0.5;
      this.airActions = s.airActions - 1;
      this.setAnim('jumpUp');
      if (JJK.Audio) JJK.Audio.play('jump', { pan: this.pan() });
      if (JJK.FX) JJK.FX.dust(this.x, 0.4);
    }

    moveUpdate(m) {
      const mv = this.move;
      this.mf++;
      if (this.tryUpgrade()) return;
      // cancels
      if (this.pending && this.tryPending()) return;
      // jump cancel (launchers)
      let upK = -1;
      if (mv.jc && this.contact === 'hit' && this.mf >= mv.s + 2) for (let k = 0; k < 8; k++) if (this.buf.dir(k) >= 7) { upK = k; break; }
      if (upK >= 0) {
        const jd = this.buf.dir(upK);
        this.move = null;
        this.st = 'air';
        this.jump(jd === 9 ? 1 : jd === 7 ? -1 : 0, false);
        this.vy = this.stats.jumpV * 1.05;
        this.airActions = this.stats.airActions;
        return;
      }
      // scripted velocities [frame, vx, vy?]
      if (mv.vel) {
        for (let i = 0; i < mv.vel.length; i++) {
          const v = mv.vel[i];
          if (v[0] === this.mf) {
            if (v[1] !== null) this.vx = v[1] * this.facing;
            if (v.length > 2 && v[2] !== null) { this.vy = v[2]; if (v[2] > 0) { this.air = true; this.y = Math.max(this.y, 0.5); } }
          }
        }
      }

      let r;
      if (mv.tick) r = mv.tick(this, m, this.mf);
      if (r === 'hold') { this.mf--; }
      if (this.st !== 'move' || this.move !== mv) return; // tick changed state
      // landing during air moves
      if (this.air && this.y <= 0 && this.vy <= 0 && this.sf > 1) {
        this.y = 0; this.air = false; this.vy = 0;
        if (mv.air && !mv.keepOnLand) {
          this.landLag = mv.land != null ? mv.land : 4;
          if (mv.onLand) mv.onLand(this, m);
          this.setState('land'); this.setAnim('land');
          if (JJK.FX) JJK.FX.dust(this.x, 0.3);
          return;
        }
      }
      if (this.mf >= mv.total) {
        if (mv.next) { this.startMove(mv.next, { free: true }); return; }
        if (mv.onEnd) mv.onEnd(this, m);
        if (this.st === 'move' && this.move === mv) this.toNeutral();
      }
    }

    // Phase of the current move for counter-hit detection.
    get phase() {
      if (this.st !== 'move' || !this.move) return null;
      const mv = this.move;
      if (this.mf < mv.s) return 'startup';
      if (this.mf < mv.s + mv.a) return 'active';
      return 'recovery';
    }

    // Is the fighter invulnerable to the given attack kind? kind: 'strike'|'proj'|'throw'|'air'
    invulnTo(kind, fromAir) {
      if (this.inv > 0 && (this.invType === 'all' || this.invType === kind)) return true;
      if (kind === 'throw' && (this.throwInv > 0 || this.air || this.y > 0)) return true;
      if (this.st === 'down' || this.st === 'techroll' || this.st === 'wakeup') return true;
      if (this.ko) return true;
      if (this.st === 'move' && this.move.inv) {
        for (const w of this.move.inv) {
          if (this.mf >= w[0] && this.mf <= w[1]) {
            if (w[2] === 'all' || w[2] === kind) return true;
            if (w[2] === 'air' && fromAir) return true;
            if (w[2] === 'strike' && kind === 'proj' && w[3]) return true;
          }

    }

    // ------------------------------------------------------------ physics
    physics(m) {
      const st = this.st;
      if (st === 'thrown' || st === 'grabbed' || st === 'cinematic') return;
      const grav = this.move && this.move.grav != null ? this.move.grav : this.stats.grav;
      const airborne = this.air || this.y > 0;
      if (airborne) {
        let g = grav;
        if (st === 'juggle') g *= 1 + Math.min(0.6, this.combo.time / 240) + Math.min(0.4, this.combo.jug * 0.025);
        if (this.move && this.move.noGrav && this.mf <= this.move.noGrav) g = 0;
        this.vy -= g;
        if (this.vy < -14) this.vy = -14;
      }
      this.x += this.vx;
      this.y += this.vy;
      if (this.y <= 0) {

      }
      if (!airborne && st !== 'move' && !NEUTRAL[st]) {

        this.vx *= st === 'down' ? 0.8 : 0.86;
      }
      // walls
      const W = JJK.WALL;
      if (this.x < -W || this.x > W) {
        const side = this.x < 0 ? -1 : 1;
        this.x = side * W;
        if (st === 'juggle' && this.bounce === 'wall' && Math.abs(this.vx) > 3) {
          this.bounce = null;
          this.vx = -side * 3.5;
          this.vy = Math.max(this.vy, 7);
          this.stun = Math.max(this.stun, 30);
          this.combo.wb = true;
          if (m) m.onWallBounce(this, side);
        } else if (st === 'juggle' && this.bounce === 'splat' && Math.abs(this.vx) > 3) {
          this.bounce = null;
          this.st = 'wallsplat'; this.sf = 0; this.stun = 24; this.vx = 0; this.vy = 0;

    landed(m) {
      const st = this.st;
      this.air = false;
      if (st === 'juggle' || (st === 'ko' && this.vy < 0)) {

          this.bounce = null;
          this.combo.gb = true;
          this.vy = 7.2; this.vx *= 0.6;
          this.y = 1;
          this.air = true;
          this.stun = Math.max(this.stun, 32);
          if (m) m.onGroundBounce(this);
          return;
        }
        this.vy = 0;
        if (this.ko) { this.st = 'ko'; this.sf = 0; this.setAnim('down'); if (m) m.onKnockdown(this, true); return; }
        this.st = 'down'; this.sf = 0;
        if (!this.kd) this.kd = 'soft';
        this.setAnim('down');
        if (m) m.onKnockdown(this, false);

      }
      if (st === 'air') {
        this.vy = 0;
        this.landLag = 3;
        this.setState('land'); this.setAnim('land');
        if (JJK.FX) JJK.FX.dust(this.x, 0.25);
        if (JJK.Audio) JJK.Audio.play('land', { vol: 0.6, pan: this.pan() });

      }

    pan() {
      const m = this.match;
      if (!m || !m.cam) return 0;
      return U.clamp((this.x - m.cam.x) / 320, -1, 1) * 0.6;
    }

    // ------------------------------------------------------------ animation
    animate() {
      this.af += this.move && this.move.animSpeed ? this.move.animSpeed : 1;
      if (this.st === 'move' && this.move) {
        const mf = this.move.animFrame ? this.move.animFrame(this) : this.mf;
        this.pose = Rig.sample(this.move.anim, mf, this.def.poses);
      } else {
        let f = this.af;
        if (this.st === 'walkF' || this.st === 'walkB' || this.st === 'run') f = this.af;
        if (this.st === 'hit' || this.st === 'block' || this.st === 'stagger' || this.st === 'guardbreak') f = this.sf;
        this.pose = Rig.sample(this.anim, f, this.def.poses);
      }
      if (this.def.poseMod) this.def.poseMod(this, this.pose);
      this.updatePose();
    }

    updatePose() {
      if (!this.pose) this.pose = Rig.full(this.def.poses.idle || {});
      this.J = Rig.solve(this.pose, this.art.dims);
      this.computeHurt();
      this.sec.update(this.J, this.x / S, this.y / S, this.facing);
    }

    // world position of a joint/anchor
    anchor(name) {
      const J = this.J;
      const map = { nh: J.haN, fh: J.haF, nf: J.anN, ff: J.anF, head: J.head, chest: J.chest, hip: J.hip, ne: J.elN, fe: J.elF, nk: J.knN, fk: J.knF };
      const p = map[name] || J.chest;
      const pose = this.pose;
      let px = p[0], py = p[1];
      if (pose && pose.rot) {
        const a = -pose.rot * Math.PI / 180;
        const dx = px - 0, dy = py - 70;
        px = dx * Math.cos(a) - dy * Math.sin(a);
        py = 70 + dx * Math.sin(a) + dy * Math.cos(a);

    }

    // Convert a facing-space box [x0,y0,x1,y1] (pose units) to world AABB.
    boxToWorld(b) {
      const xa = this.x + this.facing * b[0] * S, xb = this.x + this.facing * b[2] * S;
      return [Math.min(xa, xb), this.y + Math.min(b[1], b[3]) * S, Math.max(xa, xb), this.y + Math.max(b[1], b[3]) * S];
    }

    computeHurt() {
      const J = this.J;
      const out = this.hurt;
      out.length = 0;
      if (!J) return;
      const pose = this.pose || {};
      const rot = pose.rot || 0;
      const box = (pts, mx, my) => {
        let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
        for (const p of pts) {
          let px = p[0], py = p[1];
          if (rot) {
            const a = -rot * Math.PI / 180, dx = px, dy = py - 70;
            px = dx * Math.cos(a) - dy * Math.sin(a);
            py = 70 + dx * Math.sin(a) + dy * Math.cos(a);
          }
          if (px < x0) x0 = px;
          if (px > x1) x1 = px;
          if (py < y0) y0 = py;
          if (py > y1) y1 = py;
        }
        out.push(this.boxToWorld([x0 - mx, y0 - my, x1 + mx, y1 + my]));
      };
      if (this.st === 'down' || this.st === 'ko') {
        out.push(this.boxToWorld([-36, 0, 36, 18]));
        return;
      }
      box([J.head], 11, 11);
      box([J.hip, J.waist, J.chest], 12, 5);
      box([J.hpN, J.hpF, J.knN, J.knF, J.anN, J.anF], 6, 4);
      box([J.elN, J.haN], 5, 5);
      box([J.elF, J.haF], 5, 5);
    }

    // ------------------------------------------------------------ rendering
    render(ctx, cam, m) {
      if (!this.raster || !this.visible) return;
      const r = this.raster;
      const pose = this.pose;
      const z = cam.ez * S;
      let ox = cam.sx(this.x), oy = cam.sy(this.y);
      if (this.hitstop > 0 && (this.st === 'hit' || this.st === 'juggle' || this.st === 'block' || this.st === 'ablock' || this.st === 'stagger' || this.st === 'guardbreak'))
        ox += (this.shakeT % 2 ? 2 : -2) * Math.min(1, this.hitstop / 4);
      if (this.st === 'dizzy') ox += Math.sin(this.sf * 0.9) * (this.struggle > 0 ? 1.5 : 0.5);
      this.xf.set(ox, oy, this.facing, z, pose.rot || 0, [0, 70], pose.sx || 1, pose.sy || 1);
      r.begin();
      // lighting
      const amb = m && m.stage && m.stage.getAmbient ? m.stage.getAmbient() : null;
      if (!amb) r.setAmbient([1, 1, 1]);
      if (amb) {
        r.setAmbient(amb.mul);
        r.rim.c = amb.rim;
        r.rim.k = amb.rimK;
        r.rim.x = this.facing > 0 ? 0.8 : -0.8;
      }
      const L = JJK.FX.lights;
      for (let i = 0; i < L.length && r.lights.length < 4; i++) {
        const l = L[i];
        const lx = cam.sx(l.x), ly = cam.sy(l.y);
        const rr = l.r * cam.ez;
        if (Math.abs(lx - ox) > rr + 160 * z || Math.abs(ly - oy + 80 * z) > rr + 160 * z) continue;
        r.lights.push({ x: lx, y: ly, r: rr, r2: rr * rr, c: l.c, i: l.i });
      }
      if (this.flash > 0) r.flash = this.flashK != null ? this.flashK : 0.85;
      if (this.tint) r.tint = this.tint;
      if (m && m.silhouette) r.override = m.silhouette;
      // smears behind the limbs
      this.drawSmears(r, cam);
      const vis = {
        pose, pal: this.pal, sec: this.sec, t: this.sf,
        eyesOpen: this.eyesOpen, hairLift: this.hairLift,
      };
      this.art.draw(r, this.J, this.xf, vis);
      const aura = this.auraColor ? this.auraColor() : 0;
      const outline = m && m.silhouette ? null : this.art.outline;
      if (outline) r.outline(outline, aura, true);
      if (this.def.glowRing) {
        const gr = this.def.glowRing(this);
        if (gr) r.glowRing(gr);
      }
      r.flush();
      // afterimages
      this.updateAfterimages(ctx, cam);
      for (const a of this.after) {
        const k = 1 - a.t / a.life;
        ctx.globalAlpha = 0.55 * k;
        ctx.globalCompositeOperation = a.add ? 'lighter' : 'source-over';
        ctx.drawImage(a.c, 0, 0, a.w, a.h, cam.sx(a.x) + a.dx, cam.sy(a.y) + a.dy, a.w, a.h);
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      const alpha = this.alpha != null ? this.alpha : 1;
      r.drawTo(ctx, alpha);
    }

    dmgMul() { return (this.def.dmgMul ? this.def.dmgMul(this) : 1) * (this.blackFlash ? 2.5 : 1); }
    speedMul() { return this.def.speedMul ? this.def.speedMul(this) : 1; }
    dmgTakenMul() { return this.def.dmgTakenMul ? this.def.dmgTakenMul(this) : 1; }

    auraColor() {
      if (this.def.auraColor) return this.def.auraColor(this);
      return 0;
    }

    drawSmears(r, cam) {
      const J = this.J;
      const ends = [
        ['haN', 4.5], ['haF', 4.5], ['anN', 6], ['anF', 6],
      ];
      const cur = {};
      for (const e of ends) cur[e[0]] = this.xf.p(J[e[0]]);
      const attacking = this.st === 'move' && this.move && this.move.smear !== false && this.mf <= (this.move.s + this.move.a + 1);
      if (this.prevEnds && attacking) {
        const mat = this.def.smearMat;
        for (const e of ends) {
          const a = this.prevEnds[e[0]], b = cur[e[0]];
          const dx = b[0] - a[0], dy = b[1] - a[1];
          const d = Math.hypot(dx, dy);
          if (d > 9 * cam.ez && d < 140 * cam.ez) {
            const w = e[1] * this.xf.z;
            const nx = -dy / d * w, ny = dx / d * w;
            r.poly([a[0], a[1], b[0] + nx, b[1] + ny, b[0] - nx, b[1] - ny], mat, 0, { n: [0, 0, 1] });
          }
        }
      }
      this.prevEnds = cur;
    }

    updateAfterimages(ctx, cam) {
      for (let i = this.after.length - 1; i >= 0; i--) {
        const a = this.after[i];
        a.t++;
        if (a.t >= a.life) { this.afterPool.push(a); this.after.splice(i, 1); }
      }
      if (this.afterT > 0 && this.sf % 2 === 0 && this.raster && this.raster.canvas) {
        const b = this.raster.bbox;
        if (b[2] > 0 && b[3] > 0) {
          let a = this.afterPool.pop();
          if (!a) {
            const c = document.createElement('canvas');
            a = { c, x2: c.getContext('2d') };
          }
          if (a.c.width < b[2] || a.c.height < b[3]) { a.c.width = Math.max(a.c.width, b[2]); a.c.height = Math.max(a.c.height, b[3]); }
          const x = a.x2;
          x.globalCompositeOperation = 'source-over';
          x.clearRect(0, 0, a.c.width, a.c.height);
          x.drawImage(this.raster.canvas, b[0], b[1], b[2], b[3], 0, 0, b[2], b[3]);
          x.globalCompositeOperation = 'source-atop';
          x.fillStyle = this.afterCol || this.def.afterColor || '#6ad0ff';
          x.globalAlpha = 0.75;
          x.fillRect(0, 0, b[2], b[3]);
          x.globalAlpha = 1;
          a.w = b[2]; a.h = b[3];
          a.x = this.x; a.y = this.y;
          a.dx = b[0] - cam.sx(this.x); a.dy = b[1] - cam.sy(this.y);
          a.t = 0; a.life = 14; a.add = true;
          this.after.push(a);
        }
      }
    }

    drawShadow(ctx, cam) {
      const sx = cam.sx(this.x), sy = cam.sy(0);
      const h = Math.max(0, this.y);
      const w = Math.max(10, (34 - h * 0.12)) * cam.ez * S;
      ctx.globalAlpha = Math.max(0.15, 0.45 - h * 0.002);
      ctx.fillStyle = '#1a0a0a';
      ctx.beginPath();
      ctx.ellipse(sx, sy + 1, w, w * 0.18, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  JJK.Fighter = Fighter;
})();

<script>/* src/game/combat.js */
// Combat resolution: hitbox tests, hits, blocks, perfect guards, parries,
// counter hits, damage scaling, juggle limits, guard crush and throws.
(function () {
  'use strict';
  const JJK = (typeof window !== 'undefined' ? window : globalThis).JJK;
  const U = JJK.U, B = JJK.BTN;
  const S = JJK.CHAR_SCALE;

  const STR = {
    l: { stop: 7, shake: 0.07, pb: 4.2, sfx: 'hit_l', gdmg: 4, spark: 0.25, grunt: 'hurt' },
    m: { stop: 9, shake: 0.13, pb: 5.2, sfx: 'hit_m', gdmg: 7, spark: 0.45, grunt: 'hurt' },
    h: { stop: 12, shake: 0.24, pb: 6.4, sfx: 'hit_h', gdmg: 11, spark: 0.75, grunt: 'hurt_heavy' },
    s: { stop: 11, shake: 0.3, pb: 6.6, sfx: 'hit_h', gdmg: 12, spark: 0.8, grunt: 'hurt_heavy' },
    x: { stop: 16, shake: 0.5, pb: 8, sfx: 'hit_super', gdmg: 20, spark: 1, grunt: 'hurt_heavy' },
  };
  JJK.STR = STR;
  const JUG_MAX = 16;
  const MIN_SCALE = 0.3;

  const C = (JJK.Combat = {});

  C.overlap = function (a, b) {
    return a[0] < b[2] && a[2] > b[0] && a[1] < b[3] && a[3] > b[1];
  };

  // World hitbox of a move hit for fighter f.
  // Strike hitboxes cover the striking limb from mid-forearm/shin to the fist/foot,
  // so point-blank attacks connect even when the fist extends past the body.
  const PARENT = { fh: 'fe', nh: 'ne', ff: 'fk', nf: 'nk' };
  C.hitbox = function (f, h) {
    if (h.at) {
      const p = f.anchor(h.at);
      const r = (h.r || 12) * S;
      const ox = (h.off ? h.off[0] : 0) * S * f.facing, oy = (h.off ? h.off[1] : 0) * S;
      let x0 = p[0], y0 = p[1], x1 = p[0], y1 = p[1];
      const par = PARENT[h.at];
      if (par && !h.point) {
        const q = f.anchor(par);
        const mx = q[0] + (p[0] - q[0]) * 0.25, my = q[1] + (p[1] - q[1]) * 0.25;
        x0 = Math.min(x0, mx); x1 = Math.max(x1, mx); y0 = Math.min(y0, my); y1 = Math.max(y1, my);
      }
      const rv = r * 0.8;
      return [x0 + ox - r, y0 + oy - rv, x1 + ox + r, y1 + oy + rv];
    }
    return f.boxToWorld(h.box);
  };

  function contactPoint(a, b) {
    return [(Math.max(a[0], b[0]) + Math.min(a[2], b[2])) / 2, (Math.max(a[1], b[1]) + Math.min(a[3], b[3])) / 2];
  }

  // Gather melee hits of att against def this frame (without applying).
  C.findMelee = function (att, def) {
    if (att.st !== 'move' || !att.move || !att.move.hits) return null;
    const mv = att.move;
    for (let i = 0; i < mv.hits.length; i++) {
      const h = mv.hits[i];
      if (att.mf < h.f[0] || att.mf > h.f[1]) continue;
      if (att.hitIds[i]) continue;
      const kind = h.throw ? 'throw' : 'strike';
      if (def.invulnTo(kind, att.air)) continue;
      if (def.st === 'juggle' && def.combo.jug >= JUG_MAX && !h.otg) continue;
      if (h.ground && def.y > 2) continue;
      if (h.airOnly && def.y <= 2) continue;
      const hb = C.hitbox(att, h);
      for (const hu of def.hurt) {
        if (C.overlap(hb, hu)) {

        }
      }
