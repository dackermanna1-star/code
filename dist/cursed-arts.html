      pts.push(cx + hw - (hw - rw) * t, yt - (yt - yr) * t * t);
    }
    pts.push(cx + hw + lift * 0.35, yt - lift * 0.35);
    for (let i = 0; i <= N * 2; i++) {
      const xn = i / N - 1;
      pts.push(cx + hw * xn, yb - lift * Math.pow(Math.abs(xn), 2.6));
    }
    return pts;
  }
  // Roof fill with tile rows / ribs, fascia band and ridge.
  function roofFn(cx, yb, hw, h, lift, R, o = {}) {
    const yr = yb - h, rib = o.rib || 0, rows = o.rows || 3, base = o.base != null ? o.base : 1.4;
    return (x, y) => {
      const xn = U.clamp((x + 0.5 - cx) / hw, -1, 1);
      const ye = yb - lift * Math.pow(Math.abs(xn), 2.6);
      const de = ye - (y + 0.5);
      if (de < 1) return R[0];
      if (de < 2.6) return R[Math.min(R.length - 1, Math.round(base + 2.6))];
      if (y < yr + 2) return y < yr + 1 ? R[Math.min(R.length - 1, Math.round(base + 2))] : R[0];
      let v = base + (1 - de / (yb - yr)) * 0.6 + (de / (yb - yr)) * 0.9;
      if (Math.floor(de) % rows === 0) v -= 0.9;
      if (rib && ((x - Math.round(cx)) % rib + rib) % rib === 0) v += 0.7;
      return rmp(R, v, x, y);
    };
  }
  function drawRoof(P, cx, yb, hw, h, lift, R, o) {
    P.poly(roofPts(cx, yb, hw, h, lift, o && o.ridge, o && o.thick), roofFn(cx, yb, hw, h, lift, R, o));
    // ridge ornaments
    const yr = Math.round(yb - h), rw = Math.round(hw * (o && o.ridge != null ? o.ridge : 0.2));
    if (!o || o.orn !== false) for (const sd of [-1, 1]) {
      const ex = Math.round(cx + sd * rw);
      P.put(ex, yr - 1, R[1]); P.put(ex, yr - 2, R[1]); P.put(ex + sd, yr - 2, R[1]); P.put(ex + sd, yr - 3, R[1]);
    }
  }
  // Wall body with pillars and under-eave shadow.
  function drawBody(P, x0, y0, x1, y1, R, o = {}) {
    const pil = o.pil || 6;
    P.rect(x0, y0, x1 - x0, y1 - y0, (x, y) => {
      let v = o.base != null ? o.base : 1.2;
      if (y - y0 < 3) v -= 0.9; // eave shadow
      const lx = x - x0;
      if (lx % pil === 0) v += 0.9;
      else if (o.win && (y - y0) > 3 && (y - y0) % 5 > 1 && lx % pil > 1 && lx % pil < pil - 1) v -= 0.6;
      if (o.lit && hash(x, y, 9) < o.lit) return o.litCol;
      return rmp(R, v, x, y);
    });
  }
  function pagoda(P, cx, yb, tiers, hw0, th, R, o = {}) {
    let y = yb;
    P.rect(cx - hw0 * 0.75, y - 4, hw0 * 1.5, 4, (x, yy) => rmp(R, 1.6 + (yy === y - 4 ? 1 : 0), x, yy));
    y -= 4;
    for (let i = 0; i < tiers; i++) {
      const k = 1 - i * (o.taper || 0.085);
      const bw = hw0 * 0.56 * k, bh = th * (i === 0 ? 0.75 : 0.42);
      drawBody(P, Math.round(cx - bw), Math.round(y - bh), Math.round(cx + bw), Math.round(y), R, { pil: Math.max(3, Math.round(bw / 2)), base: 1.1, win: i === 0, lit: o.lit, litCol: o.litCol });
      y -= bh;
      if (o.broken && i >= tiers - o.broken) {
        // collapsed upper tiers: jagged stub
        for (let j = 0; j < bw * 2; j++) {
          const hh = Math.round(Math.abs(Math.sin(j * 1.7)) * 4 + hash(j, i, 3) * 3);
          for (let q = 0; q < hh; q++) P.put(Math.round(cx - bw + j), Math.round(y - q), R[1]);
        }
        return y;
      }
      const hw = hw0 * k, rh = th * 0.42;
      drawRoof(P, cx, Math.round(y + rh * 0.38), hw, rh, Math.max(2, hw * 0.12), R, { rib: o.rib, base: o.roofBase });
      y -= rh * 0.62;
    }
    // finial (sorin)
    const fh = th * 1.25;
    for (let j = 0; j < fh; j++) {
      const yy = Math.round(y - j);
      P.put(Math.round(cx), yy, R[1]);
      if (j > 2 && j < fh - 4 && j % 3 === 0) { P.put(Math.round(cx) - 1, yy, R[1]); P.put(Math.round(cx) + 1, yy, R[1]); }
    }
    P.ellipse(cx, y - fh, 1.4, 1.6, R[1]);
    return y - fh;
  }
  function hall(P, cx, yb, hw, hh, R, o = {}) {
    P.rect(cx - hw * 1.05, yb - 5, hw * 2.1, 5, (x, y) => rmp(R, y === yb - 5 ? 2.6 : 1.5, x, y));
    const wy = yb - 5 - hh * 0.42;
    drawBody(P, Math.round(cx - hw * 0.86), Math.round(wy), Math.round(cx + hw * 0.86), yb - 5, R, { pil: Math.max(4, Math.round(hw / 4)), win: true, lit: o.lit, litCol: o.litCol });
    const rh = hh * 0.5;
    drawRoof(P, cx, Math.round(wy + rh * 0.3), hw * 1.22, rh, hw * 0.12, R, { ridge: 0.42, rib: o.rib, base: o.roofBase });
    // irimoya gable
    const gy = Math.round(wy + rh * 0.3 - rh * 0.72);
    P.poly([cx - hw * 0.35, gy + rh * 0.3, cx, gy - rh * 0.28, cx + hw * 0.35, gy + rh * 0.3], (x, y) => rmp(R, 2.2 + (y % 3 === 0 ? -0.6 : 0), x, y));
    drawRoof(P, cx, Math.round(gy - rh * 0.1), hw * 0.5, rh * 0.3, 1.5, R, { ridge: 0.6, base: o.roofBase });
  }
  function torii(P, cx, yb, hw, h, R, o = {}) {
    const pw = Math.max(2, Math.round(hw * 0.12));
    const px = [Math.round(cx - hw * 0.72), Math.round(cx + hw * 0.72)];
    const shade = (x, y, b) => rmp(R, b + ((x & 1) ? 0 : 0.3), x, y);
    for (let s = 0; s < 2; s++) {
      if (o.broken === s) {
        const top = Math.round(yb - h * 0.45);
        P.rect(px[s] - pw / 2, top, pw, yb - top, (x, y) => shade(x, y, 2.2));
        for (let i = 0; i < pw; i++) P.put(px[s] - Math.floor(pw / 2) + i, top - (i % 2), R[2]);
        continue;
      }
      for (let y = Math.round(yb - h); y < yb; y++) {
        const lean = (yb - y) / h * (s ? -1 : 1) * hw * 0.04;
        P.span(y, px[s] - pw / 2 + lean, px[s] + pw / 2 + lean + (y > yb - 4 ? 1 : 0), (x, yy) => shade(x, yy, y > yb - 5 ? 1.2 : 2.4));
      }
    }
    const ny = Math.round(yb - h * 0.76);
    if (o.broken == null) P.rect(cx - hw * 0.92, ny, hw * 1.84, Math.max(2, pw * 0.7), (x, y) => shade(x, y, 2.6));
    // kasagi + shimaki with upturned ends
    const ky = Math.round(yb - h);
    const kh = Math.max(3, Math.round(pw * 1.1));
    const tilt = o.broken != null ? (o.broken ? 1 : -1) * 0.18 : 0;
    const pts = [];
    for (let i = 0; i <= 16; i++) { const xn = i / 8 - 1; pts.push(cx + xn * hw * 1.18, ky - Math.pow(Math.abs(xn), 3) * kh * 0.9 + xn * hw * tilt); }

  // Covered temple corridor (kairo): long tiled roof over a row of posts.

  // Temple complex / mid-ground layer.

  // -------------------------------------------------------- stone helpers
  const S = (v, x, y) => rmp(STONE, v, x, y);

  function buildNear() {

      if (this.gfx) this._initGfx();
      this.reset();
    }

    // ---------------------------------------------------------- setup
    _initGfx() {
      const A = (this.art = getArt());
      const mk = (src, s, tile, mutable = true) => {
        const p = src.pix, L = { s, ox: src.ox, oy: src.oy, tile, w: p.w, h: p.h, cv: mkCanvas(p.w, p.h), dx: 0, dy: 0, e: 1 };
        L.ctx = L.cv.getContext('2d');
        L.base = p.d;
        L.pix = mutable ? new Uint32Array(p.d) : p.d;
        L.img = new ImageData(new Uint8ClampedArray(mutable ? L.pix.buffer : p.d.buffer.slice(0)), p.w, p.h);
        L.ctx.putImageData(L.img, 0, 0);
        const bc = p.d[(p.h - 1) * p.w + (p.w >> 1)];
        L.bottom = bc >>> 24 ? css(bc) : null;
        L.dirty = null;
        L.opaq = this._opaqScan(L);
        return L;
      };
      const L = (this.L = {});
      L.sky = mk(A.sky, 0.001, false);
      L.cloudHi = mk({ pix: A.cloudHi.pix, ox: 192, oy: -A.cloudHi.sy0 }, 0.012, true, false);
      L.cloudLo = mk({ pix: A.cloudLo.pix, ox: 192, oy: -A.cloudLo.sy0 }, 0.02, true, false);
      L.cloudHi.bottom = L.cloudLo.bottom = null;
      L.city1 = mk(A.city1, 0.04, true);
      L.city2 = mk(A.city2, 0.09, true);
      L.midfar = mk(A.midfar, 0.2, true);
      L.town = mk(A.town, 0.3, true);
      L.mid = mk(A.mid, 0.45, true);
      L.near = mk(A.near, SB, true);
      this.cutLayers = [L.sky, L.city1, L.city2, L.midfar, L.town, L.mid, L.near];
      L.vbase = mk(A.void, 0.001, false, false);
      L.vstar1 = mk({ pix: A.vstars[0], ox: 192, oy: 30 }, 0.01, true, false);
      L.vstar2 = mk({ pix: A.vstars[1], ox: 192, oy: 30 }, 0.03, true, false);
      L.vstar1.bottom = L.vstar2.bottom = null;
      L.ssky = mk(A.ssky, 0.001, false, false);
      L.smount = mk(A.smount, 0.12, true, false);
      // floor texture
      const G = A.floor;
      this.F = { cv: mkCanvas(G.TW, G.NR), base: G.pix.d, pix: new Uint32Array(G.pix.d), dirty: null };
      this.F.ctx = this.F.cv.getContext('2d');
      this.F.img = new ImageData(new Uint8ClampedArray(this.F.pix.buffer), G.TW, G.NR);
      this.F.ctx.putImageData(this.F.img, 0, 0);
      // canvases for sprites
      const cv = (this.cv = {});
      cv.rocks = A.rocks.map((row) => row.map(toCanvas));
      cv.smoke = A.smoke.map(toCanvas); cv.dust = A.dust.map(toCanvas); cv.plume = A.plume.map(toCanvas);
      cv.flames = A.flames.map(toCanvas);
      cv.glow = {};
      for (const k in A.glows) cv.glow[k] = toCanvas(A.glows[k]);
      cv.galaxy = toCanvas(A.galaxy); cv.hole = toCanvas(A.hole);
      cv.shrine = toCanvas(A.shrine.pix);
      cv.skulls = A.skulls.map(toCanvas);
      cv.floorFade = this._mkFade(); cv.voidFloor = this._mkVoidFloor();
      // per-prop canvases
      for (const p of this.props) {
        const T = (p.T = A.props[p.kind]);
        p.cv = mkCanvas(T.w, T.h); p.ctx = p.cv.getContext('2d');
        p.pix = new Uint32Array(T.w * T.h);
        p.img = new ImageData(new Uint8ClampedArray(p.pix.buffer), T.w, T.h);
        p.ax = p.flip ? T.w - T.ax : T.ax;
      }
      // offscreen buffers for shatter snapshots and the shrine reflection source
      this.snap = mkCanvas(W, H); this.snapCtx = this.snap.getContext('2d');
      // void streaks / motes
      this.vs = [];
      for (let i = 0; i < 150; i++) this.vs.push(this._newStreak({}, true));
      this.vm = [];
      for (let i = 0; i < 46; i++) this.vm.push({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - 0.5) * 0.3, vy: -0.1 - Math.random() * 0.3, ph: Math.random() * 7, sz: Math.random() < 0.2 ? 2 : 1 });
      this._warm();
    }
    // Touch every canvas once (texture upload) and build both domain caches so
    // the first domain expansion does not hitch mid-fight.
    _warm() {
      const c = mkCanvas(4, 4), x = c.getContext('2d');
      const touch = (cv) => { if (cv && cv.width) x.drawImage(cv, 0, 0, 1, 1); };
      for (const k in this.L) touch(this.L[k].cv);
      touch(this.F.cv);
      for (const k in this.cv) {
        const v = this.cv[k];
        if (Array.isArray(v)) for (const q of v) Array.isArray(q) ? q.forEach(touch) : touch(q);
        else if (v && v.width) touch(v);
        else if (v) for (const g in v) touch(v[g]);
      }
      for (const p of this.props) touch(p.cv);
      this._voidCache();
      this._shrineCache();
      x.getImageData(0, 0, 1, 1);
    }
    _mkFade() {
      // dithered black fade (alpha ramp) used to darken the void mirror with distance
      const P = new Pix(W, 220);
      for (let y = 0; y < 220; y++) for (let x = 0; x < W; x++) {
        const a = U.clamp((y - 6) / 150, 0, 1);
        const lv = Math.floor(a * 6 + bay(x, y)) / 6;
        if (lv > 0) P.d[y * W + x] = U.pack(0, 0, 2, Math.round(lv * 235));
      }
      return toCanvas(P);
    }
    _mkVoidFloor() {
      const P = new Pix(W, 240);
      for (let y = 0; y < 240; y++) for (let x = 0; x < W; x++) {
        const dx = (x - W / 2) / W;
        P.d[y * W + x] = rmp(VOIDR, 2.6 * Math.exp(-y / 18) + 0.8 * Math.exp(-y / 90) - dx * dx * 2, x, y);
      }
      return toCanvas(P);
    }

    reset() {
      this.parts.length = 0; this.pool.length = 0; this.cnt.fill(0);
      this.rubble.length = 0; this.chunks.length = 0; this.fires.length = 0; this.pulls.length = 0;
      this.holes.length = 0; this.seams.length = 0; this.rings.length = 0; this.slashes.length = 0; this.gashes.length = 0; this.cuts.length = 0;
      if (this.scorch) this.scorch.length = 0;
      if (this.splitQ) this.splitQ.length = 0;
      this.mode = 'normal'; this.tr = null; this.darken = 0; this.fl = 0; this.rumble = 0;
      this.cl.split = this.cl.tsplit = 0.5;
      for (const p of this.props) { p.hp = p.maxHp; p.state = 0; p.wob = p.wobV = 0; p.char = p.charDrawn = 0; p.cut = false; }
      if (!this.gfx) return;
      for (const L of this.cutLayers) if (L.dirty !== 'clean') { L.pix.set(L.base); L.ctx.clearRect(0, 0, L.w, L.h); L.ctx.putImageData(L.img, 0, 0); L.dirty = 'clean'; L.opaq = this._opaqScan(L); }
      if (this.F.touched) { this.F.pix.set(this.F.base); this.F.ctx.putImageData(this.F.img, 0, 0); this.F.touched = false; }
      this.F.dirty = null;
      for (const p of this.props) this._propRefresh(p);
      this.floaters = [];
      for (let i = 0; i < 7; i++) this.floaters.push({ X: -420 + i * 140 + (Math.random() - 0.5) * 60, Y: 70 + Math.random() * 90, s: 0.5 + Math.random() * 0.22, si: 3 + (i % 3), v: i & 3, ph: Math.random() * 7 });
      // a few columns of smoke already risen
      for (let i = 0; i < 260; i++) this._ambientArena(true);
    }

    // ------------------------------------------------------- camera math
    _cam(cam) {
      const c = this.c;
      if (cam) {
        c.x = U.clamp(num(cam.x), -1e5, 1e5);
        c.y = U.clamp(num(cam.y, JJK.CAM_BASE_Y || 142), -1e4, 1e4);
        c.ez = U.clamp(num(cam.ez, 0) || num(cam.zoom, 1) || 1, 0.2, 10);
        c.shx = U.clamp(num(cam.shakeX), -36, 36);
        c.shy = U.clamp(num(cam.shakeY), -26, 26);
      }
      c.hgt = c.y + OFF / c.ez;
      return c;
    }
    kS(s) {
      const d = 1 / s - 1 + 1 / this.c.ez;
      return d > 0.02 ? 1 / d : 50;
    }
    px(X, s) { return W / 2 + this.c.shx + (X - this.c.x) * this.kS(s); }
    py(Y, s) { return HY + this.c.shy + (this.c.hgt - Y) * this.kS(s); }

    // ---------------------------------------------------------- update
    update(cam) {
      this.t++;
      const c = this._cam(cam);
      const tr = this.tr;
      if (tr && ++tr.t >= tr.n) { this.mode = tr.to; this.tr = null; }
      this.cl.split += (this.cl.tsplit - this.cl.split) * 0.35;
      this.rumble *= 0.93; this.fl *= 0.86;
      for (const p of this.props) {
        if (this.rumble > 0.05 && p.state < 2 && Math.random() < 0.3) p.wobV += (Math.random() - 0.5) * 0.004 * this.rumble * p.sway;
        p.wobV += -p.wob * 0.07; p.wobV *= 0.9; p.wob += p.wobV;
      }
      for (let i = this.fires.length - 1; i >= 0; i--) {
        const f = this.fires[i];
        if (--f.life <= 0) { this.fires.splice(i, 1); continue; }
        for (const p of this.props) if (p.state < 2 && Math.abs(p.X - f.x) < f.r + 30) { p.hp -= 0.05; p.char = Math.min(1, p.char + 0.004); this._propState(p); }
      }
      for (let i = this.pulls.length - 1; i >= 0; i--) {
        const q = this.pulls[i];
        if (--q.life <= 0) { this.pulls.splice(i, 1); continue; }
        for (const p of this.props) if (p.state < 2 && Math.abs(p.X - q.x) < q.r * 1.6) p.wobV += (Math.sign(q.x - p.X) * 0.0012 * q.str + (Math.random() - 0.5) * 0.002 * q.str) * p.sway;
      }
      if (!this.gfx) return;
      const vis = this._visible();
      if (vis.n) this._ambientArena(false);
      if (vis.v) this._updVoid();
      if (vis.s) this._updShrine();
      if (vis.c && this.t % 2 === 0) {
        const bx = this.cl.split * W, y = Math.random() * H;
        const [X, Y] = this._toWorld(bx, y);
        const p = this._spawn(K_SPARK, X, Y, 1, (Math.random() - 0.5) * 6, (Math.random() - 0.3) * 5, 10 + Math.random() * 12, 1, WA);
        if (p) p.cs = Math.random() < 0.5 ? KIND_COL.blue : KIND_COL.red;
      }
      if (this.splitQ && this.splitQ.length) this._splitNext();
      this._updFires();
      this._updPulls();
      this._updParts();
      this._updChunks();
      for (const a of [this.holes, this.seams, this.gashes, this.cuts]) for (let i = a.length - 1; i >= 0; i--) { a[i].heat *= a[i].decay || 0.975; if (a[i].heat < 0.02) a.splice(i, 1); }
      for (let i = this.rings.length - 1; i >= 0; i--) { const r = this.rings[i]; r.r += r.vr; r.vr *= 0.93; if (--r.life <= 0) this.rings.splice(i, 1); }
      for (const p of this.props) if (p.char - p.charDrawn > 0.08) this._propRefresh(p);
    }
    _visible() {
      const v = this._vis || (this._vis = { n: false, v: false, s: false, c: false });
      v.n = v.v = v.s = v.c = false;
      this._visAdd(v, this.mode);
      if (this.tr) { this._visAdd(v, this.tr.from); this._visAdd(v, this.tr.to); }
      return v;
    }
    _visAdd(v, m) {
      if (m === 'normal') v.n = true; else if (m === 'void') v.v = true; else if (m === 'shrine') v.s = true;
      else if (m === 'clash') { v.c = true; this._visAdd(v, this.cl.left); this._visAdd(v, this.cl.right); }
    }
    _toWorld(sx, sy) {
      const c = this.c;
      return [(sx - W / 2 - c.shx) / c.ez + c.x, c.y - (sy - H / 2 - c.shy) / c.ez];
    }

    // --------------------------------------------------------- particles
    _spawn(k, x, y, s, vx, vy, life, sz, w) {
      const n = this.parts.length;
      if (n >= MAXP || (n > 560 && k !== K_COL && Math.random() < (n - 560) / (MAXP - 560))) return null;
      const p = this.pool.pop() || {};
      p.k = k; p.x = x; p.y = y; p.s = s; p.vx = vx; p.vy = vy; p.vs = 0; p.life = p.max = Math.max(1, life | 0);
      p.sz = sz == null ? 1 : sz; p.w = w || 0; p.rot = 0; p.vr = 0; p.ph = Math.random() * 6.28; p.v = (Math.random() * 4) | 0; p.cs = null; p.a = 1;
      this.parts.push(p);
      this.cnt[k]++;
      return p;
    }
    _kill(i) {
      const P = this.parts, p = P[i];
      this.cnt[p.k]--;
      P[i] = P[P.length - 1]; P.pop();
      this.pool.push(p);
    }
    _viewHalf(s) { return (W / 2) / this.kS(s) + 20; }
    _ambientArena(pre) {
      const c = this.c, a = this.acc;
      // embers rising from the burning city / floor
      a.ember += pre ? 0.4 : 1.15;
      while (a.ember >= 1) {
        a.ember--;
        if (this.cnt[K_EMBER] >= 120) break;
        const r = Math.random();
        const s = r < 0.42 ? U.rand(0.25, 0.75) : r < 0.86 ? U.rand(0.82, 1) : U.rand(1.05, 1.4);
        const k = this.kS(s), hw = this._viewHalf(s);
        const yBot = c.hgt - (H - HY - c.shy) / k, yTop = c.hgt + (HY + c.shy) / k;
        const Y = !pre && Math.random() < 0.65 ? yBot - Math.random() * 20 : U.rand(yBot, yTop);
        this._spawn(K_EMBER, c.x + U.rand(-hw, hw), Y, s, 0.25 + U.rand(-0.3, 0.3), U.rand(0.35, 1.15) * (s > 1 ? 1.6 : 1), U.rand(140, 300), s > 1.02 || Math.random() < 0.12 ? 2 : 1, WN);
      }
      a.ash += pre ? 0.1 : 0.22;
      while (a.ash >= 1) {
        a.ash--;
        if (this.cnt[K_ASH] >= 30) break;
        const s = U.rand(0.5, 1.3), k = this.kS(s);
        this._spawn(K_ASH, c.x + U.rand(-this._viewHalf(s), this._viewHalf(s)), c.hgt + (HY + c.shy) / k + 6, s, U.rand(0.2, 0.8), -U.rand(0.25, 0.6), 500, Math.random() < 0.3 ? 2 : 1, WN);
      }
      a.mote += 0.06;
      while (a.mote >= 1) {
        a.mote--;
        if (this.cnt[K_MOTE] >= 18) break;
        const s = U.rand(0.86, 1.15);
        this._spawn(K_MOTE, c.x + U.rand(-this._viewHalf(s), this._viewHalf(s)), U.rand(0, 50), s, U.rand(-0.1, 0.1), U.rand(0.15, 0.45), U.rand(80, 160), 1, WN);
      }
      // smoke columns from the city
      a.col += pre ? 1 : 0.2;
      while (a.col >= 1) {
        a.col--;
        if (this.cnt[K_COL] >= 125) break;
        const [u, s, sy] = COLS[(Math.random() * COLS.length) | 0];
        const p = this._spawn(K_COL, (u + U.rand(-3, 3)) / s, EYE - (sy - HY) / s, s, U.rand(0.02, 0.08) / s, U.rand(0.22, 0.3) / s, U.rand(560, 680), 1, WN);
        if (p && pre) {
          const age = (Math.random() * p.max * 0.95) | 0;
          for (let i = 0; i < age; i++) { p.vx += 0.0005 / s; p.x += p.vx; p.y += p.vy; }
          p.life -= age;
        }
      }
      if (!pre && this.cnt[K_WISP] < 3 && Math.random() < 0.006) {
        const s = 1.35, k = this.kS(s), dir = 1;
        this._spawn(K_WISP, c.x - dir * (W / 2 / k + 50), U.rand(-10, 60), s, U.rand(0.35, 0.7), 0, 900, 3, WN);
      }
    }
    _updParts() {
      const P = this.parts, t = this.t, pulls = this.pulls;
      for (let i = P.length - 1; i >= 0; i--) {
        const p = P[i];
        if (--p.life <= 0) { this._kill(i); continue; }
        if (pulls.length && (p.k === K_ROCK || p.k === K_DUST || p.k === K_SMOKE || p.k === K_SPARK || p.k === K_ASH)) {
          for (const q of pulls) {
            const dx = q.x - p.x, dy = q.y - p.y, d = hyp(dx, dy) + 0.01, R = q.r * 1.4;
            if (d > R) continue;
            const f = q.str * (0.35 + 0.6 * (1 - d / R));
            p.vx += (dx / d) * f - (dy / d) * 0.25 * q.str;
            p.vy += (dy / d) * f + (dx / d) * 0.25 * q.str + GRAV * 0.95;
            p.vx *= 0.88; p.vy *= 0.88; p.s += (1 - p.s) * 0.06;
            if (p.k === K_ROCK) p.vr += (Math.random() - 0.5) * 0.1;
          }
        }
        switch (p.k) {
          case K_EMBER:
            p.vx += Math.sin(t * 0.05 + p.ph) * 0.018; p.vy += 0.003;
            p.x += p.vx; p.y += p.vy; break;
          case K_ASH: p.x += p.vx + Math.sin(t * 0.03 + p.ph) * 0.35; p.y += p.vy; if (p.y < -5) p.life = 0; break;
          case K_MOTE: p.x += p.vx + Math.sin(t * 0.04 + p.ph) * 0.15; p.y += p.vy; break;
          case K_COL: p.vx += 0.0005 / p.s; p.x += p.vx; p.y += p.vy; break;
          case K_SMOKE: p.x += p.vx; p.y += p.vy; p.vx *= 0.96; p.vy = p.vy * 0.96 + 0.035; break;
          case K_DUST: p.x += p.vx; p.y += p.vy; p.vx *= 0.9; p.vy = p.vy * 0.9 + 0.012; break;
          case K_WISP: p.x += p.vx; p.y += Math.sin(t * 0.01 + p.ph) * 0.06; break;
          case K_FLAME: p.x += p.vx; p.y += p.vy; break;
          case K_DROP: p.vy -= GRAV * 0.8; p.x += p.vx; p.y += p.vy; if (p.y < 0) { p.life = 0; } break;
          case K_SPARK:
            p.vy -= GRAV * 0.45; p.x += p.vx; p.y += p.vy; p.vx *= 0.95;
            if (p.y < 0) { p.y = 0; p.vy = -p.vy * 0.35; p.vx *= 0.7; }
            break;
          case K_ROCK:
            p.vy -= GRAV; p.x += p.vx; p.y += p.vy; p.s = U.clamp(p.s + p.vs, 0.82, 1.32); p.rot += p.vr;
            if (p.y <= 0 && p.vy < 0) {
              p.y = 0;
              if (p.vy > -1.6 && Math.abs(p.vx) < 1.2) {
                if (p.sz >= 1 && Math.abs(p.x) < 900) {
                  if (this.rubble.length >= MAXRUB) this.rubble.shift();
                  this.rubble.push({ x: p.x, s: p.s, si: p.sz, v: p.v });
                }
                p.life = 0;
              } else { p.vy = -p.vy * 0.36; p.vx *= 0.62; p.vr *= 0.6; p.vs *= 0.4; }
            }
            break;
        }
      }
    }
    _updFires() {
      for (const f of this.fires) {
        const k = Math.min(1, f.life / 40) * Math.min(1, (f.max - f.life) / 6 + 0.3);
        let n = f.r * 0.016 * k;
        while (n > 0 && (n >= 1 || Math.random() < n)) {
          n--;
          const u = (Math.random() * 2 - 1) * Math.sqrt(Math.random()), hk = 1 - u * u * 0.75;
          const big = hk > 0.55 ? (Math.random() < 0.35 ? 2 : Math.random() < 0.6 ? 1 : 0) : Math.random() < 0.3 ? 1 : 0;
          const p = this._spawn(K_FLAME, f.x + u * f.r, U.rand(-2, 1), U.rand(0.93, 1.09), U.rand(-0.05, 0.2), U.rand(0.15, 0.45) * hk, U.rand(16, 30) * (0.6 + 0.5 * hk), big, WA);
          if (p) { p.v = (Math.random() * 8) | 0; p.a = 0.55 + 0.55 * hk; }
        }
        if (Math.random() < 0.45 * k) this._spawn(K_EMBER, f.x + U.rand(-f.r, f.r) * 0.8, U.rand(10, 40), U.rand(0.9, 1.15), U.rand(-0.3, 0.6), U.rand(0.8, 2), U.rand(40, 90), Math.random() < 0.3 ? 2 : 1, WA);
        if (Math.random() < 0.06 * k) this._spawn(K_SMOKE, f.x + U.rand(-f.r, f.r) * 0.5, 34, 0.96, U.rand(-0.2, 0.4), U.rand(0.6, 1.1), U.rand(70, 120), 1 + ((Math.random() * 2) | 0), WA);
      }
    }
    _updPulls() {
      for (const q of this.pulls) {
        // lift rubble lying inside the radius
        for (let i = this.rubble.length - 1; i >= 0; i--) {
          const r = this.rubble[i];
          if (Math.abs(r.x - q.x) > q.r * 1.3 || Math.random() > 0.08 * q.str) continue;
          this.rubble.splice(i, 1);
          const p = this._spawn(K_ROCK, r.x, 0.5, r.s, 0, U.rand(1, 3), 240, r.si, WA);
          if (p) { p.v = r.v; p.vr = U.rand(-0.2, 0.2); }
        }
        // tear fresh chips and dust off the floor
        if (Math.random() < 0.35 * q.str) {
          const p = this._spawn(K_ROCK, q.x + U.rand(-q.r, q.r), 0.5, U.rand(0.9, 1.15), 0, U.rand(1.5, 3.5), 200, (Math.random() * 3) | 0, WA);
          if (p) p.vr = U.rand(-0.3, 0.3);
        }

      if (JJK.Audio) JJK.Audio.play('ground_bounce', { pan: f.pan() });

    }
    onKnockdown(f, ko) {

    pushboxes() {

        const s = Math.sign(sep);

        const aAway = Math.sign(a.vx) === -s, bAway = Math.sign(b.vx) === s;
        if (aAway && !bAway) a.x += s * over;
        else if (bAway && !aAway) b.x -= s * over;
        else { a.x += s * over / 2; b.x -= s * over / 2; }
      }
    }

    camStep() {
      const [a, b] = this.fighters;
      this.cam.update(a, b);
    }

    timeOver() {
      const [a, b] = this.fighters;

    roundFlow() {

            this.banner('FIGHT!', { life: 55, scale: 9, shake: true });
            if (JJK.Voice) JJK.Voice.announce('Fight!');

        case 'fight': {
          // safety: any fighter at 0 HP must be KO'd (e.g. damage dealt during a transition)
          for (const f of this.fighters) if (f.hp <= 0 && !f.ko && !this.training) { this.onKO(f, this.opp(f), {}); break; }
          if (JJK.Music && !this.domain && !this.clash) {
            const low = Math.min(a.hp / a.maxHp, b.hp / b.maxHp);
            const final = this.roundLabel === 'FINAL ROUND';
            JJK.Music.setIntensity(low < 0.25 ? 1 : low < 0.5 ? 0.6 : final ? 0.5 : 0);
          }
          break;
        }
        case 'ko': {
          const info = this.koInfo;
          if (this.pt === 30 && !info.timeout) this.banner('K.O.', { life: 110, scale: 12, top: '#ffffff', mid: '#ff5040', mid2: '#e01010', bot: '#600000', shake: true });
          if (this.pt === 34 && !info.timeout && JJK.Voice) JJK.Voice.announce('K.O.');
          const settled = this.fighters.every((f) => f.st !== 'move' && f.st !== 'juggle' && f.st !== 'hit' && !this.cine) || this.pt > 260;
          if (this.pt >= 150 && settled && !this.koDone) {
            this.koDone = true;
            const w = info.winner;
            if (w) {
              w.wins++;
              w.st = 'win'; w.sf = 0; w.setAnim('win'); w.move = null; w.vx = 0;
              const l = info.loser;
              if (l && !l.ko) { l.st = 'lose'; l.setAnim('lose'); }
              const txt = w.def.name + ' WINS';
              this.banner(txt, { life: 150, scale: 6, y: 150 });
              if (info.perfect) this.banner('FLAWLESS VICTORY', { life: 150, scale: 3, y: 205, top: '#ffffff', mid: '#ffe080', bot: '#c07000' });
              if (JJK.Voice) { JJK.Voice.announce(w.def.name.toLowerCase() + ' wins'); }
              if (w.wins >= this.winsNeeded && JJK.Voice) setTimeoutSafe(() => JJK.Voice.say(w.def.id, 'win'), 1500);
              if (JJK.Music && w.wins >= this.winsNeeded) JJK.Music.play('victory');
            } else {
              this.banner('DRAW', { life: 150, scale: 6 });
              for (const f of this.fighters) f.wins++;
            }
            this.pt = 150;
          }
          if (this.koDone && this.pt >= 340) {
            this.koDone = false;
            const done = this.fighters.find((f) => f.wins >= this.winsNeeded);
            if (done) {
              const both = this.fighters.every((f) => f.wins >= this.winsNeeded);
              this.phase = 'over'; this.pt = 0;
              this.result = { winner: both ? null : done, stats: this.stats };
            } else {
              this.round++;
              if (JJK.Music) JJK.Music.play('battle');
              this.startRound();
            }
          }
          break;
        }
        case 'over': break;
      }
    }

    // --------------------------------------------------------------- render
    render(ctx) {
      const cam = this.cam;
      const st = this.stage;
      JJK.FX.lights.length = 0;
      // gather lights from projectiles & fighters (used by the rasterizer)
      for (const p of this.projectiles) if (p.light) p.light(p, this);
      for (const f of this.fighters) if (f.def.lights) f.def.lights(f, this);
      if (this.domain && JJK.Domain) JJK.Domain.lights(this);
      if (st) {
        st.darken = Math.max(this.darken, this.cine && this.cine.dark != null ? this.cine.dark : 0);
        st.drawBack(ctx, cam);
      } else {
        ctx.fillStyle = '#301010'; ctx.fillRect(0, 0, W, H);
      }
      if (this.domain && JJK.Domain) JJK.Domain.drawBack(ctx, this);
      JJK.FX.draw(ctx, cam, 'back');
      for (const p of this.projectiles) if (p.layer === 'back') p.draw(ctx, cam, this);
      for (const f of this.fighters) if (f.visible) f.drawShadow(ctx, cam);
      const order = this.topFighter === this.fighters[0] ? [this.fighters[1], this.fighters[0]] : [this.fighters[0], this.fighters[1]];
      for (const f of order) {
        if (f.def.drawBehind) f.def.drawBehind(f, ctx, cam, this);
        f.render(ctx, cam, this);
        if (f.def.drawFx) f.def.drawFx(f, ctx, cam, this);
      }
      for (const p of this.projectiles) if (p.layer !== 'back') p.draw(ctx, cam, this);
      JJK.FX.draw(ctx, cam, 'front');
      if (st && st.drawFront) st.drawFront(ctx, cam);
      if (this.domain && JJK.Domain) JJK.Domain.drawFront(ctx, this);
      this.applyDistortions(ctx);
      // low-health danger vignette
      if (this.phase === 'fight' && !this.training) {
        const low = Math.min(...this.fighters.map((f) => f.hp / f.maxHp));
        if (low < 0.25) this.drawDanger(ctx, (0.25 - low) / 0.25);
      }
      if (this.impactT > 0) this.drawImpactFrame(ctx);
      if (this.tear) this.applyTear(ctx);
      if (this.cine && this.cine.draw) this.cine.draw(ctx, this, this.cine.t);
      if (this.clash && JJK.Domain) JJK.Domain.drawClash(ctx, this);
      // popups
      for (const p of this.popups) {
        const k = p.t / p.life;
        const sx = cam.sx(p.x), sy = cam.sy(p.y) - k * 18;
        ctx.globalAlpha = k > 0.75 ? (1 - k) * 4 : 1;
        JJK.Font.draw(ctx, p.text, U.clamp(sx, 50, W - 50), Math.max(56, sy), { color: p.color, scale: p.big ? 2 : 1, align: 'center', outline: '#000' });
        ctx.globalAlpha = 1;
      }
      // flash
      if (this.flash) {
        const f = this.flash;
        ctx.globalAlpha = f.alpha * (1 - f.t / f.frames);
        ctx.fillStyle = f.color;
        ctx.fillRect(0, 0, W, H);
        ctx.globalAlpha = 1;
      }
      // letterbox
      const lb = this.cine && this.cine.letterbox ? this.cine.letterbox : this.freeze > 0 ? 18 : 0;
      this.letterbox = U.approach(this.letterbox, lb, 3);
      if (this.letterbox > 0) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, this.letterbox);
        ctx.fillRect(0, H - this.letterbox, W, this.letterbox);
      }
      // the HUD steps aside during cinematics
      this.hudAlpha = U.approach(this.hudAlpha == null ? 1 : this.hudAlpha, this.cine || this.clash ? 0 : 1, 0.12);
      if (this.hud && this.hudAlpha > 0.01) {
        ctx.globalAlpha = this.hudAlpha;
        this.hud.draw(ctx);
        ctx.globalAlpha = 1;
      }
      if (this.training && !this.cine && !this.clash) JJK.Training.draw(ctx, this);
    }

    drawDanger(ctx, k) {
      if (!this._vig && hasDoc) {
        const c = document.createElement('canvas');
        c.width = W; c.height = H;
        const x = c.getContext('2d');
        const g = x.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, W * 0.62);
        g.addColorStop(0, 'rgba(160,0,0,0)');
        g.addColorStop(1, 'rgba(160,0,0,1)');
        x.fillStyle = g;
        x.fillRect(0, 0, W, H);
        this._vig = c;
      }
      if (!this._vig) return;
      ctx.globalAlpha = (0.18 + 0.14 * Math.sin(this.frame * 0.12)) * (0.5 + k * 0.5);
      ctx.drawImage(this._vig, 0, 0);
      ctx.globalAlpha = 1;
    }

    drawImpactFrame(ctx) {
      // High-contrast anime impact frame: black screen, white silhouettes + speed lines
      ctx.save();
      ctx.fillStyle = this.impactCol === 0xff000000 ? '#fff' : '#000';
      ctx.globalAlpha = 0.92;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
      const col = this.impactCol === 0xff000000 ? '#000' : '#fff';
      for (const f of this.fighters) {
        const r = f.raster;
        if (!r || !r.canvas) continue;
        const b = r.bbox;
        if (b[2] <= 0) continue;
        if (!this._sil) { this._sil = document.createElement('canvas'); this._sil.width = W; this._sil.height = H; }
        const sx = this._sil.getContext('2d');
        sx.globalCompositeOperation = 'source-over';
        sx.clearRect(0, 0, W, H);
        sx.drawImage(r.canvas, 0, 0);
        sx.globalCompositeOperation = 'source-in';
        sx.fillStyle = f === this.lastHitBy ? col : (this.impactCol === 0xffff2020 ? '#ff2020' : col);
        sx.fillRect(0, 0, W, H);
        ctx.drawImage(this._sil, 0, 0);
      }
      // radial speed lines
      const c = this.fighters[0].x + this.fighters[1].x;
      const cx = this.cam.sx(c / 2), cy = this.cam.sy(110);
      ctx.strokeStyle = col;
      for (let i = 0; i < 40; i++) {
        const a = (i / 40) * Math.PI * 2 + this.frame * 0.3;
        const r0 = 120 + ((i * 37) % 60), r1 = 420;
        ctx.lineWidth = 1 + (i % 3);
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
        ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
        ctx.stroke();
      }
      ctx.restore();
    }

    applyDistortions(ctx) {
      if (!this.distorts.length || !hasDoc) { this.distorts.length = 0; return; }
      const canvas = ctx.canvas;
      for (const d of this.distorts) {
        const sx = this.cam.sx(d.x), sy = this.cam.sy(d.y), r = d.r * this.cam.ez;
        if (r < 4) continue;
        ctx.save();
        ctx.beginPath();
        ctx.arc(sx, sy, r, 0, Math.PI * 2);
        ctx.clip();
        // k < 1 pinches (Blue), k > 1 bulges (Red)
        const k = d.k;
        const src = r / k;
        try {
          ctx.drawImage(canvas, sx - src, sy - src, src * 2, src * 2, sx - r, sy - r, r * 2, r * 2);
        } catch (e) {}
        ctx.restore();
      }
      this.distorts.length = 0;
    }

    applyTear(ctx) {
      const t = this.tear;
      t.t++;
      if (t.t > t.life) { this.tear = null; return; }
      if (!hasDoc) return;
      if (!this._tearBuf) { this._tearBuf = document.createElement('canvas'); this._tearBuf.width = W; this._tearBuf.height = H; }
      const b = this._tearBuf.getContext('2d');
      b.clearRect(0, 0, W, H);
      b.drawImage(ctx.canvas, 0, 0);
      const x0 = this.cam.sx(t.x0), y0 = this.cam.sy(t.y0), x1 = this.cam.sx(t.x1), y1 = this.cam.sy(t.y1);
      const dx = x1 - x0, dy = y1 - y0, l = Math.hypot(dx, dy) || 1;
      const nx = -dy / l, ny = dx / l;
      const k = t.t < t.life * 0.3 ? t.t / (t.life * 0.3) : 1 - (t.t - t.life * 0.3) / (t.life * 0.7);
      const off = t.amount * k;
      const far = 2000;
      const half = (sgn) => {
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(x0 - dx / l * far, y0 - dy / l * far);
        ctx.lineTo(x0 + dx / l * far, y0 + dy / l * far);
        ctx.lineTo(x0 + dx / l * far + nx * far * sgn, y0 + dy / l * far + ny * far * sgn);
        ctx.lineTo(x0 - dx / l * far + nx * far * sgn, y0 - dy / l * far + ny * far * sgn);
        ctx.closePath();
        ctx.clip();
        ctx.drawImage(this._tearBuf, (dx / l) * off * sgn + nx * off * 0.4 * sgn, (dy / l) * off * sgn + ny * off * 0.4 * sgn);
        ctx.restore();
      };
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);
      half(1);
      half(-1);
      // bright seam
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = `rgba(255,255,255,${0.9 * k})`;
      ctx.lineWidth = 1 + 3 * k;
      ctx.beginPath();
      ctx.moveTo(x0 - dx / l * far, y0 - dy / l * far);
      ctx.lineTo(x0 + dx / l * far, y0 + dy / l * far);
      ctx.stroke();
      ctx.strokeStyle = `rgba(255,40,40,${0.6 * k})`;
      ctx.lineWidth = 6 * k + 2;
      ctx.stroke();
      ctx.restore();
    }

    destroy() {
      if (JJK.Voice && JJK.Voice.offCaption && this._capFn) JJK.Voice.offCaption(this._capFn);
    }
  }

  // setTimeout that is safe for headless simulation (runs immediately-later via queue)
  function setTimeoutSafe(fn, ms) {
    if (typeof setTimeout !== 'undefined' && !JJK.HEADLESS) setTimeout(fn, ms);
  }
  JJK.setTimeoutSafe = setTimeoutSafe;

  JJK.Battle = Battle;
})();

</script>

<script>/* src/ui/menus.js */
// Scenes & menus: title, main menu, character select, difficulty, VS screen,
// battle wrapper with pause menu, move list, controls, options and results.
(function () {
  'use strict';
  const JJK = (typeof window !== 'undefined' ? window : globalThis).JJK;
  const U = JJK.U, B = JJK.BTN, Font = JJK.Font, FX = JJK.FX;
  const W = JJK.W, H = JJK.H;
  const snd = (n, o) => JJK.Audio && JJK.Audio.play(n, o);
  const UI = (JJK.UI = {});

  // ------------------------------------------------------------ menu input
  // Combines both keyboards + all pads into menu events with key repeat.
  class MenuInput {
    constructor() { this.prev = {}; this.rep = {}; this.ev = {}; }
    poll(ctrls) {
      const st = { up: false, down: false, left: false, right: false, ok: false, back: false, start: false, alt: false };
      const k = JJK.keys;
      const has = (codes) => codes.some((c) => k.has(c));
      st.up = has(['ArrowUp', 'KeyW']); st.down = has(['ArrowDown', 'KeyS']);
      st.left = has(['ArrowLeft', 'KeyA']); st.right = has(['ArrowRight', 'KeyD']);
      st.ok = has(['Enter', 'KeyJ', 'KeyU', 'Space', 'NumpadEnter', 'Numpad1', 'Comma']);
      st.back = has(['Escape', 'Backspace', 'KeyK', 'Numpad2', 'Period']);
      st.alt = has(['KeyI', 'KeyL', 'Numpad3', 'Slash']);
      if (typeof navigator !== 'undefined' && navigator.getGamepads) {
        const pads = navigator.getGamepads();
        for (let i = 0; i < pads.length; i++) {
          const p = JJK.padState(i);
          if (!p) continue;
          st.up = st.up || p.up; st.down = st.down || p.down; st.left = st.left || p.left; st.right = st.right || p.right;
          st.ok = st.ok || p.SP || p.START; st.back = st.back || p.SU || p.BACK; st.alt = st.alt || p.L || p.M;
        }
      }
      for (const key in st) {
        const was = this.prev[key];
        let fire = st[key] && !was;
        if (st[key] && was && (key === 'up' || key === 'down' || key === 'left' || key === 'right')) {
          this.rep[key] = (this.rep[key] || 0) + 1;
          if (this.rep[key] > 18 && this.rep[key] % 5 === 0) fire = true;
        } else if (!st[key]) this.rep[key] = 0;
        this.ev[key] = fire;
      }
      this.prev = st;
      void ctrls;
      return this.ev;
    }
    // per-player confirm for character select
  }
  UI.input = new MenuInput();

  // ------------------------------------------------------------ shared drawing
  let bgStage = null, bgCam = null;
  UI.drawBackdrop = function (ctx, t, dim = 0.55) {
    if (JJK.Stage && !bgStage) { bgStage = new JJK.Stage(); bgStage.reset && bgStage.reset(); bgCam = new JJK.Camera(); }
    if (bgStage) {
      bgCam.x = Math.sin(t * 0.004) * 200;
      bgCam.y = JJK.CAM_BASE_Y;
      bgCam.ez = 1;
      bgStage.update && bgStage.update(bgCam);
      bgStage.darken = 0;
      bgStage.drawBack(ctx, bgCam);
      bgStage.drawFront && bgStage.drawFront(ctx, bgCam);
    } else {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#1a0406'); g.addColorStop(0.6, '#6a1a10'); g.addColorStop(1, '#100404');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
    ctx.fillStyle = `rgba(8,0,4,${dim})`;
    ctx.fillRect(0, 0, W, H);
    // embers
    if (t % 3 === 0) FX.spawn('px', U.rand(-320, 320), -10, { vy: U.rand(0.4, 1.2), vx: U.rand(-0.3, 0.3), life: 220, size: U.rand(1, 2), color: U.pick(['#ff8a3a', '#ffd060', '#ff4020']), add: true, fade: 1 });
  };

  UI.title = function (ctx, y, small) {
    const b = Font.banner('CURSED ARTS', { scale: small ? 5 : 8, top: '#fff6c0', mid: '#ffd21a', mid2: '#f08000', bot: '#8a1a00', outline: '#200000' });
    if (b) ctx.drawImage(b, Math.round(W / 2 - b.width / 2), y);
    return b ? b.height : 0;
  };

  // A character drawn at large scale for menus.
  const bigRasters = {};
  UI.drawFighterBig = function (ctx, charId, pal, poseName, x, y, facing, z, opts = {}) {
    if (typeof document === 'undefined') return;
    const key = charId + (opts.slot || '');
    let r = bigRasters[key];
    if (!r) r = bigRasters[key] = new JJK.Raster(W, H);
    const def = JJK.Chars[charId];
    const anim = opts.anim ? def.anims[opts.anim] : null;
    const pose = anim ? JJK.Rig.sample(anim, opts.t || 0, def.poses) : JJK.Rig.full(def.poses[poseName] || def.poses.idle);
    if (opts.eyes) pose.eyes = 'open';
    const J = JJK.Rig.solve(pose, def.art.dims);
    const xf = new JJK.Rig.Xform().set(x, y, facing, z, pose.rot || 0, [0, 70], 1, 1);
    r.begin();
    r.lights.push({ x: x + facing * 34 * z, y: y - 110 * z, r: 60 * z, r2: 3600 * z * z, c: charId === 'gojo' ? [40, 110, 255] : [255, 50, 30], i: 0.4 });
    if (opts.dark) r.tint = [10, 0, 10, 0.75];
    def.art.draw(r, J, xf, { pose, pal, sec: opts.sec || new JJK.Rig.Secondary(), eyesOpen: !!opts.eyes });
    r.outline(def.art.outline, opts.aura || 0, true);
    r.flush();
    r.drawTo(ctx, opts.alpha != null ? opts.alpha : 1);
  };

  function list(ctx, items, sel, x, y, opts = {}) {
    const lh = opts.lh || 22;
    items.forEach((it, i) => {
      const yy = y + i * lh;
      const on = i === sel;
      const label = typeof it.label === 'function' ? it.label() : it.label;
      if (on) {
        ctx.fillStyle = 'rgba(255,60,30,0.25)';
        ctx.fillRect(x - (opts.w || 180) / 2, yy - 4, opts.w || 180, lh - 4);
        ctx.fillStyle = '#ff5030';
        ctx.fillRect(x - (opts.w || 180) / 2, yy - 4, 3, lh - 4);
      }
      Font.draw(ctx, label, x, yy, { color: it.disabled ? '#606060' : on ? '#ffffff' : '#c0a8a0', align: 'center', scale: opts.scale || 2, outline: '#000' });
    });
  }

  // ------------------------------------------------------------ scenes
  class Title {
    constructor() { this.t = 0; }
    tick(g) {
      this.t++;
      const ev = UI.input.poll();
      if (ev.ok || ev.start || ev.back || (this.t > 30 && JJK.keys.size && !this._held)) {
        if (ev.ok || ev.start) {
          if (JJK.Audio) JJK.Audio.unlock();
          snd('ui_start');
          g.set(new MainMenu());
        }
      }
      if (this.t === 2 && JJK.Music) JJK.Music.play('title');
      FX.update();
    }
    render(ctx) {
      UI.drawBackdrop(ctx, this.t, 0.35);
      FX.draw(ctx, { sx: (x) => x + 320, sy: (y) => -y + 360, ez: 1 }, 'front');
      // characters
      UI.drawFighterBig(ctx, 'gojo', 0, null, 190, 378, 1, 1.25, { anim: 'idle', t: this.t, slot: 'a' });
      UI.drawFighterBig(ctx, 'sukuna', 0, null, 450, 378, -1, 1.25, { anim: 'idle', t: this.t, slot: 'b' });
      const hh = UI.title(ctx, 24);
      Font.draw(ctx, 'GOJO  VS  SUKUNA', W / 2, 26 + hh, { color: '#ffffff', align: 'center', scale: 2, outline: '#300000' });
      Font.draw(ctx, 'A JUJUTSU ARCADE FIGHTER', W / 2, 46 + hh, { color: '#d0a090', align: 'center', outline: '#000' });
      if (this.t % 60 < 40) Font.draw(ctx, 'PRESS START', W / 2, 300, { color: '#ffd23a', align: 'center', scale: 2, outline: '#000' });
      Font.draw(ctx, 'ENTER / J / GAMEPAD A', W / 2, 320, { color: '#a08070', align: 'center', outline: '#000' });
      Font.draw(ctx, 'FAN-MADE • PERSONAL USE', W / 2, 348, { color: '#604040', align: 'center' });
    }
  }
  UI.Title = Title;

  class MainMenu {
    constructor() {
      this.t = 0; this.sel = 0;
      this.items = [
        { label: 'ARCADE  (VS CPU)', go: (g) => g.set(new Difficulty('arcade')) },
        { label: 'VERSUS  (2 PLAYERS)', go: (g) => g.set(new Select({ mode: 'versus' })) },
        { label: 'CPU VS CPU', go: (g) => g.set(new Difficulty('watch')) },
        { label: 'TRAINING', go: (g) => g.set(new Select({ mode: 'training' })) },
        { label: 'MOVE LIST', go: (g) => g.set(new MoveList(this)) },
        { label: 'CONTROLS', go: (g) => g.set(new Controls(this)) },
        { label: 'OPTIONS', go: (g) => g.set(new Options(this)) },
      ];
    }
    tick(g) {
      this.t++;
      const ev = UI.input.poll();
      if (ev.up) { this.sel = (this.sel + this.items.length - 1) % this.items.length; snd('ui_move'); }
      if (ev.down) { this.sel = (this.sel + 1) % this.items.length; snd('ui_move'); }
      if (ev.ok) { snd('ui_select'); this.items[this.sel].go(g); }
      if (ev.back) { snd('ui_back'); g.set(new Title()); }
      if (JJK.Music && this.t === 1) JJK.Music.play('title');
      FX.update();
    }
    render(ctx) {
      UI.drawBackdrop(ctx, this.t + 500, 0.62);
      UI.title(ctx, 18, true);
      list(ctx, this.items, this.sel, W / 2, 110, { w: 300 });
      Font.draw(ctx, '↑↓ SELECT   ENTER/J CONFIRM   ESC/K BACK', W / 2, 340, { color: '#a08070', align: 'center' });
    }
  }
  UI.MainMenu = MainMenu;

  class Difficulty {
    constructor(mode, sel) {
      this.mode = mode; this.t = 0;
      this.levels = ['easy', 'normal', 'hard', 'extreme', 'boss'];
      this.sel = sel != null ? sel : 1;
      this.desc = {
        easy: 'SIMPLE ATTACKS, LIMITED COMBOS.',
        normal: 'BASIC DEFENSE AND SPECIALS.',
        hard: 'COMBOS, COUNTERS, SPACING, RESOURCES.',
        extreme: 'ADVANCED NEUTRAL, PUNISHES EVERYTHING.',
        boss: 'RELENTLESS. STILL OBEYS THE RULES.',
      };
    }
    tick(g) {
      this.t++;
      const ev = UI.input.poll();
      if (ev.up) { this.sel = (this.sel + 4) % 5; snd('ui_move'); }
      if (ev.down) { this.sel = (this.sel + 1) % 5; snd('ui_move'); }
      if (ev.back) { snd('ui_back'); g.set(new MainMenu()); }
      if (ev.ok) { snd('ui_select'); g.set(new Select({ mode: this.mode, level: this.levels[this.sel] })); }
      FX.update();
    }
    render(ctx) {
      UI.drawBackdrop(ctx, this.t + 900, 0.62);
      Font.draw(ctx, 'SELECT DIFFICULTY', W / 2, 40, { color: '#ffd23a', align: 'center', scale: 3, outline: '#000' });
      list(ctx, this.levels.map((l) => ({ label: l.toUpperCase() })), this.sel, W / 2, 100, { w: 220, lh: 26 });
      Font.draw(ctx, this.desc[this.levels[this.sel]], W / 2, 260, { color: '#e0c0b0', align: 'center', outline: '#000' });
    }
  }
  UI.Difficulty = Difficulty;

  // Character select: P1 (and P2 in versus) pick a character and a color.
  class Select {
    constructor(o) {
      this.o = o; this.t = 0;
      this.chars = ['gojo', 'sukuna'];
      this.cur = [0, 1];
      this.pal = [0, 0];
      this.done = [false, o.mode !== 'versus'];
      this.cpuPick = o.mode !== 'versus';
      this.secs = [new JJK.Rig.Secondary(), new JJK.Rig.Secondary()];
      this.prevHeld = [0, 0];
    }
    tick(g) {
      this.t++;
      const ev = UI.input.poll();
      if (ev.back && !this.done[0]) { snd('ui_back'); g.set(new MainMenu()); return; }
      // P1 uses keyboard 1 / pad 1; P2 uses keyboard 2 / pad 2 (versus)
      const ctrls = g.ctrls;
      for (let i = 0; i < 2; i++) {
        if (i === 1 && this.o.mode !== 'versus') break;
        const c = ctrls[i].poll();
        const pressed = c.pressed;
        const d = c.dir, pd = this.prevDir ? this.prevDir[i] : 5;
        if (!this.done[i]) {
          if ((d === 4 && pd !== 4) || (d === 6 && pd !== 6)) { this.cur[i] = 1 - this.cur[i]; snd('ui_move'); }
          if (pressed & (B.L | B.SP | B.START)) { this.pal[i] = 0; this.lock(i); }
          else if (pressed & (B.M | B.H | B.SU)) { this.pal[i] = 1; this.lock(i); }
        } else if (pressed & B.BACK) { this.done[i] = false; snd('ui_back'); }
        if (!this.prevDir) this.prevDir = [5, 5];
        this.prevDir[i] = d;
      }
      // menu-confirm for P1 also works from the shared menu input
      if (!this.done[0] && ev.ok && !(g.ctrls[0].pressed)) { this.pal[0] = 0; this.lock(0); }
      if (this.done[0] && this.cpuPick && !this.cpuDone) {
        this.cpuDone = true;
        this.cur[1] = this.o.mode === 'training' ? 1 - this.cur[0] : 1 - this.cur[0];
        if (this.o.mode === 'watch') this.cur[1] = 1 - this.cur[0];
        this.pal[1] = this.cur[1] === this.cur[0] ? 1 - this.pal[0] : 0;
      }
      if (this.done[0] && this.done[1] && !this.go) {
        this.go = this.t;
      }
      if (this.go && this.t - this.go > 30 && this.o.mode === 'arcade') {
        g.set(new VsScreen(UI.arcadeStage(Object.assign({}, this.o, { p1: { char: this.chars[this.cur[0]], pal: this.pal[0] } }), 1)));
        return;
      }
      if (this.go && this.t - this.go > 30) {
        const p1 = { char: this.chars[this.cur[0]], pal: this.pal[0] };
        const p2 = { char: this.chars[this.cur[1]], pal: this.cur[0] === this.cur[1] && this.pal[0] === this.pal[1] ? 1 - this.pal[0] : this.pal[1] };
        g.set(new VsScreen(Object.assign({}, this.o, { p1, p2 })));
      }
      for (const s of this.secs) s.t++;
    }
    lock(i) {
      this.done[i] = true;
      snd('ui_select');
      const id = this.chars[this.cur[i]];
      if (JJK.Voice) JJK.Voice.say(id, 'taunt');
    }
    render(ctx) {
      UI.drawBackdrop(ctx, this.t + 1300, 0.7);
      Font.draw(ctx, 'SELECT YOUR SORCERER', W / 2, 14, { color: '#ffd23a', align: 'center', scale: 3, outline: '#000' });
      // two big character panels
      for (let k = 0; k < 2; k++) {
        const id = this.chars[k];
        const def = JJK.Chars[id];
        const cx = k === 0 ? 180 : 460;
        const hov = [0, 1].filter((i) => this.cur[i] === k && (i === 0 || this.o.mode === 'versus' || this.cpuDone));
        ctx.fillStyle = hov.length ? 'rgba(255,80,40,0.16)' : 'rgba(0,0,0,0.35)';
        ctx.fillRect(cx - 120, 46, 240, 262);
        ctx.fillStyle = def.color;
        ctx.fillRect(cx - 120, 46, 240, 2);
        const pal = hov.length ? this.pal[hov[0]] : 0;
        UI.drawFighterBig(ctx, id, pal, null, cx, 290, k === 0 ? 1 : -1, 1.25, { anim: 'idle', t: this.t, slot: 's' + k, sec: this.secs[k] });
        Font.draw(ctx, def.full, cx, 256, { color: '#ffffff', align: 'center', scale: 2, outline: '#000' });
        Font.draw(ctx, def.title, cx, 276, { color: def.color, align: 'center', outline: '#000' });
        Font.draw(ctx, id === 'gojo' ? 'CONTROLS SPACE' : 'CONTROLS DESTRUCTION', cx, 288, { color: '#c0a8a0', align: 'center', outline: '#000' });
        for (const i of hov) {
          const tag = this.o.mode === 'versus' || i === 0 ? 'P' + (i + 1) : 'CPU';
          const col = i === 0 ? '#40a0ff' : '#ff4040';
          Font.draw(ctx, tag + (this.done[i] ? ' OK' : ''), cx + (i === 0 ? -100 : 100), 56, { color: col, align: i === 0 ? 'left' : 'right', scale: 2, outline: '#000' });
        }
      }
      const help = this.o.mode === 'versus' ? 'P1: A/D + J (color 1) or K (color 2)    P2: ←/→ + NUM1 / NUM2' : '←/→ CHOOSE   J/L: COLOR 1   K/H: COLOR 2';
      Font.draw(ctx, help, W / 2, 322, { color: '#e0c0b0', align: 'center', outline: '#000' });
      Font.draw(ctx, 'MODE: ' + this.o.mode.toUpperCase() + (this.o.level ? '  •  CPU ' + this.o.level.toUpperCase() : ''), W / 2, 338, { color: '#a08070', align: 'center' });
    }
  }
  UI.Select = Select;

  class VsScreen {
    constructor(o) { this.o = o; this.t = 0; }
    tick(g) {
      this.t++;
      if (this.t === 1) snd('ui_start');
      const ev = UI.input.poll();
      if (this.t > 150 || (this.t > 30 && ev.ok)) g.startBattle(this.o);
      FX.update();
    }
    render(ctx) {
      ctx.fillStyle = '#080004'; ctx.fillRect(0, 0, W, H);
      const k = U.ease.out3(Math.min(1, this.t / 24));
      // diagonal split
      ctx.fillStyle = '#0c1a3a';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(360, 0); ctx.lineTo(280, H); ctx.lineTo(0, H); ctx.fill();
      ctx.fillStyle = '#3a0c0c';
      ctx.beginPath(); ctx.moveTo(360, 0); ctx.lineTo(W, 0); ctx.lineTo(W, H); ctx.lineTo(280, H); ctx.fill();
      const o = this.o;
      UI.drawFighterBig(ctx, o.p1.char, o.p1.pal, null, -100 + 300 * k, 420, 1, 2.0, { anim: 'idle', t: this.t, slot: 'v1', eyes: false });
      UI.drawFighterBig(ctx, o.p2.char, o.p2.pal, null, W + 100 - 300 * k, 420, -1, 2.0, { anim: 'idle', t: this.t, slot: 'v2' });
      const vs = Font.banner('VS', { scale: 10, top: '#ffffff', mid: '#ffd21a', bot: '#a01000' });
      if (vs && this.t > 20) {
        const s = this.t < 30 ? 1 + (30 - this.t) * 0.1 : 1;
        ctx.drawImage(vs, W / 2 - vs.width * s / 2, 140 - vs.height * s / 2, vs.width * s, vs.height * s);
      }
      if (o.stage) {
        const label = o.final ? 'FINAL BATTLE' : 'STAGE ' + o.stage;
        Font.draw(ctx, label, W / 2, 26, { color: o.final ? '#ff5040' : '#ffd23a', align: 'center', scale: 3, outline: '#000' });
        Font.draw(ctx, 'CPU ' + (o.level || '').toUpperCase(), W / 2, 56, { color: '#c0a8a0', align: 'center', outline: '#000' });
      }
      Font.draw(ctx, JJK.Chars[o.p1.char].full, 30, 320, { color: '#ffffff', scale: 2, outline: '#000' });
      Font.draw(ctx, JJK.Chars[o.p2.char].full, W - 30, 320, { color: '#ffffff', scale: 2, align: 'right', outline: '#000' });
      Font.draw(ctx, JJK.Chars[o.p1.char].title, 30, 340, { color: JJK.Chars[o.p1.char].color, outline: '#000' });
      Font.draw(ctx, JJK.Chars[o.p2.char].title, W - 30, 340, { color: JJK.Chars[o.p2.char].color, align: 'right', outline: '#000' });
    }
  }
  UI.VsScreen = VsScreen;

  // ------------------------------------------------------------ arcade ladder
  // Stage 1: the rival. Stage 2: mirror match (one tier harder). Stage 3: FINAL BATTLE vs Boss AI.
  const TIERS = ['easy', 'normal', 'hard', 'extreme', 'boss'];
  UI.arcadeStage = function (o, stage) {
    const me = o.p1.char;
    const rival = me === 'gojo' ? 'sukuna' : 'gojo';
    const base = o.baseLevel || o.level || 'normal';
    const bi = TIERS.indexOf(base);
    const st = Object.assign({}, o, { stage, baseLevel: base });
    if (stage === 1) { st.p2 = { char: rival, pal: 0 }; st.level = base; }
    else if (stage === 2) { st.p2 = { char: me, pal: 1 - (o.p1.pal || 0) }; st.level = TIERS[Math.min(3, bi + 1)]; }
    else { st.p2 = { char: rival, pal: 0 }; st.level = 'boss'; st.final = true; }
    return st;
  };

  class Continue {
    constructor(o, m) { this.o = o; this.t = 0; this.count = 10; this.char = o.p1.char; this.pal = o.p1.pal; }
    tick(g) {
      this.t++;
      const ev = UI.input.poll();
      if (this.t % 60 === 0) { this.count--; snd('timer_tick'); }
      if (this.t > 20 && (ev.ok || ev.start)) { snd('ui_start'); g.set(new VsScreen(this.o)); return; }
      if (this.t > 20 && ev.back) this.count = Math.min(this.count, 0);
      if (this.count < 0) { if (JJK.Music) JJK.Music.play('title'); g.set(new MainMenu()); }
      FX.update();
    }
    render(ctx) {
      UI.drawBackdrop(ctx, this.t + 5000, 0.82);
      UI.drawFighterBig(ctx, this.char, this.pal, 'lose', 200, 350, 1, 1.5, { slot: 'cont' });
      const b = Font.banner('CONTINUE?', { scale: 5, top: '#ffffff', mid: '#ff9080', mid2: '#e02010', bot: '#500000' });
      if (b) ctx.drawImage(b, Math.round(440 - b.width / 2), 70);
      const c = Font.banner(String(Math.max(0, this.count)), { scale: 10 });
      if (c) ctx.drawImage(c, Math.round(440 - c.width / 2), 140);
      Font.draw(ctx, 'PRESS START TO RETRY STAGE ' + this.o.stage, 440, 260, { color: '#ffd23a', align: 'center', outline: '#000' });
    }
  }
  UI.Continue = Continue;

  class Ending {
    constructor(o, m) { this.o = o; this.t = 0; this.char = o.p1.char; this.pal = o.p1.pal; if (JJK.Music) JJK.Music.play('victory'); }
    tick(g) {
      this.t++;
      const ev = UI.input.poll();
      if (this.t > 90 && (ev.ok || ev.back)) { snd('ui_select'); if (JJK.Music) JJK.Music.play('title'); g.set(new MainMenu()); }
      FX.update();
    }
    render(ctx) {
      UI.drawBackdrop(ctx, this.t + 6000, 0.55);
      const def = JJK.Chars[this.char];
      UI.drawFighterBig(ctx, this.char, this.pal, null, 180, 360, 1, 1.7, { anim: 'win', t: Math.min(this.t, 90), slot: 'end', eyes: this.char === 'gojo' });
      const k = Math.min(1, this.t / 40);
      ctx.globalAlpha = k;
      const b = Font.banner(this.char === 'gojo' ? 'THE STRONGEST' : 'KING OF CURSES', { scale: 4 });
      if (b) ctx.drawImage(b, Math.round(Math.min(440, W - 8 - b.width / 2) - b.width / 2), 56);
      const lines = this.char === 'gojo'
        ? ['THE KING OF CURSES HAS FALLEN.', 'BUT THE STRONGEST STANDS ALONE.', '', '"THROUGHOUT HEAVEN AND EARTH,', 'I ALONE AM THE HONORED ONE."']
        : ['THE STRONGEST SORCERER OF THE MODERN ERA', 'LIES CLEAVED IN TWO.', '', '"STAND PROUD, SATORU GOJO.', 'YOU WERE STRONG."'];
      lines.forEach((l, i) => Font.draw(ctx, l, 440, 120 + i * 13, { color: i >= 3 ? def.color : '#e8d8d0', align: 'center', outline: '#000' }));
      Font.draw(ctx, 'ARCADE CLEAR  •  CPU ' + (this.o.baseLevel || 'normal').toUpperCase(), 440, 210, { color: '#ffd23a', align: 'center', outline: '#000' });
      ctx.globalAlpha = 1;
      if (this.t > 90 && this.t % 60 < 40) Font.draw(ctx, 'PRESS START', 440, 300, { color: '#ffffff', align: 'center', scale: 2, outline: '#000' });
    }
  }
  UI.Ending = Ending;

  // ------------------------------------------------------------ battle scene
  class BattleScene {
    constructor(g, o) {
      this.g = g; this.o = o;
      const c1 = g.ctrls[0], c2 = g.ctrls[1];
      c1.virtual = null; c2.virtual = null;
      const cpu1 = o.mode === 'watch' ? (o.level || 'normal') : null;
      const cpu2 = o.mode === 'arcade' || o.mode === 'watch' ? (o.level || 'normal') : null;
      const p2ctrl = o.mode === 'versus' ? c2 : new JJK.Controller(null, -1);
      const p1ctrl = o.mode === 'watch' ? new JJK.Controller(null, -1) : c1;
      if (cpu2 || o.mode === 'training') p2ctrl.virtual = { dir: 5, held: 0 };
      if (cpu1) p1ctrl.virtual = { dir: 5, held: 0 };
      this.m = new JJK.Battle({
        mode: o.mode === 'watch' ? 'arcade' : o.mode,
        p1: { char: o.p1.char, pal: o.p1.pal, ctrl: p1ctrl, cpu: cpu1 },
        p2: { char: o.p2.char, pal: o.p2.pal, ctrl: p2ctrl, cpu: cpu2 },
      });
      if (o.mode === 'training') this.m.training.cpuLevel = o.level || 'normal';
      this.pause = null;
    }
    tick(g) {
      const m = this.m;
      // pause toggle
      const startPressed = JJK.keyPressed('Escape') || JJK.keyPressed('Enter') || JJK.keyPressed('NumpadEnter') || this.padStart();
      if (this.pause) {
        this.pause.tick(g, this);
        return;
      }
      if (startPressed && m.phase !== 'over') {
        this.pause = new PauseMenu(this);
        m.paused = true;
        if (JJK.Music) JJK.Music.pause();
        snd('ui_select');
        return;
      }
      m.tick();
      if (m.phase === 'over' && m.pt > 60) {
        m.destroy();
        const o = this.o;
        if (o.mode === 'arcade' && o.stage) {
          const won = m.result && m.result.winner === m.fighters[0];
          if (!won) g.set(new Continue(o, m));
          else if (o.stage >= 3) g.set(new Ending(o, m));
          else g.set(new VsScreen(UI.arcadeStage(o, o.stage + 1)));
        } else g.set(new Results(this.o, m.result, m));
      }
    }
    padStart() {
      const pads = typeof navigator !== 'undefined' && navigator.getGamepads ? navigator.getGamepads() : [];
      let s = false;
      for (let i = 0; i < pads.length; i++) {
        const p = JJK.padState(i);
        if (p && p.START) s = true;
      }
      const fire = s && !this._ps;
      this._ps = s;
      return fire;
    }
    render(ctx) {
      this.m.render(ctx);
      if (this.pause) this.pause.render(ctx);
    }
  }
  UI.BattleScene = BattleScene;

  class PauseMenu {
    constructor(bs) {
      this.bs = bs; this.sel = 0; this.sub = null;
      UI.input.poll();
      const m = bs.m;
      this.items = [
        { label: 'RESUME', go: () => this.close() },
        { label: 'MOVE LIST', go: () => { this.sub = new MoveList(null, m.fighters[0].def.id); } },
        { label: 'CONTROLS', go: () => { this.sub = new Controls(null); } },
      ];
      if (m.training) {
        const t = m.training;
        const T = JJK.Training;
        this.items.push(
          { label: () => 'DUMMY: ' + T.DUMMY[t.dummy], left: () => { t.dummy = (t.dummy + T.DUMMY.length - 1) % T.DUMMY.length; T.applyDummy(m); }, right: () => { t.dummy = (t.dummy + 1) % T.DUMMY.length; T.applyDummy(m); } },
          { label: () => 'BLOCK: ' + T.BLOCK[t.block], left: () => (t.block = (t.block + 3) % 4), right: () => (t.block = (t.block + 1) % 4) },
          { label: () => 'CPU LEVEL: ' + t.cpuLevel.toUpperCase(), left: () => this.cycleLevel(-1), right: () => this.cycleLevel(1) },
          { label: () => 'INFINITE HEALTH: ' + (t.infHp ? 'ON' : 'OFF'), go: () => (t.infHp = !t.infHp), left: () => (t.infHp = !t.infHp), right: () => (t.infHp = !t.infHp) },
          { label: () => 'INFINITE METER: ' + (t.infMeter ? 'ON' : 'OFF'), go: () => (t.infMeter = !t.infMeter), left: () => (t.infMeter = !t.infMeter), right: () => (t.infMeter = !t.infMeter) },
          { label: () => 'HITBOXES: ' + (t.hitboxes ? 'ON' : 'OFF'), go: () => (t.hitboxes = !t.hitboxes), left: () => (t.hitboxes = !t.hitboxes), right: () => (t.hitboxes = !t.hitboxes) },
          { label: () => 'FRAME DATA: ' + (t.frameData ? 'ON' : 'OFF'), go: () => (t.frameData = !t.frameData), left: () => (t.frameData = !t.frameData), right: () => (t.frameData = !t.frameData) },
          { label: () => 'FRAME METER: ' + (t.frameMeter ? 'ON' : 'OFF'), go: () => (t.frameMeter = !t.frameMeter), left: () => (t.frameMeter = !t.frameMeter), right: () => (t.frameMeter = !t.frameMeter) },
          { label: 'RESET POSITIONS', go: () => { T.reset(m, 'center'); this.close(); } },
        );
      }
      this.items.push(
        { label: 'RESTART MATCH', go: () => { bs.m.destroy(); bs.g.startBattle(bs.o); } },
        { label: 'CHARACTER SELECT', go: () => { bs.m.destroy(); bs.g.set(new Select({ mode: bs.o.mode, level: bs.o.level })); } },
        { label: 'QUIT TO MENU', go: () => { bs.m.destroy(); bs.g.set(new MainMenu()); } },
      );
    }
    cycleLevel(d) {
      const L = ['easy', 'normal', 'hard', 'extreme', 'boss'];
      const t = this.bs.m.training;
      t.cpuLevel = L[(L.indexOf(t.cpuLevel) + d + L.length) % L.length];
      JJK.Training.applyDummy(this.bs.m);
    }
    close() {
      this.bs.pause = null;
      this.bs.m.paused = false;
      if (JJK.Music) JJK.Music.resume();
      snd('ui_back');
    }
    tick(g, bs) {
      const ev = UI.input.poll();
      if (this.sub) {
        if (this.sub.tickSub(ev)) this.sub = null;
        return;
      }
      if (JJK.keyPressed('Escape')) { this.close(); return; }
      if (ev.up) { this.sel = (this.sel + this.items.length - 1) % this.items.length; snd('ui_move'); }
      if (ev.down) { this.sel = (this.sel + 1) % this.items.length; snd('ui_move'); }
      const it = this.items[this.sel];
      if (ev.left && it.left) { it.left(); snd('ui_move'); }
      if (ev.right && it.right) { it.right(); snd('ui_move'); }
      if (ev.ok && it.go) { snd('ui_select'); it.go(); }
      if (ev.back && !JJK.keyPressed('Escape')) this.close();
    }
    render(ctx) {
      ctx.fillStyle = 'rgba(0,0,0,0.72)';
      ctx.fillRect(0, 0, W, H);
      if (this.sub) { ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H); this.sub.render(ctx, true); return; }
      Font.draw(ctx, 'PAUSED', W / 2, 30, { color: '#ffd23a', align: 'center', scale: 3, outline: '#000' });
      const lh = this.items.length > 9 ? 19 : 22;
      list(ctx, this.items, this.sel, W / 2, 70, { w: 320, lh, scale: this.items.length > 9 ? 1 : 2 });
    }
  }

  // ------------------------------------------------------------ move list
  class MoveList {
    constructor(back, charId) { this.back = back; this.ci = charId === 'sukuna' ? 1 : 0; this.scroll = 0; this.t = 0; }
    tickSub(ev) {
      if (ev.left || ev.right) { this.ci = 1 - this.ci; this.scroll = 0; snd('ui_move'); }
      if (ev.down) this.scroll = Math.min(this.scroll + 1, 10);
      if (ev.up) this.scroll = Math.max(0, this.scroll - 1);
      return ev.back || ev.ok;
    }
    tick(g) {
      this.t++;
      const ev = UI.input.poll();
      if (this.tickSub(ev)) { snd('ui_back'); g.set(this.back || new MainMenu()); }
      FX.update();
    }
    render(ctx, overlay) {
      if (!overlay) UI.drawBackdrop(ctx, this.t + 2000, 0.8);
      const id = this.ci === 0 ? 'gojo' : 'sukuna';
      const def = JJK.Chars[id];
      Font.draw(ctx, '← ' + def.full + ' →', W / 2, 10, { color: def.color, align: 'center', scale: 2, outline: '#000' });
      const rows = def.moveList.slice(this.scroll);
      let y = 34;
      for (const r of rows) {
        if (y > 330) break;
        if (!r[1]) {
          Font.draw(ctx, r[0], 20, y, { color: '#ffd23a', outline: '#000' });
          ctx.fillStyle = '#ffd23a'; ctx.fillRect(20, y + 9, 600, 1);
          y += 14;
        } else {
          Font.draw(ctx, r[0], 24, y, { color: '#ffffff', outline: '#000' });
          Font.draw(ctx, r[1], 180, y, { color: '#d0c0c0', outline: '#000' });
          y += 11;
        }
      }
      Font.draw(ctx, 'NUMPAD NOTATION: ↓↘→ = QUARTER CIRCLE FORWARD   SP = SPECIAL   SU = SUPER', W / 2, 340, { color: '#a08070', align: 'center' });
      Font.draw(ctx, '←/→ CHARACTER   ↑/↓ SCROLL   K/ESC BACK', W / 2, 350, { color: '#a08070', align: 'center' });
    }
  }
  UI.MoveList = MoveList;

  class Controls {
    constructor(back) { this.back = back; this.t = 0; }
    tickSub(ev) { return ev.back || ev.ok; }
    tick(g) {
      this.t++;
      const ev = UI.input.poll();
      if (this.tickSub(ev)) { snd('ui_back'); g.set(this.back || new MainMenu()); }
      FX.update();
    }
    render(ctx, overlay) {
      if (!overlay) UI.drawBackdrop(ctx, this.t + 2500, 0.8);
      Font.draw(ctx, 'CONTROLS', W / 2, 12, { color: '#ffd23a', align: 'center', scale: 3, outline: '#000' });
      const rows = [
        ['', 'PLAYER 1 (KEYBOARD)', 'PLAYER 2 (KEYBOARD)', 'GAMEPAD'],
        ['MOVE', 'W A S D', 'ARROW KEYS', 'D-PAD / STICK'],
        ['LIGHT (L)', 'J', 'NUM1 or ,', 'X'],
        ['MEDIUM (M)', 'K', 'NUM2 or .', 'Y'],
        ['HEAVY (H)', 'L', 'NUM3 or /', 'RB'],
        ['SPECIAL (SP)', 'U', 'NUM4 or ;', 'A'],
        ['SUPER (SU)', 'I', "NUM5 or '", 'B'],
        ['UNIQUE (UN)', 'O', 'NUM6 or [', 'RT'],
        ['THROW (L+M)', 'H', 'NUM0', 'LB'],
        ['PARRY (M+H)', 'Y', 'NUM .', 'LT'],
        ['DASH', 'SPACE / →→', 'R-SHIFT / →→', 'L3 / →→'],
        ['PAUSE', 'ESC / ENTER', 'NUM ENTER', 'START'],
        ['FULLSCREEN', 'F4', 'F4', ''],
      ];
      let y = 46;
      for (const r of rows) {
        const head = r[0] === '';
        Font.draw(ctx, r[0], 20, y, { color: '#ffd23a', outline: '#000' });
        Font.draw(ctx, r[1], 150, y, { color: head ? '#ffd23a' : '#ffffff', outline: '#000' });
        Font.draw(ctx, r[2], 300, y, { color: head ? '#ffd23a' : '#ffffff', outline: '#000' });
        Font.draw(ctx, r[3], 470, y, { color: head ? '#ffd23a' : '#ffffff', outline: '#000' });
        y += 14;
      }
      const tips = [
        'BLOCK: HOLD BACK (←). CROUCH-BLOCK LOWS (↙), STAND-BLOCK OVERHEADS.',
        'PERFECT GUARD: START BLOCKING JUST BEFORE THE HIT. PARRY: M+H (RISKY).',
        'QUICK RECOVERY: PRESS A BUTTON AS YOU HIT THE GROUND. THROW ESCAPE: L+M.',
        'CANCEL: L > M > H > SPECIAL > SUPER. LAUNCHERS (2H) CAN BE JUMP-CANCELLED.',
        'DOMAIN: SP+SU WITH 200 CE AND A FULL DOMAIN GAUGE. EXPAND TOGETHER TO CLASH.',
      ];
      y += 8;
      for (const t of tips) { Font.draw(ctx, t, W / 2, y, { color: '#e0c0b0', align: 'center', outline: '#000' }); y += 12; }
    }
  }
  UI.Controls = Controls;

  class Options {
    constructor(back) {
      this.back = back; this.sel = 0; this.t = 0;
      const S = JJK.settings;
      const pct = (v) => Math.round(v * 100) + '%';
      const step = (k, d, lo, hi) => () => { S[k] = U.clamp(Math.round((S[k] + d) * 100) / 100, lo, hi); this.apply(); };
      this.items = [
        { label: () => 'MUSIC VOLUME  ' + pct(S.musicVol), left: step('musicVol', -0.1, 0, 1), right: step('musicVol', 0.1, 0, 1) },
        { label: () => 'SFX VOLUME  ' + pct(S.sfxVol), left: step('sfxVol', -0.1, 0, 1), right: step('sfxVol', 0.1, 0, 1) },
        { label: () => 'VOICE LINES  ' + (S.voice ? 'ON' : 'OFF'), left: () => (S.voice = !S.voice), right: () => (S.voice = !S.voice), go: () => (S.voice = !S.voice) },
        { label: () => 'VOICE LANGUAGE  ' + (S.voiceLang === 'ja' ? 'JAPANESE' : 'ENGLISH'), left: () => (S.voiceLang = S.voiceLang === 'ja' ? 'en' : 'ja'), right: () => (S.voiceLang = S.voiceLang === 'ja' ? 'en' : 'ja') },
        { label: () => 'SCREEN SHAKE  ' + pct(S.shake), left: step('shake', -0.25, 0, 1.5), right: step('shake', 0.25, 0, 1.5) },
        { label: () => 'FLASH EFFECTS  ' + (S.flashes ? 'FULL' : 'REDUCED'), left: () => (S.flashes = !S.flashes), right: () => (S.flashes = !S.flashes) },
        { label: () => 'CRT FILTER  ' + (S.crt ? 'ON' : 'OFF'), left: () => { S.crt = !S.crt; this.apply(); }, right: () => { S.crt = !S.crt; this.apply(); } },
        { label: () => 'ROUND TIME  ' + S.roundTime + 'S', left: () => (S.roundTime = S.roundTime === 99 ? 90 : S.roundTime === 90 ? 60 : 99), right: () => (S.roundTime = S.roundTime === 60 ? 90 : S.roundTime === 90 ? 99 : 60) },
        { label: () => 'ROUNDS TO WIN  ' + S.rounds, left: () => (S.rounds = Math.max(1, S.rounds - 1)), right: () => (S.rounds = Math.min(3, S.rounds + 1)) },
        { label: () => 'P1 GAMEPAD  ' + (S.p1Pad < 0 ? 'NONE' : '#' + (S.p1Pad + 1)), left: () => { S.p1Pad = U.clamp(S.p1Pad - 1, -1, 3); this.apply(); }, right: () => { S.p1Pad = U.clamp(S.p1Pad + 1, -1, 3); this.apply(); } },
        { label: () => 'P2 GAMEPAD  ' + (S.p2Pad < 0 ? 'NONE' : '#' + (S.p2Pad + 1)), left: () => { S.p2Pad = U.clamp(S.p2Pad - 1, -1, 3); this.apply(); }, right: () => { S.p2Pad = U.clamp(S.p2Pad + 1, -1, 3); this.apply(); } },
        { label: 'BACK', go: () => this.leave() },
      ];
    }
    apply() {
      const S = JJK.settings;
      if (JJK.Audio) JJK.Audio.setVolumes(S.musicVol, S.sfxVol);
      if (JJK.game) { JJK.game.ctrls[0].pad = S.p1Pad; JJK.game.ctrls[1].pad = S.p2Pad; JJK.game.applyCrt(); }
      JJK.saveSettings();
    }
    leave() { this.apply(); this.g.set(this.back || new MainMenu()); }
    tick(g) {
      this.g = g;
      this.t++;
      const ev = UI.input.poll();
      if (ev.up) { this.sel = (this.sel + this.items.length - 1) % this.items.length; snd('ui_move'); }
      if (ev.down) { this.sel = (this.sel + 1) % this.items.length; snd('ui_move'); }
      const it = this.items[this.sel];
      if (ev.left && it.left) { it.left(); snd('ui_move'); this.apply(); }
      if (ev.right && it.right) { it.right(); snd('ui_move'); this.apply(); }
      if (ev.ok && it.go) { snd('ui_select'); it.go(); this.apply(); }
      if (ev.back) { snd('ui_back'); this.leave(); }
      FX.update();
    }
    render(ctx) {
      UI.drawBackdrop(ctx, this.t + 3000, 0.75);
      Font.draw(ctx, 'OPTIONS', W / 2, 14, { color: '#ffd23a', align: 'center', scale: 3, outline: '#000' });
      list(ctx, this.items, this.sel, W / 2, 52, { w: 380, lh: 23 });
    }
  }
  UI.Options = Options;

  class Results {
    constructor(o, result, m) {
      this.o = o; this.r = result; this.t = 0; this.sel = 0;
      this.winner = result && result.winner;
      this.stats = result ? result.stats : null;
      this.items = [
        { label: 'REMATCH', go: (g) => g.startBattle(this.o) },
        { label: 'CHARACTER SELECT', go: (g) => g.set(new Select({ mode: this.o.mode, level: this.o.level })) },
        { label: 'MAIN MENU', go: (g) => g.set(new MainMenu()) },
      ];
    }
    tick(g) {
      this.t++;
      const ev = UI.input.poll();
      if (this.t < 30) return;
      if (ev.up) { this.sel = (this.sel + 2) % 3; snd('ui_move'); }
      if (ev.down) { this.sel = (this.sel + 1) % 3; snd('ui_move'); }
      if (ev.ok) { snd('ui_select'); this.items[this.sel].go(g); }
      FX.update();
    }
    render(ctx) {
      UI.drawBackdrop(ctx, this.t + 4000, 0.7);
      const w = this.winner;
      if (w) {
        UI.drawFighterBig(ctx, w.def.id, w.pal, null, 180, 340, 1, 1.6, { anim: 'win', t: Math.min(this.t, 90), slot: 'res', eyes: w.def.id === 'gojo' });
        const b = Font.banner(w.def.name + ' WINS', { scale: 6 });
        if (b) ctx.drawImage(b, Math.round(440 - b.width / 2), 40);
        const quote = w.def.id === 'gojo' ? '"THROUGHOUT HEAVEN AND EARTH,|I ALONE AM THE HONORED ONE."' : '"STAND PROUD.|YOU WERE STRONG."';
        quote.split('|').forEach((q, i) => Font.draw(ctx, q, 440, 110 + i * 12, { color: w.def.color, align: 'center', outline: '#000' }));
      } else {
        const b = Font.banner('DRAW', { scale: 6 });
        if (b) ctx.drawImage(b, Math.round(W / 2 - b.width / 2), 40);
      }
      if (this.stats) {
        const s = this.stats;
        Font.draw(ctx, 'P1 HITS ' + s.hits[0] + '  DMG ' + s.dmg[0] + '  MAX COMBO ' + s.maxCombo[0], 440, 150, { color: '#a0d0ff', align: 'center', outline: '#000' });
        Font.draw(ctx, 'P2 HITS ' + s.hits[1] + '  DMG ' + s.dmg[1] + '  MAX COMBO ' + s.maxCombo[1], 440, 162, { color: '#ffb0a0', align: 'center', outline: '#000' });
      }
      list(ctx, this.items, this.sel, 440, 210, { w: 260 });
    }
  }
  UI.Results = Results;
})();

</script>
<script>/* src/main.js */
// Boot, fixed-timestep loop, canvas scaling and scene management.
(function () {
  'use strict';
  const JJK = window.JJK;
  const W = JJK.W, H = JJK.H;
  JJK.loadSettings();
  const S = JJK.settings;

  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d', { alpha: false });
  ctx.imageSmoothingEnabled = false;
  const crt = document.getElementById('crt');

  function resize() {
    const s = Math.min(window.innerWidth / W, window.innerHeight / H);
    // prefer integer scaling when it fills most of the window
    const si = Math.floor(s);
    const scale = si >= 1 && si / s > 0.9 ? si : s;
    canvas.style.width = Math.round(W * scale) + 'px';
    canvas.style.height = Math.round(H * scale) + 'px';
    if (crt) { crt.style.width = canvas.style.width; crt.style.height = canvas.style.height; }
  }
  window.addEventListener('resize', resize);
  resize();

  const game = (JJK.game = {
    ctrls: [new JJK.Controller(JJK.KB_LAYOUTS[0], S.p1Pad), new JJK.Controller(JJK.KB_LAYOUTS[1], S.p2Pad)],
    scene: null,
    showFps: false,
    set(s) {
      this.scene = s;
      JJK.FX.clear();
      // sync menu edge detection so held keys don't leak into the next scene
      if (JJK.UI) JJK.UI.input.poll();
    },
    startBattle(o) {
      this.set(new JJK.UI.BattleScene(this, o));
    },
    applyCrt() {
      if (crt) crt.style.display = S.crt ? 'block' : 'none';
    },
  });
  game.applyCrt();
  // build the shared arena art up front so the first battle doesn't stall
  if (JJK.Stage && JJK.Stage.preload) { try { JJK.Stage.preload(); } catch (e) { console.warn(e); } }
  if (JJK.Audio && JJK.Audio.setVolumes) JJK.Audio.setVolumes(S.musicVol, S.sfxVol);

  // URL shortcuts for quick testing: ?play=versus|arcade|training|watch&p1=gojo&p2=sukuna&level=hard
  const q = new URLSearchParams(location.search);
  if (q.get('play')) {
    const mode = q.get('play');
    game.startBattle({
      mode, level: q.get('level') || 'normal',
      p1: { char: q.get('p1') || 'gojo', pal: +(q.get('pal1') || 0) },
      p2: { char: q.get('p2') || 'sukuna', pal: +(q.get('pal2') || 0) },
    });
  } else game.set(new JJK.UI.Title());

  // fixed 60 Hz simulation, render every animation frame
  const STEP = 1000 / 60;
  let last = performance.now(), acc = 0;
  let fps = 60, fpsAcc = 0, fpsN = 0;
  function frame(now) {
    let dt = now - last;
    last = now;
    if (dt > 250) dt = 250;
    acc += dt;
    fpsAcc += dt; fpsN++;
    if (fpsAcc > 500) { fps = Math.round(fpsN * 1000 / fpsAcc); fpsAcc = 0; fpsN = 0; }
    let steps = 0;
    while (acc >= STEP && steps < 4) {
      if (JJK.keyPressed('F3')) game.showFps = !game.showFps;
      if (JJK.keyPressed('F4')) {
        try {
          if (document.fullscreenElement) document.exitFullscreen();
          else document.documentElement.requestFullscreen();
        } catch (e) {}
      }
      game.scene.tick(game);
      JJK.endInputFrame();
      acc -= STEP;
      steps++;
    }
    if (steps >= 4) acc = 0;
    ctx.imageSmoothingEnabled = false;
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    game.scene.render(ctx);
    if (game.showFps) JJK.Font.draw(ctx, fps + ' FPS', W - 4, H - 10, { color: '#80ff80', align: 'right', outline: '#000' });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  JJK.ctx = ctx;
})();

</script>
