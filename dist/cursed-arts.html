<script>/* src/engine/util.js */
// Core namespace, constants and math helpers.
(function () {
  'use strict';
  const root = typeof window !== 'undefined' ? window : globalThis;
  const JJK = (root.JJK = root.JJK || {});

  JJK.W = 640; // internal render width
  JJK.H = 360; // internal render height
  JJK.FPS = 60;
  JJK.GROUND_Y = 322; // screen y of the ground at default camera
  JJK.STAGE_HALF = 600; // half stage width (world units)
  JJK.WALL = 584; // fighter x limit
  JJK.DEBUG = false;

  const U = (JJK.U = {});
  U.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  U.lerp = (a, b, t) => a + (b - a) * t;
  U.invLerp = (a, b, v) => (b === a ? 0 : (v - a) / (b - a));
  U.sign = (v) => (v < 0 ? -1 : v > 0 ? 1 : 0);
  U.deg = Math.PI / 180;
  U.rad = (d) => d * U.deg;
  U.dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
  U.approach = (v, target, step) => (v < target ? Math.min(target, v + step) : Math.max(target, v - step));
  U.wrap = (v, n) => ((v % n) + n) % n;
  U.smooth = (t) => t * t * (3 - 2 * t);
  U.pick = (arr, r = Math.random()) => arr[Math.floor(r * arr.length) % arr.length];
  U.rand = (a, b) => a + Math.random() * (b - a);
  U.randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
  U.chance = (p) => Math.random() < p;

  U.ease = {
    linear: (t) => t,
    in: (t) => t * t,
    out: (t) => 1 - (1 - t) * (1 - t),
    inOut: (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2),
    in3: (t) => t * t * t,
    out3: (t) => 1 - Math.pow(1 - t, 3),
    out4: (t) => 1 - Math.pow(1 - t, 4),
    snap: (t) => 1 - Math.pow(1 - t, 6),
    outBack: (t) => {
      const c1 = 1.9, c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    },
    outElastic: (t) =>
      t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * ((2 * Math.PI) / 3)) + 1,
    hold: (t) => (t < 1 ? 0 : 1),
    step: (t) => (t < 0.5 ? 0 : 1),
  };

  // Seeded RNG for gameplay logic (deterministic simulation / replays).
  U.makeRng = function (seed) {
    let s = seed >>> 0 || 1;
    const f = function () {
      s |= 0;
      s = (s + 0x6d2b79f5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    f.seed = (v) => (s = v >>> 0 || 1);
    return f;
  };
  JJK.rng = U.makeRng(1234567);

  // Colors -------------------------------------------------------------
  U.hex = function (h) {
    if (Array.isArray(h)) return h;
    h = h.replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    const n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  };
  U.pack = (r, g, b, a = 255) =>
    ((a << 24) | (U.clamp(b | 0, 0, 255) << 16) | (U.clamp(g | 0, 0, 255) << 8) | U.clamp(r | 0, 0, 255)) >>> 0;
  U.unpack = (c) => [c & 255, (c >>> 8) & 255, (c >>> 16) & 255, c >>> 24];
  U.mix = (a, b, t) => [U.lerp(a[0], b[0], t), U.lerp(a[1], b[1], t), U.lerp(a[2], b[2], t)];
  U.mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
  U.css = (c, a = 1) =>
    a >= 1 ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

  // Build a 4-tone material from a base color.
  // tones: [deep, shadow, base, light]
  U.mat = function (base, opts = {}) {
    const b = U.hex(base);
    const hueShadow = opts.shadowTint ? U.hex(opts.shadowTint) : [40, 20, 70];
    const hueLight = opts.lightTint ? U.hex(opts.lightTint) : [255, 236, 210];
    const deep = opts.deep ? U.hex(opts.deep) : U.mix(U.mul(b, 0.42), hueShadow, 0.28);
    const shadow = opts.shadow ? U.hex(opts.shadow) : U.mix(U.mul(b, 0.7), hueShadow, 0.16);
    const light = opts.light ? U.hex(opts.light) : U.mix(b, hueLight, opts.shine != null ? opts.shine : 0.35);
    return {
      tones: [deep, shadow, b, light],
      gloss: opts.gloss || 0, // specular highlight strength
      emissive: opts.emissive || 0,
      name: opts.name || '',
    };
  };

  U.angleLerp = function (a, b, t) {
    let d = ((b - a + 540) % 360) - 180;
    return a + d * t;
  };

  U.rot = function (x, y, ang) {
    const c = Math.cos(ang), s = Math.sin(ang);
    return [x * c - y * s, x * s + y * c];
  };

  // Simple object pool
  U.Pool = class {
    constructor(make) {
      this.make = make;
      this.free = [];
    }
    get() {
      return this.free.pop() || this.make();
    }
    put(o) {
      this.free.push(o);
    }
  };

  // Format mm:ss
  U.mmss = function (sec) {
    sec = Math.max(0, Math.ceil(sec));
    const m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  };

  U.now = () => (typeof performance !== 'undefined' ? performance.now() : Date.now());

  // Settings persisted in localStorage (wrapped; works without storage).
  JJK.settings = {
    musicVol: 0.55,
    sfxVol: 0.8,
    voice: true,
    voiceLang: 'en',
    shake: 1.0,
    crt: true,
    flashes: true,
    roundTime: 90,
    rounds: 2, // wins needed
    p1Pad: 0,
    p2Pad: 1,
    frameMeter: true,
  };
  JJK.loadSettings = function () {
    try {
      const raw = root.localStorage && root.localStorage.getItem('cursedArts.settings');
      if (raw) Object.assign(JJK.settings, JSON.parse(raw));
    } catch (e) {}
  };
  JJK.saveSettings = function () {
    try {
      root.localStorage && root.localStorage.setItem('cursedArts.settings', JSON.stringify(JJK.settings));
    } catch (e) {}
  };
})();

</script>
<script>/* src/engine/raster.js */
// Software pixel rasterizer used for characters.
// Renders shaded primitives (tapered limbs, ellipses, polygons) into a 32-bit
// pixel buffer with no anti-aliasing, then applies selective outlining
// ("sel-out"), interior depth lines, rim light and dynamic point lights.
// Because everything is rasterized at screen resolution, characters stay
// crisp pixel art at every camera zoom level.
(function () {
  'use strict';
  const JJK = (typeof window !== 'undefined' ? window : globalThis).JJK;
  const U = JJK.U;

  const PROF_SAMPLES = 24;

  class Raster {
    constructor(w, h) {
      this.w = w;
      this.h = h;
      if (typeof ImageData !== 'undefined') this.img = new ImageData(w, h);
      else this.img = { data: new Uint8ClampedArray(w * h * 4), width: w, height: h };
      this.px = new Uint32Array(this.img.data.buffer);
      this.grp = new Uint8Array(w * h);
      this.tmpIdx = new Int32Array(w * h);
      this.tmpCol = new Uint32Array(w * h);
      this.canvas = null;
      this.ctx = null;
      if (typeof document !== 'undefined') {
        this.canvas = document.createElement('canvas');
        this.canvas.width = w;
        this.canvas.height = h;
        this.ctx = this.canvas.getContext('2d');
      }
      // dirty rect of the current frame and the previous frame
      this.x0 = w; this.y0 = h; this.x1 = -1; this.y1 = -1;
      this.px0 = 0; this.py0 = 0; this.px1 = -1; this.py1 = -1;
      // lighting
      const L = [-0.42, -0.62, 0.66];
      const ll = Math.hypot(L[0], L[1], L[2]);
      this.L = [L[0] / ll, L[1] / ll, L[2] / ll];
      this.rim = { x: 0.8, y: -0.25, c: [255, 120, 60], k: 0.55 };
      this.ambient = [1, 1, 1];
      this.ambKey = 1001001000;
      this.lights = [];
      this.override = 0;
      this.flash = 0;
      this.tint = null; // [r,g,b,k]
      this.ditherAmt = 0.06;
      this.thr = [-0.18, 0.22, 0.74];
      this.profW = new Float32Array(PROF_SAMPLES + 1);
      this.profF = new Float32Array(PROF_SAMPLES + 1);
    }

    begin() {
      // clear previous dirty rect
      const w = this.w;
      if (this.px1 >= this.px0) {
        for (let y = this.py0; y <= this.py1; y++) {
          const o = y * w;
          this.px.fill(0, o + this.px0, o + this.px1 + 1);
          this.grp.fill(0, o + this.px0, o + this.px1 + 1);
        }
      }
      this.x0 = this.w; this.y0 = this.h; this.x1 = -1; this.y1 = -1;
      this.override = 0;
      this.flash = 0;
      this.tint = null;
      this.lights.length = 0;
      this.ambKey = -1;
    }

    // Must be called after changing `ambient` (done lazily by shade via ambKey).
    setAmbient(a) {
      this.ambient = a;
      this.ambKey = Math.round(a[0] * 1000) * 1e6 + Math.round(a[1] * 1000) * 1e3 + Math.round(a[2] * 1000);
    }

    _grow(x0, y0, x1, y1) {
      if (x0 < this.x0) this.x0 = x0;
      if (y0 < this.y0) this.y0 = y0;
      if (x1 > this.x1) this.x1 = x1;
      if (y1 > this.y1) this.y1 = y1;
    }

    // Compute final packed color for a material and a surface normal.
    shade(mat, nx, ny, nz, x, y) {
      if (this.override) return this.override;
      const L = this.L;
      const lum = nx * L[0] + ny * L[1] + nz * L[2];
      const t = this.thr;
      // ordered dither across band edges
      const dz = this.ditherAmt;
      const chk = (x + y) & 1 ? dz : -dz;
      let band;
      if (lum < t[0]) band = lum > t[0] - dz && chk > 0 ? 1 : 0;
      else if (lum < t[1]) band = lum > t[1] - dz && chk > 0 ? 2 : lum < t[0] + dz && chk < 0 ? 0 : 1;
      else if (lum < t[2]) band = lum > t[2] - dz && chk > 0 ? 3 : lum < t[1] + dz && chk < 0 ? 1 : 2;
      else band = lum < t[2] + dz && chk < 0 ? 2 : 3;
      // fast path: no rim, no light in range, no tint/flash -> cached packed tone
      const rim = this.rim;
      const rd = nx * rim.x + ny * rim.y;
      const rimHit = !mat.emissive && rim.k > 0 && rd > 0.66 && nz < 0.5;
      let lightHit = false;
      if (!mat.emissive) {
        const lights = this.lights;
        for (let i = 0; i < lights.length; i++) {
          const li = lights[i];
          const dx = li.x - x, dy = li.y - y;
          if (dx * dx + dy * dy < li.r2) { lightHit = true; break; }
        }
      }
      if (!rimHit && !lightHit && !this.tint && this.flash <= 0) {
        if (mat._ak !== this.ambKey) this.cacheMat(mat);
        return mat._pk[band];
      }
      const c = mat.tones[band];
      let r = c[0], g = c[1], b = c[2];
      if (!mat.emissive) {
        if (rimHit) {
          const k = rim.k * (rd > 0.84 && nz < 0.35 ? 0.62 : 0.3);
          r += (rim.c[0] - r) * k;
          g += (rim.c[1] - g) * k;
          b += (rim.c[2] - b) * k;
        }
        if (lightHit) {
          // dynamic point lights (posterized)
          const lights = this.lights;
          for (let i = 0; i < lights.length; i++) {
            const li = lights[i];
            const dx = li.x - x, dy = li.y - y;
            const d2 = dx * dx + dy * dy;
            if (d2 >= li.r2) continue;
            const d = Math.sqrt(d2) + 0.001;
            const ndl = (nx * dx + ny * dy) / d * 0.85 + nz * 0.35;
            if (ndl <= 0) continue;
            let k = ndl * (1 - d / li.r) * li.i;
            k = Math.round(k * 4) / 4;
            if (k <= 0) continue;
            r += li.c[0] * k;
            g += li.c[1] * k;
            b += li.c[2] * k;
          }
        }
        const a = this.ambient;
        r *= a[0]; g *= a[1]; b *= a[2];
      }
      if (this.tint) {
        const tn = this.tint;
        r += (tn[0] - r) * tn[3];
        g += (tn[1] - g) * tn[3];
        b += (tn[2] - b) * tn[3];
      }
      if (this.flash > 0) {
        const f = this.flash;
        r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f;
      }
      r = r > 255 ? 255 : r < 0 ? 0 : r | 0;
      g = g > 255 ? 255 : g < 0 ? 0 : g | 0;
      b = b > 255 ? 255 : b < 0 ? 0 : b | 0;
      return ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0;
    }

    // Pre-pack a material's tones under the current ambient light.
    cacheMat(mat) {
      const a = mat.emissive ? [1, 1, 1] : this.ambient;
      mat._pk = mat.tones.map((c) => U.pack(c[0] * a[0], c[1] * a[1], c[2] * a[2], 255));
      mat._ak = this.ambKey;
    }

    // Tapered limb: axis from (ax,ay) to (bx,by). prof: [[t, wBack, wFront], ...]
    // side: +1/-1 selects which perpendicular is "front".
    limb(ax, ay, bx, by, prof, mat, g, side = 1, capA = true, capB = true) {
      const dx = bx - ax, dy = by - ay;
      const len = Math.hypot(dx, dy) || 0.0001;
      const ux = dx / len, uy = dy / len;
      const pX = uy * side, pY = -ux * side;
      // precompute profile
      const N = PROF_SAMPLES;
      const PW = this.profW, PF = this.profF;
      let maxW = 0;
      let k = 0;
      for (let i = 0; i <= N; i++) {
        const t = i / N;
        while (k < prof.length - 2 && prof[k + 1][0] < t) k++;
        const p0 = prof[k], p1 = prof[Math.min(k + 1, prof.length - 1)];
        const tt = p1[0] === p0[0] ? 0 : U.clamp((t - p0[0]) / (p1[0] - p0[0]), 0, 1);
        PW[i] = p0[1] + (p1[1] - p0[1]) * tt;
        PF[i] = p0[2] + (p1[2] - p0[2]) * tt;
        if (PW[i] > maxW) maxW = PW[i];
        if (PF[i] > maxW) maxW = PF[i];
      }
      const rA = (PW[0] + PF[0]) * 0.5, rB = (PW[N] + PF[N]) * 0.5;
      let x0 = Math.floor(Math.min(ax, bx) - maxW - 1), x1 = Math.ceil(Math.max(ax, bx) + maxW + 1);
      let y0 = Math.floor(Math.min(ay, by) - maxW - 1), y1 = Math.ceil(Math.max(ay, by) + maxW + 1);
      if (x0 < 0) x0 = 0;
      if (y0 < 0) y0 = 0;
      if (x1 >= this.w) x1 = this.w - 1;
      if (y1 >= this.h) y1 = this.h - 1;
      if (x1 < x0 || y1 < y0) return;
      const w = this.w, px = this.px, grp = this.grp;
      let any = false;
      const maxR = Math.max(maxW, rA, rB);
      for (let y = y0; y <= y1; y++) {
        const ry = y + 0.5 - ay;
        // tight x-interval for this row: |perp| <= maxR and -rA <= along <= len + rB
        let xa = x0, xb = x1;
        if (Math.abs(pX) > 1e-4) {
          const c0 = (-maxR - ry * pY) / pX, c1 = (maxR - ry * pY) / pX;
          const lo = Math.min(c0, c1) + ax - 0.5, hi = Math.max(c0, c1) + ax - 0.5;
          if (lo > xa) xa = Math.floor(lo);
          if (hi < xb) xb = Math.ceil(hi);
        } else if (Math.abs(ry * pY) > maxR) continue;
        if (Math.abs(ux) > 1e-4) {
          const c0 = (-rA - ry * uy) / ux, c1 = (len + rB - ry * uy) / ux;
          const lo = Math.min(c0, c1) + ax - 0.5, hi = Math.max(c0, c1) + ax - 0.5;
          if (lo > xa) xa = Math.floor(lo);
          if (hi < xb) xb = Math.ceil(hi);
        }
        if (xb < xa) continue;
        let o = y * w + xa;
        for (let x = xa; x <= xb; x++, o++) {
          const rx = x + 0.5 - ax;
          const along = rx * ux + ry * uy;
          const s = rx * pX + ry * pY;
          let nx, ny, nz;
          if (along < 0) {
            if (!capA) continue;
            const d2 = rx * rx + ry * ry;
            if (d2 > rA * rA) continue;
            nx = rx / rA; ny = ry / rA;
            nz = Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny));
          } else if (along > len) {
            if (!capB) continue;
            const qx = x + 0.5 - bx, qy = y + 0.5 - by;
            const d2 = qx * qx + qy * qy;
            if (d2 > rB * rB) continue;
            nx = qx / rB; ny = qy / rB;
            nz = Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny));
          } else {
            const ti = (along / len) * N;
            const i0 = ti | 0;
            const f = ti - i0;
            const i1 = i0 < N ? i0 + 1 : N;
            const wv = s >= 0 ? PF[i0] + (PF[i1] - PF[i0]) * f : PW[i0] + (PW[i1] - PW[i0]) * f;
            const as = s < 0 ? -s : s;
            if (as > wv || wv <= 0) continue;
            const nn = s / wv;
            nx = pX * nn; ny = pY * nn;
            nz = Math.sqrt(Math.max(0, 1 - nn * nn));
          }
          px[o] = this.shade(mat, nx, ny, nz, x, y);
          grp[o] = g;
          any = true;
        }
      }
      if (any) this._grow(x0, y0, x1, y1);
    }

    ellipse(cx, cy, rx, ry, ang, mat, g) {
      const c = Math.cos(ang), s = Math.sin(ang);
      const R = Math.max(rx, ry) + 1;
      let x0 = Math.floor(cx - R), x1 = Math.ceil(cx + R), y0 = Math.floor(cy - R), y1 = Math.ceil(cy + R);
      if (x0 < 0) x0 = 0;
      if (y0 < 0) y0 = 0;
      if (x1 >= this.w) x1 = this.w - 1;
      if (y1 >= this.h) y1 = this.h - 1;
      if (x1 < x0 || y1 < y0) return;
      const w = this.w, px = this.px, grp = this.grp;
      let any = false;
      for (let y = y0; y <= y1; y++) {
        const dy = y + 0.5 - cy;
        let o = y * w + x0;
        for (let x = x0; x <= x1; x++, o++) {
          const dx = x + 0.5 - cx;
          const lx = (dx * c + dy * s) / rx, ly = (-dx * s + dy * c) / ry;
          const d2 = lx * lx + ly * ly;
          if (d2 > 1) continue;
          const nx = lx * c - ly * s, ny = lx * s + ly * c;
          px[o] = this.shade(mat, nx, ny, Math.sqrt(1 - d2), x, y);
          grp[o] = g;
          any = true;
        }
      }
      if (any) this._grow(x0, y0, x1, y1);
    }

    // Polygon fill (even-odd). shading: {sphere:[cx,cy,R]} | {n:[nx,ny,nz]} | {band:i}
    poly(pts, mat, g, shading) {
      const n = pts.length >> 1;
      if (n < 3) return;
      let minY = Infinity, maxY = -Infinity, minX = Infinity, maxX = -Infinity;
      for (let i = 0; i < n; i++) {
        const x = pts[i * 2], y = pts[i * 2 + 1];
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
      }
      let y0 = Math.max(0, Math.floor(minY)), y1 = Math.min(this.h - 1, Math.ceil(maxY));
      const w = this.w, px = this.px, grp = this.grp;
      const xs = [];
      let any = false;
      let sx = 0, sy = 0, sR = 1, fixed = null, bandC = 0;
      const mode = shading ? (shading.sphere ? 1 : shading.n ? 2 : shading.color != null ? 3 : 0) : 0;
      if (mode === 1) { sx = shading.sphere[0]; sy = shading.sphere[1]; sR = shading.sphere[2]; }
      else if (mode === 2) fixed = shading.n;
      else if (mode === 3) bandC = shading.color;
      for (let y = y0; y <= y1; y++) {
        const cy = y + 0.5;
        xs.length = 0;
        for (let i = 0, j = n - 1; i < n; j = i++) {
          const yi = pts[i * 2 + 1], yj = pts[j * 2 + 1];
          if ((yi > cy) !== (yj > cy)) {
            const xi = pts[i * 2], xj = pts[j * 2];
            xs.push(xi + ((cy - yi) / (yj - yi)) * (xj - xi));
          }
        }
        if (xs.length < 2) continue;
        xs.sort((a, b) => a - b);
        for (let k = 0; k + 1 < xs.length; k += 2) {
          let xa = Math.max(0, Math.ceil(xs[k] - 0.5)), xb = Math.min(w - 1, Math.floor(xs[k + 1] - 0.5));
          if (xb < xa) continue;
          let o = y * w + xa;
          for (let x = xa; x <= xb; x++, o++) {
            let col;
            if (mode === 3) col = bandC;
            else if (mode === 1) {
              let nx = (x + 0.5 - sx) / sR, ny = (cy - sy) / sR;
              const d2 = nx * nx + ny * ny;
              let nz;
              if (d2 > 1) { const dd = Math.sqrt(d2); nx /= dd; ny /= dd; nz = 0; }
              else nz = Math.sqrt(1 - d2);
              col = this.shade(mat, nx, ny, nz, x, y);
            } else if (mode === 2) col = this.shade(mat, fixed[0], fixed[1], fixed[2], x, y);
            else col = this.shade(mat, 0, -0.2, 0.98, x, y);
            px[o] = col;
            grp[o] = g;
            any = true;
          }
          if (xa < minX) minX = xa;
        }
      }
      if (any) this._grow(Math.max(0, Math.floor(minX)), y0, Math.min(w - 1, Math.ceil(maxX)), y1);
    }

    // Solid-color thick line for details (no shading). col: packed color.
    line(x0, y0, x1, y1, col, g, width = 1, onlyOver = false) {
      const dx = x1 - x0, dy = y1 - y0;
      const steps = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) * 1.5));
      const w = this.w, h = this.h, px = this.px, grp = this.grp;
      const r = width / 2;
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const cx = x0 + dx * t, cy = y0 + dy * t;
        if (width <= 1) {
          const x = Math.floor(cx), y = Math.floor(cy);
          if (x < 0 || y < 0 || x >= w || y >= h) continue;
          const o = y * w + x;
          if (onlyOver && !px[o]) continue;
          px[o] = col;
          if (!onlyOver) grp[o] = g;
          this._grow(x, y, x, y);
        } else {
          const xa = Math.floor(cx - r), xb = Math.floor(cx + r - 0.01), ya = Math.floor(cy - r), yb = Math.floor(cy + r - 0.01);
          for (let y = ya; y <= yb; y++)
            for (let x = xa; x <= xb; x++) {
              if (x < 0 || y < 0 || x >= w || y >= h) continue;
              const o = y * w + x;
              if (onlyOver && !px[o]) continue;
              px[o] = col;
              if (!onlyOver) grp[o] = g;
            }
          this._grow(Math.max(0, xa), Math.max(0, ya), Math.min(w - 1, xb), Math.min(h - 1, yb));
        }
      }
    }

    dot(x, y, col, g, onlyOver = false) {
      x = Math.floor(x); y = Math.floor(y);
      if (x < 0 || y < 0 || x >= this.w || y >= this.h) return;
      const o = y * this.w + x;
      if (onlyOver && !this.px[o]) return;
      this.px[o] = col;
      if (!onlyOver) this.grp[o] = g;
      this._grow(x, y, x, y);
    }

    // Selective outline + interior depth lines.
    // dark: [r,g,b] outline base. aura: optional packed outline override (glow).
    outline(dark, aura, interior = true, gap = 2) {
      if (this.x1 < this.x0) return;
      const w = this.w, h = this.h, px = this.px, grp = this.grp;
      const x0 = Math.max(0, this.x0 - 1), x1 = Math.min(w - 1, this.x1 + 1);
      const y0 = Math.max(0, this.y0 - 1), y1 = Math.min(h - 1, this.y1 + 1);
      const idx = this.tmpIdx, cols = this.tmpCol;
      let n = 0;
      const dr = dark[0], dg = dark[1], db = dark[2];
      const sel = (c, k) => {
        const r = c & 255, g = (c >>> 8) & 255, b = (c >>> 16) & 255;
        return U.pack(r * k + dr * (1 - k), g * k + dg * (1 - k), b * k + db * (1 - k), 255);
      };
      for (let y = y0; y <= y1; y++) {
        for (let x = x0; x <= x1; x++) {
          const o = y * w + x;
          const c = px[o];
          if (c === 0) {
            // exterior outline
            let nc = 0;
            if (x > 0 && px[o - 1]) nc = px[o - 1];
            else if (x < w - 1 && px[o + 1]) nc = px[o + 1];
            else if (y > 0 && px[o - w]) nc = px[o - w];
            else if (y < h - 1 && px[o + w]) nc = px[o + w];
            if (nc) {
              idx[n] = o;
              cols[n++] = aura || sel(nc, 0.22);
            }
          } else if (interior) {
            const g = grp[o];
            if (g === 0 || g >= 250) continue;
            let hit = false;
            if (x < w - 1 && grp[o + 1] >= g + gap && grp[o + 1] < 250) hit = true;
            else if (x > 0 && grp[o - 1] >= g + gap && grp[o - 1] < 250) hit = true;
            else if (y > 0 && grp[o - w] >= g + gap && grp[o - w] < 250) hit = true;
            else if (y < h - 1 && grp[o + w] >= g + gap && grp[o + w] < 250) hit = true;
            if (hit) {
              idx[n] = o;
              cols[n++] = sel(c, 0.4);
            }
          }
        }
      }
      for (let i = 0; i < n; i++) {
        px[idx[i]] = cols[i];
        if (!grp[idx[i]]) grp[idx[i]] = 251;
      }
      this.x0 = x0; this.y0 = y0; this.x1 = x1; this.y1 = y1;
    }

    // Adds a second, outer glow ring (for auras) around the current silhouette.
    glowRing(col) {
      if (this.x1 < this.x0) return;
      const w = this.w, h = this.h, px = this.px, grp = this.grp;
      const x0 = Math.max(0, this.x0 - 1), x1 = Math.min(w - 1, this.x1 + 1);
      const y0 = Math.max(0, this.y0 - 1), y1 = Math.min(h - 1, this.y1 + 1);
      const idx = this.tmpIdx;
      let n = 0;
      for (let y = y0; y <= y1; y++)
        for (let x = x0; x <= x1; x++) {
          const o = y * w + x;
          if (px[o]) continue;
          if ((x > 0 && px[o - 1]) || (x < w - 1 && px[o + 1]) || (y > 0 && px[o - w]) || (y < h - 1 && px[o + w]))
            idx[n++] = o;
        }
      for (let i = 0; i < n; i++) {
        px[idx[i]] = col;
        grp[idx[i]] = 252;
      }
      this.x0 = x0; this.y0 = y0; this.x1 = x1; this.y1 = y1;
    }

    // Upload dirty region to the backing canvas and remember it for clearing.
    flush() {
      this.px0 = Math.max(0, this.x0);
      this.py0 = Math.max(0, this.y0);
      this.px1 = Math.min(this.w - 1, this.x1);
      this.py1 = Math.min(this.h - 1, this.y1);
      if (this.ctx && this.px1 >= this.px0) {
        // clear previous canvas contents (whole canvas is cheap enough to region-clear)
        this.ctx.clearRect(0, 0, this.w, this.h);
        this.ctx.putImageData(this.img, 0, 0, this.px0, this.py0, this.px1 - this.px0 + 1, this.py1 - this.py0 + 1);
      }
    }

    get bbox() {
      return [this.px0, this.py0, this.px1 - this.px0 + 1, this.py1 - this.py0 + 1];
    }

    drawTo(ctx, alpha = 1) {
      const b = this.bbox;
      if (b[2] <= 0 || b[3] <= 0 || !this.canvas) return;
      if (alpha < 1) {
        ctx.globalAlpha = alpha;
        ctx.drawImage(this.canvas, b[0], b[1], b[2], b[3], b[0], b[1], b[2], b[3]);
        ctx.globalAlpha = 1;
      } else ctx.drawImage(this.canvas, b[0], b[1], b[2], b[3], b[0], b[1], b[2], b[3]);
    }
  }

  JJK.Raster = Raster;
})();

</script>
<script>/* src/engine/rig.js */
// Skeletal rig: pose description -> joint positions (2-bone IK for limbs),
// pose interpolation/animation sampling, secondary motion (hair/cloth springs)
// and a facing-space -> screen-space transform used by the character painters.
//
// Pose conventions (facing space): +x = toward the opponent, +y = up,
// origin = point on the ground under the fighter.
//   hip:[x,y]   hip joint position
//   lean        torso lean (deg, + forward), bend: chest bend relative to abdomen
//   head        head tilt (deg, + = chin down / looking forward-down)
//   nh, fh      near/far hand target relative to its shoulder
//   nf, ff      near/far ankle target (y = 0 means planted on the ground)
//   ne, fe      elbow direction (+1 natural, -1 inverted)
//   nk, fk      knee direction (+1 forward, -1 backward)
//   nhs, fhs    hand shape: fist | open | claw | point | sign | chop | grip
//   nfa, ffa    explicit foot angle (deg, 0 = toes forward, -90 = pointed down)
//   rot         whole body rotation (deg, + = forward roll), sx/sy squash
(function () {
  'use strict';
  const JJK = (typeof window !== 'undefined' ? window : globalThis).JJK;
  const U = JJK.U;
  const D2R = Math.PI / 180;

  const Rig = (JJK.Rig = {});

  Rig.DIMS = {
    abd: 20, chest: 25, neck: 6, headR: 10.5,
    ua: 24, fa: 21,
    thigh: 34, shin: 33, ankle: 5,
    shN: -5, shF: 5, shDrop: 3,
    hipN: -3, hipF: 3,
    foot: 12,
  };

  const NUM_FIELDS = ['lean', 'bend', 'head', 'rot', 'sx', 'sy', 'nha', 'fha', 'nfa', 'ffa', 'ne', 'fe', 'nk', 'fk', 'jaw', 'spread'];
  const VEC_FIELDS = ['hip', 'nh', 'fh', 'nf', 'ff'];
  const STR_FIELDS = ['nhs', 'fhs', 'face', 'eyes'];
  const DEFAULTS = {
    hip: [0, 68], lean: 0, bend: 0, head: 0, rot: 0, sx: 1, sy: 1,
    nh: [0, -40], fh: [0, -40], nf: [-12, 0], ff: [12, 0],
    ne: 1, fe: 1, nk: 1, fk: 1, nha: 0, fha: 0, nfa: NaN, ffa: NaN, jaw: 0, spread: 0,
    nhs: 'fist', fhs: 'fist', face: 'calm', eyes: 'band',
  };
  Rig.DEFAULTS = DEFAULTS;

  Rig.full = function (p) {
    const o = {};
    for (const k in DEFAULTS) o[k] = p[k] !== undefined ? p[k] : DEFAULTS[k];
    return o;
  };

  Rig.lerpPose = function (a, b, t, out) {
    out = out || {};
    for (let i = 0; i < VEC_FIELDS.length; i++) {
      const k = VEC_FIELDS[i];
      const va = a[k] !== undefined ? a[k] : DEFAULTS[k];
      const vb = b[k] !== undefined ? b[k] : DEFAULTS[k];
      out[k] = [va[0] + (vb[0] - va[0]) * t, va[1] + (vb[1] - va[1]) * t];
    }
    for (let i = 0; i < NUM_FIELDS.length; i++) {
      const k = NUM_FIELDS[i];
      let va = a[k] !== undefined ? a[k] : DEFAULTS[k];
      let vb = b[k] !== undefined ? b[k] : DEFAULTS[k];
      if (Number.isNaN(va) && Number.isNaN(vb)) out[k] = NaN;
      else if (Number.isNaN(va)) out[k] = t < 0.5 ? NaN : vb;
      else if (Number.isNaN(vb)) out[k] = t < 0.5 ? va : NaN;
      else out[k] = va + (vb - va) * t;
    }
    for (let i = 0; i < STR_FIELDS.length; i++) {
      const k = STR_FIELDS[i];
      const va = a[k] !== undefined ? a[k] : DEFAULTS[k];
      const vb = b[k] !== undefined ? b[k] : DEFAULTS[k];
      out[k] = t < 0.5 ? va : vb;
    }
    // pass-through extras (non-interpolated flags)
    if (b.fx !== undefined || a.fx !== undefined) out.fx = t < 0.5 ? a.fx : b.fx;
    return out;
  };

  // anim: { keys: [[frame, pose, ease?], ...], loop?: bool }
  // ease applies to the segment arriving at that key.
  Rig.sample = function (anim, frame, lib) {
    const keys = anim.keys;
    const resolve = (p) => (typeof p === 'string' ? lib[p] : p);
    if (keys.length === 1) return Rig.full(resolve(keys[0][1]));
    let f = frame;
    const len = anim.len || keys[keys.length - 1][0];
    if (anim.loop) f = U.wrap(frame, len);
    if (f <= keys[0][0]) return Rig.full(resolve(keys[0][1]));
    for (let i = 0; i < keys.length - 1; i++) {
      const k0 = keys[i], k1 = keys[i + 1];
      if (f >= k0[0] && f < k1[0]) {
        let t = (f - k0[0]) / (k1[0] - k0[0]);
        const e = U.ease[k1[2] || 'inOut'] || U.ease.inOut;
        return Rig.lerpPose(resolve(k0[1]), resolve(k1[1]), e(t));
      }
    }
    // after last key: loop back to first if looping
    if (anim.loop) {
      const k0 = keys[keys.length - 1];
      const k1 = keys[0];
      const t = (f - k0[0]) / Math.max(1, len - k0[0]);
      return Rig.lerpPose(resolve(k0[1]), resolve(k1[1]), U.ease[k1[2] || 'inOut'](U.clamp(t, 0, 1)));
    }
    return Rig.full(resolve(keys[keys.length - 1][1]));
  };

  // 2-bone IK in a y-up plane. bend: +1 => rotate root angle clockwise (elbows down/back),
  // -1 => counter-clockwise (knees forward use +1 via caller convention).
  function ik(sx, sy, tx, ty, l1, l2, bend, out) {
    let dx = tx - sx, dy = ty - sy;
    let d = Math.hypot(dx, dy);
    const maxR = l1 + l2 - 0.01;
    const minR = Math.abs(l1 - l2) + 0.5;
    if (d < 0.0001) { dx = 0; dy = -1; d = minR; }
    const dc = U.clamp(d, minR, maxR);
    const base = Math.atan2(dy, dx);
    const cosA = U.clamp((l1 * l1 + dc * dc - l2 * l2) / (2 * l1 * dc), -1, 1);
    const a = Math.acos(cosA);
    const ang = base - a * bend;
    const ex = sx + Math.cos(ang) * l1, ey = sy + Math.sin(ang) * l1;
    // end point: along the line from elbow toward target, at l2
    const fx = tx - ex, fy = ty - ey;
    const fl = Math.hypot(fx, fy) || 1;
    out[0] = ex; out[1] = ey;
    out[2] = ex + (fx / fl) * l2; out[3] = ey + (fy / fl) * l2;
    return out;
  }
  Rig.ik = ik;

  // Solve joints in facing space. Returns object with [x,y] points and angles.
  Rig.solve = function (p, d, extra) {
    d = d || Rig.DIMS;
    const J = {};
    const lean = (p.lean || 0) * D2R;
    const bend = (p.bend || 0) * D2R;
    const hx = p.hip[0], hy = p.hip[1];
    const sl = Math.sin(lean), cl = Math.cos(lean);
    J.hip = [hx, hy];
    J.waist = [hx + sl * d.abd, hy + cl * d.abd];
    const ca = lean + bend;
    const sc = Math.sin(ca), cc = Math.cos(ca);
    J.chestAng = ca;
    J.chest = [J.waist[0] + sc * d.chest, J.waist[1] + cc * d.chest];
    // forward axis of the chest (perpendicular to spine)
    const fx = cc, fy = -sc;
    J.fwd = [fx, fy];
    const headTilt = (p.head || 0) * D2R;
    const ha = ca * 0.6 + headTilt * 0.35;
    J.neck = [J.chest[0] + sc * 2, J.chest[1] + cc * 2];
    J.headAng = ca + headTilt;
    J.head = [J.neck[0] + Math.sin(ha) * (d.neck + d.headR * 0.75), J.neck[1] + Math.cos(ha) * (d.neck + d.headR * 0.75)];
    // shoulders
    J.shN = [J.chest[0] + fx * d.shN - sc * d.shDrop, J.chest[1] + fy * d.shN - cc * d.shDrop];
    J.shF = [J.chest[0] + fx * d.shF - sc * d.shDrop, J.chest[1] + fy * d.shF - cc * d.shDrop];
    const tmp = [0, 0, 0, 0];
    // arms (targets relative to shoulders)
    ik(J.shN[0], J.shN[1], J.shN[0] + p.nh[0], J.shN[1] + p.nh[1], d.ua, d.fa, p.ne || 1, tmp);
    J.elN = [tmp[0], tmp[1]];
    J.haN = [tmp[2], tmp[3]];
    ik(J.shF[0], J.shF[1], J.shF[0] + p.fh[0], J.shF[1] + p.fh[1], d.ua, d.fa, p.fe || 1, tmp);
    J.elF = [tmp[0], tmp[1]];
    J.haF = [tmp[2], tmp[3]];
    // hips
    const hfx = cl, hfy = -sl;
    J.hpN = [hx + hfx * d.hipN, hy + hfy * d.hipN];
    J.hpF = [hx + hfx * d.hipF, hy + hfy * d.hipF];
    // legs (knee forward => counter-clockwise => bend -1 in ik convention)
    ik(J.hpN[0], J.hpN[1], p.nf[0], p.nf[1] + d.ankle, d.thigh, d.shin, -(p.nk || 1), tmp);
    J.knN = [tmp[0], tmp[1]];
    J.anN = [tmp[2], tmp[3]];
    ik(J.hpF[0], J.hpF[1], p.ff[0], p.ff[1] + d.ankle, d.thigh, d.shin, -(p.fk || 1), tmp);
    J.knF = [tmp[0], tmp[1]];
    J.anF = [tmp[2], tmp[3]];
    // feet
    const footAng = (an, kn, fy, override) => {
      if (!Number.isNaN(override) && override !== undefined) return override * D2R;
      if (an[1] - d.ankle < 3) return 0; // planted
      const sa = Math.atan2(an[1] - kn[1], an[0] - kn[0]); // shin direction
      return sa + Math.PI / 2 + 0.55; // pointed toes
    };
    J.ftNA = footAng(J.anN, J.knN, p.nf[1], p.nfa);
    J.ftFA = footAng(J.anF, J.knF, p.ff[1], p.ffa);
    J.toeN = [J.anN[0] + Math.cos(J.ftNA) * d.foot, J.anN[1] + Math.sin(J.ftNA) * d.foot - (J.ftNA === 0 ? d.ankle * 0.9 : 0)];
    J.toeF = [J.anF[0] + Math.cos(J.ftFA) * d.foot, J.anF[1] + Math.sin(J.ftFA) * d.foot - (J.ftFA === 0 ? d.ankle * 0.9 : 0)];
    // hand angles: along forearm + offset
    J.hnA = Math.atan2(J.haN[1] - J.elN[1], J.haN[0] - J.elN[0]) + (p.nha || 0) * D2R;
    J.hfA = Math.atan2(J.haF[1] - J.elF[1], J.haF[0] - J.elF[0]) + (p.fha || 0) * D2R;
    return J;
  };

  // Body-local transform: facing space (y up) -> screen space (y down).
  class Xform {
    constructor() {
      this.ox = 0; this.oy = 0; this.f = 1; this.z = 1;
      this.rot = 0; this.px = 0; this.py = 60; // rotation pivot in facing space
      this.sx = 1; this.sy = 1;
      this.cr = 1; this.sr = 0;
    }
    set(ox, oy, f, z, rotDeg, pivot, sx, sy) {
      this.ox = ox; this.oy = oy; this.f = f; this.z = z;
      this.rot = rotDeg * D2R;
      this.cr = Math.cos(-this.rot); this.sr = Math.sin(-this.rot);
      if (pivot) { this.px = pivot[0]; this.py = pivot[1]; }
      this.sx = sx; this.sy = sy;
      return this;
    }
    // facing-space point -> screen
    x(px, py) {
      let x = px * this.sx, y = py * this.sy;
      if (this.rot) {
        const dx = x - this.px, dy = y - this.py;
        x = this.px + dx * this.cr - dy * this.sr;
        y = this.py + dx * this.sr + dy * this.cr;
      }
      return this.ox + this.f * x * this.z;
    }
    y(px, py) {
      let x = px * this.sx, y = py * this.sy;
      if (this.rot) {
        const dx = x - this.px, dy = y - this.py;
        y = this.py + dx * this.sr + dy * this.cr;
      }
      return this.oy - y * this.z;
    }
    p(pt) { return [this.x(pt[0], pt[1]), this.y(pt[0], pt[1])]; }
    // local offset (u forward, v up) from a facing-space base point rotated by angle (rad, facing space, ccw from +x)
    lp(base, ang, u, v) {
      const c = Math.cos(ang), s = Math.sin(ang);
      return this.p([base[0] + u * c - v * s, base[1] + u * s + v * c]);
    }
    // facing-space angle -> screen-space angle
    ang(a) { return this.f > 0 ? -(a - this.rot) : -(Math.PI - a + this.rot); }
  }
  Rig.Xform = Xform;

  // Painter helpers that map facing-space geometry through a transform.
  Rig.painter = function (r, xf) {
    const z = xf.z;
    return {
      r, xf, z,
      limb(A, B, prof, mat, g, sideSign = 1, capA = true, capB = true) {
        const a = xf.p(A), b = xf.p(B);
        const sp = prof.map((q) => [q[0], q[1] * z * Math.abs(xf.sx), q[2] * z * Math.abs(xf.sx)]);
        r.limb(a[0], a[1], b[0], b[1], sp, mat, g, xf.f * sideSign, capA, capB);
      },
      ell(C, rx, ry, ang, mat, g) {
        const c = xf.p(C);
        r.ellipse(c[0], c[1], rx * z, ry * z, xf.ang(ang), mat, g);
      },
      // polygon from facing-space points (flat array or array of pairs)
      poly(pts, mat, g, shading) {
        const out = [];
        for (let i = 0; i < pts.length; i++) {
          const q = pts[i];
          out.push(xf.x(q[0], q[1]), xf.y(q[0], q[1]));
        }
        if (shading && shading.sphere) {
          const c = xf.p(shading.sphere);
          shading = { sphere: [c[0], c[1], shading.sphere[2] * z] };
        }
        r.poly(out, mat, g, shading);
      },
      line(A, B, col, g, w = 1, onlyOver = false) {
        const a = xf.p(A), b = xf.p(B);
        r.line(a[0], a[1], b[0], b[1], col, g, Math.max(1, Math.round(w * z * 0.6)), onlyOver);

      dot(A, col, g, onlyOver = false) {
        const a = xf.p(A);
        const s = Math.max(1, Math.round(z * 0.6));
        for (let i = 0; i < s; i++) for (let j = 0; j < s; j++) r.dot(a[0] + i, a[1] + j, col, g, onlyOver);

      // head-local helper: point at (u,v) around a center with rotation (facing-space rad)
      loc(C, ang, u, v) {
        const c = Math.cos(ang), s = Math.sin(ang);
        return [C[0] + u * c - v * s, C[1] + u * s + v * c];
      },
    };
  };

  // Secondary motion: spring-driven offsets for hair and cloth.
  class Secondary {
    constructor() {
      this.hx = 0; this.hy = 0; this.hvx = 0; this.hvy = 0; // hair offset
      this.prevHead = null;
      this.cloth = [[0, 0], [0, 0], [0, 0]]; // tail chain offsets
      this.clothV = [[0, 0], [0, 0], [0, 0]];
      this.prevWaist = null;
      this.t = 0;
      this.wind = [0, 0];
    }
    update(J, worldX, worldY, facing) {
      this.t++;
      const head = [worldX + J.head[0] * facing, worldY + J.head[1]];
      if (this.prevHead) {
        const vx = (head[0] - this.prevHead[0]) * facing, vy = head[1] - this.prevHead[1];

        const tx = U.clamp(-vx * 0.9, -7, 7) + this.wind[0];
        const ty = U.clamp(-vy * 0.7, -6, 6) + this.wind[1];
        this.hvx += (tx - this.hx) * 0.22; this.hvy += (ty - this.hy) * 0.22;
        this.hvx *= 0.72; this.hvy *= 0.72;
        this.hx += this.hvx; this.hy += this.hvy;
      }
      this.prevHead = head;
      const waist = [worldX + J.waist[0] * facing, worldY + J.waist[1]];
      if (this.prevWaist) {
        const vx = (waist[0] - this.prevWaist[0]) * facing, vy = waist[1] - this.prevWaist[1];
        for (let i = 0; i < 3; i++) {
          const k = (i + 1) / 3;
          const tx = U.clamp(-vx * 2.2 * k, -16, 16) + this.wind[0] * k + Math.sin(this.t * 0.11 + i) * 0.8 * k;
          const ty = U.clamp(-vy * 1.6 * k, -12, 12) + this.wind[1] * k;
          const c = this.cloth[i], v = this.clothV[i];
          v[0] += (tx - c[0]) * (0.18 - i * 0.03); v[1] += (ty - c[1]) * (0.18 - i * 0.03);
          v[0] *= 0.78; v[1] *= 0.78;
          c[0] += v[0]; c[1] += v[1];

      }
      this.prevWaist = waist;
    }
    reset() {
      this.hx = this.hy = this.hvx = this.hvy = 0;
      this.prevHead = this.prevWaist = null;
      for (let i = 0; i < 3; i++) { this.cloth[i][0] = this.cloth[i][1] = 0; this.clothV[i][0] = this.clothV[i][1] = 0; }
    }
  }
  Rig.Secondary = Secondary;
})();

// Input: keyboard + gamepad devices, per-player controllers, input history
// and fighting-game motion recognition (numpad notation, facing-relative).
(function () {
  'use strict';
  const root = typeof window !== 'undefined' ? window : globalThis;
  const JJK = root.JJK;

  const B = (JJK.BTN = { L: 1, M: 2, H: 4, SP: 8, SU: 16, UN: 32, START: 64, BACK: 128 });
  JJK.BTN_NAMES = { L: 'LIGHT', M: 'MEDIUM', H: 'HEAVY', SP: 'SPECIAL', SU: 'SUPER', UN: 'UNIQUE' };

  // Keyboard layouts. Macro keys map to several buttons at once.
  const KB1 = {
    up: ['KeyW'], down: ['KeyS'], left: ['KeyA'], right: ['KeyD'],
    L: ['KeyJ'], M: ['KeyK'], H: ['KeyL'], SP: ['KeyU'], SU: ['KeyI'], UN: ['KeyO'],
    THROW: ['KeyH'], PARRY: ['KeyY'], DASH: ['Space'],
    START: ['Escape', 'Enter'], BACK: ['Backspace'],
  };
  const KB2 = {
    up: ['ArrowUp'], down: ['ArrowDown'], left: ['ArrowLeft'], right: ['ArrowRight'],
    L: ['Numpad1', 'Comma'], M: ['Numpad2', 'Period'], H: ['Numpad3', 'Slash'],
    SP: ['Numpad4', 'Semicolon'], SU: ['Numpad5', 'Quote'], UN: ['Numpad6', 'BracketLeft'],
    THROW: ['Numpad0'], PARRY: ['NumpadDecimal'], DASH: ['ShiftRight'],
    START: ['NumpadEnter', 'Backslash'], BACK: ['NumpadSubtract'],
  };
  JJK.KB_LAYOUTS = [KB1, KB2];

  const keys = new Set();
  const keysPressed = new Set();
  JJK.keys = keys;
  if (typeof window !== 'undefined') {
    window.addEventListener('keydown', (e) => {
      if (!keys.has(e.code)) keysPressed.add(e.code);
      keys.add(e.code);
      if (JJK.Audio && JJK.Audio.unlock) JJK.Audio.unlock();
      // prevent page scroll / browser shortcuts for game keys
      if (/^(Arrow|Space|Numpad|Slash|Quote|Backspace|Tab|F1|F2|F3|F4)/.test(e.code)) e.preventDefault();
    });
    window.addEventListener('keyup', (e) => keys.delete(e.code));
    window.addEventListener('blur', () => keys.clear());
    window.addEventListener('pointerdown', () => JJK.Audio && JJK.Audio.unlock && JJK.Audio.unlock());
  }
  JJK.keyPressed = (code) => keysPressed.has(code);
  JJK.endInputFrame = () => keysPressed.clear();

  function padState(index) {
    if (index == null || index < 0 || typeof navigator === 'undefined' || !navigator.getGamepads) return null;
    const pads = navigator.getGamepads();
    const p = pads && pads[index];
    if (!p || !p.connected) return null;
    const b = (i) => !!(p.buttons[i] && p.buttons[i].pressed);
    const ax = p.axes[0] || 0, ay = p.axes[1] || 0;
    return {
      up: b(12) || ay < -0.5, down: b(13) || ay > 0.5, left: b(14) || ax < -0.5, right: b(15) || ax > 0.5,
      L: b(2), M: b(3), H: b(5), SP: b(0), SU: b(1), UN: b(7),
      THROW: b(4), PARRY: b(6), DASH: b(10), START: b(9), BACK: b(8),
      any: p.buttons.some((x) => x.pressed),
    };

  JJK.padState = padState;

  // Converts up/down/left/right to an absolute numpad direction (6 = right).
  function toDir(u, d, l, r) {
    if (l && r) l = r = false; // SOCD: neutral
    if (u && d) d = false; // up wins
    const x = r ? 1 : l ? -1 : 0;
    const y = u ? 1 : d ? -1 : 0;

  // A controller produces one frame of input per tick: { dir (absolute), held mask, pressed mask }.
  class Controller {
    constructor(kbLayout, padIndex) {
      this.kb = kbLayout;
      this.pad = padIndex;
      this.held = 0;
      this.prevHeld = 0;
      this.pressed = 0;
      this.dir = 5;
      this.dash = false;

          if (any(k.H)) h |= B.H;
          if (any(k.SP)) h |= B.SP;
          if (any(k.SU)) h |= B.SU;
          if (any(k.UN)) h |= B.UN;
          if (any(k.THROW)) h |= B.L | B.M;
          if (any(k.PARRY)) h |= B.M | B.H;
          if (any(k.START)) h |= B.START;
          if (any(k.BACK)) h |= B.BACK;
          dash = dash || any(k.DASH);

        const p = padState(this.pad);
        if (p) {
          u = u || p.up; d = d || p.down; l = l || p.left; r = r || p.right;
          if (p.L) h |= B.L;
          if (p.M) h |= B.M;
          if (p.H) h |= B.H;
          if (p.SP) h |= B.SP;
          if (p.SU) h |= B.SU;
          if (p.UN) h |= B.UN;
          if (p.THROW) h |= B.L | B.M;
          if (p.PARRY) h |= B.M | B.H;
          if (p.START) h |= B.START;
          if (p.BACK) h |= B.BACK;

      } else {

      }
      this.dash = dash;
      this.prevHeld = this.held;
      this.held = h;
      this.pressed = h & ~this.prevHeld;

    }
  }

  // History of facing-relative input frames for motion detection.
  const HIST = 48;
  class InputBuffer {
    constructor() {
      this.d = new Uint8Array(HIST); // relative dir
      this.h = new Uint8Array(HIST);
      this.p = new Uint8Array(HIST);
      this.i = 0; // index of latest
      this.n = 0;
      this.dashKey = false;
      this.dashPressed = false;
    }
    push(dirRel, held, pressed, dashKey) {
      this.i = (this.i + 1) % HIST;
      this.d[this.i] = dirRel;
      this.h[this.i] = held;
      this.p[this.i] = pressed;
      this.n = Math.min(HIST, this.n + 1);
      this.dashPressed = dashKey && !this.dashKey;
      this.dashKey = dashKey;
    }
    // k = 0 latest, 1 = previous ...
    dir(k = 0) { return this.d[(this.i - k + HIST * 4) % HIST]; }
    held(k = 0) { return this.h[(this.i - k + HIST * 4) % HIST]; }
    pr(k = 0) { return this.p[(this.i - k + HIST * 4) % HIST]; }
    clear() { this.d.fill(5); this.h.fill(0); this.p.fill(0); this.n = 0; }

    // Was button mask pressed in the last `win` frames? (any of the bits when any=true)
    pressedWithin(mask, win = 1) {
      for (let k = 0; k < win; k++) if (this.pr(k) & mask) return true;
      return false;
    }
    // All bits of `mask` pressed within `win` frames of each other, last one within `recent` frames
    chordWithin(mask, win = 3, recent = 1) {
      let seen = 0, lastK = 99;
      for (let k = 0; k < win + recent; k++) {
        const p = this.pr(k) & mask;
        if (p) { seen |= p; lastK = Math.min(lastK, k); }
      }
      // allow "held already + newly pressed" chords
      const heldNow = this.held(0) & mask;
      return (seen | (heldNow && seen ? heldNow : 0)) === mask && lastK < recent;
    }

    // Match a motion sequence ending within `end` frames of now, total window `win`.
    // steps: array of {d:[dirs], opt?:bool}. Returns frame index (age) of the first step or -1.
    motion(steps, win = 16, end = 8) {
      let si = steps.length - 1;
      let k = 0;
      // last step must be found within `end` frames
      let found = -1;
      for (; k < Math.min(end, this.n); k++) {
        if (steps[si].d.includes(this.dir(k))) { found = k; break; }
      }
      if (found < 0) return -1;
      k = found;
      si--;
      let startAge = found;
      while (si >= 0) {
        const st = steps[si];
        let ok = false;
        const k0 = k;
        // search older frames for this step's direction
        for (; k < Math.min(win, this.n); k++) {
          if (st.d.includes(this.dir(k))) { ok = true; startAge = k; break; }
        }
        if (!ok) {
          if (st.opt) { k = k0; si--; continue; }
          return -1;
        }
        si--;
      }
      return startAge;
    }
  }
  JJK.InputBuffer = InputBuffer;

  JJK.MOTIONS = {
    '236': [{ d: [2] }, { d: [3], opt: true }, { d: [6] }],
    '214': [{ d: [2] }, { d: [1], opt: true }, { d: [4] }],
    '623': [{ d: [6] }, { d: [2, 1] }, { d: [3] }],
    '63214': [{ d: [6] }, { d: [3], opt: true }, { d: [2] }, { d: [1], opt: true }, { d: [4] }],
    '22': [{ d: [1, 2, 3] }, { d: [4, 5, 6, 7, 8, 9] }, { d: [1, 2, 3] }],
    '66': [{ d: [6] }, { d: [5, 4, 1, 2, 7, 8] }, { d: [6] }],
    '44': [{ d: [4] }, { d: [5, 6, 3, 2, 9, 8] }, { d: [4] }],
  };
  JJK.MOTION_WIN = { '236': 15, '214': 15, '623': 15, '63214': 24, '22': 16, '66': 12, '44': 12 };
})();

      const o = opts.outlineW || scale;
      for (let dy = -o; dy <= o; dy += o)
        for (let dx = -o; dx <= o; dx += o) if (dx || dy) raw(ctx, text, x + dx, y + dy, opts.outline, scale);
    }
    if (opts.shadow) raw(ctx, text, x + scale, y + scale, opts.shadow, scale);
    raw(ctx, text, x, y, opts.color || '#fff', scale);
    ctx.imageSmoothingEnabled = prevSmooth;
    return w;
  };

  // Stylized banner text cached as a canvas. opts: scale, top, mid, bot (gradient colors), outline, shadow, skew
  const bannerCache = new Map();
  Font.banner = function (text, opts = {}) {
    const key = text + JSON.stringify(opts);
    let c = bannerCache.get(key);
    if (c) return c;
    const s = opts.scale || 6;
    const pad = s * 2 + 4;
    const w = Font.width(text, s) + pad * 2, h = GH * s + pad * 2;
    c = makeCanvas(w + Math.abs(opts.skew || 0) * h, h);
    if (!c) return null;
    const x = c.getContext('2d');
    x.imageSmoothingEnabled = false;
    const skew = opts.skew || 0;
    // body
    const body = makeCanvas(c.width, h);
    const bx = body.getContext('2d');
    bx.imageSmoothingEnabled = false;
    raw(bx, text, pad + (skew > 0 ? skew * h : 0), pad, '#fff', s);
    // gradient fill
    bx.globalCompositeOperation = 'source-in';
    const g = bx.createLinearGradient(0, pad, 0, pad + GH * s);
    g.addColorStop(0, opts.top || '#fff6a0');
    g.addColorStop(0.45, opts.mid || '#ffd21a');
    g.addColorStop(0.55, opts.mid2 || opts.mid || '#f0a000');
    g.addColorStop(1, opts.bot || '#b04400');
    bx.fillStyle = g;
    bx.fillRect(0, 0, body.width, h);
    // bevel highlight: top row of each glyph pixel row
    bx.globalCompositeOperation = 'source-atop';
    bx.fillStyle = 'rgba(255,255,255,0.35)';
    for (let r = 0; r < GH; r++) bx.fillRect(0, pad + r * s, body.width, Math.max(1, s >> 2));
    bx.fillStyle = 'rgba(0,0,0,0.22)';
    for (let r = 0; r < GH; r++) bx.fillRect(0, pad + r * s + s - Math.max(1, s >> 2), body.width, Math.max(1, s >> 2));
    // silhouette for outline
    const sil = makeCanvas(c.width, h);
    const sx = sil.getContext('2d');
    sx.drawImage(body, 0, 0);
    sx.globalCompositeOperation = 'source-in';
    sx.fillStyle = opts.outline || '#1a0a00';
    sx.fillRect(0, 0, sil.width, h);
    const ow = opts.outlineW || Math.max(2, s >> 1);
    if (opts.shadow !== false) {
      x.globalAlpha = 0.7;
      x.drawImage(sil, ow + 2, ow + 3);
      x.globalAlpha = 1;
    }
    for (let dy = -ow; dy <= ow; dy++)
      for (let dx = -ow; dx <= ow; dx++) if (dx * dx + dy * dy <= ow * ow + 1) x.drawImage(sil, dx, dy);
    x.drawImage(body, 0, 0);
    // apply skew by drawing rows offset
    if (skew) {
      const out = makeCanvas(c.width, h);
      const ox = out.getContext('2d');
      for (let yy = 0; yy < h; yy++) ox.drawImage(c, 0, yy, c.width, 1, Math.round(-skew * yy), yy, c.width, 1);
      c = out;
    }
    bannerCache.set(key, c);
    return c;
  };
})();

</script>
<script>/* src/engine/fx.js */
// Particle & VFX system. World-space particles (y up) rendered through the camera.
// Includes cached additive glow sprites, pixel-crisp circles, anime hit sparks,
// lightning, slashes, rings, smoke, flames and popup text.
(function () {
  'use strict';
  const JJK = (typeof window !== 'undefined' ? window : globalThis).JJK;
  const U = JJK.U;
  const hasDoc = typeof document !== 'undefined';

  const FX = (JJK.FX = {});
  const MAX = 2200;
  const parts = [];
  const pool = [];
  FX.parts = parts;
  FX.lights = []; // per-frame dynamic lights {x,y,r,c:[r,g,b],i}
  FX.timeScale = 1;

  function P() {
    return pool.pop() || {};
  }

  // type: spark|px|glow|ring|smoke|debris|flame|slash|text|star|bolt|shock|line|flash|orb
  FX.spawn = function (type, x, y, o = {}) {
    if (parts.length >= MAX) return null;
    const p = P();
    p.type = type;
    p.x = x; p.y = y;
    p.vx = o.vx || 0; p.vy = o.vy || 0;
    p.ax = o.ax || 0; p.ay = o.ay != null ? o.ay : 0;
    p.drag = o.drag != null ? o.drag : 1;
    p.life = o.life || 20; p.t = 0;
    p.size = o.size || 2; p.size2 = o.size2 != null ? o.size2 : p.size;
    p.color = o.color || '#fff';
    p.color2 = o.color2 || p.color;
    p.alpha = o.alpha != null ? o.alpha : 1;
    p.add = !!o.add;
    p.rot = o.rot || 0; p.vr = o.vr || 0;
    p.len = o.len || 0;
    p.x2 = o.x2 || 0; p.y2 = o.y2 || 0;
    p.floor = o.floor != null ? o.floor : false;
    p.text = o.text || '';
    p.scale = o.scale || 1;
    p.layer = o.layer || 'front';
    p.pts = o.pts || null;
    p.w = o.w || 1;
    p.delay = o.delay || 0;
    p.seed = Math.random() * 1000;
    p.follow = o.follow || null; // object with x,y to follow
    p.fx = o.fx || 0; p.fy = o.fy || 0;
    p.fade = o.fade != null ? o.fade : 1;
    p.shape = o.shape || 0;
    parts.push(p);
    return p;
  };

  FX.clear = function () {
    while (parts.length) pool.push(parts.pop());
  };

  FX.update = function () {
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      if (p.delay > 0) { p.delay--; continue; }
      p.t++;
      if (p.follow) { p.x = p.follow.x + p.fx; p.y = p.follow.y + p.fy; }
      p.vx += p.ax; p.vy += p.ay;
      p.vx *= p.drag; p.vy *= p.drag;
      p.x += p.vx; p.y += p.vy;
      p.rot += p.vr;
      if (p.floor !== false && p.y < p.floor) {
        p.y = p.floor;
        p.vy = -p.vy * 0.35;
        p.vx *= 0.6;
        p.vr *= 0.5;
      }
      if (p.t >= p.life) {
        parts.splice(i, 1);
        pool.push(p);
      }
    }
  };

  // ---- cached sprites -------------------------------------------------
  const glowCache = new Map();
  function glowSprite(color) {
    let c = glowCache.get(color);
    if (c || !hasDoc) return c;
    c = document.createElement('canvas');
    c.width = c.height = 64;
    const x = c.getContext('2d');
    const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    const rgb = U.hex(color);
    g.addColorStop(0, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},1)`);
    g.addColorStop(0.25, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},0.55)`);
    g.addColorStop(0.6, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},0.15)`);
    g.addColorStop(1, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},0)`);
    x.fillStyle = g;
    x.fillRect(0, 0, 64, 64);
    glowCache.set(color, c);
    return c;
  }
  FX.glowSprite = glowSprite;

  // additive glow at screen coords
  FX.glow = function (ctx, sx, sy, r, color, alpha = 1) {
    const s = glowSprite(color);
    if (!s || r <= 0) return;
    const pa = ctx.globalAlpha, pc = ctx.globalCompositeOperation;
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = U.clamp(alpha, 0, 1);
    ctx.drawImage(s, sx - r, sy - r, r * 2, r * 2);
    ctx.globalAlpha = pa;
    ctx.globalCompositeOperation = pc;
  };

  // Pixel-crisp filled circle (no AA) at screen coords.
  FX.pxCircle = function (ctx, cx, cy, r, color) {
    if (r < 0.5) return;
    ctx.fillStyle = color;
    const r2 = r * r;
    const y0 = Math.floor(cy - r), y1 = Math.ceil(cy + r);
    for (let y = y0; y <= y1; y++) {
      const dy = y + 0.5 - cy;
      const d = r2 - dy * dy;
      if (d < 0) continue;
      const hw = Math.sqrt(d);
      const xa = Math.round(cx - hw), xb = Math.round(cx + hw);
      if (xb > xa) ctx.fillRect(xa, y, xb - xa, 1);
    }
  };
  // Pixel-crisp ring
  FX.pxRing = function (ctx, cx, cy, r, w, color) {
    if (r < 1) return;
    ctx.fillStyle = color;
    const ro2 = r * r, ri = Math.max(0, r - w), ri2 = ri * ri;
    const y0 = Math.floor(cy - r), y1 = Math.ceil(cy + r);
    for (let y = y0; y <= y1; y++) {
      const dy = y + 0.5 - cy;
      const d = ro2 - dy * dy;
      if (d < 0) continue;
      const ho = Math.sqrt(d);
      const di = ri2 - dy * dy;
      if (di <= 0) {
        ctx.fillRect(Math.round(cx - ho), y, Math.round(cx + ho) - Math.round(cx - ho), 1);
      } else {
        const hi = Math.sqrt(di);
        ctx.fillRect(Math.round(cx - ho), y, Math.max(1, Math.round(cx - hi) - Math.round(cx - ho)), 1);
        ctx.fillRect(Math.round(cx + hi), y, Math.max(1, Math.round(cx + ho) - Math.round(cx + hi)), 1);
      }
    }
  };

  // Jagged lightning polyline between two screen points.
  FX.boltPath = function (x0, y0, x1, y1, jag, segs, seed) {
    const pts = [x0, y0];
    const dx = x1 - x0, dy = y1 - y0;
    const l = Math.hypot(dx, dy) || 1;
    const nx = -dy / l, ny = dx / l;
    let s = seed;
    for (let i = 1; i < segs; i++) {
      const t = i / segs;
      s = (s * 9301 + 49297) % 233280;
      const r = (s / 233280 - 0.5) * 2 * jag * Math.sin(t * Math.PI);
      pts.push(x0 + dx * t + nx * r, y0 + dy * t + ny * r);
    }
    pts.push(x1, y1);
    return pts;
  };

  function strokePts(ctx, pts, w, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = w;
    ctx.beginPath();
    ctx.moveTo(pts[0], pts[1]);
    for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
    ctx.stroke();
  }
  FX.strokePts = strokePts;

  // ---- draw -------------------------------------------------------------
  FX.draw = function (ctx, cam, layer) {
    if (!ctx) return;
    const z = cam.ez;
    ctx.save();
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      if (p.layer !== layer || p.delay > 0) continue;
      const k = p.t / p.life; // 0..1
      const sx = cam.sx(p.x), sy = cam.sy(p.y);
      const a = p.alpha * (p.fade ? 1 - Math.pow(k, 1.6) * p.fade : 1);
      if (a <= 0.01) continue;
      ctx.globalCompositeOperation = p.add ? 'lighter' : 'source-over';
      ctx.globalAlpha = U.clamp(a, 0, 1);
      const size = U.lerp(p.size, p.size2, k) * z;
      switch (p.type) {
        case 'px': {
          const s = Math.max(1, Math.round(size));
          ctx.fillStyle = k < 0.3 ? p.color : p.color2;
          ctx.fillRect(Math.round(sx - s / 2), Math.round(sy - s / 2), s, s);
          break;
        }
        case 'spark': {
          const sp = Math.hypot(p.vx, p.vy) || 1;
          const len = Math.max(2, (p.len || 3) * sp * z * (1 - k * 0.6));
          const ex = sx - (p.vx / sp) * len, ey = sy + (p.vy / sp) * len;
          ctx.strokeStyle = k < 0.35 ? '#fff' : p.color;
          ctx.lineWidth = Math.max(1, Math.round(size));
          ctx.beginPath();
          ctx.moveTo(Math.round(sx) + 0.5, Math.round(sy) + 0.5);
          ctx.lineTo(Math.round(ex) + 0.5, Math.round(ey) + 0.5);
          ctx.stroke();
          break;
        }
        case 'glow': {
          ctx.globalAlpha = 1;
          FX.glow(ctx, sx, sy, size, p.color, a);
          break;
        }
        case 'ring': {
          const w = Math.max(1, Math.round(p.w * z * (1 - k * 0.7)));
          FX.pxRing(ctx, sx, sy, size, w, k < 0.25 ? '#fff' : p.color);
          break;
        }
        case 'shock': {
          // flat ellipse ring on the floor
          ctx.strokeStyle = p.color;
          ctx.lineWidth = Math.max(1, p.w * z * (1 - k));
          ctx.beginPath();
          ctx.ellipse(sx, sy, size, size * 0.18, 0, 0, Math.PI * 2);
          ctx.stroke();
          break;
        }
        case 'smoke': {
          FX.pxCircle(ctx, sx, sy, size, p.color);
          break;
        }
        case 'flame': {
          // teardrop tongue of flame: base blob + tapered tip trailing upward
          const c = k < 0.2 ? '#fff6c0' : k < 0.45 ? p.color : k < 0.75 ? p.color2 : '#3a1008';
          const r = size * (1 - k * 0.55);
          FX.pxCircle(ctx, sx, sy, r, c);
          if (r > 1.5) {
            ctx.fillStyle = c;
            ctx.beginPath();
            ctx.moveTo(sx - r * 0.85, sy - r * 0.2);
            ctx.lineTo(sx + Math.sin(p.seed + p.t * 0.4) * r * 0.5, sy - r * 2.4);
            ctx.lineTo(sx + r * 0.85, sy - r * 0.2);
            ctx.fill();
            if (k < 0.5) FX.pxCircle(ctx, sx, sy + r * 0.2, r * 0.45, k < 0.25 ? '#ffffff' : '#ffe9a0');
          }
          break;
        }
        case 'debris': {
          ctx.fillStyle = p.color;
          ctx.translate(Math.round(sx), Math.round(sy));
          ctx.rotate(p.rot);
          const s = Math.max(1, size);
          ctx.fillRect(-s / 2, -s / 2, s, s * 0.7);
          ctx.fillStyle = p.color2;
          ctx.fillRect(-s / 2, -s / 2, s, Math.max(1, s * 0.25));
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          break;
        }
        case 'slash': {
          // line from (x,y) to (x2,y2) world; grows then thins
          const gx = cam.sx(p.x2), gy = cam.sy(p.y2);
          const grow = Math.min(1, p.t / Math.max(1, p.life * 0.25));
          const ex = sx + (gx - sx) * grow, ey = sy + (gy - sy) * grow;
          const w = Math.max(1, size * (1 - k));
          ctx.strokeStyle = p.color;
          ctx.lineWidth = w + 2;
          ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = Math.max(1, w * 0.5);
          ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
          break;
        }
        case 'line': {
          const gx = cam.sx(p.x2), gy = cam.sy(p.y2);
          ctx.strokeStyle = p.color;
          ctx.lineWidth = Math.max(1, size);
          ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(gx, gy); ctx.stroke();
          break;
        }
        case 'star': {
          // anime impact star: spiky polygon
          const n = p.shape || 8;
          const R = size, r = size * 0.32;
          ctx.translate(sx, sy);
          ctx.rotate(p.rot);
          ctx.beginPath();
          for (let j = 0; j < n * 2; j++) {
            const ang = (j / (n * 2)) * Math.PI * 2;
            const rr = j % 2 === 0 ? R * (0.7 + 0.3 * Math.abs(Math.sin(p.seed + j * 1.7))) : r;
            ctx.lineTo(Math.cos(ang) * rr, Math.sin(ang) * rr);
          }
          ctx.closePath();
          ctx.fillStyle = p.color2;
          ctx.fill();
          ctx.scale(0.62, 0.62);
          ctx.fillStyle = p.color;
          ctx.fill();
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          break;
        }
        case 'bolt': {
          const gx = cam.sx(p.x2), gy = cam.sy(p.y2);
          const pts = FX.boltPath(sx, sy, gx, gy, p.size * z, 7, ((p.seed * 1000) | 0) + ((p.t / 2) | 0) * 77);
          strokePts(ctx, pts, Math.max(2, 3 * z), p.color2);
          strokePts(ctx, pts, Math.max(1, 1.4 * z), p.color);
          break;
        }
        case 'flash': {
          FX.pxCircle(ctx, sx, sy, size, p.color);
          break;
        }
        case 'text': {
          const s = Math.max(1, Math.round(p.scale * (k < 0.15 ? 1 + (0.15 - k) * 4 : 1)));
          JJK.Font.draw(ctx, p.text, sx, sy, { color: p.color, scale: s, align: 'center', outline: p.color2 || '#000' });
          break;
        }
        case 'orb': {
          FX.pxCircle(ctx, sx, sy, size, p.color);
          FX.pxCircle(ctx, sx, sy, size * 0.55, p.color2);
          break;
        }
      }
    }
    ctx.restore();
  };

  // ---- composite effects --------------------------------------------------
  const R = (a, b) => a + Math.random() * (b - a);

  // dir: +1/-1 knockback direction. power 0..1.
  FX.hitSpark = function (x, y, dir, power, color = '#ffd27a', opt = {}) {
    const n = Math.round(6 + power * 12);
    FX.spawn('flash', x, y, { life: 4, size: 8 + power * 18, size2: 2, color: '#fff', add: true });
    FX.spawn('glow', x, y, { life: 10, size: 20 + power * 40, size2: 4, color: color, add: true });
    FX.spawn('star', x, y, { life: 5 + Math.round(power * 4), size: 12 + power * 26, size2: 6, color: '#fff', color2: color, rot: R(0, 6.28), shape: 7 + ((Math.random() * 4) | 0) });
    FX.spawn('ring', x, y, { life: 10 + power * 6, size: 4, size2: 18 + power * 40, color: color, w: 2 + power * 2, add: true });
    for (let i = 0; i < n; i++) {
      const ang = R(-1, 1) * (opt.spread || 1.4);
      const sp = R(3, 9) * (0.6 + power);
      const a = dir > 0 ? ang : Math.PI - ang;
      FX.spawn('spark', x, y, {
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp + R(-1, 2), drag: 0.86, ay: -0.15,
        life: R(8, 16), size: power > 0.6 ? 2 : 1, len: 1.6, color,
      });
    }
    for (let i = 0; i < 3 + power * 6; i++)
      FX.spawn('px', x, y, { vx: dir * R(1, 5), vy: R(-1, 5), ay: -0.3, drag: 0.95, life: R(14, 26), size: 2, color: '#fff', color2: color, floor: 0 });
  };

  FX.blockSpark = function (x, y, dir, color = '#9fd8ff') {
    FX.spawn('flash', x, y, { life: 3, size: 10, size2: 3, color: '#fff', add: true });
    FX.spawn('ring', x, y, { life: 9, size: 6, size2: 22, color, w: 2, add: true });
    for (let i = 0; i < 8; i++) {
      const a = (dir > 0 ? Math.PI : 0) + R(-1.1, 1.1);
      FX.spawn('spark', x, y, { vx: Math.cos(a) * R(3, 6), vy: Math.sin(a) * R(3, 6), drag: 0.82, life: R(6, 11), size: 1, len: 1.4, color });
    }
  };

  FX.perfectSpark = function (x, y) {
    FX.spawn('flash', x, y, { life: 5, size: 22, size2: 2, color: '#fff', add: true });
    FX.spawn('ring', x, y, { life: 14, size: 6, size2: 46, color: '#ffffff', w: 3, add: true });
    FX.spawn('ring', x, y, { life: 18, size: 4, size2: 30, color: '#7ff0ff', w: 2, add: true, delay: 3 });
    FX.spawn('star', x, y, { life: 8, size: 30, size2: 8, color: '#fff', color2: '#7ff0ff', shape: 4, rot: Math.PI / 4 });
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * Math.PI * 2;
      FX.spawn('spark', x, y, { vx: Math.cos(a) * 6, vy: Math.sin(a) * 6, drag: 0.85, life: 12, size: 1, len: 1.5, color: '#bff8ff' });
    }
  };

  FX.dust = function (x, power = 0.5, dir = 0) {
    for (let i = 0; i < 4 + power * 8; i++)
      FX.spawn('smoke', x + R(-10, 10), R(1, 6), {
        vx: R(-1.5, 1.5) * (1 + power) + dir * R(0.5, 2), vy: R(0.2, 1.4) * power, drag: 0.92,
        life: R(18, 34), size: R(3, 6) * (0.7 + power), size2: R(8, 14) * (0.7 + power), color: '#8a7466', alpha: 0.45, layer: 'back',
      });
  };

  FX.debris = function (x, y, n, power = 1, colors = ['#6a5a52', '#8a7a6a', '#4a3a34']) {
    for (let i = 0; i < n; i++)
      FX.spawn('debris', x + R(-6, 6), y + R(-6, 6), {
        vx: R(-4, 4) * power, vy: R(2, 7) * power, ay: -0.38, drag: 0.99, life: R(40, 80), size: R(2, 5),
        color: colors[i % colors.length], color2: '#b0a090', vr: R(-0.3, 0.3), floor: 0,
      });
  };

  FX.bolt = function (x, y, x2, y2, color = '#ff2030', color2 = '#000', life = 8, jag = 10) {
    FX.spawn('bolt', x, y, { x2, y2, life, size: jag, color, color2 });
  };

  FX.text = function (x, y, text, color = '#fff', outline = '#000', scale = 1, life = 50) {
    FX.spawn('text', x, y, { text, color, color2: outline, scale, life, vy: 0.6, drag: 0.94, fade: 1 });
  };

  FX.light = function (x, y, r, color, i = 1) {
    FX.lights.push({ x, y, r, c: color, i });
  };
})();

</script>
<script>/* src/engine/camera.js */
// 2D side-view fighting game camera with trauma-based shake, recoil kicks,
// zoom pulses and scripted cinematic overrides.
//
// World space: x right, y UP (y = 0 is the ground). Screen space: 640x360, y down.
//   screenX = (worldX - cam.x) * cam.zoom + W/2 + shakeX
//   screenY = (cam.y - worldY) * cam.zoom + H/2 + shakeY
// With the default cam.y = 142 and zoom = 1 the ground line sits at screen y = 322.
(function () {
  'use strict';
  const JJK = (typeof window !== 'undefined' ? window : globalThis).JJK;
  const U = JJK.U;
  const W = JJK.W, H = JJK.H;

  JJK.CAM_BASE_Y = 142;

  class Camera {
    constructor() {
      this.x = 0;
      this.y = JJK.CAM_BASE_Y;
      this.zoom = 1;

  // Sustained layer (runs until the loop stops). Returns {src, fl, g, am, plfo}.
  function sus(v, o) {

      if (o.fl.Q != null) r.fl.Q.value = o.fl.Q;
      node.connect(r.fl);
      node = r.fl;
    }
    if (o.dist) {

    out.connect(o.to || v.out);

    const a = sus(v, { src: 'sawtooth', f: 55, fl: { type: 'lowpass', f: 400, Q: 5 }, dist: 5, am: { f: 23, d: 0.45 }, g: 0.12, pan: -0.45 });
    const b = sus(v, { src: 'sawtooth', f: 58.3, fl: { type: 'lowpass', f: 400, Q: 5 }, dist: 5, am: { f: 31, d: 0.45 }, g: 0.12, pan: 0.45 });
    const n1 = sus(v, { src: 'white', fl: { type: 'bandpass', f: 1200, Q: 3 }, dist: 3, g: 0.12, pan: -0.4 });
    const n2 = sus(v, { src: 'white', fl: { type: 'bandpass', f: 2400, Q: 3 }, dist: 3, g: 0.12, pan: 0.4 });
    lfo(v, 0.31, 600, n1.fl.frequency);
    lfo(v, 0.23, 900, n2.fl.frequency);
    const cr = sus(v, { src: 'crackle', fl: { type: 'highpass', f: 1500 }, g: 0.15, rate: 1.2 });
    const sub = sus(v, { src: 'sine', f: 36, g: 0.3, am: { f: 6, d: 0.5 } });

      tf(v, a.fl.frequency, 350 + 2200 * x, k); tf(v, b.fl.frequency, 350 + 2200 * x, k);
      tg(v, a.g.gain, 0.1 + 0.08 * x, k); tg(v, b.g.gain, 0.1 + 0.08 * x, k);
      tg(v, a.am.o.frequency, 18 + 20 * x, k); tg(v, b.am.o.frequency, 25 + 24 * x, k);
      tg(v, n1.g.gain, 0.08 + 0.2 * x, k); tg(v, n2.g.gain, 0.08 + 0.2 * x, k);
      tg(v, cr.g.gain, 0.1 + 0.4 * x, k); tg(v, cr.src.playbackRate, (1 + x) * v.p, k);

    };
  };

  const DUMMY = Object.freeze({ setLevel() {}, stop() {}, level: 0 });
  function startLoop(E, name, o) {
    const c = E.ctx, fn = LOOPS[name];
    const v = voice(E, Object.assign({}, o, { vol: 1 }));
    v.srcs = [];
    const volume = lvl(name, o);
    v.out.gain.setValueAtTime(0, v.t0);
    v.out.gain.linearRampToValueAtTime(volume, v.t0 + (o.fadeIn != null ? Math.max(0.005, o.fadeIn) : 0.12));

      setLevel(x) {
        if (dead) return;
        level = clamp(+x || 0, 0, 1);
        set(level, 0.06);
      },
      get level() {
        return level;
      },
      stop(fade) {
        if (dead) return;
        dead = true;
        fade = fade == null ? 0.15 : Math.max(0.005, +fade || 0);
        if (timer) clearInterval(timer);
        const now = c.currentTime;
        hold(v.out.gain, now);
        v.out.gain.linearRampToValueAtTime(0, now + fade);
        v.srcs.forEach((s) => {
          try { s.stop(now + fade + 0.05); } catch (e) {}
        });
        if (E.live) setTimeout(() => disconnectVoice(v), (fade + 0.3) * 1000);
      },
    };
  }

  // ---------------------------------------------------------------- public API
  function fireUnlock() {
    for (let i = 0; i < unlockFns.length; i++) {
      try { unlockFns[i](); } catch (e) {}
    }
  }
  A.unlock = function () {
    if (!AC) return;
    if (!live) {
      let c = null;
      try { c = new AC({ latencyHint: 'interactive' }); } catch (e) {
        try { c = new AC(); } catch (e2) { return; }
      }
      const s = settings();
      if (s.musicVol != null) vol.music = clamp(+s.musicVol || 0, 0, 1);
      if (s.sfxVol != null) vol.sfx = clamp(+s.sfxVol || 0, 0, 1);
      try {
        live = makeEngine(c, false);
      } catch (e) {
        live = null;
        warnOnce('engine', 'audio init failed: ' + e);
        return;
      }
      live.live = true;
      try {
        c.addEventListener('statechange', () => {
          if (c.state === 'running') fireUnlock();
        });
      } catch (e) {}
      // iOS: start the output inside the gesture with a silent sample.
      try {
        const b = c.createBufferSource();
        b.buffer = c.createBuffer(1, 1, c.sampleRate);
        b.connect(c.destination);
        b.start(0);
      } catch (e) {}
      fireUnlock();
    }
    const st = live.ctx.state;
    if (st === 'suspended' || st === 'interrupted') {
      try {
        const p = live.ctx.resume();
        if (p && p.catch) p.catch(() => {});
      } catch (e) {}
    }
  };

  A.setVolumes = function (music, sfx) {
    if (music != null) vol.music = clamp(+music || 0, 0, 1);
    if (sfx != null) vol.sfx = clamp(+sfx || 0, 0, 1);
    if (!live) return;
    const t = live.ctx.currentTime;
    live.music.gain.setTargetAtTime(vol.music, t, 0.03);
    live.sfx.gain.setTargetAtTime(vol.sfx, t, 0.03);
    live.bypass.gain.setTargetAtTime(vol.sfx, t, 0.03);
  };

  const lastPlay = {};
  // opts: {vol=1, pitch=1, pan=0, bypassHush=false, delay=0}. Returns {stop(fade)} or null.
  A.play = function (name, opts) {
    if (!S[name]) {
      warnOnce('sfx:' + name, 'unknown sfx "' + name + '"');
      return null;
    }
    const E = live;
    if (!E || E.ctx.state === 'closed' || E.active > 96) return null;
    opts = opts || {};
    const now = E.ctx.currentTime;
    if (!opts.force && lastPlay[name] != null && now - lastPlay[name] < 0.012 && now >= lastPlay[name]) return null;
    lastPlay[name] = now;
    try {
      const v = playOn(E, name, opts);
      return {
        stop(fade) {
          const t = E.ctx.currentTime;
          hold(v.out.gain, t);
          v.out.gain.linearRampToValueAtTime(0, t + Math.max(0.005, fade == null ? 0.05 : +fade || 0));
        },
      };
    } catch (e) {
      warnOnce('err:' + name, 'sfx "' + name + '" failed: ' + e);
      return null;
    }
  };

  // opts: {vol=1, pitch=1, pan=0, level=0, bypassHush=false, fadeIn=0.12}
  A.loop = function (name, opts) {
    if (!LOOPS[name]) {
      warnOnce('loop:' + name, 'unknown loop "' + name + '"');
      return DUMMY;
    }
    if (!live || live.ctx.state === 'closed') return DUMMY;
    try {
      return startLoop(live, name, opts || {});
    } catch (e) {
      warnOnce('lerr:' + name, 'loop "' + name + '" failed: ' + e);
      return DUMMY;
    }
  };

  // Duck SFX + music to `depth` within ~40ms; hold for `seconds` then restore
  // (seconds <= 0 or Infinity: hold until unhush()). bypassHush sounds ignore it.
  A.hush = function (seconds, depth) {
    if (!live) return;
    depth = clamp(depth == null ? 0.05 : +depth || 0, 0, 1);
    const g = live.hush.gain, now = live.ctx.currentTime;
    hold(g, now);
    g.linearRampToValueAtTime(depth, now + 0.04);
    if (seconds > 0 && isFinite(seconds)) {
      g.setValueAtTime(depth, now + 0.04 + seconds);
      g.linearRampToValueAtTime(1, now + 0.04 + seconds + 0.3);
    }
  };
  A.unhush = function (fadeSec) {
    if (!live) return;
    const g = live.hush.gain, now = live.ctx.currentTime;
    hold(g, now);
    g.linearRampToValueAtTime(1, now + Math.max(0.005, fadeSec == null ? 0.05 : +fadeSec || 0));
  };

  // Muffle the whole mix: 0 = open, 1 = heavily muffled (~320 Hz).
  A.lowpass = function (amount, seconds) {
    if (!live || !live.muffle) return;
    const a = clamp(+amount || 0, 0, 1), f = a <= 0 ? live.maxF : live.maxF * Math.pow(320 / live.maxF, a);
    const p = live.muffle.frequency, now = live.ctx.currentTime;
    hold(p, now);
    p.exponentialRampToValueAtTime(f, now + Math.max(0.01, seconds == null ? 0.25 : +seconds || 0));
  };

  A.rumble = function (padIndex, strong, weak, ms) {
    try {
      const nav = root.navigator;
      const pads = nav && nav.getGamepads ? nav.getGamepads() : null;
      const gp = pads && pads[padIndex | 0];
      if (!gp) return;
      const s = clamp(+strong || 0, 0, 1), w = clamp(+weak || 0, 0, 1), d = Math.max(0, +ms || 0);
      const act = gp.vibrationActuator;
      if (act && act.playEffect) {
        const p = act.playEffect('dual-rumble', { startDelay: 0, duration: d, strongMagnitude: s, weakMagnitude: w });
        if (p && p.catch) p.catch(() => {});
      } else if (gp.hapticActuators && gp.hapticActuators[0] && gp.hapticActuators[0].pulse) {
        const p = gp.hapticActuators[0].pulse(Math.max(s, w), d);
        if (p && p.catch) p.catch(() => {});
      }
    } catch (e) {}
  };

  A.list = () => ({ sfx: Object.keys(S), loops: Object.keys(LOOPS) });
  A.has = (name) => !!(S[name] || LOOPS[name]);

  // ---------------------------------------------------------------- internal contract
  Object.defineProperty(A, 'ctx', { enumerable: true, get: () => (live ? live.ctx : null) });
  Object.defineProperty(A, 'ready', { enumerable: true, get: () => !!live && live.ctx.state === 'running' });
  Object.defineProperty(A, '_E', { get: () => live });
  Object.defineProperty(A, '_musicBus', { get: () => (live ? live.music : null) });
  Object.defineProperty(A, '_sfxBus', { get: () => (live ? live.sfx : null) });
  A._onUnlock = function (fn) {
    unlockFns.push(fn);
    if (live) {
      try { fn(); } catch (e) {}
    }
  };
  A._synth = { voice, L, finish, setP, T, mark, keep, comb, shaper, tanhCurve, crushCurve, makeIR, sus, lfo, tg, hold };
  // Offline engine for analysis. raw = true skips the master chain (true peaks).
  A._offline = function (seconds, raw, sr) {
    if (!OAC) return null;
    sr = sr || 44100;
    const c = new OAC(2, Math.ceil(sr * seconds), sr);
    const E = makeEngine(c, raw !== false);
    E.sfx.gain.value = 1;
    E.music.gain.value = 1;
    E.bypass.gain.value = 1;
    return { ctx: c, E };
  };
  // Render a one-shot or loop (opts.level) offline -> Promise<AudioBuffer|null>.
  A._render = function (name, opts, seconds, raw) {
    seconds = seconds || 6;
    const o = A._offline(seconds, raw);
    if (!o || !(S[name] || LOOPS[name])) return Promise.resolve(null);
    opts = Object.assign({ when: 0.01 }, opts);
    if (S[name]) playOn(o.E, name, opts);
    else startLoop(o.E, name, Object.assign({ horizon: seconds }, opts));
    return o.ctx.startRendering();
  };
})();

<script>/* src/engine/music.js */
// Procedural, sample-free music: a lookahead step sequencer (setInterval 25ms,
// scheduling ~0.12s ahead on the AudioContext clock) driving synthesized
// instruments (taiko, shamisen-ish plucks, synth bass, drums, pads, bells).
// Each track plays on its own "deck" (gain + private reverb) so switching
// tracks crossfades and cut() can silence everything instantly.
// Output: deck -> JJK.Audio._musicBus (musicVol) -> hush -> master chain.
(function () {
  'use strict';
  const JJK = (typeof window !== 'undefined' ? window : globalThis).JJK;
  const U = JJK.U;
  const M = (JJK.Music = {});
  const A = JJK.Audio;
  const S = A && A._synth;
  const LOOKAHEAD = 0.12, TICK_MS = 25;

  // ---------------------------------------------------------------- notes
  const NOTE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  const acc = (s) => (s === '#' ? 1 : s === 'b' ? -1 : 0);
  function nm(s) {
    const m = /^([A-G])(#|b)?(-?\d)$/.exec(s);
    return m ? 12 * (+m[3] + 1) + NOTE[m[1]] + acc(m[2]) : null;
  }
  const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
  // Bars of 16 tokens ("D5", "." rest, "-" tie) -> per-bar step index of {m, n}.
  function seq(bars) {
    return bars.map((str) => {
      const idx = new Array(16).fill(null);
      let last = null;
      str.trim().split(/\s+/).forEach((tk, i) => {
        if (tk === '-') {
          if (last) last.n++;
        } else if (tk === '.') last = null;
        else {
          const m = nm(tk);
          if (m == null || i > 15) return;
          last = { m, n: 1 };
          (idx[i] || (idx[i] = [])).push(last);
        }
      });
      return idx;
    });
  }
  const CHQ = {
    '': [0, 4, 7], m: [0, 3, 7], 7: [0, 4, 7, 10], m7: [0, 3, 7, 10], maj7: [0, 4, 7, 11],
    m9: [0, 3, 7, 10, 14], 9: [0, 4, 7, 10, 14], sus4: [0, 5, 7], dim: [0, 3, 6], 5: [0, 7],
  };
  const chordCache = {};
  function chord(name) {
    if (chordCache[name]) return chordCache[name];
    const m = /^([A-G])(#|b)?(.*)$/.exec(name);
    return (chordCache[name] = { pc: NOTE[m[1]] + acc(m[2]), iv: CHQ[m[3]] || CHQ[''] });
  }
  const rootAt = (pc, lo) => lo + ((((pc - lo) % 12) + 12) % 12);
  const tones = (ch, lo, n) => ch.iv.slice(0, n || 3).map((i) => rootAt(ch.pc, lo) + i);

  // ---------------------------------------------------------------- instruments
  const L = (v, o) => S.L(v, o);
  const fin = (v) => S.finish(v);
  function nv(d, t, vol, pan, rev) {
    const v = S.voice(d.E, { when: t, dest: d.dry, revDest: d.verbIn, vol, pan, nocount: true });
    if (rev) v.verb(rev);
    return v;
  }
  const X = {
    kick(d, t, g) {
      const v = nv(d, t, g);
      L(v, { src: 'sine', f: [[0, 165], [0.05, 55], [0.3, 42]], a: 0.001, d: 0.34, g: 0.75 });
      L(v, { src: 'triangle', f: [[0, 320], [0.02, 90]], a: 0.0005, d: 0.03, g: 0.25 });
      L(v, { src: 'white', fl: { type: 'highpass', f: 2500 }, a: 0.0005, d: 0.008, g: 0.2 });
      fin(v);
    },
    snare(d, t, g) {
      const v = nv(d, t, g, 0, 0.16);
      L(v, { src: 'white', fl: { type: 'bandpass', f: 1900, Q: 0.9 }, a: 0.001, d: 0.17, g: 0.55 });
      L(v, { src: 'white', fl: { type: 'highpass', f: 5000 }, a: 0.001, d: 0.07, g: 0.25 });
      L(v, { src: 'triangle', f: [[0, 240], [0.04, 175]], a: 0.001, d: 0.09, g: 0.35 });
      fin(v);
    },
    clap(d, t, g) {
      const v = nv(d, t, g, 0, 0.2);
      [0, 0.011, 0.023].forEach((x, i) => L(v, { src: 'white', t: x, fl: { type: 'bandpass', f: 1300, Q: 1.4 }, a: 0.0008, d: i === 2 ? 0.16 : 0.012, g: 0.5 }));
      fin(v);
    },
    hat(d, t, g, open, pan) {
      const v = nv(d, t, g, pan || 0);
