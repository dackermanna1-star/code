  };

  C.canBlock = function (def, h, srcX, fromAir) {
    if (h.guard === 'unblockable' || h.throw) return false;
    const st = def.st;
    const okState = st === 'idle' || st === 'walkB' || st === 'walkF' || st === 'guard' || st === 'cguard' || st === 'crouch' ||
      st === 'block' || st === 'ablock' || (st === 'air' && !def.move) || (st === 'land' && def.sf > 1) || st === 'prejump';
    if (!okState) return false;
    const d = def.buf.dir(0);
    const relH = d === 4 || d === 1 || d === 7 ? -1 : d === 6 || d === 3 || d === 9 ? 1 : 0;
    if (!relH) return false;
    const absH = relH * def.facing;
    const side = srcX > def.x ? 1 : srcX < def.x ? -1 : def.facing;
    if (absH !== -side) return false;
    const airborne = def.y > 0.5 || st === 'air' || st === 'ablock';
    if (airborne) return h.airBlockable !== false;
    const crouching = d === 1;
    if (h.guard === 'high' && crouching) return false;
    if (h.guard === 'low' && !crouching) return false;
    return true;
  };

  // Resolve a single contact. src: {x,y} origin of the attack (fighter or projectile)
  // Returns 'hit' | 'block' | 'parry' | 'nullified' | 'countered' | 'whiff'
  C.resolve = function (m, att, def, h, pt, ctx) {
    ctx = ctx || {};
    const src = ctx.proj || att;
    const kind = ctx.kind || (h.throw ? 'throw' : ctx.proj ? 'proj' : 'strike');
    const str = STR[h.str || 'm'];
    // character-specific interception (Infinity, Domain Amplification ...)
    if (def.def.preHit) {
      const r = def.def.preHit(def, att, h, { kind, pt, proj: ctx.proj, m });
      if (typeof r === 'string') return r;
      if (r && r.dmgMul) ctx.dmgMul = (ctx.dmgMul || 1) * r.dmgMul;
    }
    if (att.def.preDeal) {
      const r = att.def.preDeal(att, def, h, { kind, pt, proj: ctx.proj, m });
      if (typeof r === 'string') return r;
      if (r && r.dmgMul) ctx.dmgMul = (ctx.dmgMul || 1) * r.dmgMul;
    }
    // throws
    if (kind === 'throw') return C.throwConnect(m, att, def, h);
    // parry
    if (def.st === 'move' && def.move.parry && def.mf >= def.move.parry[0] && def.mf <= def.move.parry[1] && h.guard !== 'unblockable' && !h.noParry) {
      C.parry(m, att, def, h, pt, ctx);
      return 'parry';
    }
    // counter stances
    if (def.st === 'move' && def.move.counter && def.mf >= def.move.counter[0] && def.mf <= def.move.counter[1] && h.guard !== 'unblockable') {
      const types = def.move.counterTypes || ['strike'];
      if (types.includes(kind)) {
        if (def.move.onCounter(def, att, m, { h, pt, proj: ctx.proj }) !== false) return 'countered';
      }
    }
    if (C.canBlock(def, h, src.x, att.air)) {
      C.block(m, att, def, h, pt, ctx, str);
      return 'block';
    }
    C.hit(m, att, def, h, pt, ctx, str);
    return 'hit';
  };

  C.block = function (m, att, def, h, pt, ctx, str) {
    const proj = ctx.proj;
    const pgWin = 5 + (def.def.pgBonus || 0);
    const perfect = def.backHeld > 0 && def.backHeld <= pgWin && def.st !== 'block' && def.st !== 'ablock';
    const airborne = def.y > 0.5;
    const d = def.buf.dir(0);
    def.crouchBlock = !airborne && d === 1;
    def.st = airborne ? 'ablock' : 'block';
    def.sf = 0;
    def.move = null;
    def.stun = Math.max(1, Math.round((h.bs || 12) * (perfect ? 0.55 : 1)));
    def.setAnim(airborne ? 'ablock' : def.crouchBlock ? 'cblock' : 'block');
    // chip
    const dmgMul = (att.dmgMul ? att.dmgMul() : 1);
    let chip = h.chip != null ? h.chip : (h.tier || 1) >= 4 ? (h.dmg || 0) * 0.14 : 0;
    chip *= dmgMul;
    if (perfect) chip = 0;
    if (chip > 0) {
      chip = Math.round(chip);
      const canKO = (h.tier || 1) >= 6;
      def.hp = canKO ? def.hp - chip : Math.max(1, def.hp - chip);
      def.dmgTakenRound += chip;
    }
    // guard damage
    const gd = (h.gdmg != null ? h.gdmg : str.gdmg) * (perfect ? 0 : 1);
    def.guard -= gd;
    def.guardDelay = 70;
    // pushback
    const side = (proj ? proj.x : att.x) > def.x ? 1 : -1;
    const pb = (h.pb != null ? h.pb : str.pb) * (perfect ? 0.5 : 1);
    def.vx = -side * pb;
    if (airborne) { def.vy = Math.max(def.vy, 2); }
    if (!proj && Math.abs(def.x) >= JJK.WALL - 4 && Math.sign(def.x) === -side) att.vx = side * pb * 0.8;
    // hitstop
    const stop = Math.max(4, (h.stop || str.stop) - 2 + (perfect ? 5 : 0));
    def.hitstop = stop;
    if (!proj) { att.hitstop = stop; att.contact = 'block'; }
    else if (att.st === 'move') att.contact = att.contact || 'block';
    // meter
    att.meterGain((h.dmg || 10) * 0.12);
    def.meterGain(perfect ? 12 : 3 * (def.def.blockMeterMult || 1));
    if (perfect) def.dg = Math.min(100, def.dg + 1.5);
    // fx
    if (JJK.FX) {
      if (perfect) JJK.FX.perfectSpark(pt[0], pt[1]);
      else JJK.FX.blockSpark(pt[0], pt[1], side, def.def.blockColor || '#9fd8ff');
    }
    if (JJK.Audio) JJK.Audio.play(perfect ? 'perfect_guard' : (h.str === 'h' || h.str === 'x' || h.str === 's') ? 'block_heavy' : 'block', { pan: def.pan() });
    if (m.cam) m.cam.shake(perfect ? 0.12 : str.shake * 0.5);
    if (perfect) m.popText(def, 'PERFECT', '#bff8ff');
    if (def.guard <= 0) C.guardCrush(m, att, def);
    if (def.hp <= 0) m.onKO(def, att, h);
    m.onBlock(att, def, h, perfect);
  };

  C.guardCrush = function (m, att, def) {
    def.guard = 0;
    def.st = 'guardbreak'; def.sf = 0; def.stun = 48;
    def.setAnim('guardbreak');
    def.vx = -Math.sign(att.x - def.x || 1) * 3;
    def.hitstop = 16; att.hitstop = 16;
    def.guardDelay = 120;
    setTimeoutGuard(def);
    if (JJK.Audio) JJK.Audio.play('guard_break', { pan: def.pan() });
    if (JJK.FX) {
      const p = def.anchor('chest');
      JJK.FX.hitSpark(p[0], p[1], -def.facing, 1, '#7fd0ff');
      for (let i = 0; i < 18; i++) JJK.FX.spawn('debris', p[0], p[1], { vx: U.rand(-5, 5), vy: U.rand(-1, 6), ay: -0.35, life: 40, size: U.rand(2, 4), color: '#bfe8ff', color2: '#fff', vr: U.rand(-0.4, 0.4), floor: 0 });
    }
    m.popText(def, 'GUARD BREAK', '#ff6a3a');
    if (m.cam) m.cam.shake(0.4);
  };
  function setTimeoutGuard(def) { def.guardRefill = true; }

  C.parry = function (m, att, def, h, pt, ctx) {
    const proj = ctx.proj;
    def.hitstop = 14;
    def.move = null; def.st = 'idle'; def.sf = 0; def.setAnim('parry');
    def.inv = 6; def.invType = 'strike';
    def.meterGain(20);
    def.dg = Math.min(100, def.dg + 3);
    if (proj) {
      proj.dead = true;
    } else {
      att.hitstop = 14;
      att.st = 'stagger'; att.sf = 0; att.stun = 26; att.move = null; att.setAnim('stagger');
      att.vx = -att.facing * 2;
    }
    if (JJK.FX) {
      JJK.FX.perfectSpark(pt[0], pt[1]);
      JJK.FX.spawn('star', pt[0], pt[1], { life: 10, size: 40, size2: 10, color: '#fff', color2: '#ffe28a', shape: 6 });
    }
    if (JJK.Audio) JJK.Audio.play('parry', { pan: def.pan() });
    if (m.cam) { m.cam.shake(0.18); m.cam.zoomPulse(0.03); }
    m.popText(def, 'PARRY', '#ffe28a');
    m.flashScreen('#ffffff', 0.25, 4);
    m.onParry(def, att);
  };

  C.hit = function (m, att, def, h, pt, ctx, str) {
    const proj = ctx.proj;
    const wasAir = def.y > 0.5 || def.st === 'juggle' || def.st === 'air' || def.st === 'ablock';
    let ch = false, pc = false;
    if (def.st === 'move' && !def.move.noCH) {
      const ph = def.phase;
      if (ph === 'startup' || ph === 'active') ch = true;
      else if (ph === 'recovery') pc = true;
    } else if (def.st === 'prejump' || (def.st === 'land' && def.landLag > 4)) pc = true;
    // combo bookkeeping & damage scaling
    const combo = def.combo;
    if (combo.hits === 0) {
      combo.starter = h.starter != null ? h.starter : (h.tier || 1) === 1 ? 0.85 : 1;
      combo.time = 0;
    }
    combo.hits++;
    const hits = combo.hits;
    let scale = combo.starter * Math.max(MIN_SCALE, hits <= 2 ? 1 : 1 - (hits - 2) * 0.1);
    if (h.minScale) scale = Math.max(scale, h.minScale);
    const mvId = ctx.moveId || (att.move ? att.move.id : '');
    if (combo.used[mvId] && hits > 1 && !h.multi) scale *= 0.82;
    combo.used[mvId] = (combo.used[mvId] || 0) + 1;
    const dmgMul = (att.dmgMul ? att.dmgMul() : 1) * (def.dmgTakenMul ? def.dmgTakenMul() : 1);
    let blackFlash = false;
    if (!proj && att.bfArmed && (h.tier || 1) === 3) { blackFlash = true; att.bfArmed = false; }
    let dmg = (h.dmg || 0) * scale * (ch ? 1.2 : pc ? 1.1 : 1) * dmgMul * (blackFlash ? 2.5 : 1);
    if (ctx.dmgMul) dmg *= ctx.dmgMul;
    dmg = Math.max(h.dmg > 0 ? 1 : 0, Math.round(dmg));
    const t = m.training;
    def.hp -= dmg;
    def.dmgTakenRound += dmg;
    combo.dmg += dmg;
    if ((h.tier || 1) < 6) def.red = Math.min(def.red + dmg * 0.22, 200);
    def.redDelay = 150;
    if (t && t.infHp && def.cpuDummy) def.hp = Math.max(def.hp, 1);
    // stun with decay
    const decay = Math.max(0.5, 1 - combo.time / 360);
    let hs = Math.round(((h.hs || 16) + (ch ? 4 : pc ? 2 : 0)) * (wasAir ? decay : Math.max(0.7, decay)));
    // set state
    def.move = null;
    def.sf = 0;
    const away = (proj ? (proj.vx !== 0 ? Math.sign(proj.vx) : Math.sign(def.x - proj.x) || 1) : Math.sign(def.x - att.x) || att.facing);
    const launch = h.launch || (ch && h.chLaunch);
    if (wasAir || launch || h.kdGround) {
      def.st = 'juggle';
      def.air = true;
      def.y = Math.max(def.y, 1);
      const lv = launch ? (h.lv || 9) : h.av != null ? h.av : 5.5;
      def.vy = lv * (wasAir ? Math.max(0.75, decay) : 1);
      def.vx = away * (h.lx != null ? h.lx : launch ? 2 : 3.2);
      def.stun = Math.max(hs, launch ? 30 : 20);
      def.kd = h.hkd ? 'hard' : (launch || h.kd || wasAir) ? (h.hkd ? 'hard' : 'soft') : null;
      if (!launch && wasAir && !h.kd) def.kd = combo.hits > 1 ? 'soft' : null;
      combo.jug += h.jug != null ? h.jug : (h.tier || 1) >= 4 ? 3 : 2;
      def.setAnim('juggleUp');
    } else {
      def.st = 'hit';
      def.stun = hs;
      def.vx = away * (h.pb != null ? h.pb : str.pb);
      if (Math.abs(def.x) >= JJK.WALL - 4 && Math.sign(def.x) === away && !proj) att.vx = -away * (h.pb != null ? h.pb : str.pb) * 0.85;
      def.setAnim(h.ha === 'low' ? 'hitLow' : h.ha === 'mid' || (h.str === 'h' && !h.ha) ? 'hitMid' : 'hitHigh');
    }
    const wb = (h.wb || (ch && h.chWb)) && !combo.wb;
    const gb = (h.gb || (ch && h.chGb)) && !combo.gb && (def.st === 'juggle');
    def.bounce = wb ? (h.splat ? 'splat' : 'wall') : gb ? 'ground' : null;
    if (h.special && h.special(att, def, m, ctx) === 'skip') return;
    // hitstop
    const stop = (h.stop || str.stop) + (ch ? 3 : 0);
    def.hitstop = stop;
    if (!proj) { att.hitstop = stop; att.contact = 'hit'; }
    else if (att.st === 'move' && (!ctx.ownerless)) att.contact = att.contact || 'hit';
    def.flash = 2; def.flashK = 0.85;
    // meter / domain gauge
    att.meterGain(dmg * 0.5 + (ch ? 10 : 0) + (h.meter || 0));
    def.meterGain(dmg * 0.32);
    att.dg = Math.min(100, att.dg + dmg * 0.022);
    def.dg = Math.min(100, def.dg + dmg * 0.045);
    // fx
    const power = str.spark + (ch ? 0.2 : 0);
    if (JJK.FX) JJK.FX.hitSpark(pt[0], pt[1], away, Math.min(1.2, power), h.spark || att.def.hitColor || '#ffd27a');
    if (JJK.Audio) {
      JJK.Audio.play(ch ? 'hit_counter' : (h.sfx || str.sfx), { pan: def.pan() });
      if (JJK.Voice && (h.str !== 'l' || U.chance(0.35))) JJK.Voice.grunt(def.def.id, def.hp <= 0 ? 'ko' : str.grunt);
    }
    if (m.cam) {
      m.cam.shake(str.shake + (ch ? 0.08 : 0));
      if (h.str === 'h' || h.str === 'x' || h.str === 's') m.cam.zoomPulse(h.str === 'x' ? 0.05 : 0.025);
      if (h.kick) m.cam.kick(h.kick[0] * away, h.kick[1]);
    }
    if (JJK.Audio && h.str !== 'l') JJK.Audio.rumble(def.side, h.str === 'x' ? 1 : 0.5, 0.6, h.str === 'x' ? 300 : 120);
    if (blackFlash) C.blackFlash(m, att, def, pt);
    else if (ch && (h.tier || 1) >= 3 && !proj) m.impact(2, 0xffffffff); // anime impact frame on big counters
    if (ch) m.popText(att, 'COUNTER', '#ff4a3a', true);
    else if (pc) m.popText(att, 'PUNISH', '#ffb03a', true);
    m.onHit(att, def, h, { dmg, ch, pc, pt, proj });
    if (def.hp <= 0) m.onKO(def, att, h);
  };

  // Black Flash: cursed energy distortion within a millionth of a second of impact.
  C.blackFlash = function (m, att, def, pt) {
    def.hitstop += 10; att.hitstop += 10;
    att.meterGain(60);
    att.dg = Math.min(100, att.dg + 15);
    m.impact(4, 0xff000000);
    m.flashScreen('#000000', 0.5, 6);
    m.cam.shake(0.6);
    m.cam.zoomPulse(0.06);
    m.popText(att, 'BLACK FLASH', '#ff2020', true);
    if (JJK.FX) {
      for (let i = 0; i < 9; i++) {
        const a = Math.random() * Math.PI * 2, r = 50 + Math.random() * 60;
        JJK.FX.bolt(pt[0], pt[1], pt[0] + Math.cos(a) * r, pt[1] + Math.sin(a) * r, '#ff1a1a', '#000000', 12, 12);
      }
      JJK.FX.spawn('ring', pt[0], pt[1], { life: 16, size: 6, size2: 70, color: '#000000', w: 4 });
      JJK.FX.spawn('ring', pt[0], pt[1], { life: 18, size: 4, size2: 50, color: '#ff2020', w: 2, add: true });
    }
    if (JJK.Audio) { JJK.Audio.play('black_flash', { pan: def.pan() }); JJK.Audio.rumble(att.side, 1, 1, 300); }
  };

  // ----- throws ------------------------------------------------------------
  C.throwConnect = function (m, att, def, h) {
    const st = def.st;
    if (st === 'hit' || st === 'block' || st === 'juggle' || st === 'ablock' || def.y > 1 || st === 'air') return 'whiff';
    // throw vs throw = tech
    if (def.st === 'move' && def.move.isThrow && def.mf <= def.move.s + 1) {
      C.throwTech(m, att, def);
      return 'parry';
    }
    const back = att.buf.dir(0) === 4 || att.buf.dir(0) === 1;
    const id = h.throwMove || (back && att.def.moves.throwB ? 'throwB' : 'throwF');
    att.startMove(id, { free: true, data: { ex: !!h.ex } });
    def.st = 'grabbed'; def.sf = 0; def.move = null; def.vx = 0; def.vy = 0;
    def.thrower = att; def.techWindow = h.noTech ? 0 : 10;
    def.setAnim('grabbed');
    att.grab = def;
    att.hitstop = 2; def.hitstop = 2;
    if (JJK.Audio) JJK.Audio.play('throw_grab', { pan: def.pan() });
    return 'hit';
  };

  C.throwTech = function (m, att, def) {
    for (const f of [att, def]) {
      f.st = 'throwtech'; f.sf = 0; f.move = null; f.setAnim('techPush');
      f.vx = -f.facing * 5.5; f.hitstop = 8; f.grab = null; f.thrower = null;
      f.throwInv = 20;
      f.meterGain(5);
    }
    const mx = (att.x + def.x) / 2, my = 100;
    if (JJK.FX) JJK.FX.perfectSpark(mx, my);
    if (JJK.Audio) JJK.Audio.play('throw_tech');
    m.popText(def, 'THROW ESCAPE', '#bff8ff');
    if (m.cam) m.cam.shake(0.12);
  };

  // Generic throw release: deals damage and launches the victim.
  C.throwRelease = function (m, att, def, o) {
    if (def.st !== 'grabbed' && def.st !== 'thrown') return;
    def.thrower = null; att.grab = null;
    const h = Object.assign({ dmg: 110, str: 'h', tier: 3, hkd: true, kd: true, lv: o.lv || 6, lx: o.lx || 5, launch: true, ha: 'mid' }, o.h || {});
    def.st = 'idle';
    const pt = def.anchor('chest');
    C.hit(m, att, def, h, pt, { moveId: 'throw' }, STR[h.str]);
    def.st = 'juggle';
    def.kd = 'hard';
    def.vx = (o.dir || att.facing) * (o.lx || 5);
    def.vy = o.lv || 6;
    def.throwInv = 30;
    if (o.swap) def.facing = -def.facing;
  };
})();

<script>/* src/game/projectiles.js */
// Projectiles & timed entities (techniques). Each has an owner, a hit spec,
// a world AABB hitbox, a lifetime, optional custom update/draw, clash strength.
(function () {
  'use strict';
  const JJK = (typeof window !== 'undefined' ? window : globalThis).JJK;
  const U = JJK.U;

  let pid = 0;
  class Projectile {
    constructor(owner, o) {
      this.id = pid++;
      this.owner = owner;
      this.x = o.x; this.y = o.y;
      this.vx = o.vx || 0; this.vy = o.vy || 0;
      this.w = o.w || 12; this.h = o.h || 12; // half sizes (world units)
      this.life = o.life || 120; this.t = 0;
      this.hit = o.hit || null; // hit spec (see moves)
      this.hits = o.hits || 1; // number of hits before dying
      this.interval = o.interval || 8; // frames between multi-hits
      this.lastHit = -999;
      this.hp = o.hp != null ? o.hp : 1; // clash strength
      this.kind = o.kind || 'proj';
      this.type = o.type || 'generic';
      this.facing = o.facing || owner.facing;
      this.dead = false;
      this.data = o.data || {};
      this.onUpdate = o.update || null;
      this.onDraw = o.draw || null;
      this.onHit = o.onHit || null;
      this.onBlock = o.onBlock || null;
      this.onEnd = o.onEnd || null;
      this.onClash = o.onClash || null;
      this.pierce = !!o.pierce;
      this.layer = o.layer || 'front';
      this.noCollide = !!o.noCollide;
      this.bypassInf = !!o.bypassInf;
      this.reflectable = o.reflectable !== false;
      this.moveId = o.moveId || '';
      this.frozen = 0;
      this.stopped = false;
    }
    get box() { return [this.x - this.w, this.y - this.h, this.x + this.w, this.y + this.h]; }
    update(m) {
      if (this.frozen > 0) { this.frozen--; return; }
      this.t++;
      if (this.onUpdate) this.onUpdate(this, m);
      if (!this.stopped) { this.x += this.vx; this.y += this.vy; }
      if (this.t >= this.life) this.kill(m);
      if (Math.abs(this.x) > JJK.STAGE_HALF + 200) this.kill(m);
    }
    kill(m) {
      if (this.dead) return;
      this.dead = true;
      if (this.onEnd) this.onEnd(this, m);
    }
    draw(ctx, cam, m) {
      if (this.onDraw) this.onDraw(this, ctx, cam, m);
    }
  }
  JJK.Projectile = Projectile;

  // Collision step for all projectiles vs fighters and each other.
  JJK.updateProjectiles = function (m) {
    const list = m.projectiles;
    for (const p of list) if (!p.dead) p.update(m);
    // projectile clashes
    for (let i = 0; i < list.length; i++) {
      const a = list[i];
      if (a.dead || a.noCollide || a.kind === 'field') continue;
      for (let j = i + 1; j < list.length; j++) {
        const b = list[j];
        if (b.dead || b.noCollide || b.kind === 'field' || a.owner === b.owner) continue;
        if (!JJK.Combat.overlap(a.box, b.box)) continue;
        const ah = a.hp, bh = b.hp;
        a.hp -= bh; b.hp -= ah;
        const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
        if (JJK.FX) JJK.FX.hitSpark(cx, cy, 1, 0.7, '#ffffff');
        if (JJK.Audio) JJK.Audio.play('explosion', { vol: 0.6 });
        if (a.onClash) a.onClash(a, b, m);
        if (b.onClash) b.onClash(b, a, m);
        if (a.hp <= 0) a.kill(m);
        if (b.hp <= 0) b.kill(m);
      }
    }
    // vs fighters
    for (const p of list) {
      if (p.dead || !p.hit || p.noCollide) continue;
      if (p.hitsLeft === undefined) p.hitsLeft = p.hits;
      if (p.hitsLeft <= 0) continue;
      if (p.t - p.lastHit < p.interval) continue;
      for (const f of m.fighters) {
        if (f === p.owner) continue;
        if (f.invulnTo('proj', false)) continue;
        if (p.hit.ground && f.y > 2) continue;
        if (f.st === 'juggle' && f.combo.jug >= 16 && !p.hit.otg) continue;
        let touching = false;
        let pt = null;
        for (const hu of f.hurt) {
          if (JJK.Combat.overlap(p.box, hu)) {
            touching = true;
            pt = [(Math.max(p.box[0], hu[0]) + Math.min(p.box[2], hu[2])) / 2, (Math.max(p.box[1], hu[1]) + Math.min(p.box[3], hu[3])) / 2];
            break;
          }
        }
        if (!touching) continue;
        p.lastHit = p.t;
        const res = JJK.Combat.resolve(m, p.owner, f, p.hit, pt, { proj: p, kind: 'proj', moveId: p.moveId });
        if (res === 'nullified' || res === 'countered') { if (!p.pierce || res === 'countered') p.hitsLeft = 0; }
        else {
          p.hitsLeft--;
          if (res === 'hit' && p.onHit) p.onHit(p, f, m);
          if (res === 'block' && p.onBlock) p.onBlock(p, f, m);
        }
        if (p.hitsLeft <= 0 && !p.pierce) p.kill(m);
      }
    }
    for (let i = list.length - 1; i >= 0; i--) if (list[i].dead) list.splice(i, 1);
  };
})();

// Satoru Gojo — Limitless. Spatial control, teleportation, Infinity defense, explosive burst.
(function () {
  'use strict';
  const JJK = (typeof window !== 'undefined' ? window : globalThis).JJK;
  const U = JJK.U, B = JJK.BTN, Kit = JJK.Kit, FX = JJK.FX;
  const S = JJK.CHAR_SCALE;
  const A = Kit.A;
  const R = (a, b) => a + Math.random() * (b - a);
  const snd = (n, o) => JJK.Audio && JJK.Audio.play(n, o);

  const BLUE = '#3aa0ff', BLUE2 = '#8fe0ff', RED = '#ff3030', RED2 = '#ff9a7a', PURPLE = '#b050ff';

  // ---------------------------------------------------------------- helpers
  function technique(f) {
    return f.burnout <= 0 && !(f.match && f.match.domain && f.match.domain.noTech === f);
  }
  function hasProj(f, type) {
    return f.match && f.match.projectiles.some((p) => p.owner === f && p.type === type && !p.dead);
  }
  function handPos(f, which) { return f.anchor(which || 'fh'); }

  // ---------------------------------------------------------------- VFX
  function drawOrb(ctx, sx, sy, r, cols, t, wobble) {
    for (let i = 0; i < cols.length; i++) {
      const rr = r * (1 - i / cols.length) + (wobble ? Math.sin(t * 0.7 + i) * wobble : 0);
      FX.pxCircle(ctx, sx, sy, rr, cols[i]);
    }
  }
  function blueSpiral(x, y, rad, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const d = rad * R(0.6, 1);
      FX.spawn('px', x + Math.cos(a) * d, y + Math.sin(a) * d, {
        vx: -Math.cos(a) * d / 14 + Math.sin(a) * 1.5, vy: -Math.sin(a) * d / 14 - Math.cos(a) * 1.5,
        life: 14, size: R(1, 2.5), color: U.pick([BLUE2, '#ffffff', BLUE]), add: true, fade: 0.6,
      });
    }
  }
  function redBurstFx(m, x, y, power) {
    FX.spawn('flash', x, y, { life: 3, size: 12 + power * 18, size2: 4, color: '#ffffff', add: true });
    FX.spawn('glow', x, y, { life: 18, size: 60 + power * 80, size2: 10, color: RED, add: true });
    FX.spawn('ring', x, y, { life: 16, size: 8, size2: 60 + power * 90, color: RED2, w: 4, add: true });
    FX.spawn('ring', x, y, { life: 22, size: 6, size2: 40 + power * 70, color: RED, w: 2, add: true, delay: 3 });
    for (let i = 0; i < 20 + power * 30; i++) {
      const a = Math.random() * Math.PI * 2, sp = R(4, 12) * (0.6 + power);
      FX.spawn('spark', x, y, { vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, drag: 0.88, life: R(10, 22), size: 2, len: 2, color: U.pick([RED, RED2, '#ffd0c0']) });
    }
    FX.debris(x, Math.max(4, y - 30), 8 + power * 16, 1 + power);
    if (m.stage && m.stage.blast) m.stage.blast(x, y, 60 + power * 100, power);
    m.cam.shake(0.25 + power * 0.4);
    m.distort(x, y, 50 + power * 60, 1.25);
  }

  // ---------------------------------------------------------------- projectiles
  function spawnBlue(f, m, x, y, opts = {}) {
    const p = new JJK.Projectile(f, {
      x, y, vx: (opts.vx || 0.7) * f.facing, vy: opts.vy || 0, w: 16, h: 16, life: opts.life || 84, type: 'blue', kind: 'field',
      hits: 4, interval: 11, hp: 3, moveId: 'blue',
      hit: { dmg: 14, tier: 4, str: 's', hs: 16, bs: 10, stop: 5, pb: 0, chip: 3, gdmg: 4, spark: BLUE2, sfx: 'hit_m', lx: 0.5, av: 2, jug: 1, multi: true },
      update(p, m) {
        // pull the opponent and debris toward the core
        const o = m.opp(f);
        const dx = p.x - o.x, dy = p.y - (o.y + 70);
        const d = Math.hypot(dx, dy);
        const R2 = 170;
        if (d < R2 && !o.invulnTo('proj') && !(o.cs && o.cs.da) && o.st !== 'down' && o.st !== 'grabbed') {
          const k = (1 - d / R2) * 0.09;
          o.x += dx * k;
          if (o.y > 0 || o.st === 'juggle') o.y = Math.max(0, o.y + dy * k * 0.5);
        }
        if (p.t % 2 === 0) blueSpiral(p.x, p.y, 70, 3);
        if (p.t % 6 === 0 && m.stage && m.stage.pull) m.stage.pull(p.x, p.y, 150, 0.6, 8);
        if (p.t > p.life - 10) p.w = p.h = 16 * (p.life - p.t) / 10;
        if (p.t === 1) snd('blue_cast', { pan: f.pan() });
      },
      light(p) { FX.light(p.x, p.y, 120, [40, 110, 255], 1.1); },
      draw(p, ctx, cam, m) {
        const sx = cam.sx(p.x), sy = cam.sy(p.y), z = cam.ez;
        const grow = Math.min(1, p.t / 8) * (p.t > p.life - 10 ? (p.life - p.t) / 10 : 1);
        m.distort(p.x, p.y, 58 * grow, 0.8);
        FX.glow(ctx, sx, sy, 70 * z * grow, BLUE, 0.9);
        FX.glow(ctx, sx, sy, 26 * z * grow, '#bfe8ff', 1);
        drawOrb(ctx, sx, sy, 15 * z * grow, ['#0b1f7a', '#1f5fff', BLUE, BLUE2, '#ffffff'], p.t, 0.8);
        // swirl arcs
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = 'rgba(140,210,255,0.8)';
        ctx.lineWidth = 1;
        for (let i = 0; i < 4; i++) {
          const a0 = p.t * 0.25 + i * Math.PI / 2;
          ctx.beginPath();
          ctx.arc(sx, sy, (24 + i * 7) * z * grow, a0, a0 + 1.4);
          ctx.stroke();
        }
        ctx.restore();
      },
    });
    m.spawn(p);
    return p;
  }

  function spawnRed(f, m, x, y, o = {}) {
    const big = o.big;
    const p = new JJK.Projectile(f, {
      x, y, vx: (o.vx || 9.5) * f.facing, vy: o.vy || 0, w: big ? 34 : 13, h: big ? 34 : 13, life: big ? 90 : 70, type: big ? 'maxred' : 'red', hp: big ? 6 : 2,
      moveId: big ? 'maxRed' : 'red',
      hits: big ? 2 : 1, interval: 6,
      hit: big
        ? { dmg: 110, tier: 6, str: 'x', hs: 40, bs: 24, launch: true, lv: 6, lx: 11, wb: true, splat: true, chip: 24, gdmg: 30, spark: RED2, kick: [8, 0], minScale: 0.5, jug: 0 }
        : { dmg: 64, tier: 4, str: 's', hs: 30, bs: 18, launch: true, lv: 5, lx: 9, chip: 9, gdmg: 14, spark: RED2, kick: [5, 0] },
      update(p, m) {
        if (p.t % 1 === 0) FX.spawn('flame', p.x - p.vx * 0.5, p.y + R(-4, 4), { vx: -p.vx * 0.15, vy: R(-0.5, 0.5), life: 12, size: big ? 14 : 5, size2: 1, color: RED, color2: '#801010', add: true });
        if (big && p.t % 3 === 0 && m.stage && m.stage.impact) m.stage.impact(p.x, p.y, 0.4, 'red');
      },
      light(p) { FX.light(p.x, p.y, big ? 160 : 90, [255, 50, 30], big ? 1.3 : 1); },
      onHit(p, t, m) { redBurstFx(m, p.x, p.y, big ? 1 : 0.5); snd(big ? 'max_red' : 'red_burst', { pan: f.pan() }); },
      onBlock(p, t, m) { redBurstFx(m, p.x, p.y, big ? 0.7 : 0.3); snd('red_burst', { pan: f.pan(), vol: 0.7 }); },
      onEnd(p, m) { if (!p.hitOnce) { FX.spawn('ring', p.x, p.y, { life: 10, size: 4, size2: 30, color: RED2, w: 2, add: true }); } },
      draw(p, ctx, cam, m) {
        const sx = cam.sx(p.x), sy = cam.sy(p.y), z = cam.ez;
        const r = (big ? 34 : 12) * z;
        m.distort(p.x, p.y, (big ? 60 : 24), 1.2);
        FX.glow(ctx, sx, sy, r * 3.4, RED, 0.9);
        drawOrb(ctx, sx, sy, r, ['#5a0000', '#c00000', RED, RED2, '#ffffff'], p.t, big ? 1.5 : 0.6);
        // shock cone
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = 'rgba(255,120,100,0.7)';
        for (let i = 0; i < 3; i++) {
          const rr = r * (1.3 + i * 0.4 + (p.t % 6) * 0.08);
          ctx.beginPath();
          ctx.arc(sx, sy, rr, f.facing > 0 ? -0.9 : Math.PI - 0.9, f.facing > 0 ? 0.9 : Math.PI + 0.9);
          ctx.stroke();
        }
        ctx.restore();
      },
    });
    m.spawn(p);
    return p;
  }

  function spawnPurple(f, m, lvl) {
    const hand = handPos(f, 'fh');
    const rad = [0, 22, 38, 64][lvl];
    const p = new JJK.Projectile(f, {
      x: hand[0] + f.facing * rad * 0.6, y: Math.max(rad * 0.8, hand[1]), vx: (lvl === 3 ? 7.5 : 8.5) * f.facing, w: rad, h: rad, life: 160, type: 'purple', hp: 99, pierce: true,
      hits: lvl === 3 ? 4 : lvl === 2 ? 3 : 2, interval: 5, moveId: 'purple', bypassInf: true, reflectable: false,
      hit: {
        dmg: [0, 70, 80, 95][lvl], tier: 7, str: 'x', hs: 40, bs: 24, launch: true, lv: 7, lx: 9, wb: lvl >= 2, splat: lvl === 3,
        chip: [0, 12, 18, 0][lvl], gdmg: 40, spark: '#e0b0ff', guard: lvl === 3 ? 'unblockable' : 'mid', minScale: 0.6, jug: 0, multi: true, kick: [6, 0],
      },
      update(p, m) {
        if (p.t % 2 === 0) for (let i = 0; i < 2 + lvl; i++) {
          const a = Math.random() * Math.PI * 2;
          FX.spawn('px', p.x + Math.cos(a) * rad, p.y + Math.sin(a) * rad, { vx: -p.vx * 0.3 + R(-1, 1), vy: R(-1, 1), life: 18, size: 2, color: U.pick(['#e0b0ff', PURPLE, '#ffffff']), add: true });
        }
        if (m.stage) {
          if (p.t % 2 === 0 && m.stage.erase) m.stage.erase(p.x - 10, p.x + 10, p.y, rad * 1.3);
          if (p.t % 5 === 0 && m.stage.impact) m.stage.impact(p.x, p.y, 0.6, 'purple');
        }
        if (p.t % 4 === 0) FX.debris(p.x, Math.max(4, p.y - rad), 3, 1.4, ['#6a5a52', '#3a2a44', '#b080ff']);
        m.cam.shake(0.04 * lvl);
      },
      light(p) { FX.light(p.x, p.y, 120 + lvl * 50, [180, 60, 255], 1.3); },
      onHit(p, t, m) {
        FX.spawn('flash', p.x, p.y, { life: 4, size: rad, size2: 4, color: '#fff', add: true });
        snd('purple_impact', { pan: f.pan() });
        m.cam.shake(0.3 + lvl * 0.15);
        if (lvl === 3) m.impact(3, 0xffffffff);
      },
      draw(p, ctx, cam, m) {
        const sx = cam.sx(p.x), sy = cam.sy(p.y), z = cam.ez;
        const r = rad * z * Math.min(1, p.t / 6);
        m.distort(p.x, p.y, rad * 1.6, 0.75);
        FX.glow(ctx, sx, sy, r * 3, PURPLE, 1);
        FX.glow(ctx, sx, sy, r * 1.6, '#ffd8ff', 0.8);
        // crackling rim
        ctx.save();
        ctx.fillStyle = '#e8c8ff';
        for (let i = 0; i < 40; i++) {
          const a = Math.random() * Math.PI * 2, rr = r * R(0.95, 1.15);
          ctx.fillRect(Math.round(sx + Math.cos(a) * rr), Math.round(sy + Math.sin(a) * rr), 2, 2);
        }
        ctx.restore();
        drawOrb(ctx, sx, sy, r, ['#1a0030', '#4a0080', '#8a2ae0', PURPLE, '#e0b0ff', '#ffffff'], p.t, 1.2);
        // blue & red cores still visible inside, swirling
        const a = p.t * 0.4;
        FX.pxCircle(ctx, sx + Math.cos(a) * r * 0.35, sy + Math.sin(a) * r * 0.35, r * 0.18, BLUE2);
        FX.pxCircle(ctx, sx - Math.cos(a) * r * 0.35, sy - Math.sin(a) * r * 0.35, r * 0.18, RED2);
      },
    });
    m.spawn(p);
    return p;
  }

  // ---------------------------------------------------------------- teleport
  function teleportFx(m, f, x, y) {
    FX.spawn('flash', x, y + 80, { life: 4, size: 26, size2: 2, color: '#ffffff', add: true });
    FX.spawn('ring', x, y + 80, { life: 12, size: 30, size2: 2, color: BLUE2, w: 2, add: true });
    for (let i = 0; i < 14; i++) FX.spawn('line', x + R(-16, 16), y + R(10, 160), { x2: x + R(-16, 16), y2: y + R(10, 160), life: 6, size: 1, color: '#bfe8ff' });
    for (let i = 0; i < 10; i++) FX.spawn('px', x + R(-20, 20), y + R(20, 150), { vx: R(-2, 2), vy: R(-2, 2), life: 16, size: 2, color: U.pick([BLUE2, '#fff']), add: true });
    m.distort(x, y + 90, 50, 0.85);
  }
  function blinkTo(f, m, x, y) {
    teleportFx(m, f, f.x, f.y);
    f.x = U.clamp(x, -JJK.WALL, JJK.WALL);
    if (y != null) { f.y = y; f.air = y > 0; }
    teleportFx(m, f, f.x, f.y);
    snd('teleport', { pan: f.pan() });
  }

  // ---------------------------------------------------------------- moves
  const moves = Object.assign(Kit.commonMoves(), {
    dashF: {
      name: 'Spatial Step', tier: 0, s: 1, a: 0, r: 0, total: 17, noCH: true, smear: false,
      inv: [[3, 8, 'all']],
      anim: [[0, 'blink0', 'out'], [5, 'blink1', 'snap'], [17, 'idle', 'inOut']],
      tick(f, m, mf) {
        if (mf === 3) { f.invisible = true; f.afterT = 6; }
        if (mf === 6) {
          const o = m.opp(f);
          let nx = f.x + f.facing * 95;
          // don't blink through the opponent's body: stop just in front
          if (Math.sign(o.x - f.x) === f.facing && Math.abs(o.x - f.x) < 95 + 36) nx = o.x - f.facing * 36;
          blinkTo(f, m, nx);
        }
        if (mf === 7) f.invisible = false;
      },
      onEnd(f) { f.invisible = false; },
    },
    dashB: {
      name: 'Back Step', tier: 0, s: 1, a: 0, r: 0, total: 20, noCH: true, smear: false,
      inv: [[1, 9, 'all']],
      anim: [[0, 'blink0', 'out'], [6, 'blink1', 'snap'], [20, 'idle', 'inOut']],
      tick(f, m, mf) {
        if (mf === 2) { f.invisible = true; }
        if (mf === 5) blinkTo(f, m, f.x - f.facing * 90);
        if (mf === 6) f.invisible = false;
      },
      onEnd(f) { f.invisible = false; },
    },
    airdashF: {
      name: 'Air Step', tier: 0, s: 1, a: 0, r: 0, total: 16, air: true, noGrav: 14, smear: false, keepVel: false,
      anim: [[0, 'airBlink'], [16, 'jumpTop']],
      tick(f, m, mf) {
        if (mf === 1) { f.vy = 0; f.vx = 0; f.invisible = true; }
        if (mf === 3) blinkTo(f, m, f.x + f.facing * 90);
        if (mf === 4) f.invisible = false;
        if (mf <= 14) f.vy = 0;
        if (mf === 14) f.vx = f.facing * 2;
      },
      onEnd(f) { f.invisible = false; f.st = 'air'; },
      land: 4,
    },
    airdashB: {
      name: 'Air Back Step', tier: 0, s: 1, a: 0, r: 0, total: 16, air: true, noGrav: 14, smear: false,
      anim: [[0, 'airBlink'], [16, 'jumpTop']],
      tick(f, m, mf) {
        if (mf === 1) { f.vy = 0; f.vx = 0; f.invisible = true; }
        if (mf === 3) blinkTo(f, m, f.x - f.facing * 80);
        if (mf === 4) f.invisible = false;
        if (mf <= 14) f.vy = 0;
      },
      onEnd(f) { f.invisible = false; },
      land: 4,
    },
    throwF: {
      name: 'Blue Toss', tier: 3, s: 1, a: 0, r: 0, total: 36, noCH: true,
      anim: [[0, 'throwReach'], [8, 'pull0', 'out'], [16, 'palm1', 'snap'], [36, 'idle', 'inOut']],
      tick(f, m, mf) {
        const v = f.grab;
        if (!v) return;
        const p = f.anchor('fh');
        if (mf < 16) { v.x = f.x + f.facing * 54; v.y = 0; v.facing = -f.facing; v.setAnim('grabbed'); }
        if (mf === 16) {
          JJK.Combat.throwRelease(m, f, v, { lx: 9, lv: 5, dir: f.facing, h: { dmg: 105, wb: true, spark: BLUE2 } });
          blueSpiral(p[0], p[1], 50, 14);
          snd('blue_pull', { pan: f.pan() });
          m.cam.kick(f.facing * 3, 0);
        }
      },
    },
    throwB: {
      name: 'Spatial Swap', tier: 3, s: 1, a: 0, r: 0, total: 40, noCH: true,
      anim: [[0, 'throwReach'], [10, 'pull1', 'out'], [20, 'kick1', 'snap'], [40, 'idle', 'inOut']],
      tick(f, m, mf) {
        const v = f.grab;
        if (!v) return;
        if (mf < 12) { v.x = f.x + f.facing * 54; v.y = 0; v.facing = -f.facing; }
        if (mf === 12) {
          // Blue drags them through to the other side
          teleportFx(m, v, v.x, v.y);
          v.x = f.x - f.facing * 56;
          v.facing = f.facing;
          f.facing = -f.facing;
          teleportFx(m, v, v.x, v.y);
          snd('teleport', { pan: f.pan() });
        }
        if (mf === 20) JJK.Combat.throwRelease(m, f, v, { lx: 8, lv: 6, dir: f.facing, h: { dmg: 115, spark: BLUE2 } });
      },
    },

    // ---- normals
    '5L': {

  // Pull defender in front of the attacker (used by Blue moves).
  function pullTo(att, def, m, dist) {
    const from = def.x;
    def.x = U.clamp(att.x + att.facing * dist, -JJK.WALL, JJK.WALL);
    def.y = Math.max(0, def.y * 0.3);
    def.vx = 0;
    def.facing = -att.facing;
    for (let i = 0; i < 10; i++) {
      const t = i / 10;
      FX.spawn('px', U.lerp(from, def.x, t), def.y + 90 + R(-20, 20), { vx: att.facing * -2, life: 12, size: 2, color: BLUE2, add: true });
    }
    def.afterT = 6; def.afterCol = '#4aa8ff';
    m.distort(def.x, def.y + 90, 60, 0.8);
  }

  // Hollow Purple charge logic: hold SU to raise the level (limited by meter).
  function purpleTick(f, m, mf) {
    const d = f.moveData;
    const holding = (f.buf.held(0) & B.SU) || (f.cpu && f.cpu.holdSU);
    const nh = f.anchor('nh'), fh = f.anchor('fh');
    const lvlMax = f.canAfford(300) ? 3 : f.canAfford(200) ? 2 : 1;
    d.charge++;
    // level thresholds
    const need = [0, 22, 60, 110];
    const lvl = d.charge >= need[3] && lvlMax >= 3 ? 3 : d.charge >= need[2] && lvlMax >= 2 ? 2 : 1;
    if (lvl !== d.lvl) {
      d.lvl = lvl;
      snd('charge_level', { pitch: 1 + lvl * 0.2 });
      FX.spawn('ring', f.x, f.y + 95, { life: 18, size: 10, size2: 70 + lvl * 20, color: PURPLE, w: 3, add: true });
      m.popText(f, 'LV ' + lvl, '#e0b0ff');
    }
    const k = Math.min(1, d.charge / 110);
    // visuals: blue in the rear hand, red in the lead hand, orbiting & growing
    const orbit = d.charge * (0.15 + k * 0.25);
    const rB = 6 + k * 14, rR = 6 + k * 14;
    d.bx = nh[0] + Math.cos(orbit) * 6 * k; d.by = nh[1] + Math.sin(orbit) * 6 * k;
    d.rx = fh[0] - Math.cos(orbit) * 6 * k; d.ry = fh[1] - Math.sin(orbit) * 6 * k;
    d.rB = rB; d.rR = rR; d.k = k;
    blueSpiral(d.bx, d.by, 40 + k * 30, 1 + Math.floor(k * 3));
    if (d.charge % 2 === 0) FX.spawn('px', d.rx + R(-10, 10), d.ry + R(-10, 10), { vx: R(-3, 3), vy: R(-3, 3), life: 10, size: 2, color: U.pick([RED, RED2]), add: true });
    f.hairLift = k * 6;
    m.cam.shake(0.01 + k * 0.04);
    if (f.cs.purpleSnd) f.cs.purpleSnd.setLevel(k);
    if (JJK.Audio && d.charge % 20 === 0) JJK.Audio.rumble(f.side, k * 0.6, k, 300);
    if (m.stage && m.stage.pull && d.charge % 10 === 0) m.stage.pull(f.x, f.y + 100, 200, k, 10);
    if (m.stage) m.stage.darken = Math.max(m.stage.darken || 0, k * 0.4);
    const minT = need[1];
    if ((holding && d.charge < 170) || d.charge < minT) return 'hold';
    // release
    const cost = [0, 100, 200, 300][d.lvl];
    if (!f.spend(cost)) { d.lvl = 1; f.spend(100); }
    if (f.cs.purpleSnd) { f.cs.purpleSnd.stop(0.05); f.cs.purpleSnd = null; }
    f.startMove('purpleFire', { free: true, data: d });
    f.moveData = d;
    if (d.lvl >= 2) {
      if (d.lvl === 3) purpleCinematic(f, m);
      else m.superFlash(f, 'HOLLOW PURPLE', { dur: 30, zoom: 1.35, color: PURPLE });
    }
    if (JJK.Voice) JJK.Voice.say('gojo', 'purple');
    return 'stop';
  }

  // Full cinematic for Maximum Output Hollow Purple.
  function purpleCinematic(f, m) {
    const head = f.anchor('head');
    const dur = 130;
    m.cinematic({
      dur, letterbox: 30, fighters: false, dark: 0.85,
      start(m) { if (JJK.Audio) JJK.Audio.play('domain_activate', { vol: 0.5 }); f.eyesOpen = true; },
      update(m, t) {
        const cam = m.cam;
        if (t < 70) {
          cam.override = { x: head[0] + f.facing * 10, y: head[1] - 18, zoom: 3.1, speed: 0.2 };
        } else if (t < 96) {
          cam.override = { x: f.x + f.facing * 60, y: JJK.CAM_BASE_Y + 20, zoom: 1.5, speed: 0.2 };
        } else {
          cam.override = { x: U.clamp(f.x + f.facing * 160, -cam.limit, cam.limit), y: JJK.CAM_BASE_Y + 30, zoom: 0.78, speed: 0.15 };
        }
        f.hairLift = 8;
        const d = f.moveData;
        // orbit blue & red into a merge
        const nh = f.anchor('fh');
        const k = U.clamp((t - 20) / 50, 0, 1);
        const ang = t * 0.25;
        const rad = 30 * (1 - k);
        d.cbx = nh[0] + f.facing * 26 + Math.cos(ang) * rad; d.cby = nh[1] + 10 + Math.sin(ang) * rad;
        d.crx = nh[0] + f.facing * 26 - Math.cos(ang) * rad; d.cry = nh[1] + 10 - Math.sin(ang) * rad;
        d.cm = k;
        if (t === 66) { snd('purple_fire'); m.flashScreen('#ffffff', 0.9, 10); m.cam.shake(0.6); }
        if (t % 3 === 0) blueSpiral(d.cbx, d.cby, 40, 2);
      },
      draw(ctx, m, t) {
        const d = f.moveData;
        const cam = m.cam;
        if (t < 70 && d.cbx != null) {
          const r = 8 * cam.ez * (1 + d.cm);
          FX.glow(ctx, cam.sx(d.cbx), cam.sy(d.cby), r * 4, BLUE, 1);
          FX.pxCircle(ctx, cam.sx(d.cbx), cam.sy(d.cby), r, BLUE2);
          FX.glow(ctx, cam.sx(d.crx), cam.sy(d.cry), r * 4, RED, 1);
          FX.pxCircle(ctx, cam.sx(d.crx), cam.sy(d.cry), r, RED2);
          if (d.cm > 0.6) FX.glow(ctx, cam.sx((d.cbx + d.crx) / 2), cam.sy((d.cby + d.cry) / 2), r * 8 * d.cm, PURPLE, d.cm);
        }
        // chant text
        const lines = ['PHASE.', 'TWILIGHT.', 'EYES OF WISDOM.'];
        for (let i = 0; i < 3; i++) {
          const t0 = 6 + i * 18;
          if (t > t0 && t < 72) JJK.Font.draw(ctx, lines[i], 40 + i * 8, 250 + i * 14, { color: '#e0d0ff', outline: '#200030' });
        }
        if (t > 72 && t < 128) {
          const b = JJK.Font.banner('HOLLOW PURPLE', { scale: 5, top: '#ffffff', mid: '#e0a0ff', mid2: '#b050ff', bot: '#40007a', outline: '#10001a' });
          if (b) ctx.drawImage(b, Math.round(320 - b.width / 2), 96);
          JJK.Font.draw(ctx, 'IMAGINARY TECHNIQUE', 320, 84, { color: '#d0b0ff', align: 'center', outline: '#000', scale: 2 });
        }
      },
      onEnd(m) { f.eyesOpen = false; },
    });
  }

  // ---------------------------------------------------------------- Infinity
  function preHit(def, att, h, info) {
    const cs = def.cs;
    if (!cs.infOn || cs.infSuspended || def.burnout > 0) return null;
    if (h.bypassInf || (info.proj && info.proj.bypassInf)) return null;
    if (att.cs && att.cs.da && info.kind !== 'proj') {
      // Domain Amplification neutralizes Infinity on contact
      if (info.m && def.sf % 4 === 0) FX.spawn('ring', info.pt[0], info.pt[1], { life: 8, size: 4, size2: 20, color: '#202030', w: 2 });
      return null;
    }
    const m = info.m;
    if (m.domain && m.domain.type === 'shrine') return null; // sure-hit
    const dmg = h.dmg || 10;
    let cost = 6 + dmg * 0.34 + (info.kind === 'throw' ? 10 : 0);
    if (def.st === 'move' && def.move && def.move.tier < 4) cost *= 1.5; // harder to maintain while attacking
    if (cost > cs.inf) {
      // overwhelmed: Infinity shatters, the attack goes through with reduced force
      breakInfinity(def, m);
      return null;
    }
    cs.inf -= cost;
    def.meterGain(4);
    const pt = info.pt;
    // the attack slows to a crawl and never arrives
    if (info.proj) {
      const p = info.proj;
      p.stopped = true; p.frozen = 20; p.noCollide = true;
      setTimeout0(m, 20, () => { p.kill(m); FX.spawn('ring', p.x, p.y, { life: 12, size: 4, size2: 26, color: '#dff4ff', w: 1, add: true }); });
    } else {
      att.slowT = 22; att.timeScale = 0.12;
      att.hitstop = 2;
      att.vx = 0;
      if (att.st === 'move') att.contact = 'block';
    }
    FX.spawn('ring', pt[0], pt[1], { life: 18, size: 2, size2: 30, color: '#dff4ff', w: 1, add: true });
    FX.spawn('ring', pt[0], pt[1], { life: 24, size: 2, size2: 18, color: '#9fd8ff', w: 1, add: true, delay: 4 });
    m.distort(pt[0], pt[1], 28, 0.9);
    snd('infinity_stop', { pan: def.pan() });
    cs.stopFx = 20; cs.stopPt = pt;
    if (info.kind === 'throw') return 'nullified';
    return 'nullified';
  }

  function setTimeout0(m, frames, fn) {
    m.events.push({ t: frames, fn });
  }

  function breakInfinity(f, m) {
    const cs = f.cs;
    cs.infOn = false; cs.inf = 0; cs.infBroken = true;
    const p = f.anchor('chest');
    for (let i = 0; i < 24; i++) FX.spawn('debris', p[0] + R(-30, 30), p[1] + R(-50, 50), { vx: R(-5, 5), vy: R(-2, 6), ay: -0.3, life: 40, size: R(2, 4), color: '#dff4ff', color2: '#ffffff', vr: R(-0.4, 0.4), floor: 0 });
    FX.spawn('ring', p[0], p[1], { life: 16, size: 60, size2: 10, color: '#dff4ff', w: 2, add: true });
    snd('infinity_break', { pan: f.pan() });
    m.popText(f, 'INFINITY BROKEN', '#9fd8ff', true);
    m.cam.shake(0.25);
    if (f.st !== 'move' || (f.move && f.move.tier < 6)) {
      f.st = 'stagger'; f.sf = 0; f.stun = 18; f.move = null; f.setAnim('stagger');
    }
  }

  // ---------------------------------------------------------------- definition
  const commands = [
    { id: 'domain', b: B.SP | B.SU, chord: true, air: 'both' },
    { id: 'purple', m: '623', b: B.SU },
    { id: 'maxRed', m: '214', b: B.SU },
    { id: 'blueCrush', m: '236', b: B.SU },
    { id: 'exRedBurst', b: B.SU, dir: [1, 2, 3] },
    { id: 'redCounter', b: B.SU, dir: [4] },
    { id: 'blue', m: '236', b: B.SP },
    { id: 'red', m: '214', b: B.SP },
    { id: 'teleport', m: '22', b: B.SP },
    { id: 'jBlue', m: '236', b: B.SP, air: true },
    { id: 'jRed', m: '214', b: B.SP, air: true },
    { id: 'jTeleport', m: '22', b: B.SP, air: true },
    { id: 'redLaunch', b: B.SP, dir: [1, 2, 3] },
    { id: 'blueCounter', b: B.SP, dir: [4] },
    { id: 'blueRush', b: B.SP, dir: [6] },
    { id: 'bluePull', b: B.SP },
    { id: 'jTeleport', b: B.SP, air: true, dir: [1, 2, 3] },
    { id: 'jBlue', b: B.SP, air: true },
  ].concat(Kit.normalsCommands());

  const def = {
    id: 'gojo', name: 'GOJO', full: 'SATORU GOJO', title: 'THE STRONGEST',
    art: JJK.Art.gojo,
    domainType: 'void',
    color: '#7fd8ff',
    hitColor: '#cfeeff',
    blockColor: '#9fd8ff',
    afterColor: '#4aa8ff',
    smearMat: U.mat('#dff2ff', { emissive: 1, light: '#ffffff', shadow: '#bfe2ff', deep: '#9fd0ff' }),
    pgBonus: 3, // Six Eyes: wider perfect guard window
    blockMeterMult: 1.5,
    stats: { hp: 1000, walkF: 2.7, walkB: 2.2, runSpeed: 0, jumpV: 11.2, jumpVx: 4.1, grav: 0.55, prejump: 3, airActions: 2 },
    poses: JJK.Poses.gojo,
    anims: Kit.baseAnims(),
    moves: Kit.build(moves),
    commands: [],
    initState(f) {
      return { inf: 100, infOn: false, infBroken: false, infSuspended: false, tpCd: 0, stopFx: 0, purpleSnd: null, hum: null };
    },
    update(f, m) {
      const cs = f.cs;
      if (cs.tpCd > 0) cs.tpCd--;
      if (cs.stopFx > 0) cs.stopFx--;
      // toggle Infinity with the Unique button
      if (f.buf.pr(0) & B.UN && !m.inputLocked && !f.isStunned() && f.st !== 'cinematic') {
        if (cs.infOn) {
          cs.infOn = false;
          snd('infinity_off', { pan: f.pan() });
        } else if (!cs.infBroken && cs.inf >= 25 && f.burnout <= 0) {
          cs.infOn = true;
          snd('infinity_on', { pan: f.pan() });
          FX.spawn('ring', f.x, f.y + 95, { life: 16, size: 70, size2: 30, color: '#dff4ff', w: 1, add: true });
          if (JJK.Voice && U.chance(0.3)) JJK.Voice.say('gojo', 'infinity');
        } else if (JJK.Audio) JJK.Audio.play('ui_error', { vol: 0.4 });
      }
      if (f.burnout > 0) cs.infOn = false;
      const t = m.training;
      if (cs.infOn && !cs.infSuspended) {
        cs.inf -= 4.5 / 60;
        if (cs.inf <= 0) { cs.inf = 0; cs.infOn = false; snd('infinity_off'); }
      } else if (!cs.infOn) {
        cs.inf = Math.min(100, cs.inf + (cs.infBroken ? 9 : 12) / 60);
        if (cs.infBroken && cs.inf >= 100) { cs.infBroken = false; m.popText(f, 'INFINITY READY', '#dff4ff'); }
      }
      if (t && t.infMeter) cs.inf = Math.max(cs.inf, cs.infOn ? 100 : cs.inf);
      // hum loop while active
      if (cs.infOn && !cs.hum && JJK.Audio) cs.hum = JJK.Audio.loop('infinity_hum', { vol: 0.5 });
      if (!cs.infOn && cs.hum) { cs.hum.stop(0.3); cs.hum = null; }
      // hand glow particles
      if (f.visible && !f.invisible && m.frame % 3 === 0 && JJK.HEADLESS !== true) {
        const h = f.anchor(f.facing > 0 ? 'fh' : 'fh');
        FX.spawn('px', h[0] + R(-4, 4), h[1] + R(-3, 5), { vy: R(0.4, 1.2), vx: R(-0.3, 0.3), life: 14, size: R(1, 2.5), color: U.pick([BLUE2, BLUE, '#ffffff']), add: true });
      }
    },
    preHit,
    lights(f, m) {
      if (!f.visible || f.invisible) return;
      const h = f.anchor('fh');
      FX.light(h[0], h[1], 46, [40, 120, 255], 0.55);
      if (f.st === 'move' && f.move && (f.move.id === 'purple') && f.moveData.bx != null) {
        const d = f.moveData;
        FX.light(d.bx, d.by, 90 + d.k * 80, [40, 110, 255], 1.2);
        FX.light(d.rx, d.ry, 90 + d.k * 80, [255, 50, 30], 1.2);
      }
    },
    auraColor(f) {
      const cs = f.cs;
      if (cs.infOn && !cs.infSuspended) return (f.match && f.match.frame % 20 < 10) ? U.pack(210, 240, 255) : U.pack(150, 210, 255);
      if (f.burnout > 0) return U.pack(60, 60, 70);
      return 0;
    },
    drawFx(f, ctx, cam, m) {
      if (!f.visible || f.invisible) return;
      const z = cam.ez;
      // fist glow (reference: blue cursed energy around the hands)
      for (const a of ['fh', 'nh']) {
        const h = f.anchor(a);
        const sx = cam.sx(h[0]), sy = cam.sy(h[1]);
        FX.glow(ctx, sx, sy, (a === 'fh' ? 16 : 11) * z, BLUE, 0.75);
      }
      // Infinity field
      const cs = f.cs;
      if (cs.infOn && !cs.infSuspended) {
        const c = f.anchor('chest');
        const sx = cam.sx(c[0]), sy = cam.sy(c[1]);
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.18 + 0.06 * Math.sin(m.frame * 0.1);
        ctx.strokeStyle = '#dff4ff';
        ctx.lineWidth = 1;
        for (let i = 0; i < 3; i++) {
          const rr = (62 + i * 9 + ((m.frame * 0.6 + i * 20) % 18)) * z;
          ctx.beginPath();
          ctx.ellipse(sx, sy + 10 * z, rr * 0.75, rr, 0, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();
      }
      if (cs.stopFx > 0 && cs.stopPt) {
        const p = cs.stopPt;
        m.distort(p[0], p[1], 22, 0.92);
      }
      // Purple charge orbs
      if (f.st === 'move' && f.move && f.move.id === 'purple' && f.moveData.bx != null) {
        const d = f.moveData;
        // the whole screen brightens as the charge builds
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = `rgba(120,60,200,${(d.k || 0) * (0.08 + 0.04 * d.lvl)})`;
        ctx.fillRect(0, 0, JJK.W, JJK.H);
        ctx.restore();
        const rB = d.rB * z, rR = d.rR * z;
        m.distort(d.bx, d.by, d.rB * 2.5, 0.8);
        m.distort(d.rx, d.ry, d.rR * 2.5, 1.2);
        FX.glow(ctx, cam.sx(d.bx), cam.sy(d.by), rB * 4, BLUE, 1);
        drawOrb(ctx, cam.sx(d.bx), cam.sy(d.by), rB, ['#0b1f7a', BLUE, BLUE2, '#ffffff'], m.frame, 0.6);
        FX.glow(ctx, cam.sx(d.rx), cam.sy(d.ry), rR * 4, RED, 1);
        drawOrb(ctx, cam.sx(d.rx), cam.sy(d.ry), rR, ['#5a0000', RED, RED2, '#ffffff'], m.frame, 0.6);
        if (d.lvl >= 2) {
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.strokeStyle = d.lvl === 3 ? '#e0b0ff' : '#b070ff';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(cam.sx(d.bx), cam.sy(d.by));
          ctx.lineTo(cam.sx(d.rx), cam.sy(d.ry));
          ctx.stroke();
          ctx.restore();
        }
      }
    },
    moveList: [
      ['NORMALS', ''],
      ['L / M / H', 'Jab / Palm Strike / Spinning Heel'],
      ['2L / 2M / 2H', 'Low Kick (low) / Sliding Shin (low) / Rising Uppercut (launcher)'],
      ['j.L / j.M / j.H', 'Air Jab / Air Knee / Axe Kick (ground bounce)'],
      ['6H', 'Blink Strike (teleporting punch)'],
      ['L+M', 'Throw (hold ← to swap sides)'],
      ['M+H', 'Cursed Parry'],
      ['→→ / ←←', 'Spatial Step (blink) / Back Step'],
      ['TECHNIQUES', ''],
      ['↓↘→ + SP', 'Lapse: Blue (gravity orb, pulls opponent)  [air OK]'],
      ['↓↙← + SP', 'Reversal: Red (repelling blast)  [air OK]'],
      ['↓↓ + SP', 'Spatial Teleport (behind opponent)  [air: above]'],
      ['SP', 'Blue: Pull (drag opponent into range)'],
      ['→ + SP', 'Blue: Movement (projectile-proof rush)'],
      ['← + SP', 'Blue: Counter (counter stance)'],
      ['↓ + SP', 'Red: Launcher (anti-air)'],
      ['UNIQUE', 'Toggle INFINITY (drains Infinity gauge)'],
      ['ENHANCED (50 CE)', ''],
      ['↓↘→ + SU', 'Blue Crush (targeted gravity, pulls into a strike)'],
      ['↓ + SU', 'Red: Burst (invincible reversal)'],
      ['← + SU', 'Red: Counter (catches strikes & projectiles)'],
      ['SUPERS', ''],
      ['↓↙← + SU', 'Maximum Output: Red  (100 CE)'],
      ['→↓↘ + SU', 'Hollow Purple: hold SU to charge Lv1-3 (100/200/300 CE)'],
      ['SP + SU', 'Domain Expansion: Unlimited Void (200 CE + full Domain gauge)'],
    ],
  };
  // filter commands to existing moves
  def.commands = commands.filter((c) => def.moves[c.id]);
  JJK.Chars.gojo = def;
})();

</script>
<script>/* src/game/sukuna.js */
// Ryomen Sukuna — Shrine. Rushdown, lethal spacing, slashes, devastating resource use.
(function () {
  'use strict';
  const JJK = (typeof window !== 'undefined' ? window : globalThis).JJK;
  const U = JJK.U, B = JJK.BTN, Kit = JJK.Kit, FX = JJK.FX;
  const R = (a, b) => a + Math.random() * (b - a);
  const snd = (n, o) => JJK.Audio && JJK.Audio.play(n, o);

  const CRIM = '#ff2a2a', CRIM2 = '#ff8a7a', DARK = '#1a0004', FIRE = '#ff7a1a', FIRE2 = '#ffd040';

  function technique(f) { return f.burnout <= 0 && !f.cs.da; }
  function kindle(f, n = 1) {
    const before = f.cs.kindle;
    f.cs.kindle = Math.min(3, f.cs.kindle + n);
    if (f.cs.kindle > before && f.match) {
      const h = f.anchor('nh');
      FX.spawn('glow', h[0], h[1], { life: 20, size: 30, size2: 6, color: FIRE, add: true });
    }
  }

  // ---------------------------------------------------------------- Dismantle
  function slashFx(x, y, len, ang, col, life = 10) {
    const c = Math.cos(ang), s = Math.sin(ang);
    FX.spawn('slash', x - c * len / 2, y - s * len / 2, { x2: x + c * len / 2, y2: y + s * len / 2, life, size: 3, color: col || CRIM });
  }

  function spawnDismantle(f, m, o = {}) {
    const charged = o.charged;
    const h = o.h || (charged ? 46 : 32);
    const p = new JJK.Projectile(f, {
      x: f.x + f.facing * 50, y: o.y != null ? o.y : f.y + (o.dy || 96), vx: (o.vx || (charged ? 12.5 : 11)) * f.facing, vy: o.vy || 0,
      w: charged ? 18 : 11, h, life: 75, type: 'dismantle', hp: charged ? 3 : 2, moveId: o.id || 'dismantle',
      hit: charged
        ? { dmg: 92, tier: 4, str: 's', hs: 30, bs: 18, launch: true, lv: 6, lx: 5, chip: 12, gdmg: 14, spark: CRIM2, sfx: 'dismantle_hit', kd: true }
        : { dmg: o.dmg || 55, tier: o.tier || 4, str: 's', hs: 20, bs: 15, pb: 5, chip: 7, gdmg: 9, spark: CRIM2, sfx: 'dismantle_hit', av: 4 },
      update(p, m) {
        if (p.t % 2 === 0) FX.spawn('px', p.x - p.vx, p.y + R(-p.h, p.h) * 0.8, { vx: -p.vx * 0.1, life: 8, size: 1, color: U.pick([CRIM, '#fff']), add: true });
      },
      onHit(p, t, m) { kindle(f); slashFx(p.x, p.y, 70, R(-0.8, 0.8), '#fff', 8); if (m.stage && m.stage.slashMark) m.stage.slashMark(p.x - 30, p.y - 30, p.x + 30, p.y + 30); },
      onEnd(p, m) { if (m.stage && m.stage.slashMark && Math.abs(p.x) > JJK.WALL - 30) m.stage.slashMark(p.x, p.y - 30, p.x + 8, p.y + 30); },
      light(p) { FX.light(p.x, p.y, 60, [255, 40, 40], 0.7); },
      draw(p, ctx, cam) {
        const sx = cam.sx(p.x), sy = cam.sy(p.y), z = cam.ez;
        const hh = p.h * z * Math.min(1, p.t / 4);
        const dir = Math.sign(p.vx) || 1;
        const tilt = p.vy ? Math.atan2(-p.vy, Math.abs(p.vx)) * dir : 0;
        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(-tilt);
        // crescent: dark red trail, crimson edge, white core
        ctx.globalCompositeOperation = 'lighter';
        FX.glow(ctx, 0, 0, hh * 1.4, CRIM, 0.5);
        ctx.globalCompositeOperation = 'source-over';
        for (let i = 0; i < 3; i++) {
          ctx.strokeStyle = ['#3a0006', CRIM, '#ffffff'][i];
          ctx.lineWidth = [4, 2, 1][i] * Math.max(1, z * (charged ? 1.4 : 1));
          ctx.beginPath();
          ctx.ellipse(-dir * 6 * z + i * dir * 2, 0, 8 * z, hh, 0, dir > 0 ? -1.3 : Math.PI - 1.3, dir > 0 ? 1.3 : Math.PI + 1.3);
          ctx.stroke();
        }
        // air distortion streaks
        ctx.strokeStyle = 'rgba(255,200,200,0.35)';
        ctx.lineWidth = 1;
        for (let i = -2; i <= 2; i++) {
          ctx.beginPath();
          ctx.moveTo(-dir * 10 * z, i * hh * 0.35);
          ctx.lineTo(-dir * (28 + Math.abs(i) * 6) * z, i * hh * 0.35);
          ctx.stroke();
        }
        ctx.restore();
      },
    });
    m.spawn(p);
    snd('dismantle', { pan: f.pan() });
    return p;
  }

  function spawnCross(f, m, ex) {
    const p = new JJK.Projectile(f, {
      x: f.x + f.facing * 46, y: f.y + 110, vx: (ex ? 9 : 7) * f.facing, w: ex ? 34 : 26, h: ex ? 60 : 46, life: 70, type: 'cross', hp: 2, moveId: ex ? 'exCross' : 'cross',
      hits: 2, interval: 6,
      hit: { dmg: ex ? 48 : 38, tier: ex ? 5 : 4, str: 's', hs: 24, bs: 16, launch: true, lv: 8, lx: 3, chip: 6, spark: CRIM2, sfx: 'dismantle_hit', multi: true },
      onHit(p, t, m) { kindle(f); },
      light(p) { FX.light(p.x, p.y, 70, [255, 40, 40], 0.8); },
      draw(p, ctx, cam) {
        const sx = cam.sx(p.x), sy = cam.sy(p.y), z = cam.ez;
        const s = Math.min(1, p.t / 5) * z;
        ctx.save();
        FX.glow(ctx, sx, sy, p.h * 1.3 * s, CRIM, 0.6);
        for (const k of [1, -1]) {
          for (let i = 0; i < 3; i++) {
            ctx.strokeStyle = ['#3a0006', CRIM, '#ffffff'][i];
            ctx.lineWidth = [5, 3, 1][i] * Math.max(1, z);
            ctx.beginPath();
            ctx.moveTo(sx - p.w * s, sy - k * p.h * s);
            ctx.lineTo(sx + p.w * s, sy + k * p.h * s);
            ctx.stroke();
          }
        }
        ctx.restore();
      },
    });
    m.spawn(p);
    snd('dismantle', { pan: f.pan(), pitch: 0.8 });
  }

  // ---------------------------------------------------------------- Fuga
  function spawnFuga(f, m, lvl) {
    const h = f.anchor('fh');
    const big = lvl === 3;
    const dims = [null, [16, 7], [34, 12], [70, 40]][lvl];
    const kmul = 1 + f.cs.usedKindle * 0.12;
    const p = new JJK.Projectile(f, {
      x: h[0] + f.facing * 20, y: h[1], vx: (big ? 8 : 10) * f.facing, w: dims[0], h: dims[1], life: 120, type: 'fuga', hp: [0, 2, 4, 99][lvl], pierce: big,
      hits: big ? 1 : 1, moveId: 'fuga' + lvl,
      hit: [null,
        { dmg: Math.round(60 * kmul), tier: 4, str: 's', hs: 26, bs: 16, launch: true, lv: 6, lx: 5, chip: 8, spark: FIRE2, sfx: 'fuga_explode' },
        { dmg: Math.round(130 * kmul), tier: 5, str: 's', hs: 34, bs: 20, launch: true, lv: 7, lx: 7, wb: true, chip: 18, gdmg: 20, spark: FIRE2, sfx: 'fuga_explode' },
        { dmg: Math.round(260 * kmul), tier: 7, str: 'x', hs: 50, bs: 26, launch: true, lv: 9, lx: 9, wb: true, splat: true, chip: 50, gdmg: 60, spark: FIRE2, sfx: 'fuga_explode', minScale: 0.6, jug: 0 },
      ][lvl],
      update(p, m) {
        const n = big ? 6 : lvl === 2 ? 3 : 1;
        for (let i = 0; i < n; i++)
          FX.spawn('flame', p.x - p.vx * R(0, 1.5), p.y + R(-p.h, p.h), { vx: -p.vx * 0.2, vy: R(0.3, 1.5), life: R(10, 22), size: R(3, 6) * (big ? 2.4 : lvl === 2 ? 1.4 : 1), size2: 1, color: FIRE, color2: '#c02000', add: true });
        if (big && m.stage && m.stage.burn && p.t % 6 === 0) m.stage.burn(p.x, 50, 200);
        if (big) m.cam.shake(0.05);
      },
      onHit(p, t, m) { fugaExplosion(f, m, p.x, p.y, lvl); if (big) p.kill(m); },
      onBlock(p, t, m) { fugaExplosion(f, m, p.x, p.y, lvl * 0.7); },
      onEnd(p, m) { if (!p.exploded && Math.abs(p.x) > JJK.WALL - 40) fugaExplosion(f, m, p.x, p.y, lvl * 0.6); },
      light(p) { FX.light(p.x, p.y, [0, 80, 140, 260][lvl], [255, 120, 30], big ? 1.6 : 1.1); },
      draw(p, ctx, cam, m) {
        const sx = cam.sx(p.x), sy = cam.sy(p.y), z = cam.ez;
        const dir = Math.sign(p.vx) || 1;
        FX.glow(ctx, sx, sy, p.w * 2.2 * z, FIRE, 1);
        // arrow of flame: elongated flame body with a bright head
        ctx.save();
        ctx.translate(sx, sy);
        ctx.scale(dir, 1);
        const L = p.w * z, Hh = p.h * z;
        const flick = Math.sin(p.t * 1.3) * 2;
        ctx.fillStyle = '#801800';
        ctx.beginPath(); ctx.moveTo(L * 1.2, 0); ctx.lineTo(-L * 1.6, -Hh * 1.2 - flick); ctx.lineTo(-L * 1.1, 0); ctx.lineTo(-L * 1.6, Hh * 1.2 + flick); ctx.closePath(); ctx.fill();
        ctx.fillStyle = FIRE;
        ctx.beginPath(); ctx.moveTo(L * 1.1, 0); ctx.lineTo(-L * 1.2, -Hh * 0.8); ctx.lineTo(-L * 0.7, 0); ctx.lineTo(-L * 1.2, Hh * 0.8); ctx.closePath(); ctx.fill();
        ctx.fillStyle = FIRE2;
        ctx.beginPath(); ctx.moveTo(L, 0); ctx.lineTo(-L * 0.6, -Hh * 0.45); ctx.lineTo(-L * 0.3, 0); ctx.lineTo(-L * 0.6, Hh * 0.45); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#fff6d0';
        ctx.beginPath(); ctx.ellipse(L * 0.55, 0, L * 0.4, Hh * 0.25, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        if (big) m.distort(p.x, p.y, 90, 1.15);
      },
    });
    p.lvl = lvl;
    m.spawn(p);
    snd('fuga_fire', { pan: f.pan() });
    return p;
  }

  function fugaExplosion(f, m, x, y, lvl) {
    const k = lvl / 3;
    FX.spawn('flash', x, y, { life: 4, size: 14 + k * 40, size2: 4, color: '#fff6d0', add: true });
    FX.spawn('glow', x, y, { life: 26, size: 80 + k * 200, size2: 20, color: FIRE, add: true });
    FX.spawn('ring', x, y, { life: 20, size: 10, size2: 70 + k * 160, color: FIRE2, w: 4, add: true });
    for (let i = 0; i < 20 + k * 60; i++) {
      const a = Math.random() * Math.PI * 2, sp = R(2, 10) * (0.6 + k);
      FX.spawn('flame', x, y, { vx: Math.cos(a) * sp, vy: Math.sin(a) * sp + 1, drag: 0.9, life: R(18, 40), size: R(4, 10) * (0.6 + k), size2: 1, color: FIRE, color2: '#a01800', add: true });
    }
    FX.debris(x, Math.max(5, y - 30), 10 + k * 30, 1 + k);
    if (m.stage) {
      if (m.stage.burn) m.stage.burn(x, 40 + k * 120, 120 + k * 360);
      if (m.stage.blast) m.stage.blast(x, y, 60 + k * 140, k);
    }
    m.cam.shake(0.25 + k * 0.6);
    if (lvl >= 3) { m.flashScreen('#ffb060', 0.5, 12); m.impact(2, 0xffffffff); }
    snd('fuga_explode', { pan: f.pan() });
  }

  // ---------------------------------------------------------------- World Cutting Slash
  function wcsLine(f, aim) {
    // line through Sukuna's pointing hand across the whole world, angled by aim
    const h = f.anchor('fh');
    const ang = aim > 0 ? 0.42 : aim < 0 ? -0.3 : 0;
    const dx = Math.cos(ang) * f.facing, dy = Math.sin(ang);
    const x0 = h[0], y0 = aim < 0 ? h[1] : aim > 0 ? h[1] : f.y + 96;
    return { x0, y0, x1: x0 + dx * 1400, y1: y0 + dy * 1400, dx, dy };
  }
  function segBoxHit(L, box, thick) {
    // sample along the line and test inflated box
    const b = [box[0] - thick, box[1] - thick, box[2] + thick, box[3] + thick];
    for (let t = 0; t <= 1; t += 0.004) {
      const x = L.x0 + (L.x1 - L.x0) * t, y = L.y0 + (L.y1 - L.y0) * t;
      if (x >= b[0] && x <= b[2] && y >= b[1] && y <= b[3]) return [x, y];
    }
    return null;
  }

  function fugaTick(f, m, mf) {
    const d = f.moveData;
    const holding = (f.buf.held(0) & B.SP) || (f.cpu && f.cpu.holdSP);
    d.charge++;
    const kd = f.cs.kindle * 10;
    const need = [0, 18, 46 - kd, 96 - kd * 2];
    const lvlMax = f.canAfford(100) ? 3 : f.canAfford(50) ? 2 : 1;
    const lvl = d.charge >= need[3] && lvlMax >= 3 ? 3 : d.charge >= need[2] && lvlMax >= 2 ? 2 : 1;
    if (lvl !== d.lvl) {
      d.lvl = lvl;
      snd('charge_level', { pitch: 1 + lvl * 0.2 });
      m.popText(f, 'LV ' + lvl, '#ffb060');
      FX.spawn('ring', f.x, f.y + 95, { life: 18, size: 10, size2: 60 + lvl * 25, color: FIRE, w: 3, add: true });
    }
    const k = Math.min(1, d.charge / 96);
    d.k = k;
    // flames gather at the bow
    const h = f.anchor('fh'), n = f.anchor('nh');
    for (let i = 0; i < 1 + k * 4; i++) {
      const t = Math.random();
      FX.spawn('flame', U.lerp(n[0], h[0], t) + R(-4, 4), U.lerp(n[1], h[1], t) + R(-4, 4), { vx: R(-0.5, 0.5), vy: R(0.5, 2), life: R(10, 20), size: R(2, 4) * (1 + k * 1.5), size2: 1, color: FIRE, color2: '#a01800', add: true });
    }
    if (d.charge % 3 === 0) FX.spawn('px', f.x + R(-200, 200), R(10, 220), { vy: R(0.5, 1.5), vx: R(-0.5, 0.5), life: 40, size: 1, color: FIRE2, add: true }); // embers
    if (d.charge % 5 === 0) FX.spawn('smoke', f.x + R(-260, 260), R(0, 20), { vx: R(-0.4, 0.4), vy: R(0.2, 0.6), drag: 0.98, life: 90, size: R(6, 10), size2: R(18, 30), color: '#2a1612', alpha: 0.35 * k + 0.1, layer: 'back' }); // smoke fills the arena
    m.cam.shake(0.01 + k * 0.03);
    if (m.stage) m.stage.darken = Math.max(m.stage.darken || 0, k * 0.25);
    if (f.cs.fugaSnd) f.cs.fugaSnd.setLevel(k);
    if ((holding && d.charge < 150) || d.charge < need[1]) return 'hold';
    const cost = [0, 0, 50, 100][d.lvl];
    if (cost && !f.spend(cost)) d.lvl = 1;
    f.cs.usedKindle = f.cs.kindle;
    f.cs.kindle = 0;
    if (f.cs.fugaSnd) { f.cs.fugaSnd.stop(0.05); f.cs.fugaSnd = null; }
    f.startMove('fugaFire', { free: true, data: d });
    f.moveData = d;
    if (d.lvl === 3) {
      m.superFlash(f, 'FUGA', { dur: 40, zoom: 1.45, color: FIRE });
      m.flashScreen('#ff9040', 0.3, 10);
    }
    return 'stop';
  }

  function wcsTick(f, m, mf) {
    const d = f.moveData;
    // aim: hold up / down during the chant
    const dir = f.buf.dir(0);
    if (mf < 110) {
      if (f.cpu && f.cpu.aim != null) d.aim = f.cpu.aim;
      else d.aim = dir >= 7 ? 1 : dir <= 3 ? -1 : 0;
    }
    f.cs.wcsAim = mf >= 20 && mf < 122 ? wcsLine(f, d.aim) : null;
    // chant
    if (mf === 26) { JJK.Voice && JJK.Voice.say('sukuna', 'wcs_1'); snd('chant_tick'); }
    if (mf === 56) { JJK.Voice && JJK.Voice.say('sukuna', 'wcs_2'); snd('chant_tick'); }
    if (mf === 86) { JJK.Voice && JJK.Voice.say('sukuna', 'wcs_3'); snd('chant_tick'); }
    if (mf === 40 && JJK.Audio) JJK.Audio.hush(2.2, 0.06);
    if (mf > 30 && mf < 120 && m.stage) m.stage.darken = Math.max(m.stage.darken || 0, Math.min(0.45, (mf - 30) / 120));
    if (mf === 108) {
      // stillness: a brief close-up on his eyes before the cut
      const head = f.anchor('head');
      m.cinematic({
        dur: 18, letterbox: 40, dark: 0.9,
        update(m, t) { m.cam.override = { x: head[0] + f.facing * 6, y: head[1] - 6, zoom: 3.6, speed: 0.45 }; },
        draw(ctx, m, t) {
          // eye glint
          const h = f.anchor('head');
          const sx = m.cam.sx(h[0] + f.facing * 7), sy = m.cam.sy(h[1] + 2);
          if (t > 6) { FX.glow(ctx, sx, sy, 22, '#ff2020', 0.9); ctx.fillStyle = '#fff'; ctx.fillRect(Math.round(sx) - 3, Math.round(sy), 7, 1); }
        },
        onEnd(m) { m.cam.override = null; },
      });
    }
    if (mf === 120) {
      const L = wcsLine(f, d.aim);
      if (JJK.Audio) { JJK.Audio.unhush(0.02); }
      snd('wcs_tear', { bypassHush: true });
      if (JJK.Voice) JJK.Voice.say('sukuna', 'wcs');
      // the cut
      const o = m.opp(f);
      let hitPt = null;
      if (!o.invulnTo('proj') || o.st === 'move') {
        for (const b of o.hurt) { hitPt = segBoxHit(L, b, 10); if (hitPt) break; }
      }
      if (o.st === 'down' || o.st === 'techroll' || (o.inv > 0 && o.invType === 'all')) hitPt = null;
      if (hitPt) {
        const h = { dmg: 300, tier: 7, str: 'x', hs: 60, launch: true, lv: 9, lx: 6, hkd: true, guard: 'unblockable', bypassInf: true, spark: '#ffffff', minScale: 0.7, jug: 0, noParry: true };
        o.hitstop = 0;
        JJK.Combat.hit(m, f, o, h, hitPt, { moveId: 'wcs' }, JJK.STR.x);
        o.hitstop = 50; f.hitstop = 0;
        m.popText(o, 'SEVERED', '#ffffff', true);
      }
      // reality tears along the line
      m.tear = { x0: L.x0, y0: L.y0, x1: L.x1, y1: L.y1, t: 0, life: 48, amount: 18 };
      if (m.stage && m.stage.worldCut) m.stage.worldCut(L.x0 - L.dx * 1400, L.y0 - L.dy * 1400, L.x1, L.y1);
      m.cam.shake(0.9);
      m.flashScreen('#ffffff', 0.8, 6);
      m.impact(3, 0xffffffff);
      m.slowmo(0.35, 40);
      if (JJK.Audio) JJK.Audio.rumble(o.side, 1, 1, 700);
      FX.spawn('slash', L.x0, L.y0, { x2: L.x1, y2: L.y1, life: 30, size: 6, color: '#ff2020' });
    }
  }

  const def = {
    id: 'sukuna', name: 'SUKUNA', full: 'RYOMEN SUKUNA', title: 'KING OF CURSES',
    art: JJK.Art.sukuna,
    domainType: 'shrine',
    color: '#ff5050',
    hitColor: '#ff9a7a',

    afterColor: '#ff3040',
    smearMat: U.mat('#ffe0e0', { emissive: 1, light: '#ffffff', shadow: '#ffc0c0', deep: '#ff9090' }),
    pgBonus: 0,
    stats: { hp: 1000, walkF: 2.9, walkB: 2.1, runSpeed: 6.6, jumpV: 11, jumpVx: 4.2, grav: 0.56, prejump: 4, airActions: 2 },
    poses: JJK.Poses.sukuna,
    anims: Kit.baseAnims(),
    moves: Kit.build(moves),
    commands: [],
    initState() { return { kindle: 0, usedKindle: 0, da: false, daT: 0, fugaSnd: null, wcsAim: null }; },
    dmgMul(f) { return (f.cs.da ? 1.12 : 1) * (f.cs.shrineBuff ? 1.2 : 1); },
    speedMul(f) { return f.cs.shrineBuff ? 1.25 : 1; },
    update(f, m) {
      const cs = f.cs;
      // Domain Amplification toggle (Unique button)
      if (f.buf.pr(0) & B.UN && !m.inputLocked && !f.isStunned()) {
        if (cs.da) { cs.da = false; snd('da_off', { pan: f.pan() }); }
        else if (f.canAfford(25) && f.burnout <= 0) {
          f.spend(15);
          cs.da = true; cs.daT = 0;
          snd('da_on', { pan: f.pan() });
          if (JJK.Voice && U.chance(0.4)) JJK.Voice.say('sukuna', 'da');
          FX.spawn('ring', f.x, f.y + 95, { life: 16, size: 20, size2: 80, color: '#301020', w: 3 });
        } else if (JJK.Audio) JJK.Audio.play('ui_error', { vol: 0.4 });
      }
      if (cs.da) {
        cs.daT++;
        const t = m.training;
        if (!(t && t.infMeter)) f.meter -= 9 / 60;
        if (f.meter <= 0 || f.burnout > 0) { f.meter = Math.max(0, f.meter); cs.da = false; snd('da_off'); }
        if (m.frame % 2 === 0) {
          const c = f.anchor(U.pick(['chest', 'hip', 'head', 'nh', 'fh']));
          FX.spawn('smoke', c[0] + R(-12, 12), c[1] + R(-12, 12), { vy: R(0.3, 1.2), life: 24, size: R(3, 5), size2: 1, color: '#0a0610', alpha: 0.7 });
        }
      }
      // hand flames (reference: red cursed flames on the fists)
      if (!cs.da && f.visible && m.frame % 2 === 0 && JJK.HEADLESS !== true) {
        for (const a of ['fh', 'nh']) {
          if (a === 'nh' && m.frame % 4) continue;
          const h = f.anchor(a);
          FX.spawn('flame', h[0] + R(-4, 4), h[1] + R(-3, 4), { vy: R(0.6, 1.6), vx: R(-0.3, 0.3), life: R(10, 18), size: R(2, 3.5), size2: 0.5, color: CRIM, color2: '#801010', add: true });
        }
      }
    },
    preHit,
    lights(f, m) {
      if (!f.visible) return;
      const h = f.anchor('fh');
      if (!f.cs.da) FX.light(h[0], h[1], 46, [255, 50, 30], 0.55);
      if (f.st === 'move' && f.move && f.move.id === 'fuga' && f.moveData.k != null) {
        const n = f.anchor('nh');
        FX.light((h[0] + n[0]) / 2, (h[1] + n[1]) / 2, 90 + f.moveData.k * 140, [255, 120, 30], 1.3);
      }
    },
    auraColor(f) {
      if (f.cs.da) return U.pack(20, 10, 30);
      if (f.burnout > 0) return U.pack(60, 60, 70);
      return 0;
    },
    glowRing(f) { return f.cs.da ? U.pack(70, 30, 90) : 0; },
    drawFx(f, ctx, cam, m) {
      if (!f.visible) return;
      const z = cam.ez;
      if (!f.cs.da) for (const a of ['fh', 'nh']) {
        const h = f.anchor(a);
        FX.glow(ctx, cam.sx(h[0]), cam.sy(h[1]), (a === 'fh' ? 16 : 11) * z, CRIM, 0.7);
      }
      // fire bow during Fuga
      if (f.st === 'move' && f.move && f.move.id === 'fuga') {
        const d = f.moveData;
        const h = f.anchor('fh'), n = f.anchor('nh');
        const k = d.k || 0;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = FIRE;
        ctx.lineWidth = Math.max(1, (1 + k * 2) * z);
        // bow arc around the lead hand
        const bx = cam.sx(h[0]), by = cam.sy(h[1]);
        ctx.beginPath();
        ctx.arc(bx - f.facing * 6 * z, by, 26 * z, f.facing > 0 ? -1.1 : Math.PI - 1.1 + 0, f.facing > 0 ? 1.1 : Math.PI + 1.1);
        ctx.stroke();
        // string + arrow
        ctx.strokeStyle = FIRE2;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cam.sx(n[0]), cam.sy(n[1]));
        ctx.lineTo(bx + f.facing * 14 * z, by);
        ctx.stroke();
        ctx.restore();
        FX.glow(ctx, bx, by, (30 + k * 60) * z, FIRE, 0.8);
        // the arena takes on the furnace's orange light
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = `rgba(255,90,10,${k * 0.12})`;
        ctx.fillRect(0, 0, JJK.W, JJK.H);
        ctx.restore();
      }
      // World Cutting Slash aim line (visible to both players)
      if (f.cs.wcsAim) {
        const L = f.cs.wcsAim;
        const a = 0.45 + 0.3 * Math.sin(m.frame * 0.3);
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = `rgba(255,30,30,${a * 0.35})`;
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(cam.sx(L.x0), cam.sy(L.y0));
        ctx.lineTo(cam.sx(L.x1), cam.sy(L.y1));
        ctx.stroke();
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = `rgba(255,70,70,${a})`;
        ctx.setLineDash([8, 5]);
        ctx.lineDashOffset = -m.frame;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cam.sx(L.x0), cam.sy(L.y0));
        ctx.lineTo(cam.sx(L.x1), cam.sy(L.y1));
        ctx.stroke();
        ctx.restore();
        // chant subtitles
        const mf = f.mf;
        const words = [['DRAGON SCALE.', 26], ['RECOIL.', 56], ['TWIN METEORS.', 86]];
        for (let i = 0; i < 3; i++) {
          if (mf >= words[i][1] && mf < 122) JJK.Font.draw(ctx, words[i][0], 320, 236 + i * 13, { color: i === 2 ? '#ff5050' : '#ffd0d0', align: 'center', outline: '#000', scale: 1 });
        }
      }
    },
    moveList: [
      ['NORMALS', ''],
      ['L / M / H', 'Backfist / Claw Rake / Cursed Fist'],
      ['2L / 2M / 2H', 'Shin Kick (low) / Slide (low) / Rising Talon (launcher)'],
      ['j.L / j.M / j.H', 'Air Chop / Air Knee / Hammer Fist (ground bounce)'],
      ['6H', 'Heel Drop (overhead)'],
      ['L+M', 'Throw (hold ← to swap sides)'],
      ['M+H', 'Cursed Parry'],
      ['→→ (hold) / ←←', 'Dash into Run / Backstep'],
      ['TECHNIQUES', ''],
      ['↓↘→ + SP', 'Dismantle (hold SP: Charged; SP again: Double Slash)  [air OK]'],
      ['↓↙← + SP', 'Cleave (close-range, high damage)'],
      ['→↘↓↙← + SP', 'Grab Cleave (command grab)'],
      ['↓↓ + SP', 'Fuga: hold SP to charge Lv1-3 (Lv2: 50 CE, Lv3: 100 CE)'],
      ['↓ + SP', 'Cross Dismantle (anti-air)'],
      ['→ + SP', 'Shrine Lunge (rush)'],
      ['← + SP', 'Counter Cleave (counter stance)'],
      ['UNIQUE', 'Toggle DOMAIN AMPLIFICATION (pierces Infinity, no techniques, drains CE)'],
      ['ENHANCED (50 CE)', ''],
      ['↓↘→ + SU', 'Triple Dismantle'],
      ['↓ + SU', 'Cross Dismantle EX (invincible)'],
      ['← + SU', 'Counter Cleave EX (catches projectiles)'],
      ['63214 + SU', 'Grab Cleave EX'],
      ['SUPERS', ''],
      ['↓↙← + SU', 'Cleave: Enhanced  (100 CE)'],
      ['→↓↘ + SU', 'World Cutting Slash: hold ↑/↓ to aim (200 CE)'],
      ['SP + SU', 'Domain Expansion: Malevolent Shrine (200 CE + full Domain gauge)'],
      ['PASSIVE', 'Dismantle/Cleave hits add KINDLING: faster, stronger Fuga'],
    ],
  };
  def.commands = commands.filter((c) => def.moves[c.id]);
  JJK.Chars.sukuna = def;
})();

<script>/* src/game/domain.js */
// Domain Expansion system: startup (interruptible), activation cinematics,
// domain effects (Unlimited Void / Malevolent Shrine), Simple Domain escape,
// burnout, and the skill-based Domain Clash minigame.
(function () {
  'use strict';
  const JJK = (typeof window !== 'undefined' ? window : globalThis).JJK;
  const U = JJK.U, B = JJK.BTN, FX = JJK.FX;
  const R = (a, b) => a + Math.random() * (b - a);
  const snd = (n, o) => JJK.Audio && JJK.Audio.play(n, o);
  const D = (JJK.Domain = {});

  const INFO = {
    void: { name: 'UNLIMITED VOID', jp: '無量空処', dur: 300, color: '#9fe0ff', banner: { top: '#ffffff', mid: '#bfe8ff', mid2: '#5fb0ff', bot: '#10306a', outline: '#000814' }, music: 'void' },
    shrine: { name: 'MALEVOLENT SHRINE', jp: '伏魔御厨子', dur: 360, color: '#ff4040', banner: { top: '#ffffff', mid: '#ff9090', mid2: '#e01010', bot: '#3a0000', outline: '#0a0000' }, music: 'shrine' },
  };
  D.INFO = INFO;
  const BURNOUT = 240;

  // ------------------------------------------------------------- startup
  D.typeOf = (f) => f.def.domainType;

  D.begin = function (f, m, type) {
    if (!f.spend(200)) return false;
    f.dg = 0;
    const o = m.opp(f);
    f.cs.domainType = type;
    // clash: opponent's domain is starting up, or is active and we are not immobilized
    const oStart = o.st === 'move' && o.move && o.move.id === 'domain';
    const active = m.domain && m.domain.owner === o && !(f.domainStun > 0);
    if (oStart || active) {
      m.pendingClash = { a: o, b: f };
    }
    snd('domain_activate', { vol: 0.5, pan: f.pan() });
    FX.spawn('ring', f.x, f.y + 100, { life: 24, size: 140, size2: 20, color: INFO[type].color, w: 3, add: true });
    m.popText(f, 'DOMAIN EXPANSION', INFO[type].color, true);
    if (JJK.Voice) JJK.Voice.say(f.def.id, 'domain');
    m.domainStartup = { owner: f, type };
    return true;
  };

  D.startupTick = function (f, m, mf) {
    const mv = f.move;
    // gathering energy, visibly vulnerable
    const c = f.anchor('chest');
    if (mf % 2 === 0) {
      const a = Math.random() * Math.PI * 2, d = R(60, 120);
      FX.spawn('px', c[0] + Math.cos(a) * d, c[1] + Math.sin(a) * d, { vx: -Math.cos(a) * d / 12, vy: -Math.sin(a) * d / 12, life: 12, size: 2, color: INFO[D.typeOf(f)].color, add: true });
    }
    m.darken = Math.max(m.darken, Math.min(0.6, mf / mv.s * 0.6));
    if (m.stage) m.stage.darken = Math.max(m.stage.darken || 0, mf / mv.s * 0.5);
    if (mf === mv.s) {
      m.domainStartup = null;
      if (m.pendingClash) {
        const pc = m.pendingClash;
        m.pendingClash = null;
        const other = pc.a === f ? pc.b : pc.a;
        const otherLive = (other.st === 'move' && other.move && other.move.id === 'domain') || (m.domain && m.domain.owner === other);
        if (otherLive) { D.startClash(m, pc.a, pc.b); return; }
      }
      // if the opponent is mid-startup of their own domain, wait for them (clash resolves at their activation)
      const o = m.opp(f);
      if (o.st === 'move' && o.move && o.move.id === 'domain' && o.mf < o.move.s) {
        m.pendingClash = { a: f, b: o };
        return 'hold';
      }
      D.activate(f, m, D.typeOf(f));
    }
  };

  // Called by Battle when the startup was interrupted
  D.checkInterrupt = function (m) {
    const ds = m.domainStartup;
    if (!ds) return;
    const f = ds.owner;
    if (f.st !== 'move' || !f.move || f.move.id !== 'domain') {
      m.domainStartup = null;
      if (m.pendingClash && (m.pendingClash.a === f || m.pendingClash.b === f)) {
        // the other one still expands normally
        const other = m.pendingClash.a === f ? m.pendingClash.b : m.pendingClash.a;
        m.pendingClash = null;
        if (other.st === 'move' && other.move && other.move.id === 'domain') m.domainStartup = { owner: other, type: D.typeOf(other) };
      }
      f.meter = Math.min(300, f.meter + 100);
      f.dg = 50;
      m.popText(f, 'DOMAIN BROKEN', '#ff8080', true);
      snd('domain_shatter', { pan: f.pan() });
      const c = f.anchor('chest');
      for (let i = 0; i < 20; i++) FX.spawn('debris', c[0], c[1], { vx: R(-5, 5), vy: R(-1, 6), ay: -0.3, life: 40, size: R(2, 4), color: INFO[D.typeOf(f)].color, color2: '#fff', vr: R(-0.4, 0.4), floor: 0 });
    }
  };

  // ------------------------------------------------------------- activation
  D.activate = function (f, m, type, opts = {}) {
    const info = INFO[type];
    const o = m.opp(f);
    const head = f.anchor('head');
    if (JJK.Music) JJK.Music.cut();
    snd('domain_activate');
    snd(type === 'void' ? 'void_open' : 'shrine_open');
    if (JJK.Audio) JJK.Audio.rumble(0, 1, 1, 600), JJK.Audio.rumble(1, 1, 1, 600);
    m.projectiles.length = 0;
    const dur = opts.short ? 70 : 128;
    const fdur = Math.round(info.dur * (opts.durMul || 1));
    m.cinematic({
      dur, letterbox: 34, dark: 0.95,
      start(m) {
        f.eyesOpen = type === 'void';
        m.flashScreen('#000000', 1, 8);
      },
      update(m, t) {
        const cam = m.cam;
        if (!opts.short && t < 56) cam.override = { x: head[0] + f.facing * 8, y: head[1] - 14, zoom: 3.4, speed: 0.25 };
        else if (t < dur - 30) cam.override = { x: (f.x + o.x) / 2, y: JJK.CAM_BASE_Y + 20, zoom: 0.85, speed: 0.12 };
        else cam.override = { x: U.clamp((f.x + o.x) / 2, -cam.limit, cam.limit), y: JJK.CAM_BASE_Y, zoom: 1, speed: 0.15 };
        const tt = opts.short ? 0 : 56;
        if (t === tt) {
          m.flashScreen('#ffffff', 0.9, 10);
          cam.shake(0.7);
          if (m.stage && m.stage.setMode) m.stage.setMode(type, { originX: f.x, frames: 40, shrineX: f.x - f.facing * 170 });
          m.domainVisual = { type, owner: f, t: 0 };
          snd('explosion', { vol: 0.8 });
        }
