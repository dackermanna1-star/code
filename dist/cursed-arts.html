        if (t > tt && t % 3 === 0) {
          const c = f.anchor('chest');
          FX.spawn('ring', c[0], c[1], { life: 20, size: 10, size2: 200, color: info.color, w: 2, add: true });
        }
        f.hairLift = type === 'void' ? 5 : 2;
      },
      draw(ctx, m, t) {
        if (t > 10 && t < (opts.short ? 60 : 56)) {
          JJK.Font.draw(ctx, 'DOMAIN EXPANSION', 320, 300, { color: '#ffffff', align: 'center', outline: '#000', scale: 2 });
        }
        if (t > (opts.short ? 10 : 64)) {
          const b = JJK.Font.banner(info.name, Object.assign({ scale: 5 }, info.banner));
          if (b) {
            const k = Math.min(1, (t - (opts.short ? 10 : 64)) / 8);
            ctx.globalAlpha = k;
            ctx.drawImage(b, Math.round(320 - b.width / 2), 96);
            ctx.globalAlpha = 1;
          }
          D.drawKanji(ctx, info.jp, 320, 172, info.color);
        }
      },
      onEnd(m) {
        f.eyesOpen = false;
        f.hairLift = 0;
        D.startDomain(f, m, type, fdur);
      },
    });
  };

  D.drawKanji = function (ctx, text, x, y, color) {
    if (!ctx.fillText) return;
    ctx.save();
    ctx.font = 'bold 22px "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif CJK JP", "MS Mincho", serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#000';
    ctx.strokeText(text, x, y);
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
    ctx.restore();
  };

  D.startDomain = function (f, m, type, dur) {
    const o = m.opp(f);
    m.domain = { owner: f, victim: o, type, t: 0, dur, dmg: 0, simple: false, nextSlash: 20 };
    if (JJK.Music) JJK.Music.play(INFO[type].music, 0.05);
    if (JJK.Audio) m.domain.amb = JJK.Audio.loop(type === 'void' ? 'void_ambience' : 'shrine_ambience', { vol: 0.6 });
    f.cs.infSuspended = false;
    if (type === 'void') {
      // sure-hit: overwhelming information immobilizes the target
      o.domainStun = 160;
      o.move = null;
      if (o.st !== 'down' && o.st !== 'juggle') { o.st = 'dizzy'; o.sf = 0; o.stun = 160; o.setAnim('dizzy'); o.vx = 0; }
      m.popText(o, 'MASH TO RESIST', '#ffffff');
      if (o.canAfford(100)) m.popText(o, 'UNIQUE: SIMPLE DOMAIN', '#bfe8ff');
    } else {
      m.popText(o, 'SURVIVE!', '#ff8080', true);
      if (o.canAfford(100)) m.popText(o, 'UNIQUE: SIMPLE DOMAIN', '#ffb0b0');
      f.cs.shrineBuff = true;
    }
    m.simplePrompt = { f: o, t: 60 };
  };

  // ------------------------------------------------------------- per-tick
  D.update = function (m) {
    const d = m.domain;
    if (!d) return;
    d.t++;
    const f = d.owner, o = d.victim;
    if (m.domainVisual) m.domainVisual.t++;
    // Simple Domain: spend 100 CE within the prompt window to resist the sure-hit
    if (m.simplePrompt) {
      const sp = m.simplePrompt;
      sp.t--;
      if (!d.simple && (o.buf.pr(0) & B.UN || (o.cpu && o.cpu.wantSimple)) && o.spend(100)) {
        d.simple = true;
        o.domainStun = Math.round((o.domainStun || 0) * 0.45);
        if (o.st === 'dizzy') o.stun = Math.min(o.stun, o.domainStun);
        m.popText(o, 'SIMPLE DOMAIN', '#ffffff', true);
        snd('perfect_guard', { pan: o.pan() });
        const c = o.anchor('chest');
        FX.spawn('ring', c[0], c[1] - 60, { life: 30, size: 20, size2: 70, color: '#ffffff', w: 2, add: true });
        m.simplePrompt = null;
      }
      if (sp.t <= 0) m.simplePrompt = null;
    }
    if (d.type === 'void') {
      if (o.domainStun > 0) {
        o.domainStun--;
        // information streams into the victim
        if (d.t % 2 === 0) {
          const h = o.anchor('head');
          const a = Math.random() * Math.PI * 2, r = R(80, 200);
          FX.spawn('line', h[0] + Math.cos(a) * r, h[1] + Math.sin(a) * r, { x2: h[0], y2: h[1], life: 6, size: 1, color: U.pick(['#ffffff', '#bfe8ff', '#7fd0ff']), add: true });
        }
        if (o.st === 'dizzy' && o.stun > o.domainStun) o.stun = o.domainStun;
      }
      // damage cap: the void cannot be a guaranteed kill
      if (o.combo.dmg > (d.simple ? 160 : 280) && o.domainStun > 0) { o.domainStun = 0; if (o.st === 'dizzy') o.stun = 0; m.popText(o, 'BROKE FREE', '#ffffff'); }
    } else {
      // Malevolent Shrine: sure-hit slashes rain on the victim
      if (d.t >= d.nextSlash && !o.ko) {
        const big = d.t % 60 < 4 && d.t > 40;
        d.nextSlash = d.t + Math.max(12, 22 - Math.floor(d.t / 40));
        D.shrineSlash(m, f, o, big, d.simple);
      }
    }
    if (d.t >= d.dur || f.ko || o.ko) D.end(m);
  };

  D.shrineSlash = function (m, f, o, big, simple) {
    const c = o.anchor(U.pick(['chest', 'head', 'hip']));
    const ang = R(-1.4, 1.4);
    const len = big ? 160 : 90;
    FX.spawn('slash', c[0] - Math.cos(ang) * len / 2, c[1] - Math.sin(ang) * len / 2, { x2: c[0] + Math.cos(ang) * len / 2, y2: c[1] + Math.sin(ang) * len / 2, life: 9, size: big ? 4 : 2, color: '#ff2020' });
    snd('shrine_slash', { pan: o.pan(), pitch: R(0.9, 1.2) });
    if (m.stage && m.stage.slashMark && Math.random() < 0.3) m.stage.slashMark(c[0] - 40, R(0, 30), c[0] + 40, R(0, 60));
    if (o.invulnTo('proj') && o.st !== 'dizzy') return;
    if (o.st === 'down' || o.st === 'techroll') return;
    let dmg = big ? 26 : 9;
    if (simple) dmg = Math.round(dmg * 0.5);
    if (big) {
      const h = { dmg, tier: 6, str: 'h', hs: 16, guard: 'unblockable', pb: 2, spark: '#ff9090', sfx: 'cleave_hit', minScale: 1, jug: 1 };
      JJK.Combat.hit(m, f, o, h, c, { moveId: 'shrine' + m.frame }, JJK.STR.h);
    } else {
      o.hp = Math.max(o.hp - dmg, m.training ? 1 : 0);
      o.dmgTakenRound += dmg;
      o.flash = 2;
      o.hitstop = Math.max(o.hitstop, 3);
      f.meterGain(dmg * 0.3);
      FX.hitSpark(c[0], c[1], Math.sign(o.x - f.x) || 1, 0.3, '#ff9090');
      if (m.hud) m.hud.onHit(f, o, { dmg });
      if (o.hp <= 0) m.onKO(o, f, { dmg });
    }
  };

  D.end = function (m) {
    const d = m.domain;
    if (!d) return;
    const f = d.owner, o = d.victim;
    m.domain = null;
    m.domainVisual = null;
    if (d.amb) d.amb.stop(0.6);
    if (m.stage && m.stage.setMode) m.stage.setMode('normal', { frames: 30 });
    snd('domain_shatter');
    m.flashScreen('#ffffff', 0.5, 10);
    m.cam.shake(0.4);
    o.domainStun = 0;
    if (o.st === 'dizzy') { o.stun = 0; }
    f.cs.shrineBuff = false;
    // technique burnout after a domain
    f.burnout = BURNOUT;
    if (f.cs.infOn !== undefined) { f.cs.infOn = false; }
    if (f.cs.da) f.cs.da = false;
    m.popText(f, 'BURNOUT', '#a0a0b0', true);
    snd('burnout', { pan: f.pan() });
    if (JJK.Music && m.phase === 'fight') JJK.Music.play('battle', 0.6);
  };

  // ------------------------------------------------------------- clash
  D.startClash = function (m, a, b) {
    // a = first expander, b = counter-expander
    if (m.domain) { const d = m.domain; if (d.amb) d.amb.stop(0.2); m.domain = null; d.victim.domainStun = 0; }
    if (JJK.Music) JJK.Music.cut();
    snd('domain_clash');
    m.projectiles.length = 0;
    const left = a.x < b.x ? a : b;
    const right = left === a ? b : a;
    m.clash = {
      a, b, left, right, t: 0, round: 0, rounds: 3, scores: new Map([[a, 0], [b, 0]]),
      phase: 'intro', ring: 0, speed: 1, pressed: new Map(), results: [], split: 0.5, splitV: 0,
      loop: JJK.Audio ? JJK.Audio.loop('domain_clash_loop', { vol: 0.7 }) : null,
    };
    for (const f of [a, b]) { f.move = null; f.st = 'cinematic'; f.setAnim('domainSign2' in f.def.poses ? 'idle' : 'idle'); f.vx = 0; f.vy = 0; }
    if (m.stage && m.stage.setMode) m.stage.setMode('clash', { split: 0.5, leftMode: D.typeOf(left), rightMode: D.typeOf(right), frames: 20 });
    m.banner('DOMAIN CLASH', { life: 90, scale: 6, top: '#ffffff', mid: '#ffd0ff', mid2: '#c060ff', bot: '#300050' });
    if (JJK.Voice) JJK.Voice.announce('Domain clash');
    m.cam.shake(0.6);
  };

  D.updateClash = function (m) {
    const c = m.clash;
    c.t++;
    const [f1, f2] = [c.left, c.right];
    for (const f of [f1, f2]) {
      f.readInput();
      f.pose = JJK.Rig.full(f.def.poses.domainSign2 || f.def.poses.idle);
      f.updatePose();
      f.hairLift = 4;
    }
    m.cam.override = { x: U.clamp((f1.x + f2.x) / 2, -m.cam.limit, m.cam.limit), y: JJK.CAM_BASE_Y + 10, zoom: 1.08, speed: 0.1 };
    // boundary wobble + tug of war based on scores
    const diff = (c.scores.get(f1) - c.scores.get(f2));
    const target = U.clamp(0.5 + diff * 0.12, 0.15, 0.85) + Math.sin(c.t * 0.15) * 0.03;
    c.splitV += (target - c.split) * 0.05; c.splitV *= 0.85; c.split += c.splitV;
    if (m.stage && m.stage.setSplit) m.stage.setSplit(c.split);
    m.cam.shake(0.03);
    if (c.loop) c.loop.setLevel(0.5 + 0.5 * Math.abs(diff) / 3);
    if (c.phase === 'intro') {
      if (c.t >= 70) { c.phase = 'ring'; c.ring = 0; c.pressed = new Map(); c.speed = [1.0, 1.25, 1.5][c.round] * (0.9 + JJK.rng() * 0.25); }
      return;
    }
    if (c.phase === 'ring') {
      c.ring += c.speed;
      const r = D.ringR(c);
      for (const f of [f1, f2]) {
        if (c.pressed.has(f)) continue;
        let press = f.buf.pr(0) & (B.L | B.M | B.H | B.SP | B.SU | B.UN);
        if (f.cpu) press = f.cpu.clashPress(r);
        if (press) {
          const err = Math.abs(r - 16);
          const score = err <= 2 ? 1 : err <= 6 ? 0.6 : err <= 12 ? 0.25 : 0;
          c.pressed.set(f, { score, r });
          c.scores.set(f, c.scores.get(f) + score);
          snd(score >= 1 ? 'perfect_guard' : score > 0 ? 'block' : 'ui_error', { pan: f === f1 ? -0.6 : 0.6 });
          m.cam.shake(0.1 + score * 0.2);
        }
      }
      if (r <= -6 || c.pressed.size === 2) {
        c.results.push(new Map(c.pressed));
        c.phase = 'result'; c.pt = 0;
      }
      return;
    }
    if (c.phase === 'result') {
      c.pt++;
      if (c.pt >= 40) {
        c.round++;
        if (c.round >= c.rounds) { c.phase = 'resolve'; c.pt = 0; }
        else { c.phase = 'ring'; c.ring = 0; c.pressed = new Map(); c.speed = [1.0, 1.25, 1.5][c.round] * (0.9 + JJK.rng() * 0.25); }
      }
      return;
    }
    if (c.phase === 'resolve') {
      c.pt++;
      if (c.pt === 1) {
        const s1 = c.scores.get(f1), s2 = c.scores.get(f2);
        c.winner = Math.abs(s1 - s2) < 0.2 ? null : s1 > s2 ? f1 : f2;
        if (c.winner) m.banner(c.winner.def.name + ' PREVAILS', { life: 80, scale: 4 });
        else m.banner('BOTH DOMAINS SHATTER', { life: 80, scale: 3 });
        snd('domain_shatter');
        m.flashScreen('#ffffff', 0.8, 12);
        m.cam.shake(0.8);
      }
      if (c.pt >= 60) {
        if (c.loop) c.loop.stop(0.3);
        m.clash = null;
        m.cam.override = null;
        for (const f of [f1, f2]) { f.st = 'idle'; f.toNeutral(); f.hairLift = 0; }
        if (c.winner) {
          const loser = m.opp(c.winner);
          loser.burnout = BURNOUT;
          m.popText(loser, 'BURNOUT', '#a0a0b0', true);
          D.activate(c.winner, m, D.typeOf(c.winner), { short: true, durMul: 0.75 });
        } else {
          for (const f of [f1, f2]) f.burnout = BURNOUT;
          if (m.stage && m.stage.setMode) m.stage.setMode('normal', { frames: 30 });
          if (JJK.Music) JJK.Music.play('battle');
        }
      }
    }
  };

  D.ringR = function (c) { return 70 - c.ring * 1.1; };

  D.drawClash = function (ctx, m) {
    const c = m.clash;
    const W = JJK.W;
    // boundary energy
    const bx = c.split * W;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 3; i++) {
      const pts = FX.boltPath(bx + R(-4, 4), 0, bx + R(-4, 4), 360, 18, 12, (m.frame * 7 + i * 31) | 0);
      FX.strokePts(ctx, pts, 3 - i, i === 0 ? '#ffffff' : i === 1 ? '#e0a0ff' : '#ff6060');
    }
    ctx.restore();
    if (c.phase === 'ring' || c.phase === 'result') {
      const r = D.ringR(c);
      const sides = [[c.left, 150], [c.right, 490]];
      for (const [f, x] of sides) {
        const y = 200;
        const col = f.def.id === 'gojo' ? '#9fe0ff' : '#ff8080';
        // target ring
        FX.pxRing(ctx, x, y, 18, 4, 'rgba(255,255,255,0.9)');
        FX.pxRing(ctx, x, y, 14, 1, col);
        // closing ring
        const pr = c.pressed.get(f);
        const rr = pr ? pr.r : r;
        if (rr > 0) FX.pxRing(ctx, x, y, rr, 2, pr ? '#ffffff' : col);
        if (pr) {
          const t = pr.score >= 1 ? 'PERFECT' : pr.score >= 0.6 ? 'GREAT' : pr.score > 0 ? 'GOOD' : 'MISS';
          JJK.Font.draw(ctx, t, x, y + 30, { color: pr.score >= 1 ? '#ffffff' : pr.score > 0 ? col : '#808080', align: 'center', outline: '#000', scale: 2 });
        } else {
          JJK.Font.draw(ctx, 'PRESS!', x, y + 30, { color: '#ffffff', align: 'center', outline: '#000', scale: 1 });
        }
        // score pips
        for (let i = 0; i < c.rounds; i++) {
          const res = c.results[i] && c.results[i].get(f);
          const pc = res ? (res.score >= 1 ? '#ffffff' : res.score > 0 ? col : '#404040') : '#202020';
          FX.pxCircle(ctx, x - 16 + i * 16, y - 34, 4, pc);
        }
      }
      JJK.Font.draw(ctx, 'ROUND ' + (c.round + 1) + ' / ' + c.rounds, 320, 300, { color: '#ffffff', align: 'center', outline: '#000' });
      JJK.Font.draw(ctx, 'PRESS ANY ATTACK WHEN THE RINGS ALIGN', 320, 312, { color: '#d0c0ff', align: 'center', outline: '#000' });
    }
  };

  // Lights from domain visuals
  D.lights = function (m) {
    const d = m.domain;
    if (!d) return;
    if (d.type === 'void') FX.light(d.owner.x, 260, 500, [60, 120, 255], 0.5);
    else FX.light(d.owner.x - d.owner.facing * 170, 160, 420, [255, 30, 20], 0.6);
  };

  D.drawBack = function (ctx, m) {};
  D.drawFront = function (ctx, m) {
    const d = m.domain;
    if (!d) return;
    const cam = m.cam;
    if (d.type === 'void' && d.victim.domainStun > 0) {
      // the victim's mind is flooded: a halo of white glyph-like noise around the head
      const h = d.victim.anchor('head');
      const sx = cam.sx(h[0]), sy = cam.sy(h[1]);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = '#e8f6ff';
      for (let i = 0; i < 26; i++) {
        const a = Math.random() * Math.PI * 2, r = R(16, 40) * cam.ez;
        ctx.fillRect(Math.round(sx + Math.cos(a) * r), Math.round(sy + Math.sin(a) * r), 1 + (i % 2), 1);
      }
      ctx.restore();
    }
    // timer bar for the domain
    const k = 1 - d.t / d.dur;
    const col = d.type === 'void' ? '#9fe0ff' : '#ff5050';
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(220, 66, 200, 5);
    ctx.fillStyle = col;
    ctx.fillRect(221, 67, Math.round(198 * k), 3);
    JJK.Font.draw(ctx, INFO[d.type].name, 320, 74, { color: col, align: 'center', outline: '#000' });
  };
})();

</script>
<script>/* src/game/hud.js */
// Arcade HUD modeled on the reference: names, health with recoverable (RCT) health,
// wins, round & timer, cursed energy levels, domain gauge, character gauges,
// portraits, combo counter, banners, super names and voice captions.
(function () {
  'use strict';
  const JJK = (typeof window !== 'undefined' ? window : globalThis).JJK;
  const U = JJK.U, Font = JJK.Font, FX = JJK.FX;
  const W = JJK.W;

  const portraits = {};
  JJK.portrait = function (charId, pal, size = 30, eyes) {
    const key = charId + pal + size + (eyes ? 'e' : '');
    if (portraits[key] || typeof document === 'undefined') return portraits[key];
    const def = JJK.Chars[charId];
    const r = new JJK.Raster(size, size);
    const pose = JJK.Rig.full(Object.assign({}, def.poses.idle, { head: -2, lean: 4, bend: 0, eyes: eyes ? 'open' : 'band' }));
    const J = JJK.Rig.solve(pose, def.art.dims);
    const z = size / 30 * 1.15;
    const xf = new JJK.Rig.Xform().set(size / 2 - J.head[0] * z + 1, size * 0.56 + J.head[1] * z, 1, z, 0, [0, 70], 1, 1);
    r.begin();
    r.lights.push({ x: size * 0.2, y: size * 0.2, r: size, r2: size * size, c: def.id === 'gojo' ? [40, 100, 255] : [255, 50, 30], i: 0.6 });
    def.art.draw(r, J, xf, { pose, pal, sec: new JJK.Rig.Secondary(), eyesOpen: !!eyes });
    r.outline(def.art.outline, 0, true);
    r.flush();
    portraits[key] = r.canvas;
    return r.canvas;
  };

  class HUD {
    constructor(m) {
      this.m = m;
      this.disp = [1000, 1000]; // smoothed health for the damage trail
      this.combo = [null, null];
      this.comboT = [0, 0];
      this.lastCombo = [null, null];
      this.shakeP = [0, 0];
      this.t = 0;
    }
    tick() {
      this.t++;
      const m = this.m;
      for (let i = 0; i < 2; i++) {
        const f = m.fighters[i];
        if (this.disp[i] > f.hp) {
          if (f.isStunned() && f.combo.hits > 0) this.disp[i] -= 0.4; // hold during combo
          else this.disp[i] = Math.max(f.hp, this.disp[i] - 4);
        } else this.disp[i] = f.hp;
        if (this.comboT[i] > 0) this.comboT[i]--;
        if (this.shakeP[i] > 0) this.shakeP[i]--;
      }
    }
    onHit(att, def, info) {
      const i = att.side;
      this.combo[i] = { hits: def.combo.hits, dmg: def.combo.dmg };
      this.comboT[i] = 70;
      this.shakeP[def.side] = 6;
    }
    comboEnd(i, combo) {
      this.lastCombo[i] = { hits: combo.hits, dmg: combo.dmg };
    }

    draw(ctx) {
      const m = this.m;
      const [a, b] = m.fighters;
      ctx.save();
      // top gradient for legibility
      const g = ctx.createLinearGradient(0, 0, 0, 52);
      g.addColorStop(0, 'rgba(0,0,0,0.6)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, 52);
      this.side(ctx, a, 0);
      this.side(ctx, b, 1);
      // round + timer
      const label = m.training ? 'TRAINING' : (m.roundLabel || 'ROUND ' + m.round);
      Font.draw(ctx, label, W / 2, 3, { color: '#ffd23a', align: 'center', shadow: '#000' });
      const time = m.training ? '∞' : U.mmss(m.timer / 60);
      const low = !m.training && m.timer < 10 * 60;
      Font.draw(ctx, time, W / 2, 13, { color: low && (this.t % 30 < 15) ? '#ff5040' : '#ffffff', align: 'center', scale: 2, outline: '#000' });
      // wins markers
      const need = m.winsNeeded;
      for (let i = 0; i < need; i++) {
        this.winDot(ctx, W / 2 - 22 - i * 9, 34, a.wins > i);
        this.winDot(ctx, W / 2 + 22 + i * 9, 34, b.wins > i);
      }
      Font.draw(ctx, 'WIN', W / 2, 31, { color: '#ffd23a', align: 'center', shadow: '#000' });
      // combo counters
      for (let i = 0; i < 2; i++) {
        const c = this.combo[i];
        if (c && this.comboT[i] > 0 && c.hits >= 2) {
          const x = i === 0 ? 16 : W - 16;
          const al = i === 0 ? 'left' : 'right';
          const k = Math.min(1, this.comboT[i] / 15);
          ctx.globalAlpha = k;
          const pop = this.comboT[i] > 64 ? 1 + (this.comboT[i] - 64) * 0.08 : 1;
          Font.draw(ctx, String(c.hits), x, 110 - (pop - 1) * 6, { color: '#ffffff', align: al, scale: Math.round(4 * pop), outline: '#000' });
          Font.draw(ctx, 'HITS', x + (i === 0 ? 0 : 0), 142, { color: '#ffd23a', align: al, scale: 2, outline: '#000' });
          Font.draw(ctx, 'DMG ' + c.dmg, x, 160, { color: '#ffb0a0', align: al, outline: '#000' });
          ctx.globalAlpha = 1;
        }
      }
      // super name cut-in
      const sn = m.superName;
      if (sn) {
        const k = Math.min(1, sn.t / 6), out = sn.t > sn.life - 10 ? (sn.life - sn.t) / 10 : 1;
        ctx.globalAlpha = Math.max(0, out);
        const y = 270;
        const x = sn.side === 0 ? 24 - (1 - k) * 200 : W - 24 + (1 - k) * 200;
        const bw = Font.width(sn.text, 2) + 30;
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(sn.side === 0 ? x - 12 : x - bw + 12, y - 6, bw, 26);
        ctx.fillStyle = sn.color || '#fff';
        ctx.fillRect(sn.side === 0 ? x - 12 : x - bw + 12, y - 6, bw, 2);
        ctx.fillRect(sn.side === 0 ? x - 12 : x - bw + 12, y + 18, bw, 2);
        Font.draw(ctx, sn.text, x, y, { color: '#ffffff', align: sn.side === 0 ? 'left' : 'right', scale: 2, outline: '#000' });
        ctx.globalAlpha = 1;
      }
      // banners
      for (const bt of m.texts) this.banner(ctx, bt);
      // captions (subtitles)
      let cy = m.training ? 300 : 340;
      for (let i = m.captions.length - 1; i >= 0; i--) {
        const c = m.captions[i];
        const k = c.t < 6 ? c.t / 6 : c.t > c.life - 12 ? (c.life - c.t) / 12 : 1;
        ctx.globalAlpha = Math.max(0, k);
        const col = c.id === 'gojo' ? '#bfe8ff' : c.id === 'sukuna' ? '#ffb8b0' : '#ffe08a';
        const txt = (c.id === 'announcer' ? '' : (c.id === 'gojo' ? 'GOJO: ' : 'SUKUNA: ')) + c.text.toUpperCase();
        const w = Font.width(txt) + 10;
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(Math.round(W / 2 - w / 2), cy - 2, w, 11);
        Font.draw(ctx, txt, W / 2, cy, { color: col, align: 'center' });
        cy -= 13;
        ctx.globalAlpha = 1;
      }
      ctx.restore();
    }

    winDot(ctx, x, y, on) {
      FX.pxCircle(ctx, x, y, 3.5, '#000');
      FX.pxCircle(ctx, x, y, 2.8, on ? '#ffd23a' : '#3a3a3a');
      if (on) FX.pxCircle(ctx, x - 0.6, y - 0.6, 1, '#fff8c0');
    }

    side(ctx, f, i) {
      const m = this.m;
      const L = i === 0;
      const shake = this.shakeP[i] > 0 ? (this.shakeP[i] % 2 ? 1 : -1) : 0;
      const px = L ? 6 : W - 6 - 32;
      // portrait
      const por = JJK.portrait(f.def.id, f.pal, 30);
      ctx.fillStyle = '#000';
      ctx.fillRect(px, 4, 32, 32);
      ctx.fillStyle = f.def.color;
      ctx.fillRect(px, 4, 32, 1); ctx.fillRect(px, 35, 32, 1); ctx.fillRect(px, 4, 1, 32); ctx.fillRect(px + 31, 4, 1, 32);
      if (por) {
        ctx.save();
        if (!L) { ctx.translate(px + 31, 5); ctx.scale(-1, 1); ctx.drawImage(por, 0, 0); }
        else ctx.drawImage(por, px + 1, 5);
        ctx.restore();
      }
      // name + wins
      const x0 = L ? 44 : W - 44 - 230, x1 = x0 + 230;
      Font.draw(ctx, (L ? 'P1: ' : 'P2: ') + f.def.name + (f.cpu ? ' (CPU)' : ''), L ? x0 : x1, 4, { color: '#ffffff', align: L ? 'left' : 'right', shadow: '#000' });
      Font.draw(ctx, 'WINS: ' + String(f.wins).padStart(2, '0'), L ? x1 : x0, 4, { color: '#ffffff', align: L ? 'right' : 'left', shadow: '#000' });
      // health bar
      const hy = 14, hh = 11, hw = 230;
      ctx.fillStyle = '#000';
      ctx.fillRect(x0 - 1 + shake, hy - 1, hw + 2, hh + 2);
      ctx.fillStyle = '#5a0a0a';
      ctx.fillRect(x0 + shake, hy, hw, hh);
      const hpK = Math.max(0, f.hp) / f.maxHp;
      const dispK = Math.max(0, this.disp[i]) / f.maxHp;
      const redK = Math.min(1, (Math.max(0, f.hp) + f.red) / f.maxHp);
      const seg = (k0, k1, col) => {
        const w0 = Math.round(hw * k0), w1 = Math.round(hw * k1);
        if (w1 <= w0) return;
        if (L) { ctx.fillStyle = col; ctx.fillRect(x0 + shake + hw - w1, hy, w1 - w0, hh); }
        else { ctx.fillStyle = col; ctx.fillRect(x0 + shake + w0, hy, w1 - w0, hh); }
      };
      // damage trail (white/yellow), recoverable (pale red), current health (green gradient)
      seg(hpK, dispK, '#ffe8a0');
      seg(hpK, redK, '#d06a6a');
      const lowHp = hpK < 0.25;
      const hpCol = lowHp ? (this.t % 20 < 10 ? '#e8b820' : '#d09010') : '#38c040';
      seg(0, hpK, hpCol);
      // bevel highlights
      const fillW = Math.round(hw * hpK);
      const fx = L ? x0 + shake + hw - fillW : x0 + shake;
      ctx.fillStyle = lowHp ? 'rgba(255,240,160,0.6)' : 'rgba(180,255,170,0.65)';
      ctx.fillRect(fx, hy, fillW, 2);
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(fx, hy + hh - 3, fillW, 3);
      // tick marks every 10%
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      for (let k = 1; k < 10; k++) ctx.fillRect(x0 + shake + Math.round(hw * k / 10), hy, 1, hh);
      // guard gauge (thin)
      const gk = U.clamp(f.guard / 100, 0, 1);
      ctx.fillStyle = '#101010';
      ctx.fillRect(x0, hy + hh + 2, hw, 2);
      ctx.fillStyle = gk < 0.3 ? '#ff6040' : '#9ab0d0';
      const gw = Math.round(hw * gk);
      ctx.fillRect(L ? x0 + hw - gw : x0, hy + hh + 2, gw, 2);
      // cursed energy meter (3 levels)
      const my = 31, mh = 6, mw = 120;
      const mx = L ? x0 : x1 - mw;
      ctx.fillStyle = '#000';
      ctx.fillRect(mx - 1, my - 1, mw + 2, mh + 2);
      ctx.fillStyle = '#16121e';
      ctx.fillRect(mx, my, mw, mh);
      const lvl = Math.floor(f.meter / 100);
      const part = (f.meter % 100) / 100;
      const segW = mw / 3;
      const ceCol = f.def.id === 'gojo' ? ['#2a6aff', '#5aa8ff', '#bfe8ff'] : ['#c01818', '#ff4a3a', '#ffc0b0'];
      for (let s = 0; s < 3; s++) {
        let k = s < lvl ? 1 : s === lvl ? part : 0;
        if (k <= 0) continue;
        const w = Math.round(segW * k) - (s < 2 ? 1 : 0);
        const sx = L ? mx + s * segW : mx + mw - s * segW - w;
        const full = s < lvl;
        ctx.fillStyle = full ? ceCol[1] : ceCol[0];
        ctx.fillRect(Math.round(sx), my, w, mh);
        if (full) {
          ctx.fillStyle = ceCol[2];
          ctx.fillRect(Math.round(sx), my, w, 1);
          // shimmer
          const sh = (this.t * 2 + s * 20) % (segW + 20) - 10;
          ctx.fillStyle = 'rgba(255,255,255,0.35)';
          ctx.fillRect(Math.round(sx + U.clamp(sh, 0, w - 3)), my, 3, mh);
        }
      }
      ctx.fillStyle = '#000';
      ctx.fillRect(mx + Math.round(segW), my, 1, mh);
      ctx.fillRect(mx + Math.round(segW * 2), my, 1, mh);
      Font.draw(ctx, 'LV' + lvl, L ? mx + mw + 4 : mx - 4, my - 1, { color: lvl >= 3 ? (this.t % 20 < 10 ? '#ffffff' : ceCol[2]) : ceCol[2], align: L ? 'left' : 'right', shadow: '#000' });
      // domain gauge
      const dk = U.clamp(f.dg / 100, 0, 1);
      const ready = dk >= 1 && f.meter >= 200 && f.burnout <= 0;
      const dx = L ? x1 - 54 : x0;
      const dw = 54, dy = 32;
      ctx.fillStyle = '#000';
      ctx.fillRect(dx - 1, dy - 1, dw + 2, 6);
      ctx.fillStyle = '#1a1020';
      ctx.fillRect(dx, dy, dw, 4);
      ctx.fillStyle = dk >= 1 ? (this.t % 16 < 8 ? '#ffffff' : f.def.color) : '#8a60c0';
      const dww = Math.round(dw * dk);
      ctx.fillRect(L ? dx + dw - dww : dx, dy, dww, 4);
      Font.draw(ctx, ready ? 'DOMAIN READY' : 'DOMAIN', L ? x1 : x0, dy + 7, { color: ready ? (this.t % 16 < 8 ? '#ffffff' : f.def.color) : '#a090c0', align: L ? 'right' : 'left', shadow: '#000' });
      // character-specific gauge
      const cy = 41;
      if (f.def.id === 'gojo') {
        const cs = f.cs;
        const iw = 80;
        const ix = L ? x0 : x1 - iw;
        ctx.fillStyle = '#000';
        ctx.fillRect(ix - 1, cy - 1, iw + 2, 5);
        ctx.fillStyle = '#101820';
        ctx.fillRect(ix, cy, iw, 3);
        const ik = cs.inf / 100;
        ctx.fillStyle = cs.infBroken ? '#506070' : cs.infOn ? (this.t % 12 < 6 ? '#ffffff' : '#bfe8ff') : '#6a9ac0';
        const iww = Math.round(iw * ik);
        ctx.fillRect(L ? ix : ix + iw - iww, cy, iww, 3);
        Font.draw(ctx, cs.infBroken ? '∞ BROKEN' : cs.infOn ? '∞ INFINITY' : '∞', L ? ix + iw + 4 : ix - 4, cy - 2, { color: cs.infOn ? '#ffffff' : '#8ab0d0', align: L ? 'left' : 'right', shadow: '#000' });
      } else if (f.def.id === 'sukuna') {
        const cs = f.cs;
        for (let k = 0; k < 3; k++) {
          const fx = L ? x0 + 4 + k * 10 : x1 - 4 - k * 10;
          const on = cs.kindle > k;
          FX.pxCircle(ctx, fx, cy + 2, 3, on ? '#ff8a1a' : '#2a1a14');
          if (on) FX.pxCircle(ctx, fx, cy + 1, 1.5, '#ffe080');
        }
        Font.draw(ctx, 'KINDLING', L ? x0 + 34 : x1 - 34, cy - 1, { color: '#ffb070', align: L ? 'left' : 'right', shadow: '#000' });
        if (cs.da) Font.draw(ctx, 'AMPLIFIED', L ? x0 + 88 : x1 - 88, cy - 1, { color: this.t % 20 < 10 ? '#d0a0ff' : '#ffffff', align: L ? 'left' : 'right', shadow: '#000' });
      }
      if (f.burnout > 0) Font.draw(ctx, 'BURNOUT ' + Math.ceil(f.burnout / 60), L ? x0 + 140 : x1 - 140, cy + 8, { color: '#a0a0b0', align: L ? 'left' : 'right', shadow: '#000' });
    }

    banner(ctx, bt) {
      const k = bt.t / bt.life;
      const opts = { scale: bt.scale || 6 };
      if (bt.top) Object.assign(opts, { top: bt.top, mid: bt.mid, mid2: bt.mid2, bot: bt.bot });
      const c = Font.banner(bt.text, opts);
      if (!c) return;
      let s = 1;
      if (bt.t < 6) s = 1.6 - bt.t * 0.1;
      const alpha = k > 0.85 ? (1 - k) / 0.15 : 1;
      const w = c.width * s, h = c.height * s;
      let x = W / 2 - w / 2, y = (bt.y || 130) - h / 2;
      if (bt.shake && bt.t < 12) { x += U.rand(-3, 3); y += U.rand(-3, 3); }
      ctx.globalAlpha = Math.max(0, alpha);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(c, Math.round(x), Math.round(y), Math.round(w), Math.round(h));
      ctx.globalAlpha = 1;
    }
  }
  JJK.HUD = HUD;
})();

</script>
<script>/* src/game/ai.js */
// CPU opponents. The AI only drives a virtual controller, so it must obey the
// same rules (motions, frame data, meter) as a human. Difficulty controls
// reaction time, defense, anti-airs, punishes, combo length and meter use.
(function () {
  'use strict';
  const JJK = (typeof window !== 'undefined' ? window : globalThis).JJK;
  const U = JJK.U, B = JJK.BTN;

  const LEVELS = {
    easy: { bf: 0, react: 30, block: 0.22, antiair: 0.1, punish: 0.1, combo: 1, specials: 0.25, supers: 0.08, aggr: 0.35, tech: 0.1, perfect: 0.1, mash: 0.2, parry: 0, jump: 0.15 },
    normal: { bf: 0.04, react: 20, block: 0.5, antiair: 0.35, punish: 0.35, combo: 2, specials: 0.45, supers: 0.3, aggr: 0.5, tech: 0.4, perfect: 0.3, mash: 0.5, parry: 0.02, jump: 0.12 },
    hard: { bf: 0.1, react: 14, block: 0.74, antiair: 0.62, punish: 0.68, combo: 3, specials: 0.58, supers: 0.65, aggr: 0.55, tech: 0.7, perfect: 0.55, mash: 0.8, parry: 0.05, jump: 0.1 },
    extreme: { bf: 0.2, react: 10, block: 0.88, antiair: 0.85, punish: 0.9, combo: 4, specials: 0.66, supers: 0.85, aggr: 0.6, tech: 0.9, perfect: 0.75, mash: 1, parry: 0.08, jump: 0.08 },
    boss: { bf: 0.35, react: 7, block: 0.94, antiair: 0.94, punish: 1, combo: 4, specials: 0.7, supers: 1, aggr: 0.85, tech: 1, perfect: 0.9, mash: 1, parry: 0.12, jump: 0.1 },
  };
  JJK.AI_LEVELS = LEVELS;

  // Combo routes (ids of moves), executed on hit-confirm.
  const ROUTES = {
    gojo: {
      basic: ['5L', '5M', '5H', 'red'],
      low: ['2L', '2M', 'redLaunch'],
      launch: ['5M', '2H', 'J', 'jM', 'jH'],
      meter: ['5M', '5H', 'maxRed'],
      pull: ['bluePull', '5M', '5H', 'redLaunch'],
      cancelSpecial: { red: '214SP', redLaunch: '2SP', maxRed: '214SU', blueCrush: '236SU', bluePull: '5SP' },
    },
    sukuna: {
      basic: ['5L', '5M', '5H', 'cleave'],
      low: ['2L', '2M', 'dismantle'],
      launch: ['5M', '2H', 'J', 'jM', 'jH'],
      meter: ['5M', '5H', 'enhancedCleave'],
      cancelSpecial: { cleave: '214SP', dismantle: '236SP', enhancedCleave: '214SU', cross: '2SP', lunge: '6SP' },
    },
  };

  class AI {
    constructor(f, level) {
      this.f = f;
      this.level = level;
      this.p = LEVELS[level] || LEVELS.normal;
      // rushdown needs more execution than zoning: at the lower tiers CPU Sukuna is
      // blended toward the next tier so each difficulty feels similar for both characters
      const order = ['easy', 'normal', 'hard', 'extreme', 'boss'];
      const li = order.indexOf(level);
      if (f.def.id === 'sukuna' && li >= 0 && li < 3) {
        const a = this.p, b = LEVELS[order[li + 1]], k = 0.6;
        const mix = {};
        for (const key in a) mix[key] = a[key] + (b[key] - a[key]) * k;
        mix.combo = Math.round(mix.combo);
        this.p = mix;
      }
      this.plan = [];
      this.cool = 0;
      this.t = 0;
      this.route = null;
      this.ri = 0;
      this.holdSU = false;
      this.holdSP = false;
      this.holdT = 0;
      this.aim = null;
      this.wantSimple = false;
      this.seenAttack = 0;
      this.habit = { jumps: 0, projectiles: 0, approaches: 0 };
      this.blockT = 0;
      this.blockDir = 4;
      this.clashDone = false;
      this.rng = U.makeRng(((Math.random() * 1e9) | 0) + f.side);
    }
    r() { return this.rng(); }

    // Emit the virtual controller frame.
    emit(rel, held) {
      const f = this.f;
      const abs = f.facing > 0 ? rel : JJK.mirrorDir(rel);
      f.ctrl.virtual = { dir: abs, held: held | 0 };
    }

    // Queue a command string, e.g. '236SP', '5L', '2M', 'LM', 'MH', '66', 'SPSU', 'j', 'jH'
    cmd(s) {
      const steps = [];
      if (s === 'J') { steps.push({ d: 8 }, { d: 8 }, { d: 8 }, { d: 8 }); this.plan.push(...steps); return; }
      if (s === 'JF') { steps.push({ d: 9 }, { d: 9 }, { d: 9 }, { d: 9 }); this.plan.push(...steps); return; }
      if (s === '66' || s === '44') {
        const d = +s[0];
        steps.push({ d }, { d: 5 }, { d });
        this.plan.push(...steps);
        return;
      }
      let air = false;
      if (s[0] === 'j') { air = true; s = s.slice(1); }
      const m = s.match(/^(\d*)(L|M|H|SP|SU|UN|LM|MH|SPSU)$/);
      if (!m) return;
      let digits = m[1] || '5';
      const btn = { L: B.L, M: B.M, H: B.H, SP: B.SP, SU: B.SU, UN: B.UN, LM: B.L | B.M, MH: B.M | B.H, SPSU: B.SP | B.SU }[m[2]];
      for (let i = 0; i < digits.length - 1; i++) steps.push({ d: +digits[i] });
      const last = +digits[digits.length - 1];
      steps.push({ d: last, b: btn });
      steps.push({ d: last === 5 || air ? 5 : last });
      this.plan.push(...steps);
    }
    hold(rel, n) { for (let i = 0; i < n; i++) this.plan.push({ d: rel }); }

    think(m) {
      const f = this.f, o = m.opp(f);
      this.t++;
      if (this.holdT > 0) { this.holdT--; if (this.holdT === 0) { this.holdSU = false; this.holdSP = false; } }
      // follow the current plan
      if (this.plan.length) {
        const s = this.plan.shift();
        this.emit(s.d, s.b || 0);
        return;
      }
      this.emit(5, 0);
      if (m.clash) return;
      // dizzy: mash
      if (f.st === 'dizzy') {
        if (this.r() < this.p.mash * 0.5) this.emit(5, (this.t % 2) ? B.L : B.M);
        if (m.simplePrompt && m.simplePrompt.f === f && f.meter >= 100 && this.r() < this.p.supers) this.wantSimple = true;
        return;
      }
      if (m.simplePrompt && m.simplePrompt.f === f && f.meter >= 100 && this.r() < this.p.supers * 0.1) this.wantSimple = true;
      // knockdown: tech roll
      if (f.st === 'down' && f.sf === 4 && this.r() < this.p.tech) { this.emit(4, B.L); return; }
      // grabbed: tech
      if (f.st === 'grabbed' && f.techWindow > 0 && f.sf >= Math.max(2, 10 - this.p.react / 3) && this.r() < this.p.tech * 0.7) { this.emit(5, B.L | B.M); return; }
      // air combo after a jump cancel
      if (this.route && this.route[this.ri] === 'J' && f.st === 'air') {
        if (f.sf >= 4 && f.vy < 6) { this.ri++; const nx = this.route[this.ri]; if (nx) this.issue(f, nx); else this.route = null; }
        return;
      }
      // continue a combo on hit-confirm
      if (f.st === 'move') { this.comboStep(m, f, o); return; }
      if (f.st === 'block' || f.st === 'ablock') {
        // keep blocking; maybe parry next hit or reversal on wake
        this.emit(this.blockDir, 0);
        return;
      }
      if (!f.actionable && f.st !== 'air') return;
      // track opponent attack for reaction time
      const oAtt = o.st === 'move' && o.move && o.move.hits && o.phase !== 'recovery';
      if (oAtt) this.seenAttack++; else this.seenAttack = 0;
      const dist = Math.abs(o.x - f.x);
      // keep blocking for a short while after deciding to block
      if (this.blockT > 0) { this.blockT--; this.emit(this.blockDir, 0); return; }
      // ---- defense
      const proj = this.incomingProj(m);
      if (oAtt && dist < 230 && this.seenAttack >= Math.max(1, this.p.react - (o.move.s || 8) * 0.6)) {
        if (this.r() < this.p.block) {
          const g = o.move.hits[0].guard;
          const readGuard = this.level !== 'easy' && this.r() < this.p.block;
          this.blockDir = readGuard ? (g === 'low' ? 1 : 4) : this.r() < 0.5 ? 1 : 4;
          this.blockT = 10 + Math.floor(this.r() * 12);
          if (this.r() < this.p.parry && dist < 120) { this.cmd('MH'); this.blockT = 0; return; }
          // Gojo: switch on Infinity under pressure
          if (f.def.id === 'gojo' && !f.cs.infOn && f.cs.inf > 60 && this.r() < this.p.specials * 0.25) { this.plan.push({ d: 4, b: B.UN }); return; }
          this.emit(this.blockDir, 0);
          return;
        }
      }
      // answer zoning: jump over low projectiles, trade, or counter
      if (proj && proj.dist > 110 && proj.dist < 300 && f.onGround && f.actionable) {
        const x = this.r();
        if (x < this.p.jump * 2.2 && proj.y < 130) { this.cmd('JF'); return; }
        if (f.def.id === 'sukuna' && !f.cs.da && f.burnout <= 0 && x < this.p.specials * 0.5) { this.cmd(f.meter >= 50 && this.r() < this.p.supers * 0.3 ? '4SU' : '236SP'); return; }
      }
      if (proj && proj.dist < 200) {
        if (f.def.id === 'gojo' && !f.cs.infOn && f.cs.inf > 40 && this.r() < this.p.specials * 0.4) { this.plan.push({ d: 5, b: B.UN }); return; }
        if (this.r() < this.p.block * 0.8) { this.blockDir = 4; this.blockT = 14; this.emit(4, 0); return; }
        if (this.r() < this.p.jump && proj.y < 120) { this.cmd('JF'); return; }
      }
      // ---- anti-air
      if (o.y > 30 && o.st !== 'juggle' && dist < 170 && Math.sign(o.vx || f.x - o.x) === Math.sign(f.x - o.x) && f.onGround) {
        if (this.r() < this.p.antiair * 0.25) { this.antiAir(f); return; }
      }
      // ---- punish whiffs / recovery
      if (o.st === 'move' && o.phase === 'recovery' && o.move.tier >= 2) {
        const left = o.move.total - o.mf;
        if (left > 8 && dist < 110 && this.r() < this.p.punish * 0.35) { this.startRoute(f, 'meterOrBasic'); return; }
        if (left > 14 && dist < 250 && this.r() < this.p.punish * 0.2) { this.longPunish(f, m, o); return; }
      }
      if (this.cool > 0) { this.cool--; this.neutralMove(f, o, dist); return; }
      this.cool = Math.max(2, Math.round(this.p.react * (0.5 + this.r())));
      if (f.def.id === 'gojo') this.gojo(m, f, o, dist);
      else this.sukuna(m, f, o, dist);
    }

    incomingProj(m) {
      const f = this.f;
      let best = null;
      for (const p of m.projectiles) {
        if (p.owner === f || p.dead || !p.hit) continue;
        const dx = f.x - p.x;
        if (Math.sign(p.vx) !== Math.sign(dx) && Math.abs(dx) > 40) continue;
        const d = Math.abs(dx);
        if (!best || d < best.dist) best = { dist: d, y: p.y, p };
      }
      return best;
    }

    neutralMove(f, o, dist) {
      // drift toward preferred range
      const pref = f.def.id === 'gojo' ? 230 : 90;
      if (dist > pref + 40) this.emit(6, 0);
      else if (dist < pref - 40 && f.def.id === 'gojo') this.emit(4, 0);
    }

    antiAir(f) {
      if (f.def.id === 'gojo') this.cmd(this.r() < 0.5 && f.burnout <= 0 ? '2SP' : '2H');
      else this.cmd(this.r() < 0.5 && f.burnout <= 0 && !f.cs.da ? '2SP' : '2H');
      this.route = null;
    }

    longPunish(f, m, o) {
      if (f.def.id === 'gojo') {
        if (f.meter >= 100 && this.r() < this.p.supers) this.cmd('214SU');
        else if (f.burnout <= 0) this.cmd('6SP');
        else this.cmd('66');
      } else {
        if (f.meter >= 100 && this.r() < this.p.supers && !f.cs.da) this.cmd('214SU');
        else if (!f.cs.da && f.burnout <= 0) this.cmd('236SP');
        else this.cmd('6SP');
      }
    }

    startRoute(f, kind) {
      const R = ROUTES[f.def.id];
      let key = kind;
      if (kind === 'meterOrBasic') key = f.meter >= 100 && this.r() < this.p.supers ? 'meter' : this.r() < 0.35 ? 'launch' : 'basic';
      const route = R[key].slice(0, 1 + this.p.combo + (key === 'launch' ? 2 : 0));
      if ((f.burnout > 0 || (f.cs && f.cs.da)) && route.length) {
        // no techniques available: strip specials
        while (route.length && !['5L', '5M', '5H', '2L', '2M', '2H', 'J', 'jM', 'jH', 'jL'].includes(route[route.length - 1])) route.pop();
      }
      this.route = route; this.ri = 0;
      this.issue(f, route[0]);
    }

    issue(f, id) {
      const R = ROUTES[f.def.id];
      if (id === 'J') { this.plan.push({ d: 9 }, { d: 9 }); return; }
      if (R.cancelSpecial[id]) { this.cmd(R.cancelSpecial[id]); return; }
      if (id[0] === 'j') { this.cmd('j' + id.slice(1).replace(/^/, '5')); return; }
      const d = id[0], b = id.slice(1);
      // heavies in a chain: only sometimes hit the Black Flash timing
      if (b === 'H' && this.route && this.ri > 0 && this.r() > this.p.bf) {
        const n = 2 + Math.floor(this.r() * 2);
        for (let i = 0; i < n; i++) this.plan.push({ d: +d });
      }
      this.cmd(d + b);
    }

    comboStep(m, f, o) {
      if (!this.route) return;
      const mv = f.move;
      if (f.contact === 'hit' && f.hitstop <= 1) {
        const next = this.route[this.ri + 1];
        if (!next) { this.route = null; return; }
        // timing: input during cancel window
        if (f.mf >= mv.s) {
          this.ri++;
          this.issue(f, next);
        }
      } else if (f.contact === 'block' && f.mf >= mv.s) {
        // on block: maybe finish with a safe special or stop
        if (this.r() < 0.5 && this.route.length > this.ri + 1) {
          const last = this.route[this.route.length - 1];
          if (ROUTES[f.def.id].cancelSpecial[last] && (f.def.id !== 'sukuna' || last !== 'cleave')) this.issue(f, last);
        }
        this.route = null;
      } else if (!f.contact && f.mf > mv.s + mv.a) this.route = null;
    }

    // ---------------------------------------------------------------- brains
    gojo(m, f, o, dist) {
      const p = this.p, r = () => this.r();
      const tech = f.burnout <= 0;
      // domain
      if (tech && f.dg >= 100 && f.meter >= 200 && r() < p.supers * 0.5 && (o.st === 'down' || o.isStunned() || dist > 250)) { this.cmd('SPSU'); return; }
      // Hollow Purple when the opponent is far or knocked down
      if (tech && f.meter >= 100 && (o.st === 'down' || dist > 330) && r() < p.supers * 0.35) {
        this.cmd('623SU');
        this.holdSU = true;
        this.holdT = f.meter >= 300 && o.st === 'down' ? 120 : f.meter >= 200 ? 66 : 24;
        return;
      }
      // Infinity management vs. zoning
      if (tech && !f.cs.infOn && f.cs.inf > 70 && o.def.id === 'sukuna' && !o.cs.da && dist > 160 && r() < p.specials * 0.15) { this.plan.push({ d: 5, b: B.UN }); return; }
      if (f.cs.infOn && o.cs && o.cs.da && r() < 0.5) { this.plan.push({ d: 5, b: B.UN }); return; }
      if (dist > 300) {
        if (tech && r() < p.specials) { this.cmd(r() < 0.6 ? '214SP' : '236SP'); return; }
        if (r() < p.aggr * 0.5) { this.cmd('66'); return; }
        this.hold(6, 10);
        return;
      }
      if (dist > 160) {
        const x = r();
        if (tech && x < p.specials * 0.4) { this.cmd('5SP'); this.route = ['bluePull', '5M', '5H', 'redLaunch'].slice(0, 1 + p.combo); this.ri = 0; return; }
        if (tech && x < p.specials * 0.7) { this.cmd(r() < 0.5 ? '214SP' : '236SP'); return; }
        if (tech && x < p.specials * 0.8 && f.cs.tpCd <= 0) { this.cmd('22SP'); this.cool = 6; return; }
        if (x < 0.85) { this.cmd(r() < p.aggr ? '66' : '44'); return; }
        if (r() < p.jump) { this.cmd('JF'); return; }
        this.hold(r() < 0.5 ? 6 : 4, 12);
        return;
      }
      // close range
      const x = r();
      if (x < 0.12) { this.cmd('LM'); return; }
      if (x < 0.22 && tech) { this.cmd('2SP'); return; }
      if (x < 0.32) { this.cmd('44'); return; }
      if (x < 0.4 && f.meter >= 100 && r() < p.supers * 0.4 && tech) { this.cmd('236SU'); return; }
      this.startRoute(f, r() < 0.3 ? 'low' : r() < 0.5 ? 'launch' : 'basic');
    }

    sukuna(m, f, o, dist) {
      const p = this.p, r = () => this.r();
      const tech = f.burnout <= 0 && !f.cs.da;
      // Domain Amplification versus Infinity
      if (o.def.id === 'gojo' && o.cs.infOn && !f.cs.da && f.meter >= 40 && r() < 0.5) { this.plan.push({ d: 6, b: B.UN }); return; }
      if (f.cs.da && (!(o.cs && o.cs.infOn) || f.meter < 25) && r() < 0.3) { this.plan.push({ d: 5, b: B.UN }); return; }
      // domain
      if (tech && f.dg >= 100 && f.meter >= 200 && r() < p.supers * 0.5 && (o.st === 'down' || o.isStunned() || dist < 200)) { this.cmd('SPSU'); return; }
      // World Cutting Slash: aim at grounded/airborne opponent from range
      if (tech && f.meter >= 200 && dist > 200 && r() < p.supers * 0.2) {
        this.cmd('623SU');
        this.aim = o.y > 60 ? 1 : 0;
        return;
      }
      // Fuga when safe
      if (tech && (o.st === 'down' || dist > 320) && r() < p.specials * 0.3) {
        this.cmd('22SP');
        this.holdSP = true;
        this.holdT = f.meter >= 100 && f.cs.kindle >= 1 ? 80 : f.meter >= 50 ? 46 : 18;
        return;
      }
      const oRecover = o.st === 'move' && o.phase === 'recovery' && o.move.total - o.mf > 10;
      const oBusy = oRecover || o.st === 'block' || o.st === 'down' || o.st === 'wakeup';
      if (dist > 260) {
        // close the gap: dash on openings, otherwise walk in behind Dismantle pressure
        if (oBusy || r() < p.aggr * 0.35) { this.cmd('66'); this.hold(6, 14 + Math.floor(r() * 12)); return; }
        if (tech && r() < p.specials * 0.6) { this.cmd('236SP'); if (r() < 0.4) this.plan.push({ d: 5 }, { d: 5 }, { d: 5 }, { d: 5 }, { d: 5 }, { d: 5 }, { d: 5 }, { d: 5, b: B.SP }); return; }
        this.hold(6, 16);
        return;
      }
      if (dist > 130) {
        const x = r();
        if (oRecover && dist < 240) { this.cmd('6SP'); this.route = ['lunge', 'cleave']; this.ri = 0; return; }
        if (oBusy && x < 0.6) { this.cmd('66'); this.hold(6, 4); this.cmd(r() < 0.5 ? '2L' : 'LM'); this.route = ['2L', '2M', 'dismantle']; this.ri = 0; return; }
        if (tech && x < p.specials * 0.45) { this.cmd('236SP'); return; }
        if (x < 0.25 && r() < p.jump * 1.1 && !o.isStunned()) { this.cmd('JF'); this.plan.push({ d: 5 }, { d: 5 }, { d: 5 }, { d: 5 }, { d: 5 }, { d: 5 }, { d: 5 }, { d: 5 }, { d: 5 }, { d: 5, b: B.H }); return; }
        if (x < 0.4 && f.meter >= 50 && o.def.id === 'gojo' && o.cs.infOn && !f.cs.da) { this.plan.push({ d: 6, b: B.UN }); return; }
        // walk forward ready to block
        this.hold(6, 10 + Math.floor(r() * 10));
        return;
      }
      // close: mix-ups
      const x = r();
      if (x < 0.14) { this.cmd('LM'); return; }
      if (x < 0.22) { this.cmd('6H'); return; }
      if (x < 0.3 && tech) { this.cmd('63214SP'); return; }
      if (x < 0.38 && tech) { this.cmd('214SP'); return; }
      if (x < 0.44 && f.meter >= 100 && tech && r() < p.supers * 0.5) { this.cmd('214SU'); return; }
      this.startRoute(f, r() < 0.35 ? 'low' : r() < 0.55 ? 'launch' : 'basic');
    }

    // Domain clash timing press
    clashPress(r) {
      if (r > 60) this.clashDone = false;
      if (this.clashDone) return 0;
      const skill = this.p.perfect;
      const err = (1 - skill) * 14 * (this.r() < 0.5 ? -1 : 1) + (this.r() - 0.5) * 4;
      if (r <= 16 + err) { this.clashDone = true; return B.L; }
      return 0;
    }
  }

  JJK.AI = AI;
})();

</script>
<script>/* src/game/training.js */
// Training mode: infinite health/meter, hitbox display, frame data, frame meter,
// combo damage, dummy behaviors (stand/crouch/jump/block/CPU), recording & playback.
(function () {
  'use strict';
  const JJK = (typeof window !== 'undefined' ? window : globalThis).JJK;
  const U = JJK.U, B = JJK.BTN, Font = JJK.Font;
  const T = (JJK.Training = {});

  T.DUMMY = ['STAND', 'CROUCH', 'JUMP', 'CPU', 'RECORDING'];
  T.BLOCK = ['NONE', 'ALL', 'AFTER FIRST HIT', 'RANDOM'];

  T.makeOptions = () => ({
    infHp: true, infMeter: true, hitboxes: false, frameData: true, frameMeter: true,
    dummy: 0, block: 0, cpuLevel: 'normal',
    rec: [], recording: false, playing: false, playI: 0,
    last: null, lastCombo: null, refill: 0, blockedOnce: false,
    meterRows: [[], []],
  });

  T.setup = function (m) {
    const d = m.fighters[1];
    d.cpuDummy = true;
    d.ctrl.virtual = { dir: 5, held: 0 };
    m.fighters[0].cpuDummy = false;
  };

  T.reset = function (m, where) {
    const [a, b] = m.fighters;
    const x0 = where === 'left' ? -JJK.WALL + 60 : where === 'right' ? JJK.WALL - 160 : -100;
    a.resetRound(x0, 1);
    b.resetRound(x0 + 120, -1);
    for (const f of m.fighters) { f.meter = 300; f.dg = 100; f.st = 'idle'; f.setAnim('idle'); }
    m.projectiles.length = 0;
    m.domain = null; m.clash = null; m.cine = null;
    if (m.stage && m.stage.setMode) m.stage.setMode('normal', { frames: 1 });
    m.cam.reset();
    JJK.FX.clear();
  };

  function keyPressed(code) { return JJK.keyPressed && JJK.keyPressed(code); }

  T.tick = function (m) {
    const t = m.training;
    const [p, d] = m.fighters;
    // hotkeys
    if (keyPressed('Digit3')) T.reset(m, 'center');
    if (keyPressed('Digit4')) T.reset(m, p.x < 0 ? 'left' : 'right');
    if (keyPressed('Digit6')) t.hitboxes = !t.hitboxes;
    if (keyPressed('Digit7')) t.frameData = !t.frameData;
    if (keyPressed('Digit8')) { t.dummy = (t.dummy + 1) % T.DUMMY.length; T.applyDummy(m); }
    if (keyPressed('Digit9')) t.block = (t.block + 1) % T.BLOCK.length;
    if (keyPressed('Digit0')) t.infMeter = !t.infMeter;
    if (keyPressed('Digit1')) {
      if (!t.recording) { t.recording = true; t.rec = []; t.playing = false; m.popText(d, 'RECORDING', '#ff6060', true); }
      else { t.recording = false; m.popText(d, 'RECORDED ' + t.rec.length + 'F', '#ffffff'); }
    }
    if (keyPressed('Digit2')) { t.playing = !t.playing && t.rec.length > 0; t.playI = 0; t.recording = false; }
    const pad = JJK.padState && JJK.padState(JJK.settings.p1Pad);
    if (pad && pad.BACK && !t._padBack) T.reset(m, 'center');
    t._padBack = pad && pad.BACK;
    // infinite resources / refills
    for (const f of m.fighters) {
      if (t.infMeter) { f.meter = 300; f.dg = 100; }
      if (f.def.id === 'gojo' && t.infMeter && !f.cs.infOn) f.cs.inf = Math.max(f.cs.inf, 100);
    }
    if (t.infHp) {
      for (const f of m.fighters) {
        if (f.hp < f.maxHp && !f.isStunned() && f.combo.hits === 0) {
          t.refill = (t.refill || 0) + 1;
          if (t.refill > 50) { f.hp = f.maxHp; f.red = 0; }
        }
        f.hp = Math.max(1, f.hp);
      }
      if (m.fighters.every((f) => f.hp >= f.maxHp)) t.refill = 0;
    }
    // dummy control
    T.dummyInput(m, t, p, d);
    // frame meter
    if (t.frameMeter) {
      for (let i = 0; i < 2; i++) {
        const f = m.fighters[i];
        const row = t.meterRows[i];
        row.push(T.frameCode(f));
        if (row.length > 90) row.shift();
      }
    }
  };

  T.applyDummy = function (m) {
    const t = m.training;
    const d = m.fighters[1];
    if (T.DUMMY[t.dummy] === 'CPU') d.cpu = new JJK.AI(d, t.cpuLevel);
    else d.cpu = null;
    d.ctrl.virtual = { dir: 5, held: 0 };
  };

  T.dummyInput = function (m, t, p, d) {
    const mode = T.DUMMY[t.dummy];
    if (mode === 'CPU') return; // AI drives it
    const v = { dir: 5, held: 0 };
    if (t.recording) {
      // P1's controller drives the dummy; P1 stands still
      const c = p.ctrl;
      v.dir = c.dir; v.held = c.held;
      t.rec.push({ d: d.facing > 0 ? c.dir : JJK.mirrorDir(c.dir), h: c.held });
      p.ctrl.dir = 5; p.ctrl.held = 0; p.ctrl.pressed = 0;
      if (t.rec.length > 600) t.recording = false;
    } else if (t.playing && t.rec.length) {
      const s = t.rec[t.playI % t.rec.length];
      t.playI++;
      v.dir = d.facing > 0 ? s.d : JJK.mirrorDir(s.d);
      v.held = s.h;
    } else {
      const toward = d.facing > 0 ? 6 : 4, away = d.facing > 0 ? 4 : 6;
      if (mode === 'CROUCH') v.dir = 2;
      else if (mode === 'JUMP') v.dir = 8;
      // blocking
      const bm = T.BLOCK[t.block];
      let block = bm === 'ALL' || (bm === 'AFTER FIRST HIT' && d.combo.hits > 0) || (bm === 'RANDOM' && (m.frame >> 3) % 2 === 0) || d.st === 'block';
      if (bm === 'AFTER FIRST HIT' && d.combo.hits === 0 && d.st !== 'block') block = false;
      if (block && (m.threatened(d) || d.st === 'block' || d.st === 'ablock')) {
        let low = false;
        if (p.st === 'move' && p.move && p.move.hits) low = p.move.hits.some((h) => h.guard === 'low');
        const relDir = low || mode === 'CROUCH' ? 1 : 4;
        v.dir = d.facing > 0 ? relDir : JJK.mirrorDir(relDir);
      }
      void toward; void away;
    }
    // apply into the dummy controller; poll() will compute pressed edges
    d.ctrl.virtual = v;
  };

  // frame meter codes: 0 idle, 1 startup, 2 active, 3 recovery, 4 stun, 5 invuln
  T.frameCode = function (f) {
    if (f.hitstop > 0) return 6;
    if (f.isStunned() || f.st === 'block' || f.st === 'ablock') return 4;
    if (f.st === 'move') {
      if (f.invulnTo('strike')) return 5;
      const ph = f.phase;
      return ph === 'startup' ? 1 : ph === 'active' ? 2 : 3;
    }
    if (f.st === 'land' || f.st === 'prejump' || f.st === 'down' || f.st === 'wakeup' || f.st === 'techroll') return 3;
    return 0;
  };

  T.onMoveStart = function (m, f, mv) {
    if (f.side !== 0) return;
    m.training.last = { id: mv.id, name: mv.name, s: mv.s, a: mv.a, r: mv.r, total: mv.total, adv: null, dmg: null };
  };
  T.onHit = function (m, att, def, h, info) {
    const t = m.training;
    if (att.side === 0 && t.last && att.move) {
      t.last.dmg = info.dmg;
      const remaining = att.move.total - att.mf;
      t.last.adv = def.stun - remaining;
      t.last.ctx = info.ch ? 'COUNTER' : 'HIT';
    }
  };
  T.onComboEnd = function (m, f, combo) {
    if (f.side === 1) m.training.lastCombo = { hits: combo.hits, dmg: combo.dmg };
  };

  T.draw = function (ctx, m) {
    const t = m.training;
    const [p, d] = m.fighters;
    // block frame advantage when P1's move is blocked
    if (t.last && p.st === 'move' && p.contact === 'block' && t.last.adv == null) {
      const remaining = p.move.total - p.mf;
      t.last.adv = d.stun - remaining;
      t.last.ctx = 'BLOCK';
    }
    if (t.hitboxes) T.drawBoxes(ctx, m);
    // info panel
    if (t.frameData) {
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(6, 52, 168, 74);
      const L = t.last;
      let y = 56;
      const line = (s, c) => { Font.draw(ctx, s, 10, y, { color: c || '#ffffff' }); y += 9; };
      if (L) {
        line((L.name || L.id).toUpperCase().slice(0, 26), '#ffd23a');
        line('STARTUP ' + L.s + '  ACTIVE ' + L.a + '  REC ' + Math.max(0, L.total - L.s - L.a + 1));
        line('TOTAL ' + L.total + 'F');
        if (L.adv != null) line((L.ctx || '') + ' ADV ' + (L.adv >= 0 ? '+' : '') + L.adv, L.adv >= 0 ? '#80ff80' : '#ff8080');
        if (L.dmg != null) line('DAMAGE ' + L.dmg);
      } else line('PERFORM A MOVE', '#aaaaaa');
      if (t.lastCombo) line('LAST COMBO ' + t.lastCombo.hits + ' HITS / ' + t.lastCombo.dmg + ' DMG', '#ffb0a0');
      line('DUMMY ' + T.DUMMY[t.dummy] + ' / BLOCK ' + T.BLOCK[t.block], '#a0d0ff');
    }
    if (t.frameMeter) T.drawFrameMeter(ctx, m);
    // hints
    const hint = '1 REC  2 PLAY  3 RESET  4 CORNER  6 BOXES  7 DATA  8 DUMMY  9 BLOCK  0 METER';
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 351, JJK.W, 9);
    Font.draw(ctx, hint, JJK.W / 2, 352, { color: '#c0c0d0', align: 'center' });
    if (t.recording) Font.draw(ctx, '● REC ' + (t.rec.length / 60).toFixed(1) + 'S', JJK.W - 10, 56, { color: '#ff4040', align: 'right', outline: '#000' });
    if (t.playing) Font.draw(ctx, '▶ PLAYBACK', JJK.W - 10, 56, { color: '#80ff80', align: 'right', outline: '#000' });
  };

  T.drawFrameMeter = function (ctx, m) {
    const t = m.training;
    const cols = ['#3a3a44', '#2fd06a', '#ff3a3a', '#3a7aff', '#e0c020', '#ffffff', '#606070'];
    const x0 = 140, y0 = 326;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(x0 - 2, y0 - 2, 364, 22);
    for (let i = 0; i < 2; i++) {
      const row = t.meterRows[i];
      for (let k = 0; k < row.length; k++) {
        ctx.fillStyle = cols[row[k]];
        ctx.fillRect(x0 + k * 4, y0 + i * 10, 3, 8);
      }
    }
  };

  T.drawBoxes = function (ctx, m) {
    const cam = m.cam;
    const rect = (b, col, fill) => {
      const x0 = cam.sx(b[0]), x1 = cam.sx(b[2]), y0 = cam.sy(b[3]), y1 = cam.sy(b[1]);
      ctx.strokeStyle = col;
      ctx.lineWidth = 1;
      ctx.strokeRect(Math.round(x0) + 0.5, Math.round(y0) + 0.5, Math.round(x1 - x0), Math.round(y1 - y0));
      if (fill) { ctx.fillStyle = fill; ctx.fillRect(x0, y0, x1 - x0, y1 - y0); }
    };
    for (const f of m.fighters) {
      for (const h of f.hurt) rect(h, 'rgba(60,255,120,0.9)', f.invulnTo('strike') ? 'rgba(255,255,255,0.15)' : 'rgba(60,255,120,0.12)');
      // pushbox
      rect([f.x - JJK.PUSH_W, f.y, f.x + JJK.PUSH_W, f.y + 8], 'rgba(255,255,0,0.8)');
      if (f.st === 'move' && f.move && f.move.hits) {
        f.move.hits.forEach((h) => {
          if (f.mf >= h.f[0] && f.mf <= h.f[1]) rect(JJK.Combat.hitbox(f, h), h.throw ? 'rgba(80,160,255,1)' : 'rgba(255,40,40,1)', h.throw ? 'rgba(80,160,255,0.25)' : 'rgba(255,40,40,0.3)');
        });
      }
    }
    for (const p of m.projectiles) if (p.hit && !p.noCollide) rect(p.box, 'rgba(255,120,40,1)', 'rgba(255,120,40,0.2)');
  };
})();

</script>
<script>/* src/game/stage.js */
// Stage / arena renderer: a ruined temple courtyard at dusk plus the two
// domain worlds (Unlimited Void, Malevolent Shrine), with destruction,
// stage-owned particles and domain expand / shatter / clash transitions.
//
// Depth model: every background plane has a depth scale s (fighter plane
// s = 1, balustrade and floor back edge s = 0.8, sky s -> 0) and is authored
// in default-camera screen pixels. Camera zoom acts as a dolly, so a plane at
// depth s maps world units to k(s) = 1 / (1/s - 1 + 1/ez) pixels and is drawn
// at 1 / (1 - s + s/ez) times its art size: near planes zoom with the
// fighters, far ones barely move. The horizon (vanishing line) is fixed at
// screen y 142. The floor is drawn per scanline from a pre-warped texture
// whose rows are floor strips at increasing depth, pre-scaled so that rows
// blit 1:1 at the default camera.
//
// All art is generated procedurally into 32-bit pixel buffers at load
// (no anti-aliasing, ramp shading, ordered dithering) and blitted with
// nearest-neighbour sampling. Without a DOM (headless sim) every method stays
// cheap and only plain data (prop HP, modes, timers) is updated.
//
// API (world coords, y up, ground y = 0):
//   new JJK.Stage(), reset(), update(cam), drawBack(ctx, cam), drawFront(ctx, cam),
//   getAmbient() -> { mul, rim, rimK }, impact(x, y, power, kind), blast(x, y, r, power),
//   pull(x, y, r, strength, frames), erase(x0, x1, y, r), worldCut(x0, y0, x1, y1),
//   slashMark(x0, y0, x1, y1), burn(x, r, frames), crater(x, r),
//   setMode('normal' | 'void' | 'shrine' | 'clash', opts), setSplit(0..1),
//   shakeProps(amount), .darken (0..1), .mode, .tr (current transition or null).
//   JJK.Stage.preload() builds the shared art up front (~1 s, cached).
(function () {
  'use strict';
  const JJK = (typeof window !== 'undefined' ? window : globalThis).JJK;
  const U = JJK.U;
  const W = JJK.W, H = JJK.H;
  const DOM = typeof document !== 'undefined';

  const HY = 142; // horizon screen y
  const OFF = H / 2 - HY; // principal point offset above screen center (38)
  const EYE = (JJK.CAM_BASE_Y || 142) + OFF; // camera height at default (180)
  const ZF = 900; // fighter plane distance (= focal length in px)
  const SB = 0.8; // floor back edge / balustrade depth scale
  const ROW0 = HY + EYE * SB; // 286: floor back edge screen row
  const PER = 1600; // floor + balustrade lateral period (world units)
  const ZB = ZF / SB; // floor back edge distance
  const GRAV = 0.3;
  const SUN = { x: 404, y: 106, r: 46 }; // screen position of the setting sun

  // ---------------------------------------------------------------- colors
  const hx = (h, a = 255) => {
    const c = U.hex(h);
    return U.pack(c[0], c[1], c[2], a);
  };
  const ramp = (a) => a.map((h) => hx(h));
  const cr = (c) => c & 255, cg = (c) => (c >>> 8) & 255, cb = (c) => (c >>> 16) & 255, ca = (c) => c >>> 24;
  function mixp(a, b, t) {
    if (t <= 0) return a;
    if (t >= 1) return b;
    return U.pack(cr(a) + (cr(b) - cr(a)) * t, cg(a) + (cg(b) - cg(a)) * t, cb(a) + (cb(b) - cb(a)) * t,
      (ca(a) + (ca(b) - ca(a)) * t) | 0);
  }
  const mulp = (c, k) => U.pack(cr(c) * k, cg(c) * k, cb(c) * k, ca(c));
  const css = (c, a = 1) => U.css([cr(c), cg(c), cb(c)], a);
  const hyp = (a, b) => Math.sqrt(a * a + b * b);
  const num = (v, d = 0) => { v = +v; return v === v && Math.abs(v) < 1e7 ? v : d; }; // finite or default

  // ordered dithering: rmp(ramp, v) picks ramp[floor(v)] / ramp[floor(v)+1]
  const BAY = new Float32Array([0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16));
  const bay = (x, y) => BAY[((y & 3) << 2) | (x & 3)];
  const rmp = (R, v, x, y) => {
    const i = Math.floor(v + bay(x, y));
    return R[i < 0 ? 0 : i >= R.length ? R.length - 1 : i];
  };

  // ----------------------------------------------------------------- noise
  function hash(x, y, z) {
    let h = Math.imul((x | 0) ^ 0x5bd1e995, 0x27d4eb2d) ^ Math.imul((y | 0) + 0x1234567, 0x165667b1) ^
      Math.imul((z | 0) + 0x7f4a7c15, 0x9e3779b1);
    h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
    h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }
  // value noise on a 256x256 lattice table; px = lattice period along x
  // (0 = none) for tileable layers
  const NT = new Float32Array(65536);
  for (let i = 0; i < 65536; i++) NT[i] = hash(i & 255, i >> 8, 99);
  function vn(x, y, sd, px) {
    const ix = Math.floor(x), iy = Math.floor(y);
    const fx = x - ix, fy = y - iy;
    const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
    let x0 = ix, x1 = ix + 1;
    if (px) { x0 = ((x0 % px) + px) % px; x1 = ((x1 % px) + px) % px; }
    const ox = sd * 57, oy = sd * 131;
    const r0 = ((iy + oy) & 255) << 8, r1 = ((iy + 1 + oy) & 255) << 8;
    const c0 = (x0 + ox) & 255, c1 = (x1 + ox) & 255;
    const a = NT[r0 | c0], b = NT[r0 | c1], c = NT[r1 | c0], d = NT[r1 | c1];
    return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
  }
  function fbm(x, y, sd, oct, px) {
    let s = 0, a = 0.5, n = 0;
    for (let i = 0; i < oct; i++) {
      s += a * vn(x, y, sd + i * 31, px);
      n += a; x *= 2; y *= 2; if (px) px *= 2; a *= 0.5;
    }
    return s / n;
  }

  // ---------------------------------------------------------- pixel buffer
  // f = packed color or (x, y, old) => packed color (0 leaves the pixel).
  class Pix {
    constructor(w, h, wrap) {
      this.w = w; this.h = h; this.wrap = !!wrap;
      this.d = new Uint32Array(w * h);
    }
    get(x, y) {
      if (this.wrap) x = ((x % this.w) + this.w) % this.w;
      return x >= 0 && y >= 0 && x < this.w && y < this.h ? this.d[y * this.w + x] : 0;
    }
    a(x, y) { return this.get(x, y) >>> 24; }
    put(x, y, f) {
      const xi = this.wrap ? ((x % this.w) + this.w) % this.w : x;
      if (xi < 0 || y < 0 || xi >= this.w || y >= this.h) return;
      const k = y * this.w + xi;
      if (typeof f === 'number') this.d[k] = f;
      else {
        const c = f(x, y, this.d[k]);
        if (c) this.d[k] = c;
      }
    }
    rect(x, y, w, h, f) {
      const x0 = Math.round(x), y0 = Math.max(0, Math.round(y));
      const x1 = Math.round(x + w), y1 = Math.min(this.h, Math.round(y + h));
      for (let j = y0; j < y1; j++) for (let i = x0; i < x1; i++) this.put(i, j, f);
    }
    span(y, xa, xb, f) {
      if (y < 0 || y >= this.h) return;
      const a = Math.ceil(xa - 0.5), b = Math.floor(xb - 0.5);
      for (let x = a; x <= b; x++) this.put(x, y, f);
    }
    poly(p, f) {
      let y0 = Infinity, y1 = -Infinity;
      for (let i = 1; i < p.length; i += 2) { if (p[i] < y0) y0 = p[i]; if (p[i] > y1) y1 = p[i]; }
      const n = p.length >> 1, xs = [];
      for (let y = Math.max(0, Math.floor(y0)); y <= Math.min(this.h - 1, Math.ceil(y1)); y++) {
        const yc = y + 0.5;
        xs.length = 0;
        for (let i = 0, j = n - 1; i < n; j = i++) {
          const yi = p[2 * i + 1], yj = p[2 * j + 1];
          if ((yi > yc) !== (yj > yc)) xs.push(p[2 * i] + ((yc - yi) / (yj - yi)) * (p[2 * j] - p[2 * i]));
        }
        xs.sort((a, b) => a - b);
        for (let k = 0; k + 1 < xs.length; k += 2) this.span(y, xs[k], xs[k + 1], f);
      }
    }
    ellipse(cx, cy, rx, ry, f) {
      for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) {
        const dy = (y + 0.5 - cy) / ry;
        if (dy <= -1 || dy >= 1) continue;
        const hw = rx * Math.sqrt(1 - dy * dy);
        this.span(y, cx - hw, cx + hw, f);
      }
    }
    line(x0, y0, x1, y1, f) {
      x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
      const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
      let e = dx + dy;
      for (;;) {
        this.put(x0, y0, f);
        if (x0 === x1 && y0 === y1) break;
        const e2 = 2 * e;
        if (e2 >= dy) { e += dy; x0 += sx; }
        if (e2 <= dx) { e += dx; y0 += sy; }
      }
    }
    // thick polyline through points [x,y,...] with width w (round joins)
    stroke(p, w, f) {
      for (let i = 0; i + 3 < p.length; i += 2) {
        const ax = p[i], ay = p[i + 1], bx = p[i + 2], by = p[i + 3];
        const n = Math.max(1, Math.ceil(hyp(bx - ax, by - ay) * 2));
        for (let j = 0; j <= n; j++) {
          const t = j / n;
          if (w <= 1.2) this.put(Math.round(ax + (bx - ax) * t - 0.5), Math.round(ay + (by - ay) * t - 0.5), f);
          else this.ellipse(ax + (bx - ax) * t, ay + (by - ay) * t, w / 2, w / 2, f);
        }
      }
    }
    clone() {
      const p = new Pix(this.w, this.h, this.wrap);
      p.d.set(this.d);
      return p;
    }
  }

  function mkCanvas(w, h) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    return c;
  }
  function toCanvas(p) {
    const c = mkCanvas(p.w, p.h);
    c.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(p.d.buffer.slice(0)), p.w, p.h), 0, 0);
    return c;
  }

  // Light the silhouette edges that face the sky (top) and the sun (side).
  function rimPass(P, o) {
    const w = P.w, h = P.h, d = P.d, src = d.slice();
    const al = (x, y) => {
      if (y < 0 || y >= h) return 0;
      if (x < 0 || x >= w) { if (!P.wrap) return 255; x = ((x % w) + w) % w; }
      return src[y * w + x] >>> 24;
    };
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const k = y * w + x, c = src[k];
      if ((c >>> 24) < 200) continue;
      const sd = x - (o.sunX || 0) < 0 ? 1 : -1;
      const fall = o.fall ? Math.exp(-Math.abs(x - o.sunX) / o.fall) * 0.6 + 0.4 : 1;
      if (al(x, y - 1) < 128) d[k] = mixp(c, o.top, o.kTop * fall);
      else if (al(x + sd, y) < 128 || al(x + sd, y - 1) < 128) d[k] = mixp(c, o.side, o.kSide * fall);
      else if (o.inner && al(x, y - 2) < 128) d[k] = mixp(c, o.top, o.kTop * o.inner * fall);
    }
  }
  // Banded atmospheric fog toward the bottom of a layer (dithered steps).
  function fogPass(P, y0, y1, fog, kMax, pw, steps = 5, patch = 0) {
    for (let y = Math.max(0, y0); y < Math.min(P.h, y1); y++) {
      const t0 = Math.pow((y - y0) / (y1 - y0), pw) * kMax;
      for (let x = 0; x < P.w; x++) {
        const k = y * P.w + x, c = P.d[k];
        if ((c >>> 24) < 200) continue;
        const t = patch ? t0 * (1 - patch + patch * 2 * fbm((x / P.w) * 12, y * 0.05, 77, 2, 12)) : t0;
        const lv = Math.floor(t * steps + bay(x, y)) / steps;
        if (lv > 0) P.d[k] = mixp(c, fog, Math.min(1, lv));
      }
    }
  }
  // Dark 1px outline around opaque pixels (selective: only into empty space).
  function outlinePass(P, col) {
    const w = P.w, h = P.h, src = P.d.slice();
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (src[y * w + x] >>> 24) continue;
      const n = (x > 0 && src[y * w + x - 1] >>> 24) || (x < w - 1 && src[y * w + x + 1] >>> 24) ||
        (y > 0 && src[(y - 1) * w + x] >>> 24) || (y < h - 1 && src[(y + 1) * w + x] >>> 24);
      if (n) P.d[y * w + x] = col;
    }
  }

  // --------------------------------------------------------------- palettes
  const SKY = ramp(['#0a0307', '#120409', '#1c060c', '#2a0910', '#3b0c12', '#4f1114', '#661815', '#7e2016',
    '#982b18', '#b23a1b', '#ca4d20', '#df6626', '#ef852f', '#f9a53d', '#fec65a', '#ffe08c', '#fff3c8']);
  const CLOUD = ramp(['#0c0307', '#140509', '#1d070c', '#290a10', '#371013', '#481616', '#5e1f18', '#782b1b',
    '#94391e', '#b44c24', '#d4632c', '#ee8437', '#fcaa4c']);
  const STONE = ramp(['#0b0509', '#12080d', '#1a0d13', '#221219', '#2b171e', '#351c24', '#40222a', '#4d2a30',
    '#5b3236', '#6b3b3c', '#7e4744', '#94554c']);
  const RIM = { lo: hx('#8a3c2a'), mid: hx('#c4602f'), hi: hx('#ee9442'), hot: hx('#ffc874') };
  const FLOOR = ramp(['#0f080c', '#170c11', '#1f1116', '#28161b', '#311b20', '#3b2125', '#46272a', '#522e2f',
    '#5f3634', '#6e3f39', '#80493f', '#955547', '#ad6450']);
  const BLOOD = ramp(['#160406', '#220608', '#30090c', '#3f0c10', '#501114', '#641618']);
  const VERM = ramp(['#1c0608', '#2a0a0b', '#3c0f0e', '#521512', '#6a1c15', '#842518', '#a0321c']);

  // ---------------------------------------------------------------- sky art
  function buildSky() {
    const w = 720, h = 420, ox = 40, oy = 30; // canvas -> screen: (x - ox, y - oy)
    const P = new Pix(w, h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const sx = x - ox, sy = y - oy;
      const tv = U.clamp((sy + 30) / (HY + 46), 0, 1.25);
      let v = 0.7 + Math.pow(tv, 1.7) * 10.4;
      const dx = sx - SUN.x, dy = (sy - SUN.y) * 1.25;
      const d = Math.sqrt(dx * dx + dy * dy);
      v += 3.0 * Math.exp(-d / 58) + 1.9 * Math.exp(-d / 175) * (0.4 + tv * 0.6);
      v += (fbm(sx * 0.011, sy * 0.034, 3, 3) - 0.5) * 1.5;
      if (sy > HY + 14) v -= (sy - HY - 14) * 0.09; // hidden below the horizon: fade to dusk
      if (d < SUN.r) {
        v = 13.4 + Math.pow(1 - d / SUN.r, 0.55) * 3;
        // faint horizontal heat bands across the disc
        if (sy > SUN.y + 6 && ((sy - SUN.y) % 9 < 1 + (sy - SUN.y) / 18)) v -= 1.6;
      } else if (d < SUN.r + 1.6) v = Math.max(v, 13);
      P.d[y * w + x] = rmp(SKY, v, x, y);
    }
    return { pix: P, ox, oy };
  }

  // Tileable drifting cloud strips (alpha keyed).
  function buildClouds(kind) {
    const w = 1024;
    const hi = kind === 'hi';
    const h = hi ? 128 : 84, sy0 = hi ? -34 : 64; // screen y of row 0
    const P = new Pix(w, h, true);
    const px = hi ? 6 : 12;
    const dens = new Float32Array(w * (h + 4));
    for (let y = 0; y < h + 4; y++) for (let x = 0; x < w; x++) {
      const yy = y / h;
      let n;
      if (hi) n = fbm((x / w) * px, y * 0.036, 41, 5, px) + (1 - yy) * 0.2 - yy * yy * 0.15;
      else n = fbm((x / w) * px, y * 0.16, 77, 4, px) * (0.55 + 0.6 * Math.sin(Math.PI * U.clamp(yy, 0, 1)));
      dens[y * w + x] = n;
    }
    const thr = hi ? 0.56 : 0.5;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const n = dens[y * w + x];
      if (n < thr - 0.03) continue;
      if (n < thr && bay(x, y) < 0.55) continue;
      const below = dens[(y + 3) * w + x], below1 = dens[(y + 1) * w + x];
      const sy = sy0 + y;
      const lift = U.clamp((sy + 20) / 160, 0, 1); // lower clouds catch more fire light
      let v;
      if (hi) {
        v = 1.4 + (n - thr) * 3 + lift * 2.6;
        if (below1 < thr) v += 3.2 + lift * 2.2;
        else if (below < thr) v += 1.6 + lift;
        if (dens[(y - 1 < 0 ? 0 : y - 1) * w + x] < thr) v -= 0.6;
      } else {
        v = 4.2 + lift * 2.6 - (n - thr) * 2;
        if (below1 < thr) v += 2.6;
        else if (below < thr) v += 1.1;
      }
      P.d[y * w + x] = rmp(CLOUD, v, x, y);
    }
    return { pix: P, sy0 };
  }

  // ---------------------------------------------------------- far city art
  function buildCity(o) {
    const w = o.w, h = o.h, base = Math.round(o.base - o.y0); // canvas rows
    const P = new Pix(w, h, true);
    const rng = U.makeRng(o.seed);
    const R = o.ramp;
    const fires = [];
    let x = 0;
    while (x < w) {
      const bw = Math.floor(o.minW + rng() * (o.maxW - o.minW));
      let bh = o.minH + Math.pow(rng(), 1.5) * (o.maxH - o.minH);
      if (rng() < 0.1) bh *= 1.45;
      const top = base - bh;
      const broken = rng() < o.broken;
      const lean = broken && rng() < 0.3 ? (rng() - 0.5) * 0.5 : 0;
      const tone = 0.6 + rng() * 1.2;
      const setback = rng() < 0.4 ? Math.max(2, Math.floor(bw * 0.2)) : 0;
      const jagA = rng() * 10;
      const kind = rng();
      const sd = x + bw / 2 < o.sunX ? 1 : -1;
      const litFloor = Math.floor(rng() * 6), winW = rng() < 0.5 ? 3 : 4;
      const hole = broken && rng() < 0.6 ? [Math.floor(bw * (0.15 + rng() * 0.4)), Math.floor(bw * (0.3 + rng() * 0.3)), Math.floor(rng() * bh * 0.4) + 6, Math.floor(4 + rng() * 10)] : null;
      for (let i = 0; i < bw; i++) {
        let t = top + (i < setback || i >= bw - setback ? bh * 0.12 : 0);
        if (broken) t += Math.abs(Math.sin(i * 0.9 + jagA)) * 6 + (i / bw) * bh * 0.25 * (jagA > 5 ? 1 : -0.4) + 4;
        if (kind > 0.86 && !broken) t += Math.abs(i - bw / 2) * 0.9; // pointed top
        t = Math.round(t + lean * (base - t));
        const fromSun = sd > 0 ? bw - 1 - i : i;
        for (let y = Math.max(0, t); y < base; y++) {
          const ly = y - t;
          if (hole && i >= hole[0] && i < hole[0] + hole[1] && ly >= hole[2] && ly < hole[2] + hole[3] + Math.round(Math.sin(i * 1.3) * 2)) continue;
          let v = tone + (ly / (base - t + 1)) * 0.5;
          if (fromSun === 0) v += 1.1; else if (fromSun === 1) v += 0.4; else if (fromSun >= bw - 2) v -= 0.4;
          if (ly % 12 === 0 && ly > 0) v += 0.35;
          if (o.win && (i % winW) === 1 && ly % 4 === 2 && ly > 2 && fromSun > 0 && fromSun < bw - 1) {
            const hh = hash(x + i, y, o.seed);
            if (hh < o.lit || (Math.floor(ly / 4) % 7 === litFloor && hh < o.lit * 6)) { P.put(x + i, y, hh < o.lit * 0.3 ? o.winHot : o.winCol); continue; }
            v -= 0.65;
          }
          P.put(x + i, y, rmp(R, v, x + i, y));
        }
        // exposed frame beams on broken tops
        if (broken && i % 4 === 1 && hash(x + i, 7, o.seed) < 0.3) for (let j = 1; j < 2 + hash(x + i, 8, o.seed) * 7; j++) P.put(x + i, t - j, R[0]);
      }
      if (!broken && rng() < 0.35) {
        const ax = x + Math.floor(bw / 2), ah = 4 + rng() * 12;
        for (let j = 0; j < ah; j++) P.put(ax, Math.round(top - j), R[0]);
        if (rng() < 0.5) P.put(ax, Math.round(top - ah), o.winHot);
      } else if (!broken && rng() < 0.4) P.rect(x + 2, top - 3, Math.max(3, bw * 0.3), 3, R[0]);
      if (rng() < o.fire) fires.push([x + Math.floor(rng() * bw), Math.round(top + (broken ? 8 : rng() * bh * 0.6)), 2 + rng() * 3]);
      x += bw + Math.floor(rng() * o.gap);
    }
    // cranes / skeletal frames
    for (let c = 0; c < (o.cranes || 0); c++) {
      const cx = Math.floor(rng() * w), ch = o.maxH * (0.8 + rng() * 0.5);
      for (let j = 0; j < ch; j++) { P.put(cx, base - j, R[0]); if (j % 4 === 0) P.put(cx + 1, base - j, R[0]); if (j % 8 === 0) P.put(cx - 1, base - j, R[0]); }
      const arm = 14 + rng() * 22, dir = rng() < 0.5 ? -1 : 1;
      for (let i = -6; i < arm; i++) { P.put(cx + i * dir, Math.round(base - ch), R[0]); if (i % 3 === 0) P.put(cx + i * dir, Math.round(base - ch) + 1, R[0]); }
      for (let j = 0; j < 9; j++) P.put(Math.round(cx + arm * 0.8 * dir), Math.round(base - ch + j), R[0]);
    }
    rimPass(P, { sunX: o.sunX, top: o.rim, side: o.rim, kTop: o.rimK, kSide: o.rimK * 0.7, fall: 260 });
    for (const f of fires) {
      const [fx, fy, fr] = f;
      for (let j = -fr * 2; j <= fr; j++) for (let i = -fr * 1.5; i <= fr * 1.5; i++) {
        const d = hyp(i / 1.5, j > 0 ? j : j * 0.6) / fr;
        if (d > 1) continue;
        const X = Math.round(fx + i), Y = Math.round(fy + j);
        if (P.a(X, Y) < 200) { if (d < 0.6 && bay(X, Y) < 0.4) P.put(X, Y, o.fireCol[0]); continue; }
        P.put(X, Y, o.fireCol[Math.min(3, Math.floor((1 - d) * 4 + bay(X, Y) * 0.8))]);
      }
    }
    fogPass(P, Math.round(base - o.maxH * 0.6), base, o.haze, o.hazeK, 1.7, 6);
    for (let y = base; y < h; y++) for (let x2 = 0; x2 < w; x2++) P.put(x2, y, mixp(o.haze, R[0], ((y - base) / (h - base)) * 0.35 * bay(x2, y)));
    return { pix: P, ox: (w - W) / 2, oy: -o.y0, s: o.s, tile: true, fires };
  }

  // Temple town: rows of tiled roofs between the far temples and the courtyard.
  function buildTown() {
    const w = 1280, y0 = 64, h = 238, base = Math.round(HY + EYE * 0.3 - y0), cx0 = w / 2;
    const P = new Pix(w, h, true);
    const R = ramp(['#12050a', '#18070e', '#200a12', '#280e17', '#31121c', '#3b1721', '#461c26']);
    const rng = U.makeRng(651);
    const fires = [];
    // ground
    for (let x = 0; x < w; x++) for (let y = base - 26 + Math.round(fbm((x / w) * 6, 0.2, 652, 3, 6) * 8); y < h; y++) P.put(x, y, rmp(R, 0.8, x, y));
    const house = (x, yb, bw, bh, two) => {
      const roofH = Math.max(4, Math.round(bw * 0.28)), lift = Math.max(1, bw * 0.06);
      drawBody(P, Math.round(x - bw * 0.42), Math.round(yb - bh), Math.round(x + bw * 0.42), yb, R, { pil: Math.max(3, Math.round(bw / 6)), base: 1.3, win: true, lit: 0.04, litCol: rng() < 0.5 ? hx('#d86a26') : hx('#f0a040') });
      drawRoof(P, x, Math.round(yb - bh + roofH * 0.35), bw / 2, roofH, lift, R, { ridge: rng() < 0.5 ? 0.25 : 0.55, base: 1.6, rows: 2, orn: bw > 26 });
      if (two) {
        const y2 = Math.round(yb - bh - roofH * 0.6);
        drawBody(P, Math.round(x - bw * 0.26), y2 - Math.round(bh * 0.6), Math.round(x + bw * 0.26), y2, R, { pil: 4, base: 1.2, lit: 0.05, litCol: hx('#e08030') });
        drawRoof(P, x, Math.round(y2 - bh * 0.6 + roofH * 0.3), bw * 0.34, roofH * 0.8, lift, R, { ridge: 0.3, base: 1.7, rows: 2 });
      }
    };
    for (const [off, sc, n] of [[-24, 0.6, 52], [-13, 0.8, 40], [-3, 1, 30]]) {
      for (let i = 0; i < n; i++) {
        const x = (i / n) * w + (rng() - 0.5) * (w / n) * 0.8;
        const bw = (18 + rng() * 22) * sc, bh = (6 + rng() * 5) * sc;
        house(x, base + off + Math.round((rng() - 0.5) * 3), bw, bh, rng() < 0.18);
        if (rng() < 0.3) pine(P, x + bw * 0.6, base + off, (12 + rng() * 14) * sc, R, 660 + i);
      }
    }
    pagoda(P, cx0 + 420, base - 6, 3, 18, 15, R, { lit: 0.02, litCol: hx('#e07028') });
    pagoda(P, cx0 - 520, base - 10, 3, 16, 14, R, {});
    rimPass(P, { sunX: cx0 + SUN.x - W / 2, top: hx('#e27a36'), side: hx('#c05a2a'), kTop: 0.55, kSide: 0.35, inner: 0.3, fall: 420 });
    for (const [fx, fy, fr] of fires) {
      for (let j = -fr * 2; j <= fr; j++) for (let i = -fr; i <= fr; i++) {
        const d = hyp(i, j > 0 ? j : j * 0.5) / fr;
        if (d > 1) continue;
        const X = Math.round(fx + i), Y = Math.round(fy + j);
        P.put(X, Y, [hx('#a8301a'), hx('#e8602a'), hx('#ffa040'), hx('#ffe090')][Math.min(3, Math.floor((1 - d) * 4 + bay(X, Y) * 0.8))]);
      }
    }
    fogPass(P, base - 40, base + 2, hx('#5e1c16'), 0.7, 1.5, 6);
    for (let y = base + 2; y < h; y++) for (let x = 0; x < w; x++) P.d[y * w + x] = mixp(hx('#5e1c16'), R[0], ((y - base) / (h - base)) * 0.5 * bay(x, y));
    return { pix: P, ox: (w - W) / 2, oy: -y0, s: 0.3, tile: true, fires };
  }

  // ------------------------------------------------- Japanese architecture
  // Roof outline with sagging slopes and upturned eave tips.
  function roofPts(cx, yb, hw, h, lift, ridge = 0.2, thick = 2.5) {
    const pts = [], N = 12, rw = hw * ridge, yr = yb - h, yt = yb - lift - thick;
    pts.push(cx - hw - lift * 0.35, yt - lift * 0.35);
    for (let i = 1; i <= N; i++) {
      const t = i / N;
      pts.push(cx - hw + (hw - rw) * t, yt - (yt - yr) * t * t);
    }
    for (let i = N; i >= 1; i--) {
      const t = i / N;
