    for (const t of threats) if (!t.down && t.ad < 95 && Math.abs(t.dy) < 50) close = true;
    this.threatClose = close;
    if (this.noticed.size > 400) this.noticed.clear();
  }

  // ---------------------------------------------------------------- defence
  defend() {
    const f = this.f;
    const sim = this.sim;
    const rng = sim.rng;
    const it = f.intent;
    let first = null;
    let nFront = 0;
    let nBack = 0;
    for (const t of this.threats) {
      if (!t.attacking || !t.perceived || t.rec.handled || t.tth > 0.42) continue;
      if (t.behind) nBack++;
      else nFront++;
      if (!first || t.tth < first.tth) first = t;
    }
    if (!first) return false;
    if (!f.canAct()) {
      // an elite fighter can abort his own wind-up when he sees it coming,
      // or snap back from a strike's follow-through instead of riding it out
      const m0 = f.state === 'move' ? f.move : null;
      const strike = m0 && (m0.type === 'strike' || m0.type === 'grab');
      let lastHit = 0;
      if (strike) for (const hh of m0.hits) lastHit = Math.max(lastHit, hh.t1);
      const feint = strike && f.mt < m0.windup * 0.75;
      const recover = strike && m0.type === 'strike' && f.mt > lastHit + 0.03;
      const ok = (feint || recover) && f.grounded && !m0.air && this.sim.rng.chance(f.skill * (feint ? 0.8 : 0.9) - f.fatigue * 0.35);
      if (!ok) return false;
      f.move = null;
      f.setState('ground');
      f.replantFeet();
    }
    const sandwiched = nFront > 0 && nBack > 0;
    const m = first.move;
    const h0 = m.hits.length ? m.hits[0] : null;
    const high = h0 && h0.height === 'high';
    const low = h0 && (h0.height === 'low' || h0.height === 'ground');
    const grab = !!m.grab;
    const tackle = m.id === 'tackle';
    const opts = [];
    const rate = f.computeMoveRate(MOVES.jab);
    const st = f.stamina;
    const startOf = (id) => MOVES[id].hits[0].t0 / rate;
    if (!first.behind) {
      if (first.ad > 16 && first.ad < 60 && startOf('jab') < first.tth - 0.012 && st > 6) opts.push(['jab', 2.0 + f.skill]);
      if (first.ad > 24 && first.ad < 64 && startOf('teep') < first.tth - 0.01 && st > 10) opts.push(['teep', 1.9 + this.envOpportunity(first.e).push]);
      if (!low && !tackle && first.tth < 0.17 / rate && first.tth > 0.015) opts.push(['parry', 2.5 * f.skill]);
      if (grab) opts.push(['backstep', 2.2]);
    } else {
      if (first.ad > 18 && first.ad < 66 && startOf('backkick') < first.tth - 0.01 && st > 10) opts.push(['backkick', 2.4]);
      if (first.ad < 34 && startOf('backelbow') < first.tth - 0.01) opts.push(['backelbow', 2.0]);
    }
    if (high && !grab) opts.push(['duck', sandwiched ? 2.8 : 1.5]);
    if (low) opts.push(['jumpUp', 2.2]);
    if (tackle && !first.behind) {
      // stop the charge: knee to the lowered head, or a push kick at range
      if (Math.abs(startOf('knee') - first.tth) < 0.06) opts.push(['knee', 3.0]);
      if (first.ad < 90 && startOf('teep') < first.tth) opts.push(['teep', 2.6]);
      opts.push(['jumpUp', 1.3]);
    }
    const behindSpace = this.spaceToward(-first.side);
    if (!sandwiched && behindSpace > 90) opts.push(['backstep', 1.4]);
    if ((sandwiched || this.engaged >= 4) && st > 12 && this.safeLanding(this.lessCrowdedSide(), 160)) opts.push(['roll', 1.7 + (sandwiched ? 1 : 0)]);
    if (sandwiched && st > 16 && first.ad < 150 && first.ad > 40 && this.safeLanding(first.side, 220)) opts.push(['vault', 1.9]);
    if (!low && !grab && !tackle) opts.push(['block', 1.7 + (st > 30 ? 0.5 : -1.0) + (nFront > 1 ? 0.4 : 0)]);
    // decision noise: sometimes a worse choice, sometimes frozen
    const eps = this.epsilon();
    if (rng.chance(eps * 0.5)) {
      first.rec.handled = true;
      return false;
    }
    let best = null;
    let bw = -1;
    for (const [id, w] of opts) {
      const ww = w + rng.range(0, eps * 3);
      if (ww > bw) {
        bw = ww;
        best = id;
      }
    }
    if (!best) return false;
    first.rec.handled = true;
    this.lastDefense = sim.time;
    switch (best) {
      case 'block':
        it.face = first.side;
        it.block = true;
        this.blockUntil = sim.time + first.tth + 0.22;
        this.say('Blocking', 0.4);
        break;
      case 'jumpUp':
        it.mx = 0;
        it.jump = true;
        it.jumpVy = f.jumpSpeed * 0.9;
        f.stats.dodges++;
        this.say('Evading', 0.5);
        break;
      case 'roll': {
        const dir = this.lessCrowdedSide();
        it.face = dir;
        it.action = 'roll';
        f.stats.dodges++;
        this.say('Rolling out', 0.6);
        break;
      }
      case 'vault':
        it.face = first.side;
        it.action = 'vault';
        f.stats.dodges++;
        this.say('Vaulting the crowd', 0.7);
        break;
      case 'backkick':
      case 'backelbow':
        it.action = best;
        it.target = first.e;
        this.say('Countering behind', 0.6);
        break;
      default:
        it.face = first.side;
        it.action = best;
        it.target = first.e;
        if (best === 'duck' || best === 'backstep') f.stats.dodges++;
        if (best === 'duck' && sandwiched) this.say('Slipping between them', 0.8);
        else if (best === 'parry') this.say('Parrying', 0.5);
        else if (best === 'jab' || best === 'teep') this.say('Beating him to it', 0.5);
        else this.say('Evading', 0.5);
    }
    return true;
  }

  spaceToward(dir) {
    const f = this.f;
    let space = 300;
    for (const t of this.threats) {
      if (t.down || Math.abs(t.dy) > 40) continue;
      if (Math.sign(t.dx) === dir) space = Math.min(space, t.ad);
    }
    const L = this.sim.level;
    for (let d = 30; d <= 150; d += 30) {
      const x = f.x + dir * d;
      if (L.isSolidAt(x, f.y - 40)) return Math.min(space, d - 20);
      if (!L.groundUnder(x - 3, x + 3, f.y - 4, 40, true, true)) return Math.min(space, d - 25);
    }
    return space;
  }

  // No deadly drop along a leap's path (a gap between roofs, a shaft).
  safeLanding(dir, dist) {
    const f = this.f;
    const L = this.sim.level;
    for (let d = 40; d <= dist; d += 40) {
      const x = f.x + dir * d;
      if (!L.groundUnder(x - 4, x + 4, f.y - 40, 520, true, false)) return false;
    }
    return true;
  }

  lessCrowdedSide() {
    let l = 0;
    let r = 0;
    for (const t of this.threats) {
      if (t.down || t.ad > 260) continue;
      const w = 1 / (40 + t.ad);
      if (t.dx < 0) l += w;
      else r += w;
    }
    const L = this.sim.level;
    const f = this.f;
    if (L.isSolidAt(f.x - 60, f.y - 40)) l += 1;
    if (L.isSolidAt(f.x + 60, f.y - 40)) r += 1;
    return l < r ? -1 : 1;
  }

  // ------------------------------------------------------------ opportunity
  // What lies beyond a target in the direction we would knock it?
  envOpportunity(e, dirOverride) {
    const f = this.f;
    const sim = this.sim;
    const L = sim.level;
    const d = dirOverride || Math.sign(e.x - f.x) || f.facing;
    let push = 0;
    let label = null;
    let best = 0;
    const note = (v, l) => {
      push += v;
      if (v > best) {
        best = v;
        label = l;
      }
    };
    for (const hz of sim.hazards.list) {
      if (hz.type !== 'electric' || Math.abs(hz.y - e.y) > 24) continue;
      const dist = (hz.x - e.x) * d;
      if (dist > 0 && dist < 240) note(1.4 * (1 - dist / 280), 'electric');
    }
    for (const lg of L.ledges) {
      if (Math.abs(lg.y - e.y) > 10) continue;
      const edge = d > 0 ? lg.x0 : lg.x1;
      const dist = (edge - e.x) * d;
      if (dist > -10 && dist < 190) note(1.2 * (1 - dist / 230) * (lg.edge ? 1.4 : 1), 'ledge');
    }
    for (const w of L.windows) {
      if (w.broken || w.kind !== 'glass') continue;
      if (e.y < w.y || e.y > w.y + w.h + 6) continue;
      const dist = (w.x - e.x) * d;
      if (dist > 0 && dist < 220) note(1.15 * (1 - dist / 260), 'window');
    }
    for (const b of sim.props.boxes) {
      if (!b.k.explosive) continue;
      const [cx, cy] = b.center();
      if (Math.abs(cy - (e.y - 22)) > 40) continue;
      const dist = (cx - e.x) * d;
      if (dist > 10 && dist < 200) note(0.8, 'canister');
    }
    let crowd = 0;
    for (const t of this.threats) {
      if (t.e === e || t.down || Math.abs(t.e.y - e.y) > 30) continue;
      const dist = (t.e.x - e.x) * d;
      if (dist > 15 && dist < 230) crowd++;
    }
    if (crowd) note(Math.min(1.1, crowd * 0.32), 'crowd');
    const st = e.groundSolid && e.groundSolid.step ? sim.nav.surfaces[e.groundSolid.surface] : null;
    if (st && st.dir === -d) note(0.6, 'stairs');
    return { push, label, crowd };
  }

  // Value of throwing something behind us (shoulder toss).
  behindValue() {
    const f = this.f;
    const fake = { x: f.x - f.facing * 10, y: f.y };
    return this.envOpportunity(fake, -f.facing).push;
  }

  // ---------------------------------------------------------------- offence
  offend() {
    const f = this.f;
    const sim = this.sim;
    const rng = sim.rng;
    const it = f.intent;
    if (!f.canAct()) return f.state === 'move';
    // counter after a parry
    if (this.counter && sim.time - this.counter.t < 0.6) {
      const c = this.counter.target;
      this.counter = null;
      if (!c.dead && !c.ragdolled) {
        const ad = Math.abs(c.x - f.x);
        it.face = Math.sign(c.x - f.x) || f.facing;
        it.target = c;
        if (ad < 46 && f.stamina > 10) {
          this.chooseThrow(c);
          it.action = 'grab';
          this.say('Turning his attack against him', 1);
        } else {
          it.action = ad < 40 ? 'uppercut' : 'cross';
          this.say('Counter', 0.6);
        }
        return true;
      }
    }
    let cands = this.threats.filter((t) => !t.down && t.ad < 400 && Math.abs(t.dy) < 60 && t.e.state !== 'spawn');
    const roaming = this.tactic === 'roam' && this.roam;
    if (roaming) {
      // on the move: only the ones in his way, on top of him, or swinging
      const dir = Math.sign(this.roam.x - f.x) || f.facing;
      cands = cands.filter((t) => t.ad < 90 || t.attacking || (Math.sign(t.dx) === dir && t.ad < 200));
    }
    if (!cands.length) {
      this.target = null;
      return false;
    }
    // restraint: with a noticed attack on the way, only a strike that lands first is worth it
    let danger = 9;
    for (const t of this.threats) {
      if (t.attacking && t.perceived && t.tth < danger) danger = t.tth;
      else if (t.imminent && !t.behind) danger = Math.min(danger, 0.3);
    }
    this.danger = danger;
    // target selection
    let best = null;
    let bs = -1e9;
    for (const t of cands) {
      const e = t.e;
      let s = 2.4 - t.ad / 140;
      if (t.attacking) s += 1.2;
      if (e.state === 'hitstun' || e.staggered) s += 1.1;
      if (e.weapon) s += 0.7;
      if (e.personality === 'grappler') s += 0.4;
      if (e.state === 'holding') s += 2;
      if (t.behind) s -= 0.35;
      if (e.hp < e.maxHp * 0.35) s += 0.4;
      if (this.target === e) s += 0.5;
      const env = this.envOpportunity(e);
      s += env.push * 1.1;
      t.env = env;
      s += rng.range(0, this.epsilon() * 2);
      if (s > bs) {
        bs = s;
        best = t;
      }
    }
    this.target = best.e;
    const opts = this.moveOptions(best, cands);
    if (!opts.length) {
      if (roaming) return false; // keep moving; position() carries him on
      // close the distance (but do not charge blindly into a crowd)
      const e = best.e;
      const want = f.weapon ? 60 : 44;
      steerTo(f, sim, e.x - best.side * want, surfaceOfFighter(e), { run: best.ad > 150, arrive: 6, careful: true });
      it.face = best.side;
      if (this.mindT <= 0) this.mind = this.engaged > 2 ? 'Picking his target' : 'Closing in';
      return true;
    }
    let pick = null;
    let pw = -1;
    for (const [id, w] of opts) {
      const ww = w * rng.range(0.75, 1.25);
      if (ww > pw) {
        pw = ww;
        pick = id;
      }
    }
    const m = MOVES[pick];
    if (!m.back) it.face = best.side;
    it.target = best.e;
    it.mx = 0;
    if (pick === 'grab') this.chooseThrow(best.e);
    if (pick === 'flyingkick') this.lastFlying = this.sim.time;
    if (pick === 'dropkick') this.lastDropkick = this.sim.time;
    if (pick === 'superman') this.lastSuperman = this.sim.time;
    it.action = pick;
    if (best.env && best.env.push > 0.6 && (m.crowd || pick === 'grab' || pick === 'teep' || pick === 'shove')) {
      this.say(best.env.label === 'crowd' ? 'Sending him into the crowd' : `Using ${HAZARD_NAMES[best.env.label] || 'the terrain'}`, 1);
    } else if (this.mindT <= 0) {
      this.mind = this.engaged >= 4 ? 'Fighting the crowd' : this.engaged >= 2 ? 'Managing the fight' : 'Pressing the attack';
    }
    return true;
  }

  moveOptions(T, cands) {
    const f = this.f;
    const e = T.e;
    const st = f.stamina;
    const ad = T.ad;
    const env = T.env || { push: 0, crowd: 0 };
    const opts = [];
    const stag = e.state === 'hitstun' || e.staggered;
    const blocking = e.state === 'block';
    let frontCluster = 0;
    for (const t of cands) if (!t.behind && t.ad < 95) frontCluster++;
    // someone close behind him: long, committed moves leave his back open
    const exposed = this.exposedBehind(150, e);
    // leaving the ground in a crowd gets you swatted out of the air
    const airSafe = this.exposedBehind(240, e) === 0 && this.engaged <= 2;
    let isolated = true;
    for (const t of cands) if (t.e !== e && Math.abs(t.e.x - e.x) < 160) isolated = false;
    const list = f.weapon ? ARMED_MOVES : HERO_MOVES;
    for (const id of list) {
      const m = MOVES[id];
      if (m.weapon && !f.weapon) continue;
      const r = m.range;
      if (m.back) {
        if (!T.behind || ad < -r[1] || ad > -r[0]) continue;
      } else if (ad < r[0] || ad > r[1]) continue;
      if (st < m.stamina * 0.9 && id !== 'jab') continue;
      // too slow to start with an attack incoming
      const rate = f.computeMoveRate(m);
      if (this.danger < 0.5 && m.windup / rate > this.danger - 0.03) continue;
      let w = 1;
      switch (id) {
        case 'jab': w = 1.25; break;
        case 'cross': w = 1.15 + (stag ? 0.5 : 0); break;
        case 'hook': w = 0.85 + (stag ? 0.3 : 0); break;
        case 'uppercut': w = 0.7 + (stag ? 1.0 : 0); break;
        case 'elbow': w = 0.9; break;
        case 'knee': w = 0.9 + (stag ? 0.4 : 0); break;
        case 'teep': w = 0.75 + env.push * 2.6 + (frontCluster >= 2 ? 0.6 : 0); break;
        case 'roundhouse': w = 0.85 + (stag ? 0.7 : 0); break;
        case 'spinkick': w = 0.35 + env.push * 2.2 + (stag ? 0.9 : 0) + (st > 45 ? 0.2 : -0.4); break;
        case 'sweep': w = 0.35 + (frontCluster >= 2 ? 1.1 : 0) + (blocking ? 1.6 : 0); break;
        case 'flyingkick': w = isolated && st > 50 && this.sim.time - this.lastFlying > 6 && this.safeLanding(T.side, 340) ? 0.55 : 0; break;
        case 'shove': w = 0.25 + env.push * 2.2; break;
        case 'grab': w = 0.6 + env.push * 1.8 + (blocking ? 1.8 : 0) + this.behindValue() * 1.2; break;
        case 'backkick': w = 1.8 + env.push * 0.5; break;
        case 'backelbow': w = 1.5; break;
        case 'wswing': w = 1.6 + frontCluster * 0.5; break;
        case 'woverhead': w = 0.9 + (stag ? 0.8 : 0); break;
        case 'wthrust': w = 1.0; break;
        case 'wthrow': w = f.weapon && f.weapon.durability <= 2 && isolated ? 2 : 0.05; break;
        case 'superman': w = ad > 85 && airSafe && this.sim.time - (this.lastSuperman || -9) > 3 && this.safeLanding(T.side, 220) ? 0.3 + (stag ? 0.4 : 0) : 0; break;
        case 'backfist': w = 0.7 + (frontCluster >= 2 ? 0.2 : 0) + (stag ? 0.3 : 0); break;
        case 'axekick': w = 0.45 + (blocking ? 1.5 : 0) + (stag ? 0.5 : 0); break;
        case 'jumpknee': w = airSafe && this.safeLanding(T.side, 220) ? 0.3 + (stag ? 0.8 : 0) : 0; break;
        case 'dropkick': w = airSafe && st > 40 && this.sim.time - this.lastDropkick > 5 && this.safeLanding(T.side, 330) ? 0.15 + env.push * 1.8 + (env.crowd >= 2 ? 0.5 : 0) : 0; break;
        case 'headbutt': w = 0.55 + (e.state === 'holding' ? 1 : 0) + (stag ? 0.3 : 0); break;
      }
      if (T.behind && !m.back && this.engagedFront > 0) w *= 0.4; // turning away from others is risky
      if (exposed > 0 && !m.back && m.dur / rate > 0.42) w *= 0.3;
      // in a crowd, quick strikes keep him safe; big moves need an opening
      if (this.engaged >= 3) {
        const slow = m.windup / f.computeMoveRate(m);
        if (slow > 0.12 && !stag && env.push < 0.6) w *= 0.45;
        if (id === 'jab' || id === 'teep' || id === 'backkick' || id === 'backelbow' || id === 'elbow') w *= 1.3;
      }
      if (w > 0.05) opts.push([id, w]);
    }
    return opts;
  }

  // Somewhere else to fight: a brawl across the map, or a far point of the
  // level he can reach.
  pickRoamGoal(cur) {
    const f = this.f;
    const sim = this.sim;
    const nav = sim.nav;
    const rng = sim.rng;
    if (cur < 0) return null;
    const reach = (s) => s === cur || nav.dist[cur][s] < Infinity;
    if (rng.chance(0.55)) {
      let best = null;
      let bd = 1e9;
      for (const e of sim.enemies) {
        if (e.dead || !e.brain || !e.brain.foe || e.ragdolled) continue;
        const d = Math.abs(e.x - f.x) + Math.abs(e.y - f.y) * 1.5;
        const s = surfaceOfFighter(e);
        if (d < 450 || s < 0 || !reach(s) || d > bd) continue;
        bd = d;
        best = { x: e.x, surf: s };
      }
      if (best) return { ...best, until: sim.time + clamp(bd / 230 + 5, 8, 22), label: 'Crashing their brawl' };
    }
    const items = [];
    for (const S of nav.surfaces) {
      if (S.isolated || S.type === 'stairs' || !reach(S.id) || S.x1 - S.x0 < 120) continue;
      for (let k = 0; k < 3; k++) {
        const x = rng.range(S.x0 + 50, S.x1 - 50);
        const d = Math.abs(x - f.x) + Math.abs(S.y - f.y) * 1.5;
        if (d < 450) continue;
        let w = d < 1700 ? 1.4 : 0.7;
        if (S.id !== cur) w *= 1.4;
        for (const lg of sim.level.ledges) if (Math.abs(lg.y - S.y) < 8 && x > lg.x0 - 90 && x < lg.x1 + 90) w *= 0.1;
        items.push([{ x, surf: S.id, d }, w]);
      }
    }
    if (!items.length) return null;
    const g = rng.weighted(items);
    const S = nav.surfaces[g.surf];
    const label = S.y < f.y - 60 ? 'Taking the fight upstairs' : S.y > f.y + 60 ? 'Taking it downstairs' : 'Moving the fight';
    return { x: g.x, surf: g.surf, until: sim.time + clamp(g.d / 230 + 5, 8, 22), label };
  }

  // Enemies on their feet close behind him (other than `skip`).
  exposedBehind(radius, skip = null) {
    let n = 0;
    for (const t of this.threats) if (t.behind && !t.down && t.ad < radius && Math.abs(t.dy) < 50 && t.e !== skip) n++;
    return n;
  }

  chooseThrow(victim) {
    const f = this.f;
    const fwd = this.envOpportunity(victim);
    const back = this.behindValue();
    const exposed = this.exposedBehind(170, victim);
    const fresh = f.stamina > 30;
    const opts = [['hipthrow', 1], ['shouldertoss', 0.6 + (back > fwd.push ? 1.5 : 0)]];
    if (fwd.crowd >= 2 && fresh && !exposed) opts.push(['spinthrow', 1.6]);
    if (fresh) opts.push(['suplex', 0.8 + back * 1.2]);
    if (fresh && !exposed) opts.push(['powerbomb', 0.7 + (fwd.push < 0.3 ? 0.4 : 0)]);
    if (!exposed && this.engaged <= 5) opts.push(['clinch', 1.2]);
    this.throwPlan = this.sim.rng.weighted(opts);
  }

  // Someone down within reach and nothing coming: stamp on him, or punt the
  // body into his friends.
  finisher() {
    const f = this.f;
    const sim = this.sim;
    if (!f.canAct() || f.weapon || f.stamina < 12 || this.danger < 0.5 || this.exposedBehind(130) > 0) return false;
    if (sim.time < (this.nextFinisher || 0)) return false;
    let best = null;
    for (const t of this.threats) {
      const e = t.e;
      if (!t.down || e.dead || !(e.state === 'down' || e.state === 'ragdoll') || Math.abs(t.dy) > 40) continue;
      if (e.rag.coreSpeed(sim.h) > 160) continue;
      const px = e.rag.p[2].x;
      const ad = Math.abs(px - f.x);
      if (ad > 70) continue;
      if (!best || ad < best.ad) best = { e, ad, side: Math.sign(px - f.x) || f.facing, px };
    }
    if (!best) return false;
    this.nextFinisher = sim.time + sim.rng.range(0.4, 1.4);
    const it = f.intent;
    const env = this.envOpportunity(best.e, best.side);

  drawCraneSilhouettes(ctx, cam, view) {
    ctx.strokeStyle = 'rgba(120,140,160,0.35)';
    ctx.lineWidth = 4;
    for (const cx0 of [-900, this.L.width * 0.6, this.L.width + 1400]) {
      const cx = cx0 + (cam.x - cx0) * 0.55;
      if (cx < view.x0 - 900 || cx > view.x1 + 900) continue;
      ctx.beginPath();
      ctx.moveTo(cx, 200);
      ctx.lineTo(cx, -1100);
      ctx.lineTo(cx + 700, -1100);
      ctx.moveTo(cx - 200, -1100);
      ctx.lineTo(cx, -1100);
      ctx.moveTo(cx, -1180);
      ctx.lineTo(cx + 500, -1100);
      ctx.moveTo(cx, -1180);
      ctx.lineTo(cx - 200, -1100);
      ctx.stroke();
    }
  }

  // Interior walls (indoor themes): the building box behind everything.
  drawInterior(ctx, view) {
    const L = this.L;
    const P = this.P;
    if (L.outdoor) return;
    const roof = L.bounds.top + 30;
    ctx.fillStyle = P.interior;
    ctx.fillRect(-2, roof, L.width + 4, -roof);
    // panel seams
    ctx.strokeStyle = P.seam;
    ctx.lineWidth = 2;
    const step = L.theme === 'warehouse' ? 22 : 190;
    ctx.beginPath();
    for (let x = Math.max(0, Math.floor(view.x0 / step) * step); x < Math.min(L.width, view.x1); x += step) {
      ctx.moveTo(x, roof);
      ctx.lineTo(x, 0);
    }
    ctx.stroke();
    if (L.theme === 'warehouse') {
      // clerestory windows high on the back wall
      const y = roof + 60;
      for (let x = 160; x < L.width - 200; x += 420) {
        if (x + 220 < view.x0 || x > view.x1) continue;
        rect(ctx, x, y, 220, 70, 'rgba(255,236,200,0.65)', P.metalDark, 3);
        for (let k = 1; k < 4; k++) line(ctx, x + k * 55, y, x + k * 55, y + 70, P.metalDark, 2);
        // light shafts
        const g = ctx.createLinearGradient(0, y, 0, 0);
        g.addColorStop(0, 'rgba(255,230,180,0.18)');
        g.addColorStop(1, 'rgba(255,230,180,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(x, y + 70);
        ctx.lineTo(x + 220, y + 70);
        ctx.lineTo(x + 420, 0);
        ctx.lineTo(x + 140, 0);
        ctx.closePath();
        ctx.fill();
      }
    }
    // baseboards per floor
    for (const f of L.floors) {
      if (f.partial) continue;
      ctx.fillStyle = shade(P.interior, -0.06);
      ctx.fillRect(Math.max(0, f.x0), f.y - 8, Math.min(L.width, f.x1) - Math.max(0, f.x0), 8);
    }
  }

  // ------------------------------------------------------------- decor
  drawDecor(ctx, sim, view, t, layer) {
    const L = this.L;
    for (const d of L.decor) {
      const fn = DECOR[d.type];
      if (!fn) continue;
      const lay = DECOR_LAYER[d.type] || 'back';
      if (lay !== layer) continue;
      if (!this.decorVisible(d, view)) continue;
      fn(ctx, d, this.P, t, sim, this);
    }
  }

  decorVisible(d, v) {
    if (d.x0 !== undefined) return visible(v, d.x0, d.x1, (d.y || 0) - 600, (d.y || 0) + 3200);
    if (d.pts) return true;
    const x = d.x;
    return visible(v, x - 900, x + 900, (d.y || 0) - 1200, (d.y || 0) + 3200);
  }

  // -------------------------------------------------------------- stairs
  drawStairs(ctx, view) {
    const P = this.P;
    for (const st of this.L.stairs) {
      if (!visible(view, st.x0, st.x1, st.yTop, st.yBottom)) continue;
      const style = st.style;
      const n = st.n;
      ctx.beginPath();
      ctx.moveTo(st.xBottom, st.yBottom);
      for (let i = 1; i <= n; i++) {
        const xa = st.xBottom + st.dir * (i - 1) * st.stepW;
        const xb = st.xBottom + st.dir * i * st.stepW;
        const y = st.yBottom - i * st.stepH;
        ctx.lineTo(xa, y);
        ctx.lineTo(xb, y);
      }
      // underside (stringer)
      const thick = style === 'concrete' ? 26 : 12;
      ctx.lineTo(st.xTop, st.yTop + thick);
      ctx.lineTo(st.xBottom + st.dir * thick * 0.6, st.yBottom);
      ctx.closePath();
      if (style === 'concrete') {
        ctx.fillStyle = P.stairs;
        ctx.fill();
        ctx.strokeStyle = P.outline;
        ctx.lineWidth = 2.5;
        ctx.stroke();
      } else {
        ctx.fillStyle = style === 'wood' ? 'rgba(170,125,70,0.85)' : 'rgba(110,116,124,0.55)';
        ctx.fill();
        ctx.strokeStyle = style === 'wood' ? '#5a3c1c' : P.metalDark;
        ctx.lineWidth = 2;
        ctx.stroke();
        // treads
        ctx.strokeStyle = style === 'wood' ? '#c69a5d' : P.metalLight;
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        for (let i = 1; i <= n; i++) {
          const xa = st.xBottom + st.dir * (i - 1) * st.stepW;
          const xb = st.xBottom + st.dir * i * st.stepW;
          const y = st.yBottom - i * st.stepH + 1.5;
          ctx.moveTo(xa, y);
          ctx.lineTo(xb, y);
        }
        ctx.stroke();
        // handrail
        ctx.strokeStyle = style === 'wood' ? '#7a5428' : P.metalDark;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(st.xBottom, st.yBottom - 44);
        ctx.lineTo(st.xTop, st.yTop - 44);
        ctx.stroke();
        for (let i = 0; i <= n; i += 4) {
          const x = st.xBottom + st.dir * i * st.stepW;
          const y = st.yBottom - i * st.stepH;
          line(ctx, x, y, x, y - 44, style === 'wood' ? '#7a5428' : P.metalDark, 2);
        }
      }
    }
  }

  // ------------------------------------------------------------ hazards
  drawHazards(ctx, sim, view, t) {
    const P = this.P;
    for (const hz of sim.hazards.list) {
      if (!visible(view, hz.x - 120, hz.x + 120, hz.y - 300, hz.y + 10)) continue;
      if (hz.type === 'electric') drawElectric(ctx, hz, P, t);
      else if (hz.type === 'steam') drawSteamPipe(ctx, hz, P, t);
    }
  }

  // ----------------------------------------------------------- structure
  drawStructure(ctx, view) {
    const L = this.L;
    const P = this.P;
    for (const s of L.solids) {
      if (s.broken || s.step || s.kind === 'bounds') continue;
      if (!visible(view, s.x, s.x + s.w, s.y, s.y + Math.min(s.h, 900))) continue;
      switch (s.kind) {
        case 'ground':
          this.drawGround(ctx, s, view);
          break;
        case 'floor':
        case 'ceiling':
          this.drawSlab(ctx, s);
          break;
        case 'wall':
          rect(ctx, s.x, s.y, s.w, s.h, P.wall, null);
          ctx.fillStyle = P.wallDark;
          ctx.fillRect(s.x + s.w * 0.75, s.y, s.w * 0.25, s.h);
          ctx.strokeStyle = P.outline;
          ctx.lineWidth = 2.5;
          ctx.strokeRect(s.x, s.y, s.w, s.h);
          break;
        case 'lintel':
          rect(ctx, s.x, s.y, s.w, s.h, P.wall, P.outline, 2.5);
          break;
        case 'roof':
          this.drawRoofTop(ctx, s);
          break;
        default:
          break;
      }
    }
  }

  drawGround(ctx, s, view) {
    const L = this.L;
    const P = this.P;
    const x0 = Math.max(s.x, view.x0 - 50);
    const x1 = Math.min(s.x + s.w, view.x1 + 50);
    if (L.theme === 'construction') {
      ctx.fillStyle = '#b9ad94';
      ctx.fillRect(x0, s.y, x1 - x0, 24);
      ctx.fillStyle = '#9d907a';
      ctx.fillRect(x0, s.y + 24, x1 - x0, 400);
      line(ctx, x0, s.y, x1, s.y, P.outline, 2.5);
      // concrete pad under the building
      rect(ctx, -20, s.y, L.width + 40, 26, P.slabTop, P.outline, 2.5);
      return;
    }
    ctx.fillStyle = P.slabTop;
    ctx.fillRect(x0, s.y, x1 - x0, 28);
    ctx.fillStyle = P.ground;
    ctx.fillRect(x0, s.y + 28, x1 - x0, 500);
    line(ctx, x0, s.y, x1, s.y, P.outline, 3);
    line(ctx, x0, s.y + 28, x1, s.y + 28, P.outline, 2.5);
  }

  drawSlab(ctx, s) {
    const L = this.L;
    const P = this.P;
    if (L.theme === 'construction') {
      rect(ctx, s.x, s.y, s.w, s.h, P.slabTop, P.outline, 2.5);
      ctx.strokeStyle = shade(P.slabTop, -0.15);
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let x = s.x + 60; x < s.x + s.w; x += 120) {
        ctx.moveTo(x, s.y + 6);
        ctx.lineTo(x, s.y + s.h - 6);
      }
      ctx.stroke();
      // rebar stubs at the free ends
      ctx.strokeStyle = '#7a4a2a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (const ex of [s.x, s.x + s.w]) {
        const dir = ex === s.x ? -1 : 1;
        for (let k = 0; k < 3; k++) {
          ctx.moveTo(ex, s.y + 8 + k * 9);
          ctx.lineTo(ex + dir * 14, s.y + 6 + k * 9);
        }
      }
      ctx.stroke();
      return;
    }
    const plate = Math.min(18, s.h);
    rect(ctx, s.x, s.y, s.w, plate, P.slabTop, null);
    if (s.h > plate) {
      // ceiling void: big duct band
      const dy = s.y + plate;
      const dh = s.h - plate;
      rect(ctx, s.x, dy, s.w, dh, P.duct, null);
      ctx.fillStyle = P.ductLight;
      ctx.fillRect(s.x, dy + 4, s.w, 4);
      ctx.fillStyle = P.ductShade;
      ctx.fillRect(s.x, dy + dh - 8, s.w, 8);
      ctx.fillStyle = P.ductJoint;
      const start = Math.ceil(s.x / 205) * 205;
      for (let x = start; x < s.x + s.w - 6; x += 205) ctx.fillRect(x, dy, 7, dh);
      ctx.strokeStyle = P.outline;
      ctx.lineWidth = 2.5;
      ctx.strokeRect(s.x, dy, s.w, dh);
    }
    ctx.strokeStyle = P.outline;
    ctx.lineWidth = 2.5;
    ctx.strokeRect(s.x, s.y, s.w, plate);
  }

  drawRoofTop(ctx, s) {
    const P = this.P;
    rect(ctx, s.x, s.y, s.w, 14, P.slabTop, null);
    ctx.fillStyle = P.slabFace;
    ctx.fillRect(s.x, s.y + 14, s.w, 10);
    line(ctx, s.x, s.y, s.x + s.w, s.y, P.outline, 2.5);
    line(ctx, s.x, s.y, s.x, s.y + 600, P.outline, 2.5);
    line(ctx, s.x + s.w, s.y, s.x + s.w, s.y + 600, P.outline, 2.5);
  }

  // ------------------------------------------------- foreground (front)
  drawFront(ctx, sim, view, t) {
    this.drawDecor(ctx, sim, view, t, 'front');
    const P = this.P;
    // windows and skylights (glass) in front of the action
    for (const s of this.L.windows) {
      if (!visible(view, s.x, s.x + s.w, s.y, s.y + s.h)) continue;
      if (s.kind === 'skylight') continue;
      if (s.broken) {
        // jagged remains in the frame
        ctx.fillStyle = P.glass;
        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(s.x + s.w, s.y);
        ctx.lineTo(s.x + s.w, s.y + 26);
        ctx.lineTo(s.x, s.y + 48);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(s.x, s.y + s.h);
        ctx.lineTo(s.x + s.w, s.y + s.h);
        ctx.lineTo(s.x + s.w, s.y + s.h - 34);
        ctx.lineTo(s.x, s.y + s.h - 14);
        ctx.closePath();
        ctx.fill();
        continue;
      }
      ctx.fillStyle = P.glass;
      ctx.fillRect(s.x, s.y, s.w, s.h);
      ctx.strokeStyle = 'rgba(255,255,255,0.65)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(s.x + 2, s.y + s.h * 0.2);
      ctx.lineTo(s.x + s.w - 2, s.y + s.h * 0.12);
      ctx.moveTo(s.x + 2, s.y + s.h * 0.32);
      ctx.lineTo(s.x + s.w - 2, s.y + s.h * 0.24);
      ctx.stroke();
    }
  }
}

// ======================================================================
// Decor drawers
// ======================================================================

const DECOR_LAYER = {
  railingPost: 'front',
  catwalk: 'mid',
  scaffold: 'mid',
  window: 'back',
  barrier: 'mid',
  ac: 'mid',
  skylight: 'mid',
  soffit: 'mid',
  holeEdge: 'mid',
  streetDoor: 'mid',
  doorway: 'mid',
  hoist: 'back',
  building: 'under',
  street: 'under',
  roofline: 'back',
};

function drawElectric(ctx, hz, P, t) {
  const x = hz.x - hz.w / 2;
  const w = hz.w;
  const bodyH = hz.h * 0.68;
  const y = hz.y - hz.h;
  const active = hz.arcT > 0;
  const flick = active && Math.sin(t * 60) > 0;
  if (hz.style === 'generator') {
    rect(ctx, x, hz.y - hz.h * 0.75, w, hz.h * 0.75, '#e0b32c', P.outline, 2.5);
    rect(ctx, x + 8, hz.y - hz.h * 0.62, w * 0.45, hz.h * 0.42, '#3a3a3a', P.outline, 2);
    for (let k = 0; k < 4; k++) line(ctx, x + 12, hz.y - hz.h * 0.56 + k * 10, x + w * 0.45, hz.y - hz.h * 0.56 + k * 10, '#666', 2);
    drawBolt(ctx, x + w * 0.75, hz.y - hz.h * 0.42, 16, flick ? '#fff6a0' : '#1d1d1d');
    rect(ctx, x + 6, hz.y - 10, 18, 10, '#333', null);
    rect(ctx, x + w - 24, hz.y - 10, 18, 10, '#333', null);
  } else if (hz.style === 'transformer') {
    rect(ctx, x + 6, y + 10, w - 12, hz.h - 10, P.metal, P.outline, 2.5);
    for (let k = 0; k < 5; k++) line(ctx, x + 14 + k * 15, y + 26, x + 14 + k * 15, hz.y - 12, P.metalDark, 3);
    rect(ctx, x + w * 0.3, y + 34, w * 0.4, 34, '#f3c623', P.outline, 2);
    drawBolt(ctx, x + w / 2, y + 51, 12, flick ? '#ffffff' : '#1d1d1d');
    line(ctx, x + 20, y + 10, x + 20, y - 30, P.metalDark, 3);
    line(ctx, x + w - 20, y + 10, x + w - 20, y - 30, P.metalDark, 3);
  } else {
    // skull box on legs, as seen in the classic facility shots
    const legH = hz.h - bodyH;
    rect(ctx, x + 6, hz.y - legH, 12, legH, P.metalDark, P.outline, 2);
    rect(ctx, x + w - 18, hz.y - legH, 12, legH, P.metalDark, P.outline, 2);
    rect(ctx, x, y, w, bodyH, P.metal, P.outline, 2.5);
    rect(ctx, x + 10, y + 10, w - 20, bodyH - 20, flick ? '#d8d8d8' : '#4e4e4e', P.outline, 2);
    for (const [cx, cy] of [[x + 15, y + 15], [x + w - 15, y + 15], [x + 15, y + bodyH - 15], [x + w - 15, y + bodyH - 15]]) {
      ctx.strokeStyle = P.outline;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(cx, cy, 2, 0, TAU);
      ctx.stroke();
    }
    drawSkull(ctx, x + w / 2, y + bodyH / 2, 13, flick ? '#2a2a2a' : '#f2f2f2');
    // conduit into the ceiling
    ctx.strokeStyle = P.pipe;
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(x - 4, y + 18);
    ctx.lineTo(x - 22, y + 18);
    ctx.lineTo(x - 22, y - 400);
    ctx.stroke();
    ctx.strokeStyle = P.outline;
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
  if (active) {
    const g = ctx.createRadialGradient(hz.x, y + bodyH / 2, 4, hz.x, y + bodyH / 2, 120);
    g.addColorStop(0, 'rgba(255,250,190,0.5)');
    g.addColorStop(1, 'rgba(255,250,190,0)');
    ctx.fillStyle = g;
    ctx.fillRect(hz.x - 120, y + bodyH / 2 - 120, 240, 240);
  }
}

function drawSkull(ctx, cx, cy, r, color) {
  ctx.fillStyle = color;
  ctx.strokeStyle = color;
  ctx.lineWidth = r * 0.28;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - r * 1.1, cy + r * 0.55);
  ctx.lineTo(cx + r * 1.1, cy + r * 1.4);
  ctx.moveTo(cx + r * 1.1, cy + r * 0.55);
  ctx.lineTo(cx - r * 1.1, cy + r * 1.4);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx, cy - r * 0.15, r * 0.72, 0, TAU);
  ctx.fill();
  ctx.fillRect(cx - r * 0.38, cy + r * 0.3, r * 0.76, r * 0.42);
  ctx.fillStyle = color === '#f2f2f2' ? '#4e4e4e' : '#d8d8d8';
  ctx.beginPath();
  ctx.arc(cx - r * 0.27, cy - r * 0.18, r * 0.17, 0, TAU);
  ctx.arc(cx + r * 0.27, cy - r * 0.18, r * 0.17, 0, TAU);
  ctx.fill();
}

function drawBolt(ctx, cx, cy, s, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(cx + s * 0.2, cy - s);
  ctx.lineTo(cx - s * 0.45, cy + s * 0.1);
  ctx.lineTo(cx - s * 0.02, cy + s * 0.1);
  ctx.lineTo(cx - s * 0.25, cy + s);
  ctx.lineTo(cx + s * 0.45, cy - s * 0.15);
  ctx.lineTo(cx + s * 0.02, cy - s * 0.15);
  ctx.closePath();
  ctx.fill();
}

function drawSteamPipe(ctx, hz, P, t) {
  const x = hz.x;
  const y = hz.y;
  ctx.strokeStyle = P.pipe;
  ctx.lineWidth = 12;
  ctx.beginPath();
  ctx.moveTo(x - hz.dir * 6, y - 240);
  ctx.lineTo(x - hz.dir * 6, y);
  ctx.lineTo(x + hz.dir * 14, y);
  ctx.stroke();
  ctx.strokeStyle = P.outline;
  ctx.lineWidth = 2;
  ctx.stroke();
  rect(ctx, x + hz.dir * 10 - 6, y - 10, 12, 20, P.metalDark, P.outline, 2);
  // valve wheel
  ctx.strokeStyle = '#c0392b';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(x - hz.dir * 6, y - 40, 9, 0, TAU);
  ctx.stroke();
  // warning label
  const warn = hz.burst > 0 || (hz.timer % hz.period) > hz.period - 0.8;
  ctx.fillStyle = warn && Math.sin(t * 20) > 0 ? '#ff5a3c' : '#f2c230';
  ctx.beginPath();
  ctx.moveTo(x - hz.dir * 6, y - 92);
  ctx.lineTo(x - hz.dir * 6 - 10, y - 74);
  ctx.lineTo(x - hz.dir * 6 + 10, y - 74);
  ctx.closePath();
  ctx.fill();
}

function stripeBand(ctx, x0, x1, y, h, a, b) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(x0, y, x1 - x0, h);
  ctx.clip();
  ctx.fillStyle = a;
  ctx.fillRect(x0, y, x1 - x0, h);
  ctx.fillStyle = b;
  for (let x = x0 - h; x < x1 + h; x += 16) {
    ctx.beginPath();
    ctx.moveTo(x, y + h);
    ctx.lineTo(x + 8, y + h);
    ctx.lineTo(x + 8 + h, y);
    ctx.lineTo(x + h, y);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function openness(d, sim, dt) {
  const target = sim.time < (d.openUntil || 0) ? 1 : 0;
  d._open = d._open === undefined ? target : d._open + (target - d._open) * Math.min(1, dt * 6);
  return d._open;
}

const DECOR = {
  roofline(ctx, d, P) {
    line(ctx, d.x0, d.y, d.x1, d.y, P.outline, 3);
  },
  street(ctx, d, P) {
    ctx.fillStyle = P.street;
    ctx.fillRect(d.x0, d.y, d.x1 - d.x0, 30);
    ctx.fillStyle = P.streetLine;
    ctx.fillRect(d.x0, d.y + 3, d.x1 - d.x0, 4);
  },
  holeEdge(ctx, d) {
    stripeBand(ctx, d.x0 - 26, d.x0, d.y + 1, 7, '#f2c230', '#222');
    stripeBand(ctx, d.x1, d.x1 + 26, d.y + 1, 7, '#f2c230', '#222');
  },
  streetDoor(ctx, d, P) {
    const x = d.x;
    rect(ctx, x - 3, d.y - d.h - 6, d.w + 6, 8, P.wallDark, P.outline, 2);
    // swung-open door leaf
    const fx = d.side < 0 ? x - 30 : x + d.w + 4;
    rect(ctx, fx, d.y - d.h, 26, d.h, P.door, P.outline, 2.5);
    ctx.fillStyle = P.metalDark;
    ctx.fillRect(fx + (d.side < 0 ? 4 : 18), d.y - d.h * 0.5, 4, 10);
  },
  window(ctx, d, P) {
    rect(ctx, d.x - 2, d.y - 8, d.w + 4, 8, P.wallDark, P.outline, 2);
  },
  doorway(ctx, d, P) {
    const x = d.x;
    line(ctx, x - 2, d.top, x - 2, d.y, P.outline, 2.5);
    line(ctx, x + d.w + 2, d.top, x + d.w + 2, d.y, P.outline, 2.5);
    ctx.fillStyle = 'rgba(0,0,0,0.05)';
    ctx.fillRect(x - 2, d.top, d.w + 4, d.y - d.top);
    // exit sign above
    rect(ctx, x - 18, d.top - 26, 62, 18, '#2e9e57', P.outline, 2);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('EXIT', x + 13, d.top - 13);
  },
  soffit(ctx, d, P) {
    rect(ctx, d.x0, d.y, d.x1 - d.x0, d.bottom - d.y, P.duct, P.outline, 2.5);
    ctx.fillStyle = P.ductShade;
    ctx.fillRect(d.x0, d.bottom - 10, d.x1 - d.x0, 10);
    ctx.fillStyle = P.ductJoint;
    for (let x = d.x0 + 60; x < d.x1 - 20; x += 110) ctx.fillRect(x, d.y, 6, d.bottom - d.y);
    // grille
    ctx.strokeStyle = P.ductJoint;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    const gx = (d.x0 + d.x1) / 2 - 30;
    for (let k = 0; k < 6; k++) {
      ctx.moveTo(gx + k * 10, d.bottom - 24);
      ctx.lineTo(gx + k * 10, d.bottom - 12);
    }
    ctx.stroke();
  },
  elevator(ctx, d, P, t, sim, env) {
    const o = openness(d, sim, 1 / 60);
    const x = d.x - d.w / 2;
    const y = d.y - d.h;
    rect(ctx, x - 6, y - 6, d.w + 12, d.h + 6, P.panel, P.outline, 2.5);
    rect(ctx, x, y, d.w, d.h, '#2a2a2c', null);
    // lit cabin
    ctx.fillStyle = 'rgba(255,248,220,0.25)';
    ctx.fillRect(x, y, d.w, d.h);
    const half = d.w / 2;
    const slide = half * 0.92 * o;
    rect(ctx, x - slide, y, half, d.h, P.door, P.outline, 2.5);
    rect(ctx, x + half + slide, y, half, d.h, P.door, P.outline, 2.5);
    // cover the slid panels outside the frame
    ctx.fillStyle = P.interior;
    if (slide > 0.5) {
      ctx.fillRect(x - slide - 8, y - 4, slide + 2, d.h + 4);
      ctx.fillRect(x + d.w + 6, y - 4, slide + 2, d.h + 4);
    }
    // indicator
    const ix = d.x - 30;
    const iy = y - 40;
    rect(ctx, ix, iy, 60, 24, P.panel, P.outline, 2);
    ctx.fillStyle = o > 0.1 ? '#e8a33a' : '#6a6a6a';
    ctx.beginPath();
    ctx.moveTo(ix + 15, iy + 5);
    ctx.lineTo(ix + 9, iy + 13);
    ctx.lineTo(ix + 21, iy + 13);
    ctx.closePath();
    ctx.fill();
    ctx.fillRect(ix + 13, iy + 12, 4, 7);
    ctx.fillStyle = '#6a6a6a';
    ctx.beginPath();
    ctx.moveTo(ix + 45, iy + 19);
    ctx.lineTo(ix + 39, iy + 11);
    ctx.lineTo(ix + 51, iy + 11);
    ctx.closePath();
    ctx.fill();
    ctx.fillRect(ix + 43, iy + 5, 4, 7);
    // call buttons
    rect(ctx, x + d.w + 16, y + d.h * 0.42, 14, 28, P.door, P.outline, 2);
    ctx.fillStyle = P.outline;
    ctx.beginPath();
    ctx.arc(x + d.w + 23, y + d.h * 0.42 + 8, 2.4, 0, TAU);
    ctx.arc(x + d.w + 23, y + d.h * 0.42 + 19, 2.4, 0, TAU);
    ctx.fill();
    void env;
    void t;
  },
  hoist(ctx, d, P, t, sim) {
    const o = openness(d, sim, 1 / 60);
    const x = d.x - d.w / 2;
    const y = d.y - d.h;
    rect(ctx, x, y, d.w, d.h, 'rgba(60,64,70,0.35)', P.pipeDark, 3);
    ctx.strokeStyle = 'rgba(70,74,80,0.6)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let k = 0; k <= d.w; k += 10) {
      ctx.moveTo(x + k, y);
      ctx.lineTo(x + k, y + d.h);
    }
    for (let k = 0; k <= d.h; k += 10) {
      ctx.moveTo(x, y + k);
      ctx.lineTo(x + d.w, y + k);
    }
    ctx.stroke();
    // gate rises when open
    rect(ctx, x + 6, y + 6 - o * (d.h - 20), d.w - 12, d.h - 12, 'rgba(242,194,48,0.25)', '#f2c230', 3);
    line(ctx, d.x, y, d.x, y - 600, P.pipeDark, 3);
  },
  vent(ctx, d, P, t, sim) {
    const o = openness(d, sim, 1 / 60);
    rect(ctx, d.x - d.w / 2, d.y, d.w, 10, '#2c2c2c', P.outline, 2);
    // grate swings down
    ctx.save();
    ctx.translate(d.x - d.w / 2, d.y + 10);
    ctx.rotate(o * 1.3);
    rect(ctx, 0, -4, d.w, 7, P.metal, P.outline, 1.5);
    for (let k = 8; k < d.w; k += 10) line(ctx, k, -4, k, 3, P.metalDark, 1.5);
    ctx.restore();
  },
  lamp(ctx, d, P) {
    const x = d.x;
    const y = d.y;
    line(ctx, x, y, x, y + 6, P.outline, 3);
    ctx.fillStyle = P.lamp;
    ctx.beginPath();
    ctx.moveTo(x - 10, y + 6);
    ctx.lineTo(x + 10, y + 6);
    ctx.lineTo(x + 22, y + 24);
    ctx.lineTo(x - 22, y + 24);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = P.outline;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = P.lampLens;
    ctx.beginPath();
    ctx.ellipse(x, y + 25, 21, 5, 0, 0, TAU);
    ctx.fill();
    ctx.stroke();
  },
  hangLamp(ctx, d, P) {
    const y1 = d.y + d.len;
    line(ctx, d.x, d.y, d.x, y1, P.outline, 2);
    ctx.fillStyle = P.lamp;
    ctx.beginPath();
    ctx.arc(d.x, y1 + 18, 26, Math.PI, TAU);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = P.lampLens;
    ctx.beginPath();
    ctx.ellipse(d.x, y1 + 18, 24, 6, 0, 0, TAU);
    ctx.fill();
  },
  pipe(ctx, d, P) {
    const pts = d.pts;
    ctx.lineJoin = 'miter';
    ctx.strokeStyle = P.outline;
    ctx.lineWidth = d.w + 3;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke();
    ctx.strokeStyle = P.pipe;
    ctx.lineWidth = d.w;
    ctx.stroke();
    ctx.lineJoin = 'round';
    // flange joints
    ctx.fillStyle = P.pipeDark;
    for (let i = 1; i < pts.length; i++) {
      const [x0, y0] = pts[i - 1];
      const [x1, y1] = pts[i];
      const len = Math.hypot(x1 - x0, y1 - y0);
      const n = Math.floor(len / 95);
      for (let k = 1; k <= n; k++) {
        const u = k / (n + 1);
        const x = x0 + (x1 - x0) * u;
        const y = y0 + (y1 - y0) * u;
        if (Math.abs(x1 - x0) > Math.abs(y1 - y0)) ctx.fillRect(x - 3, y - d.w * 0.8, 6, d.w * 1.6);
        else ctx.fillRect(x - d.w * 0.8, y - 3, d.w * 1.6, 6);
      }
    }
  },
  vending(ctx, d, P) {
    const x = d.x;
    const y = d.y - d.h;
    rect(ctx, x, y, d.w, d.h, '#9b9b9b', P.outline, 2.5);
    rect(ctx, x + 8, y + 18, d.w * 0.52, d.h * 0.66, '#f0f0f0', P.outline, 2);
    ctx.fillStyle = '#2a2a2a';
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) ctx.fillRect(x + 13 + c * 11.5, y + 25 + r * 21, 7, 14);
    }
    rect(ctx, x + d.w * 0.6 + 4, y + 18, d.w * 0.32, 32, '#3a3a3a', P.outline, 2);
    ctx.save();
    ctx.translate(x + d.w * 0.76 + 4, y + 36);
    ctx.rotate(-0.22);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(d.variant === 1 ? 'Soda' : 'Drink!', 0, 3);
    ctx.restore();
    for (let k = 0; k < 4; k++) rect(ctx, x + d.w * 0.64 + 4, y + 60 + k * 14, d.w * 0.24, 7, '#d0d0d0', P.outline, 1.2);
    rect(ctx, x + 12, y + d.h - 26, d.w * 0.3, 12, '#2a2a2a', null);
  },
  poster(ctx, d, P) {
    const hue = d.hue;
    rect(ctx, d.x - 26, d.y, 52, 70, `hsl(${hue},40%,88%)`, P.outline, 2);
    ctx.fillStyle = `hsl(${hue},55%,50%)`;
    ctx.fillRect(d.x - 20, d.y + 8, 40, 26);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    for (let k = 0; k < 3; k++) ctx.fillRect(d.x - 20, d.y + 42 + k * 8, 40 - k * 9, 3);
  },
  panel(ctx, d, P) {
    rect(ctx, d.x - 16, d.y + 20, 32, 44, P.panel, P.outline, 2);
    ctx.fillStyle = '#5b5b5b';
    ctx.fillRect(d.x - 9, d.y + 28, 18, 6);
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath();
    ctx.arc(d.x, d.y + 48, 4, 0, TAU);
    ctx.fill();
  },
  clock(ctx, d, P, t, sim) {
    const cx = d.x;
    const cy = d.y + 30;
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = P.outline;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(cx, cy, 16, 0, TAU);
    ctx.fill();
    ctx.stroke();
    const secs = sim.time;
    const a1 = (secs / 60) * TAU;
    const a2 = (secs / 3600) * TAU + 2;
    line(ctx, cx, cy, cx + Math.sin(a1) * 12, cy - Math.cos(a1) * 12, '#c0392b', 1.5);
    line(ctx, cx, cy, cx + Math.sin(a2) * 8, cy - Math.cos(a2) * 8, P.outline, 2.5);
  },
  extinguisher(ctx, d, P) {
    rect(ctx, d.x - 13, d.y + 30, 26, 50, '#f7f7f7', P.outline, 2);
    rect(ctx, d.x - 6, d.y + 40, 12, 34, '#d63a2f', P.outline, 1.5);
  },
  sign(ctx, d, P) {
    if (d.variant % 2 === 0) {
      ctx.fillStyle = '#f2c230';
      ctx.strokeStyle = P.outline;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(d.x, d.y + 10);
      ctx.lineTo(d.x - 20, d.y + 44);
      ctx.lineTo(d.x + 20, d.y + 44);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = P.outline;
      ctx.fillRect(d.x - 2, d.y + 20, 4, 13);
      ctx.fillRect(d.x - 2, d.y + 36, 4, 4);
    } else {
      rect(ctx, d.x - 40, d.y + 10, 80, 26, '#1f5f8b', P.outline, 2);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(d.variant === 1 ? 'LEVEL ' + ((d.floor || 0) + 1) : 'ZONE ' + 'ABCD'[(d.floor || 0) % 4], d.x, d.y + 28);
    }
  },
  column(ctx, d, P) {
    rect(ctx, d.x - d.w / 2, d.top, d.w, d.y - d.top, '#a3a3a3', P.outline, 2.5);
    ctx.fillStyle = '#8a8a8a';
    ctx.fillRect(d.x - d.w / 2, d.top, d.w, 34);
    line(ctx, d.x - d.w / 2, d.top + 34, d.x + d.w / 2, d.top + 34, P.outline, 2);
    rect(ctx, d.x - 9, d.y - 120, 18, 18, '#cfcfcf', P.outline, 2);
    ctx.fillStyle = '#3a3a3a';
    ctx.beginPath();
    ctx.arc(d.x, d.y - 111, 4.5, 0, TAU);
    ctx.fill();
  },
  alarm(ctx, d, P, t, sim) {
    const on = sim.director.alarm > 0 && Math.sin(t * 14) > -0.2;
    ctx.fillStyle = on ? '#ff3b2f' : '#9a9a9a';
    ctx.strokeStyle = P.outline;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(d.x, d.y, 11, Math.PI * 0.5, Math.PI * 1.5);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    if (on) {
      const g = ctx.createRadialGradient(d.x, d.y, 2, d.x, d.y, 90);
      g.addColorStop(0, 'rgba(255,60,40,0.35)');
      g.addColorStop(1, 'rgba(255,60,40,0)');
      ctx.fillStyle = g;
      ctx.fillRect(d.x - 90, d.y - 90, 180, 180);
    }
  },
  catwalk(ctx, d, P) {
    const y = d.y;
    rect(ctx, d.x0, y, d.x1 - d.x0, 12, P.metal, P.outline, 2.5);
    ctx.strokeStyle = P.metalDark;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (let x = d.x0 + 6; x < d.x1; x += 9) {
      ctx.moveTo(x, y + 2);
      ctx.lineTo(x - 5, y + 10);
    }
    ctx.stroke();
    // supports
    for (let x = d.x0 + 40; x < d.x1 - 20; x += 220) {
      line(ctx, x, y + 12, x, 0, P.metalDark, 5);
      line(ctx, x, y + 40, x + 46, y + 12, P.metalDark, 3);
    }
  },
  railingPost(ctx, d, P) {
    line(ctx, d.x, d.y, d.x, d.y - d.h, P.metalDark, 5);
    line(ctx, d.x - 8, d.y - d.h, d.x + 8, d.y - d.h, P.metalDark, 5);
    line(ctx, d.x, d.y - d.h * 0.5, d.x + 4, d.y - d.h * 0.5, P.metalDark, 3);
  },
  officeDoor(ctx, d, P) {
    rect(ctx, d.x, d.y - 150, 60, 150, P.door, P.outline, 2.5);
    rect(ctx, d.x + 12, d.y - 136, 36, 40, 'rgba(160,200,230,0.6)', P.outline, 2);
    rect(ctx, d.x + 6, d.y - 172, 48, 16, '#2e9e57', P.outline, 2);
  },
  rollupDoor(ctx, d, P) {
    const h = d.h * (1 - d.open);
    rect(ctx, d.x, d.y - d.h, d.w, h, '#b8b2a5', P.outline, 2.5);
    ctx.strokeStyle = '#8e887b';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let y = d.y - d.h + 8; y < d.y - d.h + h; y += 8) {
      ctx.moveTo(d.x, y);
      ctx.lineTo(d.x + d.w, y);
    }
    ctx.stroke();
    stripeBand(ctx, d.x - 30, d.x + d.w + 30, d.y + 1, 6, '#f2c230', '#222');
  },
  rack(ctx, d, P) {
    const x = d.x;
    const y = d.y - d.h;
    ctx.globalAlpha = 0.85;
    line(ctx, x, d.y, x, y, P.metalDark, 6);
    line(ctx, x + d.w, d.y, x + d.w, y, P.metalDark, 6);
    const rng = new RNG(d.seed);
    const shelves = Math.floor(d.h / 95);
    for (let s = 0; s <= shelves; s++) {
      const sy = d.y - s * 95;
      line(ctx, x, sy, x + d.w, sy, '#d08a2c', 5);
      if (s === shelves) break;
      let bx = x + 6;
      while (bx < x + d.w - 20) {
        const bw = rng.range(24, 54);
        const bh = rng.range(30, 70);
        if (bx + bw > x + d.w - 4) break;
        if (rng.next() < 0.8) rect(ctx, bx, sy - bh - 3, bw, bh, rng.pick(['#c89b62', '#b98a52', '#d9b07a', '#9a7448']), 'rgba(60,40,20,0.6)', 1.5);
        bx += bw + rng.range(2, 10);
      }
    }
    ctx.globalAlpha = 1;
  },
  forklift(ctx, d, P) {
    const x = d.x;
    const y = d.y;
    const s = d.dir;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, 1);
    ctx.globalAlpha = 0.9;
    rect(ctx, -60, -70, 90, 50, '#f0b429', P.outline, 2.5);
    rect(ctx, -40, -130, 50, 60, 'rgba(255,255,255,0)', P.outline, 3);

    rect(ctx, 42, -12, 46, 6, P.metalDark, null);
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(-40, -16, 16, 0, TAU);
    ctx.arc(14, -16, 16, 0, TAU);
    ctx.fill();
    ctx.restore();
  },
  trusses(ctx, d, P) {
    ctx.strokeStyle = shade(P.metalDark, 0.2);
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(d.x0, d.y + 50);
    ctx.lineTo(d.x1, d.y + 50);
    for (let x = d.x0; x < d.x1; x += 80) {
      ctx.moveTo(x, d.y + 50);
      ctx.lineTo(x + 40, d.y);
      ctx.lineTo(x + 80, d.y + 50);
    }
    ctx.stroke();
  },
  stripes(ctx, d) {
    stripeBand(ctx, d.x0, d.x0 + d.w, d.y + 1, 6, '#f2c230', '#222');
  },
  building(ctx, d, P, t, sim, env) {
    // facade under a roof segment
    const x0 = d.x0;
    const x1 = d.x1;
    const y = d.y + 24;
    ctx.fillStyle = P.wall;
    ctx.fillRect(x0, y, x1 - x0, 1600);
    ctx.fillStyle = P.wallDark;
    ctx.fillRect(x0, y, 10, 1600);
    ctx.fillRect(x1 - 10, y, 10, 1600);
    const rng = new RNG(d.seed);
    for (let wy = y + 40; wy < y + 900; wy += 70) {
      for (let wx = x0 + 30; wx < x1 - 50; wx += 64) {
        const lit = rng.next() < 0.35;
        ctx.fillStyle = lit ? 'rgba(255,212,134,0.85)' : 'rgba(30,24,40,0.85)';
        ctx.fillRect(wx, wy, 34, 42);
      }
    }
    void env;
  },
  skylight(ctx, d, P) {
    if (d.solid && d.solid.broken) {

      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x + 14, d.y);
      ctx.lineTo(d.x, d.y + 9);

  shed(ctx, d, P) {

  ac(ctx, d, P) {

  },
  waterTower(ctx, d, P) {

  antenna(ctx, d, P, t) {
    line(ctx, d.x, d.y, d.x, d.y - d.h, P.metalDark, 3);
    line(ctx, d.x - 16, d.y - d.h * 0.7, d.x + 16, d.y - d.h * 0.7, P.metalDark, 2);

          this.burst('spark', e.x, e.y, 6 + pw * 6, { speed: [120, 380], life: [0.08, 0.22], size: [1.2, 2.2], color: '200,225,255', g: 600, drag: 2, add: true });
          this.spawn({ type: 'ring', x: e.x, y: e.y, life: 0.18, size: 6, grow: 140, color: '210,230,255', alpha: 0.7 });
        } else if (e.kind === 'parry') {
          this.burst('spark', e.x, e.y, 16, { speed: [200, 520], life: [0.1, 0.3], size: [1.5, 2.6], color: '255,240,190', g: 500, drag: 2, add: true });
          this.spawn({ type: 'flash', x: e.x, y: e.y, life: 0.12, size: 34, color: '255,250,230', add: true });
        } else {
          if (this.goreK > 0 && e.b && e.kind !== 'push') this.bleedHit(e, sim, pw);
          if (e.a && e.a.isHero && e.b && !e.friendly && (e.b.dead || (e.down && pw > 1.2))) this.impactFrame(e.a, e.b, e.x, e.y);
          const metal = e.weapon === 'pipe' || e.weapon === 'crowbar';
          this.spawn({ type: 'flash', x: e.x, y: e.y, life: 0.07 + pw * 0.03, size: 14 + pw * 16, color: '255,255,255', add: true });
          this.spawn({ type: 'streaks', x: e.x, y: e.y, life: 0.11, size: 16 + pw * 18, rot: r.range(0, TAU), color: '255,255,255', alpha: 0.95 });
          if (metal) this.burst('spark', e.x, e.y, 8, { speed: [160, 460], life: [0.1, 0.3], size: [1.2, 2.2], color: '255,220,140', g: 700, drag: 1.5, add: true });
          if (e.down && pw > 0.8) this.spawn({ type: 'ring', x: e.x, y: e.y, life: 0.22, size: 8, grow: 220, color: '255,255,255', alpha: 0.55 });
          if (pw > 1.1) this.flashScreen(0.08, '255,255,255');
        }
        break;
      }
      case 'thud': {
        const pw = Math.min(1.6, e.power || 0.5);
        if (this.goreK > 0 && e.f && e.f.gore && (e.wall || pw > 0.8)) this.bleedImpact(e, sim, pw);
        if (e.f && pw > 1.25 && e.f.knock && e.f.knock.by && e.f.knock.by.isHero && sim.time - e.f.knock.time < 1.5) {
          // slammed down hard: the floor shakes, dust rings out
          this.impactFrame(e.f.knock.by, e.f, e.x, e.y);
          for (const dir of [-1, 1]) this.burst('dust', e.x + dir * 8, e.y + 4, 5, { ang: dir > 0 ? -0.1 : Math.PI + 0.1, spread: 0.25, speed: [120, 320], life: [0.35, 0.7], size: [6, 11], grow: 30, color: '200,196,190', drag: 4, alpha: 0.5 });
          this.spawn({ type: 'ring', x: e.x, y: e.y, life: 0.25, size: 10, grow: 260, color: '255,255,255', alpha: 0.5 });
        }
        if (e.wall) {
          this.burst('chip', e.x, e.y, 6, { speed: [80, 260], life: [0.4, 0.9], size: [1.5, 3], color: '150,150,150', g: 1500, floor: e.y + 50 });
        }
        this.burst('dust', e.x, e.y, 3 + Math.round(pw * 5), { speed: [30, 120 * pw + 40], life: [0.35, 0.8], size: [6, 12], grow: 30, color: '190,186,180', drag: 3, alpha: 0.5, jx: 10, jy: 4 });
        break;
      }
      case 'land': {
        const pw = Math.min(1.5, e.power || 0.5);
        if (pw < 0.5) break;
        for (const dir of [-1, 1]) this.burst('dust', e.x + dir * 10, e.y - 3, 3, { ang: dir > 0 ? -0.15 : Math.PI + 0.15, spread: 0.3, speed: [40, 140 * pw], life: [0.3, 0.6], size: [5, 9], grow: 26, color: '200,196,190', drag: 4, alpha: 0.45 });
        break;
      }
      case 'step':
        if ((e.power || 0) > 0.7 && r.chance(0.5)) this.burst('dust', e.x, e.y - 2, 1, { speed: [10, 40], life: [0.25, 0.45], size: [3, 6], grow: 14, color: '200,196,190', drag: 4, alpha: 0.35 });
        break;
      case 'trip':
        this.burst('dust', e.x, e.y - 4, 5, { speed: [30, 120], life: [0.3, 0.7], size: [5, 10], grow: 24, color: '200,196,190', drag: 3, alpha: 0.45 });
        break;
      case 'break': {
        const pw = Math.min(1.6, e.power || 0.6);
        if (e.material === 'glass') {
          this.burst('shard', e.x, e.y, e.small ? 8 : 26 + pw * 10, { speed: [80, 420], life: [0.6, 1.4], size: [2, 6], color: '200,230,250', g: 1400, floor: this.floorBelow(sim, e.x, e.y), jx: e.small ? 3 : 10, jy: e.small ? 3 : 60 });
          if (!e.small) this.flashScreen(0.05, '230,245,255');
        } else if (e.material === 'wood' || e.material === 'cardboard') {
          const col = e.material === 'wood' ? '190,140,80' : '200,170,120';
          this.burst('chip', e.x, e.y, e.small ? 6 : 18, { speed: [90, 360], life: [0.6, 1.4], size: [2, 5], color: col, g: 1500, floor: this.floorBelow(sim, e.x, e.y), jx: (e.w || 20) / 2, jy: (e.h || 20) / 2 });
          this.burst('dust', e.x, e.y, 6, { speed: [20, 90], life: [0.4, 0.9], size: [8, 16], grow: 26, color: '210,190,160', drag: 3, alpha: 0.4 });
        } else {
          this.burst('spark', e.x, e.y, 10, { speed: [100, 380], life: [0.1, 0.3], size: [1.2, 2.2], color: '255,220,140', g: 800, drag: 1.5, add: true });
        }
        break;
      }
      case 'clatter':
        if (e.material === 'metal' && (e.power || 0) > 0.5) this.burst('spark', e.x, e.y, 4, { speed: [60, 240], life: [0.08, 0.2], size: [1, 2], color: '255,220,150', g: 800, add: true });
        break;
      case 'zap': {
        this.burst('spark', e.x, e.y, e.floor ? 10 : 24, { speed: [140, 520], life: [0.12, 0.4], size: [1.2, 2.4], color: '220,240,255', g: 500, drag: 1.5, add: true });
        if (e.f) this.arcs.push({ hz: e.hz, f: e.f, until: this.time + (e.floor ? 0.45 : 0.9), floor: !!e.floor, x: e.x, y: e.y });
        this.flashScreen(e.floor ? 0.05 : 0.12, '220,235,255');
        this.lights.push({ x: e.x, y: e.y, r: 320, life: 0.6, max: 0.6, color: '200,225,255' });
        break;
      }
      case 'sparks':
        this.burst('spark', e.x, e.y, 5, { speed: [60, 220], life: [0.08, 0.25], size: [1, 2], color: '230,240,255', g: 600, add: true });
        break;
      case 'explosion': {
        const R = e.R || 220;
        this.spawn({ type: 'flash', x: e.x, y: e.y, life: 0.22, size: R * 0.9, color: '255,240,200', add: true });
        this.spawn({ type: 'ring', x: e.x, y: e.y, life: 0.35, size: 20, grow: R * 3.2, color: '255,230,190', alpha: 0.7 });
        this.burst('fire', e.x, e.y, 26, { speed: [60, 480], life: [0.25, 0.6], size: [10, 24], grow: -16, color: '255,120,30', g: -220, drag: 3.2 });
        this.burst('fire', e.x, e.y, 10, { speed: [20, 200], life: [0.12, 0.3], size: [14, 26], grow: -30, color: '255,236,170', g: -100, drag: 3, add: true });
        this.burst('smoke', e.x, e.y, 20, { speed: [30, 200], life: [1.2, 2.6], size: [16, 30], grow: 38, color: '58,54,52', g: -60, drag: 1.6, alpha: 0.6 });
        this.burst('chip', e.x, e.y, 20, { speed: [200, 700], life: [0.6, 1.4], size: [2, 4], color: '60,55,50', g: 1500, floor: this.floorBelow(sim, e.x, e.y) });
        this.flashScreen(0.45, '255,236,200');
        this.lights.push({ x: e.x, y: e.y, r: R * 2.4, life: 0.9, max: 0.9, color: '255,180,90' });
        break;
      }
      case 'steam':
        if (e.on) this.steamers.set(e.x * 7 + e.y, e);
        else this.steamers.delete(e.x * 7 + e.y);
        break;
      case 'vent':
        this.burst('dust', e.x, e.y + 10, 8, { speed: [20, 120], life: [0.5, 1.0], size: [6, 12], grow: 20, color: '170,170,170', g: 100, drag: 2, alpha: 0.5 });
        break;
      case 'pickup':
        this.spawn({ type: 'flash', x: e.x, y: e.y, life: 0.15, size: 10, color: '255,255,230', add: true });
        break;
      case 'heroDefeated':
        this.flashScreen(0.25, '255,255,255');
        break;
      case 'ko':
        if (this.goreK > 0 && e.f && e.cause !== 'electric' && e.cause !== 'fell' && e.cause !== 'window') {
          const g = woundsOf(e.f);
          g.bleed = Math.min(2, g.bleed + 0.6);
          const hp = e.f.rag.p[HEAD];
          this.spray(sim, hp.x, hp.y, (e.by ? Math.sign(e.f.x - e.by.x) : 0) || 1, 1.2, 10, e.cause === 'explosion' ? 2 : 1);
        }
        break;
    }
    void settings;
  }

  // A landed blow: wounds on the struck part, a spray away from the attacker,
  // and on big hits a splash straight onto the wall behind the victim.
  bleedHit(e, sim, pw) {
    const t = e.b;
    const g = woundsOf(t);
    const dmg = pw * 9;
    const slots = WOUND_PART[e.part] || WOUND_PART.body;
    const slot = slots[this.rng.int(0, slots.length - 1)];
    const k = dmg / Math.max(20, t.maxHp * 0.35);
    g.w[slot] = Math.min(1.5, g.w[slot] + k * (e.ground ? 0.8 : 1));
    if (e.part === 'body') {
      const arm = 2 + this.rng.int(0, 1);
      g.w[arm] = Math.min(1.5, g.w[arm] + k * 0.3);
    }
    const cut = e.weapon || e.kind === 'weapon' || e.part === 'head';
    g.bleed = Math.min(2, g.bleed + k * (cut ? 0.9 : 0.5));
    const dir = Math.sign(t.x - (e.a ? e.a.x : t.x - 1)) || 1;
    const heavy = pw > 1.15 || e.down;
    const n = (2 + pw * 5) * (e.part === 'head' ? 1.3 : 1) * (cut ? 1.3 : 1) * (heavy ? 1.3 : 1);
    this.spray(sim, e.x, e.y, dir, pw, n, 1);
    if (heavy && this.rng.chance(0.35 * this.goreK)) {
      // the classic: a splash on the wall right behind the head
      const hx = t.rag.p[HEAD].x + dir * this.rng.range(14, 40);
      const hy = t.rag.p[HEAD].y + this.rng.range(-10, 18);
      this.gore.wall(hx, hy, dir, this.rng.range(-0.4, 0.2), 3 + pw * 3.5 * Math.min(1.4, this.goreK));
    }
  }

  // Bodies slamming into floors and walls leave their mark.
  bleedImpact(e, sim, pw) {
    const g = e.f.gore;
    if (g.bleed < 0.15 && !e.wall) return;
    if (e.wall && e.nx !== undefined) {
      this.gore.wall(e.x, e.y, -e.nx, this.rng.range(-0.3, 0.3), 3 + pw * 4);
      this.spray(sim, e.x, e.y, -Math.sign(e.nx) || 1, pw * 0.8, 6, 1);
    } else {
      const fl = this.floorBelow(sim, e.x, e.y - 20);
      if (fl - e.y < 40) this.gore.floor(e.x, fl, 2 + pw * 3 * Math.min(1.5, g.bleed + 0.4));
    }
  }

  // Droplets thrown from (x, y), mostly in direction dir, some sticking to
  // the wall behind mid-flight, the rest raining onto the floor.
  spray(sim, x, y, dir, pw, n, mul) {
    const r = this.rng;
    const count = Math.round(n * this.goreK * (mul || 1));
    const fl = this.floorBelow(sim, x, y);
    for (let i = 0; i < count; i++) {
      const a = (dir > 0 ? 0 : Math.PI) + dir * r.range(-0.95, 0.45) + (r.chance(0.15) ? Math.PI * r.range(0.8, 1.2) : 0);
      const sp = r.range(90, 260 + pw * 260);
      this.spawn({
        type: 'blood',
        x: x + r.range(-3, 3),
        y: y + r.range(-3, 3),
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - r.range(40, 160),
        life: r.range(0.7, 1.6),
        size: r.range(1.1, 2.6) * (0.8 + pw * 0.2),
        color: r.chance(0.3) ? '120,6,14' : '165,12,22',
        g: 1500,
        drag: 0.6,
        floor: fl,
        wallT: r.chance(0.3) ? r.range(0.03, 0.3) : -1,
      });
    }
    if (this.goreK > 1.2 && pw > 0.6) {
      this.burst('mist', x, y, 2 + Math.round(pw * 2), { ang: dir > 0 ? -0.2 : Math.PI + 0.2, spread: 0.7, speed: [20, 90], life: [0.25, 0.5], size: [4, 8], grow: 22, color: '150,10,20', drag: 4, alpha: 0.35 });
    }
  }

  // Blood particles: stick to walls mid-flight or stain the floor on landing.
  bloodStep(p, sim) {
    if (p.wallT >= 0 && p.max - p.life >= p.wallT) {
      p.alive = false;
      if (!this.gore.drop(p.x, p.y, p.vx, p.vy, p.size)) {
        p.alive = true;
        p.wallT = -1;
      }
      return;
    }
    if (p.floor !== null && p.y >= p.floor) {
      const g = sim.level.groundUnder(p.x - 1, p.x + 1, p.floor - 6, 12, true, false);
      if (g) {
        this.gore.floor(p.x, g.y, p.size * 0.9);
        p.alive = false;
      } else p.floor = this.floorBelow(sim, p.x, p.y + 2);
    }
  }

  // Wounded fighters drip; bodies on the floor pool and smear.
  updateBleeding(dt, sim, view) {
    const r = this.rng;
    const h = sim.h;
    for (const f of sim.fighters) {
      const g = f.gore;
      if (!g || g.bleed <= 0.02 || f.removed) continue;
      const pel = f.rag.p[PELVIS];
      if (pel.x < view.x0 - 300 || pel.x > view.x1 + 300) continue;
      if (!f.dead) g.bleed = Math.max(0, g.bleed - dt * 0.012);
      if (!f.ragdolled) {
        if (r.chance(dt * g.bleed * 2.2 * this.goreK)) {
          const src = g.w[W_HEAD] > g.w[W_TORSO] ? f.rag.p[HEAD] : f.rag.p[NECK];
          this.spawn({ type: 'blood', x: src.x + r.range(-4, 4), y: src.y + 6, vx: f.vx * 0.5 + r.range(-15, 15), vy: r.range(0, 40), life: 1.5, size: r.range(1, 1.8), color: '150,10,20', g: 1400, floor: this.floorBelow(sim, src.x, src.y) });
        }
        g.smearX = null;
        continue;
      }
      // lying still: a pool spreads from the head and chest
      const hp = f.rag.p[HEAD];
      const slow = f.rag.sleeping || f.rag.coreSpeed(h) < 40;
      g.poolT -= dt;
      if (slow && g.poolT <= 0) {
        g.poolT = 0.35;
        const cx = (hp.x * 2 + pel.x) / 3;
        const fl = sim.level.groundUnder(cx - 2, cx + 2, Math.max(hp.y, pel.y) - 12, 40, true, false);
        if (fl) {
          const maxR = 10 + Math.min(1.5, g.bleed) * 26 * Math.min(1.3, this.goreK);
          if (Math.abs(cx - g.poolX) > 30 || Math.abs(fl.y - g.poolY) > 4) {
            g.poolX = cx;
            g.poolY = fl.y;
            g.pool = 3;
          }
          if (g.pool < maxR) {
            g.pool = Math.min(maxR, g.pool + 2.2);
            this.gore.pool(g.poolX, g.poolY, g.pool);
          }
        }
      }
      // sliding along the floor: smear
      if (!slow && pel.ground !== undefined) {
        const low = f.rag.p[NECK].ground || pel.ground || f.rag.p[KNEE_A].ground || f.rag.p[KNEE_B].ground;
        if (low) {
          const fl = sim.level.groundUnder(pel.x - 2, pel.x + 2, pel.y - 6, 30, true, false);
          if (fl) {
            if (g.smearX !== null && Math.abs(pel.x - g.smearX) < 60) this.gore.smear(g.smearX, pel.x, fl.y, g.bleed);
            g.smearX = pel.x;
          } else g.smearX = null;
        } else g.smearX = null;
      }
    }
  }

  floorBelow(sim, x, y) {
    const g = sim.level.groundUnder(x - 2, x + 2, y, 600, true, false);
    return g ? g.y : y + 400;
  }

  flashScreen(a, color) {
    if (a > this.flash) {
      this.flash = a;
      this.flashColor = color;
    }
  }

  // --------------------------------------------------------------- update
  update(dt, sim, view, settings) {
    this.time += dt;
    if (this.impact) {
      this.impact.t -= dt;
      if (this.impact.t <= 0) this.impact = null;
    }
    if (settings) this.goreK = [0, 1, 1.7][settings.gore | 0] || 0;
    const r = this.rng;
    for (const p of this.ps) {
      if (!p.alive) continue;
      p.life -= dt;
      if (p.life <= 0) {
        p.alive = false;
        continue;
      }
      if (p.drag) {
        const k = Math.exp(-p.drag * dt);
        p.vx *= k;
        p.vy *= k;
      }
      p.vy += p.g * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      p.size = Math.max(0.2, p.size + p.grow * dt);
      if (p.type === 'blood') {
        this.bloodStep(p, sim);
        continue;
      }
      if (p.floor !== null && p.y > p.floor) {
        p.y = p.floor;
        p.vy *= -0.3;
        p.vx *= 0.5;
        p.vr *= 0.5;
      }
    }
    this.flash = Math.max(0, this.flash - dt * 2.2);
    for (let i = this.lights.length - 1; i >= 0; i--) {
      this.lights[i].life -= dt;
      if (this.lights[i].life <= 0) this.lights.splice(i, 1);
    }
    for (let i = this.arcs.length - 1; i >= 0; i--) if (this.time > this.arcs[i].until || this.arcs[i].f.removed) this.arcs.splice(i, 1);
    // live emitters
    for (const e of this.steamers.values()) {
      for (let k = 0; k < 3; k++) {
        this.spawn({ type: 'steam', x: e.x + e.dir * 16, y: e.y + r.range(-6, 6), vx: e.dir * r.range(260, 520), vy: r.range(-60, 20), life: r.range(0.35, 0.7), size: r.range(6, 10), grow: 70, color: '245,245,245', drag: 2.2, alpha: 0.55 });
      }
    }
    for (const b of sim.props.boxes) {
      if (b.fuse < 0) continue;
      const [cx, cy] = b.center();
      if (r.chance(0.7)) this.spawn({ type: 'spark', x: cx, y: cy - b.h / 2 - 4, vx: r.range(-80, 80), vy: r.range(-260, -80), life: r.range(0.1, 0.25), size: 1.5, color: '255,210,120', g: 600, add: true });
    }
    for (const f of sim.fighters) {
      if (f.state !== 'zap' || f.removed) continue;
      if (r.chance(0.6)) {
        const p = f.rag.p[r.int(0, NJ - 1)];
        this.spawn({ type: 'spark', x: p.x, y: p.y, vx: r.range(-200, 200), vy: r.range(-260, 60), life: r.range(0.06, 0.18), size: 1.4, color: '210,235,255', g: 400, add: true });
      }
    }
    if (this.goreK > 0) this.updateBleeding(dt, sim, view);
    // wind debris & rain
    const L = sim.level;
    if (L.wind && r.chance(dt * 6)) {
      const side = sim.windNow > 0 ? view.x0 - 20 : view.x1 + 20;
      this.spawn({ type: 'leaf', x: side, y: r.range(view.y0, view.y1), vx: sim.windNow * r.range(2.5, 4.5), vy: r.range(-40, 40), life: 4, size: r.range(2.5, 4.5), vr: r.range(-8, 8), color: r.pick(['200,190,170', '235,235,230', '160,150,120']), g: 40 });
    }
    if (L.rain) this.updateRain(dt, view, sim);
    for (const s of this.smoke) {
      s.x += (s.vx + (sim.windNow || 0) * 0.2) * dt;
      if (s.x > L.bounds.right + 400) s.x = L.bounds.left - 300;
      if (s.x < L.bounds.left - 400) s.x = L.bounds.right + 300;
    }
    void settings;
  }

  updateRain(dt, view, sim) {
    const r = this.rng;
    const want = 220;
    while (this.rain.length < want) this.rain.push({ x: r.range(view.x0 - 200, view.x1 + 200), y: r.range(view.y0 - 400, view.y1), v: r.range(900, 1300) });
    const drift = (sim.windNow || 0) * 0.6 - 90;
    for (const d of this.rain) {
      d.y += d.v * dt;
      d.x += drift * dt;
      if (d.y > view.y1 + 20 || d.x < view.x0 - 300 || d.x > view.x1 + 300) {
        d.x = r.range(view.x0 - 200, view.x1 + 200);
        d.y = view.y0 - r.range(0, 300);
        if (r.chance(0.3)) {
          const g = sim.level.groundUnder(d.x - 1, d.x + 1, view.y0, 2000, true, false);
          if (g && g.y < view.y1) this.spawn({ type: 'drop', x: d.x, y: g.y - 1, vx: r.range(-40, 40), vy: r.range(-140, -60), life: 0.25, size: 1.5, color: '210,225,240', g: 900 });
        }
      }
    }
  }

  // ----------------------------------------------------------------- draw
  draw(ctx, view, t) {
    // normal blend first
    for (const p of this.ps) {
      if (!p.alive || p.add) continue;
      if (p.x < view.x0 - 100 || p.x > view.x1 + 100 || p.y < view.y0 - 100 || p.y > view.y1 + 100) continue;
      const k = p.life / p.max;
      drawParticle(ctx, p, k);
    }
