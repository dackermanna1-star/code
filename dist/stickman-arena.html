<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stickman Arena</title>
<meta name="description" content="A physics-driven stick figure combat simulation: one elite black stickman against an endless, procedurally generated crowd.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Saira+Extra+Condensed:wght@600;700;800&display=swap">
<style>
/* Layout: full-bleed canvas stage with a fight-broadcast overlay (hero plate
   top-left, clock top-centre, enemy board top-right, feed bottom-left, dock
   bottom-centre) and a settings drawer on the right. One deliberate dark
   look so it reads over both the white facility and the dusk rooftops. */
:root {
  --bg: #0d0e12;
  --panel: rgba(13, 14, 19, 0.74);
  --panel-solid: #121318;
  --line: rgba(255, 255, 255, 0.1);
  --paper: #f3f1ea;
  --muted: #a0a5ae;
  --dim: #6d727c;
  --accent: #ffb21f;
  --accent-ink: #1a1203;
  --hp: #ec4b3f;
  --stam: #3fcfdc;
  --fatigue: #ab96ff;
  --good: #5bd690;
  --bad: #ff6b5e;
  --font-display: 'Saira Extra Condensed', 'Arial Narrow', 'Roboto Condensed', Impact, sans-serif;
  --font-ui: 'Barlow', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --gutter: 16px;
  color-scheme: dark;
}

[hidden] {
  display: none !important;
}

html,
body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--paper);
  font-family: var(--font-ui);
  font-size: 14px;
}

#app {
  position: fixed;
  inset: 0;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}

#stage {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

button,
input,
select {
  font: inherit;
  color: inherit;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ------------------------------------------------------------------ HUD */
.hud {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.plate,
.clock,
.board {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + var(--gutter));
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 4px;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.plate {
  left: var(--gutter);
  width: 290px;
  padding: 10px 12px 12px;
  display: grid;
  gap: 6px;
}

.plate-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.plate-name {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 34px;
  line-height: 0.9;
  letter-spacing: 0.08em;
}

.plate-sub {
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 0.04em;
}

.bar {
  display: grid;
  grid-template-columns: 30px 1fr 38px;
  align-items: center;
  gap: 8px;
}

.bar-label {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.1em;
  color: var(--muted);
}

.bar-num {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 16px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.bar-track {
  position: relative;
  height: 10px;
  background: rgba(255, 255, 255, 0.08);
  overflow: hidden;
  border-radius: 1px;
}

.bar-track.thin {
  height: 5px;
}

.bar-fill,
.bar-trail {
  position: absolute;
  inset: 0;
  transform-origin: left center;
}

.bar-hp .bar-fill {
  background: linear-gradient(90deg, #b8241c, var(--hp) 60%, #ff7a4d);
}

.bar-trail {
  background: rgba(255, 255, 255, 0.55);
}

.bar-cap {
  position: absolute;
  top: -2px;
  bottom: -2px;
  width: 2px;
  background: var(--paper);
  opacity: 0.5;
  z-index: 2;
}

.bar-st .bar-fill {
  background: linear-gradient(90deg, #1e9aa6, var(--stam));
}

.bar-fa .bar-fill {
  background: var(--fatigue);
}

.hud.critical .bar-hp .bar-track {
  animation: pulse-hp 0.8s ease-in-out infinite;
}

@keyframes pulse-hp {
  50% {
    box-shadow: 0 0 0 2px rgba(236, 75, 63, 0.55);
  }
}

.mind {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.02em;
  margin-top: 2px;
  min-width: 0;
}

.mind span:last-child {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.mind-dot {
  width: 7px;
  height: 7px;
  flex: none;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent);
  animation: blink 1.6s ease-in-out infinite;
}

@keyframes blink {
  50% {
    opacity: 0.35;
  }
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.chips:empty {
  display: none;
}

.chips.center {
  justify-content: center;
}

.chip {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 2px 7px;
  border: 1px solid var(--line);
  border-radius: 2px;
  color: var(--muted);
}

.chip.warn {
  color: var(--accent);
  border-color: rgba(255, 178, 31, 0.45);
}

.chip.bad {
  color: var(--bad);
  border-color: rgba(255, 107, 94, 0.45);
}

.chip.good {
  color: var(--good);
  border-color: rgba(91, 214, 144, 0.45);
}

.clock {
  left: 50%;
  transform: translateX(-50%);
  padding: 6px 18px 9px;
  text-align: center;
  min-width: 190px;
}

.clock-time {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 44px;
  line-height: 1;
  letter-spacing: 0.03em;
  font-variant-numeric: tabular-nums;
}

.clock-meta {
  font-size: 10.5px;
  letter-spacing: 0.16em;
  color: var(--dim);
  margin: 2px 0 6px;
  font-variant-numeric: tabular-nums;
}

.board {
  right: var(--gutter);
  padding: 10px 14px 10px;
  display: grid;
  grid-template-columns: repeat(3, auto);
  column-gap: 18px;
  row-gap: 8px;
  min-width: 240px;
}

.stat {
  display: grid;
  justify-items: end;
}

.stat-num {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 32px;
  line-height: 0.95;
  font-variant-numeric: tabular-nums;
}

.stat-num.accent {
  color: var(--accent);
}

.stat-label {
  font-size: 10.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}

.wave {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 10px;
  align-items: center;
}

.wave-label {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  min-width: 64px;
}

.wave-track {
  height: 4px;
  background: rgba(255, 255, 255, 0.08);
  overflow: hidden;
}

.wave-fill {
  height: 100%;
  background: var(--muted);
  transform-origin: left center;
  transition: background 0.3s;
}

.wave-fill.hot {
  background: var(--accent);
}

.mix {
  grid-column: 1 / -1;
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  font-size: 11.5px;
  color: var(--dim);
}

.feed {
  position: absolute;
  left: var(--gutter);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 84px);
  margin: 0;
  padding: 0;
  list-style: none;
  display: grid;
  gap: 4px;
  max-width: min(440px, calc(100vw - 2 * var(--gutter)));
}

.feed-item {
  font-size: 14px;
  font-weight: 500;
  padding: 4px 10px;
  background: var(--panel);
  border-left: 2px solid transparent;
  color: #d6d8dd;
  transition: opacity 0.5s, transform 0.5s;
  animation: feed-in 0.25s ease-out;
}

.feed-item.lvl0 {
  color: var(--muted);
}

.feed-item.lvl2 {
  color: var(--paper);
  border-left-color: var(--paper);
}

.feed-item.lvl3 {
  color: var(--accent);
  border-left-color: var(--accent);
  font-weight: 700;
}

.feed-item.gone {
  opacity: 0;
  transform: translateX(-12px);
}

@keyframes feed-in {
  from {
    opacity: 0;
    transform: translateX(-14px);
  }
}

.banner {
  position: absolute;
  left: 0;
  right: 0;
  top: 38%;
  display: grid;
  justify-items: center;
  padding: 12px var(--gutter);
  background: linear-gradient(90deg, transparent, rgba(0, 0, 0, 0.55) 20%, rgba(0, 0, 0, 0.55) 80%, transparent);
}

.banner span {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(44px, 9vw, 92px);
  line-height: 1;
  letter-spacing: 0.06em;
  text-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
}

.banner small {
  font-size: 13px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--accent);
}

.banner small:empty {
  display: none;
}

.banner.show {
  animation: banner-in 0.45s cubic-bezier(0.2, 1.4, 0.4, 1);
}

@keyframes banner-in {
  from {
    opacity: 0;
    transform: scale(1.25);
  }
}

.perf {
  position: absolute;
  right: var(--gutter);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 84px);
  margin: 0;
  padding: 8px 10px;
  font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color: var(--muted);
  background: var(--panel);
  border: 1px solid var(--line);
  font-variant-numeric: tabular-nums;
}

/* ----------------------------------------------------------------- dock */
.dock {
  position: absolute;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + var(--gutter));
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  max-width: calc(100vw - 2 * var(--gutter));
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 38px;
  padding: 0 13px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.04);
  cursor: pointer;
  font-weight: 600;
  font-size: 13.5px;
  letter-spacing: 0.02em;
  white-space: nowrap;
  transition: background 0.15s, border-color 0.15s;
}

.btn:hover {
  background: rgba(255, 255, 255, 0.1);
}

.btn svg {
  width: 18px;
  height: 18px;
  flex: none;
}

.btn.icon {
  width: 38px;
  padding: 0;
  justify-content: center;
}

.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}

.btn.primary:hover {
  background: #ffc34d;
}

.btn.ghost {
  border-color: transparent;
  background: transparent;
}

.btn.small {
  height: 32px;
  padding: 0 10px;
  font-size: 12.5px;
}

.btn.wide {
  flex: 1;
  justify-content: center;
}

.seg {
  display: flex;
  border: 1px solid var(--line);
  border-radius: 4px;
  overflow: hidden;
}

.seg-btn {
  height: 36px;
  min-width: 36px;
  padding: 0 8px;
  border: 0;
  background: transparent;
  cursor: pointer;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 15px;
  color: var(--muted);
}

.seg-btn + .seg-btn {
  border-left: 1px solid var(--line);
}

.seg-btn.on {
  background: rgba(255, 255, 255, 0.12);
  color: var(--paper);
}

.sound-hint {
  position: absolute;
  right: var(--gutter);
  bottom: calc(env(safe-area-inset-bottom, 0px) + var(--gutter) + 4px);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 36px;
  padding: 0 14px;
  border: 1px solid rgba(255, 178, 31, 0.6);
  border-radius: 18px;
  background: var(--panel);
  color: var(--accent);
  font-weight: 600;
  cursor: pointer;
  animation: hint 2.4s ease-in-out infinite;
}

.sound-hint svg {
  width: 17px;
  height: 17px;
}

@keyframes hint {
  50% {
    box-shadow: 0 0 0 5px rgba(255, 178, 31, 0.14);
  }
}

/* --------------------------------------------------------------- drawer */
.drawer {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: min(380px, 100vw);
  display: flex;
  flex-direction: column;
  background: rgba(17, 18, 23, 0.97);
  border-left: 1px solid var(--line);
  box-shadow: -20px 0 50px rgba(0, 0, 0, 0.35);
  z-index: 5;
  padding-top: env(safe-area-inset-top, 0px);
}

.drawer-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px var(--gutter) 10px;
  border-bottom: 1px solid var(--line);
}

.drawer-head h2 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 22px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.drawer-body {
  overflow-y: auto;
  padding: 4px var(--gutter) calc(env(safe-area-inset-bottom, 0px) + 24px);
  -webkit-overflow-scrolling: touch;
}

.group {
  display: grid;
  gap: 12px;
  padding: 14px 0 16px;
  border-bottom: 1px solid var(--line);
}

.group h3 {
  margin: 0;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent);
}

.row-actions {
  display: flex;
  gap: 6px;
}

.hint {
  margin: -4px 0 0;
  font-size: 12px;
  color: var(--accent);
}

.field {
  display: grid;
  gap: 6px;
}

.field-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
}

.field-label {
  font-size: 13px;
  font-weight: 600;
  color: #d9dbe0;
}

.field output {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 15px;
  color: var(--paper);
  font-variant-numeric: tabular-nums;
}

.next {
  font-style: normal;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--dim);
  border: 1px solid var(--line);
  padding: 0 4px;
  margin-left: 4px;
  border-radius: 2px;
}

input[type='range'] {
  width: 100%;
  accent-color: var(--accent);
  margin: 0;
}

select,
input[type='text'] {
  width: 100%;
  height: 36px;
  padding: 0 10px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--line);
  border-radius: 4px;
}

select option {
  background: var(--panel-solid);
}

.seed-row {
  display: flex;
  gap: 6px;
}

.seed-row input {
  flex: 1;
  min-width: 0;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.toggle {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  font-weight: 600;
  color: #d9dbe0;
  cursor: pointer;
}

.toggle input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.toggle-ui {
  position: relative;
  width: 34px;
  height: 20px;
  flex: none;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.14);
  transition: background 0.15s;
}

.toggle-ui::after {
  content: '';
  position: absolute;
  top: 3px;
  left: 3px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--paper);
  transition: transform 0.15s;
}

.toggle input:checked + .toggle-ui {
  background: var(--accent);
}

.toggle input:checked + .toggle-ui::after {
  transform: translateX(14px);
  background: var(--accent-ink);
}

.toggle input:focus-visible + .toggle-ui {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.keylist {
  display: grid;
  grid-template-columns: auto 1fr auto 1fr;
  gap: 6px 10px;
  margin: 0;
  font-size: 12.5px;
}

.keylist dt {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color: var(--accent);
}

.keylist dd {
  margin: 0;
  color: var(--muted);
}

/* -------------------------------------------------------------- endcard */
.endcard {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: var(--gutter);
  background: rgba(6, 7, 10, 0.45);
  z-index: 4;
}

.end-inner {
  width: min(560px, 100%);
  max-height: calc(100% - 2 * var(--gutter));
  overflow-y: auto;
  background: rgba(15, 16, 21, 0.95);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 22px 24px 18px;
}

.end-kicker {
  margin: 0;
  font-size: 11px;
  letter-spacing: 0.22em;
  color: var(--dim);
}

.end-title {
  margin: 2px 0 4px;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 64px;
  line-height: 0.95;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  text-wrap: balance;
}

.end-sub {
  margin: 0 0 16px;
  color: #c9ccd2;
  font-size: 15px;
  line-height: 1.45;
  max-width: 60ch;
}

.end-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  margin: 0 0 18px;
  background: var(--line);
  border: 1px solid var(--line);
}

.end-grid div {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  padding: 8px 12px;
  background: rgba(15, 16, 21, 1);
  min-width: 0;
}

.end-grid dt {
  font-size: 12.5px;
  color: var(--muted);
}

.end-grid dd {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 20px;
  font-variant-numeric: tabular-nums;
}

.end-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.end-count {
  margin: 12px 0 0;
  font-size: 12px;
  color: var(--dim);
  min-height: 1em;
}

#app.paused .clock-time {
  color: var(--accent);
}

#app.ui-hidden .feed,
#app.ui-hidden .sound-hint {
  display: none;
}

/* ----------------------------------------------------------- responsive */
@media (max-width: 900px) {
  .board {
    min-width: 0;
  }
  .mix {
    display: none;
  }
}

@media (max-width: 720px) {
  .plate {
    width: min(210px, 46vw);
    padding: 8px 10px 9px;
    gap: 4px;
  }
  .plate-name {
    font-size: 24px;
  }
  .plate-sub,
  .bar-fa,
  .chips#heroChips {
    display: none;
  }
  .bar {
    grid-template-columns: 22px 1fr 28px;
    gap: 6px;
  }
  .bar-num {
    font-size: 13px;
  }
  .mind {
    font-size: 11.5px;
  }
  .clock {
    top: auto;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 72px);
    min-width: 0;
    padding: 4px 12px 6px;
  }
  .clock-time {
    font-size: 26px;
  }
  .clock-meta,
  .clock .chips {
    display: none;
  }
  .board {
    grid-template-columns: repeat(2, auto);
    padding: 8px 10px;
    column-gap: 12px;
  }
  .board .stat:nth-child(3),
  .wave {
    display: none;
  }
  .stat-num {
    font-size: 24px;
  }
  .feed {
    bottom: calc(env(safe-area-inset-bottom, 0px) + 120px);
  }
  .feed-item:nth-child(n + 4) {
    display: none;
  }
  .feed-item {
    font-size: 12.5px;
  }
  .btn span {
    display: none;
  }
  .btn {
    padding: 0 10px;
  }
  .dock .btn.primary span {
    display: inline;
  }
  .sound-hint {
    bottom: calc(env(safe-area-inset-bottom, 0px) + 72px);
  }
  .sound-hint span {
    display: none;
  }
  .sound-hint {
    padding: 0 10px;
  }
  .end-title {
    font-size: 44px;
  }
  .end-grid {
    grid-template-columns: 1fr;

    };
    L.stairs.push(st);
    return st;
  }

  // x-range of the steps that need head clearance through the slab above.
  stairOpening(st, slabBottomGap) {
    // first step index whose standing head would hit the slab above
    const clearSteps = Math.floor(Math.max(0, slabBottomGap - 108) / st.stepH);
    const i0 = clamp(clearSteps, 1, st.n);
    const xa = st.xBottom + st.dir * (i0 - 0.6) * st.stepW;
    const xb = st.xTop;
    return [Math.min(xa, xb), Math.max(xa, xb)];
  }

  railing(x, floorY, h = 46) {
    const s = this.solid({ x: x - 4, y: floorY - h, w: 8, h, kind: 'railing', material: 'metal' });
    this.L.decor.push({ type: 'railingPost', x, y: floorY, h });
    return s;
  }

  // Horizontal slab between x0..x1 minus the given openings.
  slab(x0, x1, y, h, openings, kind = 'floor', material = 'concrete') {
    const ops = openings.slice().sort((a, b) => a[0] - b[0]);
    let cur = x0;
    const out = [];
    for (const [a, b] of ops) {
      if (b <= cur || a >= x1) continue;
      if (a > cur) out.push(this.solid({ x: cur, y, w: a - cur, h, kind, material }));
      cur = Math.max(cur, b);
    }
    if (cur < x1) out.push(this.solid({ x: cur, y, w: x1 - cur, h, kind, material }));
    return out;
  }

  // Vertical wall from yTop to yBot with gaps [[g0, g1], ...] (y ranges).
  wall(x0, w, yTop, yBot, gaps, kind = 'wall', material = 'concrete') {
    const gs = gaps.slice().sort((a, b) => a[0] - b[0]);
    let cur = yTop;
    for (const [a, b] of gs) {
      if (a > cur) this.solid({ x: x0, y: cur, w, h: a - cur, kind, material });
      cur = Math.max(cur, b);
    }
    if (cur < yBot) this.solid({ x: x0, y: cur, w, h: yBot - cur, kind, material });
  }

  glass(x, y, w, h, breakSpeed = 330, kind = 'glass') {
    const s = this.solid({ x, y, w, h, kind, material: 'glass', breakable: true, breakSpeed });
    this.L.windows.push(s);
    return s;
  }

  prop(kind, x, y, extra = {}) {
    this.L.propSpawns.push({ kind, x, y, ...extra });
  }

  hazard(h) {
    h.id = this.L.hazards.length;
    this.L.hazards.push(h);
    return h;
  }

  spawn(sp) {
    sp.id = this.L.spawnPoints.length;
    this.L.spawnPoints.push(sp);
    return sp;
  }

  decor(d) {
    this.L.decor.push(d);
    return d;
  }

  light(x, y, radius, intensity = 1, color = '255,244,214') {
    this.L.lights.push({ x, y, radius, intensity, color, flicker: this.rng.next() });
  }

  // Scatter dynamic props on the free parts of a floor span.
  scatterProps(fk, y, lo, hi, kinds, count) {
    for (let i = 0; i < count; i++) {
      const kind = this.rng.weighted(kinds);
      const w = kind === 'crateStack' ? 70 : 50;
      const x0 = this.findSpot(fk, w, lo, hi, 24, 30);
      if (x0 === null) continue;
      this.reserve(fk, x0, x0 + w, 'prop');
      const cx = x0 + w / 2;
      if (kind === 'crateStack') {
        const n = this.rng.int(1, 3);
        const size = this.rng.pick([46, 52, 58]);
        for (let j = 0; j < n; j++) {
          const sz = j === 0 ? size : size - 6 * j;
          this.prop('crate', cx + this.rng.range(-5, 5), y - size * j - sz / 2 - 1, { w: sz, h: sz });
        }
      } else if (kind === 'weapon') {
        this.prop(this.rng.pick(['pipe', 'bat', 'crowbar', 'plank']), cx, y - 6);
      } else {
        this.prop(kind, cx, y - 30);
      }
    }
  }
}

// ---------------------------------------------------------------------------
// Research facility: stacked floors, elevators, stairs, holes, windows.
// ---------------------------------------------------------------------------
function buildFacility(b) {
  const { L, rng } = b;
  const FH = 360;
  const SLAB = 74;
  const WALL = 44;
  const floors = rng.chance(0.55) ? 3 : 2;
  const W = snap(rng.range(2700, 3900), 20);
  const roofY = -floors * FH;
  L.width = W;
  L.outdoor = false;
  L.bounds = { left: -WALL - 420, right: W + WALL + 420, top: roofY - 30, bottom: 150 };
  L.killY = 1400;

  b.solid({ x: -900, y: 0, w: W + 1800, h: 700, kind: 'ground' });
  b.solid({ x: -980, y: -2400, w: 80, h: 2400, kind: 'bounds' });
  b.solid({ x: W + 900, y: -2400, w: 80, h: 2400, kind: 'bounds' });
  b.solid({ x: -WALL - 200, y: roofY, w: W + 2 * WALL + 400, h: SLAB, kind: 'ceiling' });
  b.decor({ type: 'roofline', x0: -WALL - 200, x1: W + WALL + 200, y: roofY });

  for (let k = 0; k < floors; k++) {
    L.floors.push({ index: k, y: -k * FH, ceil: -k * FH - FH + SLAB, x0: 0, x1: W });
  }

  // Elevator shafts: vertical, reserved on every floor.
  const elevX = [];
  const nElev = W > 3300 ? 2 : 1;
  for (let i = 0; i < nElev; i++) {
    const lo = nElev === 1 ? W * 0.35 : i === 0 ? W * 0.2 : W * 0.6;
    const hi = nElev === 1 ? W * 0.65 : i === 0 ? W * 0.4 : W * 0.8;
    const ex = snap(rng.range(lo, hi), 10);
    elevX.push(ex);
    for (let k = 0; k < floors; k++) b.reserve(k, ex - 120, ex + 120, 'elevator');
  }

  // Stairs between consecutive floors, with matching slab openings.
  const openings = new Map();
  for (let k = 1; k < floors; k++) openings.set(k, []);
  for (let k = 1; k < floors; k++) {
    const n = W > 3300 && rng.chance(0.5) ? 2 : 1;
    for (let i = 0; i < n; i++) {
      const run = Math.round(FH / 20) * 22;
      let placed = false;
      for (let t = 0; t < 140 && !placed; t++) {
        const dir = rng.sign();
        // relax the clearance margins if the first attempts fail (only needed for i === 0)
        const m = t < 60 ? 70 : i === 0 ? 22 : 70;
        const xb = snap(rng.range(160 + (dir < 0 ? run : 0), W - 160 - (dir > 0 ? run : 0)), 2);
        const x0 = Math.min(xb, xb + dir * run);
        const x1 = Math.max(xb, xb + dir * run);
        if (!b.isFree(k - 1, x0 - m, x1 + m)) continue;
        const fy = -(k - 1) * FH;
        // tentative opening check on the floor above
        const tmp = { xBottom: xb, xTop: xb + dir * run, dir, n: Math.round(FH / 20), stepH: FH / Math.round(FH / 20), stepW: 22 };
        const op = b.stairOpening(tmp, FH - SLAB);
        if (!b.isFree(k, op[0] - m + 10, op[1] + m - 10)) continue;
        const st = b.stairs(xb, fy, FH, dir, { style: 'concrete' });
        b.reserve(k - 1, x0, x1, 'stairs');
        b.reserve(k, op[0] - 20, op[1] + 20, 'opening');
        openings.get(k).push([op[0], op[1]]);
        st.opening = op;
        placed = true;
      }
    }
  }

  // Drop holes in upper slabs.
  for (let k = 1; k < floors; k++) {
    if (!rng.chance(0.6 * Math.min(1.5, b.hd))) continue;
    const w = snap(rng.range(100, 130), 2);
    for (let t = 0; t < 40; t++) {
      const x0 = b.findSpot(k, w, 220, W - 220, 90, 1);
      if (x0 === null) continue;
      if (!b.isFree(k - 1, x0 - 30, x0 + w + 30)) continue;
      b.reserve(k, x0, x0 + w, 'hole');
      b.reserve(k - 1, x0 - 10, x0 + w + 10, 'holeLanding');
      openings.get(k).push([x0, x0 + w]);
      L.ledges.push({ x0, x1: x0 + w, y: -k * FH, floor: k });
      b.decor({ type: 'holeEdge', x0, x1: x0 + w, y: -k * FH });
      break;
    }
  }

  // Upper slabs.
  for (let k = 1; k < floors; k++) b.slab(0, W, -k * FH, SLAB, openings.get(k), 'floor');

  // Outer walls: street doors on the ground floor, windows or plain wall above.
  for (const side of [-1, 1]) {
    const wx = side < 0 ? -WALL : W;
    const gaps = [];
    for (let k = 0; k < floors; k++) {
      const fy = -k * FH;
      if (k === 0) {
        gaps.push([fy - 150, fy]);
        b.decor({ type: 'streetDoor', x: side < 0 ? -WALL : W, w: WALL, y: fy, h: 150, side });
        b.spawn({ type: 'door', x: side < 0 ? -WALL - 150 : W + WALL + 150, y: fy, floor: 0, side, dir: -side });
      } else if (rng.chance(0.72)) {
        const gy0 = fy - 232;
        gaps.push([gy0, fy]);
        b.glass(wx + WALL * 0.3, gy0, WALL * 0.4, 232);
        b.decor({ type: 'window', x: wx, w: WALL, y: gy0, h: 232, floor: k, side });
      }
    }
    b.wall(wx, WALL, roofY, 0, gaps);
  }
  b.decor({ type: 'street', x0: -900, x1: -WALL, y: 0 });
  b.decor({ type: 'street', x0: W + WALL, x1: W + 900, y: 0 });

  // Partition walls with doorways and low ducts (choke points).
  for (let k = 0; k < floors; k++) {
    const fy = -k * FH;
    const ceil = fy - FH + SLAB;
    if (rng.chance(0.55)) {
      const x0 = b.findSpot(k, 26, 300, W - 300, 110);
      if (x0 !== null) {
        b.reserve(k, x0 - 10, x0 + 36, 'partition');
        b.solid({ x: x0, y: ceil, w: 26, h: fy - 134 - ceil, kind: 'lintel' });
        L.doorways.push({ x: x0 + 13, y: fy, top: fy - 134, floor: k });
        b.decor({ type: 'doorway', x: x0, w: 26, y: fy, top: fy - 134, ceil });
      }
    }
    if (rng.chance(0.4)) {
      const w = snap(rng.range(300, 520), 10);
      const x0 = b.findSpot(k, w, 120, W - 120, 30);
      if (x0 !== null) {
        b.reserve(k, x0, x0 + w, 'duct');
        const bottom = fy - 168;
        b.solid({ x: x0, y: ceil, w, h: bottom - ceil, kind: 'soffit', material: 'metal' });
        L.walls.push({ type: 'lowCeiling', x0, x1: x0 + w, y: fy, bottom, floor: k });
        b.decor({ type: 'soffit', x0, x1: x0 + w, y: ceil, bottom });
      }
    }
  }

  // Elevators and ceiling vents as spawn points.
  elevX.forEach((ex, shaft) => {
    for (let k = 0; k < floors; k++) {
      const fy = -k * FH;
      const d = b.decor({ type: 'elevator', x: ex, y: fy, w: 150, h: 176, floor: k, shaft, open: 0 });
      b.spawn({ type: 'elevator', x: ex, y: fy, floor: k, decor: d });
    }
  });
  for (let k = 0; k < floors; k++) {
    const fy = -k * FH;
    const ceil = fy - FH + SLAB;
    const x0 = b.findSpot(k, 80, 200, W - 200, 20);
    if (x0 === null) continue;
    const d = b.decor({ type: 'vent', x: x0 + 40, y: ceil, w: 70, open: 0 });
    b.spawn({ type: 'vent', x: x0 + 40, y: ceil + 6, floor: k, decor: d, landY: fy });
  }

  // Hazards.
  const nElec = Math.round(rng.range(1, 2.4) * b.hd);
  for (let i = 0; i < nElec; i++) {
    const k = rng.int(0, floors - 1);
    const x0 = b.findSpot(k, 100, 160, W - 160, 50);
    if (x0 === null) continue;
    b.reserve(k, x0, x0 + 100, 'electric');
    b.hazard({ type: 'electric', x: x0 + 50, y: -k * FH, w: 96, h: 128, floor: k, style: 'skull' });
  }
  if (rng.chance(0.55 * b.hd)) {
    const k = rng.int(0, floors - 1);
    const x0 = b.findSpot(k, 40, 200, W - 200, 60);
    if (x0 !== null) {
      const dir = x0 < W / 2 ? 1 : -1;
      b.hazard({ type: 'steam', x: x0 + 20, y: -k * FH - 62, dir, length: 170, floor: k, period: rng.range(6, 11), phase: rng.range(0, 6) });
    }
  }
  const nCan = Math.round(rng.range(0, 2.6) * b.hd);
  for (let i = 0; i < nCan; i++) {
    const k = rng.int(0, floors - 1);
    const x0 = b.findSpot(k, 40, 140, W - 140, 30);
    if (x0 === null) continue;
    b.reserve(k, x0, x0 + 40, 'canister');
    b.prop('canister', x0 + 20, -k * FH - 30);
  }

  // Props and weapons.
  for (let k = 0; k < floors; k++) {
    const fy = -k * FH;
    const n = Math.round(rng.range(1.5, 3.5) * b.pd);
    b.scatterProps(k, fy, 80, W - 80, [['crateStack', 4], ['barrel', 1.5], ['box', 2], ['weapon', 2]], n);
  }

  // Decoration.
  for (let k = 0; k < floors; k++) {
    const fy = -k * FH;
    const ceil = fy - FH + SLAB;
    const ops = k + 1 < floors ? openings.get(k + 1) : [];
    for (let x = 160 + rng.range(0, 120); x < W - 100; x += rng.range(380, 470)) {
      if (ops.some(([a, c]) => x > a - 40 && x < c + 40)) continue;
      b.decor({ type: 'lamp', x, y: ceil });
      b.light(x, ceil + 34, 330, 1);
    }
    // vending machines and wall furniture where free
    if (rng.chance(0.7)) {
      const x0 = b.findSpot(k, 110, 120, W - 120, 20);
      if (x0 !== null) {
        b.reserve(k, x0, x0 + 110, 'vending');
        b.decor({ type: 'vending', x: x0 + 8, y: fy, w: 96, h: 136, variant: rng.int(0, 2) });
      }
    }
    // pipe runs along the upper wall
    const nPipes = rng.int(1, 3);
    for (let p = 0; p < nPipes; p++) {
      const xa = rng.range(40, W - 300);
      const xb2 = xa + rng.range(200, 700);
      const py = ceil + rng.range(26, 70);
      const drop = rng.chance(0.6);
      const pts = [[xa, ceil], [xa, py], [Math.min(W - 30, xb2), py]];
      if (drop) pts.push([Math.min(W - 30, xb2), fy - rng.range(110, 170)]);
      b.decor({ type: 'pipe', pts, w: rng.pick([8, 10, 12]) });
    }
    // misc wall items
    const nItems = rng.int(2, 5);
    for (let i = 0; i < nItems; i++) {
      const x = rng.range(100, W - 100);
      const kind = rng.weighted([['poster', 3], ['panel', 2], ['clock', 1], ['extinguisher', 1.5], ['sign', 1.5]]);
      b.decor({ type: kind, x, y: fy - rng.range(120, 190), floor: k, hue: rng.int(0, 360), variant: rng.int(0, 3) });
    }
    // structural column with an alarm light
    if (rng.chance(0.6)) {
      const x0 = b.findSpot(k, 70, 200, W - 200, 10);
      if (x0 !== null) {
        b.decor({ type: 'column', x: x0 + 35, y: fy, top: ceil, w: 70 });
        b.decor({ type: 'alarm', x: x0 - 2, y: ceil + 60 });
      }
    }
  }
}

// ---------------------------------------------------------------------------
// Warehouse: one tall hall, catwalks, crate stacks, roll-up doors.
// ---------------------------------------------------------------------------
function buildWarehouse(b) {
  const { L, rng } = b;
  const H = 560;
  const WALL = 44;
  const W = snap(rng.range(3200, 4400), 20);
  const MEZZ = 270;
  L.width = W;
  L.outdoor = false;
  L.bounds = { left: -WALL - 420, right: W + WALL + 420, top: -H - 50, bottom: 150 };
  L.killY = 1400;
  b.solid({ x: -900, y: 0, w: W + 1800, h: 700, kind: 'ground' });
  b.solid({ x: -980, y: -2400, w: 80, h: 2400, kind: 'bounds' });
  b.solid({ x: W + 900, y: -2400, w: 80, h: 2400, kind: 'bounds' });
  b.solid({ x: -WALL - 200, y: -H - 44, w: W + 2 * WALL + 400, h: 44, kind: 'ceiling', material: 'metal' });
  L.floors.push({ index: 0, y: 0, ceil: -H, x0: 0, x1: W });
  L.floors.push({ index: 1, y: -MEZZ, ceil: -H, x0: 0, x1: W, partial: true });

  // Catwalks with stairs.
  const nCat = W > 3800 ? 3 : 2;
  const segW = (W - 240) / nCat;
  const catwalks = [];
  for (let i = 0; i < nCat; i++) {
    const lo = 120 + i * segW;
    const len = snap(rng.range(segW * 0.45, segW * 0.75), 10);
    const x0 = snap(lo + rng.range(0, segW - len), 10);
    const x1 = x0 + len;
    const touchesWall = (i === 0 && rng.chance(0.4)) || (i === nCat - 1 && rng.chance(0.4));
    const cx0 = touchesWall && i === 0 ? 0 : x0;
    const cx1 = touchesWall && i === nCat - 1 ? W : x1;
    b.solid({ x: cx0, y: -MEZZ, w: cx1 - cx0, h: 14, oneWay: true, kind: 'catwalk', material: 'metal' });
    b.decor({ type: 'catwalk', x0: cx0, x1: cx1, y: -MEZZ });
    b.reserve(1, cx0, cx1, 'catwalk');
    catwalks.push({ x0: cx0, x1: cx1 });
  }
  for (const c of catwalks) {
    const run = Math.round(MEZZ / 20) * 22;
    const options = [];
    if (c.x0 - run > 60 && b.isFree(0, c.x0 - run - 40, c.x0 + 10)) options.push(1);
    if (c.x1 + run < W - 60 && b.isFree(0, c.x1 - 10, c.x1 + run + 40)) options.push(-1);
    let stairDir = 0;
    if (options.length) {
      stairDir = rng.pick(options);
      const xb = stairDir > 0 ? c.x0 - run : c.x1 + run;
      b.stairs(xb, 0, MEZZ, stairDir, { style: 'steel', material: 'metal' });
      b.reserve(0, Math.min(xb, xb + stairDir * run) - 10, Math.max(xb, xb + stairDir * run) + 10, 'stairs');
    } else {
      // No room at either end: tuck the flight under the (one-way) catwalk.
      for (let t = 0; t < 12; t++) {
        const dir = rng.sign();
        const xb = dir > 0 ? rng.range(c.x0 + 20, c.x1 - run - 20) : rng.range(c.x0 + run + 20, c.x1 - 20);
        const x0 = Math.min(xb, xb + dir * run);
        if (!b.isFree(0, x0 - 20, x0 + run + 20)) continue;
        b.stairs(snap(xb, 2), 0, MEZZ, dir, { style: 'steel', material: 'metal' });
        b.reserve(0, x0 - 10, x0 + run + 10, 'stairs');
        break;
      }
    }
    // railing at ends not served by stairs and not against a wall
    if (stairDir !== 1 && c.x0 > 0) {
      if (rng.chance(0.7)) b.railing(c.x0 + 6, -MEZZ);
    }
    if (stairDir !== -1 && c.x1 < W) {
      if (rng.chance(0.7)) b.railing(c.x1 - 6, -MEZZ);
    }
    // catwalk-level doors in the outer walls
    if (c.x0 === 0) b.spawn({ type: 'door', x: 70, y: -MEZZ, floor: 1, side: -1, dir: 1, inside: true });
    if (c.x1 === W) b.spawn({ type: 'door', x: W - 70, y: -MEZZ, floor: 1, side: 1, dir: -1, inside: true });
    if (c.x0 === 0) b.decor({ type: 'officeDoor', x: 10, y: -MEZZ });
    if (c.x1 === W) b.decor({ type: 'officeDoor', x: W - 70, y: -MEZZ });
    // a few props on the catwalk
    if (rng.chance(0.6 * b.pd)) {
      const x = rng.range(c.x0 + 60, c.x1 - 60);
      b.prop(rng.chance(0.5) ? 'box' : rng.pick(['pipe', 'crowbar']), x, -MEZZ - 24);
    }
  }

  // Outer walls with roll-up doors.
  for (const side of [-1, 1]) {
    const wx = side < 0 ? -WALL : W;
    b.wall(wx, WALL, -H - 44, 0, [[-236, 0]]);
    b.decor({ type: 'rollupDoor', x: wx, w: WALL, y: 0, h: 236, side, open: 0.75 });
    b.spawn({ type: 'door', x: side < 0 ? -WALL - 150 : W + WALL + 150, y: 0, floor: 0, side, dir: -side });
  }
  b.decor({ type: 'street', x0: -900, x1: -WALL, y: 0 });
  b.decor({ type: 'street', x0: W + WALL, x1: W + 900, y: 0 });

  // Hazards.
  const nElec = Math.round(rng.range(1, 2.2) * b.hd);
  for (let i = 0; i < nElec; i++) {
    const x0 = b.findSpot(0, 100, 200, W - 200, 50);
    if (x0 === null) continue;
    b.reserve(0, x0, x0 + 100, 'electric');
    b.hazard({ type: 'electric', x: x0 + 50, y: 0, w: 96, h: 128, floor: 0, style: 'panel' });
  }
  const nCan = Math.round(rng.range(1, 3.4) * b.hd);
  for (let i = 0; i < nCan; i++) {
    const x0 = b.findSpot(0, 40, 140, W - 140, 30);
    if (x0 === null) continue;
    b.reserve(0, x0, x0 + 40, 'canister');
    b.prop('canister', x0 + 20, -30);
  }

  // Lots of crates, pallets and loose weapons.
  b.scatterProps(0, 0, 100, W - 100, [['crateStack', 6], ['barrel', 2], ['box', 2], ['weapon', 2]], Math.round(rng.range(5, 9) * b.pd));

  // Decoration: racks, forklift, lamps, trusses.
  for (let x = 120; x < W - 200; x += rng.range(260, 520)) {
    if (rng.chance(0.55)) b.decor({ type: 'rack', x, y: 0, w: rng.pick([160, 200, 240]), h: rng.pick([300, 380, 440]), seed: rng.int(0, 1e6) });
  }
  if (rng.chance(0.7)) b.decor({ type: 'forklift', x: rng.range(300, W - 300), y: 0, dir: rng.sign() });
  for (let x = 200 + rng.range(0, 150); x < W - 100; x += rng.range(420, 520)) {
    b.decor({ type: 'hangLamp', x, y: -H, len: rng.range(90, 150) });
    b.light(x, -H + 150, 420, 1.1, '255,220,170');
  }
  b.decor({ type: 'trusses', x0: -WALL, x1: W + WALL, y: -H });
  for (let i = 0; i < 3; i++) {

    if (this.dead || this.frozen) return false;
    if (this.state === 'ground' && this.grounded) return true;
    if (this.state === 'block') return true;
    if (this.state === 'move' && this.move && this.mt >= this.move.cancel && this.grounded) return true;
    return false;
  }

  // ---------------------------------------------------------------- actions
  startMove(id, target) {
    const m = MOVES[id];
    if (!m) return false;
    if (m.weapon && !this.weapon) return false;
    if (this.state === 'move' && this.move && this.move.type === 'throw') return false;
    this.move = m;
    this.mt = 0;
    this.moveStartT = this.sim.time;
    this.moveFacing = this.facing;
    this.moveRate = this.computeMoveRate(m);
    this.moveFired = 0;
    this.moveHit = false;
    this.hitSet.clear();
    this.moveTarget = target || this.intent.target || null;
    this.trail.length = 0;
    this.setState('move');
    const cost = m.stamina || 0;
    this.stamina -= cost;
    if (this.stamina < -20) this.stamina = -20;
    this.fatigue = Math.min(1, this.fatigue + cost * (this.isHero ? 0.00042 : 0.0006));
    if (m.type === 'strike' || m.type === 'grab') {
      if (this.sim.rng.chance(this.isHero ? 0.12 : 0.22)) this.emit({ t: 'vocal', kind: 'attack', x: this.x, y: this.y - 70, f: this });
    }
    if (m.hits.length && m.hits[0].kind !== 'body') this.emit({ t: 'whoosh', x: this.x, y: this.y - 50, power: m.power, delay: m.windup / this.moveRate, f: this });
    return true;
  }

  endMove() {
    const m = this.move;
    this.move = null;
    this.victim = null;
    if (this.state === 'move') this.setState(this.grounded ? 'ground' : 'air');
    // re-plant feet where the animation left them
    this.replantFeet();
    if (m && m.overcommit && !this.moveHit && this.sim.rng.chance(0.55 - this.skill * 0.4)) {
      this.stumble(this.facing, 0.45);
    }
  }

  jump(vx, vy) {
    this.vy = -(vy || this.jumpSpeed);
    if (vx !== undefined) this.vx = vx;
    this.grounded = false;
    this.jumped = true;
    this.fallStartY = this.y;
    if (this.state !== 'move') this.setState('air');
    this.emit({ t: 'step', x: this.x, y: this.y, power: 0.6, f: this });
  }

  turn(f) {
    if (f === 0 || f === this.facing) return;
    this.facing = f;
    // Swap feet so the stance mirrors in place instead of crossing over.
    const a = this.feet[0];
    this.feet[0] = this.feet[1];
    this.feet[1] = a;
  }

  // ---------------------------------------------------------------- damage
  // Small reactions keep the fighter on its feet; muscles slacken briefly.
  hitstun(dur, kvx, kvy, low, react, heavy) {
    if (this.dead) return;
    if (this.state === 'move' && this.move) {
      if (this.move.type === 'throw' && this.victim) this.releaseVictim(false);
      this.move = null;
    }
    this.setState('hitstun');
    this.stun = Math.max(this.stun, dur);
    this.vx = kvx;
    if (kvy < -200 && this.grounded) {
      this.vy = kvy * 0.4;
      this.grounded = false;
      this.jumped = true;
    }
    this.muscle = Math.min(this.muscle, 0.35);
    this.muscleRate = 3.2;
    this.flinch = 1;
    this.flinchLow = !!low;
    this.flinchType = react || (low ? 'gut' : 'head');
    // big shots hold the reaction pose longer
    this.flinchRate = clamp(1.5 / Math.max(0.2, dur), 2.2, 6);
    if (heavy && !this.isHero) {
      // reeling: arms windmilling, stumbling back
      this.staggered = true;
      this.stun = Math.max(this.stun, dur * 1.35);
    }
    this.replantFeet();
  }

  // Killed on his feet by a blow that did not launch him: he folds.
  dieOnFeet(kind) {
    if (this.ragdolled || this.state === 'grabbed' || this.state === 'held' || !this.grounded) return false;
    if (this.holdTarget) this.releaseHold();
    if (this.state === 'move' && this.move && this.move.type === 'throw' && this.victim) this.releaseVictim(false);
    this.snap = copyPose(new Float64Array(NP), this.pose);
    this.vx *= 0.3;
    this.staggered = false;
    this.flinch = 0;
    this.move = null;
    this.dropWeapon(this.facing * 40, -120);
    return this.startMove(kind);
  }

  stumble(dir, dur) {
    if (this.dead || this.ragdolled) return;
    this.setState('hitstun');
    this.stun = dur;
    this.vx = dir * 180;
    this.flinch = 0.6;
    this.flinchLow = false;
    this.muscle = Math.min(this.muscle, 0.5);
    this.muscleRate = 2.5;
    this.staggered = true;
  }

  // Full ragdoll. Velocity is added on top of the current motion.
  knockdown(vx, vy, opts = {}) {
    const h = this.sim.h;
    if (this.state === 'move' && this.move && this.move.type === 'throw' && this.victim) this.releaseVictim(false);
    if (this.holdTarget) this.releaseHold();
    if (this.grabbedBy) {
      const g = this.grabbedBy;
      this.grabbedBy = null;
      if (g.holdTarget === this) g.holdTarget = null;
      if (g.victim === this) g.victim = null;
    }
    this.move = null;
    this.rag.f = this.facing;
    this.setState('ragdoll');
    this.muscle = 0;
    this.restT = 0;
    this.rag.sleeping = false;
    this.rag.sleepT = 0;
    this.rag.maxImpact = 0;
    this.rag.addVel(vx, vy, h);
    if (opts.spin) this.rag.addSpin(opts.spin, h);
    if (opts.joint !== undefined) this.rag.addVelAt(opts.joint, opts.jx || 0, opts.jy || 0, h);
    this.grounded = false;
    this.dropWeapon(vx * 0.4, vy * 0.4 - 120);
    this.knockT = this.sim.time;
  }

  damage(amount, by, cause) {
    if (this.dead) return 0;
    if (this.sim.godHero && this.isHero) amount = 0;
    this.hp -= amount;
    this.lastDamageTime = this.sim.time;
    this.injury += amount * 0.45;
    this.stats.taken += amount;
    if (by) {
      this.lastHitBy = by;
      this.lastHitTime = this.sim.time;
    }
    if (this.hp <= 0) {
      this.hp = 0;
      this.dead = true;
      this.koCause = cause || 'beaten';
      this.koBy = by || null;
      this.koTime = this.sim.time;
      if (!this.ragdolled && !this.pendingDeath) this.knockdown(0, 0);
      this.sim.onKO(this, by, cause);
    }
    return amount;
  }

  electrocute(dur, dmg) {
    if (this.zapT > 0) return;
    if (!this.ragdolled) this.knockdown(0, -60);
    this.setState('zap');
    this.zapT = dur;
    this.zapDmg = dmg / dur;
    this.flash = 1;
  }

  dropWeapon(vx, vy) {
    if (!this.weapon) return;
    const w = this.weapon;
    this.weapon = null;
    this.sim.props.dropWeapon(w, this, vx, vy);
  }

  // ------------------------------------------------------------ grabs/throws
  attachVictim(v, moveId) {
    this.victim = v;
    v.grabbedBy = this;
    v.move = null;
    v.rag.f = v.facing;
    v.setState('grabbed');
    v.muscle = 0;
    v.dropWeapon(0, -50);
    this.startMove(moveId, v);
    this.victim = v;
    this.emit({ t: 'grab', x: v.x, y: v.y - 50, a: this, b: v });
  }

  releaseVictim(thrown) {
    const v = this.victim;
    this.victim = null;
    if (!v) return;
    v.grabbedBy = null;
    if (v.state === 'grabbed') {
      v.setState('ragdoll');
      v.restT = 0;
      v.muscle = 0;
    }
    if (thrown) v.thrownBy = this;
  }

  // Grappler holding a victim in place (enemy bear hug on the hero).
  beginHold(v) {
    this.holdTarget = v;
    this.holdT = 0;
    v.grabbedBy = this;
    v.move = null;
    v.setState('held');
    v.holdStruggle = 0;
    v.dropWeapon(0, -60);
    this.setState('holding');
    this.emit({ t: 'grab', x: v.x, y: v.y - 50, a: this, b: v, hold: true });
  }

  releaseHold() {
    const v = this.holdTarget;
    this.holdTarget = null;
    if (this.state === 'holding') this.setState('ground');
    if (v && v.grabbedBy === this) {
      v.grabbedBy = null;
      if (v.state === 'held') v.setState('ground');
    }
  }

  // ----------------------------------------------------------------- update
  updateLogic(dt) {
    if (this.removed || this.baked) return;
    if (this.dead && this.state === 'ko' && this.rag.sleeping) return; // a body at rest
    if (this.freeze > 0) {
      this.freeze--;
      this.frozen = true;
      return;
    }
    this.frozen = false;
    this.stateT += dt;
    this.jumped = false;
    this.wasGrounded = this.grounded;
    if (this.dropT > 0) this.dropT -= dt;
    if (this.passT > 0) this.passT -= dt;
    if (this.invuln > 0) this.invuln -= dt;
    if (this.flash > 0) this.flash = Math.max(0, this.flash - dt * 6);
    if (this.flinch > 0) this.flinch = Math.max(0, this.flinch - dt * this.flinchRate);

    this.updateVitals(dt);

    switch (this.state) {
      case 'ground':
        this.stateGround(dt);
        break;
      case 'air':
        this.stateAir(dt);
        break;
      case 'move':
        this.stateMove(dt);
        break;
      case 'block':
        this.stateBlock(dt);
        break;
      case 'hitstun':
        this.stateHitstun(dt);
        break;
      case 'ragdoll':
      case 'down':
      case 'ko':
      case 'zap':
        this.stateRagdoll(dt);
        break;
      case 'grabbed':
        this.stateGrabbed(dt);
        break;
      case 'held':
        this.stateHeld(dt);
        break;
      case 'holding':
        this.stateHolding(dt);
        break;
      case 'spawn':
        this.stateSpawn(dt);
        break;
    }

    if (!this.ragdolled && this.state !== 'grabbed') this.moveController(dt);
    if (this.muscle < 1 && !this.ragdolled && this.state !== 'grabbed') {
      this.muscle = Math.min(1, this.muscle + this.muscleRate * dt);
    }
  }

  updateVitals(dt) {
    if (this.dead) return;
    const ms = this.maxStamina();
    const exert = this.state === 'move' || this.state === 'block' || this.state === 'hitstun';
    // a trained fighter breathes through the exchanges
    const regen = (exert ? (this.isHero ? 10 : 6) : this.stance === 'tired' ? 34 : this.isHero ? 26 : 22) * (1 - this.fatigue * 0.55);
    this.stamina = Math.min(ms, this.stamina + regen * dt);
    if (this.isHero) {
      // fatigue creeps up while fighting; very slowly eases when calm
      const engaged = this.brain && this.brain.engaged > 0;
      const k = this.sim.settings.heroEndurance;
      if (engaged) this.fatigue = Math.min(1, this.fatigue + dt * 0.0011 / k);
      else this.fatigue = Math.max(0, this.fatigue - dt * 0.0016 * k);
      // light recovery when untouched for a while; injuries cap it
      if (this.sim.time - this.lastDamageTime > 6 && !engaged) {
        const cap = this.maxHp - this.injury;
        if (this.hp < cap) this.hp = Math.min(cap, this.hp + dt * 2.2);
      }
    }
    if (this.sim.time - this.lastHitTime > 0.7) this.poise = Math.min(this.maxPoise, this.poise + dt * this.maxPoise * 0.7);
  }

  // Locomotion & action dispatch.
  stateGround(dt) {
    if (!this.grounded) {
      this.setState('air');
      this.fallStartY = this.y;
      return;
    }
    const it = this.intent;
    if (it.face) this.turn(it.face);
    if (it.drop) {
      it.drop = false;
      if (this.groundSolid && this.groundSolid.oneWay) {
        this.dropT = 0.3;
        this.grounded = false;
        this.setState('air');
        return;
      }
    }
    if (it.jump) {
      it.jump = false;
      this.startMove('jumpsquat');
      this.pendingJump = { vx: it.mx * (it.run ? this.runSpeed : this.walkSpeed) * 1.05, vy: it.jumpVy || this.jumpSpeed };
      return;
    }
    if (it.action) {
      const a = it.action;
      it.action = null;
      if (this.startMove(a, it.target)) return;
    }
    if (it.block) {
      this.setState('block');
      return;
    }
    const speed = it.run ? this.runSpeed : this.walkSpeed;
    let target = it.mx * speed * this.speedFactor();
    const accel = (it.mx !== 0 ? 1900 : 1500) * this.agility * this.sim.level.friction;
    this.vx = approach(this.vx, target, accel * dt);
  }

  speedFactor() {
    let k = 1 - this.fatigue * 0.28;
    if (this.hp < this.maxHp * 0.3) k *= 0.9;
    return k;
  }

  stateAir(dt) {
    if (this.grounded) {
      this.onLand();
      return;
    }
    this.airTime += dt;
    const it = this.intent;
    const target = it.mx * this.runSpeed * 0.9;
    this.vx = approach(this.vx, target, 520 * dt);
    if (it.action && MOVES[it.action] && MOVES[it.action].air && this.airTime < 0.25) {
      const a = it.action;
      it.action = null;
      this.startMove(a, it.target);
    }
  }

  onLand() {
    const v = this.landSpeed;
    const fall = this.y - this.fallStartY;
    this.airTime = 0;
    this.replantFeet();
    // he drops off catwalks on purpose and lands like a cat; others fold up
    const hard = this.isHero && this.state !== 'hitstun' ? 1600 : 1250;
    const hurt = this.isHero && this.state !== 'hitstun' ? 1150 : 760;
    if (v > hard || (v > 1000 && this.state === 'hitstun')) {
      // hard landing: crumple
      const dmg = (v - 900) * 0.045;
      this.knockdown(this.vx * 0.5, 0, { spin: 0 });
      this.damage(dmg, this.knock ? this.knock.by : null, 'fall');
      this.emit({ t: 'thud', x: this.x, y: this.y, power: 1.2 });
      return;
    }
    if (v > hurt - 60) {
      const dmg = Math.max(0, (v - hurt) * 0.02);
      if (dmg > 0) this.damage(dmg, null, 'fall');
    }
    this.squashV += v * 0.09;
    if (this.state === 'air') this.setState('ground');
    this.emit({ t: 'land', x: this.x, y: this.y, power: Math.min(1.5, v / 700), f: this });
    void fall;
  }

  stateBlock(dt) {
    const it = this.intent;
    if (this.blockStun > 0) this.blockStun -= dt;
    if (!this.grounded) {
      this.setState('air');
      return;
    }
    if (it.face && this.blockStun <= 0) this.turn(it.face);
    this.vx = approach(this.vx, it.mx * this.walkSpeed * 0.45, 1400 * dt);
    if (!it.block && this.blockStun <= 0) {
      this.setState('ground');
      if (it.action) {
        const a = it.action;
        it.action = null;
        this.startMove(a, it.target);
      }
    }
  }

  stateHitstun(dt) {
    this.stun -= dt;
    const fr = (this.grounded ? 1100 : 200) * this.sim.level.friction;
    this.vx = approach(this.vx, 0, fr * dt);
    if (this.stun <= 0) {
      this.staggered = false;
      this.setState(this.grounded ? 'ground' : 'air');
    }
  }

  stateMove(dt) {
    const m = this.move;
    if (!m) {
      this.setState('ground');
      return;
    }
    const prev = this.mt;
    let rate = this.moveRate;
    // sloppy fighters telegraph: slower wind-up
    if (!this.isHero && this.mt < m.windup) rate *= 0.62 + this.skill * 0.38;
    this.mt += dt * rate;
    const t = this.mt;

    // facing flips authored into the move
    for (let i = 0; i < m.flips.length; i++) {
      const ft = m.flips[i];
      if (prev < ft && t >= ft) this.facing = -this.facing;
    }
    // root motion (with a matching step so the feet keep up with lunges)
    let driven = false;
    for (let i = 0; i < m.motion.length; i++) {
      const [t0, t1, v] = m.motion[i];
      if (!m.steps && prev < t0 && t >= t0 && this.grounded && !m.legs.A.length && Math.abs(v) * (t1 - t0) > 6) {
        const dist = Math.abs(v) * (t1 - t0) * 1.1 + 6 * this.dims.s;
        if (v > 0) this.forceStep(0, dist, (t1 - t0) / this.moveRate);
        else this.forceStep(1, -dist, (t1 - t0) / this.moveRate);
      }
      if (t >= t0 && t < t1) {
        const gf = this.grounded ? 1 : 0.4;
        this.vx = lerp(this.vx, this.moveFacing * v * (0.85 + 0.15 * this.moveRate), gf);
        driven = true;
      }
    }
    if (!driven && this.grounded && !m.keepVel) this.vx = approach(this.vx, 0, 1300 * this.sim.level.friction * dt);
    // planned steps
    if (m.steps) {
      for (const st of m.steps) {
        if (prev < st.t && t >= st.t) this.forceStep(st.foot, st.dx * this.dims.s, st.dur);
      }
    }
    // jump impulse
    if (m.air && prev < m.air.t && t >= m.air.t) {
      this.jump(this.moveFacing * m.air.vx * (0.85 + 0.15 * this.agility), m.air.vy);
    }
    if (m.id === 'jumpsquat' && t >= m.dur && this.pendingJump) {
      const pj = this.pendingJump;
      this.pendingJump = null;
      this.move = null;
      this.jump(pj.vx, pj.vy);
      this.setState('air');
      return;
    }
    // events
    if (m.event && prev < m.event[0] && t >= m.event[0]) this.sim.moveEvent(this, m.event[1]);
    if (m.iframes) this.iframe = t >= m.iframes[0] && t < m.iframes[1];
    else this.iframe = false;
    if (m.pass && t >= m.pass[0] && t < m.pass[1]) this.passT = 0.05;
    // throws: victim follows the path, then flies
    if (m.type === 'throw' && this.victim) this.updateThrow(prev, t);
    // grab attempts are resolved by the combat system (needs other fighters)
    if (m.endOnLand !== undefined && t > m.endOnLand && this.grounded && !this.jumped) {
      this.endMove();
      this.onLandFromMove();
      return;
    }
    if (m.type === 'death' && (t >= m.dur || !this.grounded)) {
      const fl = m.fall;
      this.move = null;
      this.pendingDeath = false;
      this.knockdown(this.facing * fl[0], fl[1], { spin: this.facing * fl[2] });
      return;
    }
    if (t >= m.dur) {
      if (m.air && !this.grounded) {
        // keep falling in the last pose until landing
        this.mt = m.dur;
        if (this.stateT > 2.5) this.endMove();
        return;
      }
      this.endMove();
    }
  }

  onLandFromMove() {
    this.squashV += Math.min(this.landSpeed, 900) * 0.07;
    this.emit({ t: 'land', x: this.x, y: this.y, power: Math.min(1.5, this.landSpeed / 700), f: this });
  }

  updateThrow(prev, t) {
    const m = this.move;
    const v = this.victim;
    if (!v || v.removed) {
      this.victim = null;
      return;
    }
    const s = this.dims.s;
    const path = m.victim;
    // sample path
    let a = path[0];
    let b = path[0];
    let u = 0;
    for (let i = 1; i < path.length; i++) {
      if (t <= path[i][0]) {
        a = path[i - 1];
        b = path[i];
        u = Ease.inOutQuad((t - a[0]) / (b[0] - a[0]));
        break;
      }
      a = b = path[i];
      u = 0;
    }
    const f = this.moveFacing;
    const px = this.rag.p[PELVIS].x;
    const py = this.rag.p[PELVIS].y;
    v.pinNeck = [px + f * lerp(a[1], b[1], u) * s, py + lerp(a[2], b[2], u) * s];
    v.pinPelvis = [px + f * lerp(a[3], b[3], u) * s, py + lerp(a[4], b[4], u) * s];
    // blows landed while holding him (knees in the clinch)
    if (m.strikes) {
      for (const [st, dmg] of m.strikes) {
        if (prev < st && t >= st) {
          const hp = v.rag.p[HEAD];
          const d = dmg * this.strength * this.sim.rng.range(0.9, 1.1);
          v.damage(d, this, 'beaten');
          v.flash = 1;
          v.rag.addVelAt(HEAD, f * 120, -260, this.sim.h, 0.5);
          this.moveHit = true;
          this.stats.hits++;
          this.freeze = v.freeze = 3;
          if (this.isHero) this.sim.hitstop(2);
          this.emit({ t: 'hit', kind: 'kick', x: hp.x, y: hp.y, power: d / 9, down: false, a: this, b: v, part: 'head', move: m.id });
        }
      }
    }
    if (prev < m.release[0] && t >= m.release[0]) {
      const h = this.sim.h;
      const rv = this.sim.settings.physicsIntensity;
      v.pinNeck = v.pinPelvis = null;
      this.releaseVictim(true);
      const k = (0.8 + this.strength * 0.2) * rv;
      v.rag.addVel(f * m.release[1] * k, m.release[2] * k, h);
      v.rag.addSpin(f * (m.dir > 0 ? 7 : -7), h);
      v.knock = { by: this, chainId: this.sim.newChain(this), depth: 0, time: this.sim.time, kind: 'throw' };
      v.damage(m.throwDmg * this.strength * (this.isHero ? 1 : 0.8), this, 'throw');
      this.moveHit = true;
      this.stats.hits++;
      this.emit({ t: 'throw', x: v.pelvisX, y: v.pelvisY, a: this, b: v, move: m.id });
    }
  }

  stateRagdoll(dt) {
    const h = this.sim.h;
    const p = this.rag.p[PELVIS];
    // controller follows the body
    this.x = p.x;
    this.y = this.rag.lowestY();
    this.vx = (p.x - p.px) / h;
    this.vy = (p.y - p.py) / h;
    if (this.state === 'zap') {
      this.zapT -= dt;
      this.damage(this.zapDmg * dt, this.knock ? this.knock.by : null, 'electric');
      this.flash = Math.max(this.flash, 0.6);
      if (this.zapT <= 0) this.setState(this.dead ? 'ko' : 'ragdoll');
      return;
    }
    const sp = this.rag.maxSpeed(h);
    const core = this.rag.coreSpeed(h);
    // resting on the floor or on top of other bodies both count
    const resting = core < 75;
    if (resting) this.restT += dt;
    else this.restT = Math.max(0, this.restT - dt * 2);
    if (this.state === 'ragdoll') {
      if (this.dead) {
        if (this.restT > 0.3) this.setState('ko');
        return;
      }
      if ((this.restT > 0.15 && this.stateT > 0.3) || (this.stateT > 1.8 && core < 260)) {
        this.setState('down');
        const base = this.isHero ? 0.2 + this.fatigue * 0.8 : 0.3 + Math.max(0, 1 - this.toughness) * 0.4;
        this.downT = base + this.sim.rng.range(0, this.isHero ? 0.3 : 0.6) + (1 - this.hp / this.maxHp) * (this.isHero ? 0.5 : 0.9);
      }
    } else if (this.state === 'down') {
      if (this.dead) {
        this.setState('ko');
        return;
      }
      if (!resting && sp > 320) {
        this.setState('ragdoll');
        return;
      }
      this.downT -= dt;
      // the hero scrambles up fast when someone is standing over him
      if (this.isHero && this.brain && this.brain.threatClose) this.downT = Math.min(this.downT, 0.2 + this.fatigue * 0.4);
      if (this.downT <= 0) this.beginGetup();
    }
  }

  beginGetup(forceId) {
    const L = this.sim.level;
    const s = this.dims.s;
    const pts = this.rag.p;
    const pel = pts[PELVIS];
    const neck = pts[NECK];
    // which way is the body lying? torso normal in its own frame
    const tx = neck.x - pel.x;
    const ty = neck.y - pel.y;
    const f0 = this.rag.f;
    // front normal = torso rotated 90° towards facing
    const nx = -ty * f0;
    const ny = tx * f0;
    const supine = ny < 0;
    // face towards the feet when sitting up, towards the head when pushing up
    const feetX = (pts[FOOT_A].x + pts[FOOT_B].x) * 0.5;
    let f = supine ? Math.sign(feetX - pel.x) || f0 : Math.sign(neck.x - pel.x) || f0;
    const g = L.groundUnder(pel.x - 4, pel.x + 4, this.y - 30 * s, 90 * s, true, false);
    const gy = g ? g.y : this.y;
    this.x = pel.x;
    this.y = gy;
    this.vx = 0;
    this.vy = 0;
    this.grounded = true;
    this.groundSolid = g;
    this.facing = f;
    // snapshot joints into a pose (start key of the get-up)
    const j = fkOut;
    for (let i = 0; i < NJ; i++) {
      j[i * 2] = pts[i].x;
      j[i * 2 + 1] = pts[i].y;
    }
    this.snap = poseFromJoints(j, f, this.x, gy, this.dims, new Float64Array(NP));
    copyPose(this.pose, this.snap);
    let id = supine ? 'getupBack' : 'getupFront';
    if (this.isHero && supine && this.stamina > 25 && this.sim.rng.chance(0.75 - this.fatigue * 0.7)) id = 'kipup';
    if (forceId) id = forceId;
    this.startMove(id);
    this.muscle = 0.15;
    this.muscleRate = 5;
    // a trained fighter protects himself while rising
    if (this.isHero) this.invuln = 0.45 + this.skill * 0.2 - this.fatigue * 0.3;
    this.emit({ t: 'getup', f: this });
  }

  stateGrabbed() {
    // pinned by the thrower; physics happens in the ragdoll step
    const p = this.rag.p[PELVIS];
    this.x = p.x;
    this.y = this.rag.lowestY();
    if (!this.grabbedBy) {
      this.setState('ragdoll');
      this.restT = 0;
    }
  }

  stateHeld(dt) {
    const g = this.grabbedBy;
    if (!g || g.state !== 'holding' || g.dead) {
      this.grabbedBy = null;
      this.setState('ground');
      return;
    }
    this.vx = 0;
    const s = this.dims.s;
    // locked in front of the grappler, facing the same way (held from behind)
    const tx = g.x + g.facing * 16 * s;
    this.x = lerp(this.x, tx, 0.5);
    this.holdStruggle += dt * (0.6 + this.strength * 0.4) * (this.stamina > 10 ? 1 : 0.5);
  }

  stateHolding(dt) {
    this.holdT += dt;
    const v = this.holdTarget;
    if (!v || v.state !== 'held' || v.grabbedBy !== this) {
      this.releaseHold();
      return;
    }
    this.vx = 0;
  }

  stateSpawn(dt) {
    const sp = this.spawning;
    if (!sp) {
      this.setState('ground');
      return;
    }
    sp.t -= dt;
    if (sp.walk) {
      this.vx = approach(this.vx, sp.dir * this.walkSpeed * 1.1, 900 * dt);
      this.facing = sp.dir;
    }
    if (sp.t <= 0) {
      this.spawning = null;
      this.setState(this.grounded ? 'ground' : 'air');
    }
  }

  // ------------------------------------------------------------- controller
  moveController(dt) {
    const L = this.sim.level;
    const s = this.dims.s;
    const hw = this.w * 0.5;
    const crouch = this.pose[PY] < 30;
    const h = crouch ? this.hStand * 0.6 : this.hStand;
    if (!this.grounded) {
      this.vy += this.sim.gravity * dt;
      if (this.vy > 1900) this.vy = 1900;
      if (L.wind && this.sim.windNow) this.vx += this.sim.windNow * dt * 0.35;
    }
    // heavy boxes in the way slow the walker down
    if (this.boxPush > 0) {
      if (Math.sign(this.vx) === this.boxPushDir) {
        const cap = 150 / Math.sqrt(this.boxPush);
        if (Math.abs(this.vx) > cap) this.vx = this.boxPushDir * cap;
      }
      this.boxPush = 0;
    }
    // ---- horizontal
    let nx = this.x + this.vx * dt;
    this.blockedX = 0;
    let list = L.queryRect(nx - hw - 1, this.y - h, nx + hw + 1, this.y - 2, tmpList);
    for (let i = 0; i < list.length; i++) {
      const sd = list[i];
      if (sd.oneWay) continue;
      if (sd.y + sd.h <= this.y - h + 1 || sd.y >= this.y - 1.5) continue;
      if (nx + hw <= sd.x || nx - hw >= sd.x + sd.w) continue;
      const impact = Math.abs(this.vx);
      if (sd.breakable && impact > sd.breakSpeed * 0.75) {
        this.sim.breakSolid(sd, nx, this.y - 50, impact);
        continue;
      }
      if (this.x <= sd.x + sd.w * 0.5) nx = Math.min(nx, sd.x - hw);
      else nx = Math.max(nx, sd.x + sd.w + hw);
      this.blockedX = sd.x + sd.w * 0.5 > this.x ? 1 : -1;
      this.blockedSolid = sd;
      if (impact > 430 && this.state === 'hitstun') {
        // slammed into a wall
        this.wallSlam(impact);
        return;
      }
      this.vx = 0;
    }
    this.x = nx;
    // ---- vertical
    const prevY = this.y;
    let ny = this.y + this.vy * dt;
    const wasG = this.grounded;
    this.grounded = false;
    let landed = null;
    list = L.queryRect(this.x - hw + 1, Math.min(prevY, ny) - h, this.x + hw - 1, Math.max(prevY, ny) + 1, tmpList);
    for (let i = 0; i < list.length; i++) {
      const sd = list[i];
      if (this.x + hw - 1 <= sd.x || this.x - hw + 1 >= sd.x + sd.w) continue;
      if (sd.oneWay) {
        if (this.vy < 0) continue;
        if (this.dropT > 0) continue;
        if (prevY <= sd.y + 0.5 && ny >= sd.y && (!landed || sd.y < landed.y)) landed = sd;
      } else if (this.vy >= 0 && prevY <= sd.y + 0.5 && ny >= sd.y) {
        if (!landed || sd.y < landed.y) landed = sd;
      } else if (this.vy < 0 && prevY - h >= sd.y + sd.h - 0.5 && ny - h < sd.y + sd.h) {
        ny = sd.y + sd.h + h;
        this.vy = 0;
      }
    }
    if (landed) {
      ny = landed.y;
      this.landSpeed = this.vy;
      this.vy = 0;
      this.grounded = true;
      this.groundSolid = landed;
    }
    this.y = ny;
    // ---- stairs: step up while climbing
    if (this.grounded && this.intent.climb && Math.abs(this.vx) > 4) {
      const lst = L.queryRect(this.x - hw, this.y - 26 * s, this.x + hw, this.y - 1, tmpList);
      let up = null;
      for (let i = 0; i < lst.length; i++) {
        const sd = lst[i];
        if (!sd.step) continue;
        if (sd.y >= this.y - 1 || sd.y < this.y - 25 * s) continue;
        if (this.x + hw * 0.7 < sd.x || this.x - hw * 0.7 > sd.x + sd.w) continue;
        if (!up || sd.y < up.y) up = sd;
      }
      if (up) {
        this.y = up.y;
        this.groundSolid = up;
      }
    }
    // ---- snap down onto ground when walking off small steps / down stairs
    if (!this.grounded && wasG && this.vy >= 0 && !this.jumped) {
      const g = L.groundUnder(this.x - hw + 2, this.x + hw - 2, this.y, 24 * s, this.dropT <= 0, false);
      if (g) {
        this.y = g.y;
        this.vy = 0;
        this.grounded = true;
        this.groundSolid = g;
      }
    }
    if (this.grounded) {
      const S = this.sim.nav.surfaceOf(this.groundSolid, this.x);
      this.surface = S ? S.id : -1;
      if (this.surface >= 0) this.lastSurface = this.surface;
    } else {
      this.surface = -1;
      if (wasG) this.fallStartY = this.y;
    }
    if (this.y > L.killY) this.sim.outOfBounds(this);
  }

  wallSlam(impact) {
    const dir = this.vx > 0 ? 1 : -1;
    this.vx = -dir * 80;
    this.knockdown(-dir * 120, -120);
    this.damage(impact * 0.018, this.knock ? this.knock.by : this.lastHitBy, 'wall');
    this.emit({ t: 'thud', x: this.x + dir * 12, y: this.y - 50, power: impact / 500, wall: true });
  }

  // --------------------------------------------------------------- feet
  groundAtFoot(x) {
    const s = this.dims.s;
    const onStairs = this.groundSolid && this.groundSolid.step;
    const g = this.sim.level.groundUnder(x - 2, x + 2, this.y - 24 * s, 64 * s, true, !onStairs && !this.intent.climb);
    return g ? g.y : this.y;
  }

  replantFeet() {
    for (let i = 0; i < 2; i++) {
      const ft = this.feet[i];
      const j = i === 0 ? FOOT_A : FOOT_B;
      ft.x = this.jt[j * 2] || this.x;
      ft.y = this.grounded ? this.groundAtFoot(ft.x) : this.jt[j * 2 + 1];
      ft.planted = true;
      ft.t = 1;
    }
  }

  forceStep(i, dx, dur) {
    const ft = this.feet[i];
    ft.planted = false;
    ft.t = 0;
    ft.dur = dur || 0.12;
    ft.sx = ft.x;
    ft.sy = ft.y;
    ft.tx = ft.x + this.facing * dx;
    ft.ty = this.groundAtFoot(ft.tx);
    ft.lift = 6 * this.dims.s;
  }

  updateFeet(dt) {
    const s = this.dims.s;
    const f = this.facing;
    const feet = this.feet;
    const speed = Math.abs(this.vx);
    const relaxed = this.stance === 'relaxed';
    const look = this.vx * 0.1;
    const homes = [this.x + f * (relaxed ? 8 : 14) * s + look, this.x - f * (relaxed ? 8 : 16) * s + look];
    const running = speed > 210;
    const stepDur = clamp(0.25 - speed * 0.00032, 0.112, 0.25) / (0.85 + 0.15 * this.agility);
    const thresh = speed > 40 ? clamp(speed * 0.085, 12 * s, 40 * s) : 11 * s;
    let swing = 0;
    for (let i = 0; i < 2; i++) {
      const ft = feet[i];
      if (ft.planted) continue;
      if (this.legW[i] > 0.5) continue; // FK-driven leg
      ft.t += dt / ft.dur;
      if (ft.t >= 1) {
        ft.planted = true;
        ft.t = 1;
        ft.x = ft.tx;
        ft.y = ft.ty;
        if (speed > 60 || this.state === 'hitstun') this.emit({ t: 'step', x: ft.x, y: ft.y, power: Math.min(1, speed / 380), f: this });
      } else {
        const e = Ease.inOutSine(ft.t);
        ft.x = lerp(ft.sx, ft.tx, e);
        ft.y = lerp(ft.sy, ft.ty, ft.t) - ft.lift * Math.sin(Math.PI * Math.min(1, ft.t * 1.15));
        swing = Math.max(swing, Math.sin(Math.PI * ft.t));
      }
    }
    this.swingT = swing;
    // pick the most displaced planted foot whose partner supports the body
    let pick = -1;
    let best = 0;
    for (let i = 0; i < 2; i++) {
      const ft = feet[i];
      if (!ft.planted || this.legW[i] > 0.01) continue;
      const other = feet[1 - i];
      const otherOK = other.planted || this.legW[1 - i] > 0.5 || (running && other.t > 0.5);
      if (!otherOK) continue;
      const err = Math.abs(ft.x - homes[i]);
      if (err > thresh && err > best) {
        best = err;
        pick = i;
      }
    }
    if (pick >= 0) {
      const ft = feet[pick];
      const maxStep = (running ? 80 : 48) * s;
      const tx = clamp(homes[pick] + this.vx * stepDur * 0.55, ft.x - maxStep, ft.x + maxStep);
      ft.planted = false;
      ft.t = 0;
      ft.dur = stepDur;
      ft.sx = ft.x;
      ft.sy = ft.y;
      ft.tx = tx;
      ft.ty = this.groundAtFoot(tx);
      ft.lift = (running ? 20 : speed > 60 ? 11 : 6) * s;
    }
    // planted feet follow vanishing ground (e.g. a broken skylight)
    for (let i = 0; i < 2; i++) {
      const ft = feet[i];
      if (ft.planted && Math.abs(ft.y - this.y) > 40 * s) ft.y = this.groundAtFoot(ft.x);
    }
  }

  // ------------------------------------------------------------- animation
  updateBody(dt) {
    if (this.removed || this.frozen) return;
    if (this.ragdolled || this.state === 'grabbed') return;
    this.computeTarget(dt);
    // smooth pose towards target
    const rate = this.poseRate;
    const k = 1 - Math.exp(-rate * dt);
    const p = this.pose;
    const tg = this.target;
    for (let i = 0; i < ANGLE_CHANNELS; i++) p[i] = wrapAngle(p[i] + wrapAngle(tg[i] - p[i]) * k);
    p[PX] += (tg[PX] - p[PX]) * k;
    p[PY] += (tg[PY] - p[PY]) * k;
    // landing squash spring
    this.squashV += (-this.squash * 220 - this.squashV * 18) * dt;
    this.squash += this.squashV * dt;
    this.computeJoints(dt);
    // trail of the striking limb during hit windows
    this.recordTrail();
  }

  computeTarget(dt) {
    const tg = this.target;
    const s = this.dims.s;
    this.breath += dt * (1.6 + this.fatigue * 2.2 + (this.stance === 'tired' ? 1.4 : 0));
    const st = this.state;
    if (st === 'move' && this.move) {
      this.sampleMove(this.move, this.mt, tg);
      this.poseRate = this.move.type === 'getup' ? 22 : 34;
      if (this.weapon && !this.move.weapon && this.move.type === 'strike') {
        // keep the weapon arm sensible during unarmed strikes
      }
      this.legsFromMove(dt);
      return;
    }
    this.legW[0] = this.legW[1] = 0;
    if (st === 'air') {
      const up = this.vy < 0;
      copyPose(tg, up ? AIR_UP : AIR_DOWN);
      if (this.hitAir) tg[TORSO] -= 0.3;
      this.poseRate = 10;
      this.legW[0] = this.legW[1] = 1;
      return;
    }
    if (st === 'block') {
      copyPose(tg, BLOCK);
      if (this.blockStun > 0) {
        tg[TORSO] -= 0.25;
        tg[HEADA] += 0.2;
      }
      this.poseRate = 30;
      return;
    }
    if (st === 'held') {
      copyPose(tg, HELD);
      const w = Math.sin(this.stateT * 22) * 0.18;
      tg[TORSO] += w;
      tg[SA] += w * 2;
      tg[SB] -= w * 2;
      this.poseRate = 20;
      return;
    }
    if (st === 'holding') {
      copyPose(tg, HOLDING);
      this.poseRate = 18;
      return;
    }
    // locomotion / idle / hitstun
    let base;
    if (this.staggered) base = STAGGER;
    else if (this.weapon) base = WEAPON_GUARD;
    else if (this.stance === 'tired') base = TIRED;
    else if (this.stance === 'relaxed') base = RELAXED;
    else if (this.stance === 'taunt') base = TAUNT;
    else base = GUARD;
    copyPose(tg, base);
    const speed = Math.abs(this.vx);
    const runK = st === 'hitstun' ? 0 : smoothstep(160, 330, speed);
    if (runK > 0) {
      // arm pumping in sync with the feet
      const fa = this.feet[0];
      const fb = this.feet[1];
      const sw = clamp(((fb.x - fa.x) * this.facing) / (40 * s), -1.2, 1.2);
      const armA = 28 + 52 * sw;
      const armB = 28 - 52 * sw;
      lerpPose(scratchPose, tg, RUN, runK);
      copyPose(tg, scratchPose);
      if (!this.weapon) {
        tg[SA] = lerp(tg[SA], (armA * Math.PI) / 180, runK);
        tg[SB] = lerp(tg[SB], (armB * Math.PI) / 180, runK);
        tg[EA] = lerp(tg[EA], 1.6 - 0.25 * sw, runK);
        tg[EB] = lerp(tg[EB], 1.6 + 0.25 * sw, runK);
      }
    }
    // lean into motion (forward when running towards facing)
    const rel = (this.vx * this.facing) / 400;
    tg[TORSO] += clamp(rel, -0.6, 1) * (0.12 + 0.12 * runK);
    // breathing and fatigue
    const br = Math.sin(this.breath);
    tg[TORSO] += br * (0.015 + this.fatigue * 0.03);
    tg[SA] += br * 0.03;
    tg[SB] -= br * 0.025;
    tg[PY] += br * (0.35 + this.fatigue * 0.6);
    if (this.fatigue > 0.2 && base === GUARD) {
      const fk2 = (this.fatigue - 0.2) * 1.25;
      tg[TORSO] += fk2 * 0.16;
      tg[HEADA] += fk2 * 0.1;
      tg[SA] -= fk2 * 0.3;
      tg[EA] -= fk2 * 0.35;
      tg[SB] -= fk2 * 0.22;
      tg[EB] -= fk2 * 0.3;
      tg[PY] -= fk2 * 2;
    }
    // head tracks the look target
    if (this.lookTarget && !this.lookTarget.removed) {
      const dy = this.lookTarget.headY - this.headY;
      const dx = Math.abs(this.lookTarget.headX - this.headX) + 40;
      tg[HEADA] += clamp(Math.atan2(dy, dx), -0.5, 0.5) * 0.7;
    }
    // hit flinch (additive, by where and how he was hit)
    if (this.flinch > 0) {
      const fl = FLINCH[this.flinchType] || (this.flinchLow ? FLINCH_LOW : FLINCH_HIGH);
      const k = Ease.outQuad(this.flinch);
      for (let i = 0; i < NP; i++) tg[i] += fl[i] * k;
    }
    if (this.staggered && st === 'hitstun') {
      // reeling: arms windmill for balance, knees soft
      const w = this.stateT * 15;
      tg[SA] += Math.sin(w) * 1.1;
      tg[SB] += Math.sin(w + 2.4) * 1.1;
      tg[EA] -= 0.6;
      tg[EB] -= 0.6;
      tg[HEADA] += Math.sin(w * 0.7) * 0.25;
      tg[PY] -= 3;
    } else if (st === 'ground' && speed < 50 && (base === GUARD || base === WEAPON_GUARD) && (this.isHero || this.style === 'boxer' || this.style === 'kicker')) {
      // fighters bounce on the balls of their feet
      this.bob += dt * (this.isHero ? 7.5 : 6.5);
      const b = Math.sin(this.bob);
      tg[PY] += b * 1.3 - 0.6;
      tg[SA] += Math.sin(this.bob + 0.6) * 0.06;
      tg[SB] += Math.sin(this.bob + 1.4) * 0.05;
      tg[TORSO] += Math.cos(this.bob) * 0.02;
    }
    // squat before a jump / after landing
    this.poseRate = st === 'hitstun' ? 26 : this.stance === 'tired' ? 7 : 15;
  }

  sampleMove(m, t, out) {
    const keys = m.keys;
    const n = keys.length;
    const first = (m.type === 'getup' || m.fromCurrent) && this.snap ? this.snap : keys[0].pose;
    if (t <= keys[0].t) return copyPose(out, first);
    for (let i = 1; i < n; i++) {
      const k = keys[i];
      if (t <= k.t) {
        const k0 = keys[i - 1];
        const u = (t - k0.t) / Math.max(1e-6, k.t - k0.t);
        const e = Ease[k.ease](u);
        const p0 = i === 1 ? first : k0.pose;
        for (let c = 0; c < NP; c++) out[c] = p0[c] + (k.pose[c] - p0[c]) * e;
        return out;
      }
    }
    return copyPose(out, keys[n - 1].pose);
  }

  // Leg FK weights for the current move (with short blends at the edges).
  legsFromMove() {
    const m = this.move;
    const t = this.mt;
    for (let leg = 0; leg < 2; leg++) {
      const ivs = leg === 0 ? m.legs.A : m.legs.B;
      let w = 0;
      for (let i = 0; i < ivs.length; i++) {
        const [t0, t1] = ivs[i];
        if (t >= t0 && t <= t1) {
          w = Math.max(w, Math.min(1, (t - t0) / 0.045, (t1 - t) / 0.045));
          if (t0 <= 0.001) w = Math.max(w, Math.min(1, (t1 - t) / 0.045));
        }
      }
      if (!this.grounded) w = 1;
      const prevW = this.legW[leg];
      this.legW[leg] = w;
      if (prevW > 0.5 && w <= 0.5 && this.grounded) {
        // the leg comes back down: plant it where it is
        const ft = this.feet[leg];
        const j = leg === 0 ? FOOT_A : FOOT_B;
        ft.x = this.jt[j * 2];
        ft.y = this.groundAtFoot(ft.x);
        ft.planted = true;
        ft.t = 1;
      }
    }
  }

  computeJoints(dt) {
    const s = this.dims.s;
    const d = this.dims;
    const f = this.facing;
    const pose = this.pose;
    const grounded = this.grounded && this.state !== 'air';
    if (grounded && dt > 0) this.updateFeet(dt);
    const px = this.x + f * pose[PX] * s;
    let py = this.y - pose[PY] * s + this.squash;
    if (grounded) {
      py -= this.swingT * (Math.abs(this.vx) > 210 ? 3.5 : 1.0) * s;
      // hips must reach the planted feet: drop a little, then let a trailing
