<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07040a">
<title>SPLEEN: SEPSIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0&icon_names=ac_unit,account_tree,air,all_inclusive,arrow_back,auto_awesome,auto_fix_high,autorenew,back_hand,balance,bloodtype,blur_circular,blur_on,bolt,brightness_5,call_split,campaign,casino,change_history,chevron_left,chevron_right,close,content_cut,control_point_duplicate,coronavirus,dangerous,diamond,east,emergency,favorite,flare,flash_on,gesture,healing,heart_broken,help,home,hub,keyboard,lens,local_fire_department,lock,lock_open,menu_book,my_location,play_arrow,psychology,radio_button_checked,refresh,restart_alt,rocket_launch,scatter_plot,science,sell,sensors,settings,shield,skull,sports_esports,stacked_line_chart,stars,support,sync_alt,target,trending_up,trip_origin,water_drop,waves,whatshot,zoom_out_map&display=block" rel="stylesheet">
<style>
:root{
  --bg:#07040a; --panel:rgba(16,9,20,.86); --panel2:rgba(26,14,32,.92); --line:rgba(255,235,245,.12); --line2:rgba(255,235,245,.22);
  --text:#f4ebf1; --dim:#a596a6; --accent:#7ff3ff; --hot:#ff4d8a; --gold:#ffd36b; --mal:#c06bff; --green:#7dffb0; --blue:#9ad8ff; --iron:#ff8a3a; --danger:#ff3b4f;
  --display:'Unbounded','Arial Black',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#07040a; } }
:root[data-theme="dark"]{ --bg:#07040a; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--mono);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
canvas#overlay{position:fixed;inset:0;pointer-events:none;z-index:4}
.ms{font-family:'Material Symbols Rounded';font-weight:500;font-style:normal;font-size:1.15em;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;vertical-align:-.18em}
body.no-icons .ms{font-size:0!important;width:.8em;height:.8em;border-radius:50%;background:currentColor;opacity:.8;vertical-align:-.05em}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:40}
#hurt{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;background:radial-gradient(ellipse at center,rgba(255,0,40,0) 45%,rgba(255,0,40,.55) 100%)}
#lowhp{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;box-shadow:inset 0 0 180px 50px rgba(200,0,30,.55)}
#lowhp.on{animation:lowpulse 1.1s ease-in-out infinite}
@keyframes lowpulse{0%,100%{opacity:.25}50%{opacity:.85}}
body.letterbox::before,body.letterbox::after{content:"";position:fixed;left:0;right:0;height:9vh;background:#000;z-index:20;animation:lb 2.3s ease forwards}
body.letterbox::before{top:0}body.letterbox::after{bottom:0}
@keyframes lb{0%{transform:scaleY(0)}12%,85%{transform:scaleY(1)}100%{transform:scaleY(0)}}

/* ---------- loading ---------- */
#loading{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;transition:opacity .6s}
#loading.gone{opacity:0;pointer-events:none}
#loading .cell{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 40% 40%,rgba(127,243,255,.5),rgba(127,243,255,.08) 60%,transparent 70%);box-shadow:0 0 30px rgba(127,243,255,.4),inset 0 0 18px rgba(127,243,255,.6);animation:breathe 1.2s ease-in-out infinite}
#loading .txt{font-family:var(--display);letter-spacing:.3em;font-size:12px;color:var(--dim)}
#loading .fatal{max-width:520px;text-align:center;line-height:1.6;color:var(--text)}
@keyframes breathe{0%,100%{transform:scale(.9)}50%{transform:scale(1.06)}}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;opacity:0;transition:opacity .4s}
#hud.on{opacity:1}
.hud-tl{position:absolute;top:max(14px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:8px}
#hp{display:flex;flex-wrap:wrap;gap:5px;max-width:300px}
.pip{width:22px;height:22px;border-radius:50%;display:block;position:relative;transition:transform .2s}
.pip.full{background:radial-gradient(circle at 38% 35%,rgba(255,255,255,.65),var(--c) 45%,color-mix(in srgb,var(--c) 40%,#000) 100%);box-shadow:0 0 10px color-mix(in srgb,var(--c) 70%,transparent),inset 0 0 0 1.5px rgba(255,255,255,.35)}
.pip.full::after{content:"";position:absolute;left:30%;top:32%;width:36%;height:36%;border-radius:50%;background:rgba(80,20,120,.55)}
.pip.empty{border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35)}
.pip.shield{background:radial-gradient(circle at 38% 35%,#fff,#9ad8ff 50%,#3a7aaa);box-shadow:0 0 12px rgba(154,216,255,.8);border-radius:45% 55% 50% 50%}
#hp.low .pip.full{animation:pippulse .55s ease-in-out infinite}
@keyframes pippulse{50%{transform:scale(1.18)}}
.hud-row{display:flex;align-items:center;gap:14px}
#ironbox{display:flex;align-items:center;gap:6px;font-weight:800;font-size:17px;color:#ffd3b0;text-shadow:0 2px 6px #000}
#ironbox .ms{color:var(--iron);filter:drop-shadow(0 0 6px rgba(255,138,58,.7))}
#ironbox.bump b{animation:bump .3s}
@keyframes bump{40%{transform:scale(1.35)}}
#abil{position:relative;width:54px;height:54px;border-radius:50%;--f:0deg;background:conic-gradient(rgba(127,243,255,.85) var(--f),rgba(255,255,255,.08) var(--f));padding:3px;transition:box-shadow .2s}
#abil-in{width:100%;height:100%;border-radius:50%;background:#0d0712;display:flex;align-items:center;justify-content:center;font-size:24px;color:#cfefff}
#abil.ready{box-shadow:0 0 18px rgba(127,243,255,.7)}
#abil.ready #abil-in{color:#fff;background:radial-gradient(circle,#173a44,#0d0712)}
#abil-key{position:absolute;right:-6px;bottom:-4px;font-size:10px;font-weight:800;background:#000;border:1px solid var(--line2);border-radius:4px;padding:1px 4px}
#abil-name{font-family:var(--display);font-size:10px;letter-spacing:.15em;color:var(--dim)}
#dash{width:54px;height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden;--d:1}
#dash::after{content:"";display:block;height:100%;width:calc(var(--d)*100%);background:#fff;opacity:.7}
#charge{position:absolute;left:50%;top:58%;transform:translateX(-50%);width:80px;height:5px;border-radius:3px;background:rgba(255,255,255,.12);opacity:0;transition:opacity .1s;--c:0}
#charge::after{content:"";display:block;height:100%;width:calc(var(--c)*100%);background:#b8ffd8;border-radius:3px;box-shadow:0 0 8px #9dff7a}
#charge.on{opacity:1}#charge.full::after{background:#fff;box-shadow:0 0 14px #fff}
#region{position:absolute;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);text-align:center;text-shadow:0 2px 8px #000}
#region b{display:block;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.22em}
#region span{font-size:10px;letter-spacing:.2em;color:var(--dim)}
#mmwrap{position:absolute;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));padding:6px;background:rgba(8,4,10,.55);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(4px)}
#minimap{width:150px;height:110px;display:block}
#mutlist{position:absolute;left:max(16px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));display:flex;flex-wrap:wrap-reverse;gap:5px;max-width:min(46vw,420px);pointer-events:auto}
.mchip{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--r);background:rgba(10,6,14,.75);border:1px solid color-mix(in srgb,var(--r) 55%,transparent);box-shadow:0 0 8px color-mix(in srgb,var(--r) 30%,transparent);position:relative}
.mchip i{position:absolute;right:-3px;bottom:-3px;font-style:normal;font-size:9px;font-weight:800;background:#000;color:#fff;border-radius:4px;padding:0 3px}
#tip{position:fixed;z-index:30;transform:translateY(-100%);max-width:260px;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;font-size:11px;line-height:1.45;opacity:0;pointer-events:none;transition:opacity .12s}
#tip.on{opacity:1}#tip b{font-family:var(--display);font-size:11px;letter-spacing:.08em}#tip p{color:#ddd;margin-top:3px}
#bossbar{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);width:min(620px,70vw);opacity:0;transition:all .4s}
#bossbar.on{opacity:1;transform:translateX(-50%)}
#boss-name{text-align:center;font-family:var(--display);font-weight:900;font-size:15px;letter-spacing:.3em;margin-bottom:6px;text-shadow:0 0 14px rgba(255,60,90,.6),0 2px 4px #000}
.btrack{position:relative;height:12px;border-radius:6px;background:rgba(0,0,0,.6);border:1px solid rgba(255,80,110,.35);overflow:hidden}
#boss-lag{position:absolute;inset:0 auto 0 0;background:rgba(255,230,230,.55)}
#boss-fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#7a0a24,#ff3b4f 70%,#ff8aa0);box-shadow:0 0 12px rgba(255,59,79,.8)}
#boss-marks i{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.6)}
#toasts{position:absolute;top:84px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:min(560px,90vw)}
.toast{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 16px;text-align:center;animation:tin .35s cubic-bezier(.2,1.4,.4,1);transition:opacity .4s,transform .4s;backdrop-filter:blur(4px)}
.toast b{display:block;font-family:var(--display);font-size:13px;letter-spacing:.14em}
.toast span{display:block;font-size:11px;color:#ddd;margin-top:2px}
.toast.syn{border-color:rgba(255,211,107,.6);box-shadow:0 0 22px rgba(255,211,107,.3)}
.toast.unlock{border-color:rgba(127,243,255,.6);box-shadow:0 0 22px rgba(127,243,255,.35)}
.toast.clear,.toast.small{padding:4px 14px;background:rgba(10,6,14,.6)}.toast.clear b{font-size:11px;letter-spacing:.4em;color:var(--dim)}
.toast.out{opacity:0;transform:translateY(-8px)}
@keyframes tin{from{opacity:0;transform:scale(.8) translateY(10px)}}
.banner{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:22;opacity:0;text-align:center}
.banner.on{animation:banner 3.2s ease forwards}
.banner.on.boss{animation:banner 2.4s ease forwards}
.b-num{font-size:12px;letter-spacing:.5em;color:var(--dim);text-shadow:0 2px 6px #000}
.b-name{font-family:var(--display);font-weight:900;font-size:clamp(34px,7vw,84px);letter-spacing:.08em;text-shadow:0 0 30px rgba(255,77,138,.55),0 4px 0 rgba(0,0,0,.6);line-height:1.05;margin:6px 0}
.b-name.boss{color:#fff;text-shadow:0 0 30px rgba(255,40,70,.9),0 0 80px rgba(255,40,70,.5)}
.b-sub{font-size:13px;letter-spacing:.3em;color:#ddd;text-transform:uppercase;text-shadow:0 2px 6px #000}
@keyframes banner{0%{opacity:0;transform:scale(1.08);filter:blur(6px)}12%{opacity:1;transform:none;filter:none}78%{opacity:1}100%{opacity:0;transform:scale(.98)}}
#prompt{position:absolute;bottom:22%;left:50%;transform:translateX(-50%) translateY(8px);opacity:0;transition:all .15s;font-size:13px;background:var(--panel);border:1px solid var(--line2);border-radius:20px;padding:6px 14px}
#prompt.on{opacity:1;transform:translateX(-50%)}
#prompt b{background:#fff;color:#000;border-radius:5px;padding:1px 6px;margin-right:6px;font-weight:800}

/* ---------- touch ---------- */
#touch{position:fixed;inset:0;z-index:11;pointer-events:none;display:none}
#touch.on{display:block}
.stick{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04);display:none}
.stick div{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(127,243,255,.3);border:2px solid rgba(127,243,255,.6)}
#stick-r div{background:rgba(255,77,138,.3);border-color:rgba(255,77,138,.6)}
.tbtn{position:fixed;pointer-events:auto;width:64px;height:64px;border-radius:50%;background:rgba(16,9,20,.55);border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;backdrop-filter:blur(3px)}
.tbtn.down{background:rgba(127,243,255,.35)}
.tbtn[data-t=dash]{right:calc(20px + env(safe-area-inset-right));top:44%}
.tbtn[data-t=ability]{right:calc(96px + env(safe-area-inset-right));top:30%}
.tbtn[data-t=interact]{right:calc(20px + env(safe-area-inset-right));top:24%;opacity:0;transform:scale(.6);transition:all .15s}
.tbtn[data-t=interact].avail{opacity:1;transform:none;border-color:var(--gold);color:var(--gold)}
.tbtn[data-t=pause]{width:42px;height:42px;font-size:20px;top:calc(12px + env(safe-area-inset-top));right:calc(186px + env(safe-area-inset-right))}
body.touch #mutlist{pointer-events:none}

/* ---------- screens & modals ---------- */
.screen,.modal{position:fixed;inset:0;z-index:30;display:none;overflow-y:auto;overflow-x:hidden}
.screen.on,.modal.on{display:flex}
.screen{flex-direction:column;padding:max(28px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}
.screen:not(.s-title){background:linear-gradient(90deg,rgba(7,4,10,.94),rgba(7,4,10,.82));backdrop-filter:blur(3px);align-items:center}
.modal{background:rgba(5,2,8,.66);backdrop-filter:blur(5px);align-items:center;justify-content:center;padding:20px}
.mbox{width:min(1040px,100%);display:flex;flex-direction:column;align-items:center;animation:pop .3s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
.hdr{text-align:center;margin-bottom:22px;max-width:720px}
.hdr h2{font-family:var(--display);font-weight:900;font-size:clamp(24px,4vw,40px);letter-spacing:.06em;text-shadow:0 0 24px rgba(255,77,138,.4)}
.hdr p{color:var(--dim);font-size:13px;margin-top:8px;line-height:1.6}
.hdr.big h1{font-family:var(--display);font-weight:900;font-size:clamp(28px,6vw,64px);letter-spacing:.06em;line-height:1.05}
.hdr.won h1{color:#fff;text-shadow:0 0 30px rgba(127,243,255,.8)}
.hdr.lost h1{color:#ffd0da;text-shadow:0 0 30px rgba(255,59,79,.7)}
.mem{color:var(--gold)}.gold{color:var(--gold)}.mal{color:var(--mal)}.iron{color:#ffb070}.green{color:var(--green)}.blue{color:var(--blue)}.dim{color:var(--dim)}
.foot{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.btn{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--text);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:12px 20px;cursor:pointer;display:inline-flex;align-items:center;gap:10px;transition:all .14s;position:relative}
.btn .ms{font-size:20px;color:var(--accent)}
.btn:hover,.btn.focus{background:rgba(127,243,255,.1);border-color:rgba(127,243,255,.55);transform:translateX(3px);box-shadow:0 0 22px rgba(127,243,255,.18)}
.btn.big{font-size:18px;padding:16px 26px;background:linear-gradient(90deg,rgba(255,77,138,.25),rgba(127,243,255,.12));border-color:rgba(255,77,138,.5)}
.btn.ghost{background:transparent}
.btn.danger{border-color:rgba(255,59,79,.4)}.btn.danger .ms{color:var(--danger)}.btn.danger.focus,.btn.danger:hover{background:rgba(255,59,79,.15);border-color:var(--danger)}
.chip{font-family:var(--mono);font-size:12px;font-weight:600;padding:8px 14px;border-radius:20px;text-transform:none;letter-spacing:.02em}
.chip.sel{background:rgba(127,243,255,.18);border-color:var(--accent)}
.chip.danger{border-color:rgba(255,59,79,.5)}
.chip.arrow{padding:8px 10px}
.chip:hover,.chip.focus{transform:none}

/* title */
.s-title{background:linear-gradient(90deg,rgba(7,4,10,.92) 0%,rgba(7,4,10,.7) 38%,rgba(7,4,10,0) 70%);justify-content:center}
.title-wrap{display:flex;flex-direction:column;gap:30px;max-width:680px;margin-left:clamp(0px,4vw,60px)}
.logo-main{font-family:var(--display);font-weight:900;font-size:clamp(52px,9vw,112px);line-height:.9;letter-spacing:.02em;white-space:nowrap;background:linear-gradient(180deg,#fff 0%,#ffd0e0 40%,#ff4d8a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 24px rgba(255,77,138,.55)) drop-shadow(0 6px 0 rgba(60,0,20,.8));animation:beat 1.6s ease-in-out infinite;transform-origin:left center}
@keyframes beat{0%,100%{transform:scale(1)}8%{transform:scale(1.025)}16%{transform:scale(1)}24%{transform:scale(1.015)}}
.logo-sub{font-family:var(--display);font-weight:700;font-size:clamp(20px,3.6vw,38px);letter-spacing:.32em;color:var(--accent);text-shadow:0 0 18px rgba(127,243,255,.7);margin-top:4px}
.logo-tag{font-size:12px;letter-spacing:.35em;color:var(--dim);margin-top:10px;text-transform:uppercase}
.menu{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.title-foot{display:flex;flex-wrap:wrap;gap:16px;font-size:11px;color:var(--dim);letter-spacing:.06em}
.title-foot .ms{color:var(--gold)}.title-foot .ver{opacity:.6}

/* cards */
.cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;width:100%}
.card{cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;transition:all .16s;position:relative}
.card:hover,.card.focus{transform:translateY(-4px);border-color:var(--line2);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.strain{width:230px;display:flex;flex-direction:column;gap:8px}
.strain:hover,.strain.focus{border-color:var(--c);box-shadow:0 0 28px color-mix(in srgb,var(--c) 30%,transparent),0 10px 30px rgba(0,0,0,.5)}
.strain.locked{opacity:.5;filter:grayscale(.7)}
.cell-ico{width:72px;height:72px;border-radius:50%;margin:4px auto 6px;position:relative;background:radial-gradient(circle at 40% 38%,rgba(255,255,255,.4),color-mix(in srgb,var(--c) 55%,transparent) 50%,color-mix(in srgb,var(--c) 15%,transparent) 72%);box-shadow:0 0 26px color-mix(in srgb,var(--c) 45%,transparent),inset 0 0 0 2px color-mix(in srgb,var(--c) 70%,transparent);animation:breathe 2.4s ease-in-out infinite}
.cell-ico .nuc{position:absolute;left:30%;top:30%;width:40%;height:40%;border-radius:45%;background:var(--n);opacity:.85;box-shadow:0 0 12px var(--n)}
.sname{font-family:var(--display);font-weight:900;font-size:18px;letter-spacing:.08em;text-align:center;color:var(--c)}
.stitle{font-size:11px;letter-spacing:.2em;text-transform:uppercase;text-align:center;color:var(--dim)}
.sdesc{font-size:12px;line-height:1.5;color:#ddd;min-height:54px}
.sbar{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.15em;color:var(--dim)}
.sbar i{display:flex;gap:3px}.sbar b,.sbar em{width:16px;height:6px;border-radius:3px;background:var(--c)}.sbar em{background:rgba(255,255,255,.1)}
.sabil{margin-top:6px;padding:10px;border-radius:12px;background:rgba(255,255,255,.04);font-size:11px;line-height:1.45;color:#ccc}
.sabil b{display:block;font-family:var(--display);font-size:11px;letter-spacing:.1em;color:#fff;margin-bottom:4px}
.lockmsg{margin-top:10px;font-size:12px;line-height:1.5;text-align:center;color:#ddd;display:flex;flex-direction:column;align-items:center;gap:8px}.lockmsg .ms{font-size:28px}
.fever{display:flex;align-items:center;gap:14px;margin-top:22px}
.fever-lbl{display:flex;flex-direction:column;align-items:center;min-width:280px;text-align:center;gap:3px;font-size:12px}
.fever-lbl b{font-family:var(--display);letter-spacing:.2em;color:var(--hot)}
.perks .perk{width:220px;display:flex;flex-direction:column;gap:8px}
.pico{font-size:30px;color:var(--gold)}.pname{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.06em}

<script>/* src/util.js */
/* ==========================================================================
   SPLEEN: SEPSIS — util.js
   Math, seeded RNG, small helpers shared by every other script.
   All game scripts are classic scripts sharing the global scope.
   ========================================================================== */
"use strict";

const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const invLerp = (a, b, v) => (v - a) / (b - a);
const smooth = (t) => t * t * (3 - 2 * t);
const easeOut = (t) => 1 - (1 - t) * (1 - t);
const easeIn = (t) => t * t;
const easeOutBack = (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const dist = (ax, ay, bx, by) => Math.sqrt(dist2(ax, ay, bx, by));
const angleTo = (ax, ay, bx, by) => Math.atan2(by - ay, bx - ax);
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const approach = (v, target, step) => (v < target ? Math.min(v + step, target) : Math.max(v - step, target));
/** frame-rate independent exponential smoothing factor */
const damp = (rate, dt) => 1 - Math.exp(-rate * dt);

/* ---------- Seeded RNG (mulberry32) ---------- */
function makeRng(seed) {
  let s = seed >>> 0;
  const next = () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const r = {
    next,
    range: (a, b) => a + next() * (b - a),
    int: (a, b) => a + Math.floor(next() * (b - a + 1)),
    chance: (p) => next() < p,
    pick: (arr) => arr[Math.floor(next() * arr.length)],
    shuffle: (arr) => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(next() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; },
    weighted: (items, wfn) => {
      let tot = 0; for (const it of items) tot += Math.max(0, wfn(it));
      if (tot <= 0) return items[0];
      let x = next() * tot;
      for (const it of items) { x -= Math.max(0, wfn(it)); if (x <= 0) return it; }
      return items[items.length - 1];
    },
    get state() { return s; },
  };
  return r;
}
function hashStr(str) { let h = 2166136261 >>> 0; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

/* Unseeded randomness for cosmetic stuff (particles, jitter) */
const rnd = (a = 1, b = 0) => b + Math.random() * (a - b);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const rndPick = (arr) => arr[(Math.random() * arr.length) | 0];
const rndSign = () => (Math.random() < 0.5 ? -1 : 1);

/* ---------- Colors ---------- */
function hexToRgb(hex) {
  const h = hex.replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
  return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
}
function rgbStr(rgb, a = 1) { return `rgba(${(rgb[0] * 255) | 0},${(rgb[1] * 255) | 0},${(rgb[2] * 255) | 0},${a})`; }
function mixRgb(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }
function scaleRgb(a, k) { return [a[0] * k, a[1] * k, a[2] * k]; }

/* ---------- Small value noise for procedural textures ---------- */
function makeNoise2D(seed) {
  const rng = makeRng(seed);
  const P = new Uint8Array(512); const perm = [];
  for (let i = 0; i < 256; i++) perm.push(i);
  rng.shuffle(perm);
  for (let i = 0; i < 512; i++) P[i] = perm[i & 255];
  const G = new Float32Array(256); for (let i = 0; i < 256; i++) G[i] = rng.next();
  const val = (x, y) => G[P[(P[x & 255] + y) & 511]];
  return function (x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = smooth(xf), v = smooth(yf);
    const a = val(xi, yi), b = val(xi + 1, yi), c = val(xi, yi + 1), d = val(xi + 1, yi + 1);
    return lerp(lerp(a, b, u), lerp(c, d, u), v);
  };
}
function fbm(noise, x, y, oct = 4) {
  let a = 0.5, f = 1, s = 0, n = 0;
  for (let i = 0; i < oct; i++) { s += a * noise(x * f, y * f); n += a; a *= 0.5; f *= 2.03; }
  return s / n;
}

/* ---------- Safe storage ---------- */
const Store = {
  get(key, fallback) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
  },
  set(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); return true; } catch (e) { return false; } },
};

/* ---------- Formatting ---------- */
function fmtTime(sec) { sec = Math.max(0, Math.floor(sec)); const m = Math.floor(sec / 60), s = sec % 60; return m + ':' + (s < 10 ? '0' : '') + s; }
const ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'];

/* ---------- Event bus (tiny) ---------- */
const Bus = {
  _h: {},
  on(ev, fn) { (this._h[ev] || (this._h[ev] = [])).push(fn); },
  emit(ev, a, b, c) { const l = this._h[ev]; if (l) for (const fn of l) fn(a, b, c); },
};

/* audio shim: the real AUDIO comes from audio.js. Keep the game alive if it fails to load. */
function sfx(name, opts) { try { if (window.AUDIO) AUDIO.sfx(name, opts); } catch (e) { } }

</script>

  // ===========================================================================
  // 4. Offline rendering + SFX cache
  // ===========================================================================
  function renderOffline(oc) {
    return new Promise((resolve, reject) => {
      let done = false;
      oc.oncomplete = (e) => { if (!done) { done = true; resolve(e.renderedBuffer); } };
      try {
        const p = oc.startRendering();
        if (p && p.then) p.then((b) => { if (!done) { done = true; resolve(b); } }, reject);
      } catch (err) { reject(err); }
    });
  }

  // Perceptual loudness weighting (K-weighting-like): 2nd-order high-pass at
  // 100 Hz (sub energy barely registers - nor do small speakers play it) plus a
  // +3 dB high shelf above ~2 kHz (ear sensitivity). Returns a stateful filter.
  function biquadCoefs(type, f, q, gainDb, sr) {
    const w = 2 * Math.PI * f / sr, cs = Math.cos(w), sn = Math.sin(w), al = sn / (2 * q);
    let b0, b1, b2, a0, a1, a2;
    if (type === 'hp') { b0 = (1 + cs) / 2; b1 = -(1 + cs); b2 = b0; a0 = 1 + al; a1 = -2 * cs; a2 = 1 - al; }
    else {
      const A = Math.pow(10, gainDb / 40), sq = 2 * Math.sqrt(A) * al;
      b0 = A * ((A + 1) + (A - 1) * cs + sq); b1 = -2 * A * ((A - 1) + (A + 1) * cs); b2 = A * ((A + 1) + (A - 1) * cs - sq);
      a0 = (A + 1) - (A - 1) * cs + sq; a1 = 2 * ((A - 1) - (A + 1) * cs); a2 = (A + 1) - (A - 1) * cs - sq;
    }
    return [b0 / a0, b1 / a0, b2 / a0, a1 / a0, a2 / a0];
  }
  function weighting(sr) {
    const h = biquadCoefs('hp', 100, 0.7071, 0, sr), k = biquadCoefs('hs', 2000, 0.7071, 3, sr);
    return function (x, s) {
      const y = h[0] * x + h[1] * s[0] + h[2] * s[1] - h[3] * s[2] - h[4] * s[3];
      s[1] = s[0]; s[0] = x; s[3] = s[2]; s[2] = y;
      const z = k[0] * y + k[1] * s[4] + k[2] * s[5] - k[3] * s[6] - k[4] * s[7];
      s[5] = s[4]; s[4] = y; s[7] = s[6]; s[6] = z;
      return z;
    };
  }

  // loudness-normalise to def.lvl (max 20ms weighted RMS), cap peak at -1 dBFS, trim tail
  function finishSfx(oc, buf, def) {
    const nch = buf.numberOfChannels, n = buf.length, sr = buf.sampleRate;
    const ch = [];
    for (let i = 0; i < nch; i++) ch.push(buf.getChannelData(i));
    const hop = Math.max(1, Math.floor(sr * 0.01));
    const nb = Math.ceil(n / hop), blocks = new Float64Array(nb);
    const wf = weighting(sr);
    let peak = 0;
    for (let c = 0; c < nch; c++) {
      const x = ch[c];
      const st = [0, 0, 0, 0, 0, 0, 0, 0];
      for (let i = 0; i < n; i++) {
        const v = x[i], a = v < 0 ? -v : v;
        if (a > peak) peak = a;
        const w = wf(v, st);
        blocks[(i / hop) | 0] += w * w;
      }
    }
    let maxMs = 0;
    for (let b = 0; b + 1 < nb; b++) {
      const ms = (blocks[b] + blocks[b + 1]) / (2 * hop * nch);
      if (ms > maxMs) maxMs = ms;
    }
    if (nb === 1) maxMs = blocks[0] / (n * nch);
    const rmsDb = 10 * Math.log10(maxMs + 1e-12);
    let gain = Math.pow(10, (def.lvl - rmsDb) / 20);
    gain = clamp(gain, 0.02, 30);
    if (peak * gain > 0.89) gain = 0.89 / peak;
    let last = 0;
    const thr = 0.0004 / gain;
    for (let i = n - 1; i >= 0 && !last; i--) {
      for (let c = 0; c < nch; c++) if (Math.abs(ch[c][i]) > thr) { last = i; break; }
    }
    const outLen = Math.max(32, Math.min(n, last + Math.floor(sr * 0.01)));
    const out = oc.createBuffer(nch, outLen, sr);
    const fade = Math.min(Math.floor(sr * 0.006), outLen >> 1);
    for (let c = 0; c < nch; c++) {
      const src = ch[c], dst = out.getChannelData(c);
      for (let i = 0; i < outLen; i++) dst[i] = src[i] * gain;
      for (let i = 0; i < fade; i++) dst[outLen - 1 - i] *= i / fade;
    }
    def.norm = gain;
    return out;
  }

  function renderSfxVariant(name, variant, sr) {
    const def = SFX[name];
    if (!def || !OAC) return Promise.reject(new Error('cannot render ' + name));
    const nch = def.st ? 2 : 1;
    const oc = new OAC(nch, Math.ceil((def.d + 0.06) * sr), sr);
    const rng = makeRng(hashStr(name) + variant * 7919 + 1);
    const S = new Synth(oc, oc.destination, 1, def.st, rng);
    def.gen(S, 0.002, rng);
    return renderOffline(oc).then((buf) => finishSfx(oc, buf, def));
  }

  // ===========================================================================
  // 5. Music theory + instruments
  // ===========================================================================
  const SCALES = {
    minor: [0, 2, 3, 5, 7, 8, 10], dorian: [0, 2, 3, 5, 7, 9, 10], phrygian: [0, 1, 3, 5, 7, 8, 10],
    harm: [0, 2, 3, 5, 7, 8, 11], major: [0, 2, 4, 5, 7, 9, 11], locrian: [0, 1, 3, 5, 6, 8, 10],
  };
  const QUAL = {
    m: [0, 3, 7], M: [0, 4, 7], m7: [0, 3, 7, 10], M7: [0, 4, 7, 11], d7: [0, 4, 7, 10], dim: [0, 3, 6],
    s2: [0, 2, 7], s4: [0, 5, 7], m9: [0, 3, 7, 10, 14], a9: [0, 4, 7, 14], b9: [0, 4, 7, 10, 13],
    hd: [0, 3, 6, 10], M6: [0, 4, 7, 9],
  };
  // "0m 8M 3M 10M": semitone offset from key + quality. Offsets > 6 voice downward.
  const PROG_CACHE = Object.create(null);
  function parseProg(str, key) {
    const ck = key + '|' + str;
    if (PROG_CACHE[ck]) return PROG_CACHE[ck];
    const out = str.trim().split(/\s+/).map((tok) => {
      const mt = /^(-?\d+)([a-zA-Z0-9]+)$/.exec(tok);
      let off = mt ? +mt[1] : 0;
      const q = mt ? mt[2] : 'm';
      if (off > 6) off -= 12;
      const r = key + off;
      return { r, n: (QUAL[q] || QUAL.m).map((x) => r + x), q };
    });
    return (PROG_CACHE[ck] = out);
  }
  // chord-tone index arpeggio shapes
  const ARPS = [[0, 1, 2, 3, 2, 1, 0, 1], [0, 2, 1, 3, 2, 4, 3, 1], [0, 1, 2, 0, 1, 2, 3, 2], [3, 2, 1, 0, 1, 2, 3, 4], [0, 2, 4, 2, 1, 3, 5, 3]];
  const ARPS16 = [
    [0, 1, 2, 3, 4, 5, 6, 5, 4, 3, 2, 1, 0, 1, 2, 3], [0, 2, 4, 6, 1, 3, 5, 7, 0, 2, 4, 6, 7, 5, 3, 1],
    [0, 0, 3, 0, 1, 1, 4, 1, 2, 2, 5, 2, 3, 1, 4, 6], [6, 5, 4, 3, 2, 1, 0, 1, 6, 5, 4, 3, 2, 3, 4, 5],
  ];
  // motif: per-step array of null | {i: chordToneIndex, l: lengthSteps}
  function makeMotif(r, steps, density, lo, hi, lens) {
    const m = new Array(steps).fill(null);
    lens = lens || [2, 2, 2, 4, 4, 6];
    let i = r.int(lo, hi), p = 0;
    while (p < steps) {
      const l = Math.min(r.pick(lens), steps - p);
      if (r.chance(density)) {
        m[p] = { i, l };
        i = clamp(i + r.pick([-2, -1, -1, 0, 1, 1, 2]), lo, hi);
      }
      p += l;
    }
    if (!m[0]) m[0] = { i: lo + 1, l: 2 };
    return m;
  }
  function mutateMotif(r, m, lo, hi) {
    const out = m.map((x) => (x ? { i: x.i, l: x.l } : null));
    for (let k = 0; k < 2; k++) {
      const idx = r.int(0, out.length - 1);
      if (out[idx]) out[idx].i = clamp(out[idx].i + r.pick([-1, 1, 2, -2]), lo, hi);
    }
    return out;
  }

  const syn = (c, dest) => new Synth(c, dest, 1, true, RND);

  // Polyphonic sustained voice: unison oscillators -> (formants) -> lowpass -> AHR
  function poly(c, dest, t, notes, d, v, o) {
    o = o || {};
    const a = o.a != null ? o.a : 0.5, rel = o.r != null ? o.r : 0.8;
    const hold = Math.max(0.01, d - a), end = t + a + hold + rel;
    const uni = o.uni || 2, det = o.det != null ? o.det : 8;
    const g = c.createGain();
    const peak = v / Math.sqrt(notes.length * uni);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(peak, t + a);
    g.gain.setValueAtTime(peak, t + a + hold);
    g.gain.linearRampToValueAtTime(0, end);
    const lp = c.createBiquadFilter();
    lp.type = 'lowpass';
    lp.Q.value = o.q || 0;
    const f = o.lp || 1200;
    if (o.lpPts) points(lp.frequency, t, o.lp0 || f, o.lpPts);
    else { lp.frequency.setValueAtTime(o.lp0 || f * 0.6, t); lp.frequency.linearRampToValueAtTime(f, t + a + 0.1); }
    lp.connect(g); g.connect(dest);
    let input = lp;
    if (o.form) {
      input = c.createGain();
      o.form.forEach((fm) => {
        const bp = c.createBiquadFilter();
        bp.type = 'bandpass'; bp.frequency.value = fm[0]; bp.Q.value = fm[1];
        const fg = c.createGain(); fg.gain.value = fm[2];
        input.connect(bp); bp.connect(fg); fg.connect(lp);
      });
    }
    let lg = null;
    if (o.vib) {
      const lfo = c.createOscillator();
      lfo.frequency.value = o.vib.r;
      lg = c.createGain(); lg.gain.value = o.vib.d;
      lfo.connect(lg); lfo.start(t); lfo.stop(end + 0.05);
    }
    let last = null;
    for (let n = 0; n < notes.length; n++) {
      for (let j = 0; j < uni; j++) {
        const os = c.createOscillator();
        os.type = o.w || 'sawtooth';
        os.frequency.value = mtof(notes[n]);
        const dc = uni > 1 ? (j / (uni - 1) * 2 - 1) * det : 0;
        os.detune.setValueAtTime(dc, t);
        if (o.droop) os.detune.linearRampToValueAtTime(dc + o.droop, end);
        if (lg) lg.connect(os.detune);
        os.connect(input);
        os.start(t); os.stop(end + 0.05);
        last = os;
      }
    }
    if (last) last.onended = () => safeDisconnect(g);
  }

  const PADS = {
    saw: { w: 'sawtooth', det: 10, lp: 900, a: 0.5, r: 1.0, vib: { r: 0.3, d: 6 } },
    choir: { w: 'sawtooth', det: 12, lp: 3200, a: 0.9, r: 1.4, vib: { r: 4.6, d: 9 }, form: [[360, 6, 2.2], [880, 8, 1.2]] },
    choirA: { w: 'sawtooth', det: 12, lp: 3500, a: 0.7, r: 1.4, vib: { r: 4.8, d: 10 }, form: [[700, 6, 2.0], [1150, 8, 1.2], [2600, 10, 0.5]] },
    air: { w: 'triangle', det: 6, lp: 2600, a: 1.2, r: 1.6, vib: { r: 4, d: 5 } },
    sick: { w: 'sawtooth', det: 22, lp: 650, a: 0.8, r: 1.0, vib: { r: 0.35, d: 18 } },
    square: { w: 'square', det: 12, lp: 1600, a: 0.3, r: 0.6 },
    decay: { w: 'sawtooth', det: 25, lp: 700, a: 1.0, r: 1.5, droop: -45 },
    warm: { w: 'triangle', det: 8, lp: 1800, a: 0.6, r: 1.2 },
    dark: { w: 'sawtooth', det: 6, lp: 600, a: 1.0, r: 1.5 },
    brass: { w: 'sawtooth', det: 9, lp: 500, lpPts: [[0.06, 3400], [0.5, 1300]], a: 0.03, r: 0.25 },
  };

  const INS = {
    pad(c, dest, t, notes, d, v, preset, extra) {
      poly(c, dest, t, notes, d, v, extra ? Object.assign({}, PADS[preset], extra) : PADS[preset]);
    },
    bass(c, dest, t, m, d, v, o) {
      o = o || {};
      const S = syn(c, dest), f = mtof(m), lp = o.lp || 200, env = o.env || 1200;
      const h = Math.max(0, d - 0.01);
      const fp = o.bend ? [[d, mtof(m + o.bend)]] : null;
      S.tone({ t, d: d + 0.06, f, fp, w: o.w || 'sawtooth', lp: { f: lp + env, f2: lp, t: o.fd || 0.14, q: o.q || 4 },
        a: 0.004, h, g: v, det: o.det || 0 });
      if (o.sub) S.tone({ t, d: d + 0.06, f: f / 2, fp: fp ? [[d, fp[0][1] / 2]] : null, a: 0.004, h, g: v * o.sub });
    },
    pluck(c, dest, t, m, v, o) {
      o = o || {};
      const S = syn(c, dest), dec = o.dec || 0.35;
      S.tone({ t, d: dec, f: mtof(m), w: o.w || 'triangle', lp: { f: o.lp || 3000, f2: 250, t: dec }, g: v, det: o.det || 0, pan: o.pan });
      if (o.oct) S.tone({ t, d: dec * 0.6, f: mtof(m + 12), g: v * o.oct, pan: o.pan });
    },
    bell(c, dest, t, m, v, o) {
      o = o || {};
      const S = syn(c, dest), dec = o.dec || 1.2;
      S.tone({ t, d: dec, f: mtof(m), f2: o.droop ? mtof(m + o.droop) : null, fm: { r: o.ratio || 3.5, i: o.i || 2, i2: 0, t: dec * 0.5 },
        g: v, det: o.det || 0, pan: o.pan });
    },
    lead(c, dest, t, m, d, v, o) {
      o = o || {};
      const S = syn(c, dest), f = mtof(m);
      const a = o.a || 0.02, det = o.det != null ? o.det : 7;
      const base = { t, d: d + (o.r || 0.15), f: o.from != null ? mtof(o.from) : f, fp: o.from != null ? [[o.gl || 0.07, f]] : null,
        w: o.w || 'sawtooth', lp: { f: o.lp || 2200, q: o.q || 1 }, a, h: Math.max(0, d - a), g: v * 0.6,
        vib: { r: o.vr || 5.5, d: o.vd || 12 }, pan: o.pan };
      base.det = -det; S.tone(base);
      base.det = det; S.tone(base);
      if (o.breath) S.noise({ t, d: d + 0.1, bp: { f: f * 2, q: 2 }, a: 0.03, h: d * 0.7, g: v * o.breath });
    },
    ep(c, dest, t, m, d, v, pan) {
      const S = syn(c, dest), f = mtof(m);
      S.tone({ t, d: d + 0.8, f, fm: { r: 1, i: 1.5, i2: 0.12, t: 0.7 }, a: 0.004, g: v, pan });
      S.tone({ t, d: 0.3, f: f * 4, a: 0.002, g: v * 0.07, pan });
    },
    // ---- percussion ----
    kick(c, dest, t, v, o) {
      o = o || {};
      const S = syn(c, dest);
      S.tone({ t, d: o.d || 0.42, f: o.f0 || 150, f2: o.f1 || 44, ft: o.pd || 0.09, a: 0.002, g: v });
      S.noise({ t, d: 0.012, hp: 1800, g: v * (o.click != null ? o.click : 0.25) });
    },
    lub(c, dest, t, v, o) {
      o = o || {};
      const S = syn(c, dest), f = o.f || 64;
      S.tone({ t, d: o.d || 0.3, f: f * 1.15, f2: f * 0.58, ft: 0.12, a: 0.003, g: v });
      S.tone({ t, d: 0.12, f: f * 2.3, f2: f * 1.2, w: 'triangle', a: 0.003, g: v * 0.22 });
      S.noise({ t, d: 0.11, col: 'b', lp: { f: 420, f2: 140 }, a: 0.004, g: v * 0.8 });
      if (o.click !== 0) S.noise({ t, d: 0.02, col: 'p', bp: { f: 900, q: 1 }, g: v * 0.12 });
    },
    dub(c, dest, t, v, o) {
      o = o || {};
      const S = syn(c, dest), f = o.f || 80;
      S.tone({ t, d: 0.2, f: f * 1.15, f2: f * 0.6, ft: 0.08, a: 0.003, g: v });
      S.tone({ t, d: 0.09, f: f * 2.3, f2: f * 1.2, w: 'triangle', a: 0.003, g: v * 0.2 });
      S.noise({ t, d: 0.07, col: 'b', lp: { f: 520, f2: 180 }, a: 0.003, g: v * 0.6 });
    },
    snare(c, dest, t, v, o) {
      o = o || {};
      const S = syn(c, dest), f = o.f || 200;
      S.noise({ t, d: o.d || 0.18, hp: 500, bp: { f: o.bp || 1900, q: 0.7 }, a: 0.001, g: v });
      S.tone({ t, d: 0.09, f, f2: f * 0.7, w: 'triangle', g: v * 0.55 });
    },
    clap(c, dest, t, v) {
      const S = syn(c, dest);
      S.noise({ t, d: 0.012, bp: { f: 1300, q: 1.1 }, a: 0.001, g: v * 0.7 });
      S.noise({ t: t + 0.011, d: 0.012, bp: { f: 1300, q: 1.1 }, a: 0.001, g: v * 0.7 });
      S.noise({ t: t + 0.022, d: 0.16, bp: { f: 1250, q: 1.1 }, a: 0.001, g: v * 0.9 });
    },
    hat(c, dest, t, v, o) {
      syn(c, dest).noise({ t, d: (o && o.d) || 0.04, hp: (o && o.hp) || 7500, a: 0.001, g: v, pan: o && o.pan });
    },
    shaker(c, dest, t, v) {
      syn(c, dest).noise({ t, d: 0.07, hp: 3000, bp: { f: 6500, q: 1.2 }, a: 0.012, g: v });
    },
    tom(c, dest, t, f, v) {
      const S = syn(c, dest);
      S.tone({ t, d: 0.35, f, f2: f * 0.55, a: 0.002, g: v });
      S.noise({ t, d: 0.05, col: 'p', lp: 2000, g: v * 0.3 });
    },
    crash(c, dest, t, v) {
      const S = syn(c, dest);
      S.noise({ t, d: 1.8, hp: 4000, a: 0.002, g: v });
      S.noise({ t, d: 0.9, bp: { f: 7000, q: 1 }, g: v * 0.5 });
    },
    metal(c, dest, t, f, v) {
      const S = syn(c, dest);
      S.tone({ t, d: 0.3, f, fm: { r: 1.41, i: 6, i2: 0 }, g: v });
      S.noise({ t, d: 0.04, bp: { f: 2500, q: 2 }, g: v * 0.6 });
    },
    // ---- organic textures ----
    bubble(c, dest, t, f, v, pan) { syn(c, dest).tone({ t, d: 0.07, f, f2: f * 2.4, ft: 0.05, a: 0.004, g: v, pan }); },
    zap(c, dest, t, f, v, pan) { syn(c, dest).tone({ t, d: 0.13, f, f2: f * 0.2, fm: { r: 3.3, i: 6, i2: 0 }, g: v, pan }); },
    crackle(c, dest, t, v, r) {
      syn(c, dest).noise({ t, d: 0.004 + r() * 0.01, bp: { f: 1500 + r() * 6000, q: 3 }, a: 0.0005, g: v, pan: r() * 1.6 - 0.8 });
    },
    drip(c, dest, t, f, v) {
      const S = syn(c, dest);
      S.tone({ t, d: 0.06, f, f2: f * 1.9, ft: 0.03, g: v });
      S.tone({ t: t + 0.18, d: 0.06, f, f2: f * 1.9, ft: 0.03, g: v * 0.3 });
    },
    groan(c, dest, t, m, d, v) {
      const S = syn(c, dest);
      const fb = S.fx('bandpass', 260, 5, null, { p: [[d * 0.4, 560], [d, 300]] }, t);
      S.tone({ t, d, f: mtof(m), f2: mtof(m - 1.5), w: 'sawtooth', a: d * 0.3, h: d * 0.3, g: v, vib: { r: 3.3, d: 30 }, dest: fb });
      S.tone({ t, d, f: mtof(m) * 1.01, f2: mtof(m - 2), w: 'sawtooth', a: d * 0.3, h: d * 0.3, g: v * 0.8, dest: fb });
    },
    whoosh(c, dest, t, d, v, f1, f2) {
      syn(c, dest).noise({ t, d, col: 'p', bp: { f: f1, p: [[d * 0.5, f2], [d, f1]], q: 1.4 }, a: d * 0.45, g: v });
    },
  };

  // instruments are no-ops when their layer is silent (dest === null)
  Object.keys(INS).forEach((k) => {
    const f = INS[k];
    INS[k] = function (c, dest) { if (dest) f.apply(null, arguments); };
  });

  // Persistent breathing wind (lungs): one looping noise source, automated.
  function startWind(P, layer) {
    const c = P.c, L = P.tr.layers[layer];
    if (!L) return;
    const src = c.createBufferSource();
    src.buffer = noiseFor(c).p; src.loop = true;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.8; bp.frequency.value = 350;
    const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 150;
    const g = c.createGain(); g.gain.value = 0.0001;
    src.connect(bp); bp.connect(hp); hp.connect(g); g.connect(L.in);
    src.start(P.t, RND() * 1.5);
    P.tr.keep.push(src);
    P.st.wind = { bp, g };
  }
  function breathe(P, inBeats, outBeats, lvl) {
    const w = P.st.wind;
    if (!w) return;
    const t = P.t, bd = P.bd;
    w.g.gain.setTargetAtTime(lvl, t, bd * inBeats * 0.33);
    w.bp.frequency.setTargetAtTime(1500, t, bd * inBeats * 0.36);
    w.g.gain.setTargetAtTime(lvl * 0.12, t + bd * inBeats, bd * outBeats * 0.3);
    w.bp.frequency.setTargetAtTime(330, t + bd * inBeats, bd * outBeats * 0.33);
  }

  // ===========================================================================
  // 6. Track definitions
  //    layers: name -> {rev (reverb send), drive + post (saturation), lvl (mix
  //    trim), curve ([[intensity, gain], ...] - how the layer follows setIntensity)}
  //    bar(P) runs on each bar start, step(P) on every step, vary(P) every 4 bars.
  //    All notes land exactly on the 16th grid (swing only delays odd 16ths).
  // ===========================================================================
  const LAYER_CURVES = {
    amb: [[0, 1], [1, 0.8]],
    beat: [[0, 0.55], [1, 1]],
    bass: [[0.1, 0], [0.5, 1]],
    drums: [[0.3, 0], [0.75, 1]],
    stab: [[0.4, 0], [0.8, 1]],

  const VEINS_BASS = ['x.xx.xx.x.xx.xo.', 'x..x..x.x..x..xo', 'xxoxxxoxxxoxxxo5', 'x.x.x.x.x.x.o.x.'];
  const GUT_BASS = ['x..x.b.', 'x.ox..b', 'xx..x.o'];
  const BOSS_BASS = [

  // ===========================================================================
  // 8. Engine core: context, graph, volumes, clock, scheduler, lifecycle
  // ===========================================================================
  const LOOKAHEAD = 0.2;       // seconds scheduled ahead of currentTime

  const COMP_TRIM = 0.72;      // master glue compressor: +2.83 dB make-up

  const MUS_TRIM = 0.82;       // music bus compressor: +1.72 dB make-up

  const E = {
    ctx: null, g: null, ready: false, failed: false,

  function buildGraph(c, o) {

  // ---- clock ---------------------------------------------------------------

    _renderMusic(id, seconds, intensity, opts) {

<script>/* src/input.js */
/* ==========================================================================
   SPLEEN: SEPSIS — input.js
   Unified input: keyboard + mouse, gamepad (standard mapping), touch sticks.
   Produces a per-frame snapshot the game reads; edges are consumed per frame.
   ========================================================================== */
"use strict";

const Input = (function () {
  const keys = Object.create(null);
  const pressedEdge = Object.create(null);   // key code -> true for one frame
  const mouse = { x: 0, y: 0, down: false, rdown: false, moved: false, inside: true };
  const touch = { active: false, move: null, aim: null, moveVec: { x: 0, y: 0 }, aimVec: { x: 0, y: 0 }, buttons: {} };
  let padIndex = -1, padPrev = [], padAxesPrevNav = { x: 0, y: 0 }, navRepeat = 0;

  const S = {
    device: 'kbm',             // 'kbm' | 'pad' | 'touch' (last used)
    move: { x: 0, y: 0 },      // -1..1, screen space (y down = south)
    aim: { x: 1, y: 0 },       // unit vector in world (sim) space
    aimActive: false,          // player is explicitly aiming (stick / arrows / mouse)
    firing: false,
    fireHeld: false,
    dash: false, ability: false, interact: false, pause: false, mute: false, tab: false,
    nav: { up: false, down: false, left: false, right: false, confirm: false, back: false, any: false },
    mouseWorld: null,          // {x,y} sim coords under mouse (set by game each frame)
    mouse,
    touch,
  };

  /* ---------------- keyboard ---------------- */
  const GAME_KEYS = new Set(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab']);
  window.addEventListener('keydown', (e) => {
    if (e.repeat) { if (GAME_KEYS.has(e.code)) e.preventDefault(); return; }
    keys[e.code] = true; pressedEdge[e.code] = true; S.device = 'kbm';
    if (GAME_KEYS.has(e.code)) e.preventDefault();
    if (window.AUDIO) try { AUDIO.init(); } catch (err) { }
  });
  window.addEventListener('keyup', (e) => { keys[e.code] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.down = mouse.rdown = false; });

  /* ---------------- mouse ---------------- */
  window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.moved = true; if (S.device !== 'kbm' && (Math.abs(e.movementX) + Math.abs(e.movementY)) > 2) S.device = 'kbm'; });
  window.addEventListener('mousedown', (e) => {
    if (e.target && e.target.closest && e.target.closest('.ui-interactive')) return;
    S.device = 'kbm';
    if (e.button === 0) mouse.down = true;
    if (e.button === 2) { mouse.rdown = true; pressedEdge['Mouse2'] = true; }
    if (window.AUDIO) try { AUDIO.init(); } catch (err) { }
  });
  window.addEventListener('mouseup', (e) => { if (e.button === 0) mouse.down = false; if (e.button === 2) mouse.rdown = false; });
  window.addEventListener('contextmenu', (e) => { e.preventDefault(); });

  /* ---------------- touch (virtual twin sticks) ---------------- */
  const STICK_R = 60;
  function touchStart(e) {
    if (e.target && e.target.closest && e.target.closest('.ui-interactive')) return;
    if (!S.touchEnabled) return;
    S.device = 'touch';
    if (window.AUDIO) try { AUDIO.init(); } catch (err) { }
    for (const t of e.changedTouches) {
      const left = t.clientX < window.innerWidth * 0.5;
      const st = { id: t.identifier, ox: t.clientX, oy: t.clientY, x: t.clientX, y: t.clientY };
      if (left && !touch.move) touch.move = st;
      else if (!left && !touch.aim) touch.aim = st;
    }
    e.preventDefault();
  }
  function touchMove(e) {
    for (const t of e.changedTouches) {
      for (const k of ['move', 'aim']) {
        const st = touch[k];
        if (st && st.id === t.identifier) {
          st.x = t.clientX; st.y = t.clientY;
          // floating stick: drag origin along if pulled past radius
          const dx = st.x - st.ox, dy = st.y - st.oy, d = Math.hypot(dx, dy);
          if (d > STICK_R * 1.4) { st.ox = st.x - dx / d * STICK_R * 1.4; st.oy = st.y - dy / d * STICK_R * 1.4; }
        }
      }
    }
    if (touch.move || touch.aim) e.preventDefault();
  }
  function touchEnd(e) {
    for (const t of e.changedTouches) {
      if (touch.move && touch.move.id === t.identifier) touch.move = null;
      if (touch.aim && touch.aim.id === t.identifier) touch.aim = null;

  window.addEventListener('touchmove', touchMove, { passive: false });
  window.addEventListener('touchend', touchEnd);
  window.addEventListener('touchcancel', touchEnd);
  S.touchEnabled = false;
  S.touchButton = function (name) { touch.buttons[name] = true; S.device = 'touch'; };

  /* ---------------- gamepad ---------------- */
  window.addEventListener('gamepadconnected', (e) => { padIndex = e.gamepad.index; });
  window.addEventListener('gamepaddisconnected', (e) => { if (padIndex === e.gamepad.index) padIndex = -1; });

    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    if (padIndex >= 0 && pads[padIndex]) return pads[padIndex];
    for (const p of pads) if (p && p.connected) { padIndex = p.index; return p; }
    return null;
  }

  /* ---------------- per-frame update ---------------- */
  S.update = function (dt) {
    const k = keys;
    const edge = (code) => !!pressedEdge[code];

    let mx = (k.KeyD ? 1 : 0) - (k.KeyA ? 1 : 0);
    let my = (k.KeyS ? 1 : 0) - (k.KeyW ? 1 : 0);
    // --- arrow keys aim + fire (keyboard-only twin stick)
    let ax = (k.ArrowRight ? 1 : 0) - (k.ArrowLeft ? 1 : 0);
    let ay = (k.ArrowDown ? 1 : 0) - (k.ArrowUp ? 1 : 0);

    let interact = edge('KeyE') || edge('Enter');

      for (let i = 0; i < pad.buttons.length; i++) if (b(i)) anyPad = true;
      if (anyPad) S.device = 'pad';

        const dpx = (b(15) ? 1 : 0) - (b(14) ? 1 : 0), dpy = (b(13) ? 1 : 0) - (b(12) ? 1 : 0);
        if (!lx && !ly && (dpx || dpy)) { mx = dpx; my = dpy; }
        const rl = Math.hypot(rx, ry);
        if (rl > 0.3) { S.aim.x = rx / rl; S.aim.y = ry / rl; aimActive = true; firing = true; }
        if (b(7)) firing = true;
        if (be(0) || be(4) || be(6)) dash = true;
        if (be(5) || be(2)) ability = true;
        if (be(3)) interact = true;
        if (be(9)) pause = true;
        // menu nav (stick with repeat + dpad)
        const sx = pad.axes[0] || 0, sy = pad.axes[1] || 0;
        navRepeat -= dt;
        const stickDir = Math.abs(sx) > 0.55 || Math.abs(sy) > 0.55;
        if (stickDir && (navRepeat <= 0 || (Math.abs(padAxesPrevNav.x) < 0.55 && Math.abs(padAxesPrevNav.y) < 0.55))) {
          if (Math.abs(sx) > Math.abs(sy)) { if (sx > 0) nav.right = true; else nav.left = true; }
          else { if (sy > 0) nav.down = true; else nav.up = true; }
          navRepeat = 0.22;
        }
        padAxesPrevNav.x = sx; padAxesPrevNav.y = sy;
        if (be(12)) nav.up = true; if (be(13)) nav.down = true; if (be(14)) nav.left = true; if (be(15)) nav.right = true;
        if (be(0)) nav.confirm = true; if (be(1)) nav.back = true;
        if (be(9)) nav.back = nav.back; // start handled as pause
      }
      padPrev = pad.buttons.map((x, i) => b(i));
    }

    // --- touch
    if (touch.move) {
      const dx = touch.move.x - touch.move.ox, dy = touch.move.y - touch.move.oy, d = Math.hypot(dx, dy);
      const m = Math.min(1, d / STICK_R);
      if (d > 6) { mx = dx / d * m; my = dy / d * m; }
      touch.moveVec.x = dx; touch.moveVec.y = dy;
    }
    if (touch.aim) {
      const dx = touch.aim.x - touch.aim.ox, dy = touch.aim.y - touch.aim.oy, d = Math.hypot(dx, dy);
      if (d > 12) { S.aim.x = dx / d; S.aim.y = dy / d; aimActive = true; firing = true; }
      touch.aimVec.x = dx; touch.aimVec.y = dy;
    }
    if (touch.buttons.dash) dash = true;
    if (touch.buttons.ability) ability = true;
    if (touch.buttons.interact) interact = true;
    if (touch.buttons.pause) pause = true;
    touch.buttons = {};

    // normalise move to unit circle
    const ml = Math.hypot(mx, my);
    if (ml > 1) { mx /= ml; my /= ml; }
    S.move.x = mx; S.move.y = my;
    S.firing = firing; S.aimActive = aimActive;
    S.dash = dash; S.ability = ability; S.interact = interact; S.pause = pause;
    S.mute = edge('KeyM'); S.tab = !!k.Tab;
    nav.any = nav.up || nav.down || nav.left || nav.right || nav.confirm || nav.back;
    S.anyKeyEdge = Object.keys(pressedEdge).length > 0;
  };
  /** clear one-frame edges (call at end of frame) */
  S.endFrame = function () { for (const k in pressedEdge) delete pressedEdge[k]; mouse.moved = false; };
  S.isDown = (code) => !!keys[code];
  /** gamepad rumble (silently ignored where unsupported) */
  S.rumble = function (strength = 0.5, ms = 120) {
    if (S.device !== 'pad') return;
    try { const p = getPad(); const a = p && p.vibrationActuator; if (a && a.playEffect) a.playEffect('dual-rumble', { duration: ms, strongMagnitude: strength, weakMagnitude: strength * 0.6 }); } catch (e) { }
  };
  return S;
})();

<script>/* src/gfx.js */
/* ==========================================================================
   SPLEEN: SEPSIS — gfx.js
   Babylon.js rendering layer. The simulation lives in 2D tile space

   ========================================================================== */
"use strict";

const Gfx = (function () {
  const G = {};

  let hemi, dirLight, ptLight, outerGround;
  const V3 = () => BABYLON.Vector3;

  /* helpers                                                             */
  /* ------------------------------------------------------------------ */
  function col3(hex, k = 1) { const r = hexToRgb(hex); return new BABYLON.Color3(r[0] * k, r[1] * k, r[2] * k); }

  G.col3 = col3; G.col4 = col4;

  /* init                                                                */
  /* ------------------------------------------------------------------ */

    scene.ambientColor = new BABYLON.Color3(0.12, 0.08, 0.1);
    scene.skipPointerMovePicking = true;

    hemi.intensity = 0.95;
    dirLight = new BABYLON.DirectionalLight('dir', new BABYLON.Vector3(0.4, -1, 0.6), scene);
    dirLight.intensity = 0.35;
    ptLight = new BABYLON.PointLight('pt', new BABYLON.Vector3(0, 2.2, 0), scene);
    ptLight.intensity = 0.8; ptLight.range = 7.5;

    outerGround.position.y = -0.04;
    const om = new BABYLON.StandardMaterial('outerMat', scene);
    om.diffuseColor = new BABYLON.Color3(0.05, 0.01, 0.02); om.specularColor = BABYLON.Color3.Black();
    outerGround.material = om; outerGround.isPickable = false;

  };

  function setupPost() {

    room.floorDirty = false;

  G.makeClot = function (tx, ty, rng) {

<script>/* src/world.js */
/* ==========================================================================
   SPLEEN: SEPSIS — world.js
   Tiles, collision, line of sight, flow fields, floor & room generation.
   Sim space: tile units, x right, y down. Tile (i,j) spans [i,i+1)x[j,j+1).
   ========================================================================== */
"use strict";

const T_FLOOR = 0, T_WALL = 1, T_ROCK = 2, T_CLOT = 3, T_HOLE = 4, T_ACID = 5, T_DOOR = 6;
const CELL_W = 17, CELL_H = 11;               // one map cell in tiles (incl. 1-tile walls)

/* collision masks (bit per tile type) */
const bit = (t) => 1 << t;
const MASK_WALKER = bit(T_WALL) | bit(T_ROCK) | bit(T_CLOT) | bit(T_HOLE) | bit(T_DOOR);

const MASK_PLAYER_OPEN = bit(T_WALL) | bit(T_ROCK) | bit(T_CLOT) | bit(T_HOLE);

const MASK_SHOT = bit(T_WALL) | bit(T_ROCK) | bit(T_CLOT) | bit(T_DOOR);
const MASK_SHOT_SPECTRAL = bit(T_WALL) | bit(T_DOOR);

const World = (function () {
  const W = {};

  /* ---------------- tile queries ---------------- */
  W.tile = function (room, tx, ty) {

  W.collideCircle = function (room, ent, r, mask) {

        if (W.blocked(room, nx, ny, mask)) continue;
        if (dx && dy && (W.blocked(room, x + dx, y, mask) || W.blocked(room, x, y + dy, mask))) continue;
        const ni = ny * room.W + nx, nd = d + (dx && dy ? 1.414 : 1) + (room.grid[ni] === T_ACID ? 3 : 0);
        if (nd < dist[ni]) { dist[ni] = nd; q[qt++] = ni; }
      }
    }
  };
  const DX8 = [1, -1, 0, 0, 1, 1, -1, -1], DY8 = [0, 0, 1, -1, 1, -1, 1, -1];
  /** direction (unit) a walker at x,y should move to approach the player */
  W.flowDir = function (room, x, y) {
    const F = W.flow; if (!F.dist || F.roomId !== room.id) return null;
    const tx = Math.floor(x), ty = Math.floor(y);
    let best = Infinity, bx = 0, by = 0;
    const here = (tx >= 0 && ty >= 0 && tx < room.W && ty < room.H) ? F.dist[ty * room.W + tx] : 1e9;
    for (let k = 0; k < 8; k++) {
      const nx = tx + DX8[k], ny = ty + DY8[k];
      if (nx < 0 || ny < 0 || nx >= room.W || ny >= room.H) continue;
      const d = F.dist[ny * room.W + nx];
      if (d < best) { best = d; bx = nx + 0.5 - x; by = ny + 0.5 - y; }
    }
    if (best >= 1e8 || best >= here + 0.01 && here < 1e8 && here === 0) return null;
    const l = Math.hypot(bx, by); if (l < 1e-6) return null;
    return { x: bx / l, y: by / l, d: here };
  };
  W.flowDist = function (room, x, y) {
    const F = W.flow; if (!F.dist || F.roomId !== room.id) return 1e9;
    const tx = Math.floor(x), ty = Math.floor(y);
    if (tx < 0 || ty < 0 || tx >= room.W || ty >= room.H) return 1e9;
    return F.dist[ty * room.W + tx];
  };

  /* ---------------- obstacle templates (15 x 9 interior) ---------------- */
  // . floor  # rock  c clot  o hole  a acid  x rock-or-clot  r random-sparse
  const TPL = [
    ['...............', '...............', '...............', '...............', '...............', '...............', '...............', '...............', '...............'],
    ['...............', '...............', '...#.......#...', '...............', '...............', '...............', '...#.......#...', '...............', '...............'],
    ['...............', '...............', '...............', '......xxx......', '......xxx......', '......xxx......', '...............', '...............', '...............'],
    ['##...........##', '#.............#', '...............', '...............', '...............', '...............', '...............', '#.............#', '##...........##'],
    ['...............', '...............', '..c.c.....c.c..', '...............', '...............', '...............', '..c.c.....c.c..', '...............', '...............'],
    ['...............', '...............', '...oo.....oo...', '...oo.....oo...', '...............', '...oo.....oo...', '...oo.....oo...', '...............', '...............'],
    ['...............', '...#########...', '...............', '...............', '...............', '...............', '...............', '...#########...', '...............'],
    ['...............', '...............', '......x.x......', '.....x...x.....', '...............', '.....x...x.....', '......x.x......', '...............', '...............'],
    ['...............', '...............', '....ooo.ooo....', '....o.....o....', '...............', '....o.....o....', '....ooo.ooo....', '...............', '...............'],
    ['...............', '..#..#...#..#..', '...............', '...............', '...............', '...............', '...............', '..#..#...#..#..', '...............'],
    ['...............', '.##.........##.', '.#...........#.', '...............', '...............', '...............', '.#...........#.', '.##.........##.', '...............'],
    ['...............', '..aaa.....aaa..', '..aaa.....aaa..', '...............', '.......a.......', '...............', '..aaa.....aaa..', '..aaa.....aaa..', '...............'],
    ['...............', '...............', '.....ooooo.....', '.....ooooo.....', '.....oo.oo.....', '.....ooooo.....', '.....ooooo.....', '...............', '...............'],
    ['...............', '....#..........', '....#....#.....', '....#....#.....', '.........#.....', '....#..........', '....#....#.....', '.........#.....', '...............'],
    ['...............', '..xx.......xx..', '..x.........x..', '...............', '.......c.......', '...............', '..x.........x..', '..xx.......xx..', '...............'],
    ['...............', '...............', '..ccc.....ccc..', '...............', '...............', '...............', '..ccc.....ccc..', '...............', '...............'],
    ['...............', '.......#.......', '.......#.......', '...............', '.##.........##.', '...............', '.......#.......', '.......#.......', '...............'],
    ['...............', '...............', '...............', '...ooo...ooo...', '...ooo...ooo...', '...ooo...ooo...', '...............', '...............', '...............'],
  ];
  W.TPL_COUNT = TPL.length;

  function regionTile(ch, region, rng) {
    if (ch === '.') return T_FLOOR;
    if (ch === '#') return T_ROCK;
    if (ch === 'c') return T_CLOT;
    if (ch === 'o') return region.id === 'gut' && rng.chance(0.5) ? T_ACID : T_HOLE;
    if (ch === 'a') return (region.id === 'gut' || region.id === 'wound') ? T_ACID : (region.id === 'lungs' ? T_HOLE : T_ROCK);
    if (ch === 'x') return rng.chance(region.id === 'veins' || region.id === 'heart' ? 0.55 : 0.3) ? T_CLOT : T_ROCK;
    return T_FLOOR;
  }

  /* ---------------- floor generation ---------------- */
  const DIRS = { N: [0, -1], S: [0, 1], W: [-1, 0], E: [1, 0] };
  const OPP = { N: 'S', S: 'N', E: 'W', W: 'E' };
  W.OPP = OPP;

  W.genFloor = function (floorIdx, seed) {
    const region = REGIONS[floorIdx];
    for (let attempt = 0; attempt < 200; attempt++) {
      const res = tryGen(floorIdx, region, seed + attempt * 7919);
      if (res) return res;
    }
    throw new Error('floor generation failed');
  };

  function tryGen(floorIdx, region, seed) {
    const rng = makeRng(seed);
    const SZ = 13, C = 6;
    const cells = new Map(); // "x,y" -> {x,y,room:null}
    const key = (x, y) => x + ',' + y;
    const nbCount = (x, y) => { let n = 0; for (const d in DIRS) if (cells.has(key(x + DIRS[d][0], y + DIRS[d][1]))) n++; return n; };
    const target = 9 + floorIdx + rng.int(0, 2);
    cells.set(key(C, C), { x: C, y: C });
    let frontier = [[C, C]];
    let guard = 0;
    while (cells.size < target && guard++ < 400) {
      if (!frontier.length) frontier = [...cells.values()].map(c => [c.x, c.y]);
      const next = [];
      for (const [x, y] of frontier) {
        for (const d of rng.shuffle(['N', 'S', 'E', 'W'])) {
          if (cells.size >= target) break;
          const nx = x + DIRS[d][0], ny = y + DIRS[d][1];
          if (nx < 1 || ny < 1 || nx >= SZ - 1 || ny >= SZ - 1) continue;
          if (cells.has(key(nx, ny))) continue;
          if (nbCount(nx, ny) > 1) continue;
          if (rng.chance(0.45)) continue;
          cells.set(key(nx, ny), { x: nx, y: ny }); next.push([nx, ny]);
        }
      }
      frontier = next;
    }
    if (cells.size < target) return null;
    // BFS distances from start
    const distTo = new Map(); distTo.set(key(C, C), 0);
    const q = [[C, C]];
    while (q.length) { const [x, y] = q.shift(); for (const d in DIRS) { const k = key(x + DIRS[d][0], y + DIRS[d][1]); if (cells.has(k) && !distTo.has(k)) { distTo.set(k, distTo.get(key(x, y)) + 1); q.push([x + DIRS[d][0], y + DIRS[d][1]]); } } }
    const deadEnds = [...cells.values()].filter(c => !(c.x === C && c.y === C) && nbCount(c.x, c.y) === 1);
    deadEnds.sort((a, b) => distTo.get(key(b.x, b.y)) - distTo.get(key(a.x, a.y)));
    const wantTumor = floorIdx >= 1 && rng.chance(0.55);
    const wantElite = floorIdx >= 1 && rng.chance(0.6);
    const needed = 3 + (wantTumor ? 1 : 0) + (wantElite ? 1 : 0);
    if (deadEnds.length < needed) return null;
    const bossCell = deadEnds[0];
    if (distTo.get(key(bossCell.x, bossCell.y)) < 3) return null;
    // the boss cell must not neighbour the start
    const specials = {};
    specials[key(bossCell.x, bossCell.y)] = 'boss';
    const rest = rng.shuffle(deadEnds.slice(1));
    const order = ['mutation', 'shop'];
    if (wantElite) order.push('elite');
    if (wantTumor) order.push('tumor');
    for (const t of order) { const c = rest.shift(); specials[key(c.x, c.y)] = t; }

    // build rooms; merge some normal cells into larger rooms
    const rooms = []; const cellRoom = new Map();
    const isNormal = (x, y) => cells.has(key(x, y)) && !specials[key(x, y)] && !(x === C && y === C) && !cellRoom.has(key(x, y));
    const mkRoom = (type, cx0, cy0, cw, ch) => {
      const r = { id: rooms.length, type, cx0, cy0, cw, ch, cells: [] };
      for (let j = 0; j < ch; j++) for (let i = 0; i < cw; i++) { r.cells.push([cx0 + i, cy0 + j]); cellRoom.set(key(cx0 + i, cy0 + j), r); }
      rooms.push(r); return r;
    };
    mkRoom('start', C, C, 1, 1);
    for (const k in specials) { const [x, y] = k.split(',').map(Number); mkRoom(specials[k], x, y, 1, 1); }
    // try 2x2 merges
    const cellList = rng.shuffle([...cells.values()]);
    for (const c of cellList) {
      if (rng.chance(0.82)) continue;
      if (isNormal(c.x, c.y) && isNormal(c.x + 1, c.y) && isNormal(c.x, c.y + 1) && isNormal(c.x + 1, c.y + 1)) mkRoom('normal', c.x, c.y, 2, 2);
    }
    for (const c of cellList) {
      if (!isNormal(c.x, c.y)) continue;
      const r = rng.next();
      if (r < 0.2 && isNormal(c.x + 1, c.y)) mkRoom('normal', c.x, c.y, 2, 1);
      else if (r < 0.36 && isNormal(c.x, c.y + 1)) mkRoom('normal', c.x, c.y, 1, 2);
      else mkRoom('normal', c.x, c.y, 1, 1);
    }
    // finalise each room: tile grid + doors
    for (const r of rooms) {
      r.seed = (seed * 31 + r.id * 977) >>> 0;
      r.boss = r.type === 'boss';
      r.W = r.boss ? BOSS_W : r.cw * CELL_W;
      r.H = r.boss ? BOSS_H : r.ch * CELL_H;
      r.grid = new Uint8Array(r.W * r.H);
      r.doors = [];
      r.cleared = r.type !== 'normal' && r.type !== 'boss' && r.type !== 'elite';
      r.visited = false; r.seen = false;
      r.region = region;
    }
    // doors between different rooms on adjacent cells
    for (const r of rooms) {
      for (const [cx, cy] of r.cells) {
        for (const d in DIRS) {
          const nk = key(cx + DIRS[d][0], cy + DIRS[d][1]);
          const other = cellRoom.get(nk);
          if (!other || other === r) continue;
          const li = cx - r.cx0, lj = cy - r.cy0;
          let x, y;
          if (r.boss) {
            if (d === 'N') { x = Math.floor(r.W / 2) + 0.5; y = 0.5; } else if (d === 'S') { x = Math.floor(r.W / 2) + 0.5; y = r.H - 0.5; }
            else if (d === 'W') { x = 0.5; y = Math.floor(r.H / 2) + 0.5; } else { x = r.W - 0.5; y = Math.floor(r.H / 2) + 0.5; }
          } else {
            if (d === 'N') { x = li * CELL_W + 8.5; y = 0.5; } else if (d === 'S') { x = li * CELL_W + 8.5; y = r.H - 0.5; }
            else if (d === 'W') { x = 0.5; y = lj * CELL_H + 5.5; } else { x = r.W - 0.5; y = lj * CELL_H + 5.5; }
          }
          const kind = other.type === 'normal' ? 'normal' : other.type;
          r.doors.push({ dir: d, x, y, to: other.id, cell: [cx, cy], ncell: [cx + DIRS[d][0], cy + DIRS[d][1]], kind: (r.type !== 'normal' && r.type !== 'start' && other.type === 'normal') ? r.type : kind });
        }
      }
    }
    for (const r of rooms) buildRoomGrid(r, region, floorIdx);
    const floor = { idx: floorIdx, region, rooms, cellRoom, key, startId: 0, bossId: rooms.find(r => r.type === 'boss').id, seed };
    return floor;
  }

  function buildRoomGrid(r, region, floorIdx) {
    const rng = makeRng(r.seed);
    const Wd = r.W, Hd = r.H, g = r.grid;
    // border walls
    for (let y = 0; y < Hd; y++) for (let x = 0; x < Wd; x++) if (x === 0 || y === 0 || x === Wd - 1 || y === Hd - 1) g[y * Wd + x] = T_WALL;
    // door gaps (3 wide)
    for (const d of r.doors) {
      const tx = Math.floor(d.x), ty = Math.floor(d.y);
      for (let k = -1; k <= 1; k++) {
        if (d.dir === 'N' || d.dir === 'S') g[ty * Wd + tx + k] = T_DOOR; else g[(ty + k) * Wd + tx] = T_DOOR;
      }
    }
    // obstacles for normal/elite rooms
    if (r.type === 'normal' || r.type === 'elite') {
      for (let j = 0; j < r.ch; j++) for (let i = 0; i < r.cw; i++) {
        const tid = (r.cw * r.ch > 1 && rng.chance(0.25)) ? 0 : rng.int(1, TPL.length - 1);
        let tpl = TPL[tid];
        if (tid === 11 && region.id !== 'gut' && region.id !== 'wound' && rng.chance(0.7)) tpl = TPL[rng.int(1, 10)];
        const fx = rng.chance(0.5), fy = rng.chance(0.5);
        for (let ty = 0; ty < 9; ty++) for (let tx = 0; tx < 15; tx++) {
          const ch = tpl[fy ? 8 - ty : ty][fx ? 14 - tx : tx];
          const t = regionTile(ch, region, rng);
          if (t !== T_FLOOR) g[(j * CELL_H + 1 + ty) * Wd + (i * CELL_W + 1 + tx)] = t;
        }
      }
      // random clot sprinkle in flesh regions
      if (region.id === 'veins' || region.id === 'heart' || region.id === 'wound') {
        const n = rng.int(0, 3) * r.cw * r.ch;
        for (let k = 0; k < n; k++) { const x = rng.int(2, Wd - 3), y = rng.int(2, Hd - 3); if (g[y * Wd + x] === T_FLOOR) g[y * Wd + x] = T_CLOT; }
      }
      clearDoorLanes(r); ensureConnected(r);
    } else if (r.type === 'boss') {
      // a few pillars for cover in the bigger arenas
      const pillars = [[5, 4], [Wd - 6, 4], [5, Hd - 5], [Wd - 6, Hd - 5]];
      if (r.region.id !== 'gut') for (const [x, y] of pillars) if (rng.chance(0.75)) g[y * Wd + x] = T_ROCK;
      clearDoorLanes(r);
    }
    r.clotHp = {};
    for (let i = 0; i < g.length; i++) if (g[i] === T_CLOT) r.clotHp[i] = 10 + floorIdx * 3;
  }
  function clearDoorLanes(r) {
    const g = r.grid, Wd = r.W;
    for (const d of r.doors) {
      const tx = Math.floor(d.x), ty = Math.floor(d.y);
      for (let a = -2; a <= 2; a++) for (let b = 1; b <= 3; b++) {
        let x, y;
        if (d.dir === 'N') { x = tx + a; y = ty + b; } else if (d.dir === 'S') { x = tx + a; y = ty - b; }
        else if (d.dir === 'W') { x = tx + b; y = ty + a; } else { x = tx - b; y = ty + a; }
        if (x > 0 && y > 0 && x < r.W - 1 && y < r.H - 1) g[y * Wd + x] = T_FLOOR;
      }
    }
  }
  /** Flood fill from first door / centre; turn unreachable floor into holes, open blocked doors */
  function ensureConnected(r) {
    const g = r.grid, Wd = r.W, Hd = r.H;
    const walk = (t) => t === T_FLOOR || t === T_ACID || t === T_DOOR;
    for (let pass = 0; pass < 6; pass++) {
      const seen = new Uint8Array(Wd * Hd);
      let sx = Math.floor(Wd / 2), sy = Math.floor(Hd / 2);
      if (!walk(g[sy * Wd + sx])) { outer: for (let y = 1; y < Hd - 1; y++) for (let x = 1; x < Wd - 1; x++) if (walk(g[y * Wd + x])) { sx = x; sy = y; break outer; } }
      const st = [sy * Wd + sx]; seen[st[0]] = 1;
      while (st.length) {
        const i = st.pop(), x = i % Wd, y = (i / Wd) | 0;
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= Wd || ny >= Hd) continue;
          const ni = ny * Wd + nx; if (seen[ni] || !walk(g[ni])) continue; seen[ni] = 1; st.push(ni);
        }
      }
      // any door tile unreached? carve a straight corridor toward centre
      let fixed = false;
      for (const d of r.doors) {
        const tx = Math.floor(d.x), ty = Math.floor(d.y);
        if (seen[ty * Wd + tx]) continue;
        let x = tx, y = ty;
        for (let s = 0; s < 40; s++) {
          if (Math.abs(x - sx) > Math.abs(y - sy)) x += Math.sign(sx - x); else y += Math.sign(sy - y);
          if (x <= 0 || y <= 0 || x >= Wd - 1 || y >= Hd - 1) continue;
          if (g[y * Wd + x] !== T_FLOOR && g[y * Wd + x] !== T_ACID) g[y * Wd + x] = T_FLOOR;
          if (x === sx && y === sy) break;
        }
        fixed = true;
      }
      if (!fixed) {
        // unreachable floor pockets become rock (prevents spawning there)
        for (let i = 0; i < g.length; i++) if ((g[i] === T_FLOOR || g[i] === T_ACID) && !seen[i]) g[i] = T_ROCK;
        return;
      }
    }
  }

  /** Floor tiles suitable for spawning (reachable, open, away from a point) */
  W.spawnSpots = function (room, avoidX, avoidY, minDist, flyer) {
    const out = [];
    for (let y = 2; y < room.H - 2; y++) for (let x = 2; x < room.W - 2; x++) {
      const t = room.grid[y * room.W + x];
      if (t !== T_FLOOR && !(flyer && (t === T_HOLE || t === T_ACID))) continue;
      if (!flyer) { // need a little breathing room
        let ok = true;
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const tt = room.grid[(y + dy) * room.W + x + dx]; if (tt === T_WALL || tt === T_DOOR) ok = false; }
        if (!ok) continue;
      }
      if (dist(x + 0.5, y + 0.5, avoidX, avoidY) < minDist) continue;
      out.push([x + 0.5, y + 0.5]);
    }
    return out;
  };
  W.isOpenFloor = function (room, x, y) { const t = W.tile(room, Math.floor(x), Math.floor(y)); return t === T_FLOOR || t === T_ACID; };
  /** nearest walkable tile centre to (x,y) */
  W.nearestOpen = function (room, x, y) {
    let best = null, bd = 1e9;
    for (let r = 0; r < 8 && !best; r++) {
      for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
        const tx = Math.floor(x) + dx, ty = Math.floor(y) + dy;
        if (W.tile(room, tx, ty) !== T_FLOOR) continue;
        const d = dist(tx + 0.5, ty + 0.5, x, y); if (d < bd) { bd = d; best = { x: tx + 0.5, y: ty + 0.5 }; }
      }
    }
    return best || { x: room.W / 2, y: room.H / 2 };
  };
  /** where the player appears after walking through door `d` (the door in the NEW room) */
  W.entryPoint = function (room, d) {
    const inset = 1.9;
    if (d.dir === 'N') return { x: d.x, y: d.y + inset };
    if (d.dir === 'S') return { x: d.x, y: d.y - inset };
    if (d.dir === 'W') return { x: d.x + inset, y: d.y };
    return { x: d.x - inset, y: d.y };
  };
  return W;
})();

<script>/* src/combat.js */
/* ==========================================================================
   SPLEEN: SEPSIS — combat.js
   Shared simulation state + projectiles, damage, status effects, hazards,
   telegraphs, explosions, particles and pickups.
   ========================================================================== */
"use strict";

const SIM = {
  room: null, floor: null, run: null, player: null,
  enemies: [], pshots: [], eshots: [], zones: [], teles: [], beams: [], lobs: [], pickups: [], particles: [], rings: [],
  companions: [], interact: [], arcs: [],
  time: 0, roomTime: 0, hitstop: 0, slowmo: 0, uid: 1,
  opts: { dmgNumbers: true, shake: 1, flashes: true },
};
const nextId = () => SIM.uid++;
/* sim-time scheduler (respects pause, slow-mo, hitstop; dropped on room change) */
SIM.timers = [];
function after(sec, fn) { SIM.timers.push({ t: sec, fn, room: SIM.room }); }
function updateTimers(dt) {
  for (let i = SIM.timers.length - 1; i >= 0; i--) {
    const T = SIM.timers[i]; T.t -= dt;
    if (T.room !== SIM.room) { SIM.timers.splice(i, 1); continue; }
    if (T.t <= 0) { SIM.timers.splice(i, 1); T.fn(); }
  }
}

/* ---------------- projectile styles ---------------- */
const SHOT_STYLES = {
  neut: { hex: '#c8faff', sx: 2.4, sy: 0.9 },
  spray: { hex: '#ffe2bf', sx: 1.5, sy: 0.85 },
  lance: { hex: '#d8ffe8', sx: 4.2, sy: 0.5 },
  lanceS: { hex: '#b8f0cc', sx: 2.2, sy: 0.6 },
  anti: { hex: '#c9bcff', sx: 1.6, sy: 0.8 },
  big: { hex: '#ffe58a', sx: 1.4, sy: 1.0 },
  phage: { hex: '#e0a8ff', sx: 1.4, sy: 0.8 },
  helper: { hex: '#c8ffd0', sx: 1.7, sy: 0.75 },
  frag: { hex: '#ffd0f0', sx: 1.4, sy: 0.8 },
  turn: { hex: '#ff7ad8', sx: 1.8, sy: 0.8 },   // turncoat (enemy) streak
};
const ESHOT_STYLES = {
  pink: '#ff3d7f', acid: '#d6ff3a', volt: '#fff27a', spore: '#9affc8', orange: '#ff8a2a', violet: '#d07aff', red: '#ff3b2f',
};

/* ==========================================================================
   PLAYER PROJECTILES
   ========================================================================== */
function spawnPShot(x, y, ang, o) {
  const spd = o.speed || 12;
  const s = {
    id: nextId(), x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, spd,
    r: o.r || 0.16, dmg: o.dmg || 1, life: o.life || 0.6, t: 0,
    pierce: o.pierce || 0, bounce: o.bounce || 0, homing: o.homing || 0,
    style: o.style || 'neut', crit: !!o.crit, knock: o.knock != null ? o.knock : 1,
    hit: null, owner: o.owner || 'player', flags: o.flags || {}, h: o.h || 0.62,

}

function updatePShots(dt) {
  const room = SIM.room;
  for (let i = SIM.pshots.length - 1; i >= 0; i--) {
    const s = SIM.pshots[i];
    s.t += dt;
    if (s.t >= s.life || s.dead) { if (!s.dead) shotFizzle(s); SIM.pshots.splice(i, 1); continue; }
    // homing: steer toward nearest valid enemy in front
    if (s.homing > 0) {
      const tgt = nearestEnemy(s.x, s.y, 7, s.hit);
      if (tgt) {
        const want = angleTo(s.x, s.y, tgt.x, tgt.y), cur = Math.atan2(s.vy, s.vx);
        const turn = clamp(angDiff(cur, want), -1, 1) * s.homing * 9 * dt;
        const a = cur + turn, sp = Math.hypot(s.vx, s.vy);
        s.vx = Math.cos(a) * sp; s.vy = Math.sin(a) * sp;
      }
    }
    if (s.decel) { const k = Math.max(0, 1 - s.decel * dt); s.vx *= k; s.vy *= k; }
    if (s.grow) s.r += s.grow * dt;
    applyFlow(s, dt, 0.5);
    const nx = s.x + s.vx * dt, ny = s.y + s.vy * dt;
    // walls / obstacles
    const mask = s.spectral ? MASK_SHOT_SPECTRAL : MASK_SHOT;
    const tx = Math.floor(nx), ty = Math.floor(ny);
    if (World.blocked(room, tx, ty, mask)) {
      const t = World.tile(room, tx, ty);
      if (t === T_CLOT) damageClot(tx, ty, s.dmg);
      if (s.bounce > 0) {
        s.bounce--;
        const bx = World.blocked(room, Math.floor(nx), Math.floor(s.y), mask);
        const by = World.blocked(room, Math.floor(s.x), Math.floor(ny), mask);
        if (bx || !by) s.vx = -s.vx; if (by || !bx) s.vy = -s.vy;
        if (SIM.player.st.bounceDmg) s.dmg *= 1 + SIM.player.st.bounceDmg;
        if (s.hit) s.hit.clear();
        burst(s.x, s.y, SHOT_STYLES[s.style].hex, 3, 2, { life: 0.2, size: 0.05 });
        continue;
      }
      if (s.flags.splitWall && !s.split) splitShot(s, Math.atan2(s.vy, s.vx) + Math.PI, 2, 0.5, 0.9);
      if (s.flags.blast) shotBlast(s);
      shotFizzle(s, true);
      SIM.pshots.splice(i, 1);
      continue;
    }
    s.x = nx; s.y = ny;
    // enemies
    for (const e of SIM.enemies) {
      if (e.dead || e.spawning > 0 || e.untargetable) continue;
      if (s.hit && s.hit.has(e.id)) continue;
      const rr = e.r + s.r;
      if (dist2(s.x, s.y, e.x, e.y) > rr * rr) continue;
      // frontal armour (waxback, bosses with shells)
      if (e.shieldArc && !e.shieldBroken) {
        const incoming = Math.atan2(-s.vy, -s.vx);
        if (Math.abs(angDiff(e.facing, incoming)) < e.shieldArc) {
          sfx('hit_armor', { rate: rnd(0.9, 1.1) });
          burst(s.x, s.y, '#ffffff', 4, 3, { life: 0.18, size: 0.05 });
          // deflect
          s.dead = true; break;
        }
      }
      shotHitEnemy(s, e);
      if (!s.hit) s.hit = new Set();
      s.hit.add(e.id);
      if (s.pierce > 0) { s.pierce--; continue; }
      s.dead = true; break;
    }
    if (s.dead) { SIM.pshots.splice(i, 1); }
  }
}
function shotFizzle(s, wall) {
  const hex = SHOT_STYLES[s.style] ? SHOT_STYLES[s.style].hex : '#ffffff';
  burst(s.x, s.y, hex, wall ? 4 : 2, wall ? 2.4 : 1.2, { life: 0.22, size: 0.05, h: s.h });

}
function splitShot(s, baseAng, n, dmgK, spread) {
  for (let k = 0; k < n; k++) {
    const a = baseAng + (n === 1 ? 0 : (k / (n - 1) - 0.5) * spread);
    const c = spawnPShot(s.x + Math.cos(a) * 0.1, s.y + Math.sin(a) * 0.1, a, { speed: s.spd * 0.85, r: s.r * 0.7, dmg: s.dmg * dmgK, life: 0.35, style: 'frag', knock: 0.4, owner: s.owner });
    c.split = true;

}

  const P = SIM.player, rad = s.flags.blast * (P.st.blastRadiusMult || 1);
