}

function shotHitEnemy(s, e) {
  const P = SIM.player, st = P.st;
  let dmg = s.dmg;
  const isPlayer = s.owner === 'player';
  // status procs (player shots only; companions get a weaker share)
  const procK = isPlayer ? 1 : 0.4;
  const f = s.flags;
  dealDamage(e, dmg, { x: s.x, y: s.y, vx: s.vx, vy: s.vy, crit: s.crit, knock: s.knock, src: s.owner, shot: s });
  if (e.dead) { /* still allow split/chain from killing blows */ }
  if (f.burn && Math.random() < f.burn * procK) applyBurn(e, dmg * 0.4);
  if (f.poison && Math.random() < f.poison * procK) applyPoison(e, dmg * 0.25);
  if (f.slow && Math.random() < f.slow * procK) applySlow(e, 2, 0.6);
  if (f.stun && Math.random() < f.stun * procK) applyStun(e, 0.6);
  if (f.opsonin) e.opsT = 3;
  if (s.latch) applyLatch(e, dmg * 0.35);
  if (f.chain && Math.random() < f.chain * procK) chainLightning(e, dmg * 0.5, 2);
  if (f.splitHit && !s.split) {
    for (let k = 0; k < f.splitHit; k++) {
      const a = rnd(0, TAU);
      const c = spawnPShot(e.x + Math.cos(a) * (e.r + 0.15), e.y + Math.sin(a) * (e.r + 0.15), a, { speed: 9, r: 0.11, dmg: dmg * 0.4, life: 0.7, style: 'frag', homing: 0.9, knock: 0.3, owner: s.owner });

/* ==========================================================================
   DAMAGE PIPELINE (player -> enemy)
   ========================================================================== */
function enemyDamageMult(e) {
  let m = 1;
  if (e.opsT > 0) m *= 1.2;
  if (e.markT > 0) m *= 1.5;
  const P = SIM.player;
  if (P) {
    m *= 1 + P.memoryBonus(e.type);

  e.hurtT = 0.09;
  const P = SIM.player;
  // execute
  if (P && P.st.execute && !e.isBoss && e.hp > 0 && e.hp < e.maxHp * P.st.execute && !o.dot) { dmg += e.hp; e.hp = 0; Gfx.floatText(e.x, e.y, 'APOPTOSIS', '#ff9af0', 12, { h: 1.6 }); }
  if (SIM.opts.dmgNumbers && !o.silent) {
    const big = dmg >= 10;
    Gfx.floatText(e.x + rnd(-0.2, 0.2), e.y, Math.max(1, Math.round(dmg)).toString(), o.crit ? '#ffe066' : o.dot ? (o.dotHex || '#ffa060') : '#ffffff', o.crit ? 19 : big ? 16 : 13, { crit: o.crit, h: 1.0 + e.r });
  }
  if (!o.dot) {
    sfx(o.crit ? 'crit' : 'hit', { vol: o.src === 'player' ? 0.75 : 0.4, rate: rnd(0.85, 1.15) });
    const a = o.vx !== undefined ? Math.atan2(o.vy, o.vx) : angleTo(P.x, P.y, e.x, e.y);
    burst(o.x != null ? o.x : e.x, o.y != null ? o.y : e.y, e.color, o.crit ? 6 : 3, 3.2, { dir: a, cone: 1.2, life: 0.35, size: 0.07 });

}

function killEnemy(e, o = {}) {
  if (e.dead) return;
  e.dead = true;
  const P = SIM.player;
  const big = e.r >= 0.6 || e.isBoss;
  if (!e.noDeathFx) {
    burst(e.x, e.y, e.color, big ? 26 : 14, big ? 6 : 4.5, { life: 0.55, size: big ? 0.13 : 0.09, up: 3 });
    burst(e.x, e.y, e.core || '#ffffff', big ? 10 : 5, 3, { life: 0.4, size: 0.07 });
    Gfx.splat(SIM.room, e.x, e.y, e.r * (big ? 1.5 : 1.25), e.color, 0.55);
    sfx(e.elite ? 'kill_elite' : big ? 'kill_big' : 'kill_small', { rate: rnd(0.9, 1.1) });
    Gfx.addShake(e.elite ? 0.35 : big ? 0.25 : 0.12);
    if (e.elite || big) Input.rumble(0.35, 90);

  }

  // marked targets burst
  if (e.markT > 0 && P) explode(e.x, e.y, 1.8, P.baseDmg() * 2.2, { byPlayer: true, hex: '#9dff7a' });
  if (P && !e.isBoss && !e.summoned) {
    // drops
    const ironChance = (e.elite ? 1 : 0.32) * (e.cost || 1) * 0.5 + (e.elite ? 0.5 : 0);
    if (Math.random() < Math.min(0.95, ironChance)) {
      const n = e.elite ? rndi(3, 5) : 1 + (Math.random() < 0.25 ? 1 : 0);
      for (let k = 0; k < n; k++) spawnPickup('iron', e.x + rnd(-0.3, 0.3), e.y + rnd(-0.3, 0.3), 1);
    }
    if (P.st.plateletDrop && Math.random() < P.st.plateletDrop) spawnPickup('platelet', e.x, e.y);
  }
  if (P) {

}

/* ---------------- status effects ---------------- */
function applyBurn(e, dps) {
  if (e.dead) return;

function updateStatus(e, dt) {
  e.hurtT = Math.max(0, (e.hurtT || 0) - dt);
  if (e.opsT > 0) e.opsT -= dt;
  if (e.markT > 0) e.markT -= dt;
  if (e.slowT > 0) e.slowT -= dt;
  if (e.stunT > 0) e.stunT -= dt;
  let dot = 0, hex = '#ffa060';
  if (e.burnT > 0) { e.burnT -= dt; dot += e.burnDps; if (Math.random() < dt * 8) burst(e.x, e.y, '#ff8a2a', 1, 1.2, { life: 0.4, size: 0.06, up: 2.5 }); }
  if (e.poisonT > 0) { e.poisonT -= dt; dot += e.poisonDps * e.poisonStacks; hex = '#9aff5a'; if (Math.random() < dt * 6) burst(e.x, e.y, '#9aff5a', 1, 1, { life: 0.4, size: 0.05, up: 1.5 }); }
  else e.poisonStacks = 0;

    hex = '#c9bcff';
  }

    e.dotTick = (e.dotTick || 0) + dt;

}

function chainLightning(from, dmg, n, visited) {

  let src = from;
  for (let k = 0; k < n; k++) {
    let best = null, bd = 4.5 * 4.5;
    for (const e of SIM.enemies) { if (e.dead || visited.has(e.id) || e.spawning > 0) continue; const d = dist2(src.x, src.y, e.x, e.y); if (d < bd) { bd = d; best = e; } }
    if (!best) break;
    visited.add(best.id);
    SIM.arcs.push({ x0: src.x, y0: src.y, x1: best.x, y1: best.y, t: 0, life: 0.16, hex: '#bfe8ff' });
    dealDamage(best, dmg, { src: 'chain', knock: 0.2, silent: false });

/* ==========================================================================
   ENEMY PROJECTILES
   ========================================================================== */
const ESHOT_SPEED_MULT = () => (1 + (SIM.floor ? SIM.floor.idx : 0) * 0.035) * (SIM.run && SIM.run.fever >= 2 ? 1.12 : 1);
function spawnEShot(x, y, ang, speed, o = {}) {

  const s = {
    id: nextId(), x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, r: o.r || 0.17, life: o.life || 8, t: 0,
    style: o.style || 'pink', accel: o.accel || 0, curve: o.curve || 0, delay: o.delay || 0, h: o.h || 0.55,
    onExpire: o.onExpire || null, spectral: !!o.spectral, maxSpeed: o.maxSpeed || 99, streak: !!o.streak, dmg: o.dmg || 1,
    gravityTo: o.gravityTo || null, homing: o.homing || 0,

}

}
function updateEShots(dt) {
  const room = SIM.room, P = SIM.player;
  for (let i = SIM.eshots.length - 1; i >= 0; i--) {
    const s = SIM.eshots[i];
    if (s.delay > 0) { s.delay -= dt; continue; }
    s.t += dt;
    if (s.t >= s.life || s.dead) { if (s.onExpire && !s.dead) s.onExpire(s); SIM.eshots.splice(i, 1); continue; }

    applyFlow(s, dt, 0.5);
    s.x += s.vx * dt; s.y += s.vy * dt;
    if (!s.spectral && World.blockedAt(room, s.x, s.y, MASK_SHOT)) {
      burst(s.x, s.y, ESHOT_STYLES[s.style] || '#ff3d7f', 3, 1.6, { life: 0.2, size: 0.05 });
      if (s.onExpire) s.onExpire(s);
      SIM.eshots.splice(i, 1); continue;
    }
    if (s.spectral && (s.x < -2 || s.y < -2 || s.x > room.W + 2 || s.y > room.H + 2)) { SIM.eshots.splice(i, 1); continue; }
    // companions / satellites block

    for (const c of SIM.companions) {

      const rr = c.r + s.r; if (dist2(s.x, s.y, c.x, c.y) < rr * rr) { blocked = true; burst(s.x, s.y, '#ffffff', 4, 2, { life: 0.2, size: 0.05 }); break; }

/* ==========================================================================
   HAZARDS: zones, telegraphs, beams, lobs
   ========================================================================== */
/** zone kinds: spore (hurts player), acid (hurts player), rot (hurts player), net/bio (hurt enemies), pull (cosmetic) */
function spawnZone(x, y, r, life, kind, o = {}) {

function updateZones(dt) {

        }

}
/** Telegraph then callback. kind: disc {r} | line {ang,len,w} */
function telegraph(o) {

}
function updateTeles(dt) {

    if (t.follow) t.follow(t);
    t.t += dt;
    if (t.t >= t.dur) { SIM.teles.splice(i, 1); if (t.then) t.then(t); }
  }
}
/** damaging beam (line segment) active for dur */
function spawnBeam(x, y, ang, len, w, dur, o = {}) {
  const b = { x, y, ang, len, w, dur, t: 0, owner: o.owner || null, spin: o.spin || 0, follow: o.follow || null, hex: o.hex || '#ff5ad1', dmg: o.dmg || 1 };
  SIM.beams.push(b);

}
function updateBeams(dt) {
  const P = SIM.player;
  for (let i = SIM.beams.length - 1; i >= 0; i--) {
    const b = SIM.beams[i];
    b.t += dt;
    if (b.t >= b.dur || (b.owner && b.owner.dead)) { SIM.beams.splice(i, 1); continue; }
    if (b.follow) b.follow(b, dt);
    if (b.spin) b.ang += b.spin * dt;
    if (P && !P.dead) {
      const d = pointSegDist(P.x, P.y, b.x, b.y, b.x + Math.cos(b.ang) * b.len, b.y + Math.sin(b.ang) * b.len);
      if (d < b.w * 0.5 + P.hitR * 0.8) hurtPlayer(b.dmg, { x: P.x, y: P.y, kind: 'beam' });
    }

}
function pointSegDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  let t = l2 > 0 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0; t = clamp(t, 0, 1);
  return dist(px, py, ax + dx * t, ay + dy * t);
}
/** lobbed glob: flies in an arc, then onLand(x,y) */
function spawnLob(x0, y0, x1, y1, dur, o = {}) {
  const l = { x0, y0, x1, y1, dur, t: 0, hex: o.hex || '#d6ff3a', size: o.size || 0.28, onLand: o.onLand || null, peak: o.peak || 3 };
  SIM.lobs.push(l);
  if (o.tele !== false) telegraph({ kind: 'disc', x: x1, y: y1, r: o.r || 1, dur, warm: true });

}
function updateLobs(dt) {
  for (let i = SIM.lobs.length - 1; i >= 0; i--) {
    const l = SIM.lobs[i]; l.t += dt;
    if (l.t >= l.dur) { SIM.lobs.splice(i, 1); if (l.onLand) l.onLand(l.x1, l.y1); }

}

/* ==========================================================================
   EXPLOSIONS + PARTICLES + RINGS
   ========================================================================== */
function explode(x, y, r, dmg, o = {}) {
  const hex = o.hex || '#ffb04a';
  burst(x, y, hex, o.small ? 10 : 26, r * (o.small ? 4 : 5), { life: 0.4, size: o.small ? 0.07 : 0.12, up: 2 });
  burst(x, y, '#ffffff', o.small ? 3 : 8, r * 3, { life: 0.25, size: 0.08 });
  addRing(x, y, r, hex, 0.3);
  if (!o.small) { Gfx.scorch(SIM.room, x, y, r * 0.9); Gfx.addShake(0.4); sfx('explosion', { rate: rnd(0.9, 1.1) }); }
  else if (Math.random() < 0.5) sfx('explosion', { vol: 0.35, rate: rnd(1.3, 1.6) });
  if (o.fxOnly) return;
  if (o.byPlayer) {
    for (const e of SIM.enemies) {
      if (e.dead || e.spawning > 0 || (o.exclude && o.exclude === e)) continue;
      if (dist2(e.x, e.y, x, y) < (r + e.r) ** 2) dealDamage(e, dmg, { x, y, vx: e.x - x, vy: e.y - y, knock: 1.4, src: 'blast', silent: o.small });
    }
    if (o.chain) for (const e of SIM.enemies) if (!e.dead && dist2(e.x, e.y, x, y) < (r + 2) ** 2) { chainLightning(e, dmg * 0.4, 1); break; }
    // explosions break clots
    const room = SIM.room;
    for (let ty = Math.floor(y - r); ty <= Math.floor(y + r); ty++) for (let tx = Math.floor(x - r); tx <= Math.floor(x + r); tx++) {
      if (World.tile(room, tx, ty) === T_CLOT && dist2(tx + 0.5, ty + 0.5, x, y) < r * r) damageClot(tx, ty, 999);
    }
  } else {
    const P = SIM.player;
    if (P && dist2(P.x, P.y, x, y) < (r + P.hitR) ** 2) hurtPlayer(1, { x, y, kind: 'blast' });
  }
}
function burst(x, y, hex, n, spd, o = {}) {
  if (SIM.particles.length > 900) n = Math.min(n, 2);
  for (let i = 0; i < n; i++) {
    const a = o.dir != null ? o.dir + rnd(-o.cone, o.cone) * 0.5 : rnd(0, TAU);
    const sp = spd * rnd(0.35, 1);
    SIM.particles.push({
      x, y, h: o.h != null ? o.h : 0.5, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, vh: (o.up || 1.5) * rnd(0.3, 1.2),
      life: (o.life || 0.5) * rnd(0.6, 1.2), t: 0, size: (o.size || 0.08) * rnd(0.6, 1.4), hex, grav: o.grav != null ? o.grav : 9, drag: o.drag || 2.5,
    });
  }
}
function updateParticles(dt) {
  const arr = SIM.particles;
  for (let i = arr.length - 1; i >= 0; i--) {
    const p = arr[i]; p.t += dt;
    if (p.t >= p.life) { arr[i] = arr[arr.length - 1]; arr.pop(); continue; }
    const k = Math.max(0, 1 - p.drag * dt);
    p.vx *= k; p.vy *= k; p.vh -= p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.h += p.vh * dt;
    if (p.h < 0.03) { p.h = 0.03; p.vh = -p.vh * 0.3; p.vx *= 0.6; p.vy *= 0.6; }
  }
  for (let i = SIM.arcs.length - 1; i >= 0; i--) { const a = SIM.arcs[i]; a.t += dt; if (a.t >= a.life) SIM.arcs.splice(i, 1); }
  for (let i = SIM.rings.length - 1; i >= 0; i--) { const r = SIM.rings[i]; r.t += dt; if (r.t >= r.life) SIM.rings.splice(i, 1); }
}
function addRing(x, y, r, hex, life = 0.35) { SIM.rings.push({ x, y, r, hex, life, t: 0 }); }

/* ==========================================================================
   CLOTS (destructible obstacles)
   ========================================================================== */
function damageClot(tx, ty, dmg) {
  const room = SIM.room, idx = ty * room.W + tx;
  if (room.grid[idx] !== T_CLOT) return;
  const max = 10 + (SIM.floor ? SIM.floor.idx * 3 : 0);
  room.clotHp[idx] = (room.clotHp[idx] == null ? max : room.clotHp[idx]) - dmg;
  if (room.clotHp[idx] <= 0) {
    room.grid[idx] = T_FLOOR; room.flowDirty = true;
    Gfx.removeClot(tx, ty);
    burst(tx + 0.5, ty + 0.5, '#c81a2a', 14, 4, { life: 0.5, size: 0.1, up: 3 });
    Gfx.splat(room, tx + 0.5, ty + 0.5, 0.7, '#a81a2a', 0.6);
    sfx('kill_small', { rate: 0.8 });
    if (Math.random() < 0.22) spawnPickup('iron', tx + 0.5, ty + 0.5, 1);
    else if (Math.random() < 0.04) spawnPickup('platelet', tx + 0.5, ty + 0.5);
  } else {
    Gfx.damageClot(tx, ty, room.clotHp[idx] / max);
    burst(tx + 0.5, ty + 0.5, '#c81a2a', 2, 2, { life: 0.25, size: 0.06 });
  }
}

/* ==========================================================================
   PICKUPS
   ========================================================================== */
const PICKUP_DEF = {
  iron: { hex: '#ff8a3a', r: 0.18, glow: 0.9 },
  platelet: { hex: '#ffd0dc', r: 0.26, glow: 0.7 },
  mucus: { hex: '#9ad8ff', r: 0.26, glow: 0.8 },
};
function spawnPickup(kind, x, y, value) {
  const a = rnd(0, TAU), sp = rnd(1.5, 3.5);
  const p = { id: nextId(), kind, x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, t: 0, value: value || 1, node: null, h: 0.3, vh: 3 };
  p.node = buildPickupVis(kind);
  SIM.pickups.push(p);
  return p;
}
function buildPickupVis(kind) {
  const root = Gfx.node('pk_' + kind);
  if (kind === 'iron') {
    const m = Gfx.part('octa', Gfx.cellMat('#ff8a3a', { rim: 1.6, core: 0.6, glow: 0.7, dark: 0.8 }), root, 0, 0, 0, 0.17);
  } else if (kind === 'platelet') {
    const mat = Gfx.cellMat('#ffc0d0', { rim: 1.4, core: 0.5, glow: 0.55, dark: 0.9 });
    Gfx.part('sphere', mat, root, 0, 0, 0, 0.26, 0.11, 0.26);
    const cm = Gfx.glowMat('#ff3b5c', { glow: 0.6 });
    Gfx.part('box', cm, root, 0, 0.1, 0, 0.14, 0.02, 0.04); Gfx.part('box', cm, root, 0, 0.1, 0, 0.04, 0.02, 0.14);
  } else if (kind === 'mucus') {
    Gfx.part('sphere', Gfx.cellMat('#9ad8ff', { rim: 1.6, core: 0.4, glow: 0.6, dark: 0.6, alpha: 0.75 }), root, 0, 0, 0, 0.24);
    Gfx.part('sphereLo', Gfx.glowMat('#e8f8ff', { glow: 0.5 }), root, 0.06, 0.06, -0.06, 0.06);
  }

}
function updatePickups(dt) {
  const P = SIM.player, room = SIM.room;
  for (let i = SIM.pickups.length - 1; i >= 0; i--) {
    const p = SIM.pickups[i]; p.t += dt;

    p.vh -= 14 * dt; p.h += p.vh * dt; if (p.h < 0.28) { p.h = 0.28; p.vh = Math.abs(p.vh) > 1 ? -p.vh * 0.35 : 0; }

      const d = dist(p.x, p.y, P.x, P.y);
      if (want && d < mag) { const a = angleTo(p.x, p.y, P.x, P.y), f = (1 - d / mag) * 26 + 4; p.vx += Math.cos(a) * f * dt; p.vy += Math.sin(a) * f * dt; }
      if (want && d < P.hitR + 0.35) { collectPickup(p); p.node.dispose(); SIM.pickups.splice(i, 1); continue; }
    }
    p.x += p.vx * dt; p.y += p.vy * dt;
    const pr = { x: p.x, y: p.y, vx: p.vx, vy: p.vy };
    World.collideCircle(room, pr, 0.2, MASK_PLAYER_LOCKED);
    p.x = pr.x; p.y = pr.y; p.vx = pr.vx; p.vy = pr.vy;
    p.node.position.set(p.x, p.h + Math.sin(p.t * 3 + p.id) * 0.06, -p.y);
    p.node.rotation.y += dt * 2;
  }
}
function collectPickup(p) {
  const P = SIM.player;
  if (p.kind === 'iron') { P.addIron(p.value); sfx('pickup_iron', { rate: rnd(0.95, 1.15) }); burst(p.x, p.y, '#ff8a3a', 4, 2, { life: 0.25, size: 0.05 }); }
  else if (p.kind === 'platelet') { P.heal(1); sfx('pickup_health'); burst(p.x, p.y, '#ffc0d0', 10, 3, { life: 0.4, size: 0.07 }); }
  else if (p.kind === 'mucus') { P.addShield(1); sfx('shield_gain'); burst(p.x, p.y, '#9ad8ff', 10, 3, { life: 0.4, size: 0.07 }); }
}
function clearPickups() { for (const p of SIM.pickups) p.node.dispose(); SIM.pickups.length = 0; }

/* ==========================================================================
   PLAYER DAMAGE
   ========================================================================== */
function hurtPlayer(amount, src = {}) {
  const P = SIM.player;
  if (!P || P.dead || P.invulnT > 0 || P.dashT > 0 || SIM.godMode) return false;
  if (P.shield > 0) { P.shield -= 1; amount = 0; sfx('shield_break'); burst(P.x, P.y, '#9ad8ff', 14, 4, { life: 0.4, size: 0.08 }); }
  else { P.hp -= amount; sfx('hurt'); }
  P.invulnT = 1.0 + (P.st.plateletPlug ? 0.5 : 0);
  P.hurtFlash = 0.3;
  SIM.hitstop = Math.max(SIM.hitstop, 0.08);
  Gfx.addShake(0.55); Gfx.caPulse = 1; Gfx.punch(1); Input.rumble(0.7, 180);
  burst(P.x, P.y, P.color, 16, 4.5, { life: 0.45, size: 0.08 });
  try { if (window.AUDIO) AUDIO.duck(0.5, 0.4); } catch (e) { }
  Bus.emit('playerHurt', amount);
  for (const h of P.hooks.onHurt) h(src);
  SIM.run.stats.hitsTaken++;
  if (P.hp <= 0) P.die();
  return true;
}

/* ==========================================================================
   QUERIES & REGION FORCES
   ========================================================================== */
function nearestEnemy(x, y, maxD, exclude) {
  let best = null, bd = maxD * maxD;
  for (const e of SIM.enemies) {
    if (e.dead || e.spawning > 0 || e.untargetable) continue;
    if (exclude && exclude.has(e.id)) continue;
    const d = dist2(x, y, e.x, e.y); if (d < bd) { bd = d; best = e; }
  }
  return best;
}
/** room flow field (veins currents / lung breath). k scales the push */
function applyFlow(o, dt, k) {
  const f = SIM.room && SIM.room.force; if (!f) return;
  o.x += f.x * dt * k; o.y += f.y * dt * k;
}

<script>/* src/player.js */
/* ==========================================================================
   SPLEEN: SEPSIS — player.js

"use strict";

const DASH_SPEED = 16, DASH_TIME = 0.17, DASH_CD = 0.72;

function freshStats(def, run) {
  const perks = (window.META && META.perks) || {};
  return {
    maxHp: def.hp + (perks.hp || 0) - (run && run.fever >= 4 ? 1 : 0),
    dmgMult: 1, fireMult: 1, shotSpeedMult: 1, rangeMult: 1, speedMult: 1, sizeMult: 1,
    pierce: def.weapon === 'lance' ? 2 : 0, bounce: 0, homing: def.weapon === 'antibody' ? 0.6 : 0,
    parallel: 0, spread: 0, knock: 1, crit: def.crit || 0, critMult: 2,
    abilityCdMult: 1 - 0.08 * (perks.ability || 0), ironMult: 1, magnet: 2.4,
    burn: 0, poison: 0, slow: 0, stun: 0, chain: 0, shotBlast: 0, splitHit: 0, splitWall: false, hitboxMult: 1,
    dashCdMult: 1, dashClears: false, biofilm: false, adrenal: false, shieldPerFloor: 0, healOnClear: 0,
    execute: 0, opsonin: false, complement: 0, cytokine: false, phage: 0, deathBlast: false, contactAura: 0,
    noHeal: false, enemySpeedMult: 1, enemyHpMult: 1, warburg: false, oncogene: false, plateletPlug: false,
    plateletDrop: 0, speciesBonus: false, satellites: 0, helpers: 0, mastcells: 0, blastRadiusMult: 1,
    dotMult: 1, bounceDmg: 0, companionMult: 1, blastChain: false,
  };
}

function makePlayer(strainId, run) {
  const def = STRAINS[strainId];
  const P = {
    strain: def, x: 8.5, y: 5.5, vx: 0, vy: 0, color: def.color,
    hp: 0, shield: 0, iron: 0, mutations: [], counts: {}, st: null, hooks: null,
    fireT: 0, charge: 0, chargeHeld: false, lastFire: 0, dashT: 0, dashCd: 0, dashDX: 1, dashDY: 0,
    invulnT: 0, hurtFlash: 0, abilityT: 0, abilityMax: def.abilityCd, abilityReadyPlayed: true,
    aimAng: 0, node: null, vis: null, dead: false, revives: 0, reviveHp: [],
    volley: 0, adrenalShots: 0, cytokineStacks: 0, species: new Set(), synergies: {}, run,
    auraTick: 0, bioT: 0, engulf: null, walkT: 0, maxHpPaid: 0,

  P.recompute = function () {

    for (const id of P.mutations) { const m = MUT[id]; if (m && m.apply) m.apply(st, P); }
    // synergies
    const owned = new Set(P.mutations);
    for (const s of SYNERGIES) {
      if (s.req.every(r => owned.has(r))) {
        s.apply(st);
        if (!P.synergies[s.id]) { P.synergies[s.id] = true; Bus.emit('synergy', s); }
      }
    }

      for (let k = 0; k < st.phage; k++) {

    });

      addRing(P.x, P.y, 3, '#ffc0d0', 0.4);
      for (const e of SIM.enemies) if (!e.dead && dist2(e.x, e.y, P.x, P.y) < 9) dealDamage(e, P.baseDmg() * 2, { x: P.x, y: P.y, vx: e.x - P.x, vy: e.y - P.y, knock: 3, src: 'plug' });

  };
  function explodeStorm(x, y, r, dmg, chain) {
    burst(x, y, '#ffd36b', 16, r * 4, { life: 0.35, size: 0.09 });
    addRing(x, y, r, '#ffd36b', 0.3);
    sfx('explosion', { vol: 0.5, rate: rnd(1.1, 1.4) });
    Gfx.addShake(0.2);
    for (const e of SIM.enemies) if (!e.dead && e.spawning <= 0 && dist2(e.x, e.y, x, y) < (r + e.r) ** 2) dealDamage(e, dmg, { x, y, vx: e.x - x, vy: e.y - y, knock: 1.2, src: 'stormblast', silent: true });
    if (chain) { const t = nearestEnemy(x, y, 4); if (t) chainLightning(t, dmg * 0.5, 2, new Set()); }
  }
  function clearNearbyShots(x, y, r) {
    for (let i = SIM.eshots.length - 1; i >= 0; i--) { const s = SIM.eshots[i]; if (dist2(s.x, s.y, x, y) < r * r) { burst(s.x, s.y, '#ffc0d0', 2, 2, { life: 0.2 }); SIM.eshots.splice(i, 1); } }
  }

  P.baseDmg = function () {
    let d = def.dmg * P.st.dmgMult;
    if (P.st.oncogene) d *= 1 + 0.04 * (run.stats.roomsCleared || 0);
    if (P.st.cytokine) d *= 1 + 0.04 * P.cytokineStacks;
    if (P.st.speciesBonus) d *= 1 + Math.min(0.4, 0.04 * P.species.size);

  };
  P.memoryBonus = function (type) {
    const kills = (META.codex && META.codex[type]) || 0;
    const cap = META.perks && META.perks.memtcell ? 0.2 : 0.1;
    const per = META.perks && META.perks.memtcell ? 0.002 : 0.001;

  };

  P.range = () => def.range * P.st.rangeMult;
  P.speed = () => def.speed * P.st.speedMult;

  P.heal = function (n) {
    if (P.st && P.st.noHeal && n < 50) return;
    const before = P.hp; P.hp = Math.min(P.st ? P.st.maxHp : def.hp, P.hp + n);
    if (P.hp > before) { sfx('heal'); Bus.emit('heal'); }
  };
  P.addShield = function (n) { P.shield = Math.min(6, P.shield + n); Bus.emit('shield'); };
  P.addIron = function (n, raw) { const v = raw ? n : Math.round(n * (P.st ? P.st.ironMult : 1) * 10) / 10; P.iron += v; run.stats.ironGained += v; Bus.emit('iron'); };

  /* ---------------- mutations ---------------- */
  P.addMutation = function (id, silent) {

  };

  P.update = function (dt) {
    if (P.dead) return;

    P.hurtFlash = Math.max(0, P.hurtFlash - dt);
    P.dashCd = Math.max(0, P.dashCd - dt);

    if (P.abilityT > 0) { P.abilityT = Math.max(0, P.abilityT - dt); if (P.abilityT === 0 && !P.abilityReadyPlayed) { P.abilityReadyPlayed = true; sfx('ability_ready'); Bus.emit('abilityReady'); } }

      let best = null, bs = 0.22;
      for (const e of SIM.enemies) {
        if (e.dead || e.spawning > 0) continue;
        const a = angleTo(P.x, P.y, e.x, e.y), d = Math.abs(angDiff(Math.atan2(aimY, aimX), a));
        if (d < bs && dist2(P.x, P.y, e.x, e.y) < 120) { bs = d; best = a; }
      }
      if (best != null) { const a0 = Math.atan2(aimY, aimX), a = a0 + angDiff(a0, best) * 0.6; aimX = Math.cos(a); aimY = Math.sin(a); }
    }
    if (inp.aimActive || inp.device === 'kbm') P.aimAng = Math.atan2(aimY, aimX);
    // --- engulf lunge overrides movement
    if (P.engulf) { updateEngulf(dt); }
    else if (P.dashT > 0) {
      P.dashT -= dt;
      P.vx = P.dashDX * DASH_SPEED; P.vy = P.dashDY * DASH_SPEED;
      if (st.biofilm) { P.bioT -= dt; if (P.bioT <= 0) { P.bioT = 0.045; spawnZone(P.x, P.y, 0.6, 2.4, 'bio', { owner: 'player', dps: P.baseDmg() * 1.1 }); } }
      if (Math.random() < 0.7) burst(P.x, P.y, P.color, 1, 0.5, { life: 0.3, size: 0.1, grav: 0, h: 0.5 });
    } else {
      const sp = P.speed() * (P.chargeHeld && def.weapon === 'lance' ? 0.78 : 1);
      const tx = inp.move.x * sp, ty = inp.move.y * sp;
      const k = damp(inp.move.x || inp.move.y ? 14 : 10, dt);
      P.vx = lerp(P.vx, tx, k); P.vy = lerp(P.vy, ty, k);
      // dash
      if (inp.dash && P.dashCd <= 0) startDash();
    }
    // move + collide
    applyFlow(P, dt, 0.55);
    P.x += P.vx * dt; P.y += P.vy * dt;
    World.collideCircle(room, P, P.hitR + 0.04, SIM.roomLocked ? MASK_PLAYER_LOCKED : MASK_PLAYER_OPEN);
    // acid floor
    if (World.tile(room, Math.floor(P.x), Math.floor(P.y)) === T_ACID && P.dashT <= 0) hurtPlayer(1, { kind: 'acid' });
    // --- shooting
    updateWeapon(dt);
    // --- ability
    if (inp.ability && SIM.combatAllowed) {
      if (P.abilityT <= 0) useAbility();
      else { sfx('ui_error', { vol: 0.4 }); }
    }
    // --- contact with enemies
    for (const e of SIM.enemies) {
      if (e.dead || e.spawning > 0 || e.harmless || e.burrowed) continue;
      const rr = e.r * 0.85 + P.hitR;
      if (dist2(e.x, e.y, P.x, P.y) < rr * rr) {
        if (!P.engulf) hurtPlayer(1, { x: e.x, y: e.y, kind: 'contact', enemy: e });
      }
    }
    if (st.contactAura) {
      P.auraTick += dt;
      if (P.auraTick >= 0.25) {
        P.auraTick = 0;
        for (const e of SIM.enemies) if (!e.dead && e.spawning <= 0 && dist2(e.x, e.y, P.x, P.y) < (e.r + P.hitR + 0.5) ** 2) dealDamage(e, P.baseDmg() * st.contactAura * 0.25, { dot: true, dotHex: '#c06bff', src: 'aura' });
      }
    }
    updateCompanions(dt);
  };

  function startDash() {
    let dx = Input.move.x, dy = Input.move.y; const l = Math.hypot(dx, dy);
    if (l < 0.2) { dx = Math.cos(P.aimAng); dy = Math.sin(P.aimAng); } else { dx /= l; dy /= l; }
    P.dashDX = dx; P.dashDY = dy; P.dashT = DASH_TIME; P.dashCd = DASH_CD * P.st.dashCdMult;
    sfx('dash', { rate: rnd(0.95, 1.05) });
    if (P.st.adrenal) P.adrenalShots = 3;
    for (const h of P.hooks.onDash) h();
    run.stats.dashes++;
  }

  /* ---------------- weapons ---------------- */
  function multishotK(n) { return Math.pow(n, 0.7) / n; }
  function critRoll() { return Math.random() < P.st.crit; }
  function shotFlags() {
    const st = P.st;
    return { burn: st.burn, poison: st.poison, slow: st.slow, stun: st.stun, chain: st.chain, blast: st.shotBlast, splitHit: st.splitHit, splitWall: st.splitWall, opsonin: st.opsonin };
  }
  function volleyDmgMult() {
    let k = 1;
    if (P.adrenalShots > 0) { k *= 1.7; P.adrenalShots--; }
    return k;
  }
  function muzzle(ang) { return { x: P.x + Math.cos(ang) * (P.hitR + 0.12), y: P.y + Math.sin(ang) * (P.hitR + 0.12) }; }

  function updateWeapon(dt) {
    P.fireT = Math.max(0, P.fireT - dt);
    const canFire = SIM.combatAllowed && !P.engulf;
    const firing = Input.firing && canFire;
    if (def.weapon === 'lance') {
      const rate = P.fireRate();
      if (firing) {
        P.chargeHeld = true;
        const before = P.charge;
        P.charge = Math.min(1, P.charge + rate * dt);
        if (before < 1 && P.charge >= 1) sfx('charge_tcell', { vol: 0.5, rate: 1.2 });
        if (P.charge >= 1 && P.fireT <= 0) { fireLance(1); P.charge = 0; }
      } else if (P.chargeHeld) {
        P.chargeHeld = false;
        if (P.fireT <= 0) fireLance(P.charge);
        P.charge = 0;
      }
      return;
    }
    if (firing && P.fireT <= 0) {
      P.fireT = 1 / P.fireRate();
      if (def.weapon === 'spray') fireSpray(); else fireStream();
    }
  }
  function fireStream() {
    const st = P.st, isAnti = def.weapon === 'antibody';
    const nPar = 1 + st.parallel, nSpr = 1 + st.spread, n = nPar * nSpr;
    const dmg = P.baseDmg() * multishotK(n) * volleyDmgMult();
    const spd = P.shotSpeed(), life = P.range() / spd;
    const fan = Math.min(0.85, 0.2 * (nSpr - 1));
    const flags = shotFlags();
    const r = 0.15 * def.shotSize * st.sizeMult;
    for (let si = 0; si < nSpr; si++) {
      const a = P.aimAng + (nSpr === 1 ? 0 : (si / (nSpr - 1) - 0.5) * fan) + (isAnti ? rnd(-0.06, 0.06) : 0);
      for (let pi = 0; pi < nPar; pi++) {
        const off = (pi - (nPar - 1) / 2) * 0.24;
        const m = muzzle(a);
        const crit = critRoll();
        spawnPShot(m.x - Math.sin(a) * off, m.y + Math.cos(a) * off, a, {
          speed: spd * (isAnti ? rnd(0.92, 1.05) : 1), r, dmg: dmg * (crit ? st.critMult : 1), life, style: isAnti ? 'anti' : 'neut',
          pierce: st.pierce, bounce: st.bounce, homing: st.homing, crit, flags, latch: isAnti, knock: isAnti ? 0.5 : 1,
        });
      }
    }
    complementShot(dmg / multishotK(n));
    sfx(isAnti ? 'shoot_bcell' : 'shoot_neutrophil', { vol: 0.55, rate: rnd(0.94, 1.06) });
    P.lastFire = SIM.time; P.recoil = 1;
    run.stats.shots++;
  }
  function fireSpray() {
    const st = P.st;
    const n = def.pellets + 2 * st.parallel + 2 * st.spread;
    const dmg = P.baseDmg() * (multishotK(n / def.pellets)) * volleyDmgMult();
    const spd = P.shotSpeed(), life = P.range() / spd;
    const cone = def.cone * (1 + 0.25 * st.spread);
    const flags = shotFlags();
    for (let i = 0; i < n; i++) {
      const a = P.aimAng + rnd(-cone / 2, cone / 2);
      const m = muzzle(a); const crit = critRoll();
      spawnPShot(m.x, m.y, a, {
        speed: spd * rnd(0.8, 1.12), r: 0.14 * st.sizeMult * rnd(0.85, 1.2), dmg: dmg * (crit ? st.critMult : 1), life: life * rnd(0.85, 1.1), style: 'spray',
        pierce: st.pierce, bounce: st.bounce, homing: st.homing, crit, flags, knock: 0.8, decel: 1.2,
      });
    }
    complementShot(dmg * 2);
    sfx('shoot_macrophage', { vol: 0.7, rate: rnd(0.94, 1.06) });
    Gfx.addShake(0.08);
    P.vx -= Math.cos(P.aimAng) * 1.5; P.vy -= Math.sin(P.aimAng) * 1.5;
    P.lastFire = SIM.time; P.recoil = 1; run.stats.shots++;
  }
  function fireLance(charge) {
    const st = P.st;
    const full = charge >= 0.98;
    const k = full ? 1 : Math.max(0.2, charge * 0.75);
    const nPar = 1 + st.parallel, nSpr = 1 + st.spread, n = nPar * nSpr;
    const dmg = P.baseDmg() * k * multishotK(n) * volleyDmgMult();
    const spd = P.shotSpeed() * (0.6 + 0.4 * Math.max(charge, 0.3));
    const life = P.range() / spd;
    const flags = shotFlags();
    const fan = Math.min(0.8, 0.18 * (nSpr - 1));
    for (let si = 0; si < nSpr; si++) {
      const a = P.aimAng + (nSpr === 1 ? 0 : (si / (nSpr - 1) - 0.5) * fan);
      for (let pi = 0; pi < nPar; pi++) {
        const off = (pi - (nPar - 1) / 2) * 0.26, m = muzzle(a), crit = critRoll();
        spawnPShot(m.x - Math.sin(a) * off, m.y + Math.cos(a) * off, a, {
          speed: spd, r: (full ? 0.17 : 0.12) * st.sizeMult, dmg: dmg * (crit ? st.critMult : 1), life, style: full ? 'lance' : 'lanceS',
          pierce: full ? st.pierce : Math.max(0, st.pierce - 2), bounce: st.bounce, homing: st.homing, crit, flags, knock: full ? 1.6 : 0.6,
        });
      }
    }
    if (full) { complementShot(dmg / multishotK(n)); Gfx.addShake(0.12); }
    sfx(full ? 'shoot_tcell_charged' : 'shoot_tcell', { vol: full ? 0.8 : 0.5, rate: rnd(0.95, 1.05) });
    P.fireT = full ? 0.08 : 0.26;
    P.lastFire = SIM.time; P.recoil = full ? 1.5 : 0.6; run.stats.shots++;
  }
  function complementShot(dmg) {
    const st = P.st; if (!st.complement) return;
    P.volley++;
    if (P.volley % st.complement !== 0) return;
    const m = muzzle(P.aimAng);
    spawnPShot(m.x, m.y, P.aimAng, { speed: P.shotSpeed() * 0.85, r: 0.3 * st.sizeMult, dmg: dmg * 3, life: P.range() * 1.2 / (P.shotSpeed() * 0.85), style: 'big', pierce: 99, homing: st.homing, flags: shotFlags(), knock: 2 });
  }

  /* ---------------- abilities ---------------- */
  function useAbility() {
    P.abilityT = P.abilityMax; P.abilityReadyPlayed = false;
    run.stats.abilities++;
    const a = def.ability;
    if (a === 'net') {
      const range = 6.5;
      let tx = P.x + Math.cos(P.aimAng) * range, ty = P.y + Math.sin(P.aimAng) * range;
      if (Input.device === 'kbm' && Input.mouseWorld && !Input.arrowAim) {
        const d = dist(P.x, P.y, Input.mouseWorld.x, Input.mouseWorld.y);
        if (d < range) { tx = Input.mouseWorld.x; ty = Input.mouseWorld.y; }
      }
      const land = World.nearestOpen(SIM.room, tx, ty);
      const lx = clamp(land.x, 1.5, SIM.room.W - 1.5), ly = clamp(land.y, 1.5, SIM.room.H - 1.5);
      sfx('ability_net');
      spawnLob(P.x, P.y, lx, ly, 0.32, { hex: '#bff8ff', size: 0.3, tele: false, peak: 1.8, onLand: (x, y) => {
        spawnZone(x, y, 2.5, 4.5, 'net', { owner: 'player', slow: 0.65, dps: P.baseDmg() * 1.5 });
        addRing(x, y, 2.5, '#bff8ff', 0.4);
        for (const e of SIM.enemies) if (!e.dead && dist2(e.x, e.y, x, y) < 2.5 * 2.5) dealDamage(e, P.baseDmg() * 1.2, { x, y, knock: 0.2, src: 'net' });
        sfx('acid', { vol: 0.5, rate: 1.4 });
      } });
    } else if (a === 'engulf') {
      sfx('ability_engulf');
      P.engulf = { t: 0, dur: 0.28, dx: Math.cos(P.aimAng), dy: Math.sin(P.aimAng), hit: new Set(), kills: 0 };
      P.invulnT = Math.max(P.invulnT, 0.4);
    } else if (a === 'mark') {
      sfx('ability_mark');
      let n = 0;
      for (const e of SIM.enemies) if (!e.dead && e.spawning <= 0) { e.markT = 6; n++; burst(e.x, e.y, '#9dff7a', 6, 2, { life: 0.4, size: 0.07, up: 3 }); }
      addRing(P.x, P.y, 6, '#9dff7a', 0.5);
      Gfx.caPulse = 0.4;
    } else if (a === 'swarm') {
      sfx('ability_swarm');
      for (let i = 0; i < 14; i++) {
        const ang = i / 14 * TAU;
        spawnPShot(P.x + Math.cos(ang) * 0.6, P.y + Math.sin(ang) * 0.6, ang, { speed: 6.5, r: 0.13, dmg: P.baseDmg() * 1.6, life: 6, style: 'anti', homing: 1.6, latch: true, knock: 0.4, pierce: 1 });
      }
      addRing(P.x, P.y, 2, '#c9bcff', 0.4);
    }
    Bus.emit('ability', a);
  }
  function updateEngulf(dt) {
    const E = P.engulf; E.t += dt;
    const sp = 15;
    P.vx = E.dx * sp; P.vy = E.dy * sp;
    if (Math.random() < 0.9) burst(P.x, P.y, P.color, 2, 1, { life: 0.3, size: 0.1, grav: 0, h: 0.5 });
    for (const e of SIM.enemies) {
      if (e.dead || e.spawning > 0 || E.hit.has(e.id)) continue;
      if (dist2(e.x, e.y, P.x, P.y) < (e.r + P.hitR + 0.55) ** 2) {
        E.hit.add(e.id);
        const dmg = P.baseDmg() * 16 * (e.isBoss ? 0.5 : 1);
        dealDamage(e, dmg, { x: P.x, y: P.y, vx: E.dx, vy: E.dy, knock: 2, src: 'engulf' });
        if (e.dead) { E.kills++; burst(e.x, e.y, e.color, 12, 3, { life: 0.4 }); }
        SIM.hitstop = Math.max(SIM.hitstop, 0.04);
      }
    }
    if (E.t >= E.dur) {
      if (E.kills >= 3) { P.heal(1); Gfx.floatText(P.x, P.y, 'DIGESTED +1', '#ffc27a', 14, { h: 1.8 }); }
      P.engulf = null; P.vx *= 0.3; P.vy *= 0.3;
    }
  }

  /* ---------------- death & revive ---------------- */
  P.die = function () {
    if (P.revives > 0) {
      P.revives--; const hp = P.reviveHp.shift() || 3;
      P.hp = Math.min(P.st.maxHp, hp); P.invulnT = 2.5;
      sfx('revive'); addRing(P.x, P.y, 5, '#ffffff', 0.6); Gfx.caPulse = 1;
      clearEShots(true);
      for (const e of SIM.enemies) if (!e.dead && dist2(e.x, e.y, P.x, P.y) < 25 && !e.isBoss) { e.kx += (e.x - P.x) * 3; e.ky += (e.y - P.y) * 3; }
      Bus.emit('revive');
      return;
    }
    P.dead = true; P.hp = 0;
    sfx('death');
    burst(P.x, P.y, P.color, 40, 6, { life: 0.9, size: 0.12, up: 4 });
    Gfx.splat(SIM.room, P.x, P.y, 1.2, P.color, 0.7);
    Gfx.addShake(0.8);
    Bus.emit('playerDied');
  };

  /* ---------------- killing ---------------- */
  P.onKill = function (e) {
    run.stats.kills++;
    if (e.isBoss) return;
    P.species.add(e.type);
    P.abilityT = Math.max(0, P.abilityT - (e.elite ? 0.8 : 0.4));
    run.killsByType[e.type] = (run.killsByType[e.type] || 0) + 1;
  };

  /* ---------------- companions ---------------- */
  function syncCompanions() {
    const st = P.st;
    const want = { satellite: st.satellites, helper: st.helpers, mast: st.mastcells };
    for (const kind in want) {
      const have = SIM.companions.filter(c => c.kind === kind);
      for (let i = have.length; i < want[kind]; i++) SIM.companions.push(makeCompanion(kind, i));
    }
  }
  function makeCompanion(kind, idx) {
    const c = { kind, idx, x: P.x, y: P.y, r: 0.22, t: rnd(0, 10), fireT: 0.5, blocks: kind === 'satellite', tick: 0, pulseT: 3 };
    c.node = buildCompanionVis(kind);
    return c;
  }
  P.respawnCompanions = function () {
    for (const c of SIM.companions) { c.node.dispose(); }
    SIM.companions.length = 0; syncCompanions();
    for (const c of SIM.companions) { c.x = P.x; c.y = P.y; }
  };
  function updateCompanions(dt) {
    const st = P.st, sats = SIM.companions.filter(c => c.kind === 'satellite');
    const others = SIM.companions.filter(c => c.kind !== 'satellite');
    for (const c of SIM.companions) {
      c.t += dt;
      if (c.kind === 'satellite') {
        const n = sats.length, a = SIM.time * 2.6 + (sats.indexOf(c) / n) * TAU;
        c.x = P.x + Math.cos(a) * 1.15; c.y = P.y + Math.sin(a) * 1.15;
        c.tick += dt;
        if (c.tick >= 0.25) {
          c.tick = 0;
          for (const e of SIM.enemies) if (!e.dead && e.spawning <= 0 && dist2(e.x, e.y, c.x, c.y) < (e.r + c.r + 0.1) ** 2) dealDamage(e, P.baseDmg() * 1.0 * st.companionMult, { x: c.x, y: c.y, knock: 0.6, src: 'satellite', silent: true });
        }
      } else {
        const i = others.indexOf(c), n = others.length;
        const behind = P.aimAng + Math.PI + (n > 1 ? (i / (n - 1) - 0.5) * 1.6 : 0);
        const tx = P.x + Math.cos(behind) * 1.1, ty = P.y + Math.sin(behind) * 1.1;
        const k = damp(5, dt); c.x = lerp(c.x, tx, k); c.y = lerp(c.y, ty, k);
        if (c.kind === 'helper' && SIM.combatAllowed) {
          c.fireT -= dt;
          const tgt = nearestEnemy(c.x, c.y, 9);
          if (tgt && c.fireT <= 0) {
            c.fireT = 0.5;
            const a = angleTo(c.x, c.y, tgt.x, tgt.y);
            spawnPShot(c.x, c.y, a, { speed: 11, r: 0.11, dmg: P.baseDmg() * 0.45 * st.companionMult, life: 0.8, style: 'helper', homing: 0.3, knock: 0.4, owner: 'helper' });
            sfx('shoot_helper', { vol: 0.35, rate: rnd(0.95, 1.1) });
          }
        } else if (c.kind === 'mast' && SIM.combatAllowed) {
          c.pulseT -= dt;
          if (c.pulseT <= 0) {
            c.pulseT = 3;
            const R = 2.7;
            addRing(c.x, c.y, R, '#ffd36b', 0.4);
            let any = false;
            for (const e of SIM.enemies) if (!e.dead && e.spawning <= 0 && dist2(e.x, e.y, c.x, c.y) < (R + e.r) ** 2) { any = true; dealDamage(e, P.baseDmg() * 2.6 * st.companionMult, { x: c.x, y: c.y, vx: e.x - c.x, vy: e.y - c.y, knock: 2.2, src: 'mast' }); }
            if (any) sfx('stun', { vol: 0.4, rate: 1.5 });
          }
        }
      }
      c.node.position.set(c.x, 0.55 + Math.sin(c.t * 3) * 0.08, -c.y);
      c.node.rotation.y += dt * 1.5;
    }
  }

  P.recompute();
  P.hp = P.st.maxHp;
  return P;
}

/* ---------------- visuals ---------------- */
function buildPlayerVis(def) {
  const root = Gfx.node('player');
  const body = Gfx.node('pbody'); body.parent = root;
  const id = def.id;
  const mem = Gfx.cellMat(def.color, { rim: 1.5, core: 0.32, glow: 0.45, dark: 0.55, alpha: 0.62, power: 1.6 });
  const nucMat = Gfx.cellMat(def.nucleus, { rim: 1.3, core: 0.55, glow: 0.4, dark: 0.7 });
  const R = id === 'macrophage' ? 0.46 : id === 'tcell' ? 0.36 : 0.4;
  const vis = { root, body, parts: {}, R };
  vis.parts.mem = Gfx.part('sphere', mem, body, 0, R, 0, R);
  // pseudopod toward aim (+X)
  vis.parts.pod = Gfx.part('sphere', mem, body, R * 0.7, R * 0.9, 0, R * 0.45);
  if (id === 'neutrophil') {
    vis.parts.nuc = [Gfx.part('sphere', nucMat, body, -0.08, R, 0.08, 0.13), Gfx.part('sphere', nucMat, body, 0.06, R, 0.1, 0.11), Gfx.part('sphere', nucMat, body, 0.02, R, -0.1, 0.12)];
    const gm = Gfx.glowMat('#e8ffff', { glow: 0.5 });
    for (let i = 0; i < 7; i++) { const a = i / 7 * TAU; Gfx.part('sphereLo', gm, body, Math.cos(a) * R * 0.6, R + Math.sin(a * 2) * 0.1, Math.sin(a) * R * 0.6, 0.03); }
  } else if (id === 'macrophage') {
    vis.parts.nuc = [Gfx.part('sphere', nucMat, body, -0.05, R, 0, 0.18, 0.15, 0.22)];
    const lobe = Gfx.cellMat(def.color, { rim: 1.5, core: 0.32, glow: 0.4, dark: 0.55, alpha: 0.65 });
    vis.parts.lobes = [];
    for (let i = 0; i < 5; i++) { const a = i / 5 * TAU + 0.5; vis.parts.lobes.push(Gfx.part('sphere', lobe, body, Math.cos(a) * R * 0.75, R * 0.85, Math.sin(a) * R * 0.75, R * 0.38)); }
    const vac = Gfx.glowMat('#ffe7b0', { glow: 0.4, alpha: 0.8 });
    for (let i = 0; i < 4; i++) Gfx.part('sphereLo', vac, body, rnd(-0.2, 0.2), R + 0.05, rnd(-0.2, 0.2), 0.05);
  } else if (id === 'tcell') {
    vis.parts.nuc = [Gfx.part('sphere', nucMat, body, 0, R, 0, R * 0.62)];
    const sp = Gfx.glowMat('#d8ffe8', { glow: 0.6 });
    for (let i = 0; i < 10; i++) {
      const a = i / 10 * TAU, m = Gfx.part('cone', sp, body, Math.cos(a) * R * 0.98, R, Math.sin(a) * R * 0.98, 0.025, 0.07, 0.025);
      m.rotation.z = -Math.PI / 2; m.rotation.y = -a;
    }
  } else {
    vis.parts.nuc = [Gfx.part('sphere', nucMat, body, -0.03, R, 0, R * 0.55)];
    const ym = Gfx.glowMat('#e8e0ff', { glow: 0.55 });
    for (let i = 0; i < 8; i++) {

<script>/* src/enemies.js */
/* ==========================================================================
   SPLEEN: SEPSIS — enemies.js
   Pathogen construction, visuals, AI behaviours, elites, encounters and
   region mechanics. Every attack is telegraphed (wind-up, glow, or ground
   marker) so deaths are always readable.
   ========================================================================== */
"use strict";

/* ---------------- creation ---------------- */
function floorHpMult() {
  const f = SIM.floor ? SIM.floor.idx : 0, run = SIM.run;
  let m = 1 + 0.34 * f;
  if (run && run.fever >= 1) m *= 1.2;
  if (SIM.player) m *= SIM.player.st.enemyHpMult;
  return m;
}
function spawnEnemy(type, x, y, o = {}) {
  const def = ENEMIES[type];
  const e = {
    id: nextId(), type, def, x, y, vx: 0, vy: 0, kx: 0, ky: 0,
    r: (o.r || def.r), fly: !!def.fly, color: def.color, core: def.core, cost: def.cost || 1,
    state: 0, t: 0, cd: rnd(0.6, 1.6), facing: angleTo(x, y, SIM.player.x, SIM.player.y),
    spawning: o.instant ? 0 : 0.75, spawnMax: 0.75, elite: null, capsule: 0, data: {}, mass: 1,
    rate: 1, speedK: 1, dead: false, summoned: !!o.summoned, zoneSlow: 1,
  };

  if (o.elite) {
    e.elite = o.elite; hp *= 1.7;
    if (o.elite === 'swollen') { hp *= 1.45; e.r *= 1.3; e.speedK = 0.85; e.mass = 2; }
    if (o.elite === 'frenzied') { e.speedK = 1.35; e.rate = 1.45; }
    if (o.elite === 'encapsulated') e.capsule = hp * 0.5;

  e.mass = e.mass * (e.r / 0.4);

  e.vis = vis; e.node = vis.root;
  if (e.elite) {
    const ec = ELITES[e.elite].color;
    const ring = Gfx.part('torus', Gfx.glowMat(ec, { glow: 0.9, alpha: 0.9 }), e.node, 0, 0.05, 0, e.r * 1.25, 1, e.r * 1.25);
    vis.eliteRing = ring;
    if (vis.body) Gfx.setOutline(vis.body, true, ec, 0.035);
  }
  e.node.position.set(x, 0, -y);
  if (AI_INIT[def.ai]) AI_INIT[def.ai](e, o);
  if (ON_DEATH[type]) e.onDeath = ON_DEATH[type];
  if (e.spawning > 0) { addRing(x, y, e.r * 1.6, e.color, 0.5); burst(x, y, e.color, 8, 2, { life: 0.5, size: 0.07, up: 2 }); }
  SIM.enemies.push(e);

}

/* ---------------- shared movement helpers ---------------- */
const P_ = () => SIM.player;
function toPlayer(e) { const P = P_(); return { a: angleTo(e.x, e.y, P.x, P.y), d: dist(e.x, e.y, P.x, P.y) }; }
function setVel(e, ang, speed) { e.vx = Math.cos(ang) * speed; e.vy = Math.sin(ang) * speed; }
/** move toward the player, using the flow field when there is no straight line */
function chase(e, speed) {
  const P = P_();
  if (e.fly || World.los(SIM.room, e.x, e.y, P.x, P.y, MASK_WALKER & ~bit(T_DOOR))) { setVel(e, angleTo(e.x, e.y, P.x, P.y), speed); return; }
  const f = World.flowDir(SIM.room, e.x, e.y);

/* ==========================================================================
   AI BEHAVIOURS
   ========================================================================== */
const AI_INIT = {
  splitter: (e, o) => { if (e.data.size == null) e.data.size = 2; },
  synapse: (e, o) => { e.data.partner = o.partner || null; e.data.phase = 0; e.data.pt = rnd(0.5, 1.5); },
  bouncer: (e) => { const a = rndPick([0.785, 2.356, 3.927, 5.498]) + rnd(-0.2, 0.2); e.data.dx = Math.cos(a); e.data.dy = Math.sin(a); },
  worm: (e) => { e.data.hist = []; e.data.ph = rnd(0, TAU); },

const AI = {
  chase(e, dt, k) {
    const wob = Math.sin(SIM.time * 3 + e.id) * 0.25;

      if (!e.data.tele) e.data.tele = telegraph({ kind: 'line', x: e.x, y: e.y, ang: e.data.ang, len: 5.5, w: e.r * 2, dur: e.t, owner: e, follow: (t) => { t.x = e.x; t.y = e.y; t.ang = e.data.ang; } });
      if (e.t <= 0) { e.state = 2; e.t = 0.55; e.data.tele = null; sfx('charge', { rate: rnd(0.9, 1.1) }); }
    } else if (e.state === 2) {

      if (e.t <= 0 || e.data.bonk) { e.state = 3; e.t = 0.6; e.data.bonk = false; }

  virion(e, dt, k) {

  },

      if (e.cd <= 0 && toPlayer(e).d < 7) { e.state = 1; e.t = 0.75; telegraph({ kind: 'disc', x: e.x, y: e.y, r: 1.6, dur: 0.75, warm: true, owner: e, follow: (t) => { t.x = e.x; t.y = e.y; } }); }

    const m = Gfx.part('sphere', Gfx.cellMat(e.color, { rim: 1.6, core: 0.4, glow: 0.45 }), b, 0, 0.9, 0, r * 0.8);
    const dm = Gfx.glowMat('#cfe0ff', { glow: 0.5 });
    for (let i = 0; i < 6; i++) { const a = i / 6 * TAU; const c = Gfx.part('cyl', dm, b, Math.cos(a) * r * 0.9, 0.9, Math.sin(a) * r * 0.9, 0.03, r * 0.4, 0.03); c.rotation.z = Math.PI / 2; c.rotation.y = -a; }
    return { root, body: m, anim(e, t) { b.rotation.y += 0.01; b.position.y = Math.sin(t * 2 + e.id) * 0.08; } };
  },
  plaque(e) {

    const m = Gfx.part('icoFlat', Gfx.cellMat(e.color, { rim: 1.2, core: 0.25, glow: 0.2, dark: 0.6 }), b, 0, r * 0.85, 0, r, r * 0.85, r);
    for (let i = 0; i < 5; i++) Gfx.part('icoFlat', Gfx.cellMat('#a080d8', { rim: 1.2, core: 0.3, glow: 0.15 }), b, rnd(-0.6, 0.6) * r, r * rnd(0.6, 1.3), rnd(-0.6, 0.6) * r, r * rnd(0.25, 0.4));
    return { root, body: m, anim(e, t) { const w = e.data.wind ? 1 + Math.sin(t * 30) * 0.08 : 1; b.scaling.set(w, 1 / w, w); } };
  },
  rotcarrier(e) {
    const { root, b } = V(e), r = e.r;
    const m = Gfx.part('sphere', Gfx.cellMat(e.color, { rim: 1.3, core: 0.3, glow: 0.3, dark: 0.45 }), b, 0, r, 0, r);
    const pm = Gfx.cellMat('#ffd03a', { rim: 1.5, core: 0.6, glow: 0.5 });
    const pus = [];
    for (let i = 0; i < 6; i++) { const a = i / 6 * TAU, y = rnd(0.6, 1.5); pus.push(Gfx.part('sphereLo', pm, b, Math.cos(a) * r * 0.85, r * y, Math.sin(a) * r * 0.85, r * 0.2)); }

  turncoat(e) {

    const m = Gfx.part('sphere', Gfx.cellMat(e.color, { rim: 1.6, core: 0.3, glow: 0.4, alpha: 0.65 }), b, 0, r, 0, r);
    const n = Gfx.cellMat('#2a0a20', { rim: 1.4, core: 0.6, glow: 0.2 });

/* ==========================================================================
   UPDATE
   ========================================================================== */
function updateEnemies(dt) {
  const room = SIM.room, P = SIM.player;
  for (let i = SIM.enemies.length - 1; i >= 0; i--) {
    const e = SIM.enemies[i];
    if (e.dead) { disposeEnemy(e); SIM.enemies.splice(i, 1); continue; }
    if (e.spawning > 0) { e.spawning -= dt; animateEnemy(e, dt); continue; }
    updateStatus(e, dt);
    if (e.dead) continue;
    let k = e.speedK * (P ? P.st.enemySpeedMult : 1) * (e.slowT > 0 ? e.slowK : 1) * e.zoneSlow;
    e.zoneSlow = 1;
    if (e.stunT > 0) { e.vx *= 0.8; e.vy *= 0.8; }
    else if (e.isBoss) e.update(e, dt, k);
    else (AI[e.def.ai] || AI.chase)(e, dt, k);
    e.data.bonk = false; // set below by collision; read by the AI on the next step
    // integrate
    const kk = damp(7, dt);
    e.x += (e.vx + e.kx) * dt; e.y += (e.vy + e.ky) * dt;
    e.kx = lerp(e.kx, 0, kk); e.ky = lerp(e.ky, 0, kk);
    if (!e.noCollide) {
      const hit = World.collideCircle(room, e, e.r * 0.9, e.fly ? MASK_FLYER : MASK_WALKER);
      if (hit) e.data.bonk = true;
    }
    // separation
    if (!e.isBoss && !e.burrowed) {
      for (const o of SIM.enemies) {
        if (o === e || o.dead || o.burrowed || o.isBoss || o.fly !== e.fly) continue;
        const dx = e.x - o.x, dy = e.y - o.y, rr = (e.r + o.r) * 0.85, d2 = dx * dx + dy * dy;
        if (d2 < rr * rr && d2 > 1e-6) { const d = Math.sqrt(d2), push = (rr - d) * 0.5; e.x += dx / d * push; e.y += dy / d * push; }

}
function animateEnemy(e, dt) {
  const n = e.node; if (!n) return;
  n.position.set(e.x, 0, -e.y);
  if (e.spawning > 0) {
    const k = 1 - e.spawning / e.spawnMax;
    n.scaling.setAll(Math.max(0.01, easeOutBack(clamp(k, 0, 1))));
    n.position.y = -(1 - k) * e.r;
  } else if (n.scaling.x !== 1 && !e.isBoss) n.scaling.setAll(1);
  if (e.vis.anim) e.vis.anim(e, SIM.time, dt);

  const want = e.hurtT > 0 ? 'hit' : e.markT > 0 ? 'mark' : e.stunT > 0 ? 'stun' : null;
  if (want !== e._ov) {
    e._ov = want;
    if (want === 'hit') Gfx.setOverlay(e.vis.b || n, true, '#ffffff', 0.85);
    else if (want === 'mark') Gfx.setOverlay(e.vis.b || n, true, '#9dff7a', 0.35);
    else if (want === 'stun') Gfx.setOverlay(e.vis.b || n, true, '#ffe066', 0.35);
    else Gfx.setOverlay(e.vis.b || n, false);

}

  if (e.vis && e.vis.dispose) e.vis.dispose();
  if (e.node) { e.node.dispose(); e.node = null; }
}
function clearEnemies() { for (const e of SIM.enemies) disposeEnemy(e); SIM.enemies.length = 0; }

/* ==========================================================================
   ENCOUNTERS
   ========================================================================== */
function rollElite(f, forced) {
  const run = SIM.run;
  let p = f < 1 ? 0 : 0.06 + 0.025 * f;
  if (run && run.fever >= 3) p *= 2;
  if (SIM.floor && SIM.floor.region.mechanic === 'necrosis') p += 0.08;
  if (!forced && Math.random() > p) return null;

}
/** Build the list of spawns for a room (called on first entry). */
function planEncounter(room, floorIdx, rng) {
  const region = REGIONS[floorIdx];
  const sizeK = room.boss ? 1 : [1, 1.75, 2.7][room.cw * room.ch - 1] || 2.7;
  let budget = (5 + 2.3 * floorIdx) * sizeK * rng.range(0.88, 1.15);
  if (floorIdx === 0 && room.distFromStart <= 1) budget *= 0.7;
  if (room.type === 'elite') budget *= 0.75;

  const out = [];
  const counts = {};

  while (budget > 0.9 && guard++ < 60) {
    const opts = pool.filter(([t]) => ENEMIES[t].cost <= budget + 0.01 && (counts[t] || 0) < (ENEMIES[t].cost >= 3 ? 2 : 4) * Math.ceil(sizeK));
    if (!opts.length) break;
    const [t] = rng.weighted(opts, (o) => o[1]);
    counts[t] = (counts[t] || 0) + 1;
    budget -= ENEMIES[t].cost;
    out.push({ type: t });
  }
  if (room.type === 'elite') {
    const big = pool.filter(([t]) => ENEMIES[t].cost >= 2);
    const t = rng.weighted(big, (o) => o[1])[0];
    out.unshift({ type: t, elite: rng.pick(Object.keys(ELITES)), forced: true });
  }
  // waves
  const waves = (floorIdx >= 1 && out.length >= 5 && rng.chance(0.32)) ? 2 : 1;
  const plan = [[], []];
  out.forEach((s, i) => plan[waves === 2 && i >= Math.ceil(out.length * 0.55) ? 1 : 0].push(s));
  return waves === 2 ? plan : [plan[0]];
}
function spawnWave(wave, entryX, entryY) {
  const room = SIM.room, f = SIM.floor.idx;
  for (const s of wave) {
    const def = ENEMIES[s.type];
    const spots = World.spawnSpots(room, entryX, entryY, 5.2, def.fly);
    let p = spots.length ? rndPick(spots) : [room.W / 2, room.H / 2];
    // keep them from stacking on each other
    for (let k = 0; k < 6; k++) { if (SIM.enemies.every(o => dist2(o.x, o.y, p[0], p[1]) > 1.2)) break; p = rndPick(spots) || p; }
    const elite = s.elite || rollElite(f);

      const a = spawnEnemy('synapse', p[0], p[1], { elite });
      const spots2 = spots.filter(q => dist(q[0], q[1], p[0], p[1]) > 3 && dist(q[0], q[1], p[0], p[1]) < 7);
      const q = spots2.length ? rndPick(spots2) : [p[0] + 3, p[1]];

/* ==========================================================================
   REGION MECHANICS
   ========================================================================== */
function setupRoomMechanic(room, floor, rng) {

  if (mech === 'current' && rng.chance(0.4) && !(room.distFromStart <= 1)) {
    const d = rng.pick([[1, 0], [-1, 0], [0, 1], [0, -1]]);
    room.mech = { kind: 'current', dx: d[0], dy: d[1], str: rng.range(1.1, 1.5) };
  } else if (mech === 'breath' && rng.chance(0.5)) {
    const horiz = rng.chance(0.5);
    room.mech = { kind: 'breath', dx: horiz ? 1 : 0, dy: horiz ? 0 : 1, str: 1.3, period: 8 };

let _lastBreathSign = 0;
function updateRoomMechanic(dt) {
  const room = SIM.room, m = room.mech;
  const region = SIM.floor.region;
  // heart: floor pulse on every beat

    const b = SIM.beat.beat, ph = b - Math.floor(b);
    room.pulse = Math.max(0, 1 - ph * 3.5);
    if (Math.floor(b) !== SIM._lastBeatFx) { SIM._lastBeatFx = Math.floor(b); Gfx.punch(0.25); }
  } else room.pulse = 0;
  if (!m) { room.force = null; return; }
  const active = !room.cleared;
  if (m.kind === 'current') {
    room.force = active ? { x: m.dx * m.str, y: m.dy * m.str } : { x: m.dx * m.str * 0.4, y: m.dy * m.str * 0.4 };
    if (Math.random() < dt * 30) {
      const P = SIM.player;
      const x = rnd(1, room.W - 1), y = rnd(1, room.H - 1);
      SIM.particles.push({ x, y, h: rnd(0.1, 0.9), vx: m.dx * rnd(3, 6), vy: m.dy * rnd(3, 6), vh: 0, life: rnd(0.6, 1.2), t: 0, size: rnd(0.04, 0.08), hex: '#ff8a9a', grav: 0, drag: 0 });
    }
  } else if (m.kind === 'breath') {
    const s = Math.sin(SIM.roomTime * TAU / m.period);
    const sign = Math.sign(s);
    if (sign !== _lastBreathSign && Math.abs(s) > 0.05) { _lastBreathSign = sign; sfx(sign > 0 ? 'breath_in' : 'breath_out', { vol: 0.6 }); }
    room.force = { x: m.dx * m.str * s, y: m.dy * m.str * s };
    if (Math.random() < dt * 22 * Math.abs(s)) {
      const x = rnd(1, room.W - 1), y = rnd(1, room.H - 1);
      SIM.particles.push({ x, y, h: rnd(0.2, 1.2), vx: m.dx * s * rnd(3, 5), vy: m.dy * s * rnd(3, 5), vh: 0, life: rnd(0.6, 1.1), t: 0, size: rnd(0.03, 0.06), hex: '#d8e4ff', grav: 0, drag: 0 });

      for (let i = 0; i < 3; i++) {
        const x = clamp(P.x + rnd(-3.5, 3.5), 1.5, room.W - 1.5), y = clamp(P.y + rnd(-3, 3), 1.5, room.H - 1.5);

          burst(x, y, '#fff27a', 12, 5, { life: 0.3, size: 0.07, up: 6 }); addRing(x, y, 1.1, '#fff27a', 0.25);
          sfx('lightning', { vol: 0.5 });

}

<script>/* src/bosses.js */
/* ==========================================================================
   SPLEEN: SEPSIS — bosses.js
   Six multi-phase bosses. Shared framework (phases, attack runner, beat
   clock) + per-boss visuals, attacks and update loops.
   Readability rules: every attack has a >=0.5s tell (windup glow/shake,
   ground telegraph and/or sound); bullets stay at 2.5–5 tiles/s; patterns
   always leave a gap.
   ========================================================================== */
"use strict";

/* ==========================================================================
   SHARED FRAMEWORK
   ========================================================================== */
const BOSS_FEV = () => (SIM.run && SIM.run.fever >= 5 ? 1.2 : 1);

function bossBase(id, x, y, o = {}) {
  const def = BOSSES[id];
  const hp = def.hp * floorHpMult() * (SIM.run && SIM.run.fever >= 5 ? 1.25 : 1);
  return {
    id: nextId(), type: 'boss_' + id, def: { ai: 'boss', speed: 0, name: def.name },
    x, y, vx: 0, vy: 0, kx: 0, ky: 0, r: o.r || def.r, fly: !!o.fly, color: def.color, core: def.core, cost: 0,
    state: 0, t: 0, cd: 1.3, facing: Math.PI / 2, spawning: 2.2, spawnMax: 2.2, elite: null, capsule: 0,
    data: {}, mass: 20, rate: 1, speedK: 1, dead: false, summoned: false, zoneSlow: 1,
    isBoss: true, bossId: id, stunImmune: true, anchored: true, hp, maxHp: hp, phase: 1,
    phaseMarks: o.marks || [], atk: null, lastAtk: null, pause: 0, noCollide: !!o.noCollide,
  };
}
function bossFinish(e, vis) {
  e.vis = vis; e.node = vis.root;
  e.node.position.set(e.x, 0, -e.y);
  SIM.enemies.push(e);
  return e;
}
/** run fn later in sim time, but only if the boss is still alive */
function later(e, sec, fn) { after(sec, () => { if (!e.dead) fn(); }); }
/** true exactly once when attack time passes `time` */
function at(A, time) {
  if (!A.f) A.f = {};
  if (A.t >= time && !A.f[time]) { A.f[time] = true; return true; }
  return false;
}
/** distance from (x,y) along angle a to the arena's inner wall (capped at max) */
function arenaLen(x, y, a, max) {
  const room = SIM.room, c = Math.cos(a), s = Math.sin(a);
  let t = max;
  if (c > 1e-6) t = Math.min(t, (room.W - 1 - x) / c); else if (c < -1e-6) t = Math.min(t, (1 - x) / c);
  if (s > 1e-6) t = Math.min(t, (room.H - 1 - y) / s); else if (s < -1e-6) t = Math.min(t, (1 - y) / s);
  return Math.max(0.5, t);
}
function clampArena(x, y, m = 1.6) {
  const room = SIM.room;
  return { x: clamp(x, m, room.W - m), y: clamp(y, m, room.H - m) };
}
function aliveBy(e, tag) { let n = 0; for (const o of SIM.enemies) if (!o.dead && o.summoner === e.id && (!tag || o.type === tag)) n++; return n; }
function summon(e, type, x, y, o = {}) {
  const p = clampArena(x, y, 1.8);
  const m = spawnEnemy(type, p.x, p.y, Object.assign({ summoned: true }, o));

  return m;
}
/** phase check: marks = HP fractions where phases begin */
function bossPhaseCheck(e, onPhase) {
  const marks = e.phaseMarks;
  if (e.phase - 1 >= marks.length) return false;
  if (e.hp / e.maxHp > marks[e.phase - 1]) return false;
  e.phase++;
  e.atk = null; e.cd = 0.6; e.pause = 1.2;
  sfx('boss_phase'); Gfx.addShake(0.7); Gfx.caPulse = 0.9;
  addRing(e.x, e.y, e.r * 3.2, e.color, 0.6);
  burst(e.x, e.y, e.color, 30, 6, { life: 0.7, size: 0.12, up: 4 });
  e.data.phaseFlash = 1;
  if (onPhase) onPhase(e, e.phase);

}
/** attack runner: pools[phase-1] lists attack names; ATK[name](e,A,dt) returns true when done */
function runAttacks(e, dt, pools, cds, ATK) {
  if (e.pause > 0) { e.pause -= dt; return; }
  if (e.atk) {
    const A = e.atk; A.t += dt;
    if (ATK[A.name](e, A, dt)) { e.atk = null; e.cd = cds[Math.min(cds.length - 1, e.phase - 1)] / BOSS_FEV() * rnd(0.85, 1.15); }
    return;
  }
  e.cd -= dt;
  if (e.cd > 0) return;

  let opts = pool.filter(n => n !== e.lastAtk && (!ATK[n + '_ok'] || ATK[n + '_ok'](e)));
  if (!opts.length) opts = pool;

/** remove this boss's live beams / telegraphs (phase transitions) */
function clearBossHazards(e) {
  for (let i = SIM.beams.length - 1; i >= 0; i--) if (SIM.beams[i].owner === e) SIM.beams.splice(i, 1);
  for (let i = SIM.teles.length - 1; i >= 0; i--) if (SIM.teles[i].owner === e) SIM.teles.splice(i, 1);
}
/**
 * Beat clock: follows the music clock when it advances at a plausible rate,
 * otherwise runs an internal sim-time clock (muted audio, headless, tab hiccups).
 */
function bossBeat(e, dt, bpmFallback) {
  const D = e.data;
  const ext = SIM.beat && isFinite(SIM.beat.beat) ? SIM.beat.beat : 0;
  const bpm = (SIM.beat && SIM.beat.bpm > 30 && SIM.beat.bpm < 300) ? SIM.beat.bpm : bpmFallback;
  const bps = bpm / 60;

  if (D.bw >= 0.5) { D.extRate = (ext - D.extStart) / D.bw; D.extStart = ext; D.bw = 0; }

  if (D.lastB == null) D.lastB = bi; else if (bi !== D.lastB) { D.lastB = bi; beat = true; }
  if (D.lastHB == null) D.lastHB = hi; else if (hi !== D.lastHB) { D.lastHB = hi; half = !beat; }

}
/** ground spike burst used by root eruptions */
function spikeAt(x, y, r, hex) {
  burst(x, y, hex, 10, 4, { life: 0.45, size: 0.09, up: 7 });
  burst(x, y, '#ffffff', 4, 2, { life: 0.25, size: 0.06, up: 5 });
  addRing(x, y, r, hex, 0.3);
  sfx('emerge', { vol: 0.45, rate: rnd(1.2, 1.5) });
  Gfx.addShake(0.08);
  const P = SIM.player;
  if (P && !P.dead && dist2(P.x, P.y, x, y) < (r * 0.9 + P.hitR) ** 2) hurtPlayer(1, { kind: 'root', x, y });
}
function rootEruption(e, n, hex, delay0 = 0.95) {
  const P = SIM.player;
  const spots = [clampArena(P.x + P.vx * 0.25, P.y + P.vy * 0.25)];
  for (let i = 1; i < n; i++) {
    const a = rnd(0, TAU), d = rnd(1.8, 4.2);
    spots.push(clampArena(P.x + Math.cos(a) * d, P.y + Math.sin(a) * d));
  }
  spots.forEach((s, i) => telegraph({ kind: 'disc', x: s.x, y: s.y, r: 1.05, dur: delay0 + i * 0.09, owner: e, then: () => spikeAt(s.x, s.y, 1.05, hex) }));
  sfx('windup', { rate: 0.6, vol: 0.6 });
  return delay0 + n * 0.09;
}
/** tentacle chain: nodes rotated around local Y for sway; local +X points outward */
function tentacle(parent, ang, x0, segs, step, r0, r1, mat, tipMat) {
  const root = Gfx.node('tent'); root.parent = parent; root.rotation.y = ang;
  const nodes = []; let prev = root;
  for (let i = 0; i < segs; i++) {
    const n = Gfx.node('tseg'); n.parent = prev; n.position.x = i === 0 ? x0 : step;
    const rr = lerp(r0, r1, segs > 1 ? i / (segs - 1) : 0);
    Gfx.part('sphere', (i === segs - 1 && tipMat) ? tipMat : mat, n, 0, rr * 0.85, 0, rr * 1.35, rr, rr);
    nodes.push(n); prev = n;
  }

function renderTitle(dt) {

<script>/* src/game.js */
/* ==========================================================================
   SPLEEN: SEPSIS — game.js

"use strict";

/* ---------------- meta save ---------------- */
const META_KEY = 'spleen_sepsis_v1';

    v: 1, memory: 0, totalMemory: 0, perks: {}, unlocks: {}, codex: {}, seenMut: {},
    stats: { runs: 0, wins: 0, kills: 0, bestFloor: 0, deaths: 0, bestTime: null, playTime: 0 },
    feverMax: 0, lastStrain: 'neutrophil', lastFever: 0, tutorialSeen: false,

}
let META = (function () {
  const m = Store.get(META_KEY, null);
  const d = defaultMeta();

  // merge new keys
  for (const k in d) if (m[k] === undefined) m[k] = d[k];

function isUnlocked(key) { return !key || !!META.unlocks[key] || (window.__SPLEEN && __SPLEEN.unlockAll); }

/* ---------------- game state ---------------- */
const Game = {

/* ==========================================================================
   RUN LIFECYCLE
   ========================================================================== */
function startRun(strainId, fever, seed) {

    strain: strainId, fever: fever || 0, seed: seed != null ? seed : (Math.random() * 1e9) >>> 0,
    floorIdx: 0, startTime: performance.now(), time: 0, won: false, newUnlocks: [],
    stats: { kills: 0, shots: 0, dashes: 0, abilities: 0, hitsTaken: 0, roomsCleared: 0, ironGained: 0, bossesKilled: 0, mutations: 0 },

function enterFloor(idx, first) {
  const run = SIM.run, P = SIM.player;

function clearWorld(full) {
  SIM.pshots.length = 0; SIM.eshots.length = 0; SIM.zones.length = 0; SIM.teles.length = 0; SIM.beams.length = 0;
  SIM.lobs.length = 0; SIM.particles.length = 0; SIM.rings.length = 0; SIM.arcs.length = 0;

/* ==========================================================================
   ROOMS
   ========================================================================== */
function enterRoom(roomId, viaDoor) {

  World.updateFlow(room, P.x, P.y);

}

function lockRoom(on) {
  SIM.roomLocked = on;
  SIM.combatAllowed = true;
  Gfx.setDoorsOpen(!on);
  if (on) sfx('door_close');
}

function updateRoomFlow(dt) {
  const room = SIM.room, P = SIM.player;
  // waves
  if (SIM.pendingWaves && SIM.pendingWaves.length) {
    const alive = SIM.enemies.some(e => !e.dead);

      if (SIM.waveDelay <= 0) {
        const w = SIM.pendingWaves.shift();

    const r = Math.random();

/* ---------------- doors ---------------- */
function checkDoors() {
  if (SIM.roomLocked) return;
  const room = SIM.room, P = SIM.player;
  for (const d of room.doors) {
    let through = false;
    if (d.dir === 'N') through = P.y < 0.7 && Math.abs(P.x - d.x) < 1.6;
    else if (d.dir === 'S') through = P.y > room.H - 0.7 && Math.abs(P.x - d.x) < 1.6;
    else if (d.dir === 'W') through = P.x < 0.7 && Math.abs(P.y - d.y) < 1.6;

      const td = target.doors.find(t => t.to === room.id && t.ncell[0] === d.cell[0] && t.ncell[1] === d.cell[1]) || target.doors.find(t => t.to === room.id);

/* ==========================================================================
   INTERACTABLES (reward cysts, shop, tumor, portal)
   ========================================================================== */
function addInteract(o) { SIM.interact.push(o); return o; }

    use(it) {

}
function choiceCount() { return META.perks.library ? 4 : 3; }
function spawnShopkeeper(x, y) {
  const root = Gfx.node('shop');
  const mat = Gfx.cellMat('#7dffb0', { rim: 1.6, core: 0.35, glow: 0.45, dark: 0.55, alpha: 0.8 });
  const body = Gfx.part('sphere', mat, root, 0, 0.7, 0, 0.55);

  for (let i = 0; i < 7; i++) {

    arm.rotation.z = Math.cos(a) * 1.2; arm.rotation.x = -Math.sin(a) * 1.2; arms.push(arm);
    Gfx.part('sphereLo', Gfx.glowMat('#c8ffe0', { glow: 0.7 }), root, Math.cos(a) * 1.15, 0.3, Math.sin(a) * 1.15, 0.08);
  }

  Gfx.part('cyl', Gfx.cellMat('#1a2a22', { rim: 1.2, core: 0.2, glow: 0, dark: 0.8 }), root, 0, 0.12, 1.2, 1.6, 0.12, 0.45);

    kind: 'shop', x, y, r: 1.1, node: root, label: 'LYMPH NODE', sub: 'trade iron for supplies', hex: '#7dffb0', solid: true,
    anim(t) { body.scaling.setAll(0.55 + Math.sin(t * 2) * 0.03); root.rotation.y = Math.sin(t * 0.5) * 0.2; },

function spawnTumor(x, y) {

  const lumps = [];
  for (let i = 0; i < 9; i++) lumps.push(Gfx.part('sphere', mat, root, rnd(-0.5, 0.5), rnd(0.3, 1.1), rnd(-0.5, 0.5), rnd(0.3, 0.5)));

}
function spawnPortal(x, y) {

  const disc = Gfx.part('disc', Gfx.glowMat(SIM.floor.region.pal.accent, { glow: 0.6, alpha: 0.85 }), root, 0, 0.05, 0, 1.05);
  const core = Gfx.part('disc', Gfx.glowMat('#000000', { glow: 0, alpha: 0.9 }), root, 0, 0.07, 0, 0.7);
  root.position.set(x, 0, -y);
  const last = SIM.floor.idx >= REGIONS.length - 1;
  return addInteract({
    kind: 'portal', x, y, r: 1.0, node: root, label: last ? 'THE SOURCE IS CLEAN' : 'DESCEND', sub: last ? '' : 'into ' + REGIONS[SIM.floor.idx + 1].name.toLowerCase(), hex: '#ffffff',
    anim(t) { disc.rotation.y = t * 2; ring.rotation.y = -t; core.scaling.setAll(0.7 + Math.sin(t * 3) * 0.06); if (Math.random() < 0.3) SIM.particles.push({ x: x + rnd(-0.9, 0.9), y: y + rnd(-0.9, 0.9), h: 0.1, vx: 0, vy: 0, vh: rnd(1.5, 3), life: 0.8, t: 0, size: 0.05, hex: SIM.floor.region.pal.accent, grav: -1, drag: 0 }); },
    use() { descend(); },

}
function removeInteract(it) { const i = SIM.interact.indexOf(it); if (i >= 0) SIM.interact.splice(i, 1); if (it.node) it.node.dispose(); }
function nearInteract() {
  const P = SIM.player; let best = null, bd = 1e9;
  for (const it of SIM.interact) { const d = dist(P.x, P.y, it.x, it.y) - it.r; if (d < 0.9 && d < bd) { bd = d; best = it; } }
  return best;
}
function updateInteract(dt) {
  const P = SIM.player;
  for (const it of SIM.interact) {
    it.anim && it.anim(SIM.time);
    if (it.solid) { // push player out
      const d = dist(P.x, P.y, it.x, it.y), rr = it.r * 0.75 + P.hitR;
      if (d < rr && d > 1e-4) { P.x = it.x + (P.x - it.x) / d * rr; P.y = it.y + (P.y - it.y) / d * rr; }
    }
  }

  SIM.nearInteract = near;
  if (near) {
    Gfx.labels.push({ x: near.x, y: near.y, h: 2.2, text: near.label, hex: near.hex, sub: near.sub });
    if (Input.interact || (Game.autopilot && Math.random() < 0.05)) near.use(near);

}
function descend() {
  const run = SIM.run;
  if (run.floorIdx >= REGIONS.length - 1) { victory(); return; }
  Game.sub = 'transition'; sfx('portal');
  fadeTo(1, 0.6, () => { Game.sub = 'room'; enterFloor(run.floorIdx + 1, false); fadeTo(0, 0.6); });
}

/* ==========================================================================
   MUTATION ROLLS, CHOICE, SHOP, TUMOR
   ========================================================================== */
const RARITY_ORDER = ['common', 'uncommon', 'rare'];
function rollMutations(n, o = {}) {
  const P = SIM.player, f = SIM.floor ? SIM.floor.idx : 0;
  const min = o.minRarity ? RARITY_ORDER.indexOf(o.minRarity) : 0;
  const pool = MUTATIONS.filter(m => m.rarity !== 'malignant' && RARITY_ORDER.indexOf(m.rarity) >= min && P.canTake(m.id) && !(o.exclude && o.exclude.includes(m.id)));
  const out = [];
  for (let i = 0; i < n && pool.length; i++) {
    const m = (function () {
      const w = (mm) => RARITY[mm.rarity].weight[f] * (mm.rarity === 'rare' ? (o.rareBoost || 1) : 1) / Math.max(1, MUTATIONS.filter(x => x.rarity === mm.rarity).length);
      let tot = 0; for (const mm of pool) tot += w(mm);
      let r = Math.random() * tot;
      for (const mm of pool) { r -= w(mm); if (r <= 0) return mm; }

  }

}
function rollMalignant(n) {
  const P = SIM.player;
  const pool = MUTATIONS.filter(m => m.rarity === 'malignant' && P.canTake(m.id));
  return rndShuffle(pool).slice(0, n).map(m => m.id);
}
function rndShuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

function openMutationChoice(ids, source, onDone) {
  Game.sub = 'modal';
  const free = META.perks.reroll ? 1 : 0;

      const fl = SIM.floor; const prev = new Map(); const q = [room.id]; prev.set(room.id, null);

      while (q.length) { const id = q.shift(); const r = fl.rooms[id]; if (id !== room.id && (!r.visited || (!r.cleared && r.type !== 'shop'))) { found = id; break; } for (const d of r.doors) if (!prev.has(d.to)) { prev.set(d.to, id); q.push(d.to); } }
      if (found == null) found = fl.bossId;
      let step = found; while (prev.get(step) !== room.id && prev.get(step) != null) step = prev.get(step);
      const door = room.doors.find(d => d.to === step);
      if (door) { const ox = door.dir === 'W' ? -1 : door.dir === 'E' ? 1 : 0, oy = door.dir === 'N' ? -1 : door.dir === 'S' ? 1 : 0; goal = { x: door.x + ox, y: door.y + oy, door }; }
    }
    if (goal) {
      const tx = clamp(Math.floor(goal.x), 0, room.W - 1), ty = clamp(Math.floor(goal.y), 0, room.H - 1), key = room.id + 'g' + tx + ',' + ty;
      if (A.bfsKey !== key) { const g2 = room.grid[ty * room.W + tx]; A.bfs = bfsFrom(room, tx, ty); A.bfsKey = key; }
      const s = stepDown(room, A.bfs, P);
      if (s) { mx = s.x; my = s.y; } else { const a = angleTo(P.x, P.y, goal.x, goal.y); mx = Math.cos(a); my = Math.sin(a); }

  if (threat) { const a = Math.atan2(threat.vy, threat.vx) + Math.PI / 2 * (((threat.id & 1) * 2) - 1); mx = mx * 0.3 + Math.cos(a); my = my * 0.3 + Math.sin(a); if (td < 0.9) dash = true; }
  for (const t of SIM.teles) if (t.kind === 'disc' && dist(t.x, t.y, P.x, P.y) < t.r + 0.4) { const a = angleTo(t.x, t.y, P.x, P.y); mx += Math.cos(a) * 1.5; my += Math.sin(a) * 1.5; }

function stepDown(room, d, P) {
  if (!d) return null;

    const nx = tx + dx, ny = ty + dy; if (nx < 0 || ny < 0 || nx >= room.W || ny >= room.H) continue;
    if (dx && dy && (World.blocked(room, tx + dx, ty, MASK_PLAYER_OPEN) || World.blocked(room, tx, ty + dy, MASK_PLAYER_OPEN))) continue;
    const v = d[ny * room.W + nx]; if (v < best) { best = v; bx = nx + 0.5 - P.x; by = ny + 0.5 - P.y; }
  }
  if (best >= here) return null;
  const l = Math.hypot(bx, by); return l > 0 ? { x: bx / l, y: by / l } : null;
}

function boot() {

  if (params.get('god')) SIM.godMode = true;
  if (params.get('floor')) D.startFloor = clamp(parseInt(params.get('floor')) - 1, 0, 5);
  if (params.get('mut')) D.presetMuts = params.get('mut').split(',');
  if (params.get('unlock')) D.unlockAll = true;
  D.startRun = startRun; D.enterFloor = enterFloor; D.toTitle = toTitle;
  D.killAll = () => { for (const e of SIM.enemies) if (!e.isBoss || true) dealDamage(e, 1e6, { pure: true, silent: true }); };
  D.render = (n = 1) => { for (let i = 0; i < n; i++) { renderFrame(1 / 60); UI.hudFrame(1 / 60); } };
  D.give = (id) => SIM.player && SIM.player.addMutation(id);
  D.gotoBoss = () => { const f = SIM.floor; for (const r of f.rooms) { if (r.type !== 'boss') { r.cleared = true; r.visited = true; } } enterRoom(f.bossId, null); };
  D.step = (n, dt = 1 / 60) => { for (let i = 0; i < n; i++) { Input.update(dt); if (Game.state === 'play' && !Game.paused && Game.sub !== 'modal') { Input.mouseWorld = null; if (Game.autopilot) autopilot(dt); try { SIM.beat = AUDIO.music.clock(); } catch (e) { SIM.beat = { beat: SIM.time * 1.5 }; } let d = dt; if (SIM.slowmo > 0) { SIM.slowmo -= dt; d *= 0.3; } if (SIM.hitstop > 0) { SIM.hitstop -= dt; d *= 0.05; } simStep(d); if (Game.sub === 'intro') { Game.introT -= dt; if (Game.introT <= 0) { Game.sub = 'room'; SIM.combatAllowed = true; } } if (Game.sub === 'dying') { Game.dyingT -= dt; if (Game.dyingT <= 0) { Game.state = 'over'; } } if (Game.fadeCb) { const cb = Game.fadeCb; Game.fadeCb = null; Game.fade = Game.fadeTarget; cb(); } } else if (Game.sub === 'modal' && Game.autopilot) UI.autoPick && UI.autoPick(); Input.endFrame(); } };

  const canvas = document.getElementById('game'), overlay = document.getElementById('overlay');

  if (params.get('q')) q = params.get('q');
  try { Gfx.init(canvas, overlay, q); }
  catch (err) { UI.fatal('Your browser could not start WebGL. Try another browser or enable hardware acceleration.<br><small>' + err.message + '</small>'); return; }
  SIM.opts.dmgNumbers = META.opts.dmgNumbers; Gfx.shakeScale = META.opts.shake; Gfx.reduceFlash = !META.opts.flashes;
  const touchy = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  Input.touchEnabled = META.opts.touch === 'on' || (META.opts.touch === 'auto' && touchy && matchMedia('(pointer: coarse)').matches);
  document.body.classList.toggle('touch', Input.touchEnabled);
  try { if (window.AUDIO) { AUDIO.setVolume('master', META.opts.master); AUDIO.setVolume('music', META.opts.music); AUDIO.setVolume('sfx', META.opts.sfx); } } catch (e) { }
  UI.init();
  Gfx.engine().runRenderLoop(frame);
  Game.state = 'title';
  UI.title();
  try { AUDIO.music.play('title'); } catch (e) { }
  // quick-start for tests / debugging
  if (params.get('start')) { startRun(params.get('strain') || 'neutrophil', parseInt(params.get('fever') || '0'), params.get('seed') ? parseInt(params.get('seed')) : undefined); if (params.get('boss')) D.gotoBoss(); }
  if (params.get('auto')) Game.autopilot = true;
  document.getElementById('loading').classList.add('gone');
}
window.addEventListener('load', boot);
