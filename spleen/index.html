<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07040a">
<title>SPLEEN: SEPSIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0&icon_names=ac_unit,account_tree,air,all_inclusive,arrow_back,auto_awesome,auto_fix_high,autorenew,back_hand,balance,bloodtype,blur_circular,blur_on,bolt,brightness_5,call_split,campaign,casino,change_history,chevron_left,chevron_right,close,content_cut,control_point_duplicate,coronavirus,dangerous,diamond,east,emergency,favorite,flare,flash_on,gesture,healing,heart_broken,help,home,hub,keyboard,lens,local_fire_department,lock,lock_open,menu_book,my_location,play_arrow,psychology,radio_button_checked,refresh,restart_alt,rocket_launch,scatter_plot,science,sell,sensors,settings,shield,skull,sports_esports,stacked_line_chart,stars,support,sync_alt,target,trending_up,trip_origin,water_drop,waves,whatshot,zoom_out_map&display=block" rel="stylesheet">
<style>
:root{
  --bg:#07040a; --panel:rgba(16,9,20,.86); --panel2:rgba(26,14,32,.92); --line:rgba(255,235,245,.12); --line2:rgba(255,235,245,.22);
  --text:#f4ebf1; --dim:#a596a6; --accent:#7ff3ff; --hot:#ff4d8a; --gold:#ffd36b; --mal:#c06bff; --green:#7dffb0; --blue:#9ad8ff; --iron:#ff8a3a; --danger:#ff3b4f;
  --display:'Unbounded','Arial Black',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#07040a; } }
:root[data-theme="dark"]{ --bg:#07040a; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--mono);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
canvas#overlay{position:fixed;inset:0;pointer-events:none;z-index:4}
.ms{font-family:'Material Symbols Rounded';font-weight:500;font-style:normal;font-size:1.15em;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;vertical-align:-.18em}
body.no-icons .ms{font-size:0!important;width:.8em;height:.8em;border-radius:50%;background:currentColor;opacity:.8;vertical-align:-.05em}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:40}
#hurt{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;background:radial-gradient(ellipse at center,rgba(255,0,40,0) 45%,rgba(255,0,40,.55) 100%)}
#lowhp{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;box-shadow:inset 0 0 180px 50px rgba(200,0,30,.55)}
#lowhp.on{animation:lowpulse 1.1s ease-in-out infinite}
@keyframes lowpulse{0%,100%{opacity:.25}50%{opacity:.85}}
body.letterbox::before,body.letterbox::after{content:"";position:fixed;left:0;right:0;height:9vh;background:#000;z-index:20;animation:lb 2.3s ease forwards}
body.letterbox::before{top:0}body.letterbox::after{bottom:0}
@keyframes lb{0%{transform:scaleY(0)}12%,85%{transform:scaleY(1)}100%{transform:scaleY(0)}}

/* ---------- loading ---------- */
#loading{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;transition:opacity .6s}
#loading.gone{opacity:0;pointer-events:none}
#loading .cell{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 40% 40%,rgba(127,243,255,.5),rgba(127,243,255,.08) 60%,transparent 70%);box-shadow:0 0 30px rgba(127,243,255,.4),inset 0 0 18px rgba(127,243,255,.6);animation:breathe 1.2s ease-in-out infinite}
#loading .txt{font-family:var(--display);letter-spacing:.3em;font-size:12px;color:var(--dim)}
#loading .fatal{max-width:520px;text-align:center;line-height:1.6;color:var(--text)}
@keyframes breathe{0%,100%{transform:scale(.9)}50%{transform:scale(1.06)}}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;opacity:0;transition:opacity .4s}
#hud.on{opacity:1}
.hud-tl{position:absolute;top:max(14px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:8px}
#hp{display:flex;flex-wrap:wrap;gap:5px;max-width:300px}
.pip{width:22px;height:22px;border-radius:50%;display:block;position:relative;transition:transform .2s}
.pip.full{background:radial-gradient(circle at 38% 35%,rgba(255,255,255,.65),var(--c) 45%,color-mix(in srgb,var(--c) 40%,#000) 100%);box-shadow:0 0 10px color-mix(in srgb,var(--c) 70%,transparent),inset 0 0 0 1.5px rgba(255,255,255,.35)}
.pip.full::after{content:"";position:absolute;left:30%;top:32%;width:36%;height:36%;border-radius:50%;background:rgba(80,20,120,.55)}
.pip.empty{border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35)}
.pip.shield{background:radial-gradient(circle at 38% 35%,#fff,#9ad8ff 50%,#3a7aaa);box-shadow:0 0 12px rgba(154,216,255,.8);border-radius:45% 55% 50% 50%}
#hp.low .pip.full{animation:pippulse .55s ease-in-out infinite}
@keyframes pippulse{50%{transform:scale(1.18)}}
.hud-row{display:flex;align-items:center;gap:14px}
#ironbox{display:flex;align-items:center;gap:6px;font-weight:800;font-size:17px;color:#ffd3b0;text-shadow:0 2px 6px #000}
#ironbox .ms{color:var(--iron);filter:drop-shadow(0 0 6px rgba(255,138,58,.7))}
#ironbox.bump b{animation:bump .3s}
@keyframes bump{40%{transform:scale(1.35)}}
#abil{position:relative;width:54px;height:54px;border-radius:50%;--f:0deg;background:conic-gradient(rgba(127,243,255,.85) var(--f),rgba(255,255,255,.08) var(--f));padding:3px;transition:box-shadow .2s}
#abil-in{width:100%;height:100%;border-radius:50%;background:#0d0712;display:flex;align-items:center;justify-content:center;font-size:24px;color:#cfefff}
#abil.ready{box-shadow:0 0 18px rgba(127,243,255,.7)}
#abil.ready #abil-in{color:#fff;background:radial-gradient(circle,#173a44,#0d0712)}
#abil-key{position:absolute;right:-6px;bottom:-4px;font-size:10px;font-weight:800;background:#000;border:1px solid var(--line2);border-radius:4px;padding:1px 4px}
#abil-name{font-family:var(--display);font-size:10px;letter-spacing:.15em;color:var(--dim)}
#dash{width:54px;height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden;--d:1}
#dash::after{content:"";display:block;height:100%;width:calc(var(--d)*100%);background:#fff;opacity:.7}
#charge{position:absolute;left:50%;top:58%;transform:translateX(-50%);width:80px;height:5px;border-radius:3px;background:rgba(255,255,255,.12);opacity:0;transition:opacity .1s;--c:0}
#charge::after{content:"";display:block;height:100%;width:calc(var(--c)*100%);background:#b8ffd8;border-radius:3px;box-shadow:0 0 8px #9dff7a}
#charge.on{opacity:1}#charge.full::after{background:#fff;box-shadow:0 0 14px #fff}
#region{position:absolute;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);text-align:center;text-shadow:0 2px 8px #000}
#region b{display:block;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.22em}
#region span{font-size:10px;letter-spacing:.2em;color:var(--dim)}
#mmwrap{position:absolute;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));padding:6px;background:rgba(8,4,10,.55);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(4px)}
#minimap{width:150px;height:110px;display:block}
#mutlist{position:absolute;left:max(16px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));display:flex;flex-wrap:wrap-reverse;gap:5px;max-width:min(46vw,420px);pointer-events:auto}
.mchip{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--r);background:rgba(10,6,14,.75);border:1px solid color-mix(in srgb,var(--r) 55%,transparent);box-shadow:0 0 8px color-mix(in srgb,var(--r) 30%,transparent);position:relative}
.mchip i{position:absolute;right:-3px;bottom:-3px;font-style:normal;font-size:9px;font-weight:800;background:#000;color:#fff;border-radius:4px;padding:0 3px}
#tip{position:fixed;z-index:30;transform:translateY(-100%);max-width:260px;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;font-size:11px;line-height:1.45;opacity:0;pointer-events:none;transition:opacity .12s}
#tip.on{opacity:1}#tip b{font-family:var(--display);font-size:11px;letter-spacing:.08em}#tip p{color:#ddd;margin-top:3px}
#bossbar{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);width:min(620px,70vw);opacity:0;transition:all .4s}
#bossbar.on{opacity:1;transform:translateX(-50%)}
#boss-name{text-align:center;font-family:var(--display);font-weight:900;font-size:15px;letter-spacing:.3em;margin-bottom:6px;text-shadow:0 0 14px rgba(255,60,90,.6),0 2px 4px #000}
.btrack{position:relative;height:12px;border-radius:6px;background:rgba(0,0,0,.6);border:1px solid rgba(255,80,110,.35);overflow:hidden}
#boss-lag{position:absolute;inset:0 auto 0 0;background:rgba(255,230,230,.55)}
#boss-fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#7a0a24,#ff3b4f 70%,#ff8aa0);box-shadow:0 0 12px rgba(255,59,79,.8)}
#boss-marks i{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.6)}
#toasts{position:absolute;top:84px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:min(560px,90vw)}
.toast{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 16px;text-align:center;animation:tin .35s cubic-bezier(.2,1.4,.4,1);transition:opacity .4s,transform .4s;backdrop-filter:blur(4px)}
.toast b{display:block;font-family:var(--display);font-size:13px;letter-spacing:.14em}
.toast span{display:block;font-size:11px;color:#ddd;margin-top:2px}
.toast.syn{border-color:rgba(255,211,107,.6);box-shadow:0 0 22px rgba(255,211,107,.3)}
.toast.unlock{border-color:rgba(127,243,255,.6);box-shadow:0 0 22px rgba(127,243,255,.35)}
.toast.clear,.toast.small{padding:4px 14px;background:rgba(10,6,14,.6)}.toast.clear b{font-size:11px;letter-spacing:.4em;color:var(--dim)}
.toast.out{opacity:0;transform:translateY(-8px)}
@keyframes tin{from{opacity:0;transform:scale(.8) translateY(10px)}}
.banner{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:22;opacity:0;text-align:center}
.banner.on{animation:banner 3.2s ease forwards}
.banner.on.boss{animation:banner 2.4s ease forwards}
.b-num{font-size:12px;letter-spacing:.5em;color:var(--dim);text-shadow:0 2px 6px #000}
.b-name{font-family:var(--display);font-weight:900;font-size:clamp(34px,7vw,84px);letter-spacing:.08em;text-shadow:0 0 30px rgba(255,77,138,.55),0 4px 0 rgba(0,0,0,.6);line-height:1.05;margin:6px 0}
.b-name.boss{color:#fff;text-shadow:0 0 30px rgba(255,40,70,.9),0 0 80px rgba(255,40,70,.5)}
.b-sub{font-size:13px;letter-spacing:.3em;color:#ddd;text-transform:uppercase;text-shadow:0 2px 6px #000}
@keyframes banner{0%{opacity:0;transform:scale(1.08);filter:blur(6px)}12%{opacity:1;transform:none;filter:none}78%{opacity:1}100%{opacity:0;transform:scale(.98)}}
#prompt{position:absolute;bottom:22%;left:50%;transform:translateX(-50%) translateY(8px);opacity:0;transition:all .15s;font-size:13px;background:var(--panel);border:1px solid var(--line2);border-radius:20px;padding:6px 14px}
#prompt.on{opacity:1;transform:translateX(-50%)}
#prompt b{background:#fff;color:#000;border-radius:5px;padding:1px 6px;margin-right:6px;font-weight:800}

/* ---------- touch ---------- */
#touch{position:fixed;inset:0;z-index:11;pointer-events:none;display:none}
#touch.on{display:block}
.stick{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04);display:none}
.stick div{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(127,243,255,.3);border:2px solid rgba(127,243,255,.6)}
#stick-r div{background:rgba(255,77,138,.3);border-color:rgba(255,77,138,.6)}
.tbtn{position:fixed;pointer-events:auto;width:64px;height:64px;border-radius:50%;background:rgba(16,9,20,.55);border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;backdrop-filter:blur(3px)}
.tbtn.down{background:rgba(127,243,255,.35)}
.tbtn[data-t=dash]{right:calc(20px + env(safe-area-inset-right));top:44%}
.tbtn[data-t=ability]{right:calc(96px + env(safe-area-inset-right));top:30%}
.tbtn[data-t=interact]{right:calc(20px + env(safe-area-inset-right));top:24%;opacity:0;transform:scale(.6);transition:all .15s}
.tbtn[data-t=interact].avail{opacity:1;transform:none;border-color:var(--gold);color:var(--gold)}
.tbtn[data-t=pause]{width:42px;height:42px;font-size:20px;top:calc(12px + env(safe-area-inset-top));right:calc(186px + env(safe-area-inset-right))}
body.touch #mutlist{pointer-events:none}

/* ---------- screens & modals ---------- */
.screen,.modal{position:fixed;inset:0;z-index:30;display:none;overflow-y:auto;overflow-x:hidden}
.screen.on,.modal.on{display:flex}
.screen{flex-direction:column;padding:max(28px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}
.screen:not(.s-title){background:linear-gradient(90deg,rgba(7,4,10,.94),rgba(7,4,10,.82));backdrop-filter:blur(3px);align-items:center}
.modal{background:rgba(5,2,8,.66);backdrop-filter:blur(5px);align-items:center;justify-content:center;padding:20px}
.mbox{width:min(1040px,100%);display:flex;flex-direction:column;align-items:center;animation:pop .3s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
.hdr{text-align:center;margin-bottom:22px;max-width:720px}
.hdr h2{font-family:var(--display);font-weight:900;font-size:clamp(24px,4vw,40px);letter-spacing:.06em;text-shadow:0 0 24px rgba(255,77,138,.4)}
.hdr p{color:var(--dim);font-size:13px;margin-top:8px;line-height:1.6}
.hdr.big h1{font-family:var(--display);font-weight:900;font-size:clamp(28px,6vw,64px);letter-spacing:.06em;line-height:1.05}
.hdr.won h1{color:#fff;text-shadow:0 0 30px rgba(127,243,255,.8)}
.hdr.lost h1{color:#ffd0da;text-shadow:0 0 30px rgba(255,59,79,.7)}
.mem{color:var(--gold)}.gold{color:var(--gold)}.mal{color:var(--mal)}.iron{color:#ffb070}.green{color:var(--green)}.blue{color:var(--blue)}.dim{color:var(--dim)}
.foot{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.btn{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--text);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:12px 20px;cursor:pointer;display:inline-flex;align-items:center;gap:10px;transition:all .14s;position:relative}
.btn .ms{font-size:20px;color:var(--accent)}
.btn:hover,.btn.focus{background:rgba(127,243,255,.1);border-color:rgba(127,243,255,.55);transform:translateX(3px);box-shadow:0 0 22px rgba(127,243,255,.18)}
.btn.big{font-size:18px;padding:16px 26px;background:linear-gradient(90deg,rgba(255,77,138,.25),rgba(127,243,255,.12));border-color:rgba(255,77,138,.5)}
.btn.ghost{background:transparent}
.btn.danger{border-color:rgba(255,59,79,.4)}.btn.danger .ms{color:var(--danger)}.btn.danger.focus,.btn.danger:hover{background:rgba(255,59,79,.15);border-color:var(--danger)}
.chip{font-family:var(--mono);font-size:12px;font-weight:600;padding:8px 14px;border-radius:20px;text-transform:none;letter-spacing:.02em}
.chip.sel{background:rgba(127,243,255,.18);border-color:var(--accent)}
.chip.danger{border-color:rgba(255,59,79,.5)}
.chip.arrow{padding:8px 10px}
.chip:hover,.chip.focus{transform:none}

/* title */
.s-title{background:linear-gradient(90deg,rgba(7,4,10,.92) 0%,rgba(7,4,10,.7) 38%,rgba(7,4,10,0) 70%);justify-content:center}
.title-wrap{display:flex;flex-direction:column;gap:30px;max-width:680px;margin-left:clamp(0px,4vw,60px)}
.logo-main{font-family:var(--display);font-weight:900;font-size:clamp(52px,9vw,112px);line-height:.9;letter-spacing:.02em;white-space:nowrap;background:linear-gradient(180deg,#fff 0%,#ffd0e0 40%,#ff4d8a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 24px rgba(255,77,138,.55)) drop-shadow(0 6px 0 rgba(60,0,20,.8));animation:beat 1.6s ease-in-out infinite;transform-origin:left center}
@keyframes beat{0%,100%{transform:scale(1)}8%{transform:scale(1.025)}16%{transform:scale(1)}24%{transform:scale(1.015)}}
.logo-sub{font-family:var(--display);font-weight:700;font-size:clamp(20px,3.6vw,38px);letter-spacing:.32em;color:var(--accent);text-shadow:0 0 18px rgba(127,243,255,.7);margin-top:4px}
.logo-tag{font-size:12px;letter-spacing:.35em;color:var(--dim);margin-top:10px;text-transform:uppercase}
.menu{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.title-foot{display:flex;flex-wrap:wrap;gap:16px;font-size:11px;color:var(--dim);letter-spacing:.06em}
.title-foot .ms{color:var(--gold)}.title-foot .ver{opacity:.6}

/* cards */
.cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;width:100%}
.card{cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;transition:all .16s;position:relative}
.card:hover,.card.focus{transform:translateY(-4px);border-color:var(--line2);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.strain{width:230px;display:flex;flex-direction:column;gap:8px}
.strain:hover,.strain.focus{border-color:var(--c);box-shadow:0 0 28px color-mix(in srgb,var(--c) 30%,transparent),0 10px 30px rgba(0,0,0,.5)}
.strain.locked{opacity:.5;filter:grayscale(.7)}
.cell-ico{width:72px;height:72px;border-radius:50%;margin:4px auto 6px;position:relative;background:radial-gradient(circle at 40% 38%,rgba(255,255,255,.4),color-mix(in srgb,var(--c) 55%,transparent) 50%,color-mix(in srgb,var(--c) 15%,transparent) 72%);box-shadow:0 0 26px color-mix(in srgb,var(--c) 45%,transparent),inset 0 0 0 2px color-mix(in srgb,var(--c) 70%,transparent);animation:breathe 2.4s ease-in-out infinite}
.cell-ico .nuc{position:absolute;left:30%;top:30%;width:40%;height:40%;border-radius:45%;background:var(--n);opacity:.85;box-shadow:0 0 12px var(--n)}
.sname{font-family:var(--display);font-weight:900;font-size:18px;letter-spacing:.08em;text-align:center;color:var(--c)}
.stitle{font-size:11px;letter-spacing:.2em;text-transform:uppercase;text-align:center;color:var(--dim)}
.sdesc{font-size:12px;line-height:1.5;color:#ddd;min-height:54px}
.sbar{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.15em;color:var(--dim)}
.sbar i{display:flex;gap:3px}.sbar b,.sbar em{width:16px;height:6px;border-radius:3px;background:var(--c)}.sbar em{background:rgba(255,255,255,.1)}
.sabil{margin-top:6px;padding:10px;border-radius:12px;background:rgba(255,255,255,.04);font-size:11px;line-height:1.45;color:#ccc}
.sabil b{display:block;font-family:var(--display);font-size:11px;letter-spacing:.1em;color:#fff;margin-bottom:4px}
.lockmsg{margin-top:10px;font-size:12px;line-height:1.5;text-align:center;color:#ddd;display:flex;flex-direction:column;align-items:center;gap:8px}.lockmsg .ms{font-size:28px}
.fever{display:flex;align-items:center;gap:14px;margin-top:22px}
.fever-lbl{display:flex;flex-direction:column;align-items:center;min-width:280px;text-align:center;gap:3px;font-size:12px}
.fever-lbl b{font-family:var(--display);letter-spacing:.2em;color:var(--hot)}
.perks .perk{width:220px;display:flex;flex-direction:column;gap:8px}
.pico{font-size:30px;color:var(--gold)}.pname{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.06em}
.pdesc{font-size:12px;color:#ccc;line-height:1.5;flex:1}
.plvl{display:flex;gap:4px}.plvl b,.plvl em{width:22px;height:6px;border-radius:3px;background:var(--gold)}.plvl em{background:rgba(255,255,255,.1)}
.pcost{font-weight:800;color:var(--gold)}
.perk.maxed{border-color:rgba(255,211,107,.4)}.perk.poor .pcost{color:var(--dim)}
.mcard{width:236px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;border-color:color-mix(in srgb,var(--r) 30%,transparent)}
.mcard:hover,.mcard.focus{border-color:var(--r);box-shadow:0 0 30px color-mix(in srgb,var(--r) 35%,transparent),0 10px 30px rgba(0,0,0,.5)}
.rar{font-size:10px;font-weight:800;letter-spacing:.35em}
.mbig{width:70px;height:70px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:40px;color:var(--r);background:radial-gradient(circle,color-mix(in srgb,var(--r) 18%,transparent),transparent 70%);border:1px solid color-mix(in srgb,var(--r) 40%,transparent)}
.mname{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.05em}
.mdesc{font-size:12px;line-height:1.55;color:#ddd;min-height:56px}
.mcard .key{position:absolute;top:10px;left:12px;font-size:10px;font-weight:800;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.mcard .owned{font-size:10px;color:var(--dim);letter-spacing:.1em}
.price{font-weight:800;color:#ffb070;font-size:14px}.price.cost{color:#ff7aa8}
.mcard.poor{opacity:.55}.mcard.sold{opacity:.3}
.mcard.malig{background:linear-gradient(180deg,rgba(60,10,80,.6),var(--panel))}
.tabs{display:flex;gap:10px;margin-bottom:18px}
.codex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;width:min(1100px,100%)}
.centry{display:flex;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:12px;line-height:1.45}
.centry b{font-family:var(--display);font-size:12px;letter-spacing:.06em;display:block}.centry .dim{font-size:10px}.centry p{color:#ccc;margin-top:4px}
.centry.unknown{opacity:.45}
.cdot{flex:0 0 34px;height:34px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#fff4,var(--c,#444) 55%,#0000 75%);box-shadow:0 0 14px var(--c,transparent)}
.mico{flex:0 0 34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--r,#888);border:1px solid color-mix(in srgb,var(--r,#888) 40%,transparent)}
.brief{max-width:620px;margin:auto 0 0;text-align:left;font-size:15px;line-height:1.75;color:#e6dce4;animation:pop .6s ease}
.brief h2{font-family:var(--display);font-weight:900;font-size:clamp(26px,4.4vw,44px);margin:10px 0 16px;text-shadow:0 0 24px rgba(255,77,138,.45)}
.brief p{margin-bottom:14px}.brief .b-num{text-align:left}.hot{color:var(--hot)}.accent{color:var(--accent)}
.s-briefing{justify-content:center}
.howto{display:flex;gap:30px;flex-wrap:wrap;max-width:980px;font-size:13px;line-height:1.65}
.hcol{flex:1 1 380px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px 24px}
.hcol h3{font-family:var(--display);font-size:14px;letter-spacing:.1em;margin:14px 0 6px;color:var(--accent)}.hcol h3:first-child{margin-top:0}
.ctl{width:100%;border-collapse:collapse;font-size:12px}.ctl td,.ctl th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}.ctl th{color:var(--dim)}
.opts{display:flex;flex-direction:column;gap:12px;width:min(640px,100%)}
.orow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.orow label{flex:0 0 150px;font-size:12px;color:#ddd}
.orow input[type=range]{flex:1;accent-color:var(--accent);min-width:140px}
.orow input[type=range].focus{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}
.oval{width:44px;text-align:right;font-size:12px;color:var(--dim)}
.ochoices{display:flex;gap:8px;flex-wrap:wrap}
.pcols{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;width:100%}
.pcols .menu{min-width:220px}
.build{flex:1 1 420px;max-width:600px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;max-height:60vh}
.bstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bstats div{background:rgba(255,255,255,.04);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.bstats span{font-size:10px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}.bstats b{font-family:var(--display);font-size:15px}
.blist{overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px}
.bitem{display:flex;gap:10px;font-size:12px;line-height:1.45}.bitem b{font-family:var(--display);font-size:11px;letter-spacing:.06em}.bitem p{color:#ccc}
.sumgrid{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:10px;width:min(760px,100%)}
.sstat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px}
.sstat span{font-size:10px;color:var(--dim);letter-spacing:.15em;text-transform:uppercase}.sstat b{font-family:var(--display);font-size:15px}
.memgain{margin-top:20px;font-size:18px;color:var(--gold)}.memgain b{font-family:var(--display);font-size:26px}
.unlocks{margin-top:14px;display:flex;flex-direction:column;gap:6px;align-items:center;color:var(--accent);font-size:14px}
.sum-muts{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:16px;max-width:700px}
@media (max-height:520px){
  .s-title{justify-content:flex-start}
  .title-wrap{gap:12px}
  .logo-main{font-size:clamp(40px,8vw,64px)}
  .logo-sub{font-size:18px}.logo-tag{margin-top:4px;font-size:10px}
  .menu{gap:6px}.btn{padding:8px 14px;font-size:12px}.btn.big{padding:10px 18px;font-size:14px}
  .hdr{margin-bottom:10px}.hdr h2{font-size:22px}.hdr p{font-size:11px}
  .pip{width:16px;height:16px}#hp{gap:3px}
  #abil{width:44px;height:44px}#abil-in{font-size:20px}
  #minimap{width:110px;height:80px}
  #region b{font-size:11px}
  .mcard,.strain{padding:12px}.mdesc,.sdesc{min-height:0}
  .tbtn{width:54px;height:54px;font-size:22px}
  .tbtn[data-t=pause]{right:calc(146px + env(safe-area-inset-right))}
}
@media (max-width:760px){
  .sumgrid{grid-template-columns:repeat(2,1fr)}
  .strain{width:min(100%,340px)}.mcard{width:min(100%,320px)}
  #minimap{width:110px;height:80px}
  .title-wrap{margin-left:0}
  .s-title{background:linear-gradient(180deg,rgba(7,4,10,.4),rgba(7,4,10,.9))}
  #mutlist{max-width:60vw}
}
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<canvas id="overlay"></canvas>
<div id="hurt"></div>
<div id="lowhp"></div>

<div id="hud">
  <div class="hud-tl">
    <div id="hp"></div>
    <div class="hud-row">
      <div id="abil"><div id="abil-in"><span id="abil-ico"></span></div><span id="abil-key">Q</span></div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <div id="abil-name"></div>
        <div id="ironbox"><span class="ms">diamond</span><b id="iron">0</b></div>
        <div id="dash"></div>
      </div>
    </div>
  </div>
  <div id="region"></div>
  <div id="mmwrap"><canvas id="minimap" width="300" height="220"></canvas></div>
  <div id="mutlist" class="ui-interactive"></div>
  <div id="bossbar"><div id="boss-name"></div><div class="btrack"><div id="boss-lag"></div><div id="boss-fill"></div><div id="boss-marks"></div></div></div>
  <div id="toasts"></div>
  <div id="charge"></div>
  <div id="prompt"></div>
</div>
<div id="tip"></div>
<div id="banner" class="banner"></div>

<div id="touch">
  <div class="stick" id="stick-l"><div></div></div>
  <div class="stick" id="stick-r"><div></div></div>
  <div class="tbtn ui-interactive" data-t="dash"><span class="ms">air</span></div>
  <div class="tbtn ui-interactive" data-t="ability"><span class="ms">bolt</span></div>
  <div class="tbtn ui-interactive" data-t="interact"><span class="ms">help</span></div>
  <div class="tbtn ui-interactive" data-t="pause"><span class="ms">settings</span></div>
</div>

<div id="screen" class="screen"></div>
<div id="modal" class="modal"></div>
<div id="fade"></div>
<div id="loading"><div class="cell"></div><div class="txt">CULTURING…</div></div>
