<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Audio preview</title>
<link rel="icon" href="data:," />
<style>
  :root { --bg: #1d2026; --panel: #262a32; --line: #363b45; --text: #e6e8ec; --dim: #9aa1ad; --accent: #7fb6ff; --warn: #ffb347; --bad: #ff6b6b; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 18px 0 8px; }
  h3 { font-size: 12px; color: var(--dim); margin: 10px 0 6px; font-weight: 600; }
  .bar { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 10px 0; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; }
  .stat { font: 12px/1.3 ui-monospace, monospace; color: var(--dim); }
  .stat b { color: var(--text); font-weight: 600; }
  .meter { display: grid; grid-template-columns: repeat(48, 1fr); gap: 1px; width: 100%; max-width: 480px; height: 10px; }
  .meter i { background: var(--line); border-radius: 1px; }
  .meter i.on { background: var(--accent); }
  .meter i.loop { background: var(--warn); }
  label { display: inline-flex; gap: 6px; align-items: center; color: var(--dim); }
  input[type=range] { width: 110px; }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:active { background: #30353f; }
  button.seq { padding: 7px 11px; }
  .grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .sounds button { font: 11px ui-monospace, monospace; padding: 4px 7px; }
  #log { font: 11px/1.4 ui-monospace, monospace; color: var(--dim); white-space: pre-wrap; max-height: 180px; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin-top: 8px; }
  .bad { color: var(--bad); }
  @media (max-width: 640px) { main { padding: 12px 16px; } }
</style>
</head>
<body>
<main>
  <h1>Audio preview</h1>
  <div class="stat" id="status">loading…</div>
  <div class="bar">
    <button id="unlock">Unlock audio</button>
    <label>master <input id="master" type="range" min="0" max="1" step="0.01" value="1" /></label>
    <label>sfx <input id="sfx" type="range" min="0" max="1" step="0.01" value="1" /></label>
    <label><input id="amb" type="checkbox" /> ambience</label>
    <label><input id="pause" type="checkbox" /> paused (menu)</label>
    <label>pan x <input id="panx" type="range" min="-22" max="22" step="0.5" value="0" /> <span id="panxv" class="stat">0</span></label>
    <div style="flex:1 1 300px">
      <div class="stat" id="voices">voices 0</div>
      <div class="meter" id="meter"></div>
    </div>
  </div>
  <h2>Event sequences</h2>
  <div class="grid" id="seqs"></div>
  <div id="log"></div>
  <h2>All sounds</h2>
  <div class="sounds" id="sounds"></div>
</main>
<script type="module" src="/src/preview/audio.ts"></script>
</body>
</html>
